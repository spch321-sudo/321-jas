en）、ἐμπορευσόμεθα（emporeusometha）、κερδήσομεν（kerdēsomen），四個將來式直說語氣，主詞全是「我們」；時間（Σήμερον ἢ αὔριον（Sēmeron ē aurion））、地點（τήνδε τὴν πόλιν（tēnde tēn polin））、期限（ἐνιαυτὸν（eniauton））、目標都排好了。</p><p>4:14 的 ἀτμὶς（atmis） 是蒸氣、霧氣；使徒行傳引約珥書的「煙霧」是 ἀτμίδα（atmida）。ἡ πρὸς ὀλίγον φαινομένη ἔπειτα καὶ ἀφανιζομένη（hē pros oligon phainomenē epeita kai aphanizomenē）：φαινομένη（phainomenē） 與 ἀφανιζομένη（aphanizomenē） 是一對同字根的分詞，「顯出來」與「看不見了」，聲音也對仗。這使我們想起「不要為明日自誇」（箴 27:1）。</p><blockquote><p>4:15 ἀντὶ τοῦ λέγειν ὑμᾶς（anti tou legein hymas）：「代替你們說的」，句法直接接回 4:13 的 οἱ λέγοντες（hoi legontes）——不是不說，是換一種說法。Ἐὰν ὁ κύριος θελήσῃ（Ean ho kyrios thelēsē） 是假設語氣，後面 καὶ ζήσομεν καὶ ποιήσομεν（kai zēsomen kai poiēsomen） 兩個將來式照舊：活著和做事都還在，只是放在主的旨意之下。保羅也這樣說：「神若許我，我還要回到你們這裡」（徒 18:21）。</p></blockquote>","exp":"<p>「今天明天我們要往某城裡去，在那裡住一年，做買賣得利。」（4:13）這句話沒有一個字是罪。散住的猶太商人跑城做生意，是那時代的日常；規劃、經商、賺錢，雅各一個字也沒有禁止。錯在主詞：從頭到尾都是「我們」。神不在這個行事曆上。</p><p>雅各的回答先是一個事實：「其實明天如何，你們還不知道。你們的生命是甚麼呢？你們原來是一片雲霧，出現少時就不見了。」（4:14）像冬天早晨呼出的一口白氣，看得見，卻抓不住。這句話要人謙卑，不是說生命沒有價值；它一定要接下一節讀。</p><p>「你們只當說：主若願意，我們就可以活著，也可以做這事，或做那事。」（4:15）雲霧般的生命不是被丟在風裡，它在主的手裡。「主若願意」不是宿命論，也不是叫人不要做計畫；計畫照做，城照去，生意照談，只是主詞換了。保羅一再這樣寫信，把行程放在主的許可之下。</p><p>321 說「讓耶穌作王」，最具體的樣子就在這裡：讓「主若願意」出現在行事曆上。不是在每一句話後面加一句口頭禪，是在排定明天之前，先承認明天不是我的。若有人聽到「一片雲霧」就覺得活著沒有意義，這不是這段經文的意思；這樣的人需要的是陪伴，必要時協助他找到專業與危機協助——他的生命，正是主所願意的。</p>"},{"a":16,"z":17,"star":1,"grk":"<p lang=\"grc\">νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.</p><p lang=\"grc\">εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.</p>","lit":"<p>但現在你們在你們的狂妄中誇口；一切這樣的誇口都是惡的。</p><p>所以，對於那知道做善事卻不去做的人，這對他就是罪。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀλαζονείαις</td><td>alazoneiais</td><td>狂妄、張狂</td><td>說大話的自負</td></tr><tr><td>καύχησις</td><td>kauchēsis</td><td>誇口</td><td>1:9 合法的誇口</td></tr><tr><td>πονηρά</td><td>ponēra</td><td>惡的</td><td>不只是不妥，是惡</td></tr><tr><td>εἰδότι</td><td>eidoti</td><td>對那知道的人</td><td>知道就有責任</td></tr><tr><td>καλὸν ποιεῖν</td><td>kalon poiein</td><td>做善事</td><td>1:22 行道的回聲</td></tr></table>","gram":"<p><strong>4:16 用 νῦν δὲ（nyn de） 把 4:15 的「應當」和現實對照：可是現在。</strong>καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν（kauchasthe en tais alazoneiais hymōn）：ἀλαζονεία（alazoneia） 新約只出現兩次，另一次是約翰說的 ἡ ἀλαζονεία τοῦ βίου（hē alazoneia tou biou），「今生的驕傲」，原指誇大自己能耐的江湖口吻。雅各不反對一切誇口：1:9 Καυχάσθω（Kauchasthō） 卑微的弟兄要誇神的翻轉；他說的是 πᾶσα καύχησις τοιαύτη（pasa kauchēsis toiautē），「這樣的誇口」，才是 πονηρά（ponēra）。</p><p>4:17 由 οὖν（oun） 收束，句型像一條箴言：εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι（eidoti oun kalon poiein kai mē poiounti），兩個與格分詞指向同一個人——知道，卻不做；ἁμαρτία αὐτῷ ἐστιν（hamartia autō estin），「這對他就是罪」。這是新約對「不作為的罪」最清楚的一句。</p>","exp":"<p>「現今你們竟以張狂誇口；凡這樣誇口都是惡的。」（4:16）把明天說得像已經握在手裡，這是一種不出聲的誇口。它不一定說大話，只是在每一個計畫裡都忘了神。雅各稱它為「惡的」，因為它和 4:12 坐上審判官椅子的人是同一種心：都想代替神作主。</p><p>然後是全章最後一句：「人若知道行善，卻不去行，這就是他的罪了。」（4:17）它像一句單獨的格言，卻把整封信收了回來。1:22 說要行道，不要單單聽道；2:15--16 說看見弟兄赤身露體，只說一句「平平安安地去吧」。雅各一路照的都是同一件事：知道與行出來之間的那段距離。</p><p>罪不只是做了不該做的，也是沒做該做的。看見了，知道了，有能力，卻走過去——這也在鏡子裡。這句話不是要叫人焦慮地數算每一件沒做的好事；它放在「主若願意」的後面：一個讓主作王的行事曆，自然會留出位子給那件神放在眼前的善事。</p>"}],"5":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.</p>","lit":"<p>來吧，現在，那些富足的人，你們要哭，哀號，為著你們那將要臨到的苦難。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἄγε νῦν</td><td>Age nyn</td><td>來吧，現在</td><td>與 4:13 同一個開頭</td></tr><tr><td>οἱ πλούσιοι</td><td>hoi plousioi</td><td>那些富足的人</td><td>1:10；2:6 富足人追蹤</td></tr><tr><td>κλαύσατε</td><td>klausate</td><td>你們要哭</td><td>不定過去命令；4:9 同字</td></tr><tr><td>ὀλολύζοντες</td><td>ololyzontes</td><td>哀號、號咷</td><td>新約僅此一次；先知的哀歌</td></tr><tr><td>ταλαιπωρίαις</td><td>talaipōriais</td><td>苦難、困苦</td><td>與 4:9 ταλαιπωρήσατε 同根</td></tr></table>","gram":"<p><strong>5:1 的 Ἄγε νῦν（Age nyn） 和 4:13 一模一樣。</strong>4:13 叫的是做買賣的人：「今天明天我們要往某城裡去」（4:13）；5:1 叫的是已經賺到的人。兩段用同一個「嗐」接起來，4:13--5:6 成為一組：先是計畫裡沒有主，再是財富裡沒有人。</p><p>κλαύσατε（klausate） 是不定過去命令，ὀλολύζοντες（ololyzontes） 是現在分詞，「一面哀號，一面哭」。ὀλολύζοντες（ololyzontes） 新約只有這一次，七十士譯本的先知書常用它描寫審判日的哀號。雅各換了文體：前面是智慧的勸勉，這裡是先知的宣告。</p><blockquote><p>4:9 雅各對「心懷二意的人」說 ταλαιπωρήσατε（talaipōrēsate）……κλαύσατε（klausate），那是悔改的哭，哭完了有 4:10 的「升高」；5:1 的 ταλαιπωρίαις（talaipōriais） 是將要臨到的困苦，哭的理由是審判。同一組字，一邊是邀請，一邊是警告。</p></blockquote>","exp":"<p>「嗐！你們這些富足人哪，應當哭泣、號咷，因為將有苦難臨到你們身上。」（5:1）這一節沒有「弟兄們」。全卷雅各叫了十五次「弟兄們」（其中十一次是「我的弟兄們」），到這裡忽然不叫了，到 5:7 才又叫回來。像先知站在城門口，對著城外的人說話，卻故意讓城裡的人聽見。</p><p>這群富足人是誰？2:6 已經說過：「那富足人豈不是欺壓你們、拉你們到公堂去嗎？」（2:6）他們多半不在會中，是散住的信徒每天要面對的地主與商人。雅各寫給窮弟兄，卻讓他們聽見神對欺壓者說的話：你們的苦，神不是沒看見。</p><p>但讀這段經文最容易犯的錯，是一聽見「富足人」就看向別人。雅各在 2:4 先照過教會自己：「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）這段話不是仇富的口號；它點名的不是「有錢」，是 5:2--6 要列出的積攢、欠薪、奢華、定人的罪。主耶穌也說過：「但你們富足的人有禍了！」（路 6:24）同一位主也接待撒該、約瑟這些有錢的門徒。財富本身不是罪，但它有方向：流向需要的人，或是堆起來發銹。</p><p>這一節也是一種憐憫。神先警告，才審判；「應當哭泣」是門還開著的時候說的話。能哭的人還有轉回的路，4:9--10 那條路還在。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">ὁ πλοῦτος ὑμῶν σέσηπεν, καὶ τὰ ἱμάτια ὑμῶν σητόβρωτα γέγονεν,</p><p lang=\"grc\">ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.</p>","lit":"<p>你們的財富已經朽壞了，你們的衣服已經成了被蟲咬的，</p><p>你們的金子和銀子已經生銹了，它們的銹要成為對你們的見證，並且要吃你們的肉；如同火一般，你們在末後的日子積攢了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σέσηπεν</td><td>sesēpen</td><td>已經朽壞了</td><td>完成式：先知把將來說成已成</td></tr><tr><td>σητόβρωτα γέγονεν</td><td>sētobrōta gegonen</td><td>成了被蟲咬的</td><td>σητόβρωτα 新約僅此一次</td></tr><tr><td>κατίωται</td><td>katiōtai</td><td>已經生銹</td><td>金銀本不生銹：誇張的先知語</td></tr><tr><td>ὁ ἰὸς αὐτῶν</td><td>ho ios autōn</td><td>它們的銹</td><td>與 3:8 ἰοῦ「毒氣」同一個字</td></tr><tr><td>εἰς μαρτύριον ὑμῖν</td><td>eis martyrion hymin</td><td>成為對你們的見證</td><td>法庭用語</td></tr><tr><td>ἐθησαυρίσατε</td><td>ethēsaurisate</td><td>你們積攢了</td><td>太 6:19 同一個動詞</td></tr></table>","gram":"<p><strong>5:2--3 三個完成式排成一列。</strong>σέσηπεν（sesēpen）、σητόβρωτα γέγονεν（sētobrōta gegonen）、κατίωται（katiōtai）：財富朽了、衣服蛀了、金銀銹了。審判還沒到，先知卻用完成式，好像已經站在審判之後回頭看。三樣東西正是古代財富的三種形式：糧食與貨物、衣服、金銀。</p><p>金銀其實不會生銹。雅各故意這樣說：連你以為最不會壞的，在神眼中也已經壞了。最尖的一筆是 ὁ ἰὸς αὐτῶν（ho ios autōn）：ἰός（ios） 在 3:8 是舌頭「滿了害死人的毒氣」（3:8）的那個「毒」。同一個字，在舌頭是毒，在錢財是銹。</p><blockquote><p>ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις（ethēsaurisate en eschatais hēmerais）：「在末後的日子積攢」。ὡς πῦρ（hōs pyr） 可以往前讀（銹吃你們的肉如同火燒，和合本）或往後讀（如同火一般，你們積攢了）；SBLGNT 的標點接後面，和合本接前面，意思相同：積攢的東西最後會燒到自己。</p></blockquote>","exp":"<p>〔太〕太 6:19--21（馬太講義第 6 章）</p><p>「你們的金銀都長了銹；那銹要證明你們的不是，又要吃你們的肉，如同火燒。」（5:3）這幾乎是主耶穌那句話的回聲：「不要為自己積攢財寶在地上；地上有蟲子咬，能銹壞」（太 6:19）。雅各沒有說「主說過」，他把哥哥的話換成自己的話，又往前推一步：銹不只會吃掉財寶，還會吃掉積攢的人。</p><p>銹是一種很安靜的審判。它不需要賊，不需要火，只需要時間和不流動。一堆沒有用出去的金銀，放久了就成了證人，在法庭上指出主人的心：有人在挨餓的時候，這些東西在箱子裡。</p><p>ἰός（ios） 把第 3 章和第 5 章接在一起。舌頭的毒和錢財的銹是同一種東西：都是本來從神來的好恩賜，沒有照著神的方向流出去，就在裡面發壞。「在這末世只知積攢錢財」（5:3）不是在說存錢有罪，是在說時間：末後的日子已經開始，這是給的時候，不是囤的時候。</p><p>這一段先照的仍是我們自己。不必等到很富有才會積攢；一個人捨不得分給弟兄的那一點，就是他的銹開始的地方。反過來，一份及時送到弟兄手裡的錢，不會生銹；它變成了別人桌上的飯，變成了 2:16 那隻無己的手。</p>"},{"a":4,"z":4,"star":3,"grk":"<p lang=\"grc\">ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ἀφυστερημένος ἀφʼ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ εἰσεληλύθασιν</p>","lit":"<p>看哪，那收割了你們田地的工人的工價，就是被你們扣住拖欠的，正在呼叫；並且那些收割之人的喊聲，已經進入萬軍之主的耳中了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ μισθὸς τῶν ἐργατῶν</td><td>ho misthos tōn ergatōn</td><td>工人的工價</td><td>主詞是工錢</td></tr><tr><td>ὁ ἀφυστερημένος ἀφʼ ὑμῶν</td><td>ho aphysterēmenos aph' hymōn</td><td>被你們扣住拖欠的</td><td>完成被動分詞；SBLGNT 異文</td></tr><tr><td>κράζει</td><td>krazei</td><td>呼叫</td><td>現在式：一直在喊</td></tr><tr><td>αἱ βοαὶ τῶν θερισάντων</td><td>hai boai tōn therisantōn</td><td>收割之人的喊聲</td><td>βοή 新約僅此一次</td></tr><tr><td>εἰς τὰ ὦτα Κυρίου Σαβαὼθ</td><td>eis ta ōta Kyriou Sabaōth</td><td>進入萬軍之主的耳</td><td>賽 5:9 的稱號</td></tr><tr><td>εἰσεληλύθασιν</td><td>eiselēlythasin</td><td>已經進入了</td><td>完成式：已經聽見了</td></tr></table>","gram":"<p><strong>5:4 的主詞是工錢。</strong>ὁ μισθὸς（ho misthos）……κράζει（krazei）：不是工人在呼叫，是工錢在呼叫。被扣住的錢自己有了聲音。這使我們想起創 4:10：「你兄弟的血有聲音從地裡向我哀告。」（創 4:10）</p><p>ὁ ἀφυστερημένος ἀφʼ ὑμῶν（ho aphysterēmenos aph' hymōn） 是完成被動分詞：「被你們扣住、拖欠的」。這是 SBLGNT 的讀法（未標號字）；NA28 與 RP 作 ἀπεστερημένος（apesterēmenos），「被你們奪去的」。一個是遲遲不給，一個是乾脆不給，和合本「虧欠」兩樣都包在裡面。雅各點名的罪不是「有錢」，是拖欠。</p><blockquote><p>Κυρίου Σαβαὼθ（Kyriou Sabaōth） 是希伯來文「萬軍之耶和華」的音譯，新約只有這裡和羅 9:29。這使我們想起賽 5:9：「我耳聞萬軍之耶和華說」（賽 5:9），那是先知為被兼併田地的窮人發出的禍哉。εἰσεληλύθασιν（eiselēlythasin） 是完成式：喊聲不是將要被聽見，是已經進去了。</p></blockquote>","exp":"<p>〔舊約〕利 19:13（利未記講義第 19 章）</p><p>〔舊約〕申 24:14--15（申命記講義第 24 章）</p><p>「工人給你們收割莊稼，你們虧欠他們的工錢，這工錢有聲音呼叫，並且那收割之人的冤聲已經入了萬軍之主的耳了。」（5:4）摩西的律法早就寫過：「雇工人的工價，不可在你那裡過夜，留到早晨。」（利 19:13）又說：「要當日給他工價，不可等到日落」（申 24:15），因為「他窮苦，把心放在工價上」（申 24:15）。本系列利未記講義第 19 章、申命記講義第 24 章都講過：當日的工價就是那一家當晚的飯。雅各書多出來的一筆，是那個稱號：聽見的是「萬軍之主」。工人沒有律師、沒有工會、沒有聲音；天上的萬軍之主替他們聽。</p><p>這一節最直接落在今天的職場：拖欠薪資、壓低外籍移工的工錢、扣押證件、把加班當成本分。雅各沒有給這些事留任何屬靈的出口。「要順服老闆」這句話不能拿來勸人忍受違法的欠薪；把欠薪說成是一種奉獻，更是錯的。</p><p>這一節也照到教會自己。教會也是雇主：傳道同工、清潔、保全、外包的工人，都在 5:4 之下。基督徒老闆讀這一節，不是被定罪，是被提醒：你發出去的每一份薪水，萬軍之主都看得見；準時、足額、有尊嚴地給，就是在職場上敬拜。反過來，一位被欠薪的弟兄來到教會，他需要的不是一句「要忍耐」，而是有人陪他去討回公道；5:7 的忍耐是寫給已經被聽見的人。</p><p>321 說「人比事重要、關係比東西重要」。5:4 是這句話最硬的版本：錢可以晚一點賺，人不可以被晚一點付。</p>"},{"a":5,"z":6,"star":2,"grk":"<p lang=\"grc\">ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ὑμῶν ἐν ἡμέρᾳ σφαγῆς.</p><p lang=\"grc\">κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;</p>","lit":"<p>你們在地上奢華度日，又放縱享樂，你們在宰殺的日子養肥了你們的心。</p><p>你們定了罪，你們殺害了那義人。他不抵擋你們嗎？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐτρυφήσατε</td><td>etryphēsate</td><td>奢華度日</td><td>τρυφή 柔軟享樂</td></tr><tr><td>ἐσπαταλήσατε</td><td>espatalēsate</td><td>放縱享樂</td><td>提前 5:6 同字</td></tr><tr><td>ἐθρέψατε τὰς καρδίας ὑμῶν</td><td>ethrepsate tas kardias hymōn</td><td>養肥了你們的心</td><td>對比 5:8 堅固你們的心</td></tr><tr><td>ἐν ἡμέρᾳ σφαγῆς</td><td>en hēmera sphagēs</td><td>在宰殺的日子</td><td>全卷第二低點</td></tr><tr><td>τὸν δίκαιον</td><td>ton dikaion</td><td>那義人</td><td>單數，有冠詞</td></tr><tr><td>οὐκ ἀντιτάσσεται ὑμῖν;</td><td>ouk antitassetai hymin?</td><td>他不抵擋你們嗎？</td><td>與 4:6 同一個動詞</td></tr></table>","gram":"<p><strong>5:5 三個不定過去式，像在宣讀判決書。</strong>ἐτρυφήσατε（etryphēsate）、ἐσπαταλήσατε（espatalēsate）、ἐθρέψατε τὰς καρδίας ὑμῶν（ethrepsate tas kardias hymōn）。最後一句最刺：「養肥你們的心」，像農夫在宰殺之前把牲口餵肥。ἐν ἡμέρᾳ σφαγῆς（en hēmera sphagēs） 可以指審判的日子（耶 12:3 的語言），也可以照字面：別人正被宰殺的日子，你們在宴樂。兩個意思都在。</p><p>5:6 SBLGNT 的標點是 κατεδικάσατε（katedikasate）, ἐφονεύσατε τὸν δίκαιον（ephoneusate ton dikaion）. οὐκ ἀντιτάσσεται ὑμῖν（ouk antitassetai hymin）; 最後一句是問句：「他不抵擋你們嗎？」和合本照陳述句譯「他也不抵擋你們」。關鍵是 ἀντιτάσσεται（antitassetai），正是 4:6「神阻擋驕傲的人」的那個字。讀作陳述句：義人無力反抗；讀作問句：那位在 4:6「阻擋驕傲的人」的神，難道不抵擋你們嗎？</p><blockquote><p>「義人」是誰，三種讀法：①一般的受欺壓的義人，被法庭與財富吞掉的窮人（多數）；②耶穌，這使我們想起徒 3:14「你們棄絕了那聖潔公義者」（徒 3:14）；③雅各自己，後來被稱為「公義者雅各」，約主後 62 年殉道（這要假定本書寫成於他死後，少數）。本講義取第一讀為主，第二讀作為回聲：受欺壓的義人身上，看得見那一位不開口的義人。</p></blockquote>","exp":"<p>「你們在世上享美福，好宴樂，當宰殺的日子竟嬌養你們的心。」（5:5）這是全卷地勢的第二個低谷。不是因為這裡有甚麼刀光血影，而是因為那份安逸：外面有人在哭，裡面的人在把自己養胖。</p><p>5:5 和 5:8 正好相對。富足人「嬌養你們的心」，雅各對弟兄們說「堅固你們的心」（5:8）。一顆被餵肥的心和一顆被堅固的心，差別不在吃得多少，在養它的是甚麼：一個靠宴樂，一個靠等候主。</p><p>「你們定了義人的罪，把他殺害，他也不抵擋你們。」（5:6）殺害不一定是動刀。2:6 說富足人「拉你們到公堂去」（2:6），用法庭把窮人的田地、工錢、生計一點一點拿走，在雅各眼中就是殺人。這和主耶穌在登山寶訓的眼光一樣：恨人、羞辱人的心，已經是殺人的根。</p><p>SBLGNT 把最後一句標成問句，這給整段一個轉折：義人看起來沒有反抗，但神會。4:6 說「神阻擋驕傲的人」（4:6），5:6 用同一個字收尾。受欺壓的人不必自己去報復，因為有一位在抵擋。這使我們想起那位被欺壓卻不開口的主，他沒有抵擋，神卻叫他復活。</p><p>這一節也是給下一段的伏筆。被欺壓的弟兄聽完這些，會問：那我們現在怎麼辦？5:7 的答案是兩個字：所以，忍耐。</p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπʼ αὐτῷ ἕως λάβῃ πρόϊμον καὶ ὄψιμον.</p>","lit":"<p>所以，弟兄們，你們要恆久忍耐，直到主的來臨。看哪，那農夫等候地裡寶貴的果實，為它恆久忍耐，直到它得著早的和晚的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μακροθυμήσατε οὖν</td><td>Makrothymēsate oun</td><td>所以你們要恆久忍耐</td><td>μακροθυμέω：心長、慢發怒</td></tr><tr><td>ἕως τῆς παρουσίας τοῦ κυρίου</td><td>heōs tēs parousias tou kyriou</td><td>直到主的來臨</td><td>忍耐有終點</td></tr><tr><td>ὁ γεωργὸς ἐκδέχεται</td><td>ho geōrgos ekdechetai</td><td>農夫等候</td><td>現在式：天天在等</td></tr><tr><td>τὸν τίμιον καρπὸν τῆς γῆς</td><td>ton timion karpon tēs gēs</td><td>地裡寶貴的果實</td><td>5:18 地生出果實</td></tr><tr><td>πρόϊμον καὶ ὄψιμον</td><td>proimon kai opsimon</td><td>早的和晚的</td><td>原文沒有「雨」字</td></tr></table>","gram":"<p><strong>5:7 用 οὖν（oun） 把 5:1--6 接過來。</strong>剛聽完富足人的審判，被欺壓的弟兄得到的命令是 Μακροθυμήσατε（Makrothymēsate）。雅各這一段用兩組字：μακροθυμέω（5:7 兩次、5:8、5:10 μακροθυμίας（makrothymias））與 ὑπομονή（5:11 ὑπομείναντας（hypomeinantas）、ὑπομονὴν（hypomonēn））。兩字分工：μακροθυμέω（makrothymeō） 字面是「心長」，對人不急著發怒、對時間不急著收割；ὑπομονή（hypomonē） 是「留在底下」，在壓力下站得住。1:3--4 的 ὑπομονή（hypomonē） 是試煉的忍受，5:7 先講心長。</p><p>πρόϊμον καὶ ὄψιμον（proimon kai opsimon） 原文只有「早的和晚的」，沒有「雨」字（有些抄本補上 ὑετόν（hyeton））。巴勒斯坦十至十一月的雨讓種子能下地，三至四月的雨讓穀粒飽滿。和合本「秋雨春雨」是照氣候的意譯，用的是申 11:14 的語言。</p><blockquote><p>ἐκδέχεται（ekdechetai） 是現在式，μακροθυμῶν ἐπʼ αὐτῷ（makrothymōn ep' autō） 是現在分詞：農夫天天在等，等的時候心是長的。等候本身就是工作。</p></blockquote>","exp":"<p>「弟兄們哪，你們要忍耐，直到主來。看哪，農夫忍耐等候地裡寶貴的出產，直到得了秋雨春雨。」（5:7）「弟兄們」回來了。前面對富足人的宣告是先知的聲音，這裡又是家人的聲音。</p><p>雅各的比喻很簡單：農夫不能催雨。他已經犁了地、撒了種，接下來能做的就是等。但這種等不是躺著等；他每天去看田、除草、修水溝。被欠薪的工人多半就是農人，雅各用他們最熟悉的生活跟他們說話：你們懂得等莊稼，也就懂得等主。</p><p>神應許過：「他必按時降秋雨春雨在你們的地上」（申 11:14）。雅各借用這句話，意思是神是守時的，只是時間在他手裡。「秋雨春雨」在這裡是農夫的日曆，不是末世的時間表；把它講成末後聖靈澆灌的兩個階段，是雅各沒有做的事。</p><p>「寶貴的出產」τὸν τίμιον καρπὸν（ton timion karpon） 是這一節的盼望。等候之所以值得，是因為等的東西寶貴。5:18 以利亞禱告之後，「地也生出土產」（5:18），用的就是同一個 καρπὸν（karpon）。全卷最後一個從上頭來的，是雨。</p><p>這一節的忍耐也不是消極。被欺壓的人聽見 5:1--6，最自然的反應是要自己出手；雅各叫他們像農夫一樣，把審判交給主，把今天的田照顧好。忍耐不是認輸，是相信收成的日子在主手裡。</p>"},{"a":8,"z":9,"star":1,"grk":"<p lang=\"grc\">μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.</p><p lang=\"grc\">μὴ στενάζετε, ἀδελφοί, κατʼ ἀλλήλων, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.</p>","lit":"<p>你們也要恆久忍耐，堅固你們的心，因為主的來臨已經近了。</p><p>弟兄們，不要彼此嘆息埋怨，免得你們被審判；看哪，那審判者已經站在門前了。</p>","key":"","gram":"<p><strong>5:8 的 ἤγγικεν（ēngiken） 是完成式，「已經近了」。</strong>主耶穌傳道開始時說的「天國近了」，也是這個字。新約作者一致把主的來臨說成「近」，這「近」不是日曆上的距離，是性質上的緊迫：下一件大事就是主來。</p><p>στηρίξατε τὰς καρδίας ὑμῶν（stērixate tas kardias hymōn） 與 5:5 ἐθρέψατε τὰς καρδίας ὑμῶν（ethrepsate tas kardias hymōn） 對照：一個堅固心，一個養肥心。5:9 μὴ στενάζετε（mē stenazete）……κατʼ ἀλλήλων（kat' allēlōn），στενάζω（stenazō） 是嘆氣、低聲埋怨；ἵνα μὴ κριθῆτε（hina mē krithēte） 接回 4:11--12 的論斷；ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν（ho kritēs pro tōn thyrōn hestēken），ἕστηκεν（hestēken） 完成式：已經站在門口。這使我們想起太 24:33「人子近了，正在門口了」（太 24:33）。</p>","exp":"<p>「你們也當忍耐，堅固你們的心，因為主來的日子近了。」（5:8）兩千年過去了，還算近嗎？雅各給「近」的用法，不是叫人去算日子，是叫人今天就忍耐、今天就不埋怨。像一個孩子知道父親已經在回家的路上，他不會去算還有幾公里，他會把房間收好。</p><p>「弟兄們，你們不要彼此埋怨，免得受審判。看哪，審判的主站在門前了。」（5:9）這一節的轉折很真實：外面的壓力大了，弟兄之間最容易互相嘆氣。被欺壓的人沒有辦法對地主出氣，就轉過來對身邊的人抱怨。雅各說：這也是一種論斷。4:12 說「設立律法和判斷人的，只有一位」（4:12），那一位現在就站在門口。</p><p>審判者在門前，對被欺壓的人是安慰，對埋怨弟兄的人是警醒。同一扇門，主進來時要為受苦的人伸冤，也要看見屋裡的人怎樣彼此相待。堅固的心，是不讓等候變成苦毒的心。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">ὑπόδειγμα λάβετε, ἀδελφοί τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ἐν τῷ ὀνόματι κυρίου.</p><p lang=\"grc\">ἰδοὺ μακαρίζομεν τοὺς ὑπομείναντας τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου εἴδετε ὅτι πολύσπλαγχνός ἐστιν ὁ κύριος καὶ οἰκτίρμων.</p>","lit":"<p>弟兄們，你們要拿那些奉主名說話的先知們，作為受苦和恆久忍耐的榜樣。</p><p>看哪，我們稱那些忍受到底的人有福。約伯的忍受你們聽見了，主的結局你們也看見了：主是滿有心腸、又有憐恤的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑπόδειγμα</td><td>hypodeigma</td><td>榜樣、樣本</td><td>放在句首強調</td></tr><tr><td>τῆς κακοπαθίας καὶ τῆς μακροθυμίας</td><td>tēs kakopathias kai tēs makrothymias</td><td>受苦和恆久忍耐</td><td>5:13 Κακοπαθεῖ 同根</td></tr><tr><td>μακαρίζομεν τοὺς ὑπομείναντας</td><td>makarizomen tous hypomeinantas</td><td>稱忍受到底的人有福</td><td>回到 1:12</td></tr><tr><td>τὴν ὑπομονὴν Ἰὼβ</td><td>tēn hypomonēn Iōb</td><td>約伯的忍受</td><td>ὑπομονή：留在底下</td></tr><tr><td>τὸ τέλος κυρίου</td><td>to telos kyriou</td><td>主的結局</td><td>「給他」是小字</td></tr><tr><td>πολύσπλαγχνός</td><td>polysplanchnos</td><td>滿有心腸</td><td>新約僅此一次</td></tr><tr><td>οἰκτίρμων</td><td>oiktirmōn</td><td>有憐恤的</td><td>路 6:36 同字</td></tr></table>","gram":"<p><strong>5:10 把 ὑπόδειγμα（hypodeigma） 放在句首。</strong>先說「榜樣」，再說是誰。τῆς κακοπαθίας καὶ τῆς μακροθυμίας（tēs kakopathias kai tēs makrothymias）：受苦和心長。先知們不是沒有受苦，是在受苦裡心仍然是長的。這使我們想起太 5:12「在你們以前的先知，人也是這樣逼迫他們」（太 5:12）。</p><p>5:11 從 μακροθυμέω（makrothymeō） 換到 ὑπομονή（hypomonē）：μακαρίζομεν τοὺς ὑπομείναντας（makarizomen tous hypomeinantas） 回到 1:12 Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν（Makarios anēr hos hypomenei peirasmon），全卷從試煉的 ὑπομονή（hypomonē） 開始，又在這裡收回 ὑπομονή（hypomonē）。τὸ τέλος κυρίου（to telos kyriou） 字面是「主的結局」，可以是主給約伯的結局（和合本小字「給他」），也可以是主的目的；兩者是一件事。</p><blockquote><p><strong>全卷最高點：πολύσπλαγχνός ἐστιν ὁ κύριος καὶ οἰκτίρμων（polysplanchnos estin ho kyrios kai oiktirmōn）。</strong>πολύσπλαγχνος（polysplanchnos） 新約只有這一次，由「多」與「心腸、內臟」組成，σπλάγχνα（splanchna） 是主耶穌「動了慈心」ἐσπλαγχνίσθη（esplanchnisthē） 的那個字根。οἰκτίρμων（oiktirmōn） 在路 6:36 說「你們要慈悲，像你們的父慈悲一樣」（路 6:36）。一封命令最多的信，最高的地方不是一條命令，是神的心腸。</p></blockquote>","exp":"<p>「弟兄們，你們要把那先前奉主名說話的眾先知當作能受苦能忍耐的榜樣。」（5:10）雅各給了三個等候的人：農夫、先知、約伯。農夫等的是雨，先知等的是百姓回轉，約伯等的是神開口。三種等候，一種比一種難。</p><p>「你們聽見過約伯的忍耐，也知道主給他的結局，明顯主是滿心憐憫，大有慈悲。」（5:11）約伯其實不太「忍耐」。他咒詛自己的生日，和朋友爭辯，向神發出一連串的問題。雅各說的 ὑπομονή（hypomonē） 不是不出聲，是沒有離開；約伯一面哭一面抓住神，沒有放手。這也保護今天受苦的人：可以難過，可以發問，只要不離開。</p><p>雅各要人看的不是約伯，是約伯的結局。伯 42:10 說：「耶和華就使約伯從苦境轉回」（伯 42:10）。結局說明了一件事：那位允許約伯受苦的主，是「滿心憐憫，大有慈悲」的。受苦的時候看不見這一點，看完結局才看得見；忍耐就是在還沒看到結局的時候，相信結局。</p><p>全卷五章，一章一面鏡子：全、行、言、謙、忍。第 5 章照的是時間裡的心。每一章都有一樣從上頭來的：第 1 章是恩賜，第 4 章是恩典，第 5 章是主的憐憫。雅各的命令一路往上爬，最高的地方停在 5:11：神的心腸很大。焦點在耶穌，就看得見約伯的結局；焦點在自己的苦，就只看得見灰燼。</p><p>這也是 321 說「得勝者」的樣子：不是一路沒有傷，是走到結局的時候，發現那位主一直是滿心憐憫的。1:12 說「忍受試探的人是有福的」（1:12），5:11 讓我們看見那福的源頭：不是忍耐的人多堅強，是主的心腸多大。</p>"},{"a":12,"z":12,"star":2,"grk":"<p lang=\"grc\">Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ὑπὸ κρίσιν πέσητε.</p>","lit":"<p>但在一切之先，我的弟兄們，不要起誓，不可指著天，不可指著地，也不可用別的任何誓；但要讓你們的是是是，不是是不是，免得你們落在審判之下。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πρὸ πάντων</td><td>Pro pantōn</td><td>在一切之先</td><td>彼前 4:8 同一個片語</td></tr><tr><td>μὴ ὀμνύετε</td><td>mē omnyete</td><td>不要起誓</td><td>現在命令：停止習慣</td></tr><tr><td>ἄλλον τινὰ ὅρκον</td><td>allon tina horkon</td><td>別的任何誓</td><td>包括各種替代誓詞</td></tr><tr><td>ἤτω</td><td>ētō</td><td>讓它是</td><td>第三人稱命令</td></tr><tr><td>τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ</td><td>to Nai nai kai to Ou ou</td><td>你們的是是是，不是是不是</td><td>太 5:37 的翻版</td></tr><tr><td>ὑπὸ κρίσιν</td><td>hypo krisin</td><td>在審判之下</td><td>RP 作 εἰς ὑπόκρισιν</td></tr></table>","gram":"<p><strong>5:12 與太 5:34--37 幾乎逐字相同。</strong>登山寶訓：μὴ ὀμόσαι ὅλως μήτε ἐν τῷ οὐρανῷ（mē omosai holōs mēte en tō ouranō）……ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί οὒ οὔ（estō de ho logos hymōn nai nai ou ou）；雅各：μὴ ὀμνύετε（mē omnyete）, μήτε τὸν οὐρανὸν μήτε τὴν γῆν（mēte ton ouranon mēte tēn gēn）……ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ（ētō de hymōn to Nai nai kai to Ou ou）。雅各的版本更短，「是」與「不是」都帶冠詞：讓你們的「是」就是是。起誓的話題是主耶穌的，句子是雅各自己的。</p><p>Πρὸ πάντων（Pro pantōn） 不一定指「全卷最要緊的」，書信結尾常用它標出最後幾條勸勉的開頭（彼前 4:8 同）。但在一封講舌頭的信裡，把起誓放在這裡，等於把第 3 章收一個尾。</p><blockquote><p><strong>經文鑑別：</strong>SBLGNT 作 ἵνα μὴ ὑπὸ κρίσιν πέσητε（hina mē hypo krisin pesēte）「免得落在審判之下」，和合本同；RP 作 εἰς ὑπόκρισιν（eis hypokrisin）「落在假冒為善裡」。兩個讀法在古抄本裡只差一個字母與一個空格。外證以 SBLGNT 的讀法較早較廣，又與 5:9 ἵνα μὴ κριθῆτε（hina mē krithēte） 呼應；本講義照 SBLGNT 與和合本。RP 的讀法也有道理：說話不算數，本身就是假冒為善。</p></blockquote>","exp":"<p>〔太〕太 5:33--37（馬太講義第 5 章）</p><p>「我的弟兄們，最要緊的是不可起誓……你們說話，是，就說是；不是，就說不是，免得你們落在審判之下。」（5:12）主耶穌說：「你們的話，是，就說是；不是，就說不是」（太 5:37）。本系列馬太講義第 5 章講過，當時的人發展出一整套起誓的分級：指著天不算，指著殿的金子才算。誓詞越多，代表平常的話越不可信。</p><p>雅各在這裡多出來的一筆，是位置。他剛講完忍耐與不埋怨，接著講起誓。被逼到牆角的人，最容易用誓言證明自己：「我發誓我沒有拿」「天打雷劈」。雅各說：不需要。一個在審判的主面前活著的人，每一句話都已經在主面前了，不必再搬天地來作保。</p><p>這一節常被問到：法庭作證、就職宣誓、婚禮誓詞可以嗎？雅各和主耶穌禁止的，是為了加強可信度、或為了推卸而隨口指天指地的誓；保羅自己也曾求神作見證（林後 1:23）。所以本講義不把 5:12 讀成禁止法庭作證或婚禮的誓約，同時尊重那些因良心持守不起誓的弟兄姊妹。</p><p>是就說是，是一種很簡單的誠實。家裡的一句「好」、群組裡的一句「我會到」、職場上的一句「下週交」，都是 5:12 的地方。一個人的「是」可以信，他就不需要發誓。</p>"},{"a":13,"z":14,"star":3,"grk":"<p lang=\"grc\">Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.</p><p lang=\"grc\">ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπʼ αὐτὸν ἀλείψαντες αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·</p>","lit":"<p>你們中間有人受苦嗎？他要禱告。有人心裡歡暢嗎？他要唱詩。</p><p>你們中間有人軟弱生病嗎？他要叫教會的長老們來，他們要在他身上禱告，奉主的名用油抹他。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Κακοπαθεῖ τις</td><td>Kakopathei tis</td><td>有人受苦嗎</td><td>5:10 κακοπαθίας 同根</td></tr><tr><td>εὐθυμεῖ τις</td><td>euthymei tis</td><td>有人心裡歡暢嗎</td><td>徒 27:22 同字</td></tr><tr><td>ψαλλέτω</td><td>psalletō</td><td>他要唱詩</td><td>第三人稱命令</td></tr><tr><td>ἀσθενεῖ τις</td><td>asthenei tis</td><td>有人軟弱生病嗎</td><td>可指身體或整個人的軟弱</td></tr><tr><td>προσκαλεσάσθω</td><td>proskalesasthō</td><td>他要叫來</td><td>病人主動</td></tr><tr><td>τοὺς πρεσβυτέρους</td><td>tous presbyterous</td><td>長老們</td><td>複數</td></tr><tr><td>ἀλείψαντες</td><td>aleipsantes</td><td>抹了油</td><td>ἀλείφω 日常塗抹，不是 χρίω</td></tr><tr><td>ἐλαίῳ</td><td>elaiō</td><td>用油</td><td>橄欖油，古代的常用藥</td></tr></table>","gram":"<p><strong>5:13--14 三個問句、三個第三人稱命令。</strong>Κακοπαθεῖ τις ἐν ὑμῖν（Kakopathei tis en hymin）; προσευχέσθω（proseuchesthō）· εὐθυμεῖ τις（euthymei tis）; ψαλλέτω（psalletō）。ἀσθενεῖ τις ἐν ὑμῖν（asthenei tis en hymin）; προσκαλεσάσθω（proskalesasthō）。受苦、喜樂、生病，三種處境各有一個去處。病人是受苦的一種，所以雅各先講受苦。</p><p>主動的是病人：προσκαλεσάσθω（proskalesasthō） 是關身語態，「他要為自己叫來」。τοὺς πρεσβυτέρους τῆς ἐκκλησίας（tous presbyterous tēs ekklēsias） 是複數，不是一位有特別恩賜的醫治者，是一個長老團隊。προσευξάσθωσαν ἐπʼ αὐτὸν（proseuxasthōsan ep' auton） 是主要動詞，ἀλείψαντες（aleipsantes） 是不定過去分詞：句子的重心是禱告，抹油是伴隨的動作。</p><blockquote><p><strong>油與用字：</strong>ἀλείψαντες αὐτὸν ἐλαίῳ（aleipsantes auton elaiō） 用的是 ἀλείφω（aleiphō），日常的塗抹、敷藥、梳洗，不是膏立君王祭司的 χρίω（chriō）。這使我們想起好撒馬利亞人「上前用油和酒倒在他的傷處」（路 10:34），以及門徒「用油抹了許多病人，治好他們」（可 6:13），那裡也是 ἤλειφον ἐλαίῳ（ēleiphon elaiō）。</p></blockquote><p><strong>油的五種讀法：</strong>①聖事說：抹油是蒙恩的記號，天主教的病人傅油聖事以此節為根據；②醫藥說：橄欖油是當時的藥，雅各是說用藥並且禱告；③象徵說：油象徵聖靈的同在與神的關顧，表明這個人被分別出來交給主；④醫治恩賜說：五旬節與靈恩傳統認為今天照樣抹油禱告、期待神蹟醫治；⑤時代說：停止論認為這屬於使徒時代的醫治恩賜，今天以一般禱告代替。五種讀法都在基督教傳統之內。本講義的判斷：ἀλείφω（aleiphō） 的用字最接近醫藥說與象徵說，但雅各把它放在「奉主的名」與禱告之下；不論教會採哪一種做法，用藥與禱告都不衝突。</p>","exp":"<p>「你們中間有受苦的呢，他就該禱告；有喜樂的呢，他就該歌頌。」（5:13）雅各先講的不是病人，是所有人：苦的時候禱告，樂的時候歌頌。人生只有這兩種天氣，兩種天氣都可以向神說話。受苦的人可以哭著禱告，雅各沒有叫他假裝不痛。</p><p>「你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。」（5:14）這一節有三個很溫柔的細節。第一，主動的是病人：他請，長老來；教會不把醫治當成表演，病人的意願被尊重。第二，來的是長老們，不是一位明星；醫治的禱告是群體的事，回指希伯來書立場五：屬靈權柄是服事，不是控制。第三，是「奉主的名」：油不是魔法，名才是。</p><p>油是甚麼，各傳統有不同做法，本講義在 gram 並陳了五種讀法。這裡要守住的是一條線：禱告與醫藥都是神的恩典，並行不悖。雅各的時代用油當藥，今天用醫生與藥物，長老的禱告和醫生的處方放在同一張病床旁。教會絕不鼓勵停藥拒醫；請長老來，和去醫院看病，是同一個信心的兩隻手。醫生開的藥，也是那位「各樣美善的恩賜」都從他而來的神所賜的（1:17）。</p><p>這也是「建立屬神的體系」最日常的樣子：一個人病了，他知道可以找誰；長老們知道自己該去。一個健康的教會，病床旁有人。長老們去，不是帶著答案去，是帶著禱告去；病人也不必擔心自己被評分，因為抹油是「奉主的名」，叫人起來的是主。</p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.</p><p lang=\"grc\">ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.</p>","lit":"<p>並且那信心的祈禱要救那疲乏的人，主要叫他起來；即使他曾經犯了罪，也要得赦免。</p><p>所以你們要彼此承認罪，並且為彼此禱告，好叫你們得醫治。義人的祈求在運行的時候，大有能力。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ εὐχὴ τῆς πίστεως</td><td>hē euchē tēs pisteōs</td><td>那信心的祈禱</td><td>是禱告的信心，不是病人的分數</td></tr><tr><td>σώσει τὸν κάμνοντα</td><td>sōsei ton kamnonta</td><td>要救那疲乏的人</td><td>κάμνω：疲乏、病倒</td></tr><tr><td>ἐγερεῖ αὐτὸν ὁ κύριος</td><td>egerei auton ho kyrios</td><td>主要叫他起來</td><td>主詞是主</td></tr><tr><td>κἂν ἁμαρτίας ᾖ πεποιηκώς</td><td>kan hamartias ē pepoiēkōs</td><td>即使他曾犯了罪</td><td>「若」：條件，不是推定</td></tr><tr><td>ἐξομολογεῖσθε……ἀλλήλοις</td><td>exomologeisthe … allēlois</td><td>要彼此承認</td><td>現在命令：生活的習慣</td></tr><tr><td>εὔχεσθε ὑπὲρ ἀλλήλων</td><td>euchesthe hyper allēlōn</td><td>為彼此禱告</td><td>認罪的目的是代求</td></tr><tr><td>ἐνεργουμένη</td><td>energoumenē</td><td>在運行中的</td><td>禱告是活的</td></tr></table>","gram":"<p><strong>5:15 的主詞是主。</strong>καὶ ἐγερεῖ αὐτὸν ὁ κύριος（kai egerei auton ho kyrios）：叫他起來的是主，不是長老，也不是油。前半句 ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα（hē euchē tēs pisteōs sōsei ton kamnonta），信心屬於「祈禱」，是來禱告的人的信心，不是病人信心的分數。σώσει（sōsei） 在雅各書可以指身體的救（這裡）也可以指靈魂的救（1:21；5:20）；ἐγερεῖ（egerei） 是「叫起來」，也是新約說復活的字。對臨終的人，「救」與「叫他起來」的範圍比痊癒更大。</p><p>κἂν ἁμαρτίας ᾖ πεποιηκώς（kan hamartias ē pepoiēkōs） 是 καὶ ἐάν（kai ean） 的縮合，「即使、若」，接完成迂說 ᾖ πεποιηκώς（ē pepoiēkōs）。雅各沒有說「他病了，因為他犯了罪」，他說「若」。病與罪的關係是條件句，常常沒有關係，這使我們想起約 9:3：「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。</p><blockquote><p>5:16 ἐξομολογεῖσθε οὖν ἀλλήλοις（exomologeisthe oun allēlois）……καὶ εὔχεσθε ὑπὲρ ἀλλήλων（kai euchesthe hyper allēlōn）：ἀλλήλοις（allēlois） 與 ἀλλήλων（allēlōn） 互相對稱，彼此認、彼此禱。不是向長老單向告解，是互相的。ὅπως ἰαθῆτε（hopōs iathēte） 是目的，醫治包括身體與關係。πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη（poly ischyei deēsis dikaiou energoumenē）：ἐνεργουμένη（energoumenē） 可讀作關身（禱告「發動起來」時大有力量）或被動（被神「運行」的禱告）。不論哪一讀，力量的來源都不是禱告者，是那位使他起來的主。</p></blockquote>","exp":"<p>「出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。」（5:15）這一節常被讀成一個公式：信心夠，病就好。但雅各的句子不是這樣排的。主詞是主：主必叫他起來。病沒有好的人，不是信心不夠；希伯來書第 11 章的信心名單裡，「又有人忍受嚴刑」（來 11:35），他們同樣是因著信。本系列希伯來書立場四講過：神能醫治，也常醫治，但祂的作為不由我們的信心分數決定。</p><p>為重病臨終的人禱告，可以求痊癒，也可以求平安、不痛苦、與家人和好、安然見主。這些都在「救」與「主必叫他起來」的範圍裡；最後的「叫他起來」，是復活的早晨。禱告與醫藥在這時候仍然並行。</p><p>「他若犯了罪」是條件句，不是推定。病床旁的人不應該被盤問「你是不是有罪沒認」，那不是雅各的意思。主耶穌的門徒也曾問「是誰犯了罪？」（約 9:2），主的回答是：都不是。</p><p>「所以你們要彼此認罪，互相代求，使你們可以得醫治。」（5:16）認罪的目的是被代求，不是被審判。這裡有幾條界線要守：認罪是自願的，不是逼問；是互相的，不是一方當審判官；是在可信任的關係裡，並且保密，不是公開認罪的場合，也不轉述別人說的話。受害者不需要向加害者認罪求和好；涉及暴力、性侵、兒少的事，先保護安全、依法處理。醫治若來，是主叫人起來；禱告與醫藥仍然並行。</p><p>「義人祈禱所發的力量是大有功效的。」（5:16）這個義人是誰？下一節立刻說：一個和我們一樣的人。</p>"},{"a":17,"z":18,"star":2,"grk":"<p lang=\"grc\">Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·</p><p lang=\"grc\">καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ὑετὸν ἔδωκεν καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.</p>","lit":"<p>以利亞是一個與我們性情相同的人，他用禱告禱告了不要下雨，雨就三年又六個月沒有下在地上。</p><p>他又禱告了，天就給了雨，地也長出了它的果實。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁμοιοπαθὴς ἡμῖν</td><td>homoiopathēs hēmin</td><td>與我們性情相同</td><td>徒 14:15 同字</td></tr><tr><td>προσευχῇ προσηύξατο</td><td>proseuchē prosēuxato</td><td>用禱告禱告了</td><td>希伯來式加強：懇切</td></tr><tr><td>ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ</td><td>eniautous treis kai mēnas hex</td><td>三年又六個月</td><td>路 4:25 同數</td></tr><tr><td>ὑετὸν ἔδωκεν</td><td>hyeton edōken</td><td>給了雨</td><td>從上頭來的最後一樣</td></tr><tr><td>ἐβλάστησεν τὸν καρπὸν αὐτῆς</td><td>eblastēsen ton karpon autēs</td><td>長出了它的果實</td><td>回到 5:7 寶貴的出產</td></tr></table>","gram":"<p><strong>5:17 先說以利亞是 ἄνθρωπος（anthrōpos）……ὁμοιοπαθὴς ἡμῖν（homoiopathēs hēmin）。</strong>這個字在徒 14:15 是保羅和巴拿巴拒絕被當成神時說的：「我們也是人，性情和你們一樣」（徒 14:15）。雅各用它把以利亞從神壇上請下來。προσευχῇ προσηύξατο（proseuchē prosēuxato） 是希伯來式的同源加強，「禱告了一個禱告」，和合本譯「懇切禱告」。</p><blockquote><p><strong>三年零六個月：兩種算法。</strong>王上 18:1 說「過了許久，到第三年，耶和華的話臨到以利亞」（王上 18:1）；路 4:25 主耶穌說「天閉塞了三年零六個月」（路 4:25），雅各的 ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ（eniautous treis kai mēnas hex） 與路加相同。王上 18:1 的「第三年」可以從以利亞到撒勒法算起，乾旱之前還有一段旱季；猶太傳統則用三年半作為苦難期的整數。兩個版本算法不同，講台照和合本雅各書說「三年零六個月」即可。</p></blockquote><p>5:18 καὶ ὁ οὐρανὸς ὑετὸν ἔδωκεν（kai ho ouranos hyeton edōken）：主詞是「天」，動詞是「給」，雨是禮物。ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς（hē gē eblastēsen ton karpon autēs） 接回 5:7 農夫等的 τὸν τίμιον καρπὸν τῆς γῆς（ton timion karpon tēs gēs）：農夫等的雨，以利亞求來了。</p>","exp":"<p>「以利亞與我們是一樣性情的人，他懇切禱告，求不要下雨，雨就三年零六個月不下在地上。」（5:17）雅各挑以利亞，不是因為他是最大的先知，而是因為他「一樣」。王上 19 章的以利亞會怕、會累、會躺在羅騰樹下求死。一個會求死的人，禱告也能關天開天；所以禱告的力量不在禱告的人，在聽禱告的神。</p><p>「他又禱告，天就降下雨來，地也生出土產。」（5:18）以利亞在迦密山頂「屈身在地，將臉伏在兩膝之中」（王上 18:42），一連七次叫僕人去看，第七次才看見一小片雲。這就是 5:16 的「大有功效」：不是一句就成，是一次又一次。義人的禱告有力，常常是因為他沒有停。</p><p>雅各在這裡講以利亞求雨，是要病床旁的禱告者有勇氣，不是要人把它讀成末後大復興的時間表。以利亞的故事在雅各手中很小：一個普通人，一個懇切的禱告，一場雨。</p><p>雨也收起了全卷的一條線。1:17 說美善的恩賜「都是從上頭來的」（1:17），3:17 講從上頭來的智慧，4:6 是從上頭來的恩典，最後一樣從上頭來的，是雨。人不能造雨，只能求、只能等。行道、勒舌、謙卑、忍耐，到最後都是同一個姿勢：抬頭向上領受。</p>"},{"a":19,"z":20,"star":3,"grk":"<p lang=\"grc\">Ἀδελφοί μου ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας καὶ ἐπιστρέψῃ τις αὐτόν,</p><p lang=\"grc\">γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.</p>","lit":"<p>我的弟兄們，你們中間若有人從真理被引迷失了，又有人使他回轉，</p><p>他就要知道：那使罪人從他道路的迷途回轉的人，要救他的靈魂脫離死亡，並且要遮蓋眾多的罪。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πλανηθῇ ἀπὸ τῆς ἀληθείας</td><td>planēthē apo tēs alētheias</td><td>從真理被引迷失</td><td>1:16 πλανᾶσθε 同字</td></tr><tr><td>ἐπιστρέψῃ τις αὐτόν</td><td>epistrepsē tis auton</td><td>有人使他回轉</td><td>不定代名詞：任何一個人</td></tr><tr><td>γινωσκέτω</td><td>ginōsketō</td><td>他要知道</td><td>第三人稱命令</td></tr><tr><td>ἐκ πλάνης ὁδοῦ αὐτοῦ</td><td>ek planēs hodou autou</td><td>從他道路的迷途</td><td>πλάνη 與 5:19 同根</td></tr><tr><td>σώσει ψυχὴν αὐτοῦ ἐκ θανάτου</td><td>sōsei psychēn autou ek thanatou</td><td>要救他的靈魂脫離死亡</td><td>αὐτοῦ 有異文</td></tr><tr><td>καλύψει πλῆθος ἁμαρτιῶν</td><td>kalypsei plēthos hamartiōn</td><td>要遮蓋眾多的罪</td><td>彼前 4:8 同句</td></tr></table>","gram":"<p><strong>5:19 的 πλανηθῇ（planēthē） 是被動語態，「被引迷失」。</strong>同一個字在 1:16 是「不要看錯了」μὴ πλανᾶσθε（mē planasthe）。從真理 τῆς ἀληθείας（tēs alētheias） 迷失，回指 1:18 神「用真道生了我們」λόγῳ ἀληθείας（logō alētheias）。ἐπιστρέψῃ τις αὐτόν（epistrepsē tis auton） 的 τις（tis） 是「任何一個人」：使人回轉不是長老的專利，是任何一位弟兄的事。</p><blockquote><p><strong>經文鑑別與兩讀：</strong>5:20 SBLGNT（WH、NA28）作 σώσει ψυχὴν αὐτοῦ ἐκ θανάτου（sōsei psychēn autou ek thanatou）「救他的靈魂脫離死亡」；Treg 與 RP 沒有 αὐτοῦ（autou），和合本照此譯「救一個靈魂不死」。有 αὐτοῦ（autou） 時，「他的靈魂」是誰的靈魂，兩種讀法：①被找回的那個罪人的靈魂（多數，也最合上下文：ὁδοῦ αὐτοῦ（hodou autou） 剛說過「他的道路」）；②去找的人自己的靈魂（少數，參結 3:21 守望者救了自己）。本講義取第一讀：去找人的人，救的是那個走失的弟兄。這裡不在定案「信徒會不會失去救恩」，那個問題回指希伯來書立場二。</p></blockquote><p>καλύψει πλῆθος ἁμαρτιῶν（kalypsei plēthos hamartiōn） 這使我們想起箴 10:12「愛能遮掩一切過錯」（箴 10:12），彼前 4:8 用同一句：「愛能遮掩許多的罪」（彼前 4:8）。被遮蓋的是誰的罪，也有兩讀；最自然的讀法是回轉之人的許多罪，因他的回轉而蒙赦免。</p>","exp":"<p>「我的弟兄們，你們中間若有失迷真道的，有人使他回轉，這人該知道：叫一個罪人從迷路上轉回便是救一個靈魂不死，並且遮蓋許多的罪。」（5:19--20）雅各書就這樣結束了。沒有問安，沒有祝福，沒有「願恩惠與你們同在」。最後一筆是一個任務。</p><p>這個結尾把全卷收成一個圓。全卷從「心懷二意」講起，一面鏡子照了五章：試煉裡的心、對弟兄的手、說話的口、神面前的謙卑、等候裡的忍耐。照完了，雅各沒有叫人繼續照自己，他說：去找那個走失的人。會照鏡子的人，最後要變成別人的鏡子。</p><p>但怎樣找，前面四章已經說好了。3:13 說要「用智慧的溫柔」，4:11--12 說不可坐上審判官的位子。使人回轉不是論斷，是站在他旁邊，把他領回來。保羅說：「你們屬靈的人就當用溫柔的心把他挽回過來」（加 6:1）。勸戒和論斷的分別就在這裡：動機是把人找回來，方法是當面、私下、溫柔，位子是弟兄，不是法官。</p><p>次序也重要。第 5 章先說「主是滿心憐憫，大有慈悲」（5:11），再說「義人祈禱所發的力量是大有功效的」（5:16），最後才說去找人。先被憐憫，再禱告，然後出去。一個沒有先被主的憐憫找到的人，去找別人時多半帶著責備；被找回過的人，才知道路怎麼走回來。</p><p>321 的 920 就寫在這裡：那個失迷真道的弟兄，是你的 2。一封從「僕人」開始的信，在「去找一個人」結束；那位曾經和家人以為哥哥癲狂了、後來被哥哥找回來的雅各，最後交給教會的，正是他自己經歷過的事。</p>"}]},"serm":{"1":{"min":19,"blocks":[["h","《詳細察看那全備、使人自由之律法》"],["p","弟兄姊妹平安，今天我們開始讀雅各書，第一章。"],["p","今天早上，請容我借一個人的口，說幾句話。"],["p","聖經沒有記下這段話。可是我相信，他心裡說過。"],["p","請你聽，這是寫這封信的那個人。"],["q","我叫雅各。三十年來，我一直以為我哥哥瘋了。"],["p","我們在拿撒勒一起長大。一起在木匠鋪裡刨木頭，一起扛木料。"],["p","他是長子。他做的桌子不搖，他說的話不假。"],["p","可是三十歲那年，他放下鋸子，走了。"],["p","我們全家都出去了。我們要把他拉回家。"],["q","「耶穌的親屬聽見，就出來要拉住他，因為他們說他癲狂了。」（可 3:21）"],["p","那一句「他癲狂了」，我心裡也這樣以為。"],["q","「因為連他的弟兄說這話，是因為不信他。」（約 7:5）"],["p","後來他被釘死了。可是三天以後，他來找我。"],["p","他沒有罵我。他沒有說：你當初怎麼說我的？"],["p","他只是站在那裡。我那個被我當成瘋了的哥哥，活著站在那裡。"],["q","從那一天起，我不敢再叫他哥哥。我叫他主。"],["p","這是我替雅各說的話。我們回到經文。"],["p","保羅告訴我們，復活的主，曾經顯給雅各看。"],["p","後來這個雅各，成了耶路撒冷教會的柱石。"],["p","使徒行傳講義第十五章講過，他在會議上站起來，一句話定了方向。"],["p","他有地位，有權柄，還有一個誰都比不上的身分：主的弟弟。"],["p","可是請你看，他寫信的第一句，怎樣介紹自己。"],["q","「作神和主耶穌基督僕人的雅各請散住十二個支派之人的安。」（1:1）"],["p","僕人。原文是奴僕。"],["p","最有資格說「我是他弟弟」的人，只說「我是他的僕人」。"],["p","他不是把自己擦掉。他是回到了本位。"],["q","一個以為哥哥瘋了的弟弟，後來一輩子活在哥哥的話裡。"],["p","收信的是誰？散住十二個支派的人。"],["p","「散住」原是撒種的字。這些信徒被撒出去，散在各城。"],["p","這不是為了一件事寫的信。是為了一種生活：在異鄉，在貧窮，在試煉裡。"],["p","我們這個散在各國、在線上聚集的團契，對這種生活不陌生。"],["p","這一章有三個字：煉，生，鏡。"],["p","我們走三步：在試煉中成全；試探從私慾來，神卻生了我們；彎下腰看鏡子。"],["q","第一步：在試煉中成全。"],["p","雅各的問安，原文只有一個字：願你們喜樂。"],["p","下一句，他馬上接著說試煉。"],["q","「我的弟兄們，你們落在百般試煉中，都要以為大喜樂」（1:2）"],["p","他沒有先安慰，再講難處。他把喜樂和試煉，放在同一口氣裡。"],["p","「落在」，是掉進去的字。像走路踩空，一腳掉進坑裡。"],["p","試煉不是你挑的，也不必你去找。"],["p","「百般」，原文是五顏六色的。"],["p","不一定是一場大逼迫。可能是工錢被扣，可能是孩子不回訊息，可能是一張檢查報告。"],["p","雅各說：都要以為大喜樂。"],["p","弟兄姊妹，這一句話，很容易被講錯。"],["p","有人聽了，就對剛失去親人的弟兄說：你要喜樂啊，不要哭。"],["q","這不是雅各的意思。"],["p","「以為」這個字，原文是算為、認定。是頭腦裡的判斷，不是臉上的表情。"],["p","喜樂在這裡是一個認定，不是假裝不痛。"],["p","同一位雅各，在第四章叫人愁苦、悲哀、哭泣。"],["p","在第五章說：「你們中間有受苦的呢，他就該禱告」（5:13）。"],["p","所以受苦的人可以難過。眼淚可以在臉上，認定可以在心裡。"],["p","那認定甚麼呢？下一句告訴我們。"],["q","「因為知道你們的信心經過試驗，就生忍耐。」（1:3）"],["p","「試驗」，是煉金的字。"],["q","金匠把金子放進火裡。火不是為了燒掉金子，是為了證明它是金子。"],["p","神把你放進火裡，不是要毀掉你。是要顯出你裡面那一點真的。"],["p","試煉不是神在害你。是神在證明，你的信心是真的。"],["p","可是忍耐還不是終點。"],["q","「但忍耐也當成功，使你們成全、完備，毫無缺欠。」（1:4）"],["p","「成功」，原文是要讓忍耐把它的工作做完。"],["p","像烤麵包，不能半生就拿出爐。還沒熟的，不能吃。"],["p","「成全」，就是這一章、也是全卷第一篇的那一個字：全。"],["p","這使我們想起哥哥在山上說過的話："],["q","「所以，你們要完全，像你們的天父完全一樣。」（太 5:48）"],["p","弟弟用了哥哥的字。"],["p","「完全」不是沒有瑕疵，是長大成熟。"],["p","雅各接著用了一個小小的接龍。第四節說「毫無缺欠」。"],["p","第五節馬上說：若有缺少的。"],["q","「你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神，主就必賜給他。」（1:5）"],["p","試煉裡最缺的，常常不是力氣，是智慧。"],["p","雅各說：去求。"],["p","請你聽那一句：不斥責人的神。"],["p","很多人不敢求，是怕被嫌。這種小事也要問？同一個問題又問一次？"],["p","神不是那樣的老師。你第一百次問他，他也不翻白眼。"],["p","「厚賜」，原文是單純地給。不打折扣，不先開條件。"],["p","可是雅各加了一個條件。"],["q","「只要憑著信心求，一點不疑惑；因為那疑惑的人，就像海中的波浪，被風吹動翻騰。」（1:6）"],["p","這是不是說，心裡有一點問號，神就不聽了？"],["p","不是。有一位父親對主說：我信，但我信不足。主沒有拒絕他。"],["p","雅各說的疑惑，是心裡的法庭判來判去，永遠不肯結案。"],["q","「心懷二意的人，在他一切所行的路上都沒有定見。」（1:8）"],["p","「心懷二意」，原文是兩個魂的。"],["p","整本新約，只有雅各用這個字。這裡一次，第四章一次。"],["p","兩個魂的人，不是心裡有疑問的人。是兩邊都要的人。"],["p","禮拜天把生命交給神，禮拜一把安全感交給存款。"],["q","一隻腳踩在船上，一隻腳踩在岸上。船一離岸，他哪裡都去不了。"],["p","這封信，就是一面鏡子，照出一顆分成兩半的心。"],["p","然後雅各講到兩種試煉：一種是窮，一種是富。"],["q","「卑微的弟兄升高，就該喜樂；富足的降卑，也該如此」（1:9--10）"],["p","在工地扛水泥的弟兄，在神面前是王子。他可以誇這一件事。"],["p","富足的人呢？他也有喜樂的理由：他終於看清楚，錢不能定義他。"],["p","雅各不是在仇富。他只是把錢從寶座上請下來。"],["p","因為太陽一出來，熱風一颳，草就枯乾，花就凋謝。"],["p","窮的、富的，最後站在同一個十字架前，一樣需要恩典。"],["p","這是唯一合法的誇口：誇神把我們重新排過的位置。"],["p","講到這裡，有人心裡會問一句話。"],["p","如果試煉是神許可的，那我在試煉裡跌倒了，算誰的？"],["p","雅各接下來，要回答這個問題。"],["q","第二步：試探從自己的私慾來，但神用真道生了我們。"],["q","「忍受試探的人是有福的，因為他經過試驗以後，必得生命的冠冕」（1:12）"],["p","請你注意一件事。第二節的「試煉」，第十二節的「試探」，"],["p","原文是同一個字。"],["p","同一件事，可以是神手裡的試驗，也可以變成把人拉倒的試探。"],["p","差別在哪裡？雅各先排除一個答案。"],["q","「人被試探，不可說：『我是被神試探』；因為神不能被惡試探，他也不試探人。」（1:13）"],["p","這一句推卸，很古老。"],["p","亞當在園子裡就說過：是你給我的那個女人。意思是：你給的，所以是你的錯。"],["p","處境是真的。可是處境不是罪的源頭。"],["p","惡在神那裡找不到抓手。像火柴劃在玻璃上，劃不著。"],["p","神給人的是試驗，從來不是陷阱。"],["p","那試探到底從哪裡來？"],["q","「但各人被試探，乃是被自己的私慾牽引誘惑的。」（1:14）"],["p","不是神。不是環境。也不能全推給魔鬼。雅各說：自己的。"],["p","「牽引誘惑」，是釣魚的字。"],["q","湖邊，清晨。一條魚在水裡，看見一團餌。"],["p","魚不是因為看見鉤子才上鉤。是因為看見了餌。"],["p","餌是真的好吃。鉤子，藏在下面。"],["p","私慾，就是心裡那一份想要。想被看見，想被肯定，想要安全，想要快樂。"],["p","想要本身常常不是壞的。壞在它被拖離了神，自己去咬那個餌。"],["p","然後雅各寫下一份家譜。"],["q","「私慾既懷了胎，就生出罪來；罪既長成，就生出死來。」（1:15）"],["p","請你看清楚次序。"],["q","試探不是罪。"],["p","念頭來了，餌在眼前，這還不是罪。"],["p","主耶穌自己也被試探過。他沒有犯罪。"],["p","私慾要「懷了胎」，人接住它、抱住它、餵養它，才生出罪來。"],["p","這對正在掙扎的人，是好消息。"],["p","有人在色慾或上癮裡掙扎，念頭一來，就覺得：我完了。於是乾脆放棄。"],["p","雅各說：還沒有。念頭來的那一刻，正是轉身的那一刻。"],["p","這樣的掙扎，需要的是陪伴，有時需要專業的協助。不是定罪。"],["p","可是也不可輕看。罪會長成，它不會一直停在小時候。"],["p","今天容許的一點點，明年會長大。家譜的最後一代，是死。"],["p","斷開這份家譜最好的時候，是第一代。"],["p","餌一出現，就把它帶到神面前，也告訴一位可信的同伴。"],["p","講到這裡，空氣很重。可是雅各沒有停在這裡。"],["q","「我親愛的弟兄們，不要看錯了。」（1:16）"],["p","不要看錯甚麼？不要看錯神。"],["q","「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從眾光之父那裡降下來的；在他並沒有改變，也沒有轉動的影兒。」（1:17）"],["p","私慾是從裡面往下拉。恩賜是從上面往下給。"],["p","眾光之父，就是造太陽、月亮、星星的那一位。"],["q","天上的光會轉。造光的那一位，不會轉。"],["p","試煉裡的人，最怕的就是神變了。雅各說：他沒有變。"],["p","然後，是這一章最重要的一句。"],["q","「他按自己的旨意，用真道生了我們，叫我們在他所造的萬物中好像初熟的果子。」（1:18）"],["p","請你聽那個「生」字。"],["p","三節之前，罪「生出死來」。這裡，神「生了我們」。"],["p","原文是同一個字。"],["q","私慾的家譜，生出死來。神的家譜，用真道生出我們。"],["p","不是因為我們夠好。是他願意。"],["p","這一句是全卷的護欄。"],["p","後面雅各會講很多「要」，很多「不可」。"],["p","可是他的每一個命令，都是從這一句恩典長出來的。"],["p","雅各不是一位只會下命令的老師。他是一個先被恩典找回來的弟弟。"],["p","那麼，一個被真道生下來的人，接下來要怎樣活？"],["p","雅各說：去照鏡子。"],["q","第三步：彎下腰看鏡子。"],["q","「我親愛的弟兄們，這是你們所知道的。但你們各人要快快地聽，慢慢地說，慢慢地動怒」（1:19）"],["p","這三句話，人人會背，很少人做得到。"],["p","我們常常反過來：慢慢地聽，快快地說，快快地動怒。"],["p","「慢慢地動怒」，不是不准生氣。是讓怒氣在出手之前，先經過神面前。"],["q","「因為人的怒氣並不成就神的義。」（1:20）"],["p","很多時候，我們以為自己的火，是在替神伸張正義。"],["p","雅各說：你的火，做不出神的義。"],["q","「所以，你們要脫去一切的污穢和盈餘的邪惡，存溫柔的心領受那所栽種的道」（1:21）"],["p","「所栽種的道」，原文是栽在裡面的。"],["p","道不是貼在牆上的標語。是種進泥土裡的種子。"],["p","所以行道，不是靠自己咬牙用力。是領受那道，讓它在裡面長出來。"],["p","好，現在鏡子拿出來了。"],["q","「只是你們要行道，不要單單聽道，自己欺哄自己。」（1:22）"],["p","「欺哄自己」，原文是會計的字：算錯了帳。"],["p","只聽不行的人，是自己做了一本假帳，給自己看。"],["q","清晨，一個人站在銅鏡前。"],["p","他湊近了，看得很仔細。臉頰上有一塊黑。"],["q","「看見，走後，隨即忘了他的相貌如何。」（1:24）"],["p","他看見了，沒有擦。走出門，就忘了。"],["p","弟兄姊妹，聽道就是照鏡子。"],["p","主日聽到一句話，心裡一亮：這就是我。"],["p","主耶穌在山上也講過同一件事：聽了去行的，像房子蓋在磐石上。"],["p","可是同一面鏡子前，還有另一種人。"],["q","「惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。」（1:25）"],["p","「詳細察看」，原文是彎下腰去看。"],["p","這個字，在約翰福音裡出現過。"],["q","復活的早晨，門徒跑到空墳前，「低頭往裡看，就見細麻布還放在那裡」（約 20:5）。"],["p","就是這個字。那一彎腰，他們的世界翻轉了。"],["p","讀經就是彎下腰。"],["p","站著瞄一眼，看見的是字。彎下腰，看見的是自己，也看見那位復活的主。"],["p","「並且時常如此」，原文是留在那裡。"],["p","第二十四節的人，走了。第二十五節的人，留下了。"],["p","還有一件小事。和合本「使人自由」的「使人」，是補上去的小字。"],["p","原文只說：屬自由的律法。是自由的，不是捆綁的。"],["p","外面的規條叫人怕。神栽在裡面的生命，叫人自由。"],["p","福在哪裡？在他所行的事上。不是行完了才發獎金，是在行的時候就得福。"],["p","一個人照著道饒恕了人，饒恕的那一刻，他自己先得了自由。"],["p","這也不是說，人靠行為得救。雅各剛說過，是神用真道生了我們。"],["p","他說的是：生命若是真的，就會動。"],["p","那鏡子照出來的，是甚麼樣子？雅各給了兩個畫面。"],["q","「若有人自以為虔誠，卻不勒住他的舌頭，反欺哄自己的心，這人的虔誠是虛的。」（1:26）"],["p","聚會從不缺席。可是在群組裡，一句話就能傷透一個人的心。"],["p","「勒住」，是勒馬的字。勒馬，不是割掉馬的舌頭。"],["p","勒住舌頭，不是叫受了傷的人閉嘴，也不是叫指出問題的同工不准開口。"],["p","被勒住的，是刻薄的話、論斷人的話。該說的真話，仍然要在溫柔裡說出來。"],["q","「在神我們的父面前，那清潔沒有玷污的虔誠，就是看顧在患難中的孤兒寡婦，並且保守自己不沾染世俗。」（1:27）"],["p","「看顧」，原文是探望。就是走一趟，去敲那一扇門。"],["p","請你看次序。先走出去看顧人，再保守自己不沾染世俗。"],["p","所以不沾染世俗，不是躲起來，與世隔離。"],["q","像一位醫生走進病房。不是不碰病人，是洗淨了手，再去碰。"],["p","散住的信徒自己也窮。雅各仍然叫他們，去看顧比他們更窮的人。"],["p","弟兄姊妹，經文講完了。我們在這面鏡子前，停一下。"],["p","國度321空中團契常說：聖經是我的準則。"],["p","讀完這一章，我們才知道，這句話的姿勢是甚麼。"],["q","聖經是我的準則，不是因為讀過，是因為彎下腰，留在它面前。"],["p","我們也講改變觀念的八大步驟。這一章告訴我們，最常斷在實踐之前。"],["p","看見了，走開了，忘了。"],["p","一個彎下腰的人，姿勢本身就是謙卑。"],["p","站著的人評論經文。彎下腰的人，被經文看見。"],["p","我們說建立屬神的體系。雅各說，體系的第一個樣子，是去看顧最弱的人。"],["p","最後，我們回到開頭那個人。"],["p","那個以為「他癲狂了」的弟弟。"],["p","他自己也照過一面鏡子。不是銅片，是一張臉。"],["q","復活的主站在他面前。那是他看過最清楚的一面鏡子。"],["p","他在那張臉上看見了自己：不信的，譏諷的，二意的。"],["p","可是他也看見，那張臉沒有斥責他。"],["p","所以他才寫得出來：神厚賜與眾人，也不斥責人。"],["p","所以他才寫得出來：他按自己的旨意，用真道生了我們。"],["p","他沒有看見，走後，隨即忘了。他留下來了。"],["p","一留，就是一輩子。從弟弟，變成僕人。"],["p","弟兄姊妹，你今天站在哪一面鏡子前？"],["p","也許你正落在百般的試煉裡，眼淚還在臉上。"],["p","也許你正被一團餌拉著，覺得自己已經完了。"],["p","也許你聽了很多年的道，帳本很厚，鏡子裡的臉卻很模糊。"],["p","請你彎下腰。看那位復活的主。他不翻白眼，他不轉動，他不斥責。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，每天早上讀第十八節一次，讀給自己聽：他用真道生了我。"],["p","第二件，想一個在患難中的人，去探望他一次。讓那面鏡子，長出一雙手。"],["q","我們聽了道。現在，我們彎下腰，並且留下來。"],["p","我們一起低頭禱告。"]]},"2":{"min":17,"blocks":[["h","《信心因著行為才得成全》"],["p","弟兄姊妹平安，今天我們一起讀雅各書第二章。"],["p","我想請你和我一起，站到一個你很熟悉的地方。"],["q","主日早上，九點五十五分，教會門口。"],["p","詩歌已經開始了。招待同工站在門邊，手上拿著週報。"],["p","這時候，兩個人同時走到門口。"],["p","一位剛從停車場走過來，手上拿著車鑰匙。"],["p","西裝筆挺，手錶在燈下一閃。我們都聽說過他，生意做得很大。"],["p","另一位是剛下夜班的外籍看護。"],["p","她照顧了一整夜的老人家，衣服上還有一點藥水和稀飯的痕跡。"],["p","兩個人，同一扇門，同一秒鐘。"],["q","招待同工的手，往哪裡指？"],["p","請你不要急著回答。因為那隻手，常常比我們的頭腦先動。"],["p","前排有兩個空位，留得好好的。後面靠牆，還有幾張摺椅。"],["p","可是那個看護坐下來的時候，她心裡知道，她被放在哪裡。"],["q","「若有一個人帶著金戒指，穿著華美衣服，進你們的會堂去；又有一個窮人穿著骯髒衣服也進去」（2:2）"],["p","雅各書第二章，就從一個門口開始。"],["p","這一章有三個詞：座，死，友。"],["p","我們走三步：金戒指與骯髒衣服，憐憫向審判誇勝，信心長出手來。"],["q","第一步：金戒指與骯髒衣服。"],["p","雅各講這個場景之前，先說了一句話。"],["q","「我的弟兄們，你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人。」（2:1）"],["p","「按著外貌待人」，原文是一個很具體的字：取人的臉。"],["p","雅各說，這兩樣東西，你不能同時拿在手上。"],["p","理由在句尾那兩個字：榮耀。"],["p","太陽升起來的時候，沒有人會去比較誰手上的蠟燭比較亮。"],["q","在榮耀的主面前，金戒指不值一提。"],["p","然後他把那一幕演給我們看。"],["p","金戒指，原文是一個字，全本新約只有這裡用。"],["p","還有一個字也很特別。雅各說「你們的會堂」。"],["p","全本新約，只有這裡把基督徒的聚會叫作會堂。"],["p","所以這不是外面社會的事。這是教會自己的門口。"],["q","「你們就重看那穿華美衣服的人，說：『請坐在這好位上』；又對那窮人說：『你站在那裡』，或『坐在我腳凳下邊。』」（2:3）"],["p","一個人得到一句「請坐在這好位上」。"],["p","另一個人得到兩個選擇：站著，或者坐在腳凳旁邊的地上。"],["p","最刺耳的，是那個「我」字。我的腳凳。"],["p","在神的會堂裡，帶位的人竟然有一張自己的腳凳。"],["q","「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）"],["p","這一節，是全卷的一處低谷。"],["p","「偏心」，原文是在自己裡面分開了。"],["p","一半說：我信榮耀的主。另一半，盯著金戒指。"],["q","心裡的分裂，到了門口，就變成座位的分配。"],["p","第二個名字更重。「用惡意斷定人」，原文是：成了審判官。"],["p","憑一件衣服，判了一個人的價值。"],["p","弟兄姊妹，我們今天不必先去照外面的社會。"],["p","雅各說的是「你們」。所以我們先照自己。"],["p","可是我們的位子，其實也常常被分配。"],["p","前排留給誰？台上報告點誰的名？誰的意見在會議上比較被聽見？"],["p","事奉的位子，有沒有悄悄照著奉獻、學歷、職業在排？"],["p","國籍和口音，有沒有在我們心裡先排了一次座位？"],["p","這些常常不是誰故意安排的。是眼睛自己作的決定。"],["p","雅各要照的，正是那份自然。"],["p","也請聽清楚：雅各不是叫我們從此冷待有錢的人。"],["p","雅各要的不是換一批人坐前排。是把我們的眼睛換掉。"],["p","接著，雅各說了一聲：請聽。"],["q","「我親愛的弟兄們，請聽，神豈不是揀選了世上的貧窮人，叫他們在信上富足，並承受他所應許給那些愛他之人的國嗎？」（2:5）"],["p","這使我們想起主耶穌說過的話：貧窮的人有福了，神的國是你們的。"],["p","雅各沒有說「主說過」。他把哥哥的話，活成了自己的話。"],["p","請注意，這一節不是說貧窮本身是美德。也不是說有錢人不能得救。"],["p","這一節說的是一個交換。神不照世界的價目表算人。"],["p","那位剛下夜班的看護姊妹，如果她今天坐在後面，請她聽見這一節："],["p","在神的帳本上，你是承受國的人。"],["p","雅各還說了一句更深的話。"],["q","「他們不是褻瀆你們所敬奉的尊名嗎？」（2:7）"],["p","「所敬奉的」，和合本的小字說，也可以譯作「被稱」。"],["p","你受洗的那一天，主的名被呼叫在你身上。從那天起，你屬於他。"],["p","那位穿著骯髒衣服進來的弟兄，身上也有這個名字。"],["q","教會門口怎樣待人，就是教會怎樣待那名。"],["p","講到這裡，也許有人心裡說：牧師，這不過是座位而已。"],["p","雅各要回答的，正是這一句「不過而已」。"],["q","第二步：憐憫向審判誇勝。"],["q","「經上記著說：『要愛人如己。』你們若全守這至尊的律法才是好的。」（2:8）"],["p","雅各引的是利未記第十九章。利未記講義講過，那一章很具體。"],["p","雅各書在這裡只多加一筆：他給這條律法一個名字。"],["p","「至尊的」，原文是：屬王的。"],["p","王怎樣看那位穿骯髒衣服的人，國民就怎樣看他。"],["p","然後是一記重錘。"],["q","「但你們若按外貌待人，便是犯罪，被律法定為犯法的。」（2:9）"],["p","你不能一邊引「愛人如己」為自己辯護，一邊把人送到腳凳旁邊。"],["q","「因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條。」（2:10）"],["p","這一句常常被聽錯，以為所有的罪都一樣大。"],["p","雅各說的不是大小。是律法是一整件衣服，不是一疊考卷。"],["p","門口那個人大概覺得，九條都守了，只差這一條座位而已。"],["p","講到這裡，每一個人都站到了同一個位置上。"],["p","所以雅各接下去，就說到憐憫。"],["p","然後，是這一章的最高點。"],["q","「因為那不憐憫人的，也要受無憐憫的審判；憐憫原是向審判誇勝。」（2:13）"],["p","前半句很嚇人。"],["p","在門口作審判官的人，有一天，要站在真正的審判台前。"],["p","這使我們想起主耶穌在山上說的話。"],["q","「憐恤人的人有福了！因為他們必蒙憐恤。」（太 5:7）"],["p","一個忘記自己被憐憫過的人，最容易變成別人的審判官。"],["p","可是後半句，像一道光從雲裡打下來。"],["p","憐憫原是向審判誇勝。"],["p","「誇勝」，原文是站在上面歡呼。"],["p","在神的國裡，憐憫站起來，對審判說：這個人，我擔保了。"],["p","這不是說我們憐憫人，就賺到了免於審判的分數。"],["p","是說一個常常憐憫人的人，自己就是活在憐憫裡的人。"],["q","他給出去的憐憫，是他領受過憐憫的證據。"],["p","門口的問題，最後的答案不是一套更嚴的座位規則。是更多的憐憫。"],["p","誰記得自己曾經坐在腳凳旁邊，被神扶起來，"],["p","就不會再把別人往腳凳那裡推。"],["p","可是一講到憐憫，一定有人說：我有啊。我心裡很同情他們。"],["p","雅各就在這裡，問了全卷最難的一個問題。"],["q","第三步：信心長出手來。"],["q","「我的弟兄們，若有人說自己有信心，卻沒有行為，有甚麼益處呢？這信心能救他嗎？」（2:14）"],["p","請你先聽見那個「說」字。"],["p","雅各不是在問一個真心倚靠神、卻常常覺得自己做得不夠的人。"],["p","他問的是一個嘴上說有信心、手卻從來沒有動過的人。"],["p","「這信心能救他嗎？」原文的問法，已經預備好答案：不能。"],["p","可是請聽清楚，他說的是「這」信心。就是只停在嘴上的那一種。"],["p","雅各沒有說信心救不了人。他是說，只會說、不會動的東西，配不上信心這個名字。"],["p","然後，他舉了一個例子。"],["q","「若是弟兄或是姊妹，赤身露體，又缺了日用的飲食」（2:15）"],["p","請注意這個例子。不是割禮，不是守節，不是飲食的規條。"],["p","雅各在這一章說的「行為」，是愛的行為。"],["q","「你們中間有人對他們說：『平平安安地去吧！願你們穿得暖，吃得飽』，卻不給他們身體所需用的，這有甚麼益處呢？」（2:16）"],["p","這句話很屬靈。字字都是祝福。說的人也許還是真心的。"],["p","然後門關上了。祝福從嘴裡出去，冷風從門縫吹進來。"],["p","弟兄姊妹，今天的「平平安安地去吧」，長甚麼樣子？"],["p","可能就是群組裡的一個貼圖：加油，為你禱告，三個愛心。"],["p","雅各不反對祝福，也不反對禱告。他問的是：祝福的後面，有沒有一雙手？"],["q","「這樣，信心若沒有行為就是死的。」（2:17）"],["p","雅各沒有說這種信心是弱的，或者不夠好。他說：死的。"],["p","接著，雅各讓一個人站出來跟他辯論。"],["p","那個人說：你有信心，我有行為。好像這是兩種恩賜，各拿一樣，各自安好。"],["q","「你將你沒有行為的信心指給我看，我便藉著我的行為，將我的信心指給你看。」（2:18）"],["p","這一句是整段的鑰匙。"],["q","行為不是信心以外的另一樣東西。行為是信心被看見的樣子。"],["p","風是看不見的。可是你看得見樹在搖。"],["q","「你信神只有一位，你信的不錯；鬼魔也信，卻是戰驚。」（2:19）"],["p","「神只有一位」，是以色列人每天早晚背誦的信仰告白。"],["p","雅各說：你信的不錯。這個信條是對的。"],["p","然後他說了一句很嚇人的話：鬼魔也同意。"],["p","可是牠們的信，從來沒有讓牠們去愛任何一個人。"],["p","有一種信，是同意一個句子。有一種信，是把自己交給一位神。"],["p","下一節，雅各叫了一聲：虛浮的人哪。原文是空的人。"],["p","和合本說，沒有行為的信心是「死的」。"],["p","另一些古抄本，在這裡用了一個雙關的字："],["q","沒有工作的信心，是不做工的。"],["p","名字叫信心，卻甚麼工都不做。就像一台沒有引擎的車，哪裡也去不了。"],["p","然後，雅各請出兩個人。一位是祖宗，一位是妓女。"],["q","「我們的祖宗亞伯拉罕把他兒子以撒獻在壇上，豈不是因行為稱義嗎？」（2:21）"],["p","創世記講義第二十二章講過那三天的路。"],["p","雅各書在這裡只多加一筆：那一座山，是一個早已被接納的人，信心被顯明出來的地方。"],["q","「可見，信心是與他的行為並行，而且信心因著行為才得成全。」（2:22）"],["p","「並行」，原文是一同做工。"],["p","不是信心本來有個缺口，要靠行為補。是像種子長成樹，花苞開成花。"],["q","「這就應驗經上所說：『亞伯拉罕信神，這就算為他的義。』他又得稱為神的朋友。」（2:23）"],["p","請你看時間。這句話，是三十多年前說的。"],["p","那一夜，亞伯蘭甚麼都還沒做。他只是抬頭數星星，信了神的應許。"],["q","「亞伯蘭信耶和華，耶和華就以此為他的義。」（創 15:6）"],["p","神在那一夜就算他為義了。白白的。"],["p","三十多年後，在摩利亞山上，那一句話應驗了。"],["p","那個被算為義的信心，終於被看見它真正的樣子。"],["p","所以這信心最後的名字，不是一張正確的答卷。是：神的朋友。"],["p","雅各接著舉了完全相反的一個人。"],["q","「妓女喇合接待使者，又放他們從別的路上出去，不也是一樣因行為稱義嗎？」（2:25）"],["p","希伯來書說，她是「因著信」接待探子。雅各說，她「因行為」。"],["p","同一件事，兩個角度。信心在她心裡，行為在她手上。"],["p","這一章從一扇關不關得上的門開始，在一扇打開的門結束。"],["q","「身體沒有靈魂是死的，信心沒有行為也是死的。」（2:26）"],["p","弟兄姊妹，講到這裡，一定有人想起保羅。"],["q","「這樣看來，人稱義是因著行為，不是單因著信。」（2:24）"],["p","保羅卻說："],["q","「人稱義是因著信，不在乎遵行律法。」（羅 3:28）"],["p","這件事，歷代教會有好幾種讀法。路德、加爾文、天主教都認真討論過。"],["p","講義的議題頁與全卷立場，把各家照實陳列了。我們今天在講台上，只說一句。"],["q","保羅說「白白的」，雅各說「活的」。"],["p","保羅對付的病，是一個人想靠自己賺得救恩。"],["p","雅各對付的病，是一個人說他信了，卻不必活出來。"],["p","救恩是白白得來的。可是白白得來的生命，是活的。"],["p","所以這一段，有兩種人要聽，兩種人聽到的不一樣。"],["p","如果你今天心裡很不安，一直在想：我做得夠不夠？我真的得救了嗎？"],["p","請你先聽雅各自己在第一章說的話。"],["q","「他按自己的旨意，用真道生了我們」（1:18）"],["p","你的新生命，是神生的，不是你做出來的。"],["p","雅各在第四章還要說："],["q","「但他賜更多的恩典」（4:6）"],["p","雅各不是要你懷疑自己得救，他不是要把你推回去靠行為。"],["p","一棵蘋果樹不是靠結果子才變成蘋果樹的。它是蘋果樹，所以結果子。"],["p","可是如果你今天心裡很平靜，"],["p","因為你知道自己「因信稱義」，所以那位飢寒的弟兄，好像不關你的事。"],["p","那雅各就要問你一句：你的信心，有手嗎？"],["p","因信稱義，從來不是冷眼看人的理由。"],["q","叫人得救的信心，從來不是孤單的。"],["p","我們回到開頭那個門口。"],["p","九點五十五分。兩個人，同一扇門。"],["p","弟兄姊妹，你知道嗎？有一位榮耀的主，也曾經站在人的門口。"],["p","他出生的那一夜，客店的門口，沒有一個好位子留給他。"],["p","最後，他被剝了衣服，赤身露體，掛在城門外面。"],["q","榮耀的主，自己坐過腳凳下的位子。"],["p","保羅說了一句話，正好把雅各的第五節接起來。"],["q","「他本來富足，卻為你們成了貧窮，叫你們因他的貧窮，可以成為富足。」（林後 8:9）"],["p","我們每一個人，都是穿著骯髒衣服走到他門口的。"],["p","他沒有說：你站在那裡。"],["p","他說：來，坐在我的桌子旁邊。"],["p","這就是憐憫向審判誇勝。這就是那白白的恩典。"],["p","一個被這樣接待過的人，手就會自己長出來。"],["p","國度321空中團契常說：人比事重要，關係比東西重要。"],["p","座位是東西。那個剛下夜班的姊妹，是人。"],["p","321也說：焦點在耶穌。焦點在榮耀的主，就不會盯著金戒指。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，下一個主日，早到十分鐘。"],["p","找一個你從來沒有和他說過話的人，坐到他旁邊，問他的名字。"],["p","第二件，打開你的手機，找一則你回過「為你禱告」的訊息。"],["p","問一問主：在這句祝福後面，我可以伸出哪一隻手？"],["p","如果你今天覺得自己的手太小，請記得："],["p","神用真道生了我們，他也賜更多的恩典。手會慢慢長出來的。"],["q","白白得來的生命，是活的。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《只用小小的舵》"],["p","弟兄姊妹平安，今天我們一起讀雅各書第三章。"],["p","我想先說一句話。我們華人，從小聽到大。"],["q","刀子嘴，豆腐心。"],["p","常常是在一句很重的話說出口之後。"],["p","媽媽罵完孩子，轉過頭跟親戚說：我就是刀子嘴，豆腐心。"],["p","同工在會議上把人說哭了，散會後有人打圓場：他就是那個脾氣，刀子嘴，豆腐心。"],["p","意思是：話是狠了一點，可是心是好的。"],["p","這句話，就像一張通行證。刀子可以照樣揮，因為心是豆腐做的。"],["p","可是今天，雅各要問我們一個問題。"],["q","「泉源從一個眼裡能發出甜苦兩樣的水嗎？」（3:11）"],["p","不能。"],["p","一口井，打上來的水是苦的，你不會說：這口井的水其實是甜的，只是出口苦了一點。"],["p","你會說：這口井，底下出了問題。"],["p","所以那一句俗話，雅各會輕輕地把它翻過來："],["q","嘴若一直是刀子，就要回頭看一看，那顆心是不是真的還是豆腐。"],["p","雅各自己在第二節就說了：我們在許多事上都有過失。"],["p","他是要我們不要再拿這句俗話，替自己的刀子開脫。"],["p","這一章有三個詞：舵，火，和。"],["p","我們走三步：小小的舵，從一個口裡出來，從上頭來的智慧。"],["q","第一步：小小的舵。"],["q","「我的弟兄們，不要多人作師傅，因為曉得我們要受更重的判斷。」（3:1）"],["p","請你想一想這些人聚會的樣子。"],["p","散住在各地的信徒，在一間小屋子裡聚會。沒有神學院，沒有按立的牧師。"],["p","誰願意站起來講，誰就可以講。"],["p","所以雅各說：不要多人作師傅。"],["p","請你聽清楚，他說的不是「不要作師傅」。"],["p","原文「多人」這個字放在最前面。問題不在教，是在搶著教。"],["p","所以這一節不是叫弟兄姊妹都不要開口。"],["p","主日學老師、小組長、在群組裡分享一段經文的姊妹，都不必因為這一節閉嘴。"],["p","新約別處一再說，要彼此教導，彼此勸戒。恩賜是神給的，不可以壓下去。"],["p","這一節是給教導的人一個重量：你說出的話，別人會拿去活。"],["p","再聽一個小地方。雅各說「我們」要受更重的判斷。"],["p","他先把自己排進受審的隊伍裡。"],["p","我今天站在這裡，這一節第一個要對付的，是我自己。"],["p","接著，雅各說了一句很坦白的話。"],["q","「原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。」（3:2）"],["p","「過失」這個字，原文是跌倒。走路絆了一下的那種跌倒。"],["p","他用的是「若有人」。前半句已經承認，我們都跌倒。"],["p","那「完全人」是甚麼意思？就是第一章那個字：忍耐使你們成全。"],["p","不是沒有罪的人，是長大成熟的人。是一個方向，不是一張證書。"],["p","為甚麼要用話語來量一個人長大了沒有？"],["p","因為手可以管，腳可以管，話卻常常在你想清楚以前，就已經出口了。"],["p","如果你今天正在為昨天晚上說出口的那一句話懊悔，"],["p","請你先聽見這一節的第一句：你不是唯一的一個。雅各也在裡面。"],["p","然後，雅各給我們看兩幅畫。"],["q","黃土路上，一匹馬。騎馬的人手裡握著韁繩。"],["q","「我們若把嚼環放在馬嘴裡，叫牠順服，就能調動牠的全身。」（3:3）"],["p","請你注意，嚼環是為了甚麼？「叫牠順服」。"],["p","不是為了折磨牠，是為了讓馬和騎馬的人往同一個方向走。"],["q","地中海上，一艘貨船。風很大，帆鼓得滿滿的。"],["q","「看哪，船隻雖然甚大，又被大風催逼，只用小小的舵，就隨著掌舵的意思轉動。」（3:4）"],["p","弟兄姊妹，這是這一章唯一一幅好看的舌頭畫面。"],["p","舵不是壞東西。船要靠岸、要避礁、要進港，全靠它。"],["p","所以問題只有一個：誰在掌舵？"],["p","舵自己沒有意思。舵後面，有一隻手。"],["p","船不是在平靜的港灣裡轉向，是在逆風裡。"],["p","人最需要舵的時候，正是情緒的大風吹來的時候。"],["p","被冤枉了。被比較了。孩子頂嘴了。老闆當眾給你難看。"],["p","風一大，最自然的反應就是放開舵。也最危險。"],["p","我還要說清楚一件事。勒住舌頭，不是把嘴縫起來。"],["p","船有舵，不是為了停在港裡，是為了出航。"],["q","勒住舌頭，不是叫受了傷的人閉嘴，也不是叫指出問題的人不要說。"],["p","是讓說出來的每一句話，跟著掌舵的那一位走。"],["p","然後畫面變了。"],["q","「這樣，舌頭在百體裡也是最小的，卻能說大話。看哪，最小的火能點著最大的樹林。」（3:5）"],["p","前面是舵，舵是被握住的。這裡是火，火是會自己跑的。"],["p","這裡有一個原文的小地方，一句就好。"],["p","和合本說「最小的火」。另一個抄本作「何等的火」，同一個字一頭指小、一頭指大。"],["p","兩種讀法意思一樣：小小的火，大大的樹林。"],["p","請你也聽見中間那一句：「卻能說大話」。"],["p","小小的舌頭最愛做的事，偏偏是把自己說大。"],["q","乾季的山坡，一根沒熄的菸頭。"],["p","一句閒話也是這樣。在群組裡隨手轉出去的一句，"],["p","第二天整個教會都知道了。第三天，兩個家庭不再說話。"],["p","說的人常常說：我只是隨口一提。"],["p","那就是那一點火。"],["q","第二步：從一個口裡出來。"],["p","接下來這一節，是整卷雅各書最低、最暗的一節。"],["q","「舌頭就是火，在我們百體中，舌頭是個罪惡的世界，能污穢全身，也能把生命的輪子點起來，並且是從地獄裡點著的。」（3:6）"],["p","原文開頭沒有動詞。就是兩個字：舌頭，火。"],["p","先是「污穢全身」。一句惡毒的話，說的人自己先被染黑。"],["p","罵完人的那一刻，你的心沒有比較乾淨。"],["p","再來是「把生命的輪子點起來」。"],["p","這不是輪迴。雅各說的是一個人從出生到老，整條人生的路，像車輪一路轉過去。"],["q","一個小男孩，九歲。爸爸看著他的成績單，說：你怎麼這麼笨。"],["p","可是那個男孩四十九歲了，升了主管，"],["p","每次開會要發言之前，耳朵裡還有那一句：你怎麼這麼笨。"],["p","這就是生命的輪子被點起來。一句話，燒過人的一輩子。"],["p","最後，是火的來源：「從地獄裡點著的」。"],["p","舌頭不是火源，它是導火線。真正的火，從更深的地方來。"],["p","這一節，我們要小心兩種誤讀。"],["p","有人說：你看，舌頭有能力。所以不可以說負面的話，說了就會成真。"],["q","這不是雅各的意思。這一節不是在教一套說了就靈的咒語。"],["p","雅各說的火，燒的是關係，燒的是人心。"],["p","話語的力量是真的，可是它的力量在人和人之間。"],["p","禍福在神手裡。你不必活在「說錯一句話就會招禍」的恐懼裡。"],["p","另一種誤讀，是聽完這一節，就再也不敢開口。"],["p","受了傷的人說出自己的傷，那不是點火。"],["p","看見問題的同工把問題說出來，那也不是點火。"],["q","那是報火警。"],["p","雅各要撲滅的，是從地獄點著的那一種火，不是那一聲火警。"],["q","「各類的走獸、飛禽、昆蟲、水族，本來都可以制伏，也已經被人制伏了；惟獨舌頭沒有人能制伏，是不止息的惡物，滿了害死人的毒氣。」（3:7--8）"],["p","「不止息」這個字，第一章用過。心懷二意的人，「沒有定見」。"],["p","同一個字。舌頭的不安定，是那顆分成兩半的心的回音。"],["p","雅各說「沒有人能」，不是誇張，是診斷。"],["p","靠我們自己的力氣，這件事做不到。"],["p","可是弟兄姊妹，「沒有人能」這四個字，正是把我們推向那一位能的。"],["p","舌頭的改變，不是從嘴巴開始，是從裡面那個道開始長。"],["p","然後，雅各給我們照一面鏡子。"],["q","「我們用舌頭頌讚那為主、為父的，又用舌頭咒詛那照著神形像被造的人。」（3:9）"],["q","主日早上，十點半。這張嘴在唱：哈利路亞。"],["q","中午十二點，回家的車上。同一張嘴在罵前面那台車的司機。"],["p","雅各的道理只有一步。"],["p","你早上頌讚的那一位，就是照著自己的形像，造了你中午罵的那個人。"],["p","好像站在一位畫家面前，把他的畫撕掉，嘴裡還說：我好喜歡你的作品。"],["p","形像沒有因為他惹你生氣，就不見了。連你最不喜歡的那個人身上，也有。"],["p","所以「咒詛」不只是詛咒的話。"],["p","都是在對著神的形像說話。"],["q","「頌讚和咒詛從一個口裡出來！我的弟兄們，這是不應當的！」（3:10）"],["p","請你注意，雅各說的是「不應當」，不是「不可能」。"],["p","這是一面鏡子，不是一根棍子。"],["p","它照出一張分成兩半的嘴。嘴的後面，是一顆分成兩半的心。"],["p","所以雅各接著問，就是我們開頭那個問題。"],["q","「泉源從一個眼裡能發出甜苦兩樣的水嗎？我的弟兄們，無花果樹能生橄欖嗎？葡萄樹能結無花果嗎？鹹水裡也不能發出甜水來。」（3:11--12）"],["p","泉，樹，水。三幅畫，講同一件事："],["q","出來的是甚麼，由源頭決定，不由出口決定。"],["p","這是誰的話？主耶穌在登山寶訓裡說："],["q","「荊棘上豈能摘葡萄呢？蒺藜裡豈能摘無花果呢？」（太 7:16）"],["p","雅各沒有說「主說過」。他只是把哥哥的比喻換了幾種果樹，再說一次。"],["p","現在我們可以回到那一句俗話了。"],["p","刀子嘴，豆腐心。雅各會溫和地說：泉源只有一個眼。"],["p","嘴裡出來的，總會讓人看見井底存的是甚麼。"],["p","如果心真的是豆腐，刀子會慢慢變鈍。"],["p","所以，要換的不是嘴，是泉源。"],["q","第三步：從上頭來的智慧。"],["p","第十三節，雅各換了一個問題，又繞回第一節的師傅。"],["q","「你們中間誰是有智慧有見識的呢？他就當在智慧的溫柔上顯出他的善行來。」（3:13）"],["p","雅各說：好，那請你顯出來。不是講出來，是活出來。"],["p","這一節的重音在「溫柔」。"],["p","溫柔不是軟弱。溫柔是有力量，卻不拿來壓人。"],["q","一間開會的房間。最大聲的那個人，拍著桌子講了二十分鐘。"],["p","最後，一個一直在聽的弟兄，輕輕說了一句話。整個房間安靜下來。"],["p","智慧常常在第二個人身上。"],["p","然後，雅各把鏡頭從嘴巴移到心裡。"],["q","「你們心裡若懷著苦毒的嫉妒和紛爭，就不可自誇，也不可說謊話抵擋真道。」（3:14）"],["p","請你聽見那個「苦」字。三節之前，泉源發出苦水。"],["p","苦水的源頭，在這裡現形了：苦毒的嫉妒。"],["p","「紛爭」這個字，原來是指幫自己拉票、結黨的人。"],["p","誰來帶查經？誰的意見被採用？誰跟牧師比較親近？"],["p","小事裡面，藏著大火。"],["p","教會裡的派系，很少說自己是派系。它們總是說：我們是在維護真理。"],["p","雅各把它拆穿：嘴裡說為了真理，心裡是嫉妒，那就是「說謊話抵擋真道」。"],["q","「這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的，屬鬼魔的。」（3:15）"],["p","中間那個「屬情慾的」，原文的意思是「屬魂的」，靠天然生命的聰明。"],["p","請你聽清楚，雅各不是反對頭腦，不是反對讀書。"],["p","第一章他還叫我們向神求智慧。問題不在頭腦，在源頭。"],["p","最後一個「屬鬼魔的」，接回第六節：從地獄裡點著的。"],["p","嫉妒看起來只是人的小情緒。雅各說，背後有另一個國度在搧風。"],["q","「在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事。」（3:16）"],["p","心二意，舌頭不止息，群體一團亂。同一個病，三個樣子。"],["p","雅各不是叫我們去抓誰在嫉妒。是叫每一個人先照鏡子："],["q","我心裡的火，是從哪裡點著的？"],["p","然後，這一章最美的一節來了。"],["q","「惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。」（3:17）"],["p","從第六節的谷底，到第十七節的山頂，雅各只走了十一節。"],["p","舌頭「滿了」毒氣；智慧「滿有」憐憫。原文是同一個字。"],["p","同一個器皿，可以裝毒，也可以裝憐憫。看你從哪裡去裝。"],["p","請你看見次序。「先是清潔」。"],["p","清潔，就是不再二意。泉源先乾淨了，水才是甜的。"],["p","「後是和平」。和平不是第一步，和平是清潔長出來的。"],["p","為了和平犧牲真理，不是從上頭來的。為了真理犧牲和平，也不是。"],["p","最後兩個，「沒有偏見，沒有假冒」。對誰都一樣，裡外都一樣。"],["p","從上頭來的智慧，就是那顆不再分成兩半的心。"],["p","這八樣，使我們想起保羅寫的："],["q","「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。」（加 5:22--23）"],["p","雅各沒有提聖靈的名字。可是他描寫的智慧，和保羅描寫的果子，"],["p","是同一位，在人裡面工作的樣子。"],["p","所以請你記住：這八樣，不是你咬緊牙關做出來的。"],["p","第一章說了：各樣美善的恩賜，都是從上頭來的。"],["p","所以第一章說，缺少智慧的，要求那厚賜與眾人、也不斥責人的神。"],["p","神不嫌你問。你今天就可以求。"],["q","「並且使人和平的，是用和平所栽種的義果。」（3:18）"],["p","雅各用農夫的話收尾。義的果子是「種」出來的。"],["p","這又是哥哥的話："],["q","「使人和睦的人有福了！因為他們必稱為神的兒子。」（太 5:9）"],["p","一個教會的空氣若是和平的，那不是運氣。"],["p","是許多人在你看不見的地方，一次又一次，選了那一句溫柔的話。"],["p","真正的師傅，不是講得最多的人，是讓身邊越來越和平的人。"],["p","弟兄姊妹，聽到這裡，你可能會想：這一章我做不到。"],["p","雅各自己也說了，沒有人能制伏。"],["p","那麼，有沒有一張嘴，從來沒有發出過苦水？"],["p","有一位。"],["p","使徒彼得跟在他身邊三年，聽過他說的每一句話。彼得後來寫："],["q","「他並沒有犯罪，口裡也沒有詭詐。他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（彼前 2:22--23）"],["q","各各他，正午。一個人被釘在木頭上。"],["p","如果有一個人有權利咒詛，就是他。"],["p","可是從那一張口裡出來的，是這一句："],["q","「父啊！赦免他們；因為他們所做的，他們不曉得。」（路 23:34）"],["p","全世界最大的風，吹在那一艘船上。"],["p","那一片小小的舵，始終在父的手裡。"],["p","從他口裡出來的，只有一樣水。"],["p","弟兄姊妹，我們的泉源不是靠自己洗乾淨的。"],["p","是那一位口裡沒有詭詐的，為我們死，又用真道重新生了我們。"],["p","雅各曾經和家人以為哥哥癲狂了。後來，他一輩子活在哥哥的話裡。"],["p","一個弟弟的舌頭，被他的哥哥改變了。"],["p","我們的也可以。"],["p","我們回到開頭那句話。"],["p","下一次，當你想說「我就是刀子嘴，豆腐心」的時候，"],["p","請你停一下。不是去修嘴，是回頭看井。"],["p","我們團契常說：人比事重要，關係比東西重要。"],["p","雅各今天讓我們看見，這句話最先要落在哪裡——落在嘴上。"],["p","一句話可以燒掉一個關係，一句話也可以把一個人帶回港口。"],["p","這也是我們說「用心靠聖靈，不要用腦靠自己」的地方。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，想一想這個禮拜，你的舌頭最容易在哪一陣大風裡放開舵。"],["p","在那一陣風來之前，先禱告一句：主，舵在你手裡。"],["p","第二件，想一個你曾經用話燒過的人。"],["p","去跟他說一句你從上頭領受的話。也許只是一句：對不起，那天我說錯了。"],["p","如果你是那個被話燒過的人，"],["p","請你知道，你說出自己的傷，不是點火。主聽見了，我們也願意聽。"],["q","舵很小。可是握著舵的那一隻手，很大。"],["p","我們一起低頭禱告。"]]},"4":{"min":19,"blocks":[["h","《你們親近神，神就必親近你們》"],["p","弟兄姊妹平安，今天我們一起讀雅各書第四章。"],["p","我想請你先聽一段對話。"],["q","主日晚上，聚會散了。教會的停車場，路燈有一盞壞了。"],["p","兩位同工站在車旁邊，鑰匙拿在手上，誰也沒有上車。"],["p","一位先開口，聲音壓得很低。"],["q","「說真的，他根本不配帶小組。」"],["p","另一位點點頭，嘆了一口氣。"],["q","「你看他上週那個樣子。會開到一半，臉就垮下來。」"],["q","「我不是要說他壞話，我只是擔心小組。」"],["p","弟兄姊妹，這段對話裡，有沒有一句髒話？沒有。"],["p","他們甚至很認真，很屬靈，還說要禱告。"],["p","可是在那個停車場，路燈底下，擺了一張看不見的椅子。"],["p","兩個人都坐上去了。"],["q","那是審判官的椅子。"],["p","雅各書第四章，就是寫給這個停車場的。"],["p","它開頭問：這些仗是從哪裡來的？"],["p","它結尾問：你是誰，竟敢坐上那張椅子？"],["p","這一章有三個詞：爭，恩，霧。"],["p","我們走三步：爭戰從哪裡來，他賜更多的恩典，你是誰。"],["q","第一步：爭戰從哪裡來。"],["p","上一章最後一句，雅各剛說完和平。"],["q","「並且使人和平的，是用和平所栽種的義果。」（3:18）"],["p","下一口氣，他就問了一句很不和平的話。"],["q","「你們中間的爭戰鬥毆是從哪裡來的呢？」（4:1）"],["p","他剛講完從上頭來的智慧，就把鏡子轉過來，對準教會。"],["p","請注意，他說的是「你們中間」。"],["p","是會堂裡，同一張長凳上，彼此稱呼弟兄的那一群人。"],["p","因為環境太苦。因為那個人太難搞。因為他上週那個樣子。"],["p","雅各不收這些答案。他自己回答了。"],["q","「不是從你們百體中戰鬥之私慾來的嗎？」（4:1）"],["p","「戰鬥」這個字，原文是行軍作戰的字。"],["p","雅各說，有一支軍隊，駐紮在你的身體裡。"],["p","你和別人之間的那場仗，只是這支軍隊開到外面的前線。"],["p","城外的火，是城裡先著起來的。"],["p","他沒有替任何一方判輸贏。他叫每一個人，先往自己裡面看。"],["p","「私慾」這個字，原文是快感，是想要的那一份舒服。"],["p","想被看重。想贏。想要那個位子。想要別人照我的意思。"],["p","然後雅各往下講，講得很重。"],["q","「你們貪戀，還是得不著；你們殺害嫉妒，又鬥毆爭戰，也不能得。」（4:2）"],["p","在停車場裡，沒有人流血。可是有一個人的名字，被殺了一次。"],["q","「你們得不著，是因為你們不求。」（4:2）"],["p","第一個病：不求。"],["p","想要，就自己伸手去抓。因為心裡不相信，有人會給。"],["p","雅各的哥哥早就說過：你們祈求，就給你們。門是開的。"],["q","「你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中。」（4:3）"],["p","第二個病：妄求。"],["p","原文的意思是「壞壞地求」。不是字句不對，是方向不對。"],["p","神被當成一個倉庫。東西還沒拿到，已經想好要花在自己身上。"],["p","這樣的禱告，和百體中行軍的那支隊伍，是同一支。"],["p","這兩節不是說，每一個禱告沒有蒙應允的人，都是求錯了。"],["p","保羅三次求主挪去那根刺，主沒有挪去。"],["p","一位在病床邊為孩子流淚禱告的母親，你千萬不可以拿這節去對她說：你求錯了。"],["p","雅各是在對一群正在打仗的人說話。這是手術刀，不要拿去割沒有病的人。"],["p","不求，是不信神會給。妄求，是只要神的東西，不要神。"],["p","兩個病，同一個根：心裡的王位上，坐著自己的快樂。"],["p","下一節，雅各換了語氣。前面是診斷，這裡是先知的指控。"],["p","他給這群人取了一個名字。和合本照意思譯作「淫亂的人」，"],["p","旁邊的小字註明：原文是淫婦。"],["q","「豈不知與世俗為友就是與神為敵嗎？」（4:4）"],["p","在舊約先知的口中，神是以色列的丈夫，百姓是他的妻子。"],["p","何西阿娶了一個不忠的妻子，神說：這就是我和我百姓的故事。"],["p","所以這個字不是罵人下流。它問的是一件事："],["p","你的心，屬誰？"],["p","而且你要注意，只有丈夫，會因為妻子的心不在而痛。"],["p","雅各用這個字，是因為他知道，神和這群人之間有一份婚約。"],["p","所以這節經文，不可以拿來羞辱任何一位弟兄姊妹。"],["p","也不是一張禁止清單，說哪一種工作、哪一種音樂、哪一群朋友是世俗。"],["p","雅各書的「世俗」，是一套離開神排出來的價值。"],["p","人在哪裡工作，不是問題。心裡換了伴侶，才是問題。"],["p","同一位雅各說，不沾染世俗的人，是走進世界、去看顧孤兒寡婦的人。"],["p","用今天的話說，是停車場裡那兩位同工。是我們。"],["p","然後是全卷最難懂的一節。"],["q","「你們想經上所說是徒然的嗎？神所賜、住在我們裡面的靈，是戀愛至於嫉妒嗎？」（4:5）"],["p","今天在講台上，我只講一句大家都同意的話："],["q","神不肯和世界分享我們。"],["p","可是一個丈夫，不肯讓妻子被人帶走，那份心叫作愛。"],["p","神的忌邪，不是沒有安全感。是愛得太滿，容不下分享。"],["p","人的私慾在身體裡行軍。神的戀慕，在追回他的妻子。"],["p","弟兄姊妹，讀到這裡，鏡子已經照到最暗的地方了。"],["p","如果這封信寫到這裡就結束，我們只剩下羞愧。"],["p","從第一章到這裡，雅各寫了一長串的「要」和「不可」。"],["p","要喜樂。要行道。不可按外貌待人。要勒住舌頭。"],["p","而且你仔細數，從第一章第一節到這裡，雅各一次也沒有說過一個字。"],["p","那個字叫作：恩典。"],["p","然後，第六節的第一個字出來了。"],["q","但。"],["q","第二步：他賜更多的恩典。"],["q","「但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人。」（4:6）"],["p","一個「但」，把鏡頭從人的失敗，轉到神的手上。"],["p","前一節說，神的愛不肯分享。這一節說，神的恩典不會用完。"],["p","私慾很大，恩典更大。要求很高，恩典更多。"],["p","全卷第一次說出「恩典」，一說就是兩次，都在這一節。"],["p","然後他說：所以經上說。他引的是哪一段經上？"],["p","是箴言第三章。我們翻開和合本的箴言，那裡是這樣寫的："],["q","「他譏誚那好譏誚的人，賜恩給謙卑的人。」（箴 3:34）"],["p","你會發現前半句不一樣。這不是誰引錯了。"],["p","和合本箴言從希伯來文翻，雅各用的是當時的希臘文舊約。"],["p","兩個版本，說的是同一件事：神對驕傲的人，站在對面。"],["p","彼得寫信的時候，也引了同一個版本，同一句話。"],["p","「阻擋」這個字，原文是擺開陣勢，列隊對抗。"],["p","你還記得第一節嗎？私慾在你身體裡行軍。"],["p","現在，神也擺開了陣勢。"],["p","人若站在驕傲那一邊，就是站到了神的對面。"],["p","那恩典往哪裡去？往謙卑的人那裡去。"],["p","恩典像水，只往低處流。"],["p","弟兄姊妹，讀到這裡，我們要停一下。"],["p","因為我們團契有一句話，大家都會背。"],["p","國度321空中團契，每一次聚會，常常這樣說："],["q","謙卑是復興的鑰匙；神施恩給謙卑的人，阻擋驕傲的人。"],["p","原來我們每天說的那句話，是雅各從箴言抄給我們的。"],["p","而且請你看它在經文裡的位置。"],["p","這句話的前面，是一場爭戰。這句話的開頭，是「但他賜更多的恩典」。"],["q","先有恩典，才有謙卑。"],["p","謙卑不是一份工價，拿去換恩典。"],["p","謙卑是走下來，站到恩典流得到的地方。"],["p","那怎樣走下來？雅各一口氣給了好幾個命令。"],["q","「故此，你們要順服神。務要抵擋魔鬼，魔鬼就必離開你們逃跑了。」（4:7）"],["p","「順服」這個字，原文是排隊的字。排到某一位的下面。"],["p","排到神的下面，就是回到本位。"],["p","請你看這兩個命令的次序：先順服神，才抵擋魔鬼。"],["p","一個沒有排到神下面的人，去抵擋魔鬼，"],["p","像一個逃兵，獨自去攻城。"],["p","他不是在神的陣營裡打仗，是在自己的私慾裡打仗。"],["p","魔鬼這個字，原文的意思是控告者，是離間的那一位。"],["p","他最會的，不是嚇人。是把人和神、人和人分開。"],["p","停車場那一晚，他甚至不用出場。兩位同工自己就完成了。"],["p","雅各的方法就是：回到神下面的位子。"],["p","魔鬼要攻的，是那個坐在王位上的自己。"],["p","那個自己，下來了，牠就沒有陣地了。"],["q","一個孩子站在父親身後，追他的人自然退去。退去的原因，不是孩子的拳頭。"],["p","團契常說：無己戰勝撒但。這一節，就是它的經文。"],["p","得勝，不是因為我變強了。是因為我站對了位置。"],["p","再往下，是這一章的章題。"],["q","「你們親近神，神就必親近你們。」（4:8）"],["p","神沒有站在遠處，等你變乾淨了，才肯見你。"],["p","他說：你來，我就來。"],["p","然後是兩個很直接的稱呼。"],["q","「有罪的人哪，要潔淨你們的手！心懷二意的人哪，要清潔你們的心！」（4:8）"],["p","「心懷二意」，原文是「兩個魂的」。一顆心，分成兩半。"],["q","「心懷二意的人，在他一切所行的路上都沒有定見。」（1:8）"],["p","請你看藥方放在哪裡。它緊緊跟在「親近神」的後面。"],["p","一顆二意的心，不是在書桌前咬緊牙關修好的。"],["p","是在親近神的時候，被清潔的。"],["p","一塊濕布，不是自己擰乾的。是放在太陽底下，被曬乾的。"],["p","我們只能把那顆兩半的心，帶到神面前。"],["p","智慧從上頭來，恩典從上頭來，連一顆清潔的心，也是從上頭來的。"],["p","接著是一句讓人不舒服的話。"],["q","「你們要愁苦、悲哀、哭泣，將喜笑變作悲哀，歡樂變作愁悶。」（4:9）"],["p","這不是說基督徒不可以笑。"],["p","雅各要的，不是一張苦臉。是一顆終於為自己痛起來的心。"],["p","同一位雅各，在第一章說要以為大喜樂，在這裡卻叫人哭。"],["p","你在喪親、病痛、失敗的時候哭，不是你不屬靈。雅各給眼淚留了位子。"],["q","「務要在主面前自卑，主就必叫你們升高。」（4:10）"],["p","重點在四個字：主就必。"],["p","人只管低下去。升高，是主的事。"],["q","「凡自高的，必降為卑；自卑的，必升為高。」（太 23:12）"],["p","團契說「反敗為勝」，不是靠技巧翻盤。"],["p","是走主走過的那條路：先往下，主再把人舉起來。"],["p","雅各講完自卑，下一句就落到最日常的地方。"],["p","驕傲最常見的樣子，就是停車場裡的那一句話。"],["q","第三步：你是誰。"],["q","「弟兄們，你們不可彼此批評。」（4:11）"],["p","「批評」這個字，原文是背著人說話。在人背後，往下說。"],["q","「人若批評弟兄，論斷弟兄，就是批評律法，論斷律法。」（4:11）"],["p","我批評一個弟兄，怎麼會變成批評律法？"],["p","因為律法要我愛鄰舍如同自己。"],["p","那一刻，我不再站在律法下面，作一個遵行的人。"],["p","我坐到律法上面，作了裁判。"],["q","「設立律法和判斷人的，只有一位，就是那能救人也能滅人的。你是誰，竟敢論斷別人呢？」（4:12）"],["p","只有一位。只有那能救人的，才有資格定人的罪。"],["p","我們救不了任何人，所以我們也坐不了那張椅子。"],["q","你是誰？"],["p","弟兄姊妹，這是全本新約，對驕傲最生活化的一個定義。"],["p","團契常說：驕傲，就是離開本位，抓住權力，想要代替神。"],["p","可是雅各給了它一張臉。"],["p","一個主日晚上，停車場，兩個拿著車鑰匙的同工。"],["p","第七節叫我們排到神的下面。第十二節揭穿我們想坐到神的位子上。"],["p","可是我也要很清楚地說另一面。"],["p","這兩節，不是叫教會閉嘴。"],["p","雅各在信的最後，要我們去找那個失迷的弟兄，使他回轉。"],["p","一個受了傷的人說出他的遭遇，不是論斷。"],["p","一位會友提出合理的問題，一位同工指出制度的錯，也不是論斷。"],["p","那勸戒和論斷，差在哪裡？我說三個分別。"],["p","一，動機。我是為了把他找回來，還是為了證明我對？"],["p","二，方法。是當面、私下、溫柔，還是背後、成群、刻薄？"],["p","三，位子。我是站在弟兄旁邊，還是坐在審判官的椅子上？"],["p","回到停車場。如果他們真的擔心那位小組長，"],["p","最好的那一步，不是在路燈下講十分鐘。"],["p","是第二天打一通電話給他：「上週你好像很累，你還好嗎？」"],["q","論斷是坐著說的。勸戒是走過去說的。"],["p","然後雅各從嘴巴，轉到行事曆。"],["q","「今天明天我們要往某城裡去，在那裡住一年，做買賣得利。」（4:13）"],["p","這句話裡沒有一個字是罪。跑城做生意，是散住的猶太人的日常。"],["p","規劃、經商、賺錢，雅各一個字也沒有禁止。"],["p","錯在哪裡？錯在主詞。"],["p","神不在這張行事曆上。"],["p","這和停車場是同一顆心。一個坐上了審判的椅子，一個坐上了明天的椅子。"],["q","「其實明天如何，你們還不知道。你們的生命是甚麼呢？你們原來是一片雲霧，出現少時就不見了。」（4:14）"],["p","冬天的早晨，你站在公車站，呼出一口白氣。看得見，卻抓不住。"],["p","可是弟兄姊妹，這一節一定要接著下一節讀。"],["p","雲霧，不是說生命沒有價值。是說生命不在我手裡。"],["q","「你們只當說：主若願意，我們就可以活著，也可以做這事，或做那事。」（4:15）"],["p","雲霧般的生命，不是被丟在風裡。它在主的手裡。"],["p","「主若願意」，不是宿命，也不是叫人不必規劃。"],["p","城照去，生意照談，計畫照做。只是主詞換了。"],["p","團契說「讓耶穌作王」。最具體的樣子，就在這裡。"],["q","讓耶穌作王，就是讓「主若願意」出現在你的行事曆上。"],["p","是在排定明天之前，先承認：明天不是我的。"],["p","如果今天有人聽到「一片雲霧」，心裡覺得，那活著還有甚麼意思，"],["p","請你聽我說：這不是這段經文的意思。你的生命，正是主所願意的。"],["p","請你今天就找一個人說出來。教會願意陪你，也會陪你去找專業的幫助。"],["q","「現今你們竟以張狂誇口；凡這樣誇口都是惡的。」（4:16）"],["p","它不一定說大話。只是在每一個計畫裡，都忘了神。"],["p","然後是全章最後一句。"],["q","「人若知道行善，卻不去行，這就是他的罪了。」（4:17）"],["p","罪，不只是做了不該做的。也是沒有做該做的。"],["p","這句話不是要你焦慮地數算每一件沒做的好事。"],["p","它放在「主若願意」的後面。"],["p","一張讓主作王的行事曆，自然會留出一格，給那件神放在你眼前的善事。"],["p","比如說，明天，給那位小組長打一通電話。"],["p","爭戰，從坐在自己心裡王位上的那個我來。"],["p","恩典，往下流，流到走下來的人那裡。"],["p","雲霧，提醒我明天的那張椅子，也不是我的。"],["p","可是第十二節說，那張審判的椅子，有一位是真的有權坐的。"],["p","那能救人也能滅人的。全宇宙只有他有權。"],["p","福音告訴我們，他做了甚麼？"],["p","他從那張椅子上站起來，走下來。"],["q","「既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。」（腓 2:8）"],["p","能滅人的那一位，選擇了救人。"],["p","他在客西馬尼園，也說了他的「主若願意」："],["q","「然而，不要照我的意思，只要照你的意思。」（太 26:39）"],["p","他自己在父面前自卑到底。所以父把他升為至高。"],["p","所以我們可以放心往下走，因為那條路上，他已經走在前面。"],["p","雅各曾經和家人以為哥哥癲狂了。後來，他一輩子活在哥哥的話裡。"],["p","請你記得雅各的哥哥。那位本來可以坐著審判，卻走下來救人的主。"],["p","這個禮拜，我請你做兩件小事。"],["p","第一件：下一次，你發現自己在背後講一個人，請你停下來，問自己一句："],["q","我是誰？"],["p","然後把那十分鐘，換成一通電話，或一句當面、溫柔的關心。"],["p","第二件：打開你的行事曆，在這個禮拜最重要的那一格旁邊，寫四個字："],["q","主若願意。"],["p","如果你今天覺得，自己就是停車場裡的那個人，"],["p","請你記得第六節的第一個字：但。"],["p","他賜更多的恩典。你往前一步，神就往前一步。"],["p","我們一起低頭禱告。"]]},"5":{"min":19,"blocks":[["h","《農夫忍耐等候地裡寶貴的出產》"],["p","弟兄姊妹平安，今天我們一起讀雅各書第五章，也是這卷書的最後一章。"],["p","今天我想請你看一個畫面。請你看慢一點，看久一點。"],["q","一塊田。傍晚。一位農夫站在田邊。"],["p","他的褲腳上還有泥。手上的繭很厚。"],["p","地，他已經犁過了。種子，他已經撒下去了。"],["p","現在，他抬起頭，看天。"],["p","我們就停在這裡。不要動，看著他。"],["p","他在等雨。可是雨，不在他手裡。"],["p","他能做的，只有兩件事。"],["q","等。和繼續拔草。"],["p","請你看他的手。他沒有把手插在口袋裡。"],["p","他彎下腰，把一根草拔起來，丟到田埂上。"],["p","等候，對他來說不是坐著。等候本身就是工作。"],["p","雅各書第五章，就站在這塊田邊。"],["q","「看哪，農夫忍耐等候地裡寶貴的出產，直到得了秋雨春雨。」（5:7）"],["p","可是雅各沒有一開始就帶我們到田邊。他先帶我們去看另一塊田。"],["p","那塊田也有人在收割。只是收割的人，沒有拿到工錢。"],["p","這一章有三個詞：銹，雨，回。"],["p","我們走三步：工錢有聲音；農夫的忍耐；彼此代求。"],["q","第一步：工錢有聲音。"],["q","「嗐！你們這些富足人哪，應當哭泣、號咷，因為將有苦難臨到你們身上。」（5:1）"],["p","請你留意一件事。這一節，雅各沒有叫「弟兄們」。"],["p","這卷書他叫了十五次「弟兄們」。到這裡，忽然不叫了。"],["p","因為這裡的語氣換了。像一位先知站在城門口，對著城外的人喊。"],["p","「號咷」這個字，新約只出現這一次。那是先知書裡審判日的哭聲。"],["p","他要他們知道一件事：你們的苦，神不是沒看見。"],["p","接著雅各列出三樣東西。"],["q","「你們的財物壞了，衣服也被蟲子咬了。」（5:2）"],["q","「你們的金銀都長了銹；那銹要證明你們的不是，又要吃你們的肉，如同火燒。」（5:3）"],["p","可是弟兄姊妹，金子是不會生銹的。"],["p","雅各故意這樣說。連你以為最不會壞的，在神眼中也已經壞了。"],["p","這裡有一個字，我想讓你帶回去。「銹」。"],["p","原文是 ἰός。同一個字，第三章用過。那裡說舌頭「滿了害死人的毒氣」。"],["q","在舌頭上，它叫毒。在錢財上，它叫銹。"],["p","都是神給的好東西，不往神要的方向流出去，就在裡面發壞。"],["p","銹是一種很安靜的審判。它不需要賊，不需要火。"],["p","它只需要兩樣東西：時間，和不流動。"],["p","然後，是這一段最重的一節。"],["q","「工人給你們收割莊稼，你們虧欠他們的工錢，這工錢有聲音呼叫，並且那收割之人的冤聲已經入了萬軍之主的耳了。」（5:4）"],["p","請你看這句話的主詞。不是工人在喊。是工錢在喊。"],["p","被扣住的錢，自己有了聲音。"],["p","「虧欠」，原文的意思是扣住、拖著不給。不一定是搶。常常只是：再等等，下個月吧。"],["p","可是摩西的律法早就寫了。"],["q","「雇工人的工價，不可在你那裡過夜，留到早晨。」（利 19:13）"],["p","為甚麼要這麼急？因為那份工錢，就是那一家人今晚的飯。"],["p","天上萬軍的主，彎下身來，聽一個收割工人沒說出口的冤。"],["p","而且原文是完成式：已經聽見了。不是將來會聽見，是已經進到他耳朵裡了。"],["p","弟兄姊妹，講到這裡，我們最容易做的一件事，就是看向別人。"],["p","可是雅各在第二章，已經先照過教會自己了。"],["q","「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）"],["p","所以這一段，我要先照我們自己。"],["p","教會也是雇主。我們的傳道同工、清潔的阿姨、晚上的保全、外包來修冷氣的師傅，"],["p","他們的工錢，也在 5:4 之下。"],["p","準時嗎？足額嗎？加班有算嗎？給的時候，有尊嚴嗎？"],["q","準時、足額、有尊嚴地付工錢，就是在職場上敬拜。"],["p","雅各點名的，是積攢，是欠薪，是奢華，是用法庭把窮人的生計吃掉。"],["p","財富本身不是罪，可是財富有方向。它要嘛流出去，變成別人桌上的飯。要嘛堆起來，發銹。"],["p","還有一句話，我要說清楚。"],["p","如果你的老闆拖欠你的工錢，教會不會只對你說一句「要順服，要忍耐」。"],["p","「要順服老闆」，不能拿來勸人忍受違法的欠薪。把欠薪說成一種奉獻，更是錯的。"],["p","一個被欠薪的弟兄來到教會，他需要的，是有人陪他去討回公道。"],["p","雅各接著寫下這一段的最低點。"],["q","「你們在世上享美福，好宴樂，當宰殺的日子竟嬌養你們的心。」（5:5）"],["p","外面有人在哭，裡面的人在把自己的心養胖。"],["q","「你們定了義人的罪，把他殺害，他也不抵擋你們。」（5:6）"],["p","「抵擋」這個字，和第四章是同一個字。"],["q","「神阻擋驕傲的人，賜恩給謙卑的人。」（4:6）"],["p","義人看起來沒有反抗。可是神會。"],["p","受欺壓的人不必自己去報復，因為有一位在抵擋。"],["p","好。被欠薪的工人聽到這裡，心裡會問：那我們現在怎麼辦？"],["p","雅各的回答，是一個「所以」。他帶我們，回到開頭那塊田邊。"],["q","第二步：農夫的忍耐。"],["q","「弟兄們哪，你們要忍耐，直到主來。」（5:7）"],["p","你聽見了嗎？「弟兄們」回來了。"],["p","「忍耐」這個字，原文是 μακροθυμέω。字面的意思，是「心長」。"],["p","對人，心長，就是不急著發怒。對時間，心長，就是不急著收割。"],["p","雅各對被欺壓的人說的，不是「認了吧」。是「把心放長」。"],["p","然後，他指著那塊田。"],["q","「看哪，農夫忍耐等候地裡寶貴的出產，直到得了秋雨春雨。」（5:7）"],["p","兩場雨中間，是很長的一段晴天。農夫能做的，就是等。"],["p","可是請你記得開頭那個畫面。他不是躺著等。他在拔草。"],["q","忍耐不是認輸。是把審判交給主，把今天的田照顧好。"],["p","我順便說一件事。「秋雨春雨」，在這裡是農夫的日曆。"],["p","不是末世的時間表。不要把它講成甚麼第一波、第二波聖靈澆灌的預告。雅各沒有這樣做。"],["q","「你們也當忍耐，堅固你們的心，因為主來的日子近了。」（5:8）"],["p","請你把這一節，和剛才的 5:5 放在一起聽。"],["p","富足人「嬌養你們的心」。弟兄們「堅固你們的心」。"],["p","然後是那兩個字：近了。"],["p","有人會問：兩千年了，還算近嗎？"],["p","雅各說「近」，不是叫我們去算日子。講台上也不算日子。"],["p","像一個孩子知道爸爸已經在回家的路上。他不會去算還有幾公里。"],["q","他會把房間收好。"],["p","「近了」的意思，是今天就不埋怨，今天就忍耐，今天就把房間收好。"],["q","「弟兄們，你們不要彼此埋怨，免得受審判。看哪，審判的主站在門前了。」（5:9）"],["p","你不能對老闆發脾氣，回到家，就對太太嘆氣。"],["p","「埋怨」，原文就是嘆氣，低聲的那一種。"],["p","雅各說：這也是論斷。而那位審判的主，已經站在門口了。"],["p","堅固的心，就是不讓等候變成苦毒的心。"],["p","接著，雅各給了我們幾位一起等候的人。"],["q","「弟兄們，你們要把那先前奉主名說話的眾先知當作能受苦能忍耐的榜樣。」（5:10）"],["p","農夫等的是雨。先知等的是百姓回轉。"],["p","然後，是第三位。他等的，是神開口。"],["q","「你們聽見過約伯的忍耐，也知道主給他的結局，明顯主是滿心憐憫，大有慈悲。」（5:11）"],["p","他咒詛自己的生日。他和朋友吵。他對著天，問了一連串的為甚麼。"],["p","這裡的「忍耐」，原文是 ὑπομονή，意思是「留在底下」。"],["p","約伯的忍耐，不是不出聲。是沒有離開。"],["p","他一面哭，一面抓著神。抓得很痛，可是沒有放手。"],["p","所以，如果你這段日子很難過，你可以難過。你可以問神為甚麼。"],["q","只是，不要離開。"],["p","然後雅各說：你們也知道主給他的結局。"],["p","雅各要我們看的，不是約伯多堅強。是約伯的結局說明了一件事。"],["q","主是滿心憐憫，大有慈悲。"],["p","弟兄姊妹，這一句，是整卷雅各書的最高點。"],["p","「滿心憐憫」，原文是 πολύσπλαγχνος，新約只出現這一次。"],["p","它的字根，是心腸、肺腑。就是福音書裡說耶穌看見群眾「動了慈心」的那個字。"],["p","一封命令最多的信，五十幾個「要」和「不可」，最高的地方，不是一條命令。"],["q","是神的心腸，很大。"],["p","忍耐，就是在還沒看見結局的時候，相信那個結局。"],["p","然後雅各說了一句，聽起來好像換了話題的話。"],["q","「我的弟兄們，最要緊的是不可起誓……你們說話，是，就說是；不是，就說不是，免得你們落在審判之下。」（5:12）"],["p","這幾乎和主耶穌在山上說的，一字不差。"],["p","一個曾經和家人以為哥哥「癲狂了」的弟弟，後來一輩子，活在哥哥的話裡。"],["p","雅各把它放在忍耐後面，因為被逼到牆角的人，最容易發誓。"],["p","「我發誓我沒有拿。」「我對天發誓，騙你天打雷劈。」"],["p","雅各說：不需要。審判的主就站在門口，你的每一句話，本來就在他面前。"],["p","你不必搬天地來替你作保。你的「是」，就是「是」。"],["p","雅各要的，是一種很簡單的誠實。"],["p","家裡的一句「好」。群組裡的一句「我會到」。公司裡的一句「下週交」。"],["p","一個人的「是」可以信，他就不需要發誓。"],["p","好，田邊的農夫，我們看完了。忍耐，是在時間裡站穩。"],["p","可是等候的日子裡，人會生病。人會軟弱。人會走丟。"],["p","所以雅各最後一段，讓我們從田邊，走進一間屋子。"],["q","第三步：彼此代求。"],["q","「你們中間有受苦的呢，他就該禱告；有喜樂的呢，他就該歌頌。」（5:13）"],["p","人生大概就這兩種天氣：苦的時候，樂的時候。"],["p","雅各說，兩種天氣，都可以向神開口。"],["p","苦的時候，禱告。你可以哭著禱告。雅各沒有叫你假裝不痛。"],["p","然後，他講到受苦的一種：生病。"],["q","「你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。」（5:14）"],["p","這一節裡，有三個很溫柔的細節。"],["p","先看第一個：主動的是病人。他「請」，長老們「來」。"],["p","再看第二個：來的是「長老們」，複數。不是一位明星，是一群同工。"],["p","醫治的禱告，是群體的事。"],["p","第三個：「用油抹他」。這個字，原文是 ἀλείφω，是日常的塗抹、敷藥。"],["p","可是有一件事，大家都同意：油不是魔法。是「奉主的名」。"],["q","「出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。」（5:15）"],["p","這一節，常常被讀成一個公式：信心夠，病就好。"],["p","請你再看一次句子。是誰叫他起來？"],["q","主必叫他起來。叫人起來的是主。"],["p","不是信心的分數。不是禱告的音量。是主。"],["p","所以我要很清楚地說：病沒有好，並不是因為你的信心不夠。"],["p","希伯來書第十一章的信心名單裡，有人得醫治，也有人忍受嚴刑。他們同樣是因著信。"],["p","神能醫治，也常醫治。可是他的作為，不是由我們的分數決定的。"],["p","也請你記得：禱告和醫藥，都是神的恩典。"],["p","請長老來禱告，也請你繼續看醫生，繼續照醫囑吃藥。兩樣並行，一點都不衝突。"],["p","再看下半句：「他若犯了罪」。"],["p","請聽那個「若」字。病和罪，不一定有關係。常常是沒有關係的。"],["p","門徒也曾經問耶穌，這人生來瞎眼，是誰犯了罪？耶穌說：都不是。"],["p","所以，不要站在病床旁邊，盤問一個病人：「你是不是有甚麼罪沒有認？」"],["q","那不是雅各的意思。那是約伯的朋友的意思。"],["q","「所以你們要彼此認罪，互相代求，使你們可以得醫治。」（5:16）"],["p","請你聽這兩個詞：彼此，互相。"],["p","不是一個人跪在台前，一群人坐著聽。是兩個人，面對面，互相。"],["p","認罪的目的，是被代求。不是被審判。"],["p","所以這件事，有幾條線我們一定要守住。"],["p","它是自願的。沒有人可以逼問你的隱私。"],["p","它是在可以信任的關係裡。不是在大群人面前公開認罪，也不是小組裡輪流交代。"],["p","它是保密的。別人對你說的，你不轉述。不拿去當代禱事項傳出去。"],["p","還有，如果你是受傷害的那一位，你不必去向傷害你的人認罪求和好。"],["p","如果有暴力、性侵、或兒童受傷害的事，第一件事是保護安全，依法處理。"],["p","想像一個人鼓起勇氣，對一位信得過的弟兄說出藏了多年的軟弱。那位弟兄沒有皺眉，沒有說教。他說：來，我為你禱告。"],["q","「義人祈禱所發的力量是大有功效的。」（5:16）"],["q","「以利亞與我們是一樣性情的人，他懇切禱告，求不要下雨，雨就三年零六個月不下在地上。」（5:17）"],["p","「一樣性情」。以利亞會怕，會累。他曾經躺在羅騰樹下，求神取他的性命。"],["p","一個會想放棄的人，他的禱告，可以關天，也可以開天。"],["p","所以禱告的力量，不在禱告的人。在聽禱告的神。"],["q","「他又禱告，天就降下雨來，地也生出土產。」（5:18）"],["p","這一場雨，是在迦密山頂求來的。"],["p","他禱告，叫僕人去看海。一次，兩次……第七次，海上才起了一小片雲，像人的手那麼大。"],["p","「大有功效」，常常不是一次就成。是一次又一次，沒有停。"],["p","弟兄姊妹，你有沒有發現，我們又回到雨了。"],["p","這卷書說，各樣美善的恩賜，都是從上頭來的。"],["q","全卷最後一樣從上頭來的，是雨。"],["p","人不能造雨。人只能求，只能等。"],["p","行道，勒住舌頭，謙卑，忍耐，到最後，都是同一個姿勢：抬頭，向上領受。"],["p","然後，雅各寫下了最後兩節。"],["q","「我的弟兄們，你們中間若有失迷真道的，有人使他回轉，」（5:19）"],["q","「這人該知道：叫一個罪人從迷路上轉回便是救一個靈魂不死，並且遮蓋許多的罪。」（5:20）"],["p","然後，信就結束了。"],["p","沒有問安。沒有祝福。沒有「願恩惠與你們同在」。"],["q","最後一筆，是一個任務。"],["p","這一面鏡子，照了五章。試煉裡的心，弟兄面前的手，說話的口，神面前的謙卑，等候裡的忍耐。"],["p","照完了，雅各沒有說：好，繼續照你自己。"],["p","他說：去。去找那個走失的人。"],["p","要用智慧的溫柔。不坐審判官的位子。"],["p","使人回轉，不是去論斷他。是站到他旁邊，陪他走回來。"],["p","動機，是把人找回來。方法，是當面、私下、溫柔。位子，是弟兄，不是法官。"],["p","弟兄姊妹，請你留意第五章的次序。這個次序很重要。"],["p","雅各先說：主是滿心憐憫，大有慈悲。"],["p","然後說：義人祈禱所發的力量是大有功效的。"],["p","最後才說：去叫一個罪人從迷路上轉回。"],["q","先被憐憫。再禱告。然後出去。"],["p","一個沒有先被主的憐憫找到的人，去找別人的時候，多半帶著責備。"],["p","一個被找回來過的人，才知道那條回家的路怎麼走。"],["p","寫這封信的人，就是被找回來過的。"],["p","他曾經和家人以為哥哥癲狂了。他曾經不信。是復活的主，親自向他顯現，把他找回來。"],["p","我們團契常說 920：那個走失的弟兄，是你的 2。"],["p","雅各書的最後一筆，就是這一句。"],["p","請你現在想一個名字。一個以前常來，現在很久沒有出現的人。"],["p","這一週，不必等到你自己很屬靈了才去。"],["p","先為他禱告。然後傳一句話給他。就說：我想起你，我在為你禱告。"],["p","我們要陪伴每一個人，成為得勝者。得勝者不是一路沒有傷的人。"],["p","是走到結局的時候，發現那位主，一直是滿心憐憫的人。"],["p","最後，請你再看一次開頭那個畫面。"],["q","田邊。傍晚。農夫抬頭看天。"],["p","天還是藍的。雨還沒有來。"],["p","可是這一次，請你看見他身邊還有一個人。"],["p","一個本來走丟了的人，他去把他找了回來。現在兩個人一起彎下腰，拔草。"],["p","一起抬頭，看天。"],["p","雨，會來的。因為給雨的那一位，是滿心憐憫，大有慈悲的主。"],["p","這位主，在等候的日子裡，親自為我們走過了最長的一段路。"],["p","他被定罪，被殺害，沒有抵擋。第三天，神叫他起來。"],["p","所以我們可以忍耐。我們可以禱告。我們可以出去找人。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——散住的十二支派是誰？一封像箴言的信怎樣讀？","r":"1:1；2:2--6；5:4；5:19--20","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前 ISS00_1），本卷補述：受書人是散居各地、貧窮受欺壓的猶太信徒，處境是一種生活，不是一件事件；格言一句一句可以背，不可以單獨用。雅各書沒有寫給一間教會、沒有點名任何人、也沒有一個要解決的具體事件，命令句又特別多，最容易被讀成一本「基督徒守則」，或被拆成一句一句拿來壓人。這封信寫給誰、為甚麼像箴言、今天散住的人在哪裡，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：使徒時代的書信是寫給特定地區、特定年代、遇到特定問題的信徒；讀信的人要先找出作者的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：散住的人遇到甚麼？雅各從福音推出甚麼原則？今天這原則落在哪裡？</p><p>本卷要補的是兩件事。第一，受書人：「作神和主耶穌基督僕人的雅各請散住十二個支派之人的安」（1:1）——沒有城名、沒有教會名，是一群散在各地的人。信裡透露他們的處境：在會堂式的聚會裡聚集（2:2），多半貧窮，被富足人「欺壓你們、拉你們到公堂去」（2:6），做工收割卻被「虧欠他們的工錢」（5:4）。第二，文體：短句、比喻、關鍵字一句接一句，全卷一百零八節，命令句超過五十個，讀起來像箴言。</p><p><strong>經文問的是：這封信的處境是甚麼？是一場異端、一件事件，還是一種生活？一封像箴言的信，可以一句一句拿出來用嗎？今天散住的人在哪裡？</strong></p>"],["字面族裔說（寫給散居巴勒斯坦以外的猶太基督徒）","","<p>認為「十二個支派」就是字面上的以色列人，「散住」就是散居巴勒斯坦以外的猶太人；受書人是信了耶穌的猶太信徒，很可能是司提反殉道以後被趕散的那一群（這使我們想起徒 8:1；11:19 的「分散」與「四散」）。這派的優點是貼近信裡的線索：聚會的地方叫「會堂」（2:2），引經以舊約與律法為共同語言，全卷沒有一句處理外邦人守不守律法的問題，而且耶路撒冷教會的雅各正是負責「往受割禮的人那裡去」的人（加 2:9）。</p><p><strong>難處：</strong>若只停在字面族裔，今天的外邦信徒會覺得這封信是寫給別人的；而且信裡處理的問題——偏心、舌頭、爭競、驕傲、計畫——一點也不專屬於猶太人。這派需要再往前走一步，說出這個處境在今天的對應。</p>"],["屬靈以色列說（「十二支派」是全體教會的稱呼）","","<p>認為「十二個支派」是把教會看成新的以色列，「散住」是說信徒在世上都是寄居的（這使我們想起彼前 1:1 同一個字）；所以雅各書是寫給普世教會的一封公函，不限族裔。這派的優點是讓全卷直接對今天的每一位信徒說話，也符合雅各書被列在「普通書信」裡的傳統。</p><p><strong>難處：</strong>若一開始就把「十二支派」全部屬靈化，信裡那些很具體的社會處境——被拉到公堂、被欠薪、窮人穿骯髒衣服進會堂——就容易被講成抽象的比喻，雅各對窮人與做工的人那份很具體的關懷就淡掉了。而且雅各在 2:2 用的是「會堂」，不是他在 5:14 用的「教會」，顯示他心裡想的是一個具體的群體。</p>"],["道德格言集說（全卷沒有處境，只是一串箴言）","","<p>部分近代學者認為雅各書是一本「勸世文集」，像箴言或猶太智慧文學，一句一句獨立，沒有一條貫穿的處境，也沒有清楚的結構。這派的優點是正確看見了雅各書的文體：短句、比喻、關鍵字接龍（1:1 問安的「安」接 1:2 的「喜樂」，1:3 的「忍耐」接 1:4 的「忍耐」），一句一句可以背，也很適合小組逐句默想。</p><p><strong>難處：</strong>若全卷沒有處境，每一句就可以被隨意拿出來用在任何人身上——「不要多人作師傅」拿來壓制提問的人，「勒住舌頭」拿來叫受害者閉嘴，「信心沒有行為也是死的」拿來嚇唬為自己不夠好而流淚的人。雅各全卷十五次稱呼「弟兄們」（其中十一次是「我的弟兄們」），每一句格言都是放在這個關係裡說的；拿掉關係，格言就成了刀子。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補兩段：第一，受書人是散居各地、多半貧窮、被欺壓、在會堂式的小聚會裡聚集的猶太信徒；所以這封信的處境不是異端，也不是一件具體的事件，是一種生活——在異鄉、在貧窮、在試煉裡，怎樣活出信心。第二，這是一封像箴言的信：格言一句一句可以背，不可以單獨用，每一句都要放回「我的弟兄們」的關係裡。</strong></p><p>本講義以字面族裔說為起點，吸收屬靈以色列說的應用：先讓一世紀那群散住的人站穩，再問今天誰是散住的人；道德格言集說看見了文體，但本講義不採用它「沒有處境」的結論。全卷的一條線把這些格言串起來：從「心懷二意」（1:8）到「清潔你們的心」（4:8），中間是一句「但他賜更多的恩典」（4:6）。</p><p><strong>今天散住的人，就是每一位在異鄉工作、讀書、照顧家人的華人信徒——也是國度321空中團契散在世界各國的弟兄姊妹。</strong>全卷的落點都照這一條量：一位散住的信徒，怎樣在家、教會門口、職場、群組裡的一句話、行事曆與病床旁，活出一個不分成兩半的心？</p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，知道這封信寫給誰，正是一種安慰。神在新約裡為「散住的人」預備了一整封信：不是寫給最有地位、最穩定的人，是寫給在異鄉做工、被欠薪、在聚會裡被安排坐在腳凳下邊的人。雅各一開口就說：「我的弟兄們，你們落在百般試煉中，都要以為大喜樂」（1:2）——他先稱你弟兄，才給你命令。</p><p>如果你讀雅各書覺得一句比一句重，請記得這些命令都是寫給「我親愛的弟兄們」（1:16）的，而且全卷的最高點不是任何一條命令，是「主是滿心憐憫，大有慈悲」（5:11）。<strong>一封命令最多的信，最高點是神的憐憫。</strong></p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。雅各書寫給散居各地、貧窮受欺壓的猶太信徒；處境不是異端，是一種生活：在異鄉、在貧窮、在試煉裡怎樣活出信心。這是一封像箴言的信——格言一句一句可以背，不可以單獨用，每一句都要放回「我的弟兄們」的關係裡。","care":"席上會有在異鄉打工、讀書、陪讀、照顧年邁父母的人，有剛失業、被欠薪、在職場被看低的人，也有曾經被人拿雅各書一句話當面數落過的人。講「散住的人」時，先讓他們知道雅各是稱他們弟兄、為他們說話的；牧者要陪他們從 1:2–5 讀起：試煉裡可以求智慧，神「厚賜與眾人、也不斥責人」。不要把雅各書講成一份檢查表、一條一條對照會友；也不要從全卷抽出一句格言，在小組或群組裡對準某個人。"},{"id":"ISS00_2","t":"信心與行為、稱義——雅各與保羅矛盾嗎？我的行為不夠好，我得救了嗎？","r":"2:14--26；1:22--25；4:6","ch":[],"why":"二、得救本乎恩、也因著信；但叫人得救的信心從來不是孤單的；兩個方向的錯都要指出（靠行為得救／沒有行為的信心）——本講義的全卷立場之二（本卷新立；與加拉太書立場二相接）。2:24 與羅 3:28 並排放，是新約最常被拿來說「聖經自相矛盾」的一組經文；教會裡也有兩種人會被這一段傷到：為自己行為不夠好而懷疑得救的人，和拿「因信稱義」當作冷眼看飢寒弟兄藉口的人。這一段是全卷最重要的神學段落，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>兩句話並排放：「這樣看來，人稱義是因著行為，不是單因著信」（2:24）；「所以我們看定了：人稱義是因著信，不在乎遵行律法」（羅 3:28）。而且兩個人引用同一節經文、同一位人物：「亞伯拉罕信神，這就算為他的義」（2:23；羅 4:3）。</p><p>經文自己先說了五件事：<strong>雅各問的是「說」出來的信心</strong>——「若有人說自己有信心，卻沒有行為，有甚麼益處呢？」（2:14）；<strong>雅各舉的行為是愛</strong>——給赤身露體、缺了日用飲食的弟兄姊妹吃穿（2:15–16），喇合接待使者（2:25），不是割禮、守節、飲食的律法行為；<strong>雅各說的亞伯拉罕有兩個時刻</strong>——創 15 信神算為義，三十多年後創 22 獻以撒，「信心因著行為才得成全」（2:22），而「這就應驗經上所說」（2:23）；<strong>雅各自己相信恩典</strong>——「他按自己的旨意，用真道生了我們」（1:18），「但他賜更多的恩典」（4:6）；<strong>保羅自己也要求行為</strong>——「惟獨使人生發仁愛的信心才有功效」（加 5:6）。</p><p><strong>經文問的是：雅各說行為能救人嗎？雅各與保羅矛盾嗎？我的行為不夠好，我得救了嗎？</strong></p>"],["兩人矛盾說","","<p>路德早年與部分近代批判學者這樣讀：雅各與保羅在稱義的問題上互相衝突，所以雅各書的權威不及保羅書信。路德 1522 年德文新約序言把雅各書與約翰福音、羅馬書、加拉太書、彼得前書相比，稱它為「稻草書信」（詳見 ISS00_8）。這派的優點是誠實：它不假裝 2:24 與羅 3:28 字面上沒有張力，也逼著讀者認真對待兩段經文各自的用字。</p><p><strong>難處：</strong>兩人用的「信心」「行為」「稱義」三個詞，意思各有偏重，字面上的張力不等於意思上的矛盾；而且路德自己也沒有因此把雅各書移出他翻譯的聖經，後來仍在講道中引用它。若把兩人講成對立，信徒就得在新約裡選邊站，這不是歷代教會讀這兩卷書的方式。</p>"],["問題不同說（保羅問怎樣被算為義，雅各問信心是不是真的）","","<p>加爾文、改革宗與絕大多數福音派這樣讀：保羅問的是「一個罪人怎樣在神面前被算為義？」——答案是因著信，不靠律法的行為；雅各問的是「一個人說他有的信心，是不是真的信心？」——答案是真的信心會有行為。兩人反對的不是同一個敵人：保羅反對「靠律法稱義」，雅各反對「沒有行為的信心」。2:18 是關鍵：「你將你沒有行為的信心指給我看，我便藉著我的行為，將我的信心指給你看」——行為是信心被看見的樣子。</p><p><strong>難處：</strong>這個讀法若講得太快，容易變成「雅各其實和保羅說一樣的話」，把雅各那份刺人的力量磨平了；雅各確實用了「稱義」這個詞，而且說「不是單因著信」，讀者需要再看清楚他的「稱義」與「行為」各指甚麼，才不會只是把張力解釋掉。</p>"],["稱義意思不同說（宣告為義／顯明為義）","","<p>許多福音派註釋這樣讀：保羅的「稱義」是法庭上的宣告，神宣告罪人為義；雅各的「稱義」是證明為義、在人面前顯明為義（這使我們想起路 7:35「智慧之子都以智慧為是」用的是同一個字）。所以 2:21 亞伯拉罕獻以撒「因行為稱義」，是創 22 把創 15:6 那個早已算為義的信心顯明出來——雅各自己說這是「應驗」（2:23）。</p><p><strong>難處：</strong>2:24 說「人稱義是因著行為」，是一句普遍的結論，不只是說亞伯拉罕在人面前被看見；有些學者認為把雅各的「稱義」全部解成「顯明」，有一點太方便。而且 2:14 問的是「這信心能救他嗎？」——雅各關心的不只是別人看不看得見，是這個人最後在神面前站不站得住。</p>"],["行為意思不同說（律法的行為／愛的行為）","","<p>新觀點學者與許多傳統學者共同的觀察：保羅反對的「行為」多半指律法的行為——割禮、守節、飲食，那些把猶太人與外邦人分開的記號（這使我們想起加 2:16）；雅各要求的「行為」是愛的行為——給飢寒的人吃穿、接待使者。保羅自己也說「使人生發仁愛的信心才有功效」（加 5:6），又說「我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善」（弗 2:10）。</p><p><strong>難處：</strong>保羅在羅 4:4–5 與弗 2:9 說的「行為」，不只限於割禮與飲食，也包括一切想用來換取神悅納的作為；只用「律法的行為」來解，會把保羅反對靠自己的那一層講淺了。這個讀法看見了重要的一面，但需要和「問題不同說」一起讀。</p>"],["信心與行為共同稱義說（天主教）","","<p>天主教的天特會議第六次會議（1547 年）引用 2:24 說明：稱義是一個過程，最初因著信、出於恩典，然後在信心與愛德的行為裡成長、得以成全；這些行為本身也是恩典所結的果子。這派的優點是嚴肅看待雅各的「不是單因著信」，也重視恩典改變人、使人真正長出愛的那一面，並且同樣承認最初的稱義不是人賺來的。</p><p><strong>難處：</strong>改教傳統認為，把行為放進稱義的根據裡，會讓敏感的良心永遠不知道自己做得夠不夠，與弗 2:8–9「也不是出於行為，免得有人自誇」不能相合。本講義在這裡與天主教的理解不同，照實陳列這個分別，不嘲諷、不貼標籤——兩方都相信雅各書是神的話。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：站在改教傳統（問題不同、稱義不同、行為不同三種讀法的合流）——得救本乎恩、也因著信，不是出於行為；但叫人得救的信心從來不是孤單的。</strong>「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的」（弗 2:8）；「這樣，信心若沒有行為就是死的」（2:17）。加爾文的說法最精簡：人稱義是單因著信，但叫人稱義的信心從來不是單獨的。</p><p><strong>兩個方向的錯都要指出：</strong>第一是靠行為得救的律法主義——「你奉獻不夠、服事不夠、讀經不夠，所以不確定得救」，這不是雅各的意思，加拉太書對準的就是這個錯；第二是沒有行為的信心——「反正我信了，怎麼活都沒關係」，雅各書第 2 章對準的是這個錯。<strong>本講義講雅各書時，不可以把人推到第一種錯裡去。</strong>路德的評語照實交代上下文，天特會議的立場照實陳列，兩者都不嘲諷。</p><p><strong>講台的落點一句：保羅說「白白的」，雅各說「活的」——救恩是白白得來的，但白白得來的生命，是活的。</strong>321 的落點：改變觀念就改變生命，改變生命就改變生活——信心是觀念與生命，行為是生活；生活是觀念與生命被看見的樣子，不是換取觀念與生命的代價。</p>"],["【四】這件事該不該影響你的信心","","<p>派別之爭不該——福音派、天主教、東正教都相信雅各書是神的話，也都相信亞伯拉罕的信心是真的、是活的。如果你正為自己行為不夠好而焦慮，請先聽雅各自己說的恩典：「他按自己的旨意，用真道生了我們」（1:18）——新生命是神生的，不是你做出來的；「但他賜更多的恩典」（4:6）。<strong>雅各的對象是「說自己有信心」卻對飢寒的弟兄說「平平安安地去吧」的人，不是為自己不夠好而流淚的人。</strong></p><p>但「我的信心有沒有手」該——這是雅各問每一個人的。不是問你做得夠不夠多，是問你的信心有沒有活著：當身邊有一位弟兄姊妹缺了日用的飲食，你的信心會不會伸出手來？</p>"]],"con":[],"say":"本講義的全卷立場：站在改教傳統——得救本乎恩、也因著信，不是出於行為；但叫人得救的信心從來不是孤單的。兩個方向的錯都要指出：靠行為得救，與沒有行為的信心。保羅說「白白的」，雅各說「活的」——救恩是白白得來的，但白白得來的生命，是活的。","care":"席上最容易被這一段傷到的，是良心敏感、常懷疑自己得救的人，是剛信主、還沒有甚麼「行為」可說的人，也是曾在律法主義教會裡被「你做得不夠」壓了很多年的人。講 2:14–26 之前，先讓他們聽見 1:18 與 4:6；牧者要私下陪他們看 2:15–16：雅各問的是對飢寒弟兄說空話的人。不要說「你沒有好行為，可能根本沒得救」，也不要說「稻草書信不必太認真」；不要在講台上嘲笑路德或天主教，席上可能坐著從天主教家庭歸主、或家人仍在天主教會的弟兄姊妹。"},{"id":"ISS00_3","t":"貧富、偏心、工錢與公義——教會可以按身分排座位嗎？基督徒可以富有嗎？","r":"1:9--11；2:1--9；5:1--6","ch":[],"why":"三、教會內的偏心是第一個要面對的罪；財富不是罪但有方向；5:1–6 指名的是欺壓、欠薪、奢華與不義的累積——本講義的全卷立場之三（本卷新立）。雅各書是新約談貧富最直接的一卷：金戒指與骯髒衣服、神揀選貧窮人、富足人應當哭泣號咷、工錢有聲音呼叫。這些經文不是要人仇富，卻很容易被講成仇富，也很容易被講成「與我無關」；教會裡有老闆、有雇工、有外籍看護、有剛失業的人，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「若有一個人帶著金戒指，穿著華美衣服，進你們的會堂去；又有一個窮人穿著骯髒衣服也進去」（2:2）——教會可以按奉獻、身分安排座位與服事嗎？「神豈不是揀選了世上的貧窮人，叫他們在信上富足」（2:5）——神偏愛窮人嗎？「你們這些富足人哪，應當哭泣、號咷」（5:1）——基督徒可以富有嗎？「你們虧欠他們的工錢」（5:4）——基督徒老闆、教會作為雇主的責任是甚麼？</p><p>經文自己先說了五件事：<strong>偏心是罪，不只是不禮貌</strong>——「但你們若按外貌待人，便是犯罪」（2:9）；<strong>偏心違反的是「至尊的律法」</strong>——「要愛人如己」（2:8），屬王的律法；<strong>神的翻轉</strong>——「卑微的弟兄升高，就該喜樂；富足的降卑，也該如此」（1:9–10），富足的人也有喜樂的理由；<strong>5:1–6 審判的是具體的罪</strong>——積攢（5:3）、欠薪（5:4）、奢華（5:5）、定義人的罪（5:6）；<strong>工錢有聲音</strong>——「那收割之人的冤聲已經入了萬軍之主的耳了」（5:4），被欠薪的人沒有聲音，神替他們聽見（這使我們想起利 19:13；申 24:15）。</p>"],["優先關懷貧窮者說","","<p>天主教社會訓導與部分福音派這樣讀：2:5 說神揀選世上的貧窮人，舊約先知與主耶穌也一再站在窮人一邊，所以教會在資源、關注、事工的安排上，應當優先關懷貧窮與受欺壓的人。這派的優點是嚴肅對待 2:5 與 5:4 的分量，也逼著教會看見常被忽略的人：被安排坐在腳凳下邊的人，今天可能是剛下夜班的看護、外籍移工、領低薪的清潔同工。</p><p><strong>難處：</strong>2:5 說的是神「叫他們在信上富足」，是揀選他們承受國度，不是說貧窮本身是美德；若講成「窮就是比較屬靈」，就會美化貧窮，也讓富足的弟兄姊妹覺得自己在教會裡不被接納——而那正是另一種按外貌待人。</p>"],["個人財富管家說","","<p>許多福音派這樣讀：財富本身是中性的，是神託付的；重點是忠心管理、慷慨分享、不被財富轄制。1:10 說富足的「降卑，也該如此」，雅各沒有叫富足人放棄一切，而是叫他們從神的眼光看自己的財富「如同草上的花一樣」。這派的優點是不仇富，讓在職場有成就的弟兄姊妹知道自己也可以忠心事奉，也與聖經中許多敬虔的富人（亞伯拉罕、約伯）相合。</p><p><strong>難處：</strong>若只講個人管家，5:1–6 的力量就容易被削弱——雅各在那裡沒有談「管理」，他談的是欠薪、積攢、奢華，是錢從哪裡來、往哪裡去，以及一個制度怎樣讓窮人失聲。只講個人奉獻多少，不問工錢有沒有按時給足，就把雅各講窄了。</p>"],["簡樸生活說","","<p>洛桑運動 1980 年發表〈簡樸生活〉宣言，許多福音派信徒據此主張：在一個貧富懸殊的世界裡，基督徒應當自願過較簡樸的生活，把多餘的資源分給有需要的人。5:5「你們在世上享美福，好宴樂」是對奢華的直接責備。這派的優點是把雅各的話落到日常的消費與選擇上，也讓信徒看見自己的生活方式與遠方窮人之間的關係。</p><p><strong>難處：</strong>甚麼叫「簡樸」，各地、各家的處境不同，若變成一條外在的規矩，就容易成為新的比較與論斷——「你開那種車」「你住那種房子」，又回到按外貌待人。簡樸需要是出於感恩的自由選擇，不是用來量別人的尺。</p>"],["成功神學與解放神學（本講義都不採用其框架）","","<p>成功神學認為富足是信心的報酬、貧窮是信心不足的結果；解放神學從階級分析讀經，把 5:1–6 讀成被壓迫階級對壓迫階級的審判。兩者方向相反，卻都把經文放進一個預先定好的框架。解放神學的貢獻是提醒教會：雅各確實站在被欠薪的工人一邊，教會不能只談個人敬虔而不看見結構性的不義。</p><p><strong>難處：</strong>成功神學與 2:5「神豈不是揀選了世上的貧窮人」正面相反，本講義不採用（回指希伯來書立場四）；解放神學的階級鬥爭框架與 5:7 緊接著的「你們要忍耐，直到主來」不能相合——雅各把伸冤交給「萬軍之主」（5:4），不是交給階級仇恨。本講義只承認它提醒教會看見窮人的那一部分。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：教會內的偏心是本卷第一個要面對的罪；財富不是罪，但財富有方向；5:1–6 指名的是欺壓、欠薪、奢華與不義的累積。</strong>按奉獻、學歷、職業、口音、國籍、膚色安排座位、事奉與關注，就是 2:1–4；講台先照教會自己，再照社會。「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）——雅各是先問會堂門口的。</p><p>本講義不仇富，也不美化貧窮；吸收優先關懷貧窮者說與個人財富管家說各自看見的一面：神特別聽見窮人的冤聲，富足人則被呼召從神的眼光看自己的財富。<strong>雇主的責任：</strong>基督徒老闆按時給足工錢、給合理的工時；教會作為雇主（同工、清潔、保全、外包）也在 5:4 之下。<strong>外籍移工、看護、低薪勞工</strong>是華人教會身邊最常見的「散住的人」——2:2 那位穿骯髒衣服進來的人，今天可能是剛下夜班的看護。</p><p>這一題的根在 2:1：「你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人」——焦點在榮耀的主，金戒指就不值一提。<strong>關係比東西重要：2:2–4 是全本新約這句話最具體的一幕。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>經濟制度的派別之爭不該——基督徒在稅制、福利、市場的看法上可以不同，仍是一家人。如果你正被欠薪、被看低、被安排坐在後面，請聽雅各替你說的話：「這工錢有聲音呼叫，並且那收割之人的冤聲已經入了萬軍之主的耳了」（5:4）——你沒有聲音的地方，神聽見了。</p><p>但「我看人的眼光有沒有被金戒指改變」該——這是雅各問每一個人的，也問每一間教會。<strong>神揀選人，不看金戒指；讓耶穌作王，就是照他的眼光看人。</strong></p>"]],"con":[],"say":"本講義的全卷立場：教會內的偏心是本卷第一個要面對的罪；財富不是罪，但財富有方向；5:1–6 指名的是欺壓、欠薪、奢華與不義的累積。本講義不是仇富，也不美化貧窮；基督徒雇主與教會作為雇主，都在 5:4 之下。","care":"席上同時坐著老闆與雇工、奉獻多的與奉獻少的、外籍看護與她照顧的長輩一家。講台不點名、不暗示任何奉獻者或富裕的會友，也不公開比較奉獻；不要把貧窮講成信心不夠，也不要把富足講成神祝福的證明。牧者要私下關心正被欠薪、失業或在職場被剝削的人，必要時協助他們找勞工與法律資源；不要說「要順服老闆，忍一忍就過去」來勸人忍受違法的欠薪，也不要把 5:1–6 講成對有錢人的嘲諷。"},{"id":"ISS00_4","t":"疾病、醫治、抹油與認罪——禱告了沒好，是因為信得不夠嗎？要向誰認罪？","r":"5:13--18","ch":[],"why":"四、禱告與醫藥並行；叫人起來的是主；病與罪的關係是「若」；彼此認罪是自願、互相、保密，不是公開羞辱——本講義的全卷立場之四（本卷新立；與希伯來書立場四相接）。5:13–18 是新約唯一一段教會為病人禱告的明文指示，也是最常被用來傷害病人的經文之一：有人被說「病沒好是因為信得不夠」，有人被逼問「你是不是有罪沒認」，有人在小組裡被要求當眾說出自己的罪。這一段必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。所以你們要彼此認罪，互相代求，使你們可以得醫治」（5:14–16）。禱告了沒有好，是信得不夠嗎？還要看醫生嗎？用油抹他，是藥、是象徵、還是聖禮？病是因為犯罪嗎？要向誰認罪？</p><p>經文自己先說了五件事：<strong>病人在受苦的人當中</strong>——「你們中間有受苦的呢，他就該禱告」（5:13），病不是一種特別的屬靈失敗；<strong>病人主動請長老</strong>——照顧是群體的，也是病人自己的選擇；<strong>叫人起來的是主</strong>——「主必叫他起來」（5:15），主詞是主；<strong>病與罪的關係是「若」</strong>——有時有，常常沒有（這使我們想起約 9:3）；<strong>認罪是「彼此」，緊接著「互相代求」</strong>——認罪的目的是被代求，不是被審判。「用油抹他」的「抹」ἀλείφω 是日常的塗抹敷藥（這使我們想起路 10:34 好撒馬利亞人「用油和酒倒在他的傷處」），不是聖職膏立的 χρίω。</p>"],["聖事說","","<p>天主教與東正教把 5:14–15 看作病人傅油聖事的根據：由神職人員為病人傅油、祈禱，賜下恩典與力量；中世紀以後多用於臨終，稱為「終傅」，梵二以後改稱「病人傅油」，恢復為一切重病者施行。這派的優點是嚴肅看待教會群體與長老在病人身上的職分，也讓臨終的人得著屬靈的陪伴與平安。</p><p><strong>難處：</strong>雅各用的是日常的「抹」，不是聖職的「膏」；而且他在 5:16 立刻說「彼此認罪，互相代求」，把禱告與認罪放在全體信徒之間，不只限於神職人員。改教傳統因此不把它列為聖禮，但這是對經文理解的不同，不是對病人愛心的不同。</p>"],["醫藥說與象徵說","","<p>部分改革宗主張醫藥說：橄欖油在當時是常用的藥，雅各要教會同時用醫藥與禱告照顧病人——今天的「油」就是醫生、藥物與手術。許多福音派主張象徵說：油象徵聖靈的同在，表示病人被分別出來交託給神；抹油是一個看得見的動作，提醒病人與長老，醫治從主而來。兩者的優點都是把禱告與醫療照顧連在一起，不讓抹油變成神祕的儀式。</p><p><strong>難處：</strong>醫藥說若講得太滿，「奉主的名」「出於信心的祈禱」就容易被淡化成一般的照護；象徵說若講得太虛，就忽略了「抹」這個字原本是很實際的照顧動作。兩者單獨看都只抓到一半，合起來才接近雅各的意思：禱告與照顧並行。</p>"],["醫治恩賜說與時代說","","<p>五旬節派與靈恩派主張醫治恩賜說：今天照字面施行抹油禱告，期待神蹟醫治，因為神的應許沒有改變，「義人祈禱所發的力量是大有功效的」（5:16）。部分停止論者主張時代說：神蹟醫治的恩賜屬於使徒時代，今天教會仍然為病人禱告，但不照字面期待同樣的神蹟。兩者都在基督教傳統之內，前者提醒教會不要不敢為病人求，後者提醒教會不要把神蹟當成保證。</p><p><strong>難處：</strong>醫治恩賜說若推到極端，就變成「有信心就一定好」，讓沒有好的人背上罪咎——這不是雅各的意思；時代說若推到極端，就變成不再為病人禱告，與 5:14 的命令不合。雅各舉以利亞為例，特別說他是「與我們是一樣性情的人」（5:17）：禱告的力量不在禱告的人多屬靈，在聽禱告的神。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：禱告與醫藥並行——神使用醫生、藥物、手術，也使用禱告與神蹟，兩者都是恩典；本講義絕不鼓勵任何人停藥、拒醫、延誤就醫。</strong>教會照 5:14 為病人禱告，可以抹油，由病人或家屬邀請，不在病人不願意時強行施行。<strong>神能醫治，也常醫治；但沒有好的人，不是信心不夠</strong>（回指希伯來書立場四：「又有人忍受嚴刑」（來 11:35））。五種讀法都在基督教傳統之內。</p><p><strong>講台的落點一句：5:15 的主詞是「主」——叫人起來的是主，不是我們的信心分數；所以禱告了沒有好的人，不必再背一個「信心不夠」的十字架。</strong>為久病、重病、臨終的人禱告，內容可以是醫治，也可以是平安、不痛苦、與家人和好、安然見主——都在「救」與「叫他起來」的範圍。不推論病因：不對病人說「你一定有罪沒認」「你家裡有咒詛」，那不是雅各的「若」。</p><p><strong>彼此認罪的四條界線：</strong>①在可信任的、互相的關係裡（321 的「2」），不是在公開場合；②自願，不是被要求、被逼問；③保密——牧者與小組長不可轉述；④受害者不需要向加害者認罪，也不需要被要求立刻和好；涉及暴力、性侵、兒少保護的事，先保護安全、依法通報。</p>"],["【四】這件事該不該影響你的信心","","<p>抹油的方式、醫治恩賜今天怎樣運作，不該——各宗派有不同的做法，都在主的家裡。如果你或你的家人禱告了很久還沒有好，請記得雅各說的是「主必叫他起來」，不是「你的信心必叫他起來」；主耶穌自己也說那人的病「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。</p><p>但「病了的時候我要不要讓弟兄姊妹為我禱告」該——雅各說：要請。<strong>病了不必一個人扛；請人來為你禱告，不是軟弱，是照著主的話讓教會成為教會。</strong></p>"]],"con":[],"say":"本講義的全卷立場：禱告與醫藥並行，絕不叫人拒醫；叫人起來的是主，不是信心分數；病與罪的關係是「若」，不推論病因；彼此認罪是在可信任的關係裡自願、互相、保密，不是公開羞辱，受害者不需要向加害者認罪。","care":"席上會有慢性病、癌症、精神疾病的弟兄姊妹，有剛失去親人、禱告了卻沒有等到醫治的家屬，也有曾在小組被逼著說出自己隱私、或被要求向傷害自己的人道歉的人。醫院探訪時，先陪伴、再禱告；不要在病床邊宣告「你信就會好」，不要說「再禱告一次就好」，絕不說「你一定有罪沒認」。長期疾病需要的是長期的陪伴與專業醫療；有人向你認罪，守住保密；涉及暴力、性侵、兒少的事，先保護安全、依法處理。"},{"id":"ISS00_5","t":"舌頭、論斷與教會裡的言語——教會還能不能指出罪？可以起誓嗎？","r":"1:19；1:26；3:1--12；4:11--12；5:12","ch":[],"why":"五、勸戒與論斷的三個分別（動機、方法、位子）；勒住舌頭不是叫人閉嘴；5:12 不禁止法庭與婚禮的正式誓言；不教言語魔法——本講義的全卷立場之五（本卷新立）。雅各書用最多篇幅講舌頭，這些經文卻常被反過來用：受害者說出遭遇被說「勒住舌頭」，提問的人被說「不要多人作師傅」，指出問題的同工被說「你是誰，竟敢論斷別人」。也有人把 3:6 講成言語的魔法。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「若有人自以為虔誠，卻不勒住他的舌頭，反欺哄自己的心，這人的虔誠是虛的」（1:26）；「你是誰，竟敢論斷別人呢？」（4:12）——那教會還能不能指出罪？「我的弟兄們，不要多人作師傅」（3:1）——誰可以教？「最要緊的是不可起誓」（5:12）——法庭作證、婚禮誓詞可以嗎？</p><p>經文自己先說了五件事：<strong>舌頭的問題是心的問題</str
