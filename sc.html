ong>——「你們心裡若懷著苦毒的嫉妒和紛爭」（3:14），舌頭只是把心裡的東西點著；<strong>頌讚和咒詛同一個口出來是「不應當的」</strong>（3:10）——不是不可能，是不應當，它每天都在發生；<strong>論斷與勸戒不同</strong>——雅各自己在全卷最後要人去「使他回轉」（5:19），勸戒是為了把人找回來，論斷是把自己放在律法上面（4:11）；<strong>說話要慢</strong>——「快快地聽，慢慢地說，慢慢地動怒」（1:19）；<strong>說話要真</strong>——「是，就說是；不是，就說不是」（5:12），不需要起誓的人，是平常說話就算數的人。</p>"],["完全不評斷說（一切評價都是論斷）","","<p>有人這樣讀 4:11–12 與太 7:1「你們不要論斷人，免得你們被論斷」：任何對別人行為的評價都是論斷，基督徒應當只管自己，不對任何人的對錯表示意見。這派的優點是看見了驕傲的危險——論斷人就是坐上審判官的位子，也提醒教會不要成為一個彼此挑剔的地方。</p><p><strong>難處：</strong>雅各自己就在全卷指出了許多罪，而且最後一筆是「若有失迷真道的，有人使他回轉」（5:19）；主耶穌也說「倘若你的弟兄得罪你，你就去……指出他的錯來」（太 18:15）。若一切評價都算論斷，受害者就不能說出遭遇，教會也不能保護弱者——這反而讓作惡的人更安全。本講義不採用。</p>"],["勸戒與論斷分別說","","<p>多數解經家這樣讀：雅各禁止的不是一切指出錯誤，是一種特定的態度——把自己放在律法上面，替神定人的終局。可以從三方面分辨：動機是為了把人找回來，還是為了證明自己對？方法是當面、私下、溫柔，還是背後、公開、刻薄？位子是站在弟兄旁邊，還是坐在審判官的位子上？這派的優點是同時保住了 4:11–12 與 5:19–20，也合乎加 6:1「用溫柔的心把他挽回過來」。</p><p><strong>難處：</strong>動機常常是混雜的，自己也看不清；這三個分別需要群體裡彼此提醒，也需要願意被指正的謙卑。而且這派若被誤用，人人都可以說「我是勸戒，不是論斷」，所以必須同時守住方法與位子，不能只憑自己宣稱的動機。</p>"],["起誓：全然不起誓說與正式宣誓可行說","","<p>重洗派與貴格會照字面讀 5:12 與太 5:34「甚麼誓都不可起」：一切起誓都不可，連法庭作證也改用鄭重聲明。多數新教與天主教則認為：雅各與主耶穌禁止的是日常隨意的發誓、用起誓來加強自己的話或逃避責任；法庭作證、婚禮誓詞、就職宣誓不在禁止之內——「人都是指著比自己大的起誓，並且以起誓為實據」（來 6:16），保羅也常說神可以見證（這使我們想起羅 1:9）。</p><p><strong>難處：</strong>全然不起誓說嚴肅對待「無論何誓都不可起」的字面，但需要面對新約其他經文裡神自己起誓、保羅以神為證的例子；正式宣誓可行說若不小心，就把 5:12 講成只是一條法律條款，忽略了它真正的要求：平常說話就要真實。</p>"],["信心宣告說（說出來就會實現）","","<p>信心宣告運動把 3:2–6 與箴言的「生死在舌頭的權下」連在一起，主張說出負面的話會招來咒詛，說出正面的宣告就能改變現實，所以基督徒要控制言語、只說「信心的話」。這派的優點是看見了言語真實的力量——雅各確實說舌頭「能把生命的輪子點起來」（3:6），話語能建立人也能毀掉人。</p><p><strong>難處：</strong>雅各說的火，燒的是關係與人心——「在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事」（3:16）——不是一種讓話語自己成真的機制；他也沒有教人用宣告改變處境，反而在 4:15 說「主若願意」。把舌頭講成魔法，會讓受苦的人不敢說出真實的痛苦。本講義不採用。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：勸戒與論斷有三個分別——①動機：為了把人找回來（5:20），不是為了證明自己對；②方法：當面、私下、溫柔（3:13「在智慧的溫柔上」），不是背後、公開、刻薄；③位子：站在弟兄旁邊（「我的弟兄們」），不坐審判官的位子（4:12）。</strong>「設立律法和判斷人的，只有一位」（4:12）——論斷人就是離開本位、想要代替神，是 321 說的驕傲最生活化的樣子。</p><p><strong>勒住舌頭不是叫人閉嘴：</strong>受害者說出自己的遭遇、會友提出合理的問題、同工指出制度的錯誤，都不是 1:26、3:1–12 要勒住的舌頭。3:1 是對教導者的警告，不是對學習者的限制，不可用來壓制任何肢體的恩賜。<strong>起誓：</strong>本講義採多數新教的讀法，5:12 禁止的是用起誓加強自己的話、逃避責任；法庭作證、婚禮誓詞、就職宣誓不在禁止之內，並尊重持守不起誓的弟兄姊妹。<strong>本講義不教言語魔法：</strong>3:6 的火，燒的是關係與人心。</p>"],["【四】這件事該不該影響你的信心","","<p>起誓的範圍、勸戒的程序，不該——各教會有不同的做法，彼此尊重。如果你曾經因為說出真話而被說「舌頭不受約束」，請知道雅各要勒住的，是苦毒、嫉妒、背後的毀謗，不是你的真實；雅各自己說話也很直接，他在 5:4 替被欠薪的工人大聲說話。</p><p>但「我昨天說的話裡，有沒有一句是從地獄裡點著的」該——這是雅各問每一個人的。<strong>好消息是：舌頭沒有人能制伏（3:8），但從上頭來的智慧「先是清潔，後是和平」（3:17）——改變舌頭，要從領受那從上頭來的開始。</strong></p>"]],"con":[],"say":"本講義的全卷立場：勸戒與論斷有三個分別——動機為了把人找回來、方法當面私下溫柔、位子站在弟兄旁邊不坐審判官的位子；勒住舌頭不是叫受害者、提問的人閉嘴；5:12 禁止的是用起誓加強自己的話，不禁止法庭作證與婚禮誓詞；本講義不教言語魔法。","care":"席上會有曾被「勒住舌頭」「你在論斷」消音的受害者，有提出問題就被說「不要多人作師傅」的年輕人，也有被群組裡一句話傷透、從此不再來的人。牧者要先讓他們知道：說出真相不是雅各要勒住的舌頭。不要在小組、群組、講台上公開評價某位會友；需要勸戒的，照太 18:15 的次序私下進行。不要說「你這樣講就是論斷」來結束一個合理的提問，也不要說「你的話會招來咒詛」去嚇唬正在訴苦的人。"},{"id":"ISS00_6","t":"哪一位雅各？「主的兄弟」是甚麼意思？","r":"1:1","ch":[],"why":"全卷通用：新約有四位雅各，1:1 只寫「雅各」；而「主的兄弟」牽涉馬利亞是否終身童貞，是天主教、東正教與新教長久不同的地方。華人教會裡常有從天主教家庭歸主的信徒，也有家人仍在天主教會的人，這一題若講得輕率，就會在講台上傷人。本講義只在這裡三說並陳，不在講義正文、講章、教學講章裡爭論；講台要講的，是三說都同意的那件事：雅各曾經不信，後來成了僕人。","pos":[["【一】經文問的是甚麼","","<p>新約有四位雅各：①西庇太的兒子、約翰的哥哥，主後 44 年被希律殺害——「用刀殺了約翰的哥哥雅各」（徒 12:2），太早，不可能是作者；②亞勒腓的兒子，十二使徒之一，新約幾乎沒有記載；③猶大的父親（路 6:16）；④主的兄弟雅各——「至於別的使徒，除了主的兄弟雅各，我都沒有看見」（加 1:19），後來是耶路撒冷教會的「柱石」（加 2:9），在耶路撒冷會議中說「諸位弟兄，請聽我的話」（徒 15:13）。</p><p>歷代多數讀法認為作者是第四位：1:1 只寫「雅各」，不必加任何說明，只有耶路撒冷教會那一位能這樣寫；徒 15:23 會議公函的問安與雅 1:1 用的是同一個字；寫給「散住的十二支派」也正是耶路撒冷教會領袖的責任。也有學者主張託名說（後人借雅各之名寫成），理由是希臘文太好；但耶路撒冷周圍說希臘話的猶太人很多，加利利是雙語地區，這個理由不足以推翻傳統。<strong>經文問的是：「主的兄弟」是甚麼意思？</strong>福音書記載「他弟兄們不是叫雅各、約西、西門、猶大嗎？」（太 13:55）。</p>"],["同母弟弟說（赫爾維狄烏斯說）","","<p>認為雅各是馬利亞與約瑟在耶穌出生以後所生的兒子，是耶穌同母異父的弟弟（就人的血緣說）。絕大多數福音派與新教學者採這個讀法，理由是「兄弟」最自然的意思就是兄弟；「只是沒有和她同房，等她生了兒子」（太 1:25）的「等」，自然讀來暗示以後有正常的夫妻生活；福音書也常把耶穌的弟兄與母親並列（太 12:46；徒 1:14）。</p><p><strong>難處：</strong>希臘文「等」不一定表示之後情況改變；而十字架下耶穌把母親交託給約翰（約 19:26–27），若馬利亞還有其他親生兒子，這個交託顯得不尋常——雖然可以用當時弟弟們「不信他」（約 7:5）來解釋。這個讀法要尊重另外兩種傳統背後對馬利亞的敬重，不可輕蔑。</p>"],["約瑟前妻之子說（伊皮法紐說）","","<p>四世紀的伊皮法紐等教父主張：雅各與其他「弟兄」是約瑟在娶馬利亞以前、前一段婚姻所生的兒子，因此是耶穌法律上的哥哥，與馬利亞沒有血緣。東正教傳統採這個讀法，它同時保守了馬利亞終身童貞，也保留了「兄弟」作為家人的實際意思，並且能自然解釋約 19:26–27 的交託，以及弟兄們對耶穌那種兄長式的口氣（約 7:3）。</p><p><strong>難處：</strong>新約沒有任何地方提到約瑟有前一段婚姻，這個說法的根據主要來自二世紀的《雅各原始福音》等次經傳統；而且馬太與路加的家譜與童年記載中，也看不出約瑟帶著年長的兒子。這個讀法背後是對馬利亞終身童貞的敬虔關懷，新教可以不同意，但要明白並尊重它的用心。</p>"],["堂表兄弟說（耶柔米說）","","<p>四世紀末的耶柔米主張：希伯來與亞蘭文化中「兄弟」可以泛指親屬，雅各與其他「弟兄」是耶穌的堂表兄弟；他並把可 15:40「小雅各和約西的母親馬利亞」連起來，認為這位馬利亞是耶穌母親的親戚。天主教傳統採這個讀法，與馬利亞終身童貞的教義相連；它的優點是指出了舊約確實有「兄弟」指親屬的例子（如亞伯拉罕稱羅得為「弟兄」）。</p><p><strong>難處：</strong>新約希臘文另有「親屬」與「表親」的字（西 4:10 用的是表親），福音書卻一貫用「弟兄」；而且福音書記載的「弟兄們」常和母親同行，像是一家人。這個讀法背後同樣是對馬利亞的敬重，新教可以不同意，但不可以把它講成荒謬或刻意曲解。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是主的兄弟雅各（決策丙）。「主的兄弟」的三種讀法，本講義在這裡並陳，寫明各說背後的教義關懷，不嘲諷任何一方；新教讀者多採同母弟弟說，但不以此作為衡量其他傳統的標準。講義正文、講章、教學講章不爭論這一題。</strong></p><p>講台要講的，是三說都同意的那件事：雅各曾經不信——「耶穌的親屬聽見，就出來要拉住他，因為他們說他癲狂了」（可 3:21），「因為連他的弟兄說這話，是因為不信他」（約 7:5）；復活的主向他顯現（這使我們想起林前 15:7）；後來他只稱自己是「作神和主耶穌基督僕人的雅各」（1:1）。</p><p><strong>這是全卷第一個無己的見證：本來最有資格抓住「主的兄弟」這個頭銜的人，回到了僕人的本位。</strong>一個曾經和家人以為哥哥癲狂了的弟弟，後來一輩子活在哥哥的話裡——全卷沒有一次說「主說過」，卻是新約最多回響登山寶訓的書信。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——三種讀法的信徒都相信耶穌是神的兒子、由童貞女馬利亞所生、為我們死而復活，也都相信雅各書是神的話。這一題的分別，牽涉的是對馬利亞的理解，不是對基督的信仰；在這一點上不同的弟兄姊妹，仍然可以一起讀雅各書、一起行道。</p><p>真正該影響你信心的，是雅各的那一個轉變：<strong>連一個與耶穌一起長大、曾經和家人一起以為他癲狂了的弟弟，後來都甘心稱自己是他的僕人。</strong>如果你的家人至今不信，雅各的故事告訴你：家裡最難信的人，神也能遇見他。</p>"]],"con":[],"say":"本講義的全卷立場：作者是主的兄弟雅各；「主的兄弟」有同母弟弟、約瑟前妻之子、堂表兄弟三種讀法，只在議題頁並陳，尊重各宗派，不嘲諷、不在講台爭論。講台要講的是三說都同意的事：雅各曾經不信，後來成了「神和主耶穌基督僕人」。","care":"席上可能有從天主教家庭歸主的人、家人仍是天主教或東正教信徒的人，也有剛信主、第一次聽說「耶穌有弟弟」而感到困惑的人。牧者不要在講台上說「天主教把馬利亞神化」之類的話，也不要把三說之爭講成誰比較屬靈；對困惑的人，陪他回到 1:1 與可 3:21。對家人還沒有信主、甚至反對信仰的弟兄姊妹，這一題的落點是盼望：連主的弟弟也曾經不信。"},{"id":"ISS00_7","t":"雅各書寫在甚麼時候？是新約最早的書信嗎？會改變我們讀 2:14–26 的方式嗎？","r":"1:1；2:2；5:7--9","ch":[],"why":"全卷通用：寫作年代決定我們怎樣讀 2:14–26——雅各若寫在保羅書信之前，他就不是在回應保羅；若寫在之後，他可能在糾正一些人對保羅「因信稱義」的誤用。年代也牽涉作者問題：雅各約在主後 62 年於耶路撒冷殉道，若本書晚於此，就必然是託名。這一題需要交代證據與各家理由，並說明為甚麼它不改變本講義對信心與行為的立場。","pos":[["【一】經文問的是甚麼","","<p>雅各書本身沒有提到任何可以定年的事件。信裡有幾條線索：聚會的地方叫「會堂」（2:2），顯示信徒仍在猶太群體的框架裡聚集；全卷沒有提到外邦人守不守律法、割禮、飲食的問題——那是主後 49 年左右耶路撒冷會議（徒 15）最大的爭議；信裡對主再來的期待很強：「你們也當忍耐，堅固你們的心，因為主來的日子近了」（5:8），「審判的主站在門前了」（5:9）。</p><p>新約以外的史料：一世紀猶太史家約瑟夫記載，大祭司亞拿努趁羅馬巡撫空缺，把「稱為基督的耶穌的兄弟雅各」交給人用石頭打死，時間約在主後 62 年。<strong>經文問的是：雅各書寫在保羅書信之前還是之後？它是不是新約最早的書信？這會改變我們讀 2:14–26 的方式嗎？</strong></p>"],["早期說（主後 40 年代中後期，耶路撒冷會議之前）","","<p>許多福音派學者認為雅各書寫於主後 45–48 年左右，可能是新約最早寫成的書信。理由是：信中用「會堂」稱聚會；完全沒有提到外邦人與律法的爭議，好像那個問題還沒有出現；所描寫的處境——貧窮、被富足地主欺壓、猶太信徒散在各地——與司提反殉道後、飢荒年間（這使我們想起徒 11:28–30）的情形相合；而且全卷大量回響主耶穌的教訓，卻沒有引用任何一卷福音書，像是口傳時期的作品。</p><p><strong>難處：</strong>若寫在保羅書信之前，2:14–26 為甚麼用了和保羅那麼接近的字眼——稱義、信心、行為、亞伯拉罕、創 15:6？早期說的回答是：這些是猶太會堂裡早已常談的題目與經文，不必是回應保羅；但這個解釋並不是所有學者都接受。</p>"],["晚期說（主後 50 年代末到 62 年，雅各殉道之前）","","<p>另一些學者認為雅各書寫於主後 50 年代末到 60 年代初，在保羅的羅馬書、加拉太書流傳之後、雅各殉道之前。理由是：2:14–26 的用字與保羅太接近，很像是在回應一些人把保羅的「因信稱義」誤用成「只要說信，不必有行為」（保羅自己也面對同樣的誤用，這使我們想起羅 6:1）；信中對教會生活的描寫——長老（5:14）、教師（3:1）——也顯示一個已經有一段時間的群體。</p><p><strong>難處：</strong>若雅各在回應保羅的話被誤用，他為甚麼不提保羅的名字、也不處理外邦人與律法的問題？而且耶路撒冷會議之後，雅各與保羅已經彼此認可（加 2:9），這個讀法需要小心，不可講成雅各在反對保羅。</p>"],["託名晚期說（主後 80–100 年，後人借雅各之名）","","<p>部分批判學者認為雅各書是雅各死後，由他的門生或敬重他的群體借他的名寫成，時間在主後 80–100 年。理由是：希臘文流暢、修辭講究，不像一位加利利木匠家庭出身的人所寫；信中不提雅各與耶穌的關係，也不提自己的經歷；而且二世紀以前教父很少明確引用本書。這派的優點是認真面對文體的問題。</p><p><strong>難處：</strong>加利利是雙語地區，耶路撒冷周圍說希臘話的猶太人很多，雅各有三十年在耶路撒冷帶領教會，也可能用書記；信中不提自己與耶穌的關係，正合乎一位甘心稱自己為「僕人」的人；而且全卷的處境——會堂、強烈的末世期待、沒有外邦人問題——與主後 70 年聖殿被毀之後的情形不合。本講義不採用。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：雅各書寫在主的兄弟雅各生前，約在主後 40 年代或 60 年代初；本講義不在兩說之間定案，略傾向較早的年代，但兩說都可以，不影響全卷的讀法。</strong>託名晚期說本講義不採用（見 ISS00_6）。雅各約在主後 62 年於耶路撒冷殉道，他寫信給散住的人，自己卻一直留在最危險的耶路撒冷。</p><p>無論早或晚，本講義讀 2:14–26 的立場都一樣（見 ISS00_2）：雅各不是在反對保羅，是在對付「只說不做」的信心；保羅在加拉太書與羅馬書對付的是「靠律法稱義」。若寫在早期，兩人各自對不同的處境說話；若寫在晚期，雅各是在幫保羅擋住一種誤用。兩種情形，雅各與保羅都站在同一位亞伯拉罕、同一節「亞伯拉罕信神，這就算為他的義」（2:23）旁邊。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——雅各書的信息不靠一個精確的年份成立。不論寫在主後 45 年還是 60 年，它都是在使徒時代、由一位見過復活之主的人寫給受苦的信徒，並且歷代教會都承認它是神的話。年代的討論幫助我們更細緻地讀 2:14–26，但不改變它對我們的問題：你的信心有沒有活著？</p><p>若雅各書真是新約最早的書信，那就更動人了：<strong>教會最早寫下來的一封信，不是一篇教義論文，是對散住、貧窮、受苦的弟兄姊妹說：「你們要忍耐，直到主來」（5:7）。</strong></p>"]],"con":[],"say":"本講義的全卷立場：雅各書寫在主的兄弟雅各生前，約在主後 40 年代或 60 年代初，雅各約在主後 62 年於耶路撒冷殉道；本講義不在兩說之間定案。無論早晚，雅各都不是在反對保羅，而是在對付「只說不做」的信心（見 ISS00_2）。","care":"多數會友不會為年代失眠，會受影響的是在神學院或網路上讀到「雅各書是後人偽託」「雅各在反對保羅」而開始不安的年輕人，以及會把這些資訊拿來在小組裡辯論的人。牧者要讓前者知道傳統的作者與年代有好的理由，讓後者知道這不是講台的焦點。不要說「學者的說法都不可信」來堵住提問，也不要把年代之爭講成雅各與保羅兩派對立；講台上一句帶過，指向這一頁。"},{"id":"ISS00_8","t":"雅各書為甚麼一度被懷疑？路德真的說它是「稻草書信」嗎？","r":"2:14--26","ch":[],"why":"全卷通用：許多信徒都聽過「路德說雅各書是稻草書信」，有人因此以為雅各書在聖經裡地位比較低、可以不必認真讀；也有人反過來以此嘲笑路德或整個改教運動。雅各書在早期教會確實被列為「有爭議的書卷」，後來才被全教會普遍接受。這一題要把史實照實交代：路德說了甚麼、在甚麼上下文說、後來怎樣，以及今天全教會為甚麼都把它當作神的話。","pos":[["【一】經文問的是甚麼","","<p>雅各書在初期教會流傳較慢：二世紀的教父很少明確引用它；三世紀的俄利根首先明確稱引；四世紀的教會史家優西比烏把它列在「有爭議的書卷」中，同時說明它在許多教會裡被公開誦讀。主後 367 年亞他那修的第三十九封復活節書信列出新約二十七卷，雅各書在其中；其後希坡（393 年）與迦太基（397 年）的會議也承認它。從此東西方教會都把它當作正典。</p><p>一千多年後，路德在 1522 年德文新約的序言裡，把雅各書與約翰福音、羅馬書、加拉太書、彼得前書等相比，說它「比起這些，是一封稻草書信」，因為它「裡面沒有福音的性質」。<strong>經文問的是：雅各書為甚麼一度被懷疑？路德真的說它是稻草書信嗎？他的意思是甚麼？雅各書今天在聖經裡的地位如何？</strong></p>"],["邊緣正典說（雅各書的權威次於主要書卷）","","<p>這是路德早年的看法，也是部分近代學者的看法：雅各書雖在正典中，但它沒有清楚傳講基督的十字架與復活，在稱義的教導上又與保羅有張力，所以應當放在次一等的位置，用保羅來讀雅各，而不是用雅各來讀保羅。路德在他的德文新約裡，把希伯來書、雅各書、猶大書、啟示錄放在最後，沒有和其他書卷一起編號。</p><p><strong>難處：</strong>「稻草」這個比喻出自林前 3:12，路德的意思是「與那些最核心的書卷相比」，不是說它是假的；他在同一篇雅各書序言裡也稱讚它「沒有設立人的教訓，而是強調神的律法」。而且路德從來沒有把雅各書移出聖經，他後來仍在講道中引用它；在他後來的序言版本裡，一般認為那一句比較也沒有再出現。若只引「稻草書信」四個字，就把路德也講錯了。</p>"],["完全正典說（雅各書與其他書卷同為神的話）","","<p>這是歷代東西方教會的共識，也是今天天主教、東正教與絕大多數新教的立場：雅各書經過早期教會長時間的分辨，被普遍接受為使徒時代、由主的兄弟雅各所寫、在教會中誦讀的書信；它與其他新約書卷同樣是「神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的」（提後 3:16）。改教傳統中的加爾文也完全接受雅各書，並用「問題不同」來調和它與保羅。</p><p><strong>難處：</strong>完全正典說必須誠實面對早期教會確實有過的遲疑，不能說「從來沒有人懷疑過」；也要回答雅各書為甚麼很少直接提到基督的工作。它的回答是：雅各書兩次提到主耶穌的名（1:1；2:1），全卷卻大量回響主耶穌的教訓，特別是登山寶訓，例如 5:12 與太 5:34–37 幾乎逐字相同。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：雅各書是正典，與其他新約書卷同為神的話；早期教會的遲疑照實交代，路德的評語照實交代上下文——他是與其他書信比較，而且他仍把雅各書保留在聖經裡，後來仍講道引用它。本講義不說「稻草書信不必認真」，也不嘲諷路德。</strong></p><p>早期教會的遲疑，主要因為雅各書寫給散住的猶太信徒，在外邦教會中流傳較慢，作者也不是十二使徒之一；這種遲疑正顯示教會分辨正典是謹慎的，不是隨便的。路德的批評則來自他特殊的處境：他正在為「因信稱義」爭戰，有人拿 2:24 來反駁他；他的話是那場爭戰裡的話，不是他對雅各書最後的判斷。</p><p>本講義要接續的，反而是路德與雅各共同的關懷：<strong>路德自己說過，信心是一件活潑、忙碌、有作為的東西，不可能不一直行善——這正是雅各說的「信心沒有行為也是死的」（2:26）。</strong>路德與雅各爭的是字眼，關心的卻是同一顆心：一個被恩典救了的人，生命是活的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該——今天天主教、東正教與新教都把雅各書當作神的話，連路德的教會也一直在讀它、講它。早期教會花了時間分辨，路德在爭戰中說了重話，這些都是教會歷史裡真實的人與事，不減損雅各書的權威，反而讓我們看見：神的話經得起最認真的檢驗。</p><p>如果你曾經因為聽說「稻草書信」而跳過雅各書，現在可以放心地讀它。<strong>雅各書是一面鏡子（1:23–25）：它不是用來看路德、看天主教、看別人的，是用來彎下腰看自己的。</strong></p>"]],"con":[],"say":"本講義的全卷立場：雅各書是正典，與其他新約書卷同為神的話。早期教會的遲疑照實交代；路德 1522 年「稻草書信」的評語是與其他書信比較，他仍把雅各書保留在聖經裡、後來仍講道引用它。本講義不輕看雅各書，也不嘲諷路德。","care":"會受影響的是兩種人：聽說「稻草書信」就覺得雅各書不必太認真、可以跳過的人，以及在網路上看到有人拿這句話嘲笑改教運動、而對自己的信仰傳統感到不安的人。牧者要把上下文講清楚，讓前者知道雅各書是神的話，讓後者知道路德的話有它的處境。不要在講台上用「連路德都看不起它」或「路德把聖經剪掉了」這種話；兩種說法都不合史實，也都會傷到席上不同背景的人。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:5--8；4:6--8","ch":[],"why":"全卷通用：爭議與信心。雅各書的爭議不少：信心與行為和保羅的關係、作者與「主的兄弟」三說、年代、正典地位與路德、抹油與醫治、起誓、4:5 的「經上所說」沒有逐字出處、和合本與原文的幾處異文。一位認真讀完議題頁的信徒，很可能會問：這麼多不確定，我還能確定甚麼？而雅各書偏偏說「只要憑著信心求，一點不疑惑」——那有問題的人是不是心懷二意？這一題要把全卷的爭議放回正確的位置。","pos":[["【一】經文問的是甚麼","","<p>雅各一開始就說到問題與智慧：「你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神，主就必賜給他」（1:5）。神不嫌你問，也不罵你問。但緊接著他說：「只要憑著信心求，一點不疑惑；因為那疑惑的人，就像海中的波浪，被風吹動翻騰」（1:6），「心懷二意的人，在他一切所行的路上都沒有定見」（1:8）。</p><p>這裡的「疑惑」，原文是心裡分成兩邊、一邊向神一邊向世界；「心懷二意」δίψυχος 是「兩個魂的」，新約只出現在 1:8 與 4:8。雅各在 4:8 給的藥方是：「你們親近神，神就必親近你們……心懷二意的人哪，要清潔你們的心！」<strong>經文問的是：面對雅各書（以及整本聖經）裡的種種爭議，一個信徒該怎樣自處？有問題、有疑問，是不是就是 1:6–8 說的心懷二意？有沒有甚麼是不會因爭議而動搖的？</strong></p>"],["爭議證明聖經不可靠","","<p>這是懷疑者常有的推論：雅各與保羅講法不同，作者是誰有三種說法，年代差了二十年，連路德都懷疑過這卷書——可見聖經不過是人的作品，不值得全然信靠。這派的優點是誠實：它不假裝問題不存在，也逼著教會不能只用「信就對了」回答。</p><p><strong>難處：</strong>這些爭議幾乎全部發生在「怎樣理解」的層次，不在「神是誰、祂作了甚麼」的層次。主張雅各與保羅矛盾的路德，和主張兩人一致的加爾文，都相信「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的」（1:17）；對「主的兄弟」讀法不同的天主教、東正教與新教，都相信耶穌是主。爭議多，表示這卷書被認真讀了兩千年，不表示它不可信。</p>"],["問問題就是心懷二意（只要信，不要問）","","<p>這是教會裡常見的反應：1:6 說「一點不疑惑」，所以有疑問就是信心不夠堅定；這些爭議會絆倒人，最好不要在教會裡講，信徒只要單純地信就好。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們信心最終是對神的信靠，不是靠學問得來的。</p><p><strong>難處：</strong>雅各說的「疑惑」，不是頭腦裡的問題，是心裡的兩邊下注——一邊求神，一邊又把指望放在世界；1:5 明明說神「厚賜與眾人、也不斥責人」，提出問題的人正是在向神求智慧。把有問題的人都說成心懷二意，是把雅各的話反過來用了；而且不准問的信心最脆弱，一旦在別處聽見這些問題，就會以為教會一直在隱瞞甚麼。</p>"],["分層看待（根基與枝節）","","<p>主張要分清楚哪些是根基、哪些是枝節：在根基上站穩的人，可以帶著謙卑與好奇去面對枝節上的爭議。雅各書自己就有根基：神是「眾光之父」，「在他並沒有改變，也沒有轉動的影兒」（1:17）；「他按自己的旨意，用真道生了我們」（1:18）；「但他賜更多的恩典」（4:6）；「主是滿心憐憫，大有慈悲」（5:11）。這派的優點是既不迴避問題，也不讓問題動搖根基。</p><p><strong>難處：</strong>甚麼是根基、甚麼是枝節，本身有時也有爭議；有些人會把自己的宗派立場都放進「根基」裡，有些人則把重要的事都推到「枝節」去。所以分層需要謙卑，也需要回到經文本身與歷代教會共同的信仰告白——這正是 3:17 說的從上頭來的智慧：「溫良柔順……沒有偏見，沒有假冒」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。</strong>全卷的爭議，本講義都已在 ISS00_1–8 交代：處境（ISS00_1）、信心與行為（ISS00_2）、貧富與偏心（ISS00_3）、疾病與認罪（ISS00_4）、舌頭與論斷（ISS00_5）、作者（ISS00_6）、年代（ISS00_7）、正典與路德（ISS00_8）。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。</p><p>但有幾件事，全卷沒有任何一個爭議動搖過：<strong>一切美善從上頭來（1:17）；神用真道生了我們（1:18）；他賜更多的恩典（4:6）；「你們親近神，神就必親近你們」（4:8）；「主是滿心憐憫，大有慈悲」（5:11）。</strong>這是雅各書的根基，也是本講義全卷的根基。</p><p>1:6–8 的「心懷二意」，本講義讀作心的分裂，不是頭腦的提問：在問題面前仍向神求、仍親近神的人，不是心懷二意；一邊說信、一邊把指望放在金戒指與自己的計畫上的人，才是。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你退後，但可以讓你長進。雅各說試煉要「使你們成全、完備，毫無缺欠」（1:4），問題也可以是這樣的試煉：在問題裡仍然向那「不斥責人的神」求智慧，信心就被磨得更真。問問題不是不信；在問題面前轉身離開神，才是雅各擔心的心懷二意。</p><p>如果你讀完這九題，發現自己的問題比答案多，請記得雅各給心懷二意的人的藥方，不是先把所有問題答完，而是：<strong>「你們親近神，神就必親近你們」（4:8）——不是靠我們把每一個問題都想通，是那位「賜更多的恩典」的神先走近我們。</strong></p>"]],"con":[],"say":"本講義的全卷立場：雅各書的爭議都發生在「怎樣理解」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。一切美善從上頭來，神用真道生了我們，他賜更多的恩典，主是滿心憐憫；這些沒有一個爭議動搖過。有問題不是心懷二意，在問題裡仍向神求的人，正是 1:5 說的人。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，有一聽到「學者有爭論」就不安的長輩，還有曾被人用 1:6–8 說「你有疑問就是心懷二意」而不敢再禱告的人。對第一種人，不要用一堆答案堵住他，先陪他，從 1:5 讀起；對第二種人，指給他看 1:17 與 5:11；對第三種人，讓他知道神「厚賜與眾人、也不斥責人」。疑惑若伴隨長期失眠或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:1 哪一位雅各？「主的兄弟」是同母的弟弟、約瑟前妻的兒子，還是堂表兄弟？","r":"1:1；加 1:19；可 6:3；徒 15:13","ch":[1],"why":"新約至少有四位雅各，讀者第一個問題就是：寫信的是哪一位？確定是「主的兄弟」雅各之後，第二個問題接著來：「兄弟」是甚麼意思？這一題牽動不同宗派對馬利亞的理解，在家族與宗派之間很容易變成爭吵；可是雅各自己在 1:1 連這個頭銜都沒有用。","pos":[["【一】經文問的是甚麼","","<p>1:1 只說「作神和主耶穌基督僕人的雅各」，沒有說他是誰的兄弟。新約裡的雅各至少有四位：西庇太的兒子雅各（約翰的哥哥，早在主後 44 年前後就被希律「用刀殺了」，徒 12:2）、亞勒腓的兒子雅各、猶大（不是加略人）的父親雅各，以及「主的兄弟雅各」（加 1:19）。能用這樣簡短的自稱、讓散居各地的信徒一聽就知道是誰的，最合理的是耶路撒冷教會的領袖——主的兄弟雅各（徒 15:13；21:18；加 2:9）。</p><p>真正有爭議的是第二層：「主的兄弟」的「兄弟」指甚麼。馬可記載鄉人說耶穌是「雅各、約西、猶大、西門的長兄」（可 6:3）。</p>"],["同母弟弟說（赫爾維狄烏斯說）：馬利亞與約瑟在耶穌之後所生","","<p>多數更正教學者採這一說：福音書一再把這些弟兄與馬利亞並列（太 13:55；可 6:3），最自然的讀法是同一個家庭；太 1:25「等他生了兒子」也被讀成之後有正常的夫妻生活。這一說讓雅各的轉變特別動人——一同長大的弟弟，曾經和家人以為哥哥癲狂了。</p><p><strong>難處：</strong>主耶穌在十字架上把母親交給門徒約翰，而不是交給這些弟弟，有人認為這說明家中另無親生兒子；早期教會相當多的教父也不採這一說。「兄弟」一詞在希伯來與亞蘭語境裡本來就可以指較寬的親屬。</p>"],["約瑟前妻之子說（伊皮法紐說）：同父異母的哥哥","","<p>東正教傳統採這一說，二世紀的《雅各原始福音》已有類似說法：約瑟是鰥夫，前妻留下幾個兒子，所以他們比耶穌年長。這可以解釋為甚麼這些「兄弟」敢出來「拉住他」（可 3:21），也解釋十字架上的託付，同時保存馬利亞終身童貞的傳統。</p><p><strong>難處：</strong>福音書與新約其他書卷沒有提到約瑟有前妻；主要依據來自較晚的外典傳說，可信度不高。而且如果他們是約瑟的兒子，耶穌作為「長子」的身分（路 2:7）就需要另作說明。</p>"],["堂表兄弟說（耶柔米說）：「兄弟」是親族之稱","","<p>天主教傳統多採這一說：耶柔米主張這些「兄弟」是表兄弟，雅各可能就是亞勒腓（有人認為即革羅罷）的兒子，母親是站在十字架旁的另一位馬利亞（約 19:25）。舊約也有把姪子稱為「弟兄」的例子（創 13:8 亞伯蘭與羅得）。</p><p><strong>難處：</strong>新約希臘文有專指表親的字（ἀνεψιός，西 4:10），作者卻一律用「兄弟」；又要把主的兄弟雅各與十二使徒中的亞勒腓之子視為同一人，但約 7:5 說主的弟兄「不信他」，與使徒身分很難並存。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_6：作者是主的兄弟雅各；三說只在議題頁並陳，尊重各宗派，不嘲諷、不在講台爭論。</strong>本章只多加一筆：三說各有難處，卻都同意同一件事——這位雅各曾經不信（約 7:5），復活的主向他顯現（這使我們想起林前 15:7），後來他寫信時只稱自己是「神和主耶穌基督僕人」。</p><p>本來最有資格抓住「主的兄弟」這個頭銜的人，自己把它放下了。講台要講的，是他放下了甚麼，不是替他把頭銜撿回來。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三說都承認耶穌是由童女馬利亞所生、是神的兒子，也都承認雅各後來成了耶路撒冷教會的柱石。爭的是馬利亞以後的家庭，不是救恩的根基。</p><p>如果你家裡有天主教或東正教的親人，這一題不是你們的戰場；你們可以一起讀 1:1，一起看見一個從不信到作僕人的人。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的全卷立場見 ISS00_6：作者是主的兄弟雅各，「兄弟」三說只在議題頁並陳，不在講台爭論；講台只講三說都同意的事——曾經不信的弟弟，後來只稱自己是「僕人」。","care":"會眾席上可能有從天主教背景信主的人，家裡還有每天念玫瑰經的母親；也可能有剛讀完網路文章、急著要證明「天主教錯了」的年輕人。不要在講台上用這一題分出誰對誰錯，更不要嘲笑任何傳統對馬利亞的敬重。陪那位有天主教家人的人看見：雅各的故事是可以和母親一起讀的；陪那位急著辯論的年輕人看見：雅各自己連頭銜都放下了，我們不必替他打這一仗。"},{"id":"ISS01_2","t":"1:1「散住十二個支派之人」——這封信是寫給猶太信徒，還是所有教會？","r":"1:1；彼前 1:1；徒 8:1；徒 11:19","ch":[1],"why":"「十二個支派」是以色列的稱呼，「散住」原文是 διασπορά（散居、撒種）。這封信到底是寫給散居各地的猶太基督徒，還是用以色列的語言稱呼全世界的教會？答案影響我們怎樣讀全卷的處境——貧窮、欺壓、會堂式的聚會——也牽動有人把「十二支派」套到今日某個民族或宗派身上的講法。","pos":[["【一】經文問的是甚麼","","<p>1:1 的收信人是「散住十二個支派之人」。信裡又透露：他們在「會堂」（2:2 原文 συναγωγή）裡聚會，引用律法和亞伯拉罕、喇合、約伯、以利亞像引用自家的祖先，被富足人「拉你們到公堂去」（2:6），做工的被「虧欠他們的工錢」（5:4）。問題是：「十二個支派」是字面的民族身分，還是屬靈的稱呼？</p>"],["猶太信徒說：寫給散居各地的猶太基督徒","","<p>多數學者採這一說。使徒行傳說耶路撒冷大遭逼迫之後，門徒「都分散在猶太和撒馬利亞各處」（徒 8:1），又有人「直走到腓尼基和塞浦路斯，並安提阿」（徒 11:19）；雅各是耶路撒冷教會的領袖、在加 2:9 負責「往受割禮的人那裡去」，寫信給這些散出去的猶太信徒最合情理。信中沒有提到割禮、守節之爭，也合乎全是猶太人的群體。</p><p><strong>難處：</strong>信中的教導（試煉、舌頭、貧富、謙卑）完全普世，看不出只適用於猶太人；而且如果只寫給猶太信徒，今天外邦信徒讀這封信，似乎就隔了一層。</p>"],["全教會說：用以色列的語言稱呼新約的神的子民","","<p>另一些學者指出，新約常把教會稱為新的以色列：彼得寫信「給那分散在本都、加拉太……寄居的」（彼前 1:1），對象包括外邦信徒；保羅稱信徒為「神的以色列民」（加 6:16）。「十二支派」可以是一個象徵：神完整的子民，如今散在世界、在地上作客旅。</p><p><strong>難處：</strong>雅各書的猶太色彩特別濃，「會堂」一詞也只在這裡用來指基督徒的聚會；完全抹去民族背景，容易讀不出這群人的具體處境——他們是一群在外邦城市裡做工、被欺壓的猶太少數群體。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_1：收信人主要是散居各地、貧窮受欺壓的猶太信徒；處境不是一個事件，是一種生活。</strong>因為原則是從福音推出來的（一切美善從上頭來、神用真道生了我們），所以同樣適用於今天每一位信徒；落點隨處境，原則照守。</p><p>本章多加一筆：「散住」也是撒種的字。被散出去，不只是流離，也是被神撒在各城。今天在海外工作、移民、在線上聚集的弟兄姊妹，正是在這個處境裡讀這封信。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。無論收信人是猶太信徒還是全教會，這封信都被歷代教會領受為神的話，寫給「我的弟兄們」。爭的是第一批讀者是誰，不是這封信對你有沒有權柄。</p><p>要小心的是另一種講法：把「十二支派」套到今日某個民族、某個宗派、甚至某個團體身上，說只有他們才是「真以色列」。那不是雅各的意思。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的全卷立場見 ISS00_1：雅各書主要寫給散居各地的猶太信徒，處境是一種在異鄉、在貧窮、在試煉裡的生活；原則是從福音推出來的，所以今天每一位「散住」的信徒都在這封信的收信人裡。","care":"會眾席上有在異鄉做工的移工、剛移民的家庭、獨自在外讀書的學生，他們對「散住」最有感覺，也最容易覺得自己是邊緣人。不要只把這一題講成學術考證，要讓他們聽見：這封信第一句就是寫給像你這樣的人。也不要讓任何人用「十二支派」宣稱自己的族群或團體比別人更屬神。"},{"id":"ISS01_3","t":"1:2「都要以為大喜樂」——受苦的人可以難過嗎？","r":"1:2--4；4:9；5:13","ch":[1],"why":"這一節常被拿來對剛喪親、剛確診、剛被裁員的人說「要喜樂」。不少弟兄姊妹因此以為，在神面前哭是信心軟弱，只好在教會裡戴著笑臉，回家一個人崩潰。這一題直接關係到教會怎樣陪伴受苦的人，是本章最需要保護人的一題。","pos":[["【一】經文問的是甚麼","","<p>「我的弟兄們，你們落在百般試煉中，都要以為大喜樂」（1:2）。「以為」原文 ἡγήσασθε（hēgēsasthe），是「算為、認定」，會計與判斷的字，不是描寫情緒。下一節說明理由：「因為知道你們的信心經過試驗，就生忍耐」（1:3）。問題是：雅各是在命令一種感覺，還是在要求一個判斷？受苦的人可以一面難過，一面「以為大喜樂」嗎？</p>"],["情緒說：基督徒在試煉中應當感到快樂","","<p>有些講法把這一節讀成情緒的命令：真正有信心的人，在苦難中會從心裡湧出喜樂；如果只有悲傷，表示交託得不夠。支持者會引保羅與西拉在監裡唱詩（徒 16:25），說喜樂是聖靈的果子，應該在試煉中顯明出來。</p><p><strong>難處：</strong>這說法與經文本身的字不合（ἡγήσασθε 是認定，不是感覺），也與雅各自己衝突——他在 4:9 叫人「要愁苦、悲哀、哭泣」，在 5:13 說「你們中間有受苦的呢，他就該禱告」；主耶穌在拉撒路墳前也「哭了」（約 11:35）。把情緒當成信心的分數，會讓受苦的人多背一層罪咎。</p>"],["認定說：喜樂是對結局的判斷，可以與眼淚並存","","<p>多數解經家採這一說：雅各要的是一個「知道」之後的認定——神要藉這場試煉證明信心是真的、叫忍耐做完它的工、使人「成全、完備」（1:4）。這種喜樂像遠方的燈，人可以哭著走向它。這使我們想起主耶穌「因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難」（來 12:2）：喜樂在前面，苦是真的。</p><p><strong>難處：</strong>如果講得太快、太輕，「認定」也可能變成另一種命令——叫人在最痛的那一夜就要把結論想清楚。認定有時需要時間；有些人要哭很久，才能說出那一句「我知道」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採認定說：喜樂是一個認定，不是假裝不痛。受苦的人可以難過，眼淚可以在臉上，認定可以慢慢長在心裡。</strong>雅各把喜樂和試煉放在同一口氣裡，是因為他知道終點——「忍耐也當成功」；他沒有要人跳過眼淚，他自己在 4:9、5:13 都留了哭與禱告的位子。</p><p>從上頭來的那一樣，在這裡是神自己：「在他並沒有改變，也沒有轉動的影兒」（1:17）。人可以哭著認定這一位沒有變。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你在試煉裡哭，不代表你沒有信心；你一時說不出「喜樂」，也不代表你失敗了。詩篇有一大半是哭著寫的，主耶穌在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38）。</p><p>對你今天最重要的，不是逼自己笑，而是在哭的時候仍然對神說話。那就是 1:5 的開始：缺少的，就求。受苦與成功神學的立場回指希伯來書立場四；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:2「以為大喜樂」是一個認定，不是假裝不痛；受苦的人可以難過，雅各自己也叫人哭（4:9）、叫受苦的人禱告（5:13）。喜樂是確知神要藉試煉成全我們，這個認定可以和眼淚並存。","care":"會眾席上最容易被這一節刺傷的，是剛辦完喪事的人、孩子在加護病房的父母、婚姻剛破裂的人、長年病痛的人。牧者要做的是先陪他哭（羅 12:15「與哀哭的人要同哭」），先坐下來、先聽，過幾週再一起讀 1:2--4。不要說：「你要喜樂啊」「哭就是沒有交託」「神這樣做一定有祂的美意，你要感恩」；這些話在最痛的那一夜說，只會把人推離神。"},{"id":"ISS01_4","t":"1:5--8「一點不疑惑」——我心裡有懷疑，神就不聽我的禱告嗎？","r":"1:5--8；可 9:24；4:8","ch":[1],"why":"「那疑惑的人……這樣的人不要想從主那裡得甚麼」（1:6--7）讀起來很嚇人。許多誠實的信徒心裡常有問號，也有人禱告多年沒有得著，被人說「是你心裡有懷疑」。這一題關係到禱告的勇氣，也牽涉到把禱告結果歸給信心強弱的成功神學。","pos":[["【一】經文問的是甚麼","","<p>1:5 先說神「厚賜與眾人、也不斥責人」，原文 ἁπλῶς（haplōs）是單純地給、不打折扣。1:6 接著說「只要憑著信心求，一點不疑惑」，「疑惑」原文 διακρινόμενος（diakrinomenos），字根是「判斷、分辨」，像心裡的法庭判來判去。1:8 再把這種人稱為 δίψυχος（dipsychos）——「兩個魂的」，新約只出現在 1:8 與 4:8。問題是：雅各說的疑惑，是理智上的問號，還是心裡的分裂？</p>"],["理智懷疑說：禱告時心裡不能有任何問號","","<p>有些講法把「一點不疑惑」讀成：禱告時要百分之百確定神會照你所求的成就，心裡一有問號，禱告就失效。支持者會引主耶穌說「你們禱告，無論求甚麼，只要信，就必得著」（太 21:22），強調信心的確定性。</p><p><strong>難處：</strong>這樣讀，主詞就從神轉到人的心理狀態，禱告成了一場信心的考試。福音書裡那位父親說「我信！但我信不足，求主幫助」（可 9:24），主耶穌沒有拒絕他，反而醫好了孩子；1:5 也說神「不斥責人」。這一說也容易滑向「禱告沒得著是信心有問題」，那正是全卷立場要防的講法。</p>"],["二心說：疑惑是兩邊都要、不肯結案的心","","<p>多數解經家從 1:8 回頭讀 1:6：雅各說的疑惑，是「心懷二意」——一邊向神求，一邊靠另一個主；求了智慧，又保留不照著做的權利。這使我們想起主耶穌說「一個人不能事奉兩個主」（太 6:24）。像海浪「被風吹動翻騰」，不是因為有問號，是因為沒有一個錨。4:8 再用同一個字收尾：「心懷二意的人哪，要清潔你們的心！」</p><p><strong>難處：</strong>二心與疑問在生活裡不容易分清楚；有人誠實地掙扎，也可能被貼上「二心」的標籤。這一說也要小心，不要把「不肯結案」講成又一份需要做到的屬靈功課。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採二心說：雅各說的疑惑不是心裡有問號，是心分成兩半、兩邊都要。神不嫌你問；他不肯和另一個主分享你。</strong>帶著問號來求的人，正是 1:5 要接住的人。禱告沒有照所求得著，不是禱告的人信得不夠；信心、受苦與成功神學的全卷立場回指希伯來書立場四，與 ISS00_4。</p><p>從上頭來的那一樣，在這裡是智慧：你缺，就求；那一位給的時候不翻舊帳。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你更不敢禱告，反而該讓你更誠實地禱告。把你的問號帶到神面前，本身就是信心；真正要處理的，是你心裡有沒有另一個王——另一個你更相信、更依靠的東西。</p><p>如果你禱告很久還沒有看見答案，請你不要以為自己被拒絕了。繼續求，也找一位弟兄姊妹陪你一起求。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:6 的疑惑是 1:8「心懷二意」——兩邊都要、不肯結案，不是心裡有問號；神「厚賜與眾人、也不斥責人」，帶著問號來求的人他接住。禱告沒有得著，不能歸給禱告的人；全卷立場見 ISS00_4，並回指希伯來書立場四。","care":"會眾席上有為不信的配偶禱告十年的姊妹、為重病孩子禱告的父母、心裡常有信仰問號的大學生；也有人曾經被錯誤地告知「你的病沒好，是因為你心裡有懷疑」，從此不敢再禱告。牧者要先接住他們的問號，可以和他們一起讀可 9:24。不要說：「你要更有信心就會得著」「你一定是心裡還有懷疑」；這些話把神的應許變成人的考試。"},{"id":"ISS01_5","t":"1:9--11 卑微與富足——富人能得救嗎？","r":"1:9--11；路 18:25；提前 6:17","ch":[1],"why":"1:10--11 說富足的人「必要過去，如同草上的花」「在他所行的事上也要這樣衰殘」，5:1--6 又嚴厲責備富足人。有人據此認為雅各把富人一概排除在神國外，也有人以為窮人自動比較屬靈。這一題直接影響教會怎樣看待會友的財富，也牽動教會內的偏心。","pos":[["【一】經文問的是甚麼","","<p>「卑微的弟兄升高，就該喜樂；富足的降卑，也該如此；因為他必要過去，如同草上的花一樣」（1:9--10）。這使我們想起賽 40:6--8「凡有血氣的盡都如草」。關鍵在 1:10 的「富足的」：前一節明說「卑微的弟兄」，這一節沒有重複「弟兄」。問題是：這位富足的人是教會裡的弟兄，還是教會外的富人？他的「降卑」是喜樂的理由，還是審判的宣告？</p>"],["弟兄說：富足的人也是信徒，他的喜樂在於降卑","","<p>不少解經家認為「弟兄」一詞同時管 1:9 和 1:10：卑微的信徒誇他在基督裡被升高，富足的信徒誇他在基督裡被降卑——他終於看清楚，錢不能定義他，他和窮弟兄一樣站在十字架前。這和提前 6:17 相合：「囑咐那些今世富足的人，不要自高，也不要倚靠無定的錢財」，富人不是被排除，是被重新排位。</p><p><strong>難處：</strong>1:11 說富足的人「在他所行的事上也要這樣衰殘」，語氣像審判；雅各書其他提到富足人的地方（2:6--7；5:1--6）幾乎都是指教會外的欺壓者。</p>"],["非信徒說：這是對外面富足人的反諷","","<p>另一些學者認為 1:10 的富足人是教會外的人，「也該如此」是一句反諷：讓他去誇他的降卑吧——那就是他終將衰殘的結局。這和 5:1--6 前後呼應，也和主耶穌的話相合：「駱駝穿過針的眼比財主進神的國還容易呢」（路 18:25）。</p><p><strong>難處：</strong>主耶穌接著說「在人所不能的事，在神卻能」（路 18:27）；新約裡也有富足的門徒（亞利馬太的約瑟、呂底亞）。若把這一節讀成富人一概沒有盼望，容易誤入仇富，也會讓教會裡有財富的人覺得被定罪。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見 ISS00_3：財富不是罪，但財富有方向；本講義不仇富，也不美化貧窮。</strong>本章採弟兄說為主：雅各給窮的、富的同一個喜樂的理由——神把位置重新排過。富人能不能得救？和每一個人一樣，靠的是「用真道生了我們」（1:18）的神，不是存款，也不是貧窮。</p><p>本章多加一筆：唯一合法的誇口（Καυχάσθω）是誇神的翻轉。從上頭來的，窮人富人都只能領受。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若富足，不必因此懷疑得救；你要問的是，你的錢還在不在寶座上。你若貧窮，也不必因此覺得自己比較屬靈；你要記得，你在神面前是被升高的人。</p><p>兩種人最後站在同一個十字架前：主耶穌「本來富足，卻為你們成了貧窮」（林後 8:9）。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的全卷立場見 ISS00_3：財富不是罪，但有方向；1:9--11 給卑微的和富足的同一個喜樂——神重新排過位置。人得救靠的是用真道生了我們的神，不是貧窮，也不是財富。","care":"會眾席上有剛創業成功、心裡怕被說成「財主」的弟兄，也有低薪做工、常在教會裡覺得自己不被看見的姊妹。不要在講台上說「有錢人都很難得救」，也不要說「窮是因為不夠蒙福」。陪富足的人看見錢可以從寶座上請下來、變成看顧人的手；陪貧窮的人看見自己在神面前的位置。教會更要先檢查自己有沒有按奉獻多少待人。"},{"id":"ISS01_6","t":"1:13「神也不試探人」——那主禱文「不叫我們遇見試探」、神試驗亞伯拉罕又怎麼說？","r":"1:13；太 6:13；創 22:1；1:2","ch":[1],"why":"1:13 說神「不試探人」，可是主耶穌教我們禱告「不叫我們遇見試探」（太 6:13），創 22:1 又說「神要試驗亞伯拉罕」，1:2 也說我們落在「百般試煉中」。同一個字在中文翻成試煉、試驗、試探，讓許多人困惑：神到底會不會試探人？這關係到受苦的人怎樣看神，也關係到跌倒的人會不會把責任推給神。","pos":[["【一】經文問的是甚麼","","<p>1:2「百般試煉」、1:12「忍受試探」、1:13「被試探」，原文都是 πειρασμός／πειράζω（peirasmos / peirazō）。這個字本身是中性的：測試、考驗；放在誰的手裡、目的是甚麼，決定它是「試驗」還是「引誘」。1:13 說「神不能被惡試探，他也不試探人」——ἀπείραστός ἐστιν κακῶν（apeirastos estin kakōn），新約僅此一次。問題是：這一節和創 22:1、太 6:13 怎樣同時成立？</p>"],["目的區分說：神試驗是為了成全，從不引誘人犯罪","","<p>多數解經家這樣讀：神試驗亞伯拉罕（創 22:1），目的是證明、堅固他的信心，結局是「這就應驗經上所說」（2:23）；1:13 否認的是另一件事——神不會以叫人跌倒為目的去引誘人。1:3 的「試驗」δοκίμιον 是煉金的字，火是為了證明金子；1:14 的「牽引誘惑」是釣魚的字，餌是為了害魚。同一個處境，神的手裡是爐，私慾的手裡是鉤。</p><p><strong>難處：</strong>這一說要分清目的，可是人在處境裡往往分不清：這場病是試驗，還是我自己跌進去的？講得太快，容易讓受苦的人以為一切都要自己分析清楚。</p>"],["主禱文的讀法一：求神不要帶我們進入會跌倒的處境","","<p>「不叫我們遇見試探」（太 6:13）可以讀成：主啊，不要把我們帶進我們承受不住的試驗。這不是說神會引誘人，而是承認我們軟弱，求父保護；後半句「救我們脫離凶惡」正是同一個禱告。這和主在客西馬尼說「總要警醒禱告，免得入了迷惑」（太 26:41）相合。</p><p><strong>難處：</strong>如果神本來就不試探人，為甚麼還要求他「不叫我們遇見」？有人因此覺得兩處經文在打架。</p>"],["主禱文的讀法二：求神在試探來時不讓我們落入它的手","","<p>另一種讀法認為主禱文的「遇見」原文 εἰσενέγκῃς 是「帶進去」，重點在被試探的力量吞沒；禱告的意思是：在試探臨到時，不要讓我們被它拖進去，救我們脫離那惡者。這和 1:14--15 的家譜呼應：試探來是一回事，被私慾「懷了胎」是另一回事。</p><p><strong>難處：</strong>這一讀把重點放在結果，比較少處理「誰把人帶進處境」的問題；講得太細，會讓會眾聽成文法課。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採目的區分說：神會試驗人，為要成全；神從不引誘人，為要害人。試探的拉力來自「自己的私慾」（1:14）。</strong>主禱文兩種讀法都通，共同的意思是：我們承認自己軟弱，求父保守。兩處經文不打架，是同一位父親從兩面保護我們。</p><p>從上頭來的，只有「各樣美善的恩賜」（1:17）；神手裡沒有陷阱。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你在試煉裡，可以確信神不是在設局害你；你在試探前跌倒，也不必再用「是神讓我遇到的」來安慰自己。兩件事放在一起，你就既不怕神，也不推給神。</p><p>每天照主教導的禱告：「不叫我們遇見試探，救我們脫離凶惡。」這是一個知道自己軟弱的孩子，對父親說的話。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：同一個字在神手裡是試驗、在私慾手裡是引誘；神試驗人為要成全（創 22:1），從不引誘人犯罪（1:13）。主禱文是承認軟弱、求父保守，和 1:13 不衝突。","care":"會眾席上有正在受苦、心裡偷偷覺得「神在整我」的人，也有一跌倒就說「是神讓這件事發生的」的人。對受苦的人，不要說「這是神在試探你」，要說「神沒有在設局害你，他要在這裡成全你」；對推卸的人，不要急著責備，陪他看見 1:14 的「自己的」，再陪他看見 1:17 從上頭來的恩典。不要把這一題講成文法辯論，讓人更困惑。"},{"id":"ISS01_7","t":"1:14--15 私慾與試探——被試探，就等於已經犯罪了嗎？","r":"1:14--15；來 4:15；太 4:1","ch":[1],"why":"許多在性的試探、色情、賭博或其他上癮中掙扎的信徒，一有念頭就覺得自己已經犯罪、已經完了，於是乾脆放棄掙扎；也有人反過來說「只是想想而已，沒關係」。1:14--15 這份「家譜」正好回答這兩種講法，是本章最需要牧養的議題之一。","pos":[["【一】經文問的是甚麼","","<p>「但各人被試探，乃是被自己的私慾牽引誘惑的。私慾既懷了胎，就生出罪來；罪既長成，就生出死來」（1:14--15）。「牽引誘惑」ἐξελκόμενος καὶ δελεαζόμενος（exelkomenos kai deleazomenos）是釣魚打獵的字：被拖出去、被餌引誘。1:15 用生產的畫面寫出一份家譜：私慾懷胎→生罪→罪長成→生死。問題是：罪在家譜的哪一代開始？念頭本身算不算罪？</p>"],["懷胎說：念頭與吸引還不是罪，接納並餵養它才是","","<p>多數解經家照雅各自己的次序讀：「懷了胎」συλλαβοῦσα（syllabousa）是一個接住、抱住的動作，然後才「生出罪來」。主耶穌「被聖靈引到曠野，受魔鬼的試探」（太 4:1），希伯來書說他「凡事受過試探，與我們一樣，只是他沒有犯罪」（來 4:15）——被試探本身不是罪，否則耶穌就犯了罪。</p><p><strong>難處：</strong>主耶穌說「凡看見婦女就動淫念的，這人心裡已經與她犯姦淫了」（太 5:28），似乎內心的動念已經是罪。懷胎說要說明：主說的是有意地看、抱著目的去想，那已經是「懷了胎」，不是念頭閃過。</p>"],["私慾即罪說：私慾本身已經是墮落的本性，需要被認罪","","<p>改革宗傳統裡有一種較嚴格的讀法：1:14 的 ἐπιθυμία（epithymia）是墮落的心裡失序的渴望，本身就有罪的性質，不是中性的念頭；所以信徒不只要為行出來的罪悔改，也要為心裡的私慾哀哭。這使我們想起保羅說「我真是苦啊！誰能救我脫離這取死的身體呢？」（羅 7:24）</p><p><strong>難處：</strong>雅各自己把「私慾」與「罪」分成兩代，1:15 說私慾懷了胎「就生出罪來」；若把一切渴望都等同於罪，掙扎的人會以為自己永遠在罪中，失去轉身的力氣。這一說若講得不夠小心，就會與經文的次序相反。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採懷胎說：試探不是罪；私慾「懷了胎」——人接住它、抱住它、餵養它——才生出罪來。</strong>這一說同時保護兩種人：掙扎的人不被定罪，念頭來的那一刻正是轉身的那一刻；玩火的人不被錯誤地安慰，因為罪會「長成」，家譜的最後一代是死。</p><p>從上頭來的那一樣，緊接在後：三節之後，神用同一個「生」字，「用真道生了我們」（1:18）。斷開私慾的家譜，靠的是另一份家譜。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你在某種試探裡掙扎很久，請你知道：念頭來了，不代表你已經失敗，更不代表你不屬神。主耶穌「自己既然被試探而受苦，就能搭救被試探的人」（來 2:18）。你需要的是把餌帶到光中，告訴一位可信任的同伴，必要時接受專業的協助。</p><p>如果你一直說「只是想想而已」，請你也知道：今天容許的，明年會長大。救恩會不會失落，回指希伯來書立場二；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：試探不是罪——主耶穌也受過試探；私慾「懷了胎」才「生出罪來」。掙扎的人需要陪伴與幫助，不是定罪；但罪會長成，斷開它最好的時候是第一代。","care":"會眾席上有在色情、賭博、酒精、網路成癮裡掙扎的弟兄姊妹，有些人已經掙扎了十幾年，從來沒有對任何人說過；也有因為性的試探或性傾向的掙扎而深深羞恥的青少年。牧者要做的是創造一個說得出口的地方：保密、不驚訝、不立刻定罪，必要時協助轉介輔導與戒癮資源。不要說：「你有這種念頭就已經犯罪了」「你這樣怎麼還敢來教會」，也不要在講台上用他們的掙扎當例子。"},{"id":"ISS01_8","t":"1:18「用真道生了我們」「初熟的果子」——這是講重生，還是講創造？","r":"1:18；彼前 1:23；1:15；1:21","ch":[1],"why":"1:18 是雅各書最重要的恩典句，也是全卷不被讀成道德手冊的護欄。可是這一節到底是講神創造人類、使人在受造物中居首，還是講神藉福音使信徒重生？答案決定我們怎樣讀 1:21「所栽種的道」、1:25「全備的律法」，也牽動第 2 章信心與行為的讀法。","pos":[["【一】經文問的是甚麼","","<p>「他按自己的旨意，用真道生了我們，叫我們在他所造的萬物中好像初熟的果子」（1:18）。「生了」ἀπεκύησεν（apekyēsen）與 1:15「生出死來」的 ἀποκύει（apokyei）是同一個字；「真道」λόγῳ ἀληθείας（logō alētheias）；「初熟的果子」ἀπαρχήν（aparchēn）。前面又說神是「眾光之父」——造天上光體的那一位。問題是：這裡的「生」是創造還是重生？</p>"],["創造說：神用他的話創造人類，使人在受造物中居首","","<p>少數解經家注意到上下文的創造語言：1:17「眾光之父」使人想起創世記第一章，1:18「他所造的萬物」也是創造的字；神用話語造了萬物，人被造成受造物中「初熟的果子」，居首位。這也與 3:9「照著神形像被造的人」呼應。</p><p><strong>難處：</strong>「我們」在雅各書一貫指信徒；「真道」在新約常指福音（弗 1:13「真理的道，就是那叫你們得救的福音」）；1:21 又說這道「能救你們靈魂」——救恩的語言，不是創造的語言。把 1:18 讀成一般創造，會削弱全卷最重要的恩典句。</p>"],["重生說：神藉福音的道使信徒重生，成為新造的初熟果子","","<p>多數解經家採這一說：與彼前 1:23「你們蒙了重生……是藉著神活潑常存的道」幾乎同義；「初熟的果子」是舊約獻給神的第一份收成，信徒是神新創造中的第一批，預告將來萬物的更新。這使我們想起林後 5:17「若有人在基督裡，他就是新造的人」。</p><p><strong>難處：</strong>這一說要解釋 1:17--18 的創造語言；比較好的說法是：雅各故意用創造的語言講重生——那位造光的父，如今用他的話造了一群新人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採重生說，並保留創造的回聲：造光的父，用真道生了我們；信徒是他新創造的初熟果子。</strong>這一節是全卷的護欄：雅各後面的每一個「要」與「不可」，都是從這一句恩典長出來的。行道不是為了被神生出來，是因為已經被生出來；信心與行為的全卷立場見 ISS00_2。</p><p>本章多加一筆：同一個「生」字出現兩次。私慾的家譜生出死，神的家譜生出我們——全卷第一個「從上頭來」，就在這裡。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑，反而該讓你更確定。無論讀成創造或重生，主詞都是神，動機都是「按自己的旨意」——不是因為我們夠好。</p><p>如果你常常覺得自己行得不夠、怕自己不是真的得救，請你每天讀一次 1:18：你不是靠努力爬進神的家，是被他生下來的。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:18 講重生，並帶著創造的回聲——造光的父用真道生了我們；這是全卷的恩典護欄，行道是被生下來的人長出來的生命，不是得救的條件。本講義的全卷立場見 ISS00_2。","care":"會眾席上有因為讀了雅各書而焦慮的人：「我行得不夠，我是不是沒有得救？」也有從律法主義背景出來、一聽到「要行道」就緊張的人。牧者要先帶他們讀 1:18，再讀 1:22。不要說：「你沒有行出來，就證明你根本沒重生」；要說：「神已經生了你，他種在你裡面的道會長出來，我們一起看它怎麼長。」"},{"id":"ISS01_9","t":"1:27「看顧孤兒寡婦」「保守自己不沾染世俗」——社會關懷與分別為聖怎樣並存？","r":"1:26--27；約 17:15；太 25:36","ch":[1],"why":"華人教會常在兩端擺盪：一端把「不沾染世俗」讀成與世隔離，不碰文化、不交非信徒朋友、對社會苦難沉默；另一端把信仰化約成社會服務，個人的聖潔變得無關緊要。1:27 一節同時講兩件事，正好是這場爭論的中心。","pos":[["【一】經文問的是甚麼","","<p>「在神我們的父面前，那清潔沒有玷污的虔誠，就是看顧在患難中的孤兒寡婦，並且保守自己不沾染世俗」（1:27）。原文兩個不定詞並列：ἐπισκέπτεσθαι（episkeptesthai）「探望、看顧」——醫生探病、牧人巡羊的字；τηρεῖν（tērein）「保守」，後面是 ἄσπιλον（aspilon）「沒有斑點」。一個往外走，一個往內守。問題是：兩者有沒有先後、輕重？</p>"],["分別說：重點在保守自己，關懷是聖潔的果子","","<p>敬虔傳統與部分基要派強調後半句：世界是會污染人的，信徒要「不要效法這個世界」（羅 12:2），先顧好自己的聖潔，關懷自然會從聖潔的生命流出。他們擔心教會一頭栽進社會事工，就失去福音與聖潔的焦點。</p><p><strong>難處：</strong>經文的次序是先講看顧孤兒寡婦；若只取後半句，很容易滑向隔離主義——把非信徒、文化、社會苦難都當成要避開的污染源，與主耶穌「我不求你叫他們離開世界」（約 17:15）的禱告相反。</p>"],["關懷說：重點在走出去看顧，信仰要落實在社會公義","","<p>社會福音與部分關懷傳統強調前半句：舊約說神「為孤兒寡婦伸冤」（申 10:18），主耶穌說「我病了，你們看顧我」（太 25:36）；沒有行動的敬虔是虛的（1:26）。今天的孤兒寡婦，就是失業者、移工、獨居長者、難民。</p><p><strong>難處：</strong>若只取前半句，信仰容易變成與神無關的公益；1:27 說這虔誠是「在神我們的父面前」，而且同一節還有「保守自己」。忽略個人的聖潔，服事的人自己也會被世界的價值——名聲、成效、權力——染色。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：1:27 兩件事一起要，不取一個丟一個——不沾染世俗的人，是走進世界看顧孤兒寡婦、自己卻沒有被世界的價值染色的人。</strong>像醫生走進病房，不是不碰病人，是洗淨了手再去碰。「世俗」在雅各書指的是與神為敵的價值體系（4:4），不是文化、職業或非信徒本身；4:4「淫婦」是先知的語言，問的是心屬誰。</p><p>這也是建立屬神的體系最初的樣子：一個群體怎樣對待它最弱的人，就是它的虔誠。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你在兩端之間二選一。你可以去探望一位獨居的長輩，同時在他家裡不講刻薄的話；你可以在職場做得很好，同時不被那裡的價值綁住。</p><p>如果你一直覺得信仰就是不碰世界，請你這週去敲一扇患難中的門；如果你一直忙著服務社會，請你這週也彎下腰，照一照 1:25 的鏡子。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:27 的虔誠是往外看顧與往內保守一起要；不沾染世俗不是與世隔離，是走進患難的家、自己卻沒有被世界的價值染色。「世俗」是與神為敵的價值，不是文化、職業或非信徒本身。","care":"會眾席上有在演藝、媒體、金融等行業工作、常被弟兄姊妹暗示「那裡很世俗」的人；也有在社福機構服事、覺得教會只會唱詩不做事的人；還有寡婦、單親家長、獨居長者，他們正是 1:27 說的那些人，卻常常沒有人探望。牧者不要用「世俗」羞辱任何一種職業或任何一位會友，也不要把關懷事工和聖潔對立起來；最好的回答是帶著小組，一起去探望一個人。"},{"id":"ISS02_1","t":"2:1--4 教會可以按奉獻、學歷、社會地位安排座位與事奉嗎？","r":"2:1--4；2:9；利 19:15；林前 1:26--28","ch":[2],"why":"這是雅各書第一個指名的教會罪，也是華人教會最常不自覺的一件事：前排留給誰、事奉名單照甚麼排、誰的意見在會議上比較被聽見。多數教會不會明文規定按身分排座位，但眼睛常常比規章先做了決定。這一題要分清楚：哪些安排是合理的分工與恩賜，哪些是 2:4 說的偏心。","pos":[["【一】經文問的是甚麼","","<p>「我的弟兄們，你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人」（2:1）。「按著外貌待人」原文 προσωπολημψία（prosōpolēmpsia），字面是「取人的臉」。2:2--3 的場景發生在「你們的會堂」，帶金戒指的人得到好位子，窮人只能站著或坐在腳凳下；2:4 說這是「偏心待人，用惡意斷定人」，2:9 更說「便是犯罪」。問題是：今天教會的座位、事奉、領袖人選，有沒有落在這兩節之下？</p>"],["合理分工說：安排位子看的是恩賜與成熟，不是身分","","<p>許多教會領袖指出，教會本來就要有次序：長執要有屬靈的資格（提前 3），講員、敬拜、財務需要不同的恩賜與經驗；請一位會計背景的弟兄管帳、請一位教師帶兒童主日學，不是偏心，是善用恩賜。雅各反對的是憑衣服、財富判斷人的價值，不是反對一切的安排。</p><p><strong>難處：</strong>這說法本身沒有錯，卻常被拿來替偏心掩護：「他奉獻多，所以有負擔」「他是博士，比較有見識」。當恩賜的語言與身分的標準重疊時，教會很難分辨自己是在看恩賜，還是在看金戒指。</p>"],["徹底平等說：教會裡不應有任何位子的區分","","<p>另一些人從 2:1--4 推出：教會裡不應有保留座、不應有職分的高低，所有事奉都應輪流，任何「前排」都是偏心的開始。他們提醒，初代教會在會堂式的小聚會裡，最容易的偏心就是座位；今天也是。</p><p><strong>難處：</strong>新約自己設立了長老與執事，也談到恩賜的不同（林前 12）；完全取消分工，教會反而容易被最會說話、最強勢的人主導。而且為長者、身障者、新朋友保留方便的座位，正是愛的表現，不是偏心。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為：分工與恩賜要有，但「誰坐哪裡、誰站上台、誰被聽見」不可以照奉獻、學歷、職業、國籍、口音來排。</strong>檢驗方法很簡單：同樣恩賜、同樣忠心的兩個人，一個是老闆、一個是外籍看護，我們給的機會一樣嗎？教會要從制度上預防偏心：事奉名單公開透明、分享輪流、招待有訓練，讓外籍弟兄姊妹與沒有頭銜的人也能進入同工團隊。本講義的全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該動搖你對神的信心，但應該動一動你對自己教會的看法。偏心是罪，不只是不禮貌（2:9）；可是承認它，是悔改的開始，不是信心的崩潰。</p><p>如果你曾經是被排在後面的那一位，請記得：「神豈不是揀選了世上的貧窮人，叫他們在信上富足」（2:5）。在神的帳本上，你從來不是腳凳下的人。</p>"]],"con":[],"say":"本講義的立場：教會可以按恩賜分工，但座位、事奉、發言的機會不可以照奉獻、學歷、職業、國籍、口音來排；偏心是罪，教會先照自己。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能坐著一位被長期排在後面的外籍移工或看護、一位因為口音被忽略的新移民、一位因為學歷不高從來沒被邀請事奉的長輩；也可能坐著一位奉獻很多、卻被人說「他是因為錢才當執事」而受傷的弟兄。不要點名任何一方，也不要說「我們教會沒有這個問題」。牧者先自己認，再陪會眾看見具體可以改的一件事。"},{"id":"ISS02_2","t":"2:2「會堂」——基督徒的聚會為甚麼叫會堂？","r":"2:2；徒 15:21；來 10:25","ch":[2],"why":"全本新約只有雅各書 2:2 把基督徒的聚會稱為「會堂」συναγωγή，其他書信都用「教會」ἐκκλησία（雅各自己在 5:14 也用 ἐκκλησία）。這個用字關係到雅各書的寫作時間、受書人的身分與處境，也幫助今天的讀者明白：雅各說的不是外面社會的偏心，是教會自己的門口。","pos":[["【一】經文問的是甚麼","","<p>「若有一個人帶著金戒指，穿著華美衣服，進你們的會堂去；又有一個窮人穿著骯髒衣服也進去」（2:2）。原文 εἰς συναγωγὴν ὑμῶν（eis synagōgēn hymōn），「你們的會堂」。問題是：這是指基督徒自己的聚會，還是指猶太人的會堂？雅各為甚麼用這個字，而不用 ἐκκλησία？</p>"],["基督徒聚會說：猶太信徒仍沿用熟悉的名稱","","<p>多數解經家認為，「你們的會堂」就是受書人自己的聚會。他們是「散住十二個支派之人」（1:1），多半是猶太背景的信徒，聚會的形式、座位的安排都沿用會堂的習慣；「會堂」原意就是「聚集的地方」或「聚集的人」。「你們的」這個所有格，表明這是信徒自己的聚會，不是外面的猶太會堂；這也支持雅各書寫得很早、信徒與猶太社群界線還不分明的看法。</p><p><strong>難處：</strong>同一封信 5:14 又用了「教會」，顯示雅各兩個字都會用；單憑一個字，不足以斷定寫作年代或受書人的全部身分。</p>"],["法庭聚集說：會堂裡的審斷聚會","","<p>有學者注意到 2:4「斷定人」、2:6「公堂」、2:9「定為犯法」都是法庭的用語，主張 2:2 的「會堂」是信徒為了處理糾紛而聚集的審斷場合：兩個打官司的人進來，一個有錢、一個貧窮，審斷的人照衣服給位子，判決也就偏了。這與利 19:15「不可偏護窮人，也不可重看有勢力的人」正好對應。</p><p><strong>難處：</strong>這讀法很有啟發，但經文沒有明說是審斷聚會；把場景限定在法庭，可能讓今天的讀者以為這段只關係到教會的紀律程序，而不是每個主日的門口。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採基督徒聚會說，並吸收法庭說的亮光：</strong>「你們的會堂」是信徒自己的聚集；雅各用法庭的字眼，是要說門口的眼睛其實就在審判人。這個用字讓這段經文不能被推到外面去——它不是在批評社會，是在照教會自己。寫作年代的問題見 ISS00_7；處境與原則的讀法見 ISS00_1。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：不論是主日聚會還是審斷場合，這是信徒自己的聚集，偏心發生在信徒中間。</p><p>對你今天最要緊的，是把「會堂」換成你自己的教會、你的小組、你的線上聚會：那扇門今天是怎樣待人的？爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:2「你們的會堂」是信徒自己的聚集，雅各沿用猶太信徒熟悉的名稱，並用法庭的字眼說出門口的眼睛就在審判人；這段經文照的是教會自己。本講義的全卷立場見 ISS00_1。","care":"會眾裡可能有猶太背景或對猶太教有負面印象的人，講「會堂」時不要貶低猶太人的會堂傳統，雅各與受書人都在這個傳統裡長大。也有些會眾聽到「這是教會自己的門口」會很不舒服，覺得被指責；牧者要先說「我們」，不說「你們」。"},{"id":"ISS02_3","t":"2:5「神豈不是揀選了世上的貧窮人」——神偏愛窮人嗎？","r":"2:5--7；路 6:20；林前 1:26--28；林後 8:9","ch":[2],"why":"2:5 很容易被兩頭讀歪：一頭說「神偏愛窮人，有錢人很難得救」，一頭把它屬靈化成「心裡貧窮」，與真實的貧窮無關。前者讓富裕的信徒覺得被排斥，也可能美化貧窮；後者讓教會對真實的缺乏不再著急。這一題要把經文的交換說清楚。","pos":[["【一】經文問的是甚麼","","<p>「我親愛的弟兄們，請聽，神豈不是揀選了世上的貧窮人，叫他們在信上富足，並承受他所應許給那些愛他之人的國嗎？」（2:5）原文 τοὺς πτωχοὺς τῷ κόσμῳ（tous ptōchous tō kosmō），「在世界眼中貧窮的」；πλουσίους ἐν πίστει（plousious en pistei），「在信上富足的」。一節之內窮富交換。問題是：神是不是對窮人有一種偏愛？有錢人在神面前是不是吃虧？</p>"],["優先關懷說：神特別站在貧窮受壓的人一邊","","<p>從舊約的律法、先知到主耶穌「你們貧窮的人有福了！因為神的國是你們的」（路 6:20），聖經一再顯出神特別看顧孤兒寡婦、寄居的與貧窮人。許多神學家（包括天主教社會訓導的「優先選擇窮人」與部分福音派的社會關懷傳統）認為，教會也應該優先站在貧窮受壓的人一邊。</p><p><strong>難處：</strong>若把「優先關懷」講成「窮人自動屬神」或「富人難以得救是定律」，就超過了經文；2:5 也說得清楚，承受國的是「那些愛他之人」，揀選是恩典，不是社會階層的獎賞。</p>"],["屬靈貧窮說：指的是心裡謙卑的人","","<p>另一些讀者把 2:5 與太 5:3「虛心的人有福了」連在一起，認為「貧窮人」主要是屬靈的描述：知道自己一無所有、仰望神的人，不論貧富。</p><p><strong>難處：</strong>2:2--6 的貧窮人是穿著骯髒衣服、被富足人拉上公堂的真實窮人；把 2:5 完全屬靈化，等於繞開了雅各要教會面對的那一張腳凳。雅各說的是「世上的」貧窮人，不是只在心裡的貧窮。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為：2:5 說的是一個交換，不是一個偏愛的名單。</strong>世界照財富排人，神不照這張價目表；神常常揀選世人看不起的人，叫他們在信上富足（這使我們想起林前 1:26--28），所以教會若羞辱窮人，就是站到了神的對面（2:6）。這不是說貧窮本身是美德，也不是說富人不能得救；主耶穌「本來富足，卻為你們成了貧窮」（林後 8:9），每一個得救的人都是在祂裡面被變成富足的。本講義的全卷立場見 ISS00_3：不是仇視富人，也不美化貧窮。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你在世上是貧是富，進神的國都是同一條路：白白的恩典。</p><p>如果你在世上貧窮、被人看輕，2:5 是寫給你的：你是承受國的人。如果你在世上富足，2:5 也是寫給你的：神給你的，是要你拿來接待被排在後面的人。</p>"]],"con":[],"say":"本講義的立場：神揀選世上的貧窮人在信上富足，是世界價值的翻轉，不是窮人自動得救，也不是富人被排斥；教會若羞辱窮人，就站到了神的對面。本講義的全卷立場見 ISS00_3。","care":"會眾裡有正在經濟困境中、覺得自己在教會抬不起頭的家庭，也有生活寬裕、卻因為講台常常暗諷有錢人而覺得被排擠的弟兄姊妹。不要用 2:5 叫窮人「安於貧窮」，也不要用它讓富裕的會友覺得自己是二等信徒。陪兩邊都看見：在神面前，我們都是被恩典變富足的人。"},{"id":"ISS02_4","t":"2:10「只在一條上跌倒，他就是犯了眾條」——那所有的罪都一樣大嗎？","r":"2:10--11；太 5:19；約 19:11","ch":[2],"why":"這一節常被引用為「所有的罪都一樣」，於是有人說「說一句謊和殺人沒有分別」，也有人因此把小錯看得和大罪一樣，良心被壓垮。反過來也有人用它淡化重罪：「反正大家都是罪人」。這一題關係到教會怎樣處理罪、怎樣牧養敏感的良心。","pos":[["【一】經文問的是甚麼","","<p>「因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條」（2:10）。理由在 2:11：說「不可姦淫」的，也說「不可殺人」——頒布律法的是同一位。放回上下文，雅各是在回應會堂門口的人：你守了大部分，只是「安排座位」而已。問題是：雅各是在講罪的輕重，還是在講別的事？</p>"],["罪等同說：在神面前一切罪都一樣","","<p>有些講法把 2:10 讀成：既然犯一條就是犯了眾條，那麼所有的罪在神面前份量相同，沒有大罪小罪之分；這說法常用來對付自以為義的人，提醒人不能拿自己守住的部分去比別人。</p><p><strong>難處：</strong>聖經自己分罪的輕重：主耶穌說「把我交給你的那人罪更重了」（約 19:11），也說有「這誡命中最小的一條」（太 5:19）；舊約律法對不同的罪有不同的處置。把一切罪講成一樣，會讓教會無法分辨需要保護受害者的重罪，也會壓垮敏感的良心。</p>"],["律法整全說：雅各講的是律法是一整件","","<p>多數解經家認為，雅各不是在比較罪的大小，而是在講律法的整全：律法不是一疊可以挑著寫的考卷，是一位神的心意。得罪任何一條，就是站在違法者的位子上，不能用守了九條去抵銷第十條。雅各的目的是拆掉「我只是偏心一點」的自我安慰，讓每一個人都看見自己需要憐憫。</p><p><strong>難處：</strong>這讀法清楚，但講台上若只講「整全」，不講下文 2:13 的憐憫，會眾很容易只聽到「你全完了」，而聽不見出路。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採律法整全說：2:10 講的是任何人都不能靠守住部分律法稱自己為義，不是取消罪的輕重。</strong>罪在後果、對人的傷害、需要的處理上確有輕重；但在「我能不能靠自己站在神面前」這件事上，每個人都在同一個位置——需要憐憫。所以 2:10 之後，雅各立刻說「憐憫原是向審判誇勝」（2:13）。本講義的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一節不是要把你壓在罪疚底下，是要把你從「我還算不錯」的高處帶下來，帶到憐憫的面前。</p><p>如果你為一個小錯自責不已，請記得：雅各說這話，是為了讓每個人都跑向憐憫，不是為了讓你永遠困在自責裡。</p>"]],"con":[],"say":"本講義的立場：2:10 講的是律法的整全——沒有人能靠守住部分律法稱義，所以每個人都需要憐憫；它不是取消罪的輕重。本講義的全卷立場見 ISS00_2。","care":"會眾席上有良心特別敏感、為一點小錯就失眠的人；也有受過嚴重傷害的人，聽到「所有的罪都一樣」會覺得加害者的罪被輕描淡寫。不要對受害者說「你也是罪人，跟他沒有分別」；也不要用 2:10 嚇唬敏感的人。帶他們讀到 2:13，讓憐憫說最後一句話。"},{"id":"ISS02_5","t":"2:12--13「憐憫原是向審判誇勝」——基督徒還要受審判嗎？","r":"2:12--13；羅 8:1；林後 5:10；太 5:7；太 18:33","ch":[2],"why":"雅各對信徒說「你們既然要按使人自由的律法受審判」（2:12），又說「那不憐憫人的，也要受無憐憫的審判」（2:13）。這讓許多信徒困惑：不是說「在基督耶穌裡的就不定罪了」嗎？基督徒還要站在審判台前？我的得救會不會因為不夠憐憫人而失落？","pos":[["【一】經文問的是甚麼","","<p>「你們既然要按使人自由的律法受審判，就該照這律法說話行事。因為那不憐憫人的，也要受無憐憫的審判；憐憫原是向審判誇勝」（2:12--13）。μέλλοντες κρίνεσθαι（mellontes krinesthai），「將要被審判的人」，雅各對信徒說話。問題是：這審判是決定得救與否的審判，還是另一種審判？「憐憫向審判誇勝」又是甚麼意思？</p>"],["賞罰審判說：信徒的審判是按工作得賞，不是定罪","","<p>許多福音派解經家區分兩件事：信徒在基督裡已經「不定罪了」（羅 8:1），但仍要「在基督臺前顯露出來」（林後 5:10），按所行的受賞賜或虧損。照這讀法，2:12--13 的審判是檢視信徒生命的審判，不是決定永生的審判。</p><p><strong>難處：</strong>2:13 說「無憐憫的審判」，語氣很重，不像只是賞賜多少的問題；而且 2:14 緊接著問「這信心能救他嗎？」，可見雅各關心的確實是得救。</p>"],["證據審判說：審判看的是活的信心有沒有結果子","","<p>另一些解經家（多在改革宗傳統）認為，最後的審判確實按行為，但行為是信心的證據，不是功勞。一個從來不憐憫人、把弟兄推到腳凳下的人，顯出他從未真正領受過憐憫（這使我們想起太 18:33 那個不饒恕同伴的僕人）；一個常常憐憫人的人，他的憐憫證明他活在神的憐憫裡。</p><p><strong>難處：</strong>這讀法若講得不小心，會讓敏感的信徒天天檢查自己「憐憫得夠不夠」，反而失去平安。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採證據審判說，並吸收賞賜審判的提醒：</strong>信徒在基督裡不被定罪，但審判是真的；審判時，活的信心會被看見，死的信心也會被看見。「憐憫原是向審判誇勝」——審判最後的話不是審判，是憐憫；這憐憫先從神來，再從我們手上流出去。救恩會不會失落的問題回指希伯來書立場二；信心與行為的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>會影響，但應該是往好的方向：讓你更不敢冷眼看人，也更確知自己是被憐憫的人。</p><p>如果你讀到這兩節就害怕，請記得主耶穌說「憐恤人的人有福了！因為他們必蒙憐恤」（太 5:7）。這不是一張考卷，是一個邀請：走進憐憫，也讓憐憫從你身上流出去。</p>"]],"con":[],"say":"本講義的立場：信徒在基督裡不被定罪，但審判是真的，活的信心會被看見；憐憫向審判誇勝，因為憐憫先從神來，再從我們手上流出去。本講義的全卷立場見 ISS00_2。","care":"會眾裡可能有剛經歷過嚴厲的教會紀律、或從小在「神隨時要審判你」的恐嚇裡長大的人，聽到「審判」兩個字就退縮。不要用 2:13 恐嚇人；先講憐憫的源頭是神，再講憐憫的流出。也不要對一個正在學習饒恕傷害者的人說「你不饒恕就要受審判」——饒恕需要時間與陪伴。"},{"id":"ISS02_6","t":"2:14「這信心能救他嗎？」——雅各說行為能救人？","r":"2:14--17；弗 2:8--10；約壹 3:18","ch":[2],"why":"這是許多信徒讀雅各書最害怕的一節：「這信心能救他嗎？」好像雅各在說單有信心還不行，還要加上行為才能得救。為自己行為不夠好而焦慮的人，讀到這裡會懷疑自己的得救；另一些人則乾脆繞開雅各書。這一題要把雅各的問題放回他自己的題目。","pos":[["【一】經文問的是甚麼","","<p>「我的弟兄們，若有人說自己有信心，卻沒有行為，有甚麼益處呢？這信心能救他嗎？」（2:14）關鍵在 λέγῃ（legē），「說」；以及冠詞 ἡ πίστις（hē pistis），「這」信心，指回前面那種「說有」的信心。μή 開頭的問句期待否定的答案。2:15--16 的例子是對飢寒弟兄只說祝福、不給吃穿。問題是：雅各是在說行為能救人，還是在說某一種信心不能救人？</p>"],["信心加行為說：得救需要信心與行為一同完成","","<p>天特會議（天主教，1547 年）在稱義的教令中引用雅各書，強調稱義的恩典在信徒生命中增長，信心要藉著愛與善行活出來；天主教並不教導人可以不靠恩典、單憑自己的行為賺得救恩，但認為信心、望德、愛德與善行在稱義的過程中一同作工。</p><p><strong>難處：</strong>改教傳統認為，這樣的講法容易讓信徒把得救的確據放在自己的表現上；而且保羅明說「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇」（弗 2:8--9）。</p>"],["真假信心說：雅各問的是說出來的信心","","<p>改教傳統與多數福音派認為，雅各不是在問「信心加行為才能得救嗎」，而是在問「一個只說不做的信心是真信心嗎」。答案是：那種信心不能救人，因為它根本不是活的信心。叫人得救的是信心，但叫人得救的信心從來不是孤單的；保羅自己也說，我們得救之後，「原是他的工作，在基督耶穌裡造成的，為要叫我們行善」（弗 2:10）。</p><p><strong>難處：</strong>「真信心必有行為」若講得太死，會讓人天天懷疑：我的行為夠多嗎？夠證明我的信心是真的嗎？這恰恰是雅各沒有要做的事。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在改教傳統：得救本乎恩、也因著信，不是出於行為；但叫人得救的信心從來不是孤單的。</strong>雅各問的是「若有人說」的那種信心——嘴上有、手上沒有，看見飢寒的弟兄只說「平平安安地去吧」。雅各自己相信恩典：神「用真道生了我們」（1:18），「他賜更多的恩典」（4:6）。保羅說「白白的」，雅各說「活的」。本講義的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你是一位為自己做得不夠而焦慮的人：雅各的刀不是對準你。會為這件事焦慮的人，正是信心活著的人；你的新生命是神生的，不是你做出來的。</p><p>如果你是一位信得很安穩、卻很久沒有為任何人伸手的人：這一節正是寫給你的。不是要你去賺得救恩，是要你問一問：我口中的「我信」，有沒有一雙手？</p>"]],"con":[],"say":"本講義的立場：雅各問的是「若有人說」的那種只有口、沒有手的信心；得救本乎恩也因著信，不是出於行為，但叫人得救的信心從來不是孤單的。保羅說「白白的」，雅各說「活的」。本講義的全卷立場見 ISS00_2。","care":"會眾席上最容易受傷的，是為自己行為不夠好而焦慮、反覆懷疑得救的人，尤其是憂鬱、強迫思考或剛跌倒過的信徒；不要對他們說「你行為這樣，大概沒有得救」，先帶他們讀 1:18 與 4:6。另一面，也不要讓冷眼看飢寒弟兄的人聽完覺得安心。從天主教或信義宗背景來的朋友也在場，各家立場只陳列，不嘲諷。"},{"id":"ISS02_7","t":"2:19「鬼魔也信」——信條正確不等於得救？","r":"2:18--19；申 6:4；可 1:24；太 7:21","ch":[2],"why":"「鬼魔也信，卻是戰驚」讓很多人困惑：如果鬼魔也信神，那「信」到底是甚麼？有人因此貶低教義，說信條不重要、做就好；也有人因此懷疑自己：我的信是不是也只是頭腦的同意？這一題要分辨兩種「信」，同時保護教義的價值。","pos":[["【一】經文問的是甚麼","","<p>「你信神只有一位，你信的不錯；鬼魔也信，卻是戰驚」（2:19）。「神只有一位」是以色列每天背誦的示瑪（申 6:4），是最正統的信條。雅各說「你信的不錯」，原文 καλῶς ποιεῖς（kalōs poieis），「你做得好」；接著說鬼魔也同意，而且 φρίσσουσιν（phrissousin），寒毛直豎。問題是：雅各是在貶低信條，還是在分辨兩種「信」？2:18 對話者的話又到哪裡結束？</p>"],["認知與信靠說：信有知識、同意、信靠三個層次","","<p>改教傳統常把信心分成知識（notitia）、同意（assensus）、信靠（fiducia）三個層次。鬼魔有知識、也同意，但沒有信靠——牠們知道神是誰，卻不把自己交給祂，也不愛祂。雅各在說：只停在前兩層的「信」，不是叫人得救的信。</p><p><strong>難處：</strong>這個分類很有幫助，卻是後來神學的語言，不是雅各自己的用詞；講得太技術化，會讓會眾以為得救要先通過一套心理測驗。</p>"],["諷刺修辭說：雅各在用反諷刺醒自滿的人","","<p>另一些解經家強調 2:19 的語氣：「你信的不錯」帶著諷刺，與 2:8「才是好的」遙遙相對。雅各不是在作信心的分析，是在刺醒一個以正統自豪、卻對飢寒弟兄無動於衷的人：你引以為傲的那一點，連鬼魔都做得到。</p><p><strong>難處：</strong>若只看成修辭，可能忽略雅各確實在區分兩種信；而且反諷若在講台上用得過頭，會變成嘲笑重視教義的人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為：雅各不是貶低信條，而是說信條停在頭腦裡不夠。</strong>「你信的不錯」——教義要緊；正因為要緊，才不能只是同意一個句子。有一種信，是同意神只有一位；有一種信，是把自己交給這一位神，並且因此改變你怎樣對待門口那個人。鬼魔的信讓牠們發抖，從來沒有讓牠們去愛。本講義的全卷立場見 ISS00_2；爭議與信心見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你擔心自己的信「只是頭腦的」，請記得：鬼魔不會為這件事擔心，也不會因此禱告。會問這個問題、想要更信靠主的人，信心正在活著。</p><p>對你今天最要緊的，是讓你相信的那一句「神只有一位」，在這一週改變你對一個人的態度。</p>"]],"con":[],"say":"本講義的立場：雅各說「你信的不錯」，教義要緊；但信條停在頭腦裡不夠，叫人得救的信是把自己交給神，並且改變我們怎樣待人。本講義的全卷立場見 ISS00_2。","care":"會眾裡可能有思考型、常懷疑自己「是不是只是頭腦上信」的人，也有曾經被說「你的信是鬼魔的信」而受傷的人。不要用 2:19 去判斷別人的信是真是假；也不要嘲笑重視教義、認真讀書的弟兄姊妹。陪懷疑的人看見：想要更信靠，本身就是恩典的記號。"},{"id":"ISS02_8","t":"2:21--24 亞伯拉罕「因行為稱義」——雅各與保羅矛盾嗎？","r":"2:20--24；羅 3:28；羅 4:2--3；加 2:16；創 15:6；創 22:1--14","ch":[2],"why":"雅各說「人稱義是因著行為，不是單因著信」（2:24），保羅說「人稱義是因著信，不在乎遵行律法」（羅 3:28）；兩人還引同一節創 15:6、同一位亞伯拉罕。這是全卷最重要的神學問題，也是歷代教會爭論最多的一處。路德早年因此對雅各書有很重的評語；今天仍有信徒以為兩位使徒在打架。這一題要把各家讀法照實陳列。","pos":[["【一】經文問的是甚麼","","<p>「我們的祖宗亞伯拉罕把他兒子以撒獻在壇上，豈不是因行為稱義嗎？」（2:21）「可見，信心是與他的行為並行，而且信心因著行為才得成全」（2:22）。「這就應驗經上所說：『亞伯拉罕信神，這就算為他的義。』」（2:23）「這樣看來，人稱義是因著行為，不是單因著信」（2:24）。保羅卻說：「倘若亞伯拉罕是因行為稱義，就有可誇的；只是在神面前並無可誇」（羅 4:2）。2:20「死的」和合本照 RP 抄本，SBLGNT 作 ἀργή（argē），「不做工的」。問題是：兩位使徒在說同一件事的相反嗎？</p>"],["矛盾說：兩人的教導無法調和","","<p>路德在 1522 年德文新約的序言裡，把雅各書與約翰福音、羅馬書、加拉太書等相比，稱它是「稻草書信」，認為它沒有清楚傳揚基督與因信稱義。一些現代學者也認為雅各在回應（甚至反對）被誤解的保羅教導，兩人的立場難以完全調和。</p><p><strong>難處：</strong>路德的評語是比較性的，他仍把雅各書留在聖經裡，後來也講道引用它；而且雅各的「行為」是給飢寒的人吃穿、喇合接待使者這種愛的行為，與保羅反對的割禮、守節等律法行為不是同一件事。說兩人矛盾，往往是沒有先聽清楚各自的題目。</p>"],["問題不同說：保羅對付靠行為，雅各對付沒有行為","","<p>加爾文與改革宗、多數福音派認為：保羅對付的病，是人想靠守律法賺得救恩；雅各對付的病，是人說他信了，卻不必活出來。兩人用「稱義」一詞的重點不同：保羅講的是神在法庭上宣告罪人為義（創 15:6 那一夜）；雅各講的是這份義在人面前被顯明出來（創 22 三十多年後）。所以 2:23 說創 22 的行為使創 15:6「應驗」——行為顯明了早已被算為義的信心。</p><p><strong>難處：</strong>「顯明為義」的讀法很有說服力，但 2:24 說的是「人稱義是因著行為」，字面上很直接；有人認為把它全部讀成「顯明」，略為減弱了雅各的力道。</p>"],["過程稱義說：稱義包括信心與愛的行為一同成全","","<p>天特會議（天主教）認為，稱義不只是一次宣告，也是內在的更新；最初的稱義出於恩典，不是行為賺來的，但稱義的恩典會藉著信徒與恩典合作的善行增長。雅各 2:24 常被引為這種「稱義的增長」的經文根據。東正教也有相近的看重，強調信心與生命的轉化是一體的。</p><p><strong>難處：</strong>改教傳統認為，若把稱義的根據部分放在信徒的善行上，得救的確據就會隨著人的表現起伏；保羅說「惟有不做工的，只信稱罪人為義的神，他的信就算為義」（羅 4:5），似乎不容許這樣的混合。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在改教傳統，採「問題不同」的讀法：得救本乎恩、也因著信（弗 2:8--9）；但叫人得救的信心從來不是孤單的。</strong>保羅說的是人怎樣被神接納：白白的，不靠行為；雅各說的是被接納的人怎樣活：信心「與他的行為並行」，συνήργει（synērgei），一同做工。亞伯拉罕在創 15:6 那一夜被算為義，三十多年後在摩利亞山上，那份信心被看見了。<strong>保羅說「白白的」，雅各說「活的」——救恩是白白得來的，但白白得來的生命，是活的。</strong>路德與天主教的立場都照實陳列，本講義不嘲諷任何一方。全卷立場見 ISS00_2；正典地位與路德的評語見 ISS00_8；因信稱義與律法回指加拉太書立場二。</p>"],["【四】這件事該不該影響你的信心","","<p>不該動搖你對聖經的信任。兩位使徒在耶路撒冷彼此「用右手行相交之禮」（加 2:9），他們是同工，不是對手。</p><p>對你今天最要緊的，是兩邊都聽：如果你想靠自己做夠了才被神接納，請聽保羅說「白白的」；如果你以為信了就可以不理會飢寒的弟兄，請聽雅各說「活的」。</p>"]],"con":[],"say":"本講義的立場：雅各與保羅不矛盾——保羅對付靠行為賺救恩，雅各對付沒有行為的信心；得救本乎恩也因著信，但叫人得救的信心從來不是孤單的。保羅說「白白的」，雅各說「活的」。本講義的全卷立場見 ISS00_2，路德的評語見 ISS00_8。","care":"會眾裡有信義宗、改革宗、天主教、東正教背景的人，任何一方被嘲諷都會受傷，也會讓人覺得教會只會吵架。也有剛信主、第一次發現「聖經好像自相矛盾」而動搖的人，牧者要說：這是歷代聖徒都認真問過的問題，問它不是不信。最要保護的，是為自己行為不夠好而焦慮的人——講完這一題，他應該更確知恩典，不是更怕。"},{"id":"ISS02_9","t":"2:25 妓女喇合「因行為稱義」——說謊騙人也算行為嗎？","r":"2:25--26；書 2:1--21；書 6:25；來 11:31；太 1:5","ch":[2],"why":"喇合「接待使者，又放他們從別的路上出去」（2:25），在約書亞記裡她還對耶利哥王的人說了謊（書 2:4--5）。於是有人問：雅各稱讚她的行為，是不是說為了好目的可以說謊？也有人聽到「妓女喇合」就不自在，不知道為甚麼聖經一直保留她的頭銜。這一題關係到倫理，也關係到有過去的人在教會裡的位置。","pos":[["【一】經文問的是甚麼","","<p>「妓女喇合接待使者，又放他們從別的路上出去，不也是一樣因行為稱義嗎？」（2:25）雅各列出的行為是兩個分詞：ὑποδεξαμένη（hypodexamenē）接待，ἐκβαλοῦσα（ekbalousa）送出去。希伯來書說「妓女喇合因著信，曾和和平平地接待探子」（來 11:31）。同一件事，一個說「因著信」，一個說「因行為」。問題是：雅各稱讚的是哪一部分？她的謊言也在內嗎？</p>"],["謊言被容許說：為了保護無辜的人，謊言是正當的","","<p>有些倫理學家與解經家認為，喇合面對的是要殺害使者的王權，她的謊言是為了保護生命；就像出埃及記的收生婆欺騙法老、二戰時藏匿猶太人的信徒對納粹說謊，這樣的欺騙在更高的責任下是正當的，雅各也連同她的行動一起稱讚。</p><p><strong>難處：</strong>雅各與希伯來書都沒有提到她的謊言，只提接待與送走；從經文的沉默推出「說謊是被稱讚的」，超過了經文所說的，也可能被人拿去替日常的欺騙找屬靈理由。</p>"],["只稱讚信心不稱讚謊言說：神看重她的信，不是她的方法","","<p>另一些解經家（包括奧古斯丁與加爾文）認為，神稱讚的是喇合冒生命危險站到神百姓一邊的信心，不是她說謊的方法；她的信是真的，她的方法仍帶著舊生活的痕跡。神接納一個不完美的人，正顯出恩典。</p><p><strong>難處：</strong>這讀法謹慎，但面對真實的生死處境（例如藏匿被追殺的人），只說「說謊總是錯的」，可能讓人覺得聖經對極端處境沒有回答。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為：雅各稱讚的是喇合接待使者、冒險送他們走的那份信——「信心沒有行為也是死的」（2:26）；他不是在這裡立一條說謊的倫理。</strong>極端處境中保護生命的倫理難題，歷代基督徒有不同的判斷，本講義並陳、不在本章定案；但這一節不能被拿來替日常的欺騙開門。更值得注意的，是雅各把一位外邦妓女和「我們的祖宗亞伯拉罕」並列：一個在信心族譜的最頂端，一個在最邊緣，兩人的信心都長出了手。這使我們想起太 1:5，她也在主耶穌的家譜裡。本講義的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：喇合是因為信才接待使者，神接納了她，也把她放進救恩的歷史裡。</p><p>如果你有一段不願被人提起的過去，請看雅各怎樣寫她：他沒有刪掉「妓女」兩個字，也沒有讓這兩個字成為她的最後一個名字。她最後被記得的，是一扇為神的百姓打開的門。</p>"]],"con":[],"say":"本講義的立場：雅各稱讚的是喇合接待使者、冒險保護他們的那份活的信，不是在立一條說謊的倫理；他把她和亞伯拉罕並列，顯出神接納有過去的人。本講義的全卷立場見 ISS00_2。","care":"會眾席上有曾經從事性產業、有不堪過去、或至今仍被人用過去定義的人，聽到「妓女喇合」可能全身緊繃。不要在講台上拿她的職業開玩笑，也不要用輕佻的語氣講；要讓這些人聽見，神的家譜裡有她的名字。也不要用這一節鼓勵人說謊，或指責曾在危險中為保護家人而說謊的人。"},{"id":"ISS03_1","t":"3:1「不要多人作師傅」——誰可以教？主日學老師、小組長、網路上的屬靈導師呢？","r":"3:1；西 3:16；太 23:8","ch":[3],"why":"這一節常被兩種方式用錯：一種拿它叫提問的人、年輕同工、姊妹閉嘴，說「你還不夠格」；另一種完全不理它，網路上人人開直播當屬靈導師，說錯了也不覺得要交帳。華人教會大量倚靠平信徒帶小組、教主日學，這一題直接關係到誰敢開口、開口的人怎樣看待自己的話。","pos":[["【一】經文問的是甚麼","","<p>「我的弟兄們，不要多人作師傅，因為曉得我們要受更重的判斷。」（3:1）原文「多人」πολλοὶ 放在句首，命令是現在式：不要一窩蜂地擠上去。雅各沒有說「不要作師傅」，他自己就在教；他說「我們」要受更重的判斷，先把自己算進去。處境是散住各地、沒有固定牧者的會堂式聚會，誰願意站起來講就可以講。問題是：今天這一節管的是誰、管到哪裡？</p>"],["職分限定說：只有按立或受過訓練的人才可以教","","<p>有些傳統把 3:1 讀成對教導職分的限制：「師傅」是教會裡正式的教師，未經按立、未受神學訓練的人不應公開教導。優點是嚴肅看待教導的重量，也保護會眾不受錯誤教導。</p><p><strong>難處：</strong>雅各的處境本來就沒有按立制度，他擋的是「多人」搶著教，不是沒有學歷的人開口；新約一樣說要「彼此教導，互相勸戒」（西 3:16）。把 3:1 變成門檻，會壓下聖靈給肢體的恩賜，也讓有學歷的人以為自己不必受更重的判斷。</p>"],["人人皆可說：恩賜由聖靈分配，3:1 只是勸人謙卑","","<p>另一端強調信徒皆祭司：聖靈把教導的恩賜隨己意分給人，誰有領受都可以分享，3:1 只是一般性地提醒人不要驕傲。優點是保住了肢體的恩賜，鼓勵平信徒參與。</p><p><strong>難處：</strong>這樣讀把「更重的判斷」讀輕了。雅各說的是一個真實的重量：你說出的話，別人會拿去活。網路時代一段影片可以被幾萬人轉傳，說錯了沒有人能收回；若人人都可以說、卻沒有人覺得要交帳，正是 3:1 要擋的「多人」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:1 是對教導者的警告，不是壓制肢體的恩賜。</strong>主日學老師、小組長、在群組裡分享經文的人，都不必因這一節閉嘴；他們要把這個重量放在心上——說之前先問「這是經文說的，還是我想說的」，說錯了願意更正。網路上的屬靈導師尤其要記得：觀看的人越多，舵越大。321 的 235 裡作屬靈父母的「3」，先管好自己的舌頭。</p><p>主耶穌說：「只有一位是你們的夫子；你們都是弟兄。」（太 23:8）所有教導的人，都只是坐在同一位夫子腳前的弟兄。勸戒與論斷、誰可以指出問題，全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：教導是恩賜，也是重量；神要人開口，也要人為開口負責。</p><p>如果你曾經因為一句「你不夠格」而不敢再分享，請你知道，雅各擋的不是你。如果你正在帶人，這一節不是要嚇你，是要你帶著敬畏開口——你不是一個人站在審判台前，雅各說的是「我們」。</p>"]],"con":[],"say":"本講義的立場：3:1 擋的是「多人」搶著教，不是叫肢體閉嘴；凡開口教導的人——講台、主日學、小組、直播——都要帶著「更重的判斷」的敬畏說話。本講義的全卷立場見 ISS00_5、ISS00_1。","care":"會眾席上可能有一位姊妹，多年前在查經時提了一個問題，被長輩一句「不要多人作師傅」打回去，從此不再開口；也可能有一位剛開始帶小組的年輕人，聽完這節怕得想辭職。對前者，牧者要親口說：你的問題不是點火，我們想聽；對後者，陪他一起預備、一起禱告。不要在講台上用這節點名任何「說太多」的人。"},{"id":"ISS03_2","t":"3:2「在話語上沒有過失，他就是完全人」——真的有人做得到嗎？","r":"3:2；1:4；腓 3:12","ch":[3],"why":"認真的基督徒讀到這一節，常常有兩種反應：一種是絕望——「我天天說錯話，我永遠不是完全人」；另一種是麻木——「反正沒人做得到，那就算了」。也有人把它讀成可以達到的無罪完全。怎樣讀「完全人」，決定這一節是叫人長大，還是叫人放棄。","pos":[["【一】經文問的是甚麼","","<p>「原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。」（3:2）前半句「許多」在句首、「全都」在句尾：沒有人例外，雅各也在裡面。後半句是條件句「若有人」。「完全」τέλειος 回響 1:4「使你們成全、完備」。問題是：這是一個可以達到的狀態、一個不可能的理想，還是一個方向？</p>"],["可達成說：靠聖靈可以活到話語無過","","<p>聖潔運動的一些傳統認為，信徒在聖靈裡可以經歷「完全的愛」，達到不再故意犯罪的光景，3:2 描寫的是可以追求、也可以得著的成熟。優點是不把罪當成理所當然，叫人有盼望。</p><p><strong>難處：</strong>雅各剛說完「我們在許多事上都有過失」，用的是現在式；約翰也說「我們若說自己無罪，便是自欺」（約壹 1:8）。若宣稱已經達到，人容易對自己的失言視而不見，或對還在跌倒的人失去耐心。</p>"],["假設不可能說：雅各用一個做不到的標準把人逼向恩典","","<p>另一些人讀成修辭：雅各故意設一個沒有人達得到的標準，像律法一樣讓人看見自己需要救恩。優點是誠實面對人的軟弱，也和 3:8「沒有人能制伏」相合。</p><p><strong>難處：</strong>雅各書的語氣是勸人長大，不是只叫人絕望；1:4 說忍耐「也當成功，使你們成全」，是可以前進的。若只讀成「反正做不到」，3:2 就失去了它要人在話語上被勒住、一步一步長進的力量。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：τέλειος 是長成、整全，是方向，不是證書。</strong>雅各先承認「我們都有過失」，再指出往哪裡長：話語是最難管的一處，能管住它，表示整個人長大了。保羅也說：「這不是說我已經得著了，已經完全了；我乃是竭力追求」（腓 3:12）。</p><p>所以這一節同時給兩句話：第一句是安慰——你不是唯一跌倒的人；第二句是邀請——讓這一處開始被勒住。勒住的力量不是咬牙，是從上頭來的智慧（3:17）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：舌頭是成熟的試金石，人在這事上都需要恩典。你的得救不建立在「話語上沒有過失」上面，而是建立在那一位「口裡也沒有詭詐」的主身上（彼前 2:22）。</p><p>今天說錯了話，明天可以道歉；這不是失敗的證明，正是長大的樣子。信心與行為的全卷立場見 ISS00_2。</p>"]],"con":[],"say":"本講義的立場：3:2 的「完全人」是長成，不是無罪完美；雅各先把自己算進「都有過失」裡，再邀請我們讓舌頭這一處被勒住——這是一個方向，力量來自從上頭來的智慧。本講義的全卷立場見 ISS00_2、ISS00_9。","care":"會眾席上有完美主義、容易自責的人，聽完 3:2 可能整夜回想自己說錯的每一句話，甚至懷疑自己是否得救；也有人聽完反而說「既然做不到就算了」。對前者，牧者要先讀「我們在許多事上都有過失」，陪他把一件具體的事帶到主前、然後放下；不要說「你就是不夠屬靈」。"},{"id":"ISS03_3","t":"3:6「舌頭就是火」——有人說負面的話會招來咒詛、正面宣告會成真，是這樣嗎？","r":"3:5--6；3:16；4:15；箴 18:21","ch":[3],"why":"華人教會很常聽到：「不要說『我快死了』，說了會成真」「生病要宣告『我已經好了』」。3:6 和箴言「生死在舌頭的權下」常被拿來支持這種講法。這一題直接影響病人敢不敢說痛、受苦的人敢不敢哭，也影響人怎樣理解禱告是向一位有位格的神祈求，還是一套說了就靈的機制。","pos":[["【一】經文問的是甚麼","","<p>「看哪，最小的火能點著最大的樹林。舌頭就是火……能污穢全身，也能把生命的輪子點起來，並且是從地獄裡點著的。」（3:5--6）雅各接著說明火燒到哪裡：「在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事」（3:16）。問題是：舌頭的力量是一種讓話語自己成真的屬靈律，還是話語在人與人之間、在人心裡造成的真實破壞？</p>"],["信心宣告說（話語有創造力）","","<p>信心宣告運動把 3:2--6、箴 18:21「生死在舌頭的權下」連在一起，認為信徒的話語帶有屬靈的創造力：說負面的話會打開咒詛的門，說正面的宣告就能改變處境。優點是嚴肅看待言語的力量，也鼓勵人說造就人的話。</p><p><strong>難處：</strong>雅各從來沒有教人用宣告改變處境；他在 4:13--15 反而責備人說「明天我們要」，叫人改說「主若願意」。這種講法把禱告變成咒語，把神變成必須回應正確字句的機制；也讓病人、受苦的人不敢說真話，病沒好時還背上「是你說壞了」的罪咎。</p>"],["關係破壞說（火燒的是關係與人心）","","<p>多數解經家照上下文讀：火從一句話點起，燒進關係、燒進群體（3:16），也一路燒過一個人的一生——童年的一句羞辱可以在心裡燒幾十年。箴言「生死在舌頭的權下」說的也是話語能救人、能害人，智慧書的語境是人際與道德，不是魔法。</p><p><strong>難處：</strong>這一說若講得太輕，容易變成「只是心理影響」，忽略雅各說火「是從地獄裡點著的」——言語背後確實有屬靈的爭戰。所以要同時守住：力量是真的、源頭有屬靈的面向，但它不是一套操控現實的技術（屬靈爭戰回指以弗所書立場四）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:6 的火燒的是關係與人心，不是言語咒詛的魔法；本講義不教導「負面的話招咒詛、正面的宣告會成真」。</strong>禍福在神手裡，你不必活在「說錯一句話就會招禍」的恐懼裡。話語的力量是真的，所以要被勒住、被交在主手裡；但它的力量在人與人之間，不在字句本身。</p><p>這一題屬於全卷立場「舌頭、論斷與教會裡的言語」，本講義的全卷立場見 ISS00_5，本章不另立說法。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意話語有力量，也都同意要說造就人的話。差別在於：你相信的是一位聽禱告的父，還是一套正確的字句？</p><p>你可以在禱告裡說「主，我好痛」「我很怕」——詩篇裡滿是這樣的話。神不會因為你說了真話就懲罰你；他是「厚賜與眾人、也不斥責人的神」（1:5）。</p>"]],"con":[],"say":"本講義的立場：舌頭的火燒的是關係與人心，不是讓話語自己成真的魔法；本講義不教言語咒詛，也不教正面宣告。本講義的全卷立場見 ISS00_5。","care":"最容易受傷的是重病的人與他的家人：被要求不可說「痛」、不可說「怕」，病情惡化時還被暗示是「你說壞了」。也有長輩一生怕說錯一個字。牧者要陪病人把真實的話帶到神面前，告訴他：你的眼淚不是不信。不要說「你要宣告得勝」來代替陪伴。"},{"id":"ISS03_4","t":"3:6「生命的輪子」——雅各相信輪迴嗎？","r":"3:6；1:23；來 9:27","ch":[3],"why":"華人文化有很深的佛教與民間信仰背景，「輪迴」「業」「命盤」是許多慕道朋友熟悉的詞。讀到「生命的輪子」，有人會以為聖經也講輪迴，也有慕道者拿這一節來問。這一題關係到傳福音時怎樣回答，也關係到信徒怎樣看自己的一生。","pos":[["【一】經文問的是甚麼","","<p>「也能把生命的輪子點起來」（3:6），原文 τὸν τροχὸν τῆς γενέσεως，直譯「生成之輪」。γενέσεως 在 1:23 用過：「就像人對著鏡子看自己本來的面目」，「本來的」就是這個字，指人生來的樣子。問題是：雅各借用這個片語時，有沒有連同它在希臘宗教裡的意思一起借過來？</p>"],["輪迴借用說","","<p>這個片語在古希臘的奧菲斯教與一些哲學作品裡出現，有時指靈魂在生死之間循環的「命運之輪」。有人據此認為雅各接受了某種循環的世界觀，或至少在暗示一個人的話語會影響來生。</p><p><strong>難處：</strong>雅各全卷的世界觀是猶太的：一次的人生、一次的審判（5:9「審判的主站在門前」），與「人人都有一死，死後且有審判」（來 9:27）一致。全卷沒有任何地方暗示靈魂輪轉；借一個通俗片語，不等於借它的哲學，就像今天說「命運」的基督徒，不是在相信宿命。</p>"],["人生歷程說","","<p>多數解經家認為，這個片語到雅各的時代已經成了通俗說法，指人從出生到死亡的整個歷程，像車輪一路滾過去。雅各的意思是：舌頭的火不只燒一時，它能燒過人的一生。這和 1:23「本來的面目」的用法相合，也和上下文一致。</p><p><strong>難處：</strong>這一說需要承認片語的來源確實和宗教哲學有關，不能說它「完全中性」；也有學者認為「輪子」可能指人生起伏的循環，而不只是一條直線。但無論哪一種，都在一次的人生之內。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：「生命的輪子」是一個人從生到死的整條路，不是輪迴。</strong>雅各借的是一個大家聽得懂的說法，講的是一句話可以燒過人的一輩子——童年的一句「你怎麼這麼笨」，可以在一個人心裡燒四十年；不是一句話會帶到下輩子。</p><p>對慕道的朋友，可以這樣說：聖經講的人生只有一次，所以每一句話都珍貴；也正因為只有一次，被話燒過的人生需要一位能醫治、能更新的主，而不是等下一輪。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這是一個片語的背景問題，各家解經都同意雅各不是在教輪迴。</p><p>對你更重要的是：你人生的輪子上，有沒有一處至今還在燒？那一處，可以帶到從上頭來的那一位面前。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：3:6「生命的輪子」是一個人從生到死的整個歷程，雅各借用通俗說法，不是教輪迴；一句話能燒過人的一生，所以需要從上頭來的醫治。本講義的全卷立場見 ISS00_9。","care":"會眾裡可能有剛從佛教、民間信仰背景信主的弟兄姊妹，家人還在拜拜；也可能有慕道朋友拿這一節來試探。不要嘲笑別的宗教，也不要把對方的問題當成挑釁。陪他看見聖經裡一次的人生有多寶貴，也溫柔地回答他父母、祖先的問題，不急著下結論。"},{"id":"ISS03_5","t":"3:9「咒詛那照著神形像被造的人」——罵政治人物、網路酸言、罵孩子也算嗎？","r":"3:9--10；創 1:27；羅 12:14","ch":[3],"why":"很多基督徒不說髒話，就以為 3:9 與自己無關；可是在網路留言區、政治討論、餐桌上對孩子、塞車時對前車，刻薄的話天天出口。另一方面，有人擔心：那還能不能批評政府、指出不義？這一題要分清「咒詛人」與「批評事」，也要照出最常被忽略的對象——家裡的孩子。","pos":[["【一】經文問的是甚麼","","<p>「我們用舌頭頌讚那為主、為父的，又用舌頭咒詛那照著神形像被造的人。頌讚和咒詛從一個口裡出來！我的弟兄們，這是不應當的！」（3:9--10）雅各的理由只有一步：你頌讚的那一位，就是照著自己形像造了你咒詛的那個人（這使我們想起創 1:27）。問題是：「咒詛」的範圍有多大？只是正式的詛咒，還是包括一切貶低人的話？</p>"],["狹義說：咒詛指正式的詛咒與惡毒的咒罵","","<p>有人照古代語境讀：κατάρα 是求神降禍的正式咒詛，在一世紀是很具體的行為。所以 3:9 主要禁止的是詛咒人、咒罵人，而不是一切嚴厲的話。優點是不把正當的批評、先知式的責備都算成罪——雅各自己在 5:1--6 也說了很重的話。</p><p><strong>難處：</strong>若只限於正式詛咒，今天大多數人都可以說「我沒有」，3:9 就失去照鏡子的力量。雅各的理由是對方帶著神的形像，這個理由同樣適用於羞辱、嘲諷、貼標籤——它們一樣是在貶低那個形像。</p>"],["廣義說：一切貶低人的話都在範圍內","","<p>另一些人把一切惡言都放進來：網路酸言、政治謾罵、對孩子說「你怎麼不去死」、對配偶的冷嘲。主耶穌也說「凡罵弟兄是拉加的，難免公會的審判」（太 5:22）。優點是把鏡子照到每天的生活。</p><p><strong>難處：</strong>若一切嚴厲的話都算咒詛，人就不敢指出不義，受害者不敢說加害者做了甚麼，教會也無法對政策、制度發出先知的聲音。這會讓 3:9 被拿來消音。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分辨的關鍵是「對著人」還是「對著事」。</strong>批評一項政策、指出一件不義、說出自己受的傷，不是咒詛；把人貶成不是人——「廢物」「去死」「這種人不配活」——無論對政治人物、網路上的陌生人，還是自己的孩子，都是在對著神的形像說話。保羅說：「只要祝福，不可咒詛。」（羅 12:14）</p><p>最該先照的對象是孩子：父母的一句話，會在孩子生命的輪子上燒很久（3:6）。勸戒與論斷的界線，全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意人帶著神的形像，也都同意可以指出不義。差別只在範圍。</p><p>這一節不是要你從此不敢發表意見，是要你在按下「送出」以前，想起螢幕另一邊的那一個人，神也照著自己的形像造了他。雅各說的是「不應當」，不是「不可能」——今天就可以停下來。</p>"]],"con":[],"say":"本講義的立場：3:9 的分辨在「對著人」還是「對著事」——批評政策、指出不義、說出傷害不是咒詛；貶低一個人的價值，無論對誰，都是在咒詛神的形像。本講義的全卷立場見 ISS00_5。","care":"會眾席上有從小被父母罵「沒用」「去死」長大的人，聽到這一節可能湧上很深的痛；也有正在對孩子吼叫、事後懊悔的父母。對前者，牧者要說：那些話是錯的，你身上有神的形像；對後者，陪他學習向孩子道歉。不要用這一節叫說出被罵經歷的人「也要祝福」，而跳過他的傷。"},{"id":"ISS03_6","t":"3:10--12「刀子嘴，豆腐心」——是藉口嗎？","r":"3:10--12；太 7:16--17；路 6:45","ch":[3],"why":"「刀子嘴，豆腐心」「我就是比較直」「我是為你好才這樣說」——這些話在華人家庭與教會裡很常見，常常替很重的話發了通行證。可是也有人真的心軟、只是不會表達。這一題要問：嘴和心之間，到底是甚麼關係？","pos":[["【一】經文問的是甚麼","","<p>「泉源從一個眼裡能發出甜苦兩樣的水嗎？我的弟兄們，無花果樹能生橄欖嗎？葡萄樹能結無花果嗎？鹹水裡也不能發出甜水來。」（3:11--12）這使我們想起主耶穌的話：「荊棘上豈能摘葡萄呢？蒺藜裡豈能摘無花果呢？」（太 7:16）雅各的邏輯是：出來的是甚麼，由源頭決定。那麼，「嘴是刀子、心是豆腐」能成立嗎？</p>"],["心口分離說：說話方式只是性格與文化","","<p>有人認為說話直、語氣重是性格或家庭文化，不一定代表心裡惡毒；一個在嚴厲家庭長大的人，可能不會用溫柔的話表達愛。優點是看見了人的背景與限制，不急著論斷一個說話粗的人沒有愛心。</p><p><strong>難處：</strong>雅各和主耶穌都說，口裡出來的會顯出心裡存的（路 6:45「心裡所充滿的，口裡就說出來」）。若把說話方式完全歸給性格，人就永遠不必改；被刀子割傷的人也只能被要求「體諒他的豆腐心」。</p>"],["心口一致說：嘴就是心的出口","","<p>另一端照字面讀：嘴若常是刀子，心就不是豆腐；所謂豆腐心只是自我安慰。優點是不讓人躲在俗語後面，把問題帶回源頭。</p><p><strong>難處：</strong>這樣讀若拿來論斷別人，就變成「他嘴巴壞，所以心一定壞、甚至沒有重生」——那是坐上審判官的位子（4:12）。而且人的心本身就是分成兩半的（1:8 心懷二意），同一個人裡面確實有甜也有苦，雅各才說「這是不應當的」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：「刀子嘴，豆腐心」不能當通行證。</strong>雅各說泉源只有一個眼，嘴裡出來的，總會讓人看見井底存的是甚麼；如果心真的是豆腐，刀子會慢慢變鈍。所以不是去修嘴，是回頭看井——向神求從上頭來的智慧（3:17）。</p><p>但這是一面照自己的鏡子，不是拿來斷定別人的棍子。看見自己的苦水，是悔改的開始；看見別人的苦水，是為他禱告、在適當時溫柔勸戒的開始（全卷立場見 ISS00_5）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若發現自己的嘴常是刀子，這不是你沒救的證明，而是那口井需要被醫治的訊號。</p><p>雅各曾經和家人以為哥哥癲狂了，後來一輩子活在哥哥的話裡——一個弟弟的舌頭被改變了。神「用真道生了我們」（1:18），泉源是可以被換新的。</p>"]],"con":[],"say":"本講義的立場：「刀子嘴，豆腐心」不能替重話開脫——泉源只有一個眼，要換的不是嘴，是井；但這面鏡子先照自己，不拿來斷定別人的心。本講義的全卷立場見 ISS00_5。","care":"會眾裡有長年被配偶、父母、長輩用「刀子嘴豆腐心」合理化言語傷害的人，他們常被要求「多體諒」。牧者要清楚說：你受的傷是真的，不必替割你的人辯護；同時也陪那些說話重的人，看見背後的成長經歷，一步一步學道歉。不要在講台上舉某一個家庭為例。"},{"id":"ISS03_7","t":"3:14--16 苦毒的嫉妒和紛爭——教會裡的權力鬥爭與派系怎麼辦？","r":"3:13--16；腓 2:3；加 5:20","ch":[3],"why":"教會分裂很少是因為教義，多半是因為人：誰帶敬拜、誰跟牧師比較親、哪一派長執說了算。這些衝突常常包裝成「維護真理」「為了教會好」。3:14--16 把它拆穿，但也可能被拿來互貼「屬鬼魔」的標籤，讓衝突升級。這一題關係到受傷的同工、夾在中間的會友，還有教會的見證。","pos":[["【一】經文問的是甚麼","","<p>「你們心裡若懷著苦毒的嫉妒和紛爭，就不可自誇，也不可說謊話抵擋真道。這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的，屬鬼魔的。在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事。」（3:14--16）「紛爭」ἐριθεία 原指為自己拉票、結黨；保羅也把「結黨、紛爭」列在情慾的事裡（加 5:20）。問題是：教會遇到派系時，該怎樣用這段經文？</p>"],["屬靈爭戰說：派系背後是鬼魔，要奉主名對付","","<p>有人看重 3:15「屬鬼魔的」，把教會衝突首先理解為屬靈爭戰：要禁食禱告、捆綁攪擾的靈，甚至指出哪一方被仇敵利用。優點是嚴肅看待雅各說的屬靈面向，不把派系只當成人際問題。</p><p><strong>難處：</strong>雅各說的是「你們心裡」，第一個要對付的是自己的嫉妒；把對方指為「被鬼利用」，往往正是 3:14 的「自誇」與「說謊話抵擋真道」。這種講法讓衝突無法談，也傷害無辜的人（屬靈爭戰回指以弗所書立場四）。</p>"],["制度處理說：派系是治理問題，要靠規章與程序","","<p>另一些人強調實際的治理：清楚的決策程序、任期制度、財務透明、外部調解，能減少權力集中與派系。優點是看見罪會在不健全的制度裡長大，好的體系能保護人。</p><p><strong>難處：</strong>制度能限制火勢，卻換不了泉源；只有程序沒有悔改，各派會學會在程序裡繼續鬥爭。雅各的藥方是 3:17 從上頭來的智慧——「先是清潔，後是和平」，這是心的問題，不只是規章的問題。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三件事一起做。</strong>第一，每一方先照自己的心——3:14 說的是「你們心裡」，不是「他們心裡」；第二，用清楚、公開、公平的程序處理事情，必要時請外部可信任的人調解，這是 3:17「沒有偏見，沒有假冒」的體系樣子；第三，勸戒與論斷要分清：動機為了把人找回來、方法當面私下溫柔、位子站在弟兄旁邊（全卷立場見 ISS00_5）。</p><p>321 說「人比事重要，不要為了事傷害人」：一件事做贏了、一群人卻散了，就是輸了。</p>"],["【四】這件事該不該影響你的信心","","<p>教會的鬥爭會讓人心冷，很多人因此離開教會，甚至離開主。這是真實的痛。</p><p>但雅各寫這段，正表示第一代教會也有這樣的事；神沒有因此放棄他的教會。人的派系不能定義神；「惟獨從上頭來的智慧」仍然從上頭降下來。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：3:14--16 是先照自己的鏡子，不是貼在對方身上的標籤；處理派系要心與體系一起——各方先悔改，再用公平透明的程序處理，人比事重要。本講義的全卷立場見 ISS00_5。","care":"最受傷的是夾在中間的會友、被鬥爭擠出去的同工、和看著大人吵架的教會孩子。牧者要先關心已經離開的人，不追問「你是哪一邊的」；也要小心自己是否成了派系的一方。不要在講台上用這段影射任何人，也不要說「離開的人就是屬鬼魔的」。"},{"id":"ISS03_8","t":"3:15「屬情慾的」智慧——頭腦、理性、學術在信仰裡有沒有地位？","r":"3:15；1:5；太 22:37","ch":[3],"why":"華人教會有一種常見的張力：一邊重視學歷與讀書，一邊又流行「讀神學會讀死」「屬靈人不要用頭腦」。3:15 的「屬情慾的」原文 ψυχική，常被翻成「屬魂的」，被拿來否定思考與學術；321 也說「用心靠聖靈，不要用腦靠自己」。這一題要說清楚：問題在頭腦，還是在源頭？","pos":[["【一】經文問的是甚麼","","<p>「這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的，屬鬼魔的。」（3:15）中間那個字 ψυχική，和合本譯「屬情慾的」，字面是「屬魂的」，指靠人天然生命的。雅各在對比兩種智慧的「源頭」：從上頭來，或從下面來。問題是：「屬魂的」是指理性本身，還是指一種與神隔絕、只靠自己的聰明？</p>"],["反智讀法：理性屬魂，屬靈要靠直覺與感動","","<p>有些靈恩或內在生命的傳統，把人分成靈、魂、體，認為思考、分析、學術屬於「魂」，屬靈的人應當倚靠靈裡的感動，而不是頭腦。優點是提醒人：知識本身救不了人，神的事要靠啟示。</p><p><strong>難處：</strong>雅各自己叫缺少智慧的人「應當求」（1:5），主耶穌說要「盡心、盡性、盡意」愛神（太 22:37），庇哩亞人「天天考查聖經」被稱讚。把理性等同屬魂，會使人無法分辨錯誤教導，也讓學生與知識分子以為信主就要放棄頭腦。</p>"],["源頭讀法：問題不在頭腦，在頭腦為誰工作","","<p>多數解經家照上下文讀：3:15 的三個形容詞是在說這種智慧的出處——屬地（地平線以下）、屬魂（只靠天然生命）、屬鬼魔（被黑暗利用）；上一節說的是「苦毒的嫉妒和紛爭」，下一節說「擾亂和各樣的壞事」。被定罪的是一顆嫉妒、結黨的心在使用聰明，不是聰明本身。</p><p><strong>難處：</strong>這一說若講得太快，可能讓人以為「只要動機對，怎樣用頭腦都可以」，忽略了學術本身也可能成為驕傲的偶像（林前 8:1 知識叫人自高自大）。所以要同時守住：頭腦是神給的，但頭腦不能作王。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:15 的界線在源頭，不在頭腦；本講義不貶低理性與學術。</strong>321 說「用心靠聖靈，不要用腦靠自己」，重點是「靠自己」：同一個頭腦，交給聖靈就成了從上頭來的智慧的器皿，留給自己作王就成了屬魂的聰明。讀神學、讀研究、仔細查考經文，都是愛神的方式；只是每一次思考，都要回到「敬畏耶和華是智慧的開端」（箴 9:10）。</p><p>可以自己檢查：我的聰明，結出來的是 3:16 的擾亂，還是 3:17 的和平？爭議與信心的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：智慧要從神來，頭腦要降服。差別只在於是否把頭腦本身看成問題。</p><p>如果你是一位愛思考、常有問題的人，請你知道：有問題不是心懷二意；在問題裡仍向神求的人，正是 1:5 說的人。神「也不斥責人」——他不嫌你問。</p>"]],"con":[],"say":"本講義的立場：3:15「屬情慾的」ψυχική 指只靠天然生命的聰明，問題在源頭不在頭腦；理性與學術是神的恩賜，只是不能自己作王——用心靠聖靈，不要用腦靠自己。本講義的全卷立場見 ISS00_9。","care":"會眾裡有讀研究所的學生、教書的老師、做研究的弟兄姊妹，他們可能曾在教會被說「太理性」「讀太多書不屬靈」，因此兩邊都不自在；也有教育程度不高、怕被看輕的長輩。牧者要讓兩種人都知道：神要的是整個人，頭腦與心都被他得著。不要用「屬魂」給提問的人貼標籤。"},{"id":"ISS03_9","t":"3:17 從上頭來的智慧與聖靈的果子是甚麼關係？","r":"3:17--18；加 5:22--23；1:17","ch":[3],"why":"3:17 的八樣和加拉太書的聖靈九果非常相像，雅各卻一次也沒有在這裡提聖靈的名字。有人說雅各的智慧就是聖靈；有人說是兩套不同的神學。這一題關係到我們怎樣讀雅各書——是一本只講道德的書，還是一本講神從上頭賜下生命的書；也關係到這八樣是要「做出來」，還是要「求來」。","pos":[["【一】經文問的是甚麼","","<p>「惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。並且使人和平的，是用和平所栽種的義果。」（3:17--18）這使我們想起：「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。」（加 5:22--23）兩處都有和平、溫柔、良善，都用「果子」的語言。問題是：兩者是同一件事的兩種說法嗎？</p>"],["等同說：雅各的「智慧」就是聖靈","","<p>有些學者指出，猶太智慧傳統裡，智慧常與神的靈並列（這使我們想起賽 11:2 智慧和聰明的靈）；雅各書全卷幾乎不提聖靈，卻在聖靈的位置上講「從上頭來的智慧」。所以雅各的智慧，功能上就是保羅的聖靈。優點是把雅各書和新約其他書卷連在一起，保護它不被讀成道德手冊。</p><p><strong>難處：</strong>雅各沒有明說，直接畫上等號會說得比經文多；智慧在聖經裡也常指神所賜的判斷力，不只是位格。4:5 的「靈」怎麼讀也有爭議。</p>"],["平行說：兩位作者描寫同一位神的工作，各有重點","","<p>另一些人認為兩者是平行而不等同：保羅從聖靈的位格講果子，雅各從智慧文學的傳統講從上頭來的智慧；兩者都在說，人裡面美善的品格不是自己做出來的，是神賜下、在人裡面長出來的。優點是尊重兩位作者各自的用語，又看見他們的一致。</p><p><strong>難處：</strong>若只說「平行」，可能讓人忽略雅各書確實有聖靈的維度，以為雅各只講人的努力；需要同時帶出 1:17--18「從上頭來」「用真道生了我們」，才不會把雅各講成靠自己行善。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:17 的智慧「使我們想起」加 5:22--23 的聖靈果子——雅各沒有提聖靈的名字，可是他描寫的智慧與保羅描寫的果子，是同一位神在人裡面工作的樣子。</strong>本講義不把兩者直接畫等號，但兩者有一件事完全相同：<strong>都不是咬緊牙關做出來的，是從上頭來、在人裡面長出來的。</strong></p><p>所以這八樣不是一張道德清單，是向那「厚賜與眾人、也不斥責人的神」（1:5）求來的；3:18 說它是「栽種」的——像農夫，種下、等候、收成。321 說「聖靈是我的引導」，在說話上最具體的樣子就是這一節。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：這八樣的源頭是神，不是人。差別只在用語。</p><p>如果你讀 3:17 覺得自己一樣也沒有，請不要絕望——這正是「從上頭來」的意思：你不必從自己裡面擠出來。今天就可以求。「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的」（1:17）。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：3:17 的智慧使我們想起聖靈的果子——不直接畫等號，但兩者都是從上頭來、在人裡面長出來的，不是咬牙做出來的；所以這八樣是要向神求的，不是一張清單。本講義的全卷立場見 ISS00_9、ISS00_2。","care":"會眾裡有認真到容易焦慮的人，聽完八樣會開始一條一條檢查自己、越查越灰心；也有人會拿這八樣去量別人「不夠溫良柔順」。牧者要把重音放在「從上頭來」：先帶人求，再談長；不要把 3:17 印成檢查表發給小組。"},{"id":"ISS04_1","t":"4:2--3「你們得不著，是因為你們不求……是因為你們妄求」——禱告沒蒙應允，都是我求錯了嗎？","r":"4:2--3；林後 12:8--9；太 7:7；路 22:42","ch":[4],"why":"這兩節最常被倒過來用：有人為病中的孩子、不孕、失業、離家的兒女禱告多年沒有改變，就被人一句「你妄求」打回去，或自己開始懷疑每一個禱告的動機。也有人反過來，把禱告當成向神提款，求不到就灰心。這一題要分清雅各在對誰說話、他診斷的是哪一種禱告。","pos":[["【一】經文問的是甚麼","","<p>「你們得不著，是因為你們不求。你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中」（4:2--3）。這兩句放在 4:1 爭戰鬥毆的後面：一群彼此爭鬥、殺害嫉妒的弟兄，想要卻得不著。κακῶς（kakōs）是「惡劣地、壞壞地」，目的子句說出問題：求來的東西要花在自己的 ἡδονή（hēdonē）快感裡。問題是：這是一條適用於所有禱告的定律，還是對一種特定的心的診斷？</p>"],["普遍定律說：禱告沒蒙應允，原因都在人","","<p>有些教導把這兩節讀成禱告的總原則：神一定垂聽，若沒有得著，不是沒求，就是求的動機、方法或信心有問題；所以要檢討自己、修正禱告，直到蒙應允。這一說的長處是認真看待人的心，也提醒人禱告不是許願。</p><p><strong>難處：</strong>聖經裡有許多求了卻沒有照所求得著的義人。保羅三次求主挪去那根刺，主回答「我的恩典夠你用的」（林後 12:9）；主耶穌在客西馬尼求「把這杯撤去」，父沒有撤去。把 4:3 當成定律，等於說保羅和主耶穌都妄求了；也會把久病、不孕的人推進成功神學的邏輯（回指希伯來書立場四）。</p>"],["處境診斷說：雅各在對一群爭戰中的人說話","","<p>多數解經家把這兩節讀成對 4:1 那群人的診斷：他們一面爭鬥，一面不向神開口（不求），開口時又把神當成供應宴樂的倉庫（妄求）。兩個病同一個根——心裡的王位上坐的是自己的快樂。雅各沒有說凡未蒙應允都是妄求；他是用哥哥的話「你們祈求，就給你們」（太 7:7）來對付一顆分成兩半的心。</p><p><strong>難處：</strong>這個讀法若只強調「這不是說你」，可能讓人錯過自省；雅各的手術刀確實也會碰到今天許多禱告清單，只是它要割的是那顆把神當工具的心，不是一個受苦的人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採處境診斷說：4:2--3 是對「爭戰中、只要神的東西不要神」的心的診斷，不是解釋一切未蒙應允禱告的定律。</strong>不求，是不信神會給；妄求，是只要神的東西，不要神。對這兩種心，雅各的藥方在 4:6--8：神賜更多的恩典，人要親近神。</p><p>神不照所求應允，可能是更好的答案（林後 12:9），可能是還沒到時候，也可能是我們今生看不明白的；主耶穌自己禱告的最後一句是「然而，不要成就我的意思，只要成就你的意思」（路 22:42）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該叫你停止禱告。若你這幾年一直為一件事向神開口，你不是 4:2 那個「不求」的人；若你求的是孩子的健康、家人回轉、一份養家的工作，那也不是「要浪費在你們的宴樂中」。</p><p>這兩節可以拿來照自己的禱告清單：哪一項是為了更愛神、更愛人，哪一項只是為了更舒服？照完，繼續求。主設比喻「是要人常常禱告，不可灰心」（路 18:1）。受苦與信心的全卷立場回指希伯來書立場四；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:2--3 是雅各對一群爭戰中、把神當倉庫的弟兄的診斷，不是說每一個未蒙應允的禱告都是求錯了；保羅和主耶穌也有沒照所求得著的禱告。這兩節可以照自己的心，不可以拿去定別人的罪。受苦與信心見希伯來書立場四、ISS00_9。","care":"會眾席上最容易被這一題刺傷的，是禱告很久還沒有蒙應允的人：久病的、不孕的、失業的、等浪子回家的父母。千萬不要對他們說「你是不是妄求」「你的動機要再檢討」；先陪他們哭，陪他們繼續禱告。若他們自己問「是不是我求錯了」，帶他們讀林後 12:8--9 與路 22:42，讓他們知道神沒有走開，他們也沒有被看成妄求的人。"},{"id":"ISS04_2","t":"4:4「淫亂的人」「與世俗為友」——基督徒可以看電影、聽流行音樂、在娛樂業工作嗎？","r":"4:4；1:27；約 17:15；耶 3:20","ch":[4],"why":"4:4 是全卷最重的稱呼之一，常被拿來畫一條「屬靈／屬世」的界線：哪些職業、哪些音樂、哪些場所是世俗。在娛樂、媒體、餐飲夜間行業工作的會友，常因為這一節覺得自己在教會裡矮一截；也有人因此把非信徒朋友都斷了。這一題要問雅各的「世俗」到底指甚麼，界線畫在哪裡。","pos":[["【一】經文問的是甚麼","","<p>雅各問：「豈不知與世俗為友就是與神為敵嗎？所以凡想要與世俗為友的，就是與神為敵了」（4:4）。「淫亂的人」和合本註腳說「原文是淫婦」：μοιχαλίδες（moichalides）是陰性複數，全會眾不分男女被稱為不忠的妻子——舊約先知的婚約語言（「真像妻子行詭詐離開她丈夫一樣」，耶 3:20；何 1--3）。問題是：雅各說的 κόσμος（kosmos）「世俗」，是一些場所與職業，還是一套價值？</p>"],["場所職業說：遠離特定的文化與行業","","<p>有些傳統認為，與世俗為友就包括參與某些娛樂、音樂、行業與場所；為了保守心，信徒應該盡量避開這些環境，有些教會甚至列出不宜的職業與活動。這一說的長處是認真面對環境對人的影響，也承認人的軟弱。</p><p><strong>難處：</strong>雅各書自己定義的世俗，是按金戒指排座位（2:2--4）、用舌頭點火（3:6）、為宴樂而求（4:3）、靠買賣定義明天（4:13）——全都發生在教會裡。把它畫成職業清單，會讓人以為離開某些行業就不屬世俗，卻放過了會堂門口的偏心；也和 1:27「看顧在患難中的孤兒寡婦」那種走進世界的虔誠相反。</p>"],["心屬誰說：世俗是一套離開神排列的價值","","<p>多數解經家認為，雅各的 κόσμος（kosmos）是一套離開神來排列輕重的價值；「與世俗為友」是讓這套價值成為心裡的伴侶。問題不在人在哪裡工作，而在心屬誰。主耶穌為門徒禱告：「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15）。</p><p><strong>難處：</strong>這個讀法若講得太寬，可能變成「只要心對就甚麼都可以」，忽略某些環境、某些內容確實在塑造人的心；所以它需要配上個人的良心、軟弱與群體的扶持，而不是一句「看心就好」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採心屬誰說：4:4 是先知的婚約語言，問的是心屬誰；世俗是一套離開神排列的價值，不是一張職業與娛樂的禁止清單。</strong>基督徒可以在娛樂業、媒體、任何正當行業工作，可以欣賞電影與音樂；要問的是：這件事在我心裡排第幾？它讓我更愛神愛人，還是更像 4:1--3 的人？</p><p>個別內容是否合宜，按良心與群體的扶持來分辨；本講義不用 4:4 點名任何一種行業或一群人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你羞愧地躲在教會後排。這一節的指控是對教會自己說的，而且是用丈夫的口吻說的：只有丈夫會因為妻子的心不在而痛。它背後是一份不肯放手的愛，下一節就說神「戀愛至於嫉妒」。</p><p>對你今天最要緊的，不是換工作，是問：我的心今天屬誰？不沾染世俗的人，正是走進世界看顧人的人（1:27）。處境與原則的全卷立場見 ISS00_1；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:4「淫婦」是舊約先知的婚約語言，問的是心屬誰；世俗是一套離開神排列的價值，不是職業或娛樂的清單。基督徒可以在各行各業工作、欣賞文化，要分辨的是心裡的排序。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有在娛樂業、媒體、餐飲夜間行業工作的弟兄姊妹，也有因為「世俗」二字斷絕所有非信徒朋友、在家裡和職場越來越孤單的人。不要在講台上用 4:4 點名任何職業，也不要用「淫亂的人」這個稱呼開任何人的玩笑。陪伴在這些行業工作的會友，問他在工作裡最難守住的是甚麼，和他一起禱告，而不是要他先辭職才算屬靈。"},{"id":"ISS04_3","t":"4:5「戀愛至於嫉妒」的靈——這節經文到底在說甚麼？","r":"4:5；出 20:5；出 34:14；4:6","ch":[4],"why":"4:5 被公認是雅各書最難解的一節：「經上所說」找不到舊約逐字的出處，「靈」是神的靈還是人的靈，「戀愛至於嫉妒」的主詞是誰，希臘文的語法都有兩三種可能。各版本的翻譯差別很大，讀者容易困惑，甚至懷疑聖經是不是引錯了，值得把讀法擺出來。","pos":[["【一】經文問的是甚麼","","<p>「你們想經上所說是徒然的嗎？神所賜、住在我們裡面的靈，是戀愛至於嫉妒嗎？」（4:5）原文 Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ κατῴκισεν ἐν ἡμῖν：τὸ πνεῦμα（to pneuma）可以是主詞，也可以是受詞；κατῴκισεν（katōkisen，使之居住；SBLGNT，拜占庭傳統作 κατῴκησεν 住）。問題有三：誰在戀慕？戀慕甚麼？「經上所說」指哪裡？</p>"],["神的嫉妒之愛說（和合本方向）","","<p>主詞是神：神戀慕他使之住在我們裡面的靈，戀慕到嫉妒的地步。這接上 4:4 的婚約語言——丈夫不肯和別人分享妻子；舊約稱神為「忌邪的神」（出 20:5；34:14）。「經上所說」不是引某一節，是總括舊約這個主題。和合本「神所賜、住在我們裡面的靈」大致是這個方向。</p><p><strong>難處：</strong>φθόνος（phthonos）在希臘文裡通常是負面的「嫉妒、妒忌」，新約別處從來不用在神身上；用它描寫神的愛，語感上有些突兀。</p>"],["人的嫉妒說：人的靈戀慕至於嫉妒","","<p>主詞是靈，指神放在人裡面的生命氣息：人的靈傾向嫉妒，正如 4:1--3 的爭戰、殺害嫉妒所顯明的；接著 4:6 說「但他賜更多的恩典」——人的嫉妒很強，神的恩典更大。這讀法保住了 φθόνος 的負面意思，也和上下文的私慾相連。</p><p><strong>難處：</strong>同樣找不到「經上所說」的出處；而且 ἐπιποθέω（epipotheō）「切切戀慕」在新約多半是正面的渴想，用來形容人的嫉妒並不常見。</p>"],["其他讀法：聖靈的戀慕、問句、指向 4:6","","<p>另有三種讀法：其一，聖靈是主詞，聖靈切切戀慕我們至於嫉妒；其二，整句是問句「住在我們裡面的靈，會嫉妒地戀慕嗎？」——答案是不會，他賜更多恩典；其三，「經上所說」不是指 4:5 下半，而是指 4:6 要引的箴言，4:5 下半是插入的話。</p><p><strong>難處：</strong>這三種讀法各自解決一個難處，卻又產生新的語法問題；它們提醒我們，這一節在希臘文本身就有歧義，各家都是在可能性之間選擇。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義以第一種（神的嫉妒之愛）為講台的主要讀法，與和合本方向一致，但並陳其餘四種，不在講台定案。</strong>理由是它與 4:4 的婚約畫面、舊約「忌邪的神」最連貫；而五種讀法都同意下一節的落點：「但他賜更多的恩典」（4:6）。</p><p>講台只講一句大家都同意的話：神不肯和世界分享我們。他的忌邪不是沒有安全感，是愛得太滿。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。一節經文難解，不等於聖經出錯；它只說明我們讀的是兩千年前、用另一種語言寫的真實書信。連最仔細的學者都在幾種可能之間謙卑地選擇，這本身就是信心的功課。</p><p>你可以放心帶走的，是這節經文無論怎樣讀都不改變的那一筆：神在乎你的心屬誰，而且他的恩典比你的嫉妒更大。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:5 有五種讀法，本講義以「神戀慕住在我們裡面的靈，至於嫉妒」為講台的主要讀法，並陳其餘，不定案；講台只講一句：神不肯和世界分享我們，而他賜更多的恩典。本講義的全卷立場見 ISS00_9。","care":"會眾裡可能有剛開始認真讀經、發現不同譯本差很多就開始動搖的人，也有聽到「神會嫉妒」就聯想到控制型父母或伴侶而害怕的人。不要嘲笑提問的人，也不要用一句「不必管那麼多」打發他。對害怕的人，要說清楚：神的忌邪是丈夫為妻子的心痛，不是操控；他接下來做的事，是賜更多的恩典。"},{"id":"ISS04_4","t":"4:6「神阻擋驕傲的人」——為甚麼和箴言 3:34 的字句不一樣？","r":"4:6；箴 3:34；彼前 5:5","ch":[4],"why":"4:6 是全卷樞紐，也是 321 核心句「神施恩給謙卑的人，阻擋驕傲的人」的出處。可是翻開和合本箴 3:34，前半句是「他譏誚那好譏誚的人」。細心的會友會問：雅各引錯了嗎？我們團契背的那句話，到底是聖經哪一個版本？這一題關係到我們怎樣看新約引用舊約。","pos":[["【一】經文問的是甚麼","","<p>雅各說：「但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人」（4:6）。和合本箴言是「他譏誚那好譏誚的人，賜恩給謙卑的人」（箴 3:34）。彼得也引同一句：「神阻擋驕傲的人，賜恩給謙卑的人」（彼前 5:5）。後半句一樣，前半句不同。問題是：為甚麼不同？哪一個才是「經上所說」？</p>"],["兩個版本說：雅各照希臘文舊約引用","","<p>和合本箴言是從希伯來文翻譯的；雅各和彼得寫信給說希臘語的散居信徒，引用的是當時通行的希臘文舊約（七十士譯本），那裡的箴 3:34 正是「主阻擋驕傲的人，賜恩給謙卑的人」。兩個版本都是同一節經文的傳承，意思相通：神對自高的人站在對面，恩典往謙卑的人那裡去。</p><p><strong>難處：</strong>這說明了來源，但讀者仍會問：哪一個字句才是原本的？對此只能說，新約作者在聖靈默示下採用了希臘文版本的字句，我們不必在兩者之間判誰錯，而是兩個都讀。</p>"],["意譯引用說：雅各自由地轉述經文的意思","","<p>另一些人認為，新約作者引舊約常常不是逐字，而是抓住意思、用自己的話轉述；雅各把「譏誚那好譏誚的人」講成更普遍的「阻擋驕傲的人」，因為好譏誚正是驕傲的一種樣子。</p><p><strong>難處：</strong>這一說可以解釋許多地方，但 4:6 與七十士譯本幾乎逐字相同，彼得也一字不差地引用；所以這裡比較像是照一個現成的版本引用，而不是各自意譯。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採兩個版本說：雅各與彼得照希臘文舊約引用箴 3:34，和合本箴言照希伯來文翻譯；兩個版本，說的是同一件事，不是誰引錯了。</strong>321 的核心句用的是雅各與彼得的版本，這是有根據的。</p><p>這也提醒我們，團契的那句話不是我們發明的，是從箴言、經過雅各的信，傳到我們手上的；所以講它的時候，要先讓 4:1--5 的爭戰與 4:6 的「但」站穩，再說這句話，而不是把經文當成口號的插圖。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約引用舊約時用希臘文版本，是當時再自然不過的事，就像今天的牧者引用和合本、新譯本或英文聖經一樣；版本不同，見證的是同一位神。</p><p>你可以放心背那一句話。更要緊的是記得它在經文裡的位置：前面是「但他賜更多的恩典」——先有恩典，才有謙卑。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:6 照希臘文舊約（七十士譯本）引用箴 3:34，和合本箴言照希伯來文翻譯，是兩個版本，不是引錯；彼前 5:5 也引同一個版本。321 的核心句出自雅各與彼得的版本。本講義的全卷立場見 ISS00_9。","care":"會眾裡會有第一次發現兩處字句不同、心裡一驚的人，也有聽過網路上「聖經自相矛盾」說法而動搖的年輕人。不要用「這不重要」敷衍他們，也不要把問題講成學術炫耀；用一兩句話說清楚兩個版本的來由，再帶他們回到經文：這句話的前面是「但他賜更多的恩典」。讓提問成為他更認識聖經的入口。"},{"id":"ISS04_5","t":"4:7「抵擋魔鬼，魔鬼就必離開你們逃跑了」——趕鬼、捆綁邪靈要怎樣做？","r":"4:7；彼前 5:8--9；弗 6:11；太 4:10","ch":[4],"why":"許多信徒讀到 4:7，會想到捆綁邪靈、斥責、趕鬼的禱告；有些教會發展出固定的口訣與儀式，也有人把各種病痛、情緒與家中不順都歸給鬼。另一些信徒則幾乎不提魔鬼。這一題要問：雅各說的抵擋是甚麼？他給的方法是甚麼？","pos":[["【一】經文問的是甚麼","","<p>「故此，你們要順服神。務要抵擋魔鬼，魔鬼就必離開你們逃跑了」（4:7）。兩個命令有次序：ὑποτάγητε（hypotagēte）「順服」是排到神的下面，ἀντίστητε（antistēte）「抵擋」是站穩對抗。διάβολος（diabolos）原意是控告者、離間者。彼得也說「你們要用堅固的信心抵擋他」（彼前 5:9）。問題是：抵擋魔鬼是一種特別的禱告儀式，還是一種生活的站位？</p>"],["權柄宣告說：奉主名斥責、捆綁邪靈","","<p>靈恩與五旬節傳統強調，信徒在基督裡有權柄（路 10:19），抵擋魔鬼包括奉耶穌的名直接斥責、驅逐邪靈；主耶穌和使徒都趕過鬼，這是福音的一部分。這一說提醒教會：屬靈的爭戰是真實的。</p><p><strong>難處：</strong>4:7 本身沒有教任何口訣或儀式；若把抵擋魔鬼講成一套技巧，容易忽略雅各放在前面的「順服神」，也容易把病、憂鬱、家中不順一律歸給鬼，叫人恐懼，甚至延誤就醫。主也提醒「不要因鬼服了你們就歡喜」（路 10:20）。</p>"],["生活站位說：順服神就是抵擋魔鬼","","<p>許多改革宗與福音派解經家認為，4:7 的抵擋主要是倫理與信心的：在 4:1--6 的處境裡，魔鬼最會的是離間、挑起驕傲與爭戰；人回到神下面的位子、謙卑、拒絕私慾，就是在抵擋牠。以弗所書的全副軍裝（弗 6:11）也是真理、公義、信心、神的道與禱告。</p><p><strong>難處：</strong>這一說若講過頭，可能把魔鬼淡化成比喻，對真實經歷屬靈壓迫的人（特別是從民間信仰背景歸主的人）沒有回應；新約確實記載了實際的趕鬼。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義強調 4:7 的次序：先順服神，才抵擋魔鬼；抵擋的根基是回到神下面的位子，不是口訣或儀式。</strong>主耶穌在曠野先說「當拜主你的神，單要事奉他」（太 4:10），魔鬼就離開了。魔鬼的實在與屬靈爭戰的範圍，本講義回指以弗所書立場四，本章不另立說法。</p><p>本講義不把疾病、憂鬱、精神疾病一律歸為鬼附；遇到疑似屬靈壓迫的情形，由教會長老同工按各自傳統審慎陪伴，同時鼓勵就醫，兩者並行。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕。雅各說的是「魔鬼就必離開你們逃跑了」——逃跑的是牠，不是你。得勝不是因為你的口訣夠強，是因為你站在對的位置：一個孩子站在父親身後，追他的人自然退去。</p><p>如果你常被不安、控告的聲音困住，先回到神面前、找信任的同伴一起禱告；若影響到睡眠與生活，也請安心就醫。屬靈爭戰見以弗所書立場四；醫藥見 ISS00_4。</p>"]],"con":[],"say":"本講義的立場：4:7 的次序是先順服神，才抵擋魔鬼；抵擋的根基是回到神下面的位子，不是口訣或儀式；不把疾病與情緒一律歸給鬼，禱告與就醫並行。屬靈爭戰回指以弗所書立場四，醫藥見 ISS00_4。","care":"會眾裡可能有從民間信仰背景歸主、家中仍有拜拜的人，有長期憂鬱焦慮、被人說「你是被鬼纏住」的人，也有曾在趕鬼聚會中被當眾斥責而受傷的人。不要用恐嚇的方式講魔鬼，也不要嘲笑別人的經歷；不要對病人說「這是鬼，不用吃藥」。陪伴的人先讓對方安心，和他一起禱告，必要時協助他就醫，並由長老同工審慎跟進。"},{"id":"ISS04_6","t":"4:9「將喜笑變作悲哀」——基督徒不可以笑嗎？","r":"4:8--10；1:2；5:13；傳 3:4","ch":[4],"why":"4:9 叫人「愁苦、悲哀、哭泣」，和 1:2「都要以為大喜樂」、5:13「有喜樂的呢，他就該歌頌」放在一起，讀者會困惑：雅各到底要人笑還是哭？有些傳統因此看重嚴肅與憂傷，也有人覺得教會應該永遠正面積極。這一題關係到信徒怎樣在神面前面對自己的情緒。","pos":[["【一】經文問的是甚麼","","<p>「你們要愁苦、悲哀、哭泣，將喜笑變作悲哀，歡樂變作愁悶」（4:9）。這一節夾在「你們親近神，神就必親近你們」（4:8）與「務要在主面前自卑，主就必叫你們升高」（4:10）之間。ταλαιπωρήσατε（talaipōrēsate）是「承認自己的悲慘」。問題是：這是一條情緒的規則（基督徒要嚴肅），還是一個悔改的呼召？</p>"],["敬虔憂傷說：信徒應當常存憂傷痛悔","","<p>有些敬虔傳統（例如部分清教徒與隱修傳統）看重常存痛悔的心，認為輕浮的笑會使人忘記罪與審判；4:9 加上「哀慟的人有福了」（太 5:4），支持一種嚴肅、節制的生活態度。這一說的長處是認真看待罪。</p><p><strong>難處：</strong>同一位雅各在 1:2 說要以為大喜樂，在 5:13 叫有喜樂的人歌頌；聖經也說「哭有時，笑有時」（傳 3:4）。把 4:9 當成普遍的情緒規則，會讓福音的喜樂消失，也讓天生開朗的人覺得自己不屬靈。</p>"],["悔改呼召說：對自滿宴樂者的先知呼喊","","<p>多數解經家認為，4:9 是先知式的悔改呼召，對象是 4:1--4 那群在爭戰中、把求來的東西浪費在宴樂裡的人；他們的「喜笑」是對自己的光景毫無知覺的笑。雅各要的不是一張苦臉，而是一顆終於為自己痛起來的心；這痛的終點是 4:10 的升高。</p><p><strong>難處：</strong>這個讀法若講得太輕，可能把悔改的眼淚也一起取消；雅各確實要人真實地為罪難過，只是這難過有方向、有終點，不是要人一直留在裡面。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採悔改呼召說：4:9 是對自滿宴樂、還在爭戰的人發出的呼召，不是禁止基督徒笑。</strong>依著神的意思憂愁，「就生出沒有後悔的懊悔來，以致得救」（林後 7:10）；它的終點是「主就必叫你們升高」（4:10）。</p><p>雅各給眼淚留了位子，也給歌頌留了位子。喪親、受苦的人難過不是不屬靈；喜樂的人歌頌也不是輕浮。不必假裝喜樂，也不必表演悲傷。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑自己的笑或自己的眼淚。若你正在一段很苦的日子裡，雅各沒有要你假裝；你可以在神面前哭。若你此刻很喜樂，就照 5:13 歌頌。</p><p>這一節要你問的只有一件事：我的笑，是對神的感恩，還是對自己光景的麻木？若是後者，就讓 4:8 帶你回到神面前；主耶穌說「你們哀哭的人有福了！因為你們將要喜笑」（路 6:21）。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:9 是對自滿宴樂、還在爭戰的人的悔改呼召，不是禁止基督徒笑；雅各也叫人喜樂、歌頌，也給眼淚留了位子。依著神的意思憂愁，終點是主叫人升高。本講義的全卷立場見 ISS00_9。","care":"會眾裡有正在喪親、病痛、婚姻破裂中的人，他們最怕聽到「基督徒要喜樂」，卻也可能聽成「你還要更悲哀地悔改」；也有從小在嚴肅教會長大、到現在笑都覺得有罪的人。不要在講台上逼人當場哭；不要叫受苦的人收起眼淚，也不要對他們說「你還不夠痛悔」。陪他們讀 4:8 與 4:10：眼淚有終點，主會叫人升高。"},{"id":"ISS04_7","t":"4:11--12「你是誰，竟敢論斷別人呢？」——那教會還能不能指出罪？","r":"4:11--12；5:19--20；太 7:1；加 6:1","ch":[4],"why":"「不要論斷」是今天最常被引用的經文之一，常被用來擋住任何指正：受傷的人說出遭遇被說成論斷，同工指出制度問題被說成批評，教會面對明顯的罪也不敢開口。也有人反過來，在背後評斷別人卻自稱「只是勸戒」。這一題要分清雅各禁止的是甚麼。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，你們不可彼此批評。人若批評弟兄，論斷弟兄，就是批評律法，論斷律法」（4:11）；「設立律法和判斷人的，只有一位，就是那能救人也能滅人的。你是誰，竟敢論斷別人呢？」（4:12）καταλαλέω（katalaleō）是「往下說」，多半在背後；κρίνω（krinō）在兩節中出現多次。問題是：雅各禁止一切對罪的評估，還是禁止某一種說話的姿態？</p>"],["全面禁止說：基督徒不應評斷任何人","","<p>有些人把 4:11--12 與太 7:1 讀成全面的原則：每個人只管自己，不要對別人的生活下任何判斷；這一說的長處是看見人心中很深的審判傾向，提醒教會謙卑、寬容。</p><p><strong>難處：</strong>雅各自己在書末要人去使失迷的弟兄「回轉」（5:19--20）；主耶穌也教導「指出他的錯來」（太 18:15）；保羅說要「用溫柔的心把他挽回過來」（加 6:1）。全面禁止會讓教會無法保護受害者、無法面對罪，也讓指出問題的人被消音。</p>"],["姿態區分說：禁止的是坐上審判官的位子","","<p>多數解經家認為，雅各禁止的是一種姿態：在背後往下說人、把自己放在律法之上、替神宣判人的結局。指出罪、勸戒、教會紀律在新約都有位置；分別在動機、方法、位子。</p><p><strong>難處：</strong>動機與位子看不見，人很容易替自己的論斷找到「我是在勸戒」的理由；所以這一說需要群體的檢驗與方法上的界線（當面、私下、溫柔），不能只靠自我宣稱。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採姿態區分說，全卷立場見 ISS00_5：勸戒與論斷有三個分別——動機為了把人找回來（5:20）、方法當面私下溫柔（3:13）、位子站在弟兄旁邊，不坐審判官的位子（4:12）。</strong></p><p>受害者說出遭遇不是論斷；會友提出問題、同工指出制度的錯，也不是論斷。4:12 揭穿的，是人離開本位、抓住只屬於神的權力——那能救人的才有資格定人的罪，而他選擇了救人。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你不敢說真話。若你曾因為說出受傷的經歷被說成「論斷」，那是用錯了這一節。若你常常在背後評斷人，這一節是邀請，不是判決：從坐著說，改成走過去說。</p><p>論斷是坐著說的，勸戒是走過去說的。舌頭與論斷的全卷立場見 ISS00_5；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：4:11--12 禁止的是坐上審判官的位子、在背後往下說人，不是禁止教會指出罪；勸戒與論斷有動機、方法、位子三個分別。本講義的全卷立場見 ISS00_5。","care":"會眾裡最容易被這一題傷到的，是說出自己被傷害的經歷、卻被一句「不要論斷」擋回去的人，以及提出問題後被貼上「愛批評」標籤的同工。不要用 4:11 叫受害者或提問的人閉嘴；涉及暴力、性侵、兒少，先保護安全、依法處理。同時也陪伴那些習慣背後評斷人的人，用 4:6 的恩典邀請他們，而不是用另一場論斷對付他們。"},{"id":"ISS04_8","t":"4:13--15「主若願意」——基督徒可以做生涯規劃、投資理財嗎？","r":"4:13--16；路 14:28；徒 18:21；箴 16:9","ch":[4],"why":"4:13 的商人被雅各叫住，讓一些信徒以為做計畫、談生意、投資理財都不夠屬靈，「順其自然、交給神」才是信心；也有人把「主若願意」當成口頭禪，計畫照自己的意思做，只在句尾加一句。這一題關係到信徒怎樣面對職涯、財務與未來。","pos":[["【一】經文問的是甚麼","","<p>「嗐！你們有話說：『今天明天我們要往某城裡去，在那裡住一年，做買賣得利。』」（4:13）雅各的回答是：「你們只當說：主若願意，我們就可以活著，也可以做這事，或做那事」（4:15）。4:13 的四個動詞主詞全是「我們」；4:15 用 ἀντὶ τοῦ λέγειν（anti tou legein）「代替那樣說」。問題是：雅各反對的是計畫本身，還是計畫裡的主詞？</p>"],["交託不規劃說：計畫顯出不信","","<p>有些信徒與部分敬虔傳統認為，基督徒應該盡量少做長期規劃、少累積財富，凡事等候神的帶領；主耶穌說「不要為明天憂慮」（太 6:34），無知的財主也是因為計畫多年的享受而被稱為無知（路 12:19--20）。這一說的長處是提醒人的有限。</p><p><strong>難處：</strong>聖經也稱讚「殷勤籌劃的，足致豐裕」（箴 21:5），主耶穌說蓋樓要先坐下算計花費（路 14:28），保羅一再排行程。把不規劃當成屬靈，容易把懶惰屬靈化，也讓需要照顧家人的人失去負責的空間。</p>"],["主詞轉換說：計畫照做，讓主有改動的權利","","<p>多數解經家認為，雅各沒有禁止旅行、經商、賺錢；4:13 那句話沒有一個字是罪，錯在神不在這張行事曆上，而且 4:16 說他們「以張狂誇口」。保羅寫「神若許我，我還要回到你們這裏」（徒 18:21），正是 4:15 的樣子。「人心籌算自己的道路；惟耶和華指引他的腳步」（箴 16:9）。</p><p><strong>難處：</strong>這一說若只停在「加一句主若願意」，可能變成口頭禪；真正的主詞轉換，包括願意讓主改動計畫、在財務上不倚靠無定的錢財（提前 6:17），並且留一格給行善（4:17）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採主詞轉換說：「主若願意」不是宿命，也不反對規劃；計畫照做，只是主詞換了。</strong>基督徒可以做生涯規劃、投資理財、經營生意；要問的是：我的明天是誰作主？這計畫若被主改動，我願不願意？財富的方向與雇主責任，見 ISS00_3。</p><p>4:14「一片雲霧」一定接 4:15：生命短暫不是說生命沒有價值，是說生命不在我手裡，而在主的手裡。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你因為認真規劃而內疚，也不該讓你放下該負的責任。你可以繼續存退休金、做職涯計畫、經營生意，只是把它攤在神面前，和家人一起說「主若願意」，並預備好備案。</p><p>若你此刻覺得明天很重、甚至不想有明天，請記得：雲霧般的生命不是被丟在風裡；你的生命正是主所願意的。請找一位你信任的人說出來。處境與原則的全卷立場見 ISS00_1。</p>"]],"con":[],"say":"本講義的立場：「主若願意」不是宿命，也不反對生涯規劃與投資理財；計畫照做，只是主詞換了，並讓主有改動它的權利。4:14 雲霧一定接 4:15，不可講成生命沒有價值。財富的方向見 ISS00_3，處境與原則見 ISS00_1。","care":"會眾裡有認真規劃卻被說「不夠信靠」的人，有因為投資失利而羞愧的人，也可能有聽到「你們原來是一片雲霧」就覺得自己可有可無、甚至有輕生念頭的人。對後者，不要只說「要有信心」，要陪伴他、認真聽，並協助轉介專業諮商與當地的生命線、自殺防治等危機資源；必要時陪他就醫。對投資失利的人，不要用 4:16 定他的罪，先陪他面對眼前的難處。"},{"id":"ISS04_9","t":"4:17「知道行善，卻不去行，這就是他的罪了」——不作為也是罪嗎？","r":"4:17；路 10:31；太 25:45；加 6:10","ch":[4],"why":"許多信徒對罪的理解只停在「做了不該做的事」；4:17 卻說知道該行的善不去行也是罪。這一節一方面喚醒冷漠，另一方面也可能被用來壓迫良心敏感的人，讓人永遠覺得自己做得不夠。這一題要問它的範圍與界線。","pos":[["【一】經文問的是甚麼","","<p>「人若知道行善，卻不去行，這就是他的罪了」（4:17）。這一節以 οὖν（oun）「所以」接在 4:13--16 之後：一張只有「我們」的行事曆，容易排滿自己的事，卻沒有留給神放在眼前的善。它也回應 1:22「只是你們要行道，不要單單聽道」與 2:15--16 不給飢寒的弟兄吃穿。問題是：這是一條普遍原則（凡知道的善都必須做），還是對特定處境的提醒？</p>"],["普遍原則說：不作為之罪是真實的罪","","<p>許多神學傳統把 4:17 視為「疏忽之罪」的經典經文：罪不只是越界，也是缺席。主耶穌的比喻裡，祭司「看見他就從那邊過去了」（路 10:31）；末日審判說「這些事你們既不做在我這弟兄中一個最小的身上，就是不做在我身上了」（太 25:45）。這一說的長處是喚醒舒適的信徒。</p><p><strong>難處：</strong>若把「知道的善」無限擴大，每一個新聞裡的需要、每一個教會的缺口都成了我的罪，良心敏感的人會被壓垮，也會把行善變成焦慮的還債。</p>"],["上下文說：連在「主若願意」之後的提醒","","<p>另一些解經家強調 4:17 的上下文：它是 4:13--16 的結語，對象是那些知道「主若願意」卻照樣張狂誇口的人；也是雅各書行道主題的收束——知道了卻不去行，是自欺（1:22）。重點在「知道」：神放在你眼前、你清楚知道的那一件善。</p><p><strong>難處：</strong>這一說若講得太窄，可能讓人以為只要不做生意誇口，就與此無關；而雅各書整卷的確把「沒有做」當成真實的問題，不能輕輕放過。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為不作為確實可以是罪，但 4:17 說的是「知道」的那一件善——神放在你眼前、你清楚知道、又在你能力之內的事，不是世上所有的需要。</strong>它接在「主若願意」之後：一張讓主作王的行事曆，會自然留一格給那件善事。</p><p>這一節不是救恩的條件，也不是叫人靠行善得救；信心與行為的全卷立場見 ISS00_2。行善的力量，來自 4:6 的「他賜更多的恩典」。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你活在無止境的虧欠裡。你不是世界的救主，那一位已經來過了。但它可以讓你今天停下來問：神放在我眼前的那一件善事是甚麼？那一通電話、那一次探望、那一筆該還的人情。</p><p>「所以，有了機會就當向眾人行善，向信徒一家的人更當這樣」（加 6:10）。做那一件，然後安心睡覺。信心與行為見 ISS00_2；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：不作為可以是罪，但 4:17 指的是神放在眼前、自己清楚知道、能力所及的那一件善，不是世上所有的需要；它不是救恩的條件，行善的力量來自恩典。本講義的全卷立場見 ISS00_2。","care":"會眾裡有已經服事到累垮的同工、照顧病中家人筋疲力盡的人，以及良心特別敏感、看到每一個需要都覺得是自己的罪的人。不要用 4:17 催他們再多接一件服事，也不要說「你知道教會缺人，不來就是犯罪」。陪他們分辨：神放在你眼前的善事，常常就是你手上正在照顧的那一位；休息也在主的旨意裡。"},{"id":"ISS05_1","t":"5:1--6「你們這些富足人哪，應當哭泣」——基督徒老闆和富人怎麼讀這一段？","r":"5:1--3；5:5；2:5--7；1:9--11；太 6:19--21","ch":[5],"why":"這是新約對富人最嚴厲的一段話，語氣像先知在城門口宣告審判。會眾席上同時坐著老闆、白領、打工的人與失業的人；有人聽了覺得被整體定罪，有人聽了暗自痛快。這一題要說清楚雅各到底審判甚麼，也要讓一位誠實經營的基督徒老闆知道該怎樣讀。","pos":[["【一】經文問的是甚麼","","<p>「嗐！你們這些富足人哪，應當哭泣、號咷，因為將有苦難臨到你們身上」（5:1）。這一段雅各沒有叫「弟兄們」，語氣是先知的哀歌；接著列出財物壞了、衣服被蟲咬、金銀長了銹，「你們在這末世只知積攢錢財」（5:3）。問題是：這些「富足人」是教會外的地主，還是教會裡的有錢人？雅各審判的是財富本身，還是財富的用法？</p>"],["教會外的富人說：先知式的審判宣告","","<p>許多解經家認為，5:1--6 和 4:13--17 的商人不同，這裡的富足人沒有被稱為弟兄，是欺壓散居信徒的外邦或猶太地主（2:6「欺壓你們、拉你們到公堂去」）。就像舊約先知對列國說話，聽眾其實是以色列人：雅各說給富人聽，是要叫受欺壓的弟兄知道神看見了，接著才說「弟兄們哪，你們要忍耐」（5:7）。</p><p><strong>難處：</strong>若只讀成「罵外人」，教會裡的富人就很容易覺得與己無關；可是 2:2--4 已經顯示，偏心與追逐財富的心就在聚會裡面。</p>"],["教會內外都包括說：給一切擁有財富的人的警告","","<p>另一些解經家認為，雅各的對象有意寫得寬：不論在教會內外，凡是積攢、欠薪、奢華、用權勢定義人罪的，都在這段審判之下。1:10「富足的降卑，也該如此」說明教會裡本來就有富足的弟兄，雅各要他們誇自己的降卑；這一段是給他們的最後警告。</p><p><strong>難處：</strong>這一讀若講過頭，容易變成「凡有錢就有罪」，忽略雅各指名的是具體的罪——積攢、欠薪、奢華、殺害義人，而不是銀行存款的數字。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為，這段審判的直接對象是欺壓人的富足地主，但它照出來的罪，任何擁有財富或權力的人——包括基督徒老闆與教會自己——都要拿來照。</strong>財富不是罪，但財富有方向：流出去，成為別人桌上的飯；或堆起來，發銹。雅各指名的是積攢、欠薪、奢華、定義人的罪。本講義不是仇富，也不美化貧窮。全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑神，卻該讓你檢查錢。各家都同意：神聽得見被欺壓的人，財富在神面前不能保護任何人。對一位基督徒老闆，最好的回應不是罪疚，而是行動——準時足額付工錢、讓財富流向需要的人，「只要積攢財寶在天上」（太 6:20）。</p>"]],"con":[],"say":"本講義的立場：5:1--6 的直接對象是欺壓人的富足地主，但它照出的積攢、欠薪、奢華與定罪義人，任何擁有財富與權力的人都要拿來照；財富不是罪，但財富有方向。本講義的全卷立場見 ISS00_3。","care":"會眾席上有誠實經營、壓力很大的小老闆，聽到這段可能覺得被整體定罪；也有被老闆欺負過的人，聽到這段可能燃起恨意。不要在講台上點名任何一位會友的財富，也不要讓這段成為發洩仇富情緒的出口。陪老闆看見財富的方向，陪受欺壓的人把審判交給主，同時協助他循正當管道討回公道。"},{"id":"ISS05_2","t":"5:4「你們虧欠他們的工錢」——欠薪、外籍移工與教會同工的待遇，雅各會怎麼說？","r":"5:4--5；利 19:13；申 24:15；2:4","ch":[5],"why":"華人教會很少在講台上談工錢。可是會眾裡有被拖欠薪水的勞工、在異鄉做看護與工廠工的外籍移工，也有基督徒雇主；教會自己也是雇主，聘用同工、清潔、保全與外包。這一題要說出 5:4 今天落在哪裡，以及被欠薪的人可以怎麼辦。","pos":[["【一】經文問的是甚麼","","<p>「工人給你們收割莊稼，你們虧欠他們的工錢，這工錢有聲音呼叫，並且那收割之人的冤聲已經入了萬軍之主的耳了」（5:4）。「虧欠」原文 ἀφυστερημένος 是扣住、拖著不給；律法早就說「要當日給他工價，不可等到日落」（申 24:15）。問題是：這一節今天落在哪些人身上？教會也在這一節之下嗎？被欠薪的基督徒應該忍耐，還是應該討回？</p>"],["個人敬虔說：重點是雇主的良心","","<p>有些讀法把 5:4 主要放在個人敬虔：基督徒老闆要有良心，準時付工錢；被欠薪的人則照 5:7 忍耐，把審判交給主。這一說看重雅各「忍耐，直到主來」的語氣，提醒受害者不要自己報復。</p><p><strong>難處：</strong>若只講到這裡，很容易變成勸受害者吞下去；5:7 的忍耐是不報復，不是放棄權益。律法本身就有保護雇工的制度（利 19:13），雅各引的是公義的傳統，不只是個人的善心。</p>"],["社會公義說：工錢是制度與群體的責任","","<p>另一些讀法強調，5:4 延續先知的社會公義傳統（這使我們想起賽 5:9），神聽見的是一個階層的冤聲。今天的落點包括勞動法規、移工仲介費與扣薪、外包層層剝削；教會應當為弱勢發聲，並在自己的聘僱上作榜樣。</p><p><strong>難處：</strong>這一讀若講成政治動員，容易讓講台變成某一立場的平台；雅各的語言是先知對心的宣判，不是政策清單，需要分辨哪些是經文的原則、哪些是講員自己的判斷。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為兩說都要：雇主的良心是起點，群體與制度的公義是延伸；而第一個要照的，是教會自己作為雇主。</strong>同工的薪水、清潔與保全的待遇、外包付款拖多久，都在 5:4 之下。被欠薪的人可以忍耐不報復，同時依法申訴、尋求協助；「要順服老闆」不能拿來勸人忍受違法欠薪，把委屈說成奉獻更是錯的。全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑神的公義，反而是神公義的證據：萬軍之主的耳朵，正聽著最小的那份工錢。如果你是被欠薪的人，你的冤聲已經進了主的耳；如果你是付錢的人，這週就把帳查一次。</p>"]],"con":[],"say":"本講義的立場：5:4 先照教會自己與基督徒雇主——準時、足額、有尊嚴地付工錢；被欠薪的人可以不報復，也可以依法申訴，教會不為欠薪找屬靈理由。本講義的全卷立場見 ISS00_3。","care":"會眾裡可能有被拖欠薪水卻不敢說的人，有付了高額仲介費、證件被扣的外籍移工，也有教會自己的低薪同工。不要對他們說「要順服、要感恩」就結束；陪他們找勞工申訴管道、移工協助團體。教會若自己有欠薪或待遇問題，先處理，再講這一節。"},{"id":"ISS05_3","t":"5:6「你們定了義人的罪，把他殺害」——這「義人」是誰？","r":"5:6；徒 3:14；賽 53:7；4:6","ch":[5],"why":"5:6 是一句很短的控告：定罪、殺害、他也不抵擋。「義人」是單數，歷代讀者讀出三種不同的人。這一題關係到我們怎樣聽這一段：是在講社會不公，還是在講基督受難，還是在講作者自己？讀法不同，講台的落點也會不同。","pos":[["【一】經文問的是甚麼","","<p>「你們定了義人的罪，把他殺害，他也不抵擋你們」（5:6）。SBLGNT 最後一句標成問句：οὐκ ἀντιτάσσεται ὑμῖν;「他不抵擋你們嗎？」ἀντιτάσσεται 與 4:6「神阻擋驕傲的人」是同一個字。問題是：這個被殺的「義人」是誰？最後那一句是說他沒有反抗，還是問「神不抵擋你們嗎」？</p>"],["受欺壓的義人說（多數）","","<p>多數解經家認為，「義人」是集合的單數：被富人用法庭和財富吞掉生計、甚至因此喪命的窮人。2:6 說富足人「拉你們到公堂去」，5:4 說扣住工錢，5:6 是同一條線的終點——奪走窮人的生計，就是殺害他。</p><p><strong>難處：</strong>單數「義人」與冠詞讀來像指一位特定的人；而且「殺害」一詞很重，若只是比喻，語氣似乎過強。</p>"],["耶穌說","","<p>有些讀者認為，這裡指向那一位義者——彼得說「你們棄絕了那聖潔公義者」（徒 3:14）；「他也不抵擋」使人想起「他被欺壓，在受苦的時候卻不開口」（賽 53:7）。雅各本人是主的兄弟，對哥哥被定罪、被殺害，記憶最深。</p><p><strong>難處：</strong>上下文講的是地主與工人，突然轉向基督受難，有些跳躍；雅各全卷只提主耶穌的名兩次，若此處是指耶穌，他沒有交代。</p>"],["雅各自己說（少數）","","<p>早期教會稱雅各為「公義者雅各」，他約在主後 62 年於耶路撒冷殉道。少數人認為 5:6 是後人回顧雅各之死。</p><p><strong>難處：</strong>這一讀要假定本書寫成於雅各死後，與本講義的作者立場（決策丙；ISS00_6、ISS00_7）不合，接受的人不多。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義取第一讀為主：義人是受欺壓、被奪走生計的窮人；第二讀作為回聲——在受欺壓的義人身上，看得見那一位不開口的義者。</strong>末句可以讀成陳述（他沒有反抗），也可以讀成問句（神豈不抵擋你們嗎）；兩者合在一起正好說出這一段的安慰：義人沒有抵擋，但神會。講台只說「這使我們想起」，不把 5:6 定案為基督預言。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三說都同意：神站在受欺壓的義人那一邊，受欺壓的人不必自己報復。這正是下一節「所以」要人忍耐的理由。</p><p>不論你取哪一讀，這一節都把受欺壓的人和那一位不開口的義者放在一起：你受的委屈，主自己走過；你沒有抵擋的地方，神親自抵擋。對今天被不公平對待的人，這是安慰，不是要他沉默的命令。</p>"]],"con":[],"say":"本講義的立場：5:6 的「義人」主要指受欺壓、被奪走生計的窮人；在他身上，這使我們想起那一位不開口的義者耶穌。義人沒有抵擋，但神會；所以受欺壓的人可以把審判交給主。","care":"會眾裡有長期被不公平對待、甚至因此失去健康或家人的人。不要把「他也不抵擋」講成要受害者永遠不出聲、不求助；不抵擋是不報復，不是放棄保護自己。陪他們看見：神沒有站在旁邊看，神在抵擋。"},{"id":"ISS05_4","t":"5:7--9「主來的日子近了」——兩千年了，還算「近」嗎？","r":"5:7--9；太 24:36；彼後 3:8--9","ch":[5],"why":"雅各說「主來的日子近了」「審判的主站在門前了」，可是兩千年過去了。有人因此懷疑聖經說錯了，也有人用這幾節和「秋雨春雨」排出末世時間表。這一題要說清楚「近」是甚麼意思，也要擋住算日子的講法（鐵律四）。","pos":[["【一】經文問的是甚麼","","<p>「你們也當忍耐，堅固你們的心，因為主來的日子近了」（5:8）；「看哪，審判的主站在門前了」（5:9）。ἤγγικεν 是完成式「已經近了」。問題是：雅各是不是以為主會在他那一代回來？「近」若不是時間上的近，是甚麼近？</p>"],["時間近說：初代教會期待主很快回來","","<p>有些學者認為，初代信徒普遍期待主在他們有生之年再來，雅各也是；後來教會才逐漸調整這個期待。</p><p><strong>難處：</strong>這一讀容易推出「聖經說錯了」；但同一批作者也一再說日子不能知道（太 24:36），彼得更說「主看一日如千年，千年如一日」（彼後 3:8），可見初代教會並沒有把「近」等同於一個日期。</p>"],["迫近說：隨時可能、所以今天要預備","","<p>多數福音派解經家認為，「近」是迫近：主來的事件已經站在門口，隨時可能發生，沒有任何預言還擋在前面。雅各的重點不是告訴人還有多久，是叫人今天就不埋怨、今天就堅固心；像家裡的孩子知道父親已經在回家路上，就把房間收好。</p><p><strong>難處：</strong>「迫近」若被講成「下個月就來」，又會滑向算日子；若講得太抽象，又失去雅各要的緊迫感。</p>"],["末世時間表說：秋雨春雨是兩波澆灌","","<p>有些靈恩或時代論的講台，把 5:7 的「秋雨春雨」讀成兩波聖靈澆灌：五旬節是秋雨，末後大復興是春雨，然後主就來。</p><p><strong>難處：</strong>「秋雨春雨」原文 πρόϊμον καὶ ὄψιμον 是「早的和晚的」，是巴勒斯坦農夫的日曆（這使我們想起申 11:14）；雅各用它說明等候，不是預告時間。從比喻推出時間表，是把雅各沒有說的放進他口中。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義取迫近說：「近了」是叫人今天就忍耐、不埋怨，不是叫人算日子；秋雨春雨是農夫的日曆，不是末世時間表。</strong>神的遲延是「寬容你們，不願有一人沉淪」（彼後 3:9）——這正接到 5:19--20：等候的日子，是去找走失之人的日子。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。主再來的確定，從來不依靠我們算得準。兩千年的等候，正說明主的忍耐比農夫更長；對我們，「近」最實際的意思是：今天就不要對身邊的人嘆氣。</p><p>算不出日子，並不使盼望變小；它只是把盼望從日曆上搬回生活裡——今天堅固心，今天去找一個走失的人。</p>"]],"con":[],"say":"本講義的立場：5:8「近了」是迫近，叫人今天就堅固心、不埋怨，不是叫人算日子；「秋雨春雨」是農夫的日曆，不是末世聖靈澆灌的時間表。","care":"會眾裡有被末世預言嚇過、或曾經為某個預言的日期變賣家產的人，也有因預言落空而對信仰失望的人。不要在講台上排時間表，也不要嘲笑他們；陪他們看見，主再來的盼望是安慰，不是恐嚇。也有久病的人盼望主快來，請溫柔接住這份盼望。"},{"id":"ISS05_5","t":"5:12「不可起誓」——法庭作證、就職宣誓、婚禮誓詞可以嗎？","r":"5:12；太 5:34--37；來 6:16--17","ch":[5],"why":"5:12 與主耶穌的登山寶訓幾乎逐字相同，而且雅各說這是「最要緊的」。有些傳統（如貴格會、門諾會）因此拒絕一切宣誓；多數教會則允許法庭作證與婚禮誓詞。基督徒在法院、就職、婚禮上該怎麼做，是實際會遇到的問題。","pos":[["【一】經文問的是甚麼","","<p>「我的弟兄們，最要緊的是不可起誓；不可指著天起誓，也不可指著地起誓，無論何誓都不可起。你們說話，是，就說是；不是，就說不是，免得你們落在審判之下」（5:12）。主耶穌也說「你們的話，是，就說是；不是，就說不是」（太 5:37）。問題是：「無論何誓」是包括一切宣誓，還是指日常用來加強自己話語的發誓？</p>"],["全面禁止說","","<p>重洗派、門諾會、貴格會等傳統照字面持守：基督徒在任何場合都不起誓，法庭上改用「鄭重聲明」。他們認為「無論何誓都不可起」已經說得很清楚，基督徒的每一句話都應當同樣真實，不需要分出「發過誓的」和「沒發誓的」兩種話。</p><p><strong>難處：</strong>神自己也起誓（來 6:17），保羅多次呼求神作見證（羅 1:9）；主耶穌在大祭司面前被要求起誓時也作了回答。全面禁止較難解釋這些經文。</p>"],["禁止日常濫誓說","","<p>多數教會傳統（包括改教家）認為，雅各與主耶穌禁止的是用起誓加強自己的話——日常交談裡「指著天」「我發誓」，好像不發誓的話就可以不算數；而在法庭、就職、婚禮這些由政府或群體要求的正式場合，鄭重地在神面前許諾，並不違反這節經文。</p><p><strong>難處：</strong>這一讀若講得太輕，容易讓 5:12 變成「只是不要亂發誓」，失去雅各要的那種「說話本身就可信」的誠實。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採第二說：5:12 禁止的是用起誓加強自己的話；法庭作證、就職宣誓、婚禮誓詞不在禁止之內，但尊重持守不起誓的弟兄姊妹。</strong>經文鑑別上，和合本「免得你們落在審判之下」照 SBLGNT ὑπὸ κρίσιν；另一抄本傳統作「落在假冒為善裡」，兩讀都說出同一件事：靠誓言撐起來的話，本身已經不夠真。本講義的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩派都同意最要緊的事：讓你的「是」就是「是」。比起法庭上怎麼宣誓，更常考驗我們的是群組裡的一句「我會到」、合約上的一個簽名。</p><p>一個人的話若平常就可信，他在法庭上宣誓或不宣誓，都只是把平常的誠實再說一次；這才是雅各「最要緊的」那件事。</p>"]],"con":[],"say":"本講義的立場：5:12 禁止的是用起誓加強自己的話；法庭作證、就職宣誓、婚禮誓詞不在禁止之內，但尊重持守不起誓的肢體。本講義的全卷立場見 ISS00_5。","care":"會眾裡可能有來自不起誓傳統、在法庭或職場上因此被誤解的人，也有在婚禮上許了誓、後來婚姻破碎而覺得「我違背了誓言」的人。不要嘲笑前者，也不要用 5:12 再壓後者；陪後者看見，神的憐憫比我們守不住的誓言更
