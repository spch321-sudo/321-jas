tanoounti） 是現在分詞，「仔細端詳」；1:24 卻一連三個動作，κατενόησεν（不定過去，看了）、ἀπελήλυθεν（完成式，走了，而且沒有回來）、ἐπελάθετο（不定過去，忘了）。τὸ πρόσωπον τῆς γενέσεως αὐτοῦ（to prosōpon tēs geneseōs autou） 字面是「他出生時的臉」，就是本來的樣子。</p>","exp":"<p>〔太〕太 7:24--27（馬太講義第 7 章）</p><p>「只是你們要行道，不要單單聽道，自己欺哄自己」（1:22）。這是全卷的鏡子，也是本章的中心。登山寶訓收尾也是這件事：「凡聽見我這話就去行的，好比一個聰明人，把房子蓋在磐石上」（太 7:24）。本系列馬太講義第 7 章講過兩種房子；雅各換了一個更日常的畫面：照鏡子。</p><p>古代的鏡子是磨亮的銅片，照出來的臉有點模糊，要湊近看。一個人「對著鏡子看自己本來的面目」（1:23），看得很仔細；然後「看見，走後，隨即忘了他的相貌如何」（1:24）。臉上沾了東西，他看見了，卻沒有擦，走出門就忘了。</p><p>聽道就是照鏡子。主日聽到一句話，心裡一亮：「這就是我。」可是散會、吃飯、開車回家，到了星期一，那張臉已經不記得了。<strong>321 改變觀念的八大步驟，最常斷在「實踐」之前。</strong>資訊有了，啟示也有了，甚至點頭信服了，就是沒有走到「實踐」。</p><p>雅各說這叫「自己欺哄自己」。聽了很多，以為自己很屬靈；筆記很厚，以為生命很深。那是一本算錯的帳。聽道本身不是目的，就像照鏡子不是為了欣賞鏡子。</p><p>但雅各不是叫人少聽。他是叫人聽完不要走開。</p>"},{"a":25,"z":25,"star":3,"grk":"<p lang=\"grc\">ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.</p>","lit":"<p>但那彎下腰細看那屬自由的完全律法、並且留在那裡的，他不是成為健忘的聽者，而是工作的行者，這人必在他的行裡是有福的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>παρακύψας</td><td>parakypsas</td><td>彎下腰細看</td><td>約 20:5 同字：門徒彎腰看空墳</td></tr><tr><td>εἰς νόμον τέλειον</td><td>eis nomon teleion</td><td>完全的律法</td><td>τέλειος 接 1:4、1:17</td></tr><tr><td>τὸν τῆς ἐλευθερίας</td><td>ton tēs eleutherias</td><td>屬自由的</td><td>和合本補「使人」</td></tr><tr><td>παραμείνας</td><td>parameinas</td><td>並且留在那裡</td><td>不走開：對照 1:24</td></tr><tr><td>ἀκροατὴς ἐπιλησμονῆς</td><td>akroatēs epilēsmonēs</td><td>健忘的聽者</td><td>屬格：以忘記為特徵的聽者</td></tr><tr><td>ποιητὴς ἔργου</td><td>poiētēs ergou</td><td>工作的行者</td><td>追蹤：ἔργον 第二站</td></tr><tr><td>ἐν τῇ ποιήσει αὐτοῦ</td><td>en tē poiēsei autou</td><td>在他的行裡</td><td>福在行的過程中</td></tr></table>","gram":"<p><strong>παρακύψας（parakypsas） 是「彎下腰去看」。</strong>約 20:5 門徒到空墳前「低頭往裡看」（約 20:5），用的就是這個字；彼前 1:12「天使也願意詳細察看這些事」（彼前 1:12）也是它。和合本譯「詳細察看」，抓住了專注；原文還多一個身體的動作：把腰彎下來。接著 παραμείνας（parameinas）「留在旁邊」，與 1:24 ἀπελήλυθεν（apelēlythen）「走開了」正好相反。</p><p><strong>「使人自由」的「使人」是和合本的小字補充。</strong>原文是 νόμον τέλειον τὸν τῆς ἐλευθερίας（nomon teleion ton tēs eleutherias），「那屬自由的完全律法」，屬格只說律法和自由連在一起，沒有說是誰使誰自由。和合本把它解釋為「使人」自由（2:12 同樣補了「使人」），是一個合理的譯法：這律法不是鎖鏈，是叫人得自由的道。</p><blockquote><p>ἀκροατὴς ἐπιλησμονῆς（akroatēs epilēsmonēs） 是性質屬格，「以忘記為特徵的聽者」；ποιητὴς ἔργου（poiētēs ergou） 是「工作的行者」。ἔργον（ergon） 在本章第二次出現（第一次在 1:4），預告第 2 章的 ἔργα（erga）。</p></blockquote>","exp":"<p>同一面鏡子，兩種人。第一種看了就走；第二種，「惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福」（1:25）。</p><p>「詳細察看」，原文是彎下腰去看。那個早晨，門徒跑到空墳前，彎下腰往裡看，看見細麻布還放在那裡。那一彎腰，他們的世界翻轉了。<strong>讀經就是彎下腰。</strong>站著瞄一眼，看見的是字；彎下腰，看見的是自己，也看見那位復活的主。</p><p>「並且時常如此」：彎下腰之後不走開，留在那裡。1:24 的人「走後」，1:25 的人留下。這是八大步驟的「檢討」：一次又一次回到鏡子前。聖經是我的準則，不是因為讀過，是因為一直留在它面前。</p><p>這律法為甚麼是「使人自由」的？摩西的律法在石版上，從外面要求人；雅各說的是 1:21 那「所栽種的道」，是神用真道生了我們之後，栽進裡面的生命。外面的規條叫人怕；裡面的生命叫人自由。像一位鋼琴家照樂譜彈琴，樂譜不是他的監獄，是他的自由。</p><p>福在哪裡？「在他所行的事上」。不是行完以後才發獎金，是在行的過程中就得福。一個人照著道饒恕了人，饒恕的那一刻，他自己先得了自由。</p><p>雅各在這裡說「行出來」，不是說人靠行為得救——他剛說過神「用真道生了我們」（1:18）。他說的是：生命若是真的，就會動。第 2 章會把這件事講透。</p><p>一個彎下腰的人，姿勢本身就是謙卑。站著的人評論經文，彎下腰的人被經文看見。</p>"},{"a":26,"z":27,"star":2,"grk":"<p lang=\"grc\">Εἴ τις δοκεῖ θρησκὸς εἶναι μὴ χαλιναγωγῶν γλῶσσαν αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν αὐτοῦ τούτου μάταιος ἡ θρησκεία.</p><p lang=\"grc\">θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.</p>","lit":"<p>若有人以為自己是虔誠的，卻不勒住他的舌頭，反而欺騙他的心，這人的虔誠是空的。</p><p>在神和父面前清潔且沒有玷污的虔誠是這個：在孤兒和寡婦的患難中探望他們，保守自己不被世界沾上斑點。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>θρησκὸς</td><td>thrēskos</td><td>虔誠的</td><td>新約僅此一次：外面看得見的敬虔</td></tr><tr><td>μὴ χαλιναγωγῶν γλῶσσαν</td><td>mē chalinagōgōn glōssan</td><td>不勒住舌頭</td><td>馬嚼環的字，3:2--3 再出現</td></tr><tr><td>μάταιος</td><td>mataios</td><td>空的</td><td>沒有結果</td></tr><tr><td>καθαρὰ καὶ ἀμίαντος</td><td>kathara kai amiantos</td><td>清潔且沒有玷污</td><td>敬拜的語言</td></tr><tr><td>ἐπισκέπτεσθαι</td><td>episkeptesthai</td><td>看顧、探望</td><td>太 25:36 同根：去探訪</td></tr><tr><td>ἄσπιλον</td><td>aspilon</td><td>沒有斑點</td><td>不被世界沾上</td></tr></table>","gram":"<p>θρησκός（thrēskos） 與 θρησκεία（thrēskeia） 講的是外面看得見的宗教行為：禱告、禁食、守節、聚會。θρησκός（thrēskos） 新約僅此一次。雅各不否定這些，他問它們是不是空的。</p><p>χαλιναγωγῶν（chalinagōgōn） 由「嚼環」和「引導」組成，是勒馬的字；3:2 會說能勒住舌頭的人「也能勒住自己的全身」，同一個字。1:27 的定義句有兩個不定詞並列：ἐπισκέπτεσθαι（episkeptesthai） 與 τηρεῖν（tērein）。一個往外走（去探望），一個往內守（保守自己）。兩個要一起，不能只取一個。ἐπισκέπτεσθαι（episkeptesthai） 是醫生探病、牧人巡羊的字（太 25:36 同根），名詞形是「監督」。</p>","exp":"<p>「若有人自以為虔誠，卻不勒住他的舌頭，反欺哄自己的心，這人的虔誠是虛的」（1:26）。一個人聚會從不缺席，可是在群組裡一句話就能傷透一個人的心。雅各說：那份虔誠是空的。</p><p>勒住舌頭是勒馬，不是割掉馬的舌頭。<strong>勒住舌頭不是叫受害者閉嘴</strong>，也不是叫提問的人、指出問題的同工不准開口。被勒住的是任性、刻薄、論斷人的話；需要說的真話，仍然要在溫柔裡說出來。第 3 章會細講。</p><p>那清潔的虔誠是甚麼樣子？「就是看顧在患難中的孤兒寡婦，並且保守自己不沾染世俗」（1:27）。在古代，孤兒寡婦是最沒有聲音的人，沒有人替他們說話。舊約說神「為孤兒寡婦伸冤」（申 10:18）。主耶穌說：「我病了，你們看顧我」（太 25:36）。看顧，就是去探望、去走一趟。</p><p>注意次序：先走出去看顧人，再保守自己不沾染世俗。<strong>不沾染世俗不是與世隔離。</strong>雅各心中最乾淨的人，不是躲在教會裡最安全的人，是走進患難的家、自己卻沒有被世界的價值染色的人。像一位醫生走進病房，不是不碰病人，是洗淨了手再去碰。</p><p>這是建立屬神的體系最初的樣子：一個群體怎樣對待它最弱的人，就是它的虔誠。散住的信徒自己也窮，雅各仍然叫他們去看顧更窮的人。</p><p>本章從「心懷二意」走到「清潔沒有玷污」：一顆兩半的心，在鏡子前彎下腰，被從上頭來的道重新生出來，最後長出一雙去看顧人的手。</p>"}],"2":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;</p>","lit":"<p>我的弟兄們，不要在種種看人的臉當中，持守我們榮耀的主耶穌基督的信心。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>προσωπολημψίαις</td><td>prosōpolēmpsiais</td><td>種種看人的臉</td><td>複數：偏心有很多種樣子</td></tr><tr><td>μὴ……ἔχετε</td><td>mē……echete</td><td>不要持守</td><td>現在式命令：不要一面信、一面看臉</td></tr><tr><td>τὴν πίστιν τοῦ κυρίου</td><td>tēn pistin tou kyriou</td><td>主的信心</td><td>信奉主；本章「信心」第一次出場</td></tr><tr><td>τῆς δόξης</td><td>tēs doxēs</td><td>榮耀的</td><td>放在句尾：整句的重音</td></tr></table>","gram":"<p><strong>2:1 一開口就是一個複合字：προσωπολημψίαις（prosōpolēmpsiais）。</strong>πρόσωπον（臉）加 λαμβάνω（拿、取），照字面是「取人的臉」——看見一張臉，就按那張臉定價。這個字源自七十士譯本「看人的情面」的希伯來片語，新約只在保羅與雅各筆下出現；這裡是複數，偏心不只一種。</p><p>μὴ（mē） 加現在式 ἔχετε（echete） 是命令，不是問句（SBLGNT 句末標問號，多數譯本讀成命令）。受詞 τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ（tēn pistin tou kyriou hēmōn Iēsou Christou） 的屬格可讀成「對主的信」，也可讀成「主的那個信仰」；和合本「信奉」取前者。全句最後一個字是 τῆς δόξης（tēs doxēs），「榮耀的」——修飾整個名號，像一盞燈掛在句尾。全卷只有 1:1 與 2:1 兩次提到耶穌的名字，第二次就加上「榮耀」。</p>","exp":"<p>這一章從一個門口開始。第 1 章末了，雅各說真正的虔誠是「看顧在患難中的孤兒寡婦」（1:27）；第 2 章馬上把鏡頭推到聚會的入口，看一看這份虔誠在門口過不過得了關。「行」這一篇，從一雙眼睛開始，還沒有說到手。</p><p>「你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人。」（2:1）兩件事被放在同一句裡：一邊是信，一邊是看臉。雅各說這兩樣不能同時拿在手上。理由就在句尾那個字：榮耀。猶太人說「榮耀」，想到的是神在會幕、在聖殿裡的同在（這使我們想起出 40:34）。如果這一位榮耀的主就在你們中間，那麼在他面前，誰手上的戒指還算得了甚麼？太陽升起的時候，沒有人會去比較誰手裡的蠟燭比較亮。</p><p>所以偏心不只是禮貌問題，是視線問題。眼睛盯著金戒指的人，其實已經把主的榮耀擠出了視線。雅各沒有先說「你們要愛窮人」，他先說「你們信的是誰」：一個人怎樣看人，暴露他心裡怎樣看主。</p><p>這也是本章「信心」第一次出場。第 2 章後半要問「沒有行為的信心」，這裡先問「看人的臉的信心」——兩個問題其實是同一個：信心有沒有改變我的眼睛和我的手。321 說「焦點在耶穌」，最先落在這裡：焦點在榮耀的主，就不會盯著金戒指。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">ἐὰν γὰρ εἰσέλθῃ εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,</p><p lang=\"grc\">ἐπιβλέψητε δὲ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ εἴπητε Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ἢ κάθου ἐκεῖ ὑπὸ τὸ ὑποπόδιόν μου,</p>","lit":"<p>因為若有一個戴金戒指、穿著光鮮衣服的人，進入你們的會堂；又有一個窮人，穿著骯髒的衣服，也進來；</p><p>你們就注目看那穿光鮮衣服的人，說：「你好好地坐在這裡」；又對那窮人說：「你站著」，或「坐在那裡，在我的腳凳下」；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰς συναγωγὴν ὑμῶν</td><td>eis synagōgēn hymōn</td><td>進你們的會堂</td><td>新約唯一稱基督徒聚會為會堂</td></tr><tr><td>χρυσοδακτύλιος</td><td>chrysodaktylios</td><td>金手指的</td><td>新約僅此一次</td></tr><tr><td>ἐν ἐσθῆτι λαμπρᾷ</td><td>en esthēti lampra</td><td>穿光鮮的衣服</td><td>λαμπρός：發亮的、華美的</td></tr><tr><td>ἐν ῥυπαρᾷ ἐσθῆτι</td><td>en rhypara esthēti</td><td>穿骯髒的衣服</td><td>同一個「衣服」，兩種形容</td></tr><tr><td>ἐπιβλέψητε</td><td>epiblepsēte</td><td>注目看</td><td>眼睛停在誰身上</td></tr><tr><td>Σὺ κάθου ὧδε καλῶς</td><td>Sy kathou hōde kalōs</td><td>你好好地坐在這裡</td><td>καλῶς：舒舒服服</td></tr></table>","gram":"<p><strong>2:2--4 是一個長條件句：ἐὰν γὰρ εἰσέλθῃ（ean gar eiselthē）……οὐ διεκρίθητε（ou diekrithēte）；</strong>假設語氣的「若」，雅各描寫的是一個可能發生、而且常常發生的場面，不一定是某一次事件。</p><p>兩個人的描寫刻意對稱：ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ（anēr chrysodaktylios en esthēti lampra） 對 πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι（ptōchos en rhypara esthēti）。χρυσοδακτύλιος（chrysodaktylios） 新約只出現這一次，照字面是「金手指的人」；羅馬社會裡戴金戒指是騎士階級與富人的記號。λαμπρᾷ（lampra） 是「發亮的」，ῥυπαρᾷ（rhypara） 是「有污垢的」——一個亮、一個髒，衣服就把人分好了。</p><blockquote><p>εἰς συναγωγὴν ὑμῶν（eis synagōgēn hymōn）：新約唯一一次把基督徒的聚會稱為「會堂」，符合 1:1 寫給「散住十二個支派之人」的猶太信徒處境。2:3 的分法有兩種版本：SBLGNT 作 Σὺ στῆθι ἢ κάθου ἐκεῖ ὑπὸ τὸ ὑποπόδιόν μου（你站著，或坐在那裡、在我腳凳下）；另有抄本把 ἐκεῖ（ekei） 放在 στῆθι（stēthi） 後面，成為「你站在那裡，或坐在我腳凳下」，和合本照這個分法。兩種分法意思一樣：好位子給金戒指，地板給窮人。</p></blockquote>","exp":"<p>雅各像一位記者，把鏡頭架在聚會的門口。「若有一個人帶著金戒指，穿著華美衣服，進你們的會堂去」（2:2），「又有一個窮人穿著骯髒衣服也進去」（2:2）。兩個人同時跨進同一道門，接下來的幾秒鐘，就是這一段要照的鏡子。</p><p>「你們就重看那穿華美衣服的人」（2:3）。ἐπιβλέψητε（epiblepsēte） 是眼睛停下來、特別去看。接著是兩句話：對一個人說「請坐在這好位上」（2:3），對另一個說「你站在那裡」（2:3），或「坐在我腳凳下邊」（2:3）。腳凳是給腳放的地方；叫一個人坐在那裡，等於告訴他：你的位置在別人的腳下面。最刺耳的是那個「我」：「我的腳凳」。在神的會堂裡，接待的人竟然有自己的腳凳。</p><p>雅各沒有說這兩個人是誰，信不信主，也沒說戒指是怎麼來的。他只看接待的人怎麼分配位子。這一段的對象是教會自己，不是外面的有錢人。今天的教會很少有人說「坐在我腳凳下」，可是位子還是會被分配：前排留給奉獻多的、主日報告點名有頭銜的、事奉安排給學歷高的、口音像本地人的。今天穿著骯髒衣服走進來的，可能是剛下夜班的看護、工地下班的移工，身上的污漬是勞動留下的。雅各問的不是他們乾不乾淨，是我們的眼睛先落在誰身上。</p>"},{"a":4,"z":4,"star":1,"grk":"<p lang=\"grc\">οὐ διεκρίθητε ἐν ἑαυτοῖς καὶ ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν;</p>","lit":"<p>你們豈不是在自己裡面分裂了，並且成了帶著惡念的審判官嗎？</p>","key":"","gram":"<p><strong>2:4 是一個期待肯定答案的問句：οὐ διεκρίθητε（ou diekrithēte）。</strong>οὐ（ou） 開頭的問句等著聽眾說「是的」。διεκρίθητε（diekrithēte） 是 διακρίνω（diakrinō） 的被動不定過去式，有兩個可能的意思：「你們在自己中間作了區分」，或「你們在自己裡面分裂了」。雅各在 1:6 用同一個字說疑惑的人（ὁ γὰρ διακρινόμενος（ho gar diakrinomenos）），所以多數註釋認為這裡帶著雙重意思：門口的區分，出於裡面的分裂。</p><p>下半句 ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν（egenesthe kritai dialogismōn ponērōn），「成了帶著惡念的審判官」。κριταὶ（kritai） 是「審判」追蹤在本章的第一站；接下來 2:12--13 還要說到審判。</p>","exp":"<p>「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）這是全卷地勢的一處低谷。低，不是因為事情很大，是因為它就發生在聚會的門口，而且做的人自己往往不覺得。</p><p>雅各給這件事兩個名字。第一個是「偏心」，原文是在自己裡面分開了。第 1 章說心懷二意的人像海浪；在這裡，那顆兩半的心走到了門口：一半說信榮耀的主，一半盯著金戒指。心裡的分裂，到了門口就變成座位的分配。</p><p>第二個名字更重：「審判官」。接待員本來只是帶位的人，卻在幾秒鐘之內坐上了審判台，憑一件衣服判定一個人的價值。這是本章「審判」一條線的起點：人在門口作審判官，到 2:13 就要面對真正的審判。</p><p>講這一節，教會要先照自己，不要先照社會。被照到的往往不是存心作惡的人，而是很自然、很「得體」地安排座位的人。這面鏡子要照的，就是那份自然。</p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς τῷ κόσμῳ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;</p>","lit":"<p>請聽，我親愛的弟兄們：神豈不是揀選了那些在世人眼中貧窮的人，在信心裡富足，並且作他所應許給那些愛他之人的國的承受者嗎？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀκούσατε</td><td>akousate</td><td>請聽</td><td>不定過去命令：停下來聽</td></tr><tr><td>ἐξελέξατο</td><td>exelexato</td><td>揀選了</td><td>主詞是神</td></tr><tr><td>τοὺς πτωχοὺς τῷ κόσμῳ</td><td>tous ptōchous tō kosmō</td><td>在世界看來貧窮的</td><td>間接受格：從世界的角度</td></tr><tr><td>πλουσίους ἐν πίστει</td><td>plousious en pistei</td><td>在信上富足</td><td>一節之內窮富交換</td></tr><tr><td>κληρονόμους τῆς βασιλείας</td><td>klēronomous tēs basileias</td><td>國的承受者</td><td>國屬於窮人</td></tr></table>","gram":"<p><strong>2:5 以命令開頭：ἀκούσατε（akousate）, ἀδελφοί μου ἀγαπητοί（adelphoi mou agapētoi）。</strong>不定過去式命令，像老師敲敲桌子：「聽好。」責備之後，雅各加上「親愛的」，他的口氣嚴厲，關係卻沒有斷。</p><p>接著又是一個期待肯定答案的問句，οὐχ ὁ θεὸς ἐξελέξατο（ouch ho theos exelexato）。τοὺς πτωχοὺς τῷ κόσμῳ（tous ptōchous tō kosmō） 的 τῷ κόσμῳ（tō kosmō） 是間接受格，可讀成「在世界的眼光裡」貧窮；和 πλουσίους ἐν πίστει（plousious en pistei） 形成對照：在世界眼中窮，在信心裡富。這是本卷「貧富」追蹤的一個轉折：一節之內，窮和富交換了位置。</p><p>κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν（klēronomous tēs basileias hēs epēngeilato tois agapōsin auton） 和 1:12「應許給那些愛他之人的」用同一個說法，冠冕和國都給「愛他的人」。</p>","exp":"<p>「神豈不是揀選了世上的貧窮人，叫他們在信上富足，並承受他所應許給那些愛他之人的國嗎？」（2:5）雅各沒有直接批評接待的人，他把話題拉到神身上：你們把窮人安排到腳凳下，神卻把他們揀選出來。</p><p>這使我們想起主耶穌的話：「你們貧窮的人有福了！因為神的國是你們的。」（路 6:20）馬太記為「虛心的人有福了」（太 5:3），本系列馬太講義第 5 章已經講過。雅各沒有說「主說過」，他把哥哥的話活成了自己的話。最早跟隨耶穌、最早組成耶路撒冷教會的，多半是漁夫、工人、寡婦；散住各地的受信人，也多半在做工度日。</p><p>要小心讀這一節。「揀選了世上的貧窮人」不是說貧窮本身是美德，也不是說有錢人不能得救。這節的重點在交換：神不照世界的價目表算人的價值。世界看銀行戶頭，神看「在信上富足」；世界讓富人坐前排，神把國交給愛他的人。</p><p>321 說「改變觀念・觀點」：從人的觀點換到神的觀點。坐在門口分位子的人，如果先「請聽」這一句，眼睛就會換一副。被安排在腳凳下的人，也要聽見這一句：在神的帳本上，你是承受國的人。</p>"},{"a":6,"z":7,"star":2,"grk":"<p lang=\"grc\">ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;</p><p lang=\"grc\">οὐκ αὐτοὶ βλασφημοῦσιν τὸ καλὸν ὄνομα τὸ ἐπικληθὲν ἐφʼ ὑμᾶς;</p>","lit":"<p>你們卻羞辱了那窮人。豈不是那些富足的人轄制你們，並且是他們親自拖你們到法庭去嗎？</p><p>豈不是他們親自褻瀆那被呼叫在你們身上的美好的名嗎？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἠτιμάσατε</td><td>ētimasate</td><td>羞辱了</td><td>奪去尊榮（τιμή）</td></tr><tr><td>καταδυναστεύουσιν</td><td>katadynasteuousin</td><td>轄制、欺壓</td><td>用權勢壓下去</td></tr><tr><td>ἕλκουσιν</td><td>helkousin</td><td>拖、拉</td><td>拉到法庭</td></tr><tr><td>τὸ ἐπικληθὲν ἐφʼ ὑμᾶς</td><td>to epiklēthen eph' hymas</td><td>被呼叫在你們身上的</td><td>和合本註腳：或譯被稱</td></tr></table>","gram":"<p><strong>2:6 的 ὑμεῖς δὲ（hymeis de） 放在句首：「你們卻」</strong>——神揀選了窮人，「你們」卻 ἠτιμάσατε τὸν πτωχόν（ētimasate ton ptōchon），不定過去式，指 2:2--3 門口那一幕。接著連用兩個 οὐχ（ouch）／οὐκ（ouk） 開頭的問句（2:6b、2:7），都期待「是的」的回答。</p><blockquote><p>2:7 的 τὸ καλὸν ὄνομα τὸ ἐπικληθὲν ἐφʼ ὑμᾶς（to kalon onoma to epiklēthen eph' hymas），和合本譯「你們所敬奉的尊名」，並有註腳：「所敬奉」或譯「被稱」。ἐπικληθὲν（epiklēthen） 是 ἐπικαλέω（epikaleō） 的被動分詞，照字面是「那被呼叫在你們身上的美名」。這是舊約的說法：一個名字被呼叫在某物身上，表示它屬於那個名字的主人（這使我們想起申 28:10「歸在耶和華的名下」）。雅各在耶路撒冷會議上引用摩 9:12 也用同一個說法：「就是凡稱為我名下的外邦人」（徒 15:17）。多數註釋認為指受洗時呼叫在信徒身上的主耶穌的名。</p></blockquote>","exp":"<p>雅各的論證轉了一個彎：「你們反倒羞辱貧窮人。那富足人豈不是欺壓你們、拉你們到公堂去嗎？」（2:6）你們討好的那群人，正是在外面壓你們的人。散住各地的信徒多半是佃農、日工、小手藝人，欠債、租地、工錢的糾紛，常常被有權勢的人拉到法庭上；5:4 還要說到工錢被扣住。在會堂門口給金戒指讓座，像是把自己的處境忘了。</p><p>雅各在這裡說的是當時欺壓人的富人群體，不是每一個有錢人。本卷不把財富本身當作罪，第 5 章點名的也是欠薪、奢華、欺壓。這一節要我們看見的是：偏心不只不公道，也很糊塗。</p><p>最深的一句在 2:7：「他們不是褻瀆你們所敬奉的尊名嗎？」（2:7）照原文，那是「被呼叫在你們身上的名」。受洗那一天，主的名被呼叫在你身上，你從此屬於他。欺壓你們的人，褻瀆的是你們身上的名字。換句話說，那位穿骯髒衣服進門的弟兄，身上也有這個名字。把他趕到腳凳下的時候，被羞辱的不只是他。</p><p>名字被呼叫在身上，就像婚禮上新娘冠了夫姓。從此人怎樣對待她，就是怎樣對待那個家。這是本段的結論：教會門口怎樣待人，就是教會怎樣待那名。</p>"},{"a":8,"z":9,"star":3,"grk":"<p lang=\"grc\">Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·</p><p lang=\"grc\">εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.</p>","lit":"<p>然而你們若照著經上的話：「你要愛你的鄰舍如同你自己」，成全那屬王的律法，你們就做得好；</p><p>但你們若看人的臉，你們就是在做罪，被律法定為違犯者。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>νόμον τελεῖτε βασιλικὸν</td><td>nomon teleite basilikon</td><td>成全屬王的律法</td><td>βασιλικός：屬王的、王家的</td></tr><tr><td>Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν</td><td>Agapēseis ton plēsion sou hōs seauton</td><td>要愛你的鄰舍如同自己</td><td>引利 19:18</td></tr><tr><td>καλῶς ποιεῖτε</td><td>kalōs poieite</td><td>做得好</td><td>2:19 再出現一次</td></tr><tr><td>προσωπολημπτεῖτε</td><td>prosōpolēmpteite</td><td>看人的臉</td><td>動詞形；新約僅此一次</td></tr><tr><td>ἁμαρτίαν ἐργάζεσθε</td><td>hamartian ergazesthe</td><td>做罪</td><td>ἐργάζομαι：偏心也是一種「工作」</td></tr><tr><td>παραβάται</td><td>parabatai</td><td>越界者</td><td>跨過了線的人</td></tr></table>","gram":"<p><strong>2:8 用 Εἰ μέντοι（Ei mentoi） 開頭，「然而若」</strong>——雅各預料有人會辯解：我們只是在愛人呀，對來賓好有甚麼錯？他回答：若你們真的照經上的話成全這律法，καλῶς ποιεῖτε（kalōs poieite）；但 2:9 εἰ δὲ προσωπολημπτεῖτε（ei de prosōpolēmpteite），若看人的臉，那就是另一回事。兩個「若」並排，一好一壞。</p><p>νόμον（nomon）……βασιλικὸν（basilikon） 的 βασιλικός（basilikos） 是「屬王的」。三種讀法：①愛人如己是律法中最高的一條，如同律法之王；②這是王（神或基督）所頒布的律法；③這是屬於「國」（2:5 τῆς βασιλείας（tēs basileias））的律法，國的承受者要照這律法生活。2:5 剛說到「國」，2:8 就說「屬王的」，第三種讀法與上下文接得最緊，也不排斥前兩種。</p><p>2:9 的 ἁμαρτίαν ἐργάζεσθε（hamartian ergazesthe），照字面是「你們在做罪」；ἐργάζομαι（ergazomai） 和本章後半的 ἔργα（erga） 同一字根。偏心也是一種「行為」，只是方向錯了。</p>","exp":"<p>〔舊約〕利 19:18（利未記講義第 19 章）</p><p>「經上記著說：『要愛人如己。』你們若全守這至尊的律法才是好的。」（2:8）雅各引的是利 19:18「卻要愛人如己」（利 19:18）。本系列利未記講義第 19 章講過，這一句不是孤零零的格言，它嵌在一整章具體的命令裡：不可剋扣工價、不可欺負聾子瞎子、不可在審判上行不義。同一章 19:15 就說「不可偏護窮人，也不可重看有勢力的人」（利 19:15）。雅各從利未記第 19 章拿出這兩條，正好對準會堂門口的事。</p><p>雅各給這條律法一個名字：「至尊的」，原文是屬王的。主耶穌把它列為最大誡命的第二條（太 22:39），保羅說所有誡命「都包在愛人如己這一句話之內了」（羅 13:9）。雅各補上一筆：它是屬王的律法。國的承受者，照王的方式看人；王怎樣看那穿骯髒衣服的人，國民就怎樣看他。321 說「讓耶穌作王」，在這裡最具體：讓王的律法決定誰坐哪裡。</p><p>然後是 2:9 一記重錘：「但你們若按外貌待人，便是犯罪，被律法定為犯法的。」（2:9）許多人覺得偏心只是待客不周、人情世故。雅各用的字是「罪」，而且是越過界線的罪。同一部律法，一面說要愛人如己，一面就判定按外貌待人的人違法。不能一邊引用愛人如己來辯護，一邊把人送到腳凳下。</p><p>這一段要讓教會停下來想：我們有沒有一套沒寫出來的座位表？誰的意見比較被聽見，誰的孩子比較被注意，誰的喪事來的人比較多？這些往往不是有人故意安排，是眼睛自己作的決定。至尊的律法要照的正是這些地方。</p>"},{"a":10,"z":11,"star":1,"grk":"<p lang=\"grc\">ὅστις γὰρ ὅλον τὸν νόμον τηρήσῃ, πταίσῃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.</p><p lang=\"grc\">ὁ γὰρ εἰπών· Μὴ μοιχεύσῃς εἶπεν καί· Μὴ φονεύσῃς εἰ δὲ οὐ μοιχεύεις φονεύεις δέ, γέγονας παραβάτης νόμου.</p>","lit":"<p>因為凡遵守全律法，卻在一條上跌倒的，他就成了眾條都有罪的。</p><p>因為那說了「不可姦淫」的，也說了「不可殺人」；你若不姦淫，卻殺人，你就成了律法的違犯者。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὅλον τὸν νόμον</td><td>holon ton nomon</td><td>全律法</td><td>律法是一整件</td></tr><tr><td>πταίσῃ δὲ ἐν ἑνί</td><td>ptaisē de en heni</td><td>卻在一條上跌倒</td><td>πταίω：絆腳</td></tr><tr><td>πάντων ἔνοχος</td><td>pantōn enochos</td><td>眾條都有罪</td><td>對整部律法負責</td></tr><tr><td>γέγονας παραβάτης νόμου</td><td>gegonas parabatēs nomou</td><td>你成了律法的違犯者</td><td>完成式：身分已經定了</td></tr></table>","gram":"<p><strong>2:10 的 γὰρ（gar） 解釋 2:9 為甚麼偏心就是「犯法」。</strong>ὅστις（hostis）……τηρήσῃ（tērēsē）, πταίσῃ δὲ ἐν ἑνί（ptaisē de en heni） 是兩個假設語氣並列：「遵守了全部，卻在一條上絆倒」。主句 γέγονεν πάντων ἔνοχος（gegonen pantōn enochos），完成式，「他就成了眾條都有罪」。</p><p>2:11 再用一個 γὰρ（gar） 給理由：ὁ γὰρ εἰπών（ho gar eipōn），「那說話的」是同一位。引的是十誡第七、第六條（出 20:13--14），次序照七十士譯本，先姦淫後殺人。條件句 εἰ δὲ οὐ μοιχεύεις φονεύεις δέ（ei de ou moicheueis phoneueis de），用的是現在直說語氣，雅各當成一個真實可能的情形來說。</p>","exp":"<p>「因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條。」（2:10）這句話常被誤會成「所有的罪都一樣大」。雅各要說的不是罪的大小，是律法的整全：律法不是一堆題目，可以挑會寫的做；它是一整件衣服，撕破一處，衣服就破了。</p><p>理由在 2:11：說「不可姦淫」的，和說「不可殺人」的，是同一位。人違背律法，不只是錯了一條規定，是得罪了頒布律法的那一位。「你就是不姦淫，卻殺人，仍是成了犯律法的。」（2:11）十誡的兩條放在一起，本系列出埃及記講義第 20 章已經講過。</p><p>放回上下文就清楚了：會堂門口的人大概覺得自己守了大部分的律法，沒有偷、沒有殺、沒有姦淫，只是「安排座位」而已。雅各說：偏心也是那一位頒布的律法，你在這一條上跌倒，就站在違法者的位子上。沒有人能拿守了九條去抵銷第十條。</p><p>這段話使驕傲站不住，也把每一個人帶到同一個位置上：需要憐憫。這正是下一段要說的。</p>"},{"a":12,"z":13,"star":3,"grk":"<p lang=\"grc\">οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.</p><p lang=\"grc\">ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος κατακαυχᾶται ἔλεος κρίσεως.</p>","lit":"<p>你們要這樣說話，也要這樣行事，像那將要藉著自由的律法受審判的人。</p><p>因為審判對那不行憐憫的人是沒有憐憫的；憐憫向審判誇勝。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε</td><td>houtōs laleite kai houtōs poieite</td><td>要這樣說話，也要這樣行事</td><td>現在式命令：口與手</td></tr><tr><td>διὰ νόμου ἐλευθερίας</td><td>dia nomou eleutherias</td><td>藉著自由的律法</td><td>和合本加小字「使人」</td></tr><tr><td>ἀνέλεος</td><td>aneleos</td><td>沒有憐憫的</td><td>新約僅此一次</td></tr><tr><td>κατακαυχᾶται</td><td>katakauchatai</td><td>向……誇勝</td><td>像勝利者站在對手面前誇口</td></tr><tr><td>ἔλεος κρίσεως</td><td>eleos kriseōs</td><td>憐憫……審判</td><td>兩個名詞對撞</td></tr></table>","gram":"<p><strong>2:12 兩個並列的命令：οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε（houtōs laleite kai houtōs poieite）。</strong>說話與行事，正好預告第 3 章（言）與本章後半（行）。μέλλοντες κρίνεσθαι（mellontes krinesthai） 是「將要被審判的人」，現在分詞加不定詞，審判確定會來。</p><p>διὰ νόμου ἐλευθερίας（dia nomou eleutherias） 照字面是「藉著自由的律法」，和 1:25 τὸν τῆς ἐλευθερίας（ton tēs eleutherias） 同一個說法。和合本兩處都加了小字「使人」——這是一個解釋：這律法不只「關於自由」，而是「使人」自由。</p><blockquote><p>2:13 是全句沒有動詞的格言，靠字序取勝：ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος（hē gar krisis aneleos tō mē poiēsanti eleos），「審判，對不行憐憫的人，是無憐憫的」；接著不用連接詞，直接一句 κατακαυχᾶται ἔλεος κρίσεως（katakauchatai eleos kriseōs）。ἀνέλεος（aneleos） 新約只此一次；ἔλεος（eleos） 在兩行之內出現三次。κατακαυχᾶται（katakauchatai） 是 καυχάομαι（kauchaomai） 加上介系詞字首 kata-，「壓倒對方地誇口」，3:14 用來說苦毒的人「自誇」。在這裡誇勝的主詞是憐憫。</p></blockquote>","exp":"<p>〔太〕太 5:7（馬太講義第 5 章）</p><p>「你們既然要按使人自由的律法受審判，就該照這律法說話行事。」（2:12）雅各提醒受信人：我們都要站在審判之下，衡量我們的是「使人自由的律法」。這律法使人自由，因為它不是寫在石版上逼人遵守，而是「所栽種的道」，在心裡長出來（1:21）。一個被釋放的人，要照釋放他的那條律法活。</p><p>接著是全章的高峰：「因為那不憐憫人的，也要受無憐憫的審判；憐憫原是向審判誇勝。」（2:13）前半句很嚇人：門口的審判官（2:4）有一天要站在真正的審判台前，量給人的，也要量給自己。這使我們想起主耶穌在登山寶訓說：「憐恤人的人有福了！因為他們必蒙憐恤。」（太 5:7）也想起那個欠一千萬的僕人，主人問他：「你不應當憐恤你的同伴，像我憐恤你嗎？」（太 18:33）</p><p>後半句卻像一道光從雲裡打下來：憐憫向審判誇勝。在法庭上，審判本來有最後的話；但在神的國裡，憐憫站起來，對審判說：這個人我擔保了。這不是說行憐憫的人用自己的善行抵銷了審判，而是說：一個常常憐憫人的人，自己是活在憐憫裡的人。他的憐憫是他領受過憐憫的證據。</p><p>雅各書是一封命令最多的信，但每一章都有一樣「從上頭來的」。第 1 章是美善的恩賜，第 2 章就是這裡的憐憫。全卷最高點在 5:11「主是滿心憐憫，大有慈悲」（5:11），2:13 是通往那裡的第一座山峰。會堂門口的問題，最後的答案不是更嚴的規則，是更多的憐憫。誰記得自己曾經坐在腳凳下被神扶起來，就不會再把別人往腳凳下推。</p>"},{"a":14,"z":14,"star":3,"grk":"<p lang=\"grc\">Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;</p>","lit":"<p>我的弟兄們，若有人說他有信心，卻沒有行為，有甚麼益處呢？那信心能救他嗎？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τί ὄφελος</td><td>Ti ophelos</td><td>有甚麼益處</td><td>2:16 再問一次，把段落框起來</td></tr><tr><td>ἐὰν πίστιν λέγῃ τις ἔχειν</td><td>ean pistin legē tis echein</td><td>若有人說他有信心</td><td>λέγῃ：雅各問的是說出來的信心</td></tr><tr><td>ἔργα δὲ μὴ ἔχῃ</td><td>erga de mē echē</td><td>卻沒有行為</td><td>ἔργα：本章前半剛說過的愛</td></tr><tr><td>μὴ δύναται</td><td>mē dynatai</td><td>豈能？</td><td>μή 期待否定的答案</td></tr><tr><td>ἡ πίστις</td><td>hē pistis</td><td>那信心</td><td>冠詞指回前面「說的」那一種</td></tr><tr><td>σῶσαι</td><td>sōsai</td><td>救</td><td>1:21 道能救你們的靈魂</td></tr></table>","gram":"<p><strong>2:14 是整段的題目，關鍵在一個動詞：λέγῃ（legē）。</strong>雅各沒有直接說這人有信心卻沒有行為，他說 ἐὰν πίστιν λέγῃ τις ἔχειν（ean pistin legē tis echein），「若有人說他有信心」。從 2:14 到 2:26，雅各討論的一直是這種「說出來的」信心。</p><p>第二個問句 μὴ δύναται ἡ πίστις σῶσαι αὐτόν（mē dynatai hē pistis sōsai auton） 用 μή（mē） 開頭，希臘文的修辭問句用 μή（mē） 表示期待否定答案：「那種信心不能救他，對不對？」冠詞 ἡ πίστις（hē pistis） 不是泛指一般的信心，而是回指前面那個「說有」的信心，和合本「這信心」把冠詞譯得很準。</p><p>Τί ὄφελος（Ti ophelos） 在 2:14 開頭、2:16 結尾各出現一次，把 2:14--16 框成一個單元。σῶσαι（sōsai） 是不定過去不定詞，和 1:21「能救你們靈魂的道」同一個字，指末日審判時的救（接 2:13）。</p>","exp":"<p>從這一節起，是全卷最重要的神學段落。很多人一讀到這裡就想起保羅，急著問雅各和保羅是不是說了相反的話。先別急，先讓雅各自己把題目說清楚。</p><p>「我的弟兄們，若有人說自己有信心，卻沒有行為，有甚麼益處呢？這信心能救他嗎？」（2:14）注意那個「說」字。雅各不是在問一個真心倚靠神、卻常常覺得自己做得不夠的人；他在問一個嘴上說有信心、手卻從來沒有動過的人。就像一個人說自己會游泳，卻從來沒下過水；一棵樹掛著「蘋果樹」的牌子，卻一年到頭不結果子。雅各問：那塊牌子算數嗎？</p><p>「這信心能救他嗎？」希臘文的問法已經預設了答案：不能。但雅各說的是「這」信心，就是只停在嘴上的那一種。他沒有說信心不能救人，他說的是：那種只會說、不會動的東西，配不上「信心」這個名字。</p><p>這一節要放回前一段讀。2:13 剛說完審判和憐憫，2:14 的「救」就是審判那天的救。一個在會堂門口把窮人推到腳凳下、卻說自己信榮耀的主的人，雅各問他：審判的那天，你的「我信」能為你作甚麼？</p><p>所以這一段有兩種聽眾，雅各的刀只對準其中一種。冷眼看弟兄受苦、還說自己信得很好的人，要被刺痛；為自己做得不夠而流淚的人，要先記得 1:18「他按自己的旨意，用真道生了我們」（1:18）——新生命是神生的，不是人做出來的。雅各不是要人懷疑自己得救，他是要人檢查自己口中的信心是不是活的。</p>"},{"a":15,"z":17,"star":2,"grk":"<p lang=\"grc\">ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ λειπόμενοι τῆς ἐφημέρου τροφῆς,</p><p lang=\"grc\">εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, τί ὄφελος;</p><p lang=\"grc\">οὕτως καὶ ἡ πίστις, ἐὰν μὴ ἔχῃ ἔργα, νεκρά ἐστιν καθʼ ἑαυτήν.</p>","lit":"<p>若有弟兄或姊妹是赤身的，又缺少每日的食物，</p><p>而你們中間有人對他們說：「平安地去吧，你們要被溫暖、要被餵飽」，卻不給他們身體所需要的，有甚麼益處呢？</p><p>照樣，信心若沒有行為，按它自己而言是死的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>γυμνοὶ</td><td>gymnoi</td><td>赤身的</td><td>衣不蔽體，不一定全裸</td></tr><tr><td>λειπόμενοι τῆς ἐφημέρου τροφῆς</td><td>leipomenoi tēs ephēmerou trophēs</td><td>缺少每日的食物</td><td>1:4--5 λείπω 的接龍</td></tr><tr><td>Ὑπάγετε ἐν εἰρήνῃ</td><td>Hypagete en eirēnē</td><td>平安地去吧</td><td>猶太人道別的祝福語</td></tr><tr><td>θερμαίνεσθε καὶ χορτάζεσθε</td><td>thermainesthe kai chortazesthe</td><td>要溫暖、要吃飽</td><td>被動或中間語態：願你們被暖、被餵</td></tr><tr><td>νεκρά ἐστιν καθʼ ἑαυτήν</td><td>nekra estin kath' heautēn</td><td>按它自己是死的</td><td>不是生病，是死了</td></tr></table>","gram":"<p><strong>2:15--16 是一個長條件句：ἐὰν ἀδελφὸς ἢ ἀδελφὴ（ean adelphos ē adelphē）……εἴπῃ δέ τις（eipē de tis）……μὴ δῶτε δὲ（mē dōte de）……τί ὄφελος（ti ophelos）。</strong>弟兄與姊妹並列，雅各特別把姊妹也寫進來。λειπόμενοι（leipomenoi） 是 λείπω（leipō） 的分詞，和 1:4「毫無缺欠」（λειπόμενοι（leipomenoi））、1:5「缺少智慧」（λείπεται（leipetai））同一個字：缺智慧的人可以向神求，缺飯吃的人卻只得到一句祝福。</p><p>θερμαίνεσθε καὶ χορτάζεσθε（thermainesthe kai chortazesthe） 可讀成中間語態「你們自己去取暖、吃飽」，或被動語態「願你們被溫暖、被餵飽」。不論哪一讀，說話的人都沒有動手。χορτάζεσθε（chortazesthe） 原是餵牲口的字。2:17 的 καθʼ ἑαυτήν（kath' heautēn），「按它自己」，說明這信心不是因為別人而死，是本身就沒有生命。</p>","exp":"<p>雅各舉了一個例子，例子不是割禮、守節、飲食的規條，而是一個冷天裡站在門口的弟兄或姊妹：「若是弟兄或是姊妹，赤身露體，又缺了日用的飲食」（2:15）。這一點要記住：本章所說的「行為」，是愛的行為。給飢寒的人吃穿，正是 2:8 至尊的律法。</p><p>接著是一句很屬靈的話：「平平安安地去吧！願你們穿得暖，吃得飽」（2:16）。字字都是祝福，甚至可能說得很真誠，說完還加一句「我會為你禱告」。可是雅各接下去說：「卻不給他們身體所需用的，這有甚麼益處呢？」（2:16）祝福從嘴裡出去，冷風還是從門縫吹進來。對一個肚子餓的人，一句祝福的重量和一陣風差不多。</p><p>結論出來了：「這樣，信心若沒有行為就是死的。」（2:17）雅各沒有說這種信心是「弱的」或「不夠好」，他說它是「死的」。死的東西還可以看起來完整：一具標本有翅膀、有羽毛，就是不會飛。</p><p>約翰也說了同樣的話：「我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。」（約壹 3:18）321 說「人比事重要、關係比東西重要」，在這一段最實在：今天的「平平安安地去吧」，可能是群組裡的一句「加油，為你禱告」，然後就沒有了。雅各不反對祝福，他問的是：祝福後面有沒有一雙手？</p>"},{"a":18,"z":19,"star":2,"grk":"<p lang=\"grc\">Ἀλλʼ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου χωρὶς τῶν ἔργων κἀγώ σοι δείξω ἐκ τῶν ἔργων μου τὴν πίστιν</p><p lang=\"grc\">σὺ πιστεύεις ὅτι εἷς ἐστιν ὁ θεός ; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.</p>","lit":"<p>但有人會說：「你有信心，我有行為。」你把你那沒有行為的信心指給我看，我也要從我的行為把信心指給你看。</p><p>你信神是一位，你做得好；鬼魔也信，並且發抖。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀλλʼ ἐρεῖ τις</td><td>All' erei tis</td><td>但有人會說</td><td>引出一個假想的對話者</td></tr><tr><td>δεῖξόν μοι</td><td>deixon moi</td><td>指給我看</td><td>命令：拿出證據來</td></tr><tr><td>χωρὶς τῶν ἔργων</td><td>chōris tōn ergōn</td><td>沒有行為的</td><td>和合本跟批判本</td></tr><tr><td>ἐκ τῶν ἔργων μου</td><td>ek tōn ergōn mou</td><td>從我的行為</td><td>行為是信心被看見的樣子</td></tr><tr><td>εἷς ἐστιν ὁ θεός</td><td>heis estin ho theos</td><td>神是一位</td><td>示瑪的核心（申 6:4）</td></tr><tr><td>φρίσσουσιν</td><td>phrissousin</td><td>戰驚、發抖</td><td>寒毛直豎；新約僅此一次</td></tr></table>","gram":"<p><strong>2:18 是全段最難斷句的一節。</strong>Ἀλλʼ ἐρεῖ τις（All' erei tis） 引出一個假想的對話者，但引號該在哪裡結束，各家不同：①只到 Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω（Sy pistin echeis kagō erga echō），後面是雅各的回答；②整節都是對話者的話；③對話者是雅各的盟友，替他說話。和合本把整節放在引號裡，照第②種處理；多數註釋取第①種。不論怎麼斷，δεῖξόν μοι τὴν πίστιν σου χωρὶς τῶν ἔργων（deixon moi tēn pistin sou chōris tōn ergōn） 是一個挑戰：沒有行為的信心，拿不出來給人看。RP 作 ἐκ τῶν ἔργων σου（ek tōn ergōn sou），和合本跟批判本作「沒有行為」。</p><p>2:19 σὺ πιστεύεις ὅτι εἷς ἐστιν ὁ θεός（sy pisteueis hoti heis estin ho theos） 是猶太人每天背誦的示瑪（申 6:4）。καλῶς ποιεῖς（kalōs poieis） 帶點諷刺，和 2:8 的 καλῶς ποιεῖτε（kalōs poieite） 遙遙相對。φρίσσουσιν（phrissousin） 新約只此一次，原指寒毛豎起來，古代驅魔文獻常用來描寫鬼魔的驚恐。</p>","exp":"<p>雅各讓一個人出來辯論：「你有信心，我有行為」（2:18），好像信心和行為是兩種恩賜，你拿一樣、我拿一樣，各自安好。雅各的回答一針見血：「你將你沒有行為的信心指給我看，我便藉著我的行為，將我的信心指給你看。」（2:18）</p><p>這一句是本段的鑰匙：行為不是信心以外的另一樣東西，是信心被看見的樣子。就像風看不見，可是看得見樹在搖；電流看不見，可是看得見燈亮了。誰能把看不見、也從來沒有任何效果的「風」指給人看？</p><p>然後雅各舉了一個最正統的信條：「你信神只有一位，你信的不錯；鬼魔也信，卻是戰驚。」（2:19）申命記講義第 6 章講過，「耶和華－我們神是獨一的主」（申 6:4）是以色列每天早晚背誦的信仰告白。雅各說：這信條是對的，鬼魔也同意。在福音書裡，鬼魔比門徒更早喊出耶穌是神的兒子（這使我們想起可 1:24）。可是鬼魔的信只讓牠們發抖，沒有讓牠們去愛。</p><p>這不是貶低正確的信條。教義要緊，正因為它要緊，才不能停在頭腦裡。雅各分辨的是兩種「信」：一種是同意一個命題，一種是把自己交給一位神。前者鬼魔也做得到；後者會改變一個人怎樣對待門口那位弟兄。</p>"},{"a":20,"z":21,"star":2,"grk":"<p lang=\"grc\">θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ἀργή ἐστιν;</p><p lang=\"grc\">Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;</p>","lit":"<p>虛空的人哪，你願意知道沒有行為的信心是不做工的嗎？</p><p>我們的父亞伯拉罕，把他的兒子以撒獻上在祭壇上的時候，豈不是從行為被稱義嗎？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὦ ἄνθρωπε κενέ</td><td>ō anthrōpe kene</td><td>虛空的人哪</td><td>κενός：空的，裡面沒有東西</td></tr><tr><td>ἀργή</td><td>argē</td><td>不做工的、沒用的</td><td>SBLGNT；與 ἔργων 雙關</td></tr><tr><td>νεκρά</td><td>nekra</td><td>死的</td><td>RP 讀法＝和合本</td></tr><tr><td>ἐξ ἔργων ἐδικαιώθη</td><td>ex ergōn edikaiōthē</td><td>從行為被稱義</td><td>不定過去被動</td></tr><tr><td>ἀνενέγκας Ἰσαὰκ</td><td>anenenkas Isaak</td><td>獻上以撒</td><td>分詞說明「行為」是哪一件</td></tr></table>","gram":"<p><strong>2:20 是全卷最重要的異文，兩種讀法都要知道。</strong>SBLGNT 與 WH、Treg、NA28 都作 ἡ πίστις χωρὶς τῶν ἔργων ἀργή ἐστιν（hē pistis chōris tōn ergōn argē estin）；RP（拜占庭多數抄本）作 νεκρά（nekra），「死的」，和合本「沒有行為的信心是死的」就照這個讀法。νεκρά（nekra） 很可能是抄寫者從 2:17、2:26 順手帶過來的；外證與「較難的讀法」都支持 ἀργή（argē）。</p><blockquote><p>ἀργή（argē） 是一個雙關。這個字原形是 ἀεργός（aergos）：否定字首 a- 加上 ἔργον（ergon），「沒有工的」，引申為閒著的、沒用的（太 20:6 市場上「閒站」的人就是 ἀργοί（argoi））。所以 ἡ πίστις χωρὶς τῶν ἔργων ἀργή ἐστιν（hē pistis chōris tōn ergōn argē estin） 照字面是：「沒有工作的信心，是不做工的」——中文勉強可譯成「沒有行為的信心是不行的」。兩個讀法的意思一致：νεκρά（nekra） 說它沒有生命，ἀργή（argē） 說它沒有作用；和合本照「死的」講，講台照和合本，但一定要讓會眾聽見這個雙關。</p></blockquote><p>ὦ ἄνθρωπε κενέ（ō anthrōpe kene）：κενέ（kene） 是「空的」，雅各對那位假想對話者說：你的信心是空的，你這個人也是空的。2:21 的 οὐκ（ouk） 問句期待肯定答案。</p>","exp":"<p>〔舊約〕創 22:1--14（創世記講義第 22 章）</p><p>「虛浮的人哪，你願意知道沒有行為的信心是死的嗎？」（2:20）和合本照一組抄本譯「死的」，另一組抄本是一個文字遊戲：沒有工作的信心，是不做工的。就像一台沒有引擎的車，名字叫車，卻哪裡也去不了。雅各說這種信心「空」，因為裡面沒有東西在動。</p><p>接著雅各請出猶太人最尊敬的祖宗：「我們的祖宗亞伯拉罕把他兒子以撒獻在壇上，豈不是因行為稱義嗎？」（2:21）本系列創世記講義第 22 章講過那座摩利亞山：神說「把他獻為燔祭」（創 22:2），亞伯拉罕清早起來，備驢、劈柴、走了三天。天使攔住他的時候說：「現在我知道你是敬畏神的了」（創 22:12）。這裡的「行為」不是割禮那一類律法的行為，是一個信心在試驗中的順服。</p><p>這裡第一次出現「因行為稱義」，讀的時候要小心：雅各舉的行為，是一個已經信了神幾十年的人，在試驗中把最寶貝的交出來。這不是一個人靠做功德換取接納，而是一個早已被神接納的人，他的信心在試驗中被顯明出來。雅各的「稱義」在這裡是「被證明為義」，下一段他自己會說明這個行為和創 15:6 的信心是甚麼關係；與保羅的比較，留到 2:24。</p><p>雅各選這個例子，也和第 1 章接上了。第 1 章說「你們的信心經過試驗，就生忍耐」（1:3）；亞伯拉罕正是信心經過試驗的那一位。試驗沒有製造他的信心，只是讓那個信心被看見。</p>"},{"a":22,"z":23,"star":3,"grk":"<p lang=\"grc\">βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,</p><p lang=\"grc\">καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.</p>","lit":"<p>你看見信心與他的行為一同做工，並且信心從行為被成全了，</p><p>並且經上說的那句話應驗了：「亞伯拉罕信了神，這就被算為他的義」，他也被稱為神的朋友。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>βλέπεις</td><td>blepeis</td><td>你看見</td><td>單數：對著那個對話者</td></tr><tr><td>συνήργει</td><td>synērgei</td><td>一同做工</td><td>未完成式：一路同工</td></tr><tr><td>ἐτελειώθη</td><td>eteleiōthē</td><td>被成全了</td><td>與 1:4 τέλειοι 同字根</td></tr><tr><td>ἐπληρώθη ἡ γραφὴ</td><td>eplērōthē hē graphē</td><td>經文應驗了</td><td>雅各自己作的連結</td></tr><tr><td>ἐλογίσθη αὐτῷ εἰς δικαιοσύνην</td><td>elogisthē autō eis dikaiosynēn</td><td>被算為他的義</td><td>引創 15:6 七十士譯本</td></tr><tr><td>φίλος θεοῦ</td><td>philos theou</td><td>神的朋友</td><td>對照 4:4 與世俗為友</td></tr></table>","gram":"<p><strong>2:22 是本章章題，兩個動詞各有分量。</strong>συνήργει（synērgei） 是 συνεργέω（synergeō） 的未完成式，σύν（一同）加 ἔργον（工）：信心與行為「一同做工」，未完成式表示這是持續的同工，不是一次性的合作。ἐτελειώθη（eteleiōthē） 是 τελειόω（teleioō） 的不定過去被動，與 1:4 ἵνα ἦτε τέλειοι（hina ēte teleioi） 同字根：第 1 章說試煉使人「成全」，第 2 章說行為使信心「成全」，「全」與「行」兩篇在這裡接起來。</p><p>2:23 的 ἐπληρώθη ἡ γραφὴ ἡ λέγουσα（eplērōthē hē graphē hē legousa） 是雅各自己說的「應驗」。引的是創 15:6，照七十士譯本：Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ（Episteusen de Abraam tō theō）, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην（kai elogisthē autō eis dikaiosynēn）——保羅在羅 4:3、加 3:6 引的是同一句、同一個譯本。φίλος θεοῦ（philos theou） 不是創世記原文，這個稱號出自賽 41:8、代下 20:7。</p>","exp":"<p>〔舊約〕創 15:6（創世記講義第 15 章）</p><p>「可見，信心是與他的行為並行，而且信心因著行為才得成全。」（2:22）這是本章的題目，也是全卷這一條線上「信心的樣子」。雅各沒有說行為取代信心，也不是說信心有缺口、要靠行為補上。他說兩者一同做工：信心是引擎，行為是車輪；引擎發動，輪子才轉。輪子轉了，也證明引擎是真的。</p><p>「成全」這個字值得停一下。第 1 章說試煉使人「成全、完備，毫無缺欠」（1:4），在這裡同一個字說信心。成全的意思不是本來有缺陷、要靠行為補，而是達到它該有的樣子，像種子長成樹、花苞開成花。</p><p>接著雅各說：「這就應驗經上所說：『亞伯拉罕信神，這就算為他的義。』」（2:23）這是雅各自己作的連結，可以講滿。創 15:6 說：「亞伯蘭信耶和華，耶和華就以此為他的義。」（創 15:6）那一天亞伯蘭甚麼都還沒做，只是抬頭看星星，信了神的應許，神就算他為義。本系列創世記講義第 15 章講過那個夜晚。三十多年後，在摩利亞山上，那句話「應驗」了：當初被算為義的信心，終於被看見它真正的樣子。</p><p>所以雅各和保羅引的是同一節經文。保羅用創 15:6 說：亞伯拉罕在受割禮之前、在任何行為之前，就因信被算為義（羅 4:10）；雅各用創 22 說：那個信心是活的，三十年後長出了手。兩人都同意創 15:6，雅各只是把故事讀到第 22 章。</p><p>最後一句很溫柔：「他又得稱為神的朋友。」（2:23）這使我們想起賽 41:8「我朋友亞伯拉罕的後裔」（賽 41:8）。到 4:4，雅各要說「與世俗為友就是與神為敵」；在這裡，他先給我們看一個與神為友的人。321 說「改變觀念就改變生命，改變生命就改變生活」：亞伯拉罕的信心是觀念與生命，摩利亞山是生活。信心最後的樣子，不是一份正確的答卷，是一段友誼。</p>"},{"a":24,"z":24,"star":3,"grk":"<p lang=\"grc\">ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.</p>","lit":"<p>你們看見，人是從行為被稱義，不是單從信心。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁρᾶτε</td><td>horate</td><td>你們看見</td><td>複數：轉回對全體讀者說</td></tr><tr><td>ἐξ ἔργων δικαιοῦται</td><td>ex ergōn dikaioutai</td><td>從行為被稱義</td><td>現在式：一般原則</td></tr><tr><td>οὐκ ἐκ πίστεως μόνον</td><td>ouk ek pisteōs monon</td><td>不是單從信心</td><td>μόνον 是副詞，修飾整個動作</td></tr></table>","gram":"<p><strong>2:24 的 ὁρᾶτε（horate） 是複數：雅各從那位假想的對話者轉回來，對全體讀者下結論。</strong>ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον（ex ergōn dikaioutai anthrōpos kai ouk ek pisteōs monon）。μόνον（monon） 是副詞，不是修飾「信心」的形容詞；意思不是「不是因為一個孤單的信心」，而是「不是單單從信心」。整句要和保羅並排讀：「人稱義是因著信，不在乎遵行律法」（羅 3:28）；「倘若亞伯拉罕是因行為稱義，就有可誇的」（羅 4:2）；「人稱義不是因行律法，乃是因信耶穌基督」（加 2:16）。兩人還引同一節創 15:6。</p><blockquote><p>各家讀法並陳：①<strong>矛盾說</strong>：雅各與保羅的神學衝突。路德早年在 1522 年德文新約的序言裡，把雅各書與約翰福音、羅馬書等相比，稱它為「稻草書信」；但他仍把雅各書留在他翻譯的聖經裡，後來講道也引用它。部分近代批判學者也持矛盾說。②<strong>問的問題不同</strong>：保羅問罪人怎樣在神面前被算為義，答案是因著信、不靠律法；雅各問一個人說他有的信心是不是真的，答案是真的信心會有行為。兩人反對的不是同一個敵人。加爾文、改革宗與多數福音派這樣讀；加爾文的說法是：人稱義是單因著信，但叫人稱義的信心從來不是單獨的。③<strong>「稱義」的意思不同</strong>：保羅的 δικαιόω（dikaioō） 是法庭上的宣告為義；雅各的 δικαιόω（dikaioō） 是在人面前證明、顯明為義，路 7:35「智慧之子都以智慧為是」（路 7:35）用的是同一個字。許多福音派註釋這樣讀。④<strong>「行為」的意思不同</strong>：保羅說的是律法的行為（割禮、守節、飲食，加 2:16）；雅各說的是愛的行為（2:15--16；2:25）。保羅自己也說「惟獨使人生發仁愛的信心才有功效」（加 5:6）。⑤<strong>信心與行為共同稱義</strong>：天主教天特會議第六次會議（1547 年）引用雅 2:24，認為稱義是一個過程，始於信，並因信心與愛德的行為增長。</p></blockquote><p>本講義站在改教傳統（②③④的合流）：得救是本乎恩、也因著信，不是出於行為；但叫人得救的信心從來不是孤單的。</p>","exp":"<p>〔加〕加 2:16（加拉太書講義第 2 章）</p><p>「這樣看來，人稱義是因著行為，不是單因著信。」（2:24）把這句和保羅的「人稱義是因著信，不在乎遵行律法」（羅 3:28）並排，誰都會倒吸一口氣。本系列加拉太書講義第 2 章講過加 2:16，那是保羅最斬釘截鐵的一句。兩位使徒真的說了相反的話嗎？</p><p>把整章讀下來，答案就出來了。第一，雅各問的是「若有人說自己有信心」（2:14），一個只停在嘴上的信心；保羅問的是一個罪人怎樣在聖潔的神面前被接納。第二，雅各的「行為」是給飢寒的人吃穿、接待使者，是愛的行為；保羅反對的是割禮、守節、飲食，是律法的行為。第三，雅各的「稱義」在這裡是顯明為義，亞伯拉罕在創 15 已經被算為義，到創 22 才被顯明。兩人像兩位醫生，一位對付「靠自己賺得救恩」的病，一位對付「信了卻不必活出來」的病；開的藥不同，病人的健康是同一個。</p><p>保羅自己也這樣說：「你們得救是本乎恩，也因著信」（弗 2:8），下一句緊接著說：「我們原是他的工作……為要叫我們行善」（弗 2:10）。恩典是根，行善是果。雅各也從來沒有離開恩典：「他按自己的旨意，用真道生了我們」（1:18），「但他賜更多的恩典」（4:6）。</p><p>所以兩個方向都要防。不可把這節講成靠行為得救，好像人要做得夠多才確定被接納；那是加拉太書對付的錯。也不可用「因信稱義」把這節輕輕放下，好像只要說過信，怎樣對待飢寒的弟兄都不要緊；那是雅各書對付的錯。路德與天主教的讀法都要照實陳列，不需要嘲諷任何一方；路德把這卷書留在聖經裡，天主教也和我們一樣承認它是神的話。</p><p>本講義的落點一句話：保羅說「白白的」，雅各說「活的」。救恩是白白得來的，但白白得來的生命，是活的。一個為自己做得不夠而不安的人，請先聽「他賜更多的恩典」；一個冷眼看弟兄飢寒的人，請聽雅各的問題：你的信心有手嗎？</p>"},{"a":25,"z":26,"star":2,"grk":"<p lang=\"grc\">ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;</p><p lang=\"grc\">ὥσπερ γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις χωρὶς ἔργων νεκρά ἐστιν.</p>","lit":"<p>照樣，妓女喇合接待了使者，又從另一條路把他們送出去，豈不也是從行為被稱義嗎？</p><p>因為身體沒有靈是死的，照樣，信心沒有行為也是死的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ῥαὰβ ἡ πόρνη</td><td>Rhaab hē pornē</td><td>妓女喇合</td><td>雅各不避諱她的過去</td></tr><tr><td>ὑποδεξαμένη τοὺς ἀγγέλους</td><td>hypodexamenē tous angelous</td><td>接待了使者</td><td>ἄγγελος：信差</td></tr><tr><td>ἑτέρᾳ ὁδῷ ἐκβαλοῦσα</td><td>hetera hodō ekbalousa</td><td>從另一條路送出去</td><td>冒著生命危險</td></tr><tr><td>τὸ σῶμα χωρὶς πνεύματος</td><td>to sōma chōris pneumatos</td><td>身體沒有靈</td><td>πνεῦμα：氣息、靈</td></tr></table>","gram":"<p><strong>2:25 的 ὁμοίως δὲ καὶ（homoiōs de kai），「照樣也」</strong>，把喇合和亞伯拉罕並排；問句結構和 2:21 一模一樣：οὐκ ἐξ ἔργων ἐδικαιώθη（ouk ex ergōn edikaiōthē）。兩個分詞說明她的行為：ὑποδεξαμένη（接待了）、ἐκβαλοῦσα（送出去）。雅各稱探子為 τοὺς ἀγγέλους（tous angelous），「使者」，不用來 11:31 的 κατασκόπους（探子）。</p><p>2:26 用 ὥσπερ（hōsper）……οὕτως（houtōs） 作比喻收尾。τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν（to sōma chōris pneumatos nekron estin）：πνεῦμα（pneuma） 可指「靈」，也可指「氣息」（這使我們想起創 2:7）；和合本譯「靈魂」。比喻的方向要看準：信心像身體，行為像氣息——行為不是信心的外衣，是讓信心活著的那口氣。</p>","exp":"<p>〔來〕來 11:31（希伯來書講義第 11 章）</p><p>亞伯拉罕之後，雅各舉了一個完全相反的人：「妓女喇合接待使者，又放他們從別的路上出去，不也是一樣因行為稱義嗎？」（2:25）一位是以色列的祖宗，一位是外邦的妓女；一位是男人，一位是女人；一位在信心路上走了幾十年，一位剛剛聽說以色列的神。雅各故意挑兩個極端，好說明：從祖宗到妓女，活的信心長的都是同一個樣子。</p><p>這裡又說「因行為稱義」，要和前面一樣讀：喇合的行為是接待、保護、冒險，是愛的行為，不是律法的行為。希伯來書說：「妓女喇合因著信，曾和和平平地接待探子」（來 11:31），本系列希伯來書講義第 11 章講過。同一件事，希伯來書從信心看，雅各從行為看，兩個角度照的是同一個人：她相信耶和華是天上地下的神（書 2:11），所以她把探子藏起來。信心在她心裡，行為在她手上。</p><p>喇合如何對耶利哥王的人說話，是另一個問題，議題頁會處理；雅各稱讚的不是她的說法，是她冒著性命接待神的使者。</p><p>最後一句收住整段：「身體沒有靈魂是死的，信心沒有行為也是死的。」（2:26）一個身體可以五官齊全，但沒有那一口氣，它就只是一具軀殼。信心也可以字句齊全、信條正確，但沒有愛的行為，它就沒有呼吸。這一章從會堂門口開始，在這口氣上結束：信奉榮耀的主，眼睛就不看金戒指；有活的信心，手就伸向那個赤身露體的弟兄。白白得來的生命，是會呼吸的。</p>"}],"3":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·</p>","lit":"<p>不要許多人成為教師，我的弟兄們，因為知道我們將要領受更大的判決；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μὴ πολλοὶ διδάσκαλοι γίνεσθε</td><td>Mē polloi didaskaloi ginesthe</td><td>不要許多人成為教師</td><td>現在式命令＋μή：不要一窩蜂去當</td></tr><tr><td>ἀδελφοί μου</td><td>adelphoi mou</td><td>我的弟兄們</td><td>嚴厲的話放在家人的稱呼裡</td></tr><tr><td>εἰδότες</td><td>eidotes</td><td>知道</td><td>理由不是新的規定，是大家都知道的事</td></tr><tr><td>μεῖζον κρίμα</td><td>meizon krima</td><td>更大的判決</td><td>κρίμα：審判的結果、判決</td></tr><tr><td>λημψόμεθα</td><td>lēmpsometha</td><td>我們將要領受</td><td>第一人稱複數：雅各把自己算進去</td></tr></table>","gram":"<p><strong>3:1 是一個否定的現在式命令：Μὴ πολλοὶ διδάσκαλοι γίνεσθε（Mē polloi didaskaloi ginesthe）。</strong>γίνεσθε（ginesthe） 是「成為」，現在式帶著「不要一直往這裡擠」的味道；πολλοὶ（polloi） 放在前面，問題不在「教師」，在「許多」。雅各沒有說「不要作教師」，他說「不要很多人搶著作」。</p><p>理由句用分詞 εἰδότες（eidotes），「既然知道」——這不是一條新規定，是大家心裡本來就明白的事。動詞 λημψόμεθα（lēmpsometha） 是第一人稱複數未來式：「我們」將要領受。寫信的人自己就是教師，他先把自己放進受審的隊伍裡。κρίμα（krima） 是判決本身，比 κρίσις（krisis） 更具體；本卷追蹤的「判斷」一線，在這裡第一次落到說話的人身上。</p><blockquote><p>κρίμα（krima） 在本卷只出現這一次。與 2:13 的 κρίσις（krisis） 對讀：2:13 說憐憫向審判誇勝，3:1 說教導人的先站上審判台——同一個審判，一處講恩典勝過它，一處講職分加重它。</p></blockquote>","exp":"<p>第 2 章結束在「信心沒有行為也是死的」（2:26），第 3 章一開口卻轉到「師傅」。這不是換題目。說「我有信心」的人，最常用的工具就是嘴；一個會堂式的小聚會裡，最容易「行」出來的事奉，就是站起來講。所以雅各接著寫：「我的弟兄們，不要多人作師傅，因為曉得我們要受更重的判斷。」（3:1）</p><p>散住的信徒聚在一起，沒有固定的牧者，誰願意開口誰就可以教。講台的門很寬，講台的重量卻很少有人算過。教導的人說出的每一句話，都會被別人拿去活；話說錯了，傷的不只是自己。好比醫生開藥方，開對了救人，開錯了害人，所以醫生要負的責任比病人大。</p><p>這一節要讀得準。<strong>3:1 是對教導者的警告，不是壓制肢體的恩賜。</strong>新約別處一樣鼓勵弟兄姊妹彼此教導、彼此勸戒；雅各擋的不是開口，是搶著開口、把講台當成舞台的那顆心。小組長、主日學老師、網路上分享信息的人，都不必因這節經文閉嘴；他們要做的是把這個重量放在心上：說之前先問，這句話我自己活過嗎？</p><p>雅各說「我們」。他沒有站在講台上指著台下，他和所有教導的人一起站在審判台前。這是本章的第一個姿勢：要管別人的舌頭以前，先承認自己的舌頭也要交帳。321 講 235 的「3」——作屬靈父母的人——在這裡得到一條很實際的提醒：帶人的人，先管好自己的嘴。</p>"},{"a":2,"z":2,"star":2,"grk":"<p lang=\"grc\">πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.</p>","lit":"<p>因為在許多事上我們全都跌倒。若有人在話語上不跌倒，這人是一個完全的人，能夠連全身也勒住。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πολλὰ γὰρ πταίομεν ἅπαντες</td><td>polla gar ptaiomen hapantes</td><td>因為在許多事上我們全都跌倒</td><td>πολλὰ 放句首；ἅπαντες 放句尾，無一例外</td></tr><tr><td>ἐν λόγῳ</td><td>en logō</td><td>在話語上</td><td>本章的主題詞；篇名「言」</td></tr><tr><td>τέλειος ἀνήρ</td><td>teleios anēr</td><td>完全的人</td><td>回響 1:4 τέλειοι：篇名「全」</td></tr><tr><td>χαλιναγωγῆσαι</td><td>chalinagōgēsai</td><td>勒住（用韁繩引導）</td><td>1:26 χαλιναγωγῶν 同字</td></tr><tr><td>ὅλον τὸ σῶμα</td><td>holon to sōma</td><td>全身</td><td>3:3、3:6 再出現兩次</td></tr></table>","gram":"<p><strong>3:2 前半是一句坦白：πολλὰ γὰρ πταίομεν ἅπαντες（polla gar ptaiomen hapantes）。</strong>「許多」放句首，「全都」放句尾，中間夾著動詞「跌倒」：沒有人逃得掉。πταίομεν（ptaiomen） 與 2:10 πταίσῃ（ptaisē） 同一個字——在一條上「跌倒」就犯了眾條；雅各在第 3 章坦白說：我們每個人都在很多事上跌倒。主詞還是「我們」。</p><p>後半句用條件句 εἴ τις ἐν λόγῳ οὐ πταίει（ei tis en logō ou ptaiei）：若有人在話語上不跌倒，οὗτος τέλειος ἀνήρ（houtos teleios anēr）。τέλειος（teleios） 是本卷第一章的關鍵字，1:4 說忍耐要使人 τέλειοι（teleioi）。這不是「沒有罪的人」，是「長成的、整全的人」。χαλιναγωγῆσαι（chalinagōgēsai） 是新約罕見字，本卷 1:26 已經用過：「不勒住他的舌頭」（1:26）。原意是用韁繩駕馭馬，正好接上下一節的嚼環。</p>","exp":"<p>「原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。」（3:2）雅各先承認「我們都有過失」，才說「話語上沒有過失」的人是完全人。次序很要緊：他不是從高處往下看，他是從地上抬頭看。</p><p>為甚麼話語是完全的試金石？因為舌頭是全身最難管的部分。一個人可以管住手不偷、腳不去不該去的地方，但話常常在想清楚以前就出口了。能管住最難管的那一處，其他地方也就管得住。好比考駕照，最後一關考的是路邊停車：停得進去，前面的就都會了。</p><p>真的有人做得到嗎？雅各沒有說有。他用的是條件句「若有人」，前半句已經說「我們都有過失」。這一節不是要人假裝完美，是要人知道往哪裡長：τέλειος（teleios） 是方向，不是證書。全卷第一篇「全」（1:4）在這裡回來了——試煉裡的忍耐使人成全，說話裡的節制也使人成全。成全不是一個人咬牙做到的，是神在試煉裡、在一次又一次的閉口裡，慢慢長在人身上的果子。</p><p>對一個常常說錯話、事後懊悔的人，這節經文的第一句是安慰：你不是唯一的一個，雅各也在裡面。第二句才是邀請：讓這一處開始被勒住。</p>"},{"a":3,"z":4,"star":3,"grk":"<p lang=\"grc\">εἰ δὲ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.</p><p lang=\"grc\">ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται ·</p>","lit":"<p>而若我們把馬的嚼環放進牠們的嘴裡，為要使牠們順從我們，我們也就轉動牠們的全身。</p><p>看哪，連那些船，雖是這樣大，又被猛烈的風驅趕，卻被一個極小的舵轉動，往那掌舵者的衝勁所願意的地方去。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>χαλινοὺς</td><td>chalinous</td><td>嚼環</td><td>勒住 χαλιναγωγῆσαι 的字根</td></tr><tr><td>εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν</td><td>eis to peithesthai autous hēmin</td><td>為要使牠們順從我們</td><td>目的不是控制，是一起往前走</td></tr><tr><td>μετάγομεν／μετάγεται</td><td>metagomen / metagetai</td><td>轉動</td><td>兩節同一個動詞：馬與船</td></tr><tr><td>τηλικαῦτα</td><td>tēlikauta</td><td>這樣大</td><td>與 3:5 的 ἡλίκον 同一組字</td></tr><tr><td>ὑπὸ ἐλαχίστου πηδαλίου</td><td>hypo elachistou pēdaliou</td><td>被一個極小的舵</td><td>最高級：極小</td></tr><tr><td>ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται</td><td>hopou hē hormē tou euthynontos bouletai</td><td>掌舵者的意思要往哪裡</td><td>舵後面有一隻手</td></tr></table>","gram":"<p><strong>3:3--4 是兩幅平行的畫：馬與船。</strong>兩節共用一個動詞：3:3 μετάγομεν（metagomen）「我們轉動」，3:4 μετάγεται（metagetai）「被轉動」。馬嘴裡的是 χαλινοὺς（chalinous），就是 3:2 χαλιναγωγῆσαι（chalinagōgēsai） 的字根；雅各從一個字推出一幅畫。</p><p>3:4 用了一連串對比：船 τηλικαῦτα（tēlikauta）「這樣大」，又 ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα（hypo anemōn sklērōn elaunomena）「被猛烈的風驅趕」，卻 ὑπὸ ἐλαχίστου πηδαλίου（hypo elachistou pēdaliou）「被一個極小的舵」轉動。ἐλαχίστου（elachistou） 是最高級。句尾 ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται（hopou hē hormē tou euthynontos bouletai）：舵本身沒有意志，決定方向的是 τοῦ εὐθύνοντος（tou euthynontos）「那掌舵的」。</p><blockquote><p>3:3 有一個常被略過的目的子句：εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν（eis to peithesthai autous hēmin），「為要使牠們順從我們」。嚼環不是為了折磨馬，是為了讓馬和騎的人往同一個方向走。這也是本章唯一兩幅「舌頭被管住」的正面畫面；從 3:5 下半起，畫面就全部轉暗。</p></blockquote>","exp":"<p>「我們若把嚼環放在馬嘴裡，叫牠順服，就能調動牠的全身。看哪，船隻雖然甚大，又被大風催逼，只用小小的舵，就隨著掌舵的意思轉動。」（3:3--4）</p><p>散住的信徒熟悉這兩幅畫。路上的驢馬，地中海上的貨船，都是他們日常看得見的東西。雅各的論證很簡單：小東西能決定大方向。一匹馬比人重好幾倍，一塊小小的鐵放對了地方，人就能帶牠走；一艘大船被風推著，船尾一片小小的木板，就能叫它轉彎。舌頭就是這樣一片舵。</p><p>這是<strong>全章唯一正面的舌頭畫面</strong>，也是本章章題的來源。讀第 3 章很容易只記得火與毒，忘了雅各先畫了一個舵。舵本身不是壞東西；船要靠岸、要避礁、要進港，全靠它。問題只在一件事：<strong>誰在掌舵？</strong>原文說得很清楚，船轉向「掌舵者的意思」所要的地方。舌頭若在主的手裡，一句話可以把整個家、整個小組帶回安全的港口；舌頭若在怒氣、嫉妒、驕傲的手裡，同一片舵就把船帶上暗礁。</p><p>還要注意 3:4 的「大風」。船不是在平靜的港灣裡轉向，是在逆風裡。人最需要舵的時候，也正是情緒的大風吹來的時候：被冤枉、被比較、被激怒。風大的時候放開舵，是最自然的反應，也是最危險的反應。1:19 已經說了「快快地聽，慢慢地說，慢慢地動怒」（1:19），這裡給了理由：風再大，舵還在你手裡。</p><p>勒住舌頭，不是把嘴縫起來；嚼環的目的是「叫牠順服」，好往前走。船有舵，不是為了停在港裡，是為了出航。所以勒住舌頭從來不是叫指出問題的人、受了傷的人閉嘴，而是讓說出來的話跟著掌舵的那一位走。321 說「聖靈是我的引導」，落在說話上最具體的樣子就是這幅畫：把舵交回給掌舵的手。</p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ μεγάλα αὐχεῖ. Ἰδοὺ ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·</p>","lit":"<p>照樣，舌頭也是一個小肢體，卻誇耀大事。看哪，何等小的火，點燃何等大的林木！</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μικρὸν μέλος</td><td>mikron melos</td><td>一個小肢體</td><td>回到 3:4 的「極小」</td></tr><tr><td>μεγάλα αὐχεῖ</td><td>megala auchei</td><td>誇耀大事、說大話</td><td>這個動詞新約僅此一次</td></tr><tr><td>ἡλίκον</td><td>hēlikon</td><td>何等（小／大）的</td><td>SBLGNT；RP 作 ὀλίγον「小的」</td></tr><tr><td>ἡλίκην ὕλην</td><td>hēlikēn hylēn</td><td>何等大的林木</td><td>ὕλη：樹林、木材、柴堆</td></tr></table>","gram":"<p><strong>3:5 是從舵轉到火的樞紐。</strong>前半 οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ μεγάλα αὐχεῖ（houtōs kai hē glōssa mikron melos estin kai megala auchei），「照樣，舌頭也是小肢體，卻誇耀大事」——μικρὸν（mikron） 與 μεγάλα（megala） 一小一大並排。αὐχεῖ（auchei） 新約只出現這一次，與本卷 4:16 的「張狂誇口」同一個家族。</p><p><strong>經文鑑別：</strong>後半句在 SBLGNT（與 WH、Treg、NA28）作 Ἰδοὺ ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει（Idou hēlikon pyr hēlikēn hylēn anaptei）。ἡλίκος（hēlikos） 是「何等的」，可以指大，也可以指小，雅各一句裡用兩次：「何等<em>小</em>的火，點燃何等<em>大</em>的林木」——同一個字一頭指小、一頭指大，是故意的修辭。拜占庭傳統（RP）把第一個字改作 ὀλίγον（oligon）「少的、小的」，意思變得明白，和合本「最小的火」就是照這個讀法譯的。兩種讀法意思一樣：小火燒大林。本講義 grk 欄照 SBLGNT 的 ἡλίκον（hēlikon），講台照和合本「最小的火」；ἡλίκον（hēlikon） 較難、較巧，抄寫者把它改得順口的可能，大於反過來。</p>","exp":"<p>「這樣，舌頭在百體裡也是最小的，卻能說大話。看哪，最小的火能點著最大的樹林。」（3:5）</p><p>雅各在這一節裡換了畫面。前面是舵，舵是被掌握的；這裡是火，火是會自己蔓延的。兩幅畫的共同點是「小」：舵很小，火星也很小。不同點是方向：舵讓大船往掌舵的人要去的地方，火讓大林往誰也控制不了的地方去。</p><p>「說大話」是一個轉折。小小的舌頭最愛做的事，偏偏是把自己說大：誇自己的成就、誇自己的屬靈、誇自己的判斷。說大話的舌頭已經不在掌舵者的手裡，它自己當起船長來了。這是本卷「有己」最早露面的地方之一，到 4:16 會說得更直接。</p><p>散住的人住在乾旱的地方，夏天山坡上一點火星就能燒掉一整片橄欖園。一句閒話也是這樣：在群組裡隨手轉出去的一句，第二天整個教會都知道了，第三天兩個家庭不再說話。說的人常說「我只是隨口一提」——就是那一點火。</p><p>這一節也預備了下一節的谷底。舵的畫面還有一隻手，火的畫面已經看不見手了。從這裡起，雅各要讓讀者看清楚：舌頭一旦離開掌舵的手，就不再只是小事。</p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.</p>","lit":"<p>舌頭也是火，是那不義的世界；舌頭被安置在我們的肢體中，是那污穢全身的、點燃生成之輪的、又被地獄點燃的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ γλῶσσα πῦρ</td><td>hē glōssa pyr</td><td>舌頭是火</td><td>沒有動詞：直接等同</td></tr><tr><td>ὁ κόσμος τῆς ἀδικίας</td><td>ho kosmos tēs adikias</td><td>那不義的世界</td><td>1:27、4:4 的 κόσμος</td></tr><tr><td>καθίσταται</td><td>kathistatai</td><td>被安置、坐定</td><td>舌頭在肢體中「坐鎮」</td></tr><tr><td>σπιλοῦσα</td><td>spilousa</td><td>污穢</td><td>1:27 ἄσπιλον「不沾染」的反面</td></tr><tr><td>τὸν τροχὸν τῆς γενέσεως</td><td>ton trochon tēs geneseōs</td><td>生成之輪</td><td>整個人生的歷程，不是輪迴</td></tr><tr><td>φλογιζομένη ὑπὸ τῆς γεέννης</td><td>phlogizomenē hypo tēs geennēs</td><td>被地獄點燃</td><td>γεέννης 福音書以外新約僅此一次</td></tr></table>","gram":"<p><strong>3:6 是全卷地勢最低的一節，句法也最難。</strong>開頭 καὶ ἡ γλῶσσα πῦρ（kai hē glōssa pyr） 沒有動詞：「舌頭——火」。接著 ὁ κόσμος τῆς ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν（ho kosmos tēs adikias hē glōssa kathistatai en tois melesin hēmōn）：有人把「不義的世界」當作上一句的同位語（舌頭是火，是一個不義的世界），有人當作 καθίσταται（kathistatai） 的補語（舌頭在肢體中被立為不義的世界）。和合本取後者，意思相同：一個小肢體裡裝著整個罪惡的世界。</p><p>然後是三個分詞，形成一個上升的階梯：ἡ σπιλοῦσα ὅλον τὸ σῶμα（hē spilousa holon to sōma）「污穢全身」——σπιλοῦσα（spilousa） 與 1:27 ἄσπιλον（aspilon）「不沾染世俗」同字根，1:27 要人保守自己不沾污，3:6 說污點就是從嘴裡來的；φλογίζουσα τὸν τροχὸν τῆς γενέσεως（phlogizousa ton trochon tēs geneseōs）「點燃生成之輪」；φλογιζομένη ὑπὸ τῆς γεέννης（phlogizomenē hypo tēs geennēs）「被地獄點燃」。前兩個主動，第三個被動：舌頭點火，但點舌頭的火另有來源。</p><blockquote><p><strong>τὸν τροχὸν τῆς γενέσεως（ton trochon tēs geneseōs） 的讀法：</strong>γενέσεως（geneseōs） 在 1:23 是「本來的面目」（τὸ πρόσωπον τῆς γενέσεως（to prosōpon tēs geneseōs）），指人生來的樣子。這個片語在希臘文學裡有出現，有些哲學與宗教用它講命運之輪或輪迴；但雅各借的只是一個日常說法，指<strong>人從出生到死亡整個生命的歷程</strong>，像車輪從頭轉到尾。雅各沒有輪迴的觀念——本卷 4:14 說人生是「一片雲霧」，來 9:27 說「人人都有一死，死後且有審判」（來 9:27）。γεέννης（geennēs） 在新約除了福音書（主耶穌親口說的）只出現在這裡，又是一處雅各活在哥哥話語裡的痕跡（這使我們想起太 5:22）。</p></blockquote>","exp":"<p>「舌頭就是火，在我們百體中，舌頭是個罪惡的世界，能污穢全身，也能把生命的輪子點起來，並且是從地獄裡點著的。」（3:6）這是雅各書最重的一句話，也是全卷地勢圖的谷底。前面的舵還有一隻手，這裡只剩下火。</p><p>雅各一層一層往外燒。先是「污穢全身」：一句惡毒的話，說的人自己先被染黑；罵完人的那一刻，心裡沒有比較乾淨。再是「把生命的輪子點起來」：從一個人的一生燒過去——童年聽到的一句「你怎麼這麼笨」，可以在一個人心裡燒四十年。最後是火的來源：「從地獄裡點著的」。舌頭不是火源，它是導火線；真正的火從更深的地方來，3:15 要說那是「屬鬼魔的」。</p><p>這一節要防兩個誤讀。<strong>第一，「生命的輪子」不是輪迴</strong>，是一個人從生到死的整條路；雅各說的是一句話能燒過人的一輩子，不是一句話會帶到下輩子。<strong>第二，3:6 不是言語咒詛的魔法。</strong>有人說負面的話會招來咒詛、正面宣告就會成真，這不是雅各的意思。雅各說的火燒的是<strong>關係與人心</strong>：被羞辱的孩子、被造謠的同工、被冷言冷語趕出教會的人。話語的力量是真的，但它的力量在人與人之間，不在一套說了就靈的咒語裡。神仍然是掌管禍福的那一位，信徒不必活在「說錯一句話就招禍」的恐懼裡。</p><p>讀到這裡會發現，雅各不只是在罵舌頭，他在拆穿一個錯覺：「我只是說說而已。」沒有「只是說說」這回事；說出口的話是火。但這也不是叫人從此不敢開口。受了傷的人說出自己的傷，指出問題的人說出問題，那不是點火，是報火警。雅各要撲滅的，是從地獄點著的那一種火。</p><p>谷底不是終點。同一章的末了是「從上頭來的智慧」（3:17），全卷地勢從 3:6 的谷底一路要爬到 5:11 的高峰「主是滿心憐憫，大有慈悲」（5:11）。讀 3:6 要一路讀到 3:17：從地獄點著的火，只有從上頭來的才能澆熄。</p>"},{"a":7,"z":8,"star":1,"grk":"<p lang=\"grc\">πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·</p><p lang=\"grc\">τὴν δὲ γλῶσσαν οὐδεὶς δαμάσαι δύναται ἀνθρώπων · ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.</p>","lit":"<p>因為走獸和飛鳥、爬物和海中生物的每一種類，都被制伏，也已經被人類制伏了；</p><p>但舌頭，人中沒有一個能夠制伏；它是不安定的惡，充滿致死的毒。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δαμάζεται καὶ δεδάμασται</td><td>damazetai kai dedamastai</td><td>被制伏，也已經被制伏</td><td>現在式＋完成式：一直在做，也已做成</td></tr><tr><td>δαμάσαι</td><td>damasai</td><td>制伏</td><td>不定過去式：一次也做不到</td></tr><tr><td>ἀκατάστατον κακόν</td><td>akatastaton kakon</td><td>不安定的惡</td><td>1:8 ἀκατάστατος 心懷二意</td></tr><tr><td>μεστὴ ἰοῦ θανατηφόρου</td><td>mestē iou thanatēphorou</td><td>充滿致死的毒</td><td>ἰός：毒，也是 5:3 的「銹」</td></tr></table>","gram":"<p><strong>3:7 列出四類受造之物：</strong>θηρίων（thēriōn）、πετεινῶν（peteinōn）、ἑρπετῶν（herpetōn）、ἐναλίων（enaliōn）——走獸、飛鳥、爬物、海中生物，正是創 1:26 人受託管理的那幾類。動詞連用兩個時態：δαμάζεται καὶ δεδάμασται（damazetai kai dedamastai），現在式「一直在被制伏」，完成式「已經被制伏了」，τῇ φύσει τῇ ἀνθρωπίνῃ（tē physei tē anthrōpinē）「被人類」。</p><p>3:8 用 δὲ（de） 翻轉：τὴν δὲ γλῶσσαν οὐδεὶς δαμάσαι δύναται ἀνθρώπων（tēn de glōssan oudeis damasai dynatai anthrōpōn）——舌頭放在句首，「人中沒有一個」能制伏。接著兩個同位語：ἀκατάστατον κακόν（akatastaton kakon），ἀκατάστατος（akatastatos） 在 1:8 形容心懷二意的人「沒有定見」，舌頭和二意的心是同一種病；μεστὴ ἰοῦ θανατηφόρου（mestē iou thanatēphorou），ἰοῦ（iou） 是蛇的「毒」，而 5:3 說金銀長了「銹」，ὁ ἰὸς αὐτῶν（ho ios autōn），<strong>同一個字</strong>。毒的舌頭和銹的金銀，都會反過來吃掉擁有它的人。</p>","exp":"<p>「各類的走獸、飛禽、昆蟲、水族，本來都可以制伏，也已經被人制伏了；惟獨舌頭沒有人能制伏，是不止息的惡物，滿了害死人的毒氣。」（3:7--8）</p><p>人能叫獅子跳火圈、叫老鷹回到手臂上、叫海豚頂球，卻管不住自己嘴裡那一小塊肉。雅各說「沒有人能」，不是誇張，是診斷：靠人自己的力量，這件事做不到。</p><p>「不止息的惡物」和 1:8 心懷二意的人「沒有定見」是同一個字，舌頭的不安定，是心不安定的回音。「毒氣」和 5:3 金銀的「銹」也是同一個字：毒的話傷了別人，最後也腐蝕了自己。</p><p>這兩節的落點不是絕望。「沒有人能」正是把人推向那一位能的。人管不住的，神能管；所以 1:21 要人「存溫柔的心領受那所栽種的道」（1:21），舌頭的改變不是從嘴開始，是從裡面那個道開始長出來。人做不到的馴服，交給那位用真道生了我們的神，就從裡面慢慢長出新的樣子。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">ἐν αὐτῇ εὐλογοῦμεν τὸν κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθʼ ὁμοίωσιν θεοῦ γεγονότας·</p><p lang=\"grc\">ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.</p>","lit":"<p>我們用它祝福主和父，也用它咒詛那些照著神的樣式而成的人；</p><p>從同一張口出來祝福和咒詛。我的弟兄們，這些事不應當這樣發生。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν αὐτῇ</td><td>en autē</td><td>用它（舌頭）</td><td>兩次重複：同一個工具</td></tr><tr><td>εὐλογοῦμεν τὸν κύριον καὶ πατέρα</td><td>eulogoumen ton kyrion kai patera</td><td>我們祝福主和父</td><td>猶太人每日的頌讚禱告</td></tr><tr><td>καταρώμεθα τοὺς ἀνθρώπους</td><td>katarōmetha tous anthrōpous</td><td>我們咒詛人</td><td>還是「我們」</td></tr><tr><td>καθʼ ὁμοίωσιν θεοῦ γεγονότας</td><td>kath' homoiōsin theou gegonotas</td><td>照神的樣式而成的</td><td>完成式：形像至今還在</td></tr><tr><td>οὐ χρή</td><td>ou chrē</td><td>不應當</td><td>新約僅此一次的 χρή</td></tr></table>","gram":"<p><strong>3:9 是一組工整的平行句：</strong>ἐν αὐτῇ εὐλογοῦμεν（en autē eulogoumen）……καὶ ἐν αὐτῇ καταρώμεθα（kai en autē katarōmetha）——「用它祝福……也用它咒詛」。兩次 ἐν αὐτῇ（en autē），同一個工具；兩個動詞都是第一人稱複數，雅各仍然說「我們」。</p><p>被咒詛的人是 τοὺς καθʼ ὁμοίωσιν θεοῦ γεγονότας（tous kath' homoiōsin theou gegonotas）：ὁμοίωσιν（homoiōsin） 正是七十士譯本創 1:26「樣式」的字；γεγονότας（gegonotas） 是完成分詞，「已經被造成而且仍然是」。墮落之後，形像仍在。3:10 的 ἐκ τοῦ αὐτοῦ στόματος（ek tou autou stomatos） 再把兩件事收進「同一張口」。</p><p>判語 οὐ χρή（ou chrē） 是新約唯一一次出現的 χρή（chrē）。它不是「不可能」（那是 3:12 要說的），是「不應當、不合宜」。雅各不假裝這件事沒有發生；正因為它天天發生，他才說「不應當」。</p>","exp":"<p>「我們用舌頭頌讚那為主、為父的，又用舌頭咒詛那照著神形像被造的人。頌讚和咒詛從一個口裡出來！我的弟兄們，這是不應當的！」（3:9--10）</p><p>主日早上，這張嘴唱「哈利路亞」；回家的車上，同一張嘴罵孩子、罵司機、罵電視上的政治人物。雅各的論證只有一步：你頌讚的那一位，就是照自己形像造了你所咒詛的人的那一位。罵一個人，等於在畫家面前撕他的畫，嘴上還說「我好愛你的作品」。本系列創世記講義第 1 章講過形像；雅各多出來的一筆是：形像在人人身上，連你最不喜歡的人也是。</p><p>「咒詛」不只是詛咒的話。羞辱、貶低、標籤、在背後把人說成一無是處，都是在對著神的形像吐口水。網路上的酸言、群組裡的嘲諷，雅各都會說：這不是小事，這是對著形像說話。</p><p>「這是不應當的」——雅各沒有說「這是不可能的」。他承認這件事每天都在發生，就在我們身上。這是一面鏡子，不是一根棍子：照出一張分成兩半的嘴，背後是一顆分成兩半的心，也就是 1:8 那個「心懷二意的人」（1:8）。所以解決不在嘴上多加一道鎖，而在把心合成一個：1:18「用真道生了我們」（1:18）的那位神，要從源頭重新生出一張只會祝福的口。</p>"},{"a":11,"z":12,"star":1,"grk":"<p lang=\"grc\">μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;</p><p lang=\"grc\">μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; οὔτε ἁλυκὸν γλυκὺ ποιῆσαι ὕδωρ.</p>","lit":"<p>泉源豈會從同一個孔湧出甜的和苦的嗎？</p><p>我的弟兄們，無花果樹豈能結橄欖，或葡萄樹結無花果嗎？鹹的也不能生出甜的水。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μήτι</td><td>mēti</td><td>豈會……嗎？</td><td>期待否定答案的修辭問句</td></tr><tr><td>ἐκ τῆς αὐτῆς ὀπῆς</td><td>ek tēs autēs opēs</td><td>從同一個孔</td><td>回應 3:10 ἐκ τοῦ αὐτοῦ στόματος</td></tr><tr><td>τὸ γλυκὺ καὶ τὸ πικρόν</td><td>to glyky kai to pikron</td><td>甜的和苦的</td><td>πικρόν 接到 3:14 ζῆλον πικρὸν</td></tr><tr><td>συκῆ ἐλαίας ποιῆσαι</td><td>sykē elaias poiēsai</td><td>無花果樹結橄欖</td><td>主耶穌的樹與果子</td></tr><tr><td>ἁλυκὸν</td><td>halykon</td><td>鹹的</td><td>新約僅此一次</td></tr></table>","gram":"<p><strong>3:11--12 連用兩個修辭問句，都期待否定的答案：</strong>3:11 用 μήτι（mēti），3:12 用 μὴ δύναται（mē dynatai）。讀者只能回答：「不能。」這是第三組平行：3:10 ἐκ τοῦ αὐτοῦ στόματος（ek tou autou stomatos）「同一張口」，3:11 ἐκ τῆς αὐτῆς ὀπῆς（ek tēs autēs opēs）「同一個泉眼」。</p><p>τὸ γλυκὺ καὶ τὸ πικρόν（to glyky kai to pikron）——「苦」這個字三節之後又出現：3:14 ζῆλον πικρὸν（zēlon pikron）「苦毒的嫉妒」。苦水的源頭，雅各馬上就要點名。3:12 從泉轉到樹：συκῆ ἐλαίας ποιῆσαι（sykē elaias poiēsai），無花果樹結不出橄欖；句尾回到水：οὔτε ἁλυκὸν γλυκὺ ποιῆσαι ὕδωρ（oute halykon glyky poiēsai hydōr），鹹水也生不出甜水。三幅畫——泉、樹、水——講的都是同一件事：出來的東西由源頭決定，不由出口決定。</p>","exp":"<p>〔太〕太 7:16--20（馬太講義第 7 章）</p><p>「泉源從一個眼裡能發出甜苦兩樣的水嗎？我的弟兄們，無花果樹能生橄欖嗎？葡萄樹能結無花果嗎？鹹水裡也不能發出甜水來。」（3:11--12）</p><p>上一節說「不應當」，這兩節說「不能」。自然界裡沒有一口泉同時流甜水和苦水，沒有一棵樹同時結兩種果子。雅各的意思是：一張口若同時發出頌讚和咒詛，那不是正常的雙重功能，而是源頭出了問題。</p><p>這是主耶穌的話。「荊棘上豈能摘葡萄呢？蒺藜裡豈能摘無花果呢？」（太 7:16）「好樹不能結壞果子；壞樹不能結好果子。」（太 7:18）雅各沒有說「主說過」，他只是把哥哥的比喻換了幾種果樹，再說一遍。馬太講義第 7 章已講過果子與樹；本卷多出來的一筆是：雅各把它用在<strong>舌頭</strong>上。</p><p>華人常說「刀子嘴，豆腐心」，意思是話雖然狠，心是好的。雅各會溫和地反問：泉源能發出兩樣的水嗎？口裡出來的，總會讓人看見心裡存的是甚麼。這不是要定誰的罪，是要我們不再拿這句俗語替自己的刀子開脫：心若真是豆腐，刀子就會慢慢變鈍。要換的不是嘴，是泉源。</p>"},{"a":13,"z":13,"star":1,"grk":"<p lang=\"grc\">Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.</p>","lit":"<p>你們中間誰是有智慧又有見識的？讓他從美好的品行顯出他的行為，在智慧的溫柔裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν</td><td>Tis sophos kai epistēmōn en hymin</td><td>你們中間誰是有智慧有見識的</td><td>申 1:13 七十士譯本選領袖的字眼</td></tr><tr><td>δειξάτω</td><td>deixatō</td><td>讓他顯出來</td><td>第三人稱命令；2:18 δεῖξόν 同字</td></tr><tr><td>ἐκ τῆς καλῆς ἀναστροφῆς</td><td>ek tēs kalēs anastrophēs</td><td>從美好的品行</td><td>日常的為人處事</td></tr><tr><td>ἐν πραΰτητι σοφίας</td><td>en praytēti sophias</td><td>在智慧的溫柔裡</td><td>1:21 ἐν πραΰτητι 同一片語</td></tr></table>","gram":"<p><strong>3:13 用一個問句重新開題：</strong>Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν（Tis sophos kai epistēmōn en hymin）；σοφὸς（sophos） 與 ἐπιστήμων（epistēmōn） 這一對字，是七十士譯本申 1:13 摩西吩咐選立首領時的用語——雅各在問的是：誰覺得自己夠格作師傅？這就把 3:1 的題目接回來了。</p><p>答案是一個第三人稱命令 δειξάτω（deixatō）「讓他顯出來」，與 2:18 δεῖξόν（deixon）「指給我看」是同一個動詞：第 2 章說信心要顯在行為上，第 3 章說智慧也要顯在行為上。顯在甚麼樣的行為上？ἐν πραΰτητι σοφίας（en praytēti sophias），「在智慧的溫柔裡」。ἐν πραΰτητι（en praytēti） 在 1:21 已經出現：「存溫柔的心領受那所栽種的道」（1:21）。追蹤「信心／行為」一線在這裡翻了一面：行為不只要有，還要有溫柔的樣子。</p>","exp":"<p>「你們中間誰是有智慧有見識的呢？他就當在智慧的溫柔上顯出他的善行來。」（3:13）</p><p>本章前半講舌頭，後半講智慧，3:13 是兩半之間的門。想作師傅的人自認有智慧；雅各說：智慧不是講出來的，是活出來的。一個人懂多少，看他的講章；一個人有多少智慧，看他怎樣對待與他意見不同的人。</p><p>「溫柔」是全節的重音。溫柔不是軟弱，是有力量而不拿來壓人；像一位經驗老到的獸醫，手很穩，所以不用粗。會議上最大聲的人，不一定最有智慧；那個聽完所有人、最後輕輕說一句話讓大家都安靜下來的人，常常才是。</p><p>這也回答了第 2 章留下來的問題：信心要有行為，行為要有樣子。善行若帶著驕傲，還是沒有顯出從上頭來的智慧。所以想教導人的人，第一個功課不是多讀幾本書，是在家裡、在小組裡，先學會溫柔地回答一句反對的話。</p>"},{"a":14,"z":16,"star":2,"grk":"<p lang=\"grc\">εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.</p><p lang=\"grc\">οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·</p><p lang=\"grc\">ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.</p>","lit":"<p>但若你們心裡有苦的熱心和自私的爭競，就不要誇勝，也不要說謊敵擋真理。</p><p>這智慧不是從上頭降下來的，而是屬地的、屬魂的、屬鬼魔的。</p><p>因為哪裡有嫉妒和自私的爭競，那裡就有混亂和一切卑劣的事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ζῆλον πικρὸν</td><td>zēlon pikron</td><td>苦的熱心／苦毒的嫉妒</td><td>ζῆλος 可好可壞；加了「苦」就變質</td></tr><tr><td>ἐριθείαν</td><td>eritheian</td><td>自私的爭競、結黨</td><td>原指受雇拉票的人</td></tr><tr><td>μὴ κατακαυχᾶσθε</td><td>mē katakauchasthe</td><td>不要誇勝</td><td>2:13 κατακαυχᾶται 同字</td></tr><tr><td>ἄνωθεν κατερχομένη</td><td>anōthen katerchomenē</td><td>從上頭降下來的</td><td>1:17 ἄνωθέν</td></tr><tr><td>ἐπίγειος／ψυχική／δαιμονιώδης</td><td>epigeios / psychikē / daimoniōdēs</td><td>屬地的／屬魂的／屬鬼魔的</td><td>三級往下</td></tr><tr><td>ἀκαταστασία</td><td>akatastasia</td><td>混亂、擾亂</td><td>1:8、3:8 ἀκατάστατος 的名詞</td></tr></table>","gram":"<p><strong>3:14 用 εἰ δὲ（ei de） 把鏡頭轉到心裡：</strong>ζῆλον πικρὸν（zēlon pikron）……καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν（kai eritheian en tē kardia hymōn）。ζῆλος（zēlos） 本身是中性的「熱心」，加上 πικρὸν（pikron） 就成了「苦毒的嫉妒」——3:11 苦水的源頭在這裡現形。ἐριθείαν（eritheian） 原指為自己拉票、結黨營私；加 5:20 也把「紛爭」列在肉體的事中。這是本卷追蹤的「私慾」一線換了屬靈的衣服：嫉妒常常打著「為真理熱心」的旗號。</p><p>兩個命令：μὴ κατακαυχᾶσθε（mē katakauchasthe） 與 ψεύδεσθε κατὰ τῆς ἀληθείας（pseudesthe kata tēs alētheias）。κατακαυχᾶσθε（katakauchasthe） 與 2:13 κατακαυχᾶται（katakauchatai） 同字：那裡是「憐憫向審判誇勝」，這裡是嫉妒向真理誇口——同一個「誇勝」，方向相反。</p><p>3:15 用三個形容詞給這種智慧定位，一級比一級低：ἐπίγειος（epigeios）「屬地的」，與 ἄνωθεν κατερχομένη（anōthen katerchomenē）「從上頭降下來的」對立；ψυχική（psychikē）「屬魂的」，指只靠天然生命、沒有聖靈的（這使我們想起林前 2:14 的 ψυχικός（psychikos）；猶 19 ψυχικοί（psychikoi）「屬乎血氣、沒有聖靈」）；δαιμονιώδης（daimoniōdēs）「屬鬼魔的」，新約僅此一次。3:16 的 ἀκαταστασία（akatastasia） 是 1:8、3:8 ἀκατάστατος（akatastatos） 的名詞：心二意、舌不止息、群體混亂，是同一個病的三個階段。</p>","exp":"<p>「你們心裡若懷著苦毒的嫉妒和紛爭，就不可自誇，也不可說謊話抵擋真道。這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的，屬鬼魔的。在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事。」（3:14--16）</p><p>雅各從嘴走進了心。前面講的火，原來是從這裡點著的：苦毒的嫉妒，自私的爭競。散住的小聚會裡，誰來帶查經、誰的意見被採用、誰和長老比較親近——小事裡藏著大火。教會裡的派系很少自稱為派系，它們總說自己是在「維護真理」。雅各拆穿它：嘴裡說為真理，心裡是嫉妒，那就是「說謊話抵擋真道」。</p><p>三個「屬」要讀準。「屬情慾的」原文是 ψυχική（psychikē），「屬魂的」，指靠天然生命、用自己的聰明。<strong>雅各要指出的問題不在頭腦，在源頭。</strong>他不是反對思考、讀書、學術，智慧本身就是他要人求的（1:5）。問題是聰明從哪裡來、為誰服務：同一個好頭腦，可以用來服事人，也可以用來算計人。321 說「用心靠聖靈，不要用腦靠自己」，正是這條界線——不是不用腦，是不只靠自己。</p><p>「屬鬼魔的」接回 3:6「從地獄裡點著的」。嫉妒看起來只是人的小情緒，雅各卻說它背後有另一個國度在搧風。所以對付它不能只靠修養，要回到 4:7「順服神」與「抵擋魔鬼」的次序。</p><p>3:16 是結果：嫉妒和紛爭在哪裡，「擾亂」就在哪裡。一個群體裡若人人都在比較，就不會有安靜；不是因為事情太多，是因為心太亂。雅各不是要人去抓誰在嫉妒，是要每個人先照鏡子：我心裡的火，是從哪裡點的？</p>"},{"a":17,"z":18,"star":3,"grk":"<p lang=\"grc\">ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ἀδιάκριτος ἀνυπόκριτος·</p><p lang=\"grc\">καρπὸς δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.</p>","lit":"<p>但那從上頭來的智慧，首先是純潔的，然後是和平的、寬容的、肯聽從的、充滿憐憫和美好的果子、不分裂的、不假裝的。</p><p>而義的果子，在和平中被種下，為那些締造和平的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ δὲ ἄνωθεν σοφία</td><td>hē de anōthen sophia</td><td>但那從上頭來的智慧</td><td>δὲ：全章的轉折；1:17 ἄνωθέν</td></tr><tr><td>πρῶτον μὲν ἁγνή</td><td>prōton men hagnē</td><td>首先是純潔的</td><td>第一樣，其餘都從它出來</td></tr><tr><td>εἰρηνική／ἐπιεικής／εὐπειθής</td><td>eirēnikē / epieikēs / eupeithēs</td><td>和平的／寬容的／肯聽從的</td><td>三個字頭音相同，連成一串</td></tr><tr><td>μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν</td><td>mestē eleous kai karpōn agathōn</td><td>充滿憐憫和善果</td><td>對照 3:8 μεστὴ ἰοῦ</td></tr><tr><td>ἀδιάκριτος</td><td>adiakritos</td><td>不分裂的、沒有偏見</td><td>1:6、2:4 διακρίνω 的反面</td></tr><tr><td>ἀνυπόκριτος</td><td>anypokritos</td><td>不假裝的</td><td>與 ἀδιάκριτος 押韻作結</td></tr><tr><td>καρπὸς δὲ δικαιοσύνης</td><td>karpos de dikaiosynēs</td><td>義的果子</td><td>1:20 人的怒氣不成就神的義</td></tr><tr><td>τοῖς ποιοῦσιν εἰρήνην</td><td>tois poiousin eirēnēn</td><td>為那些締造和平的人</td><td>太 5:9 εἰρηνοποιοί</td></tr></table>","gram":"<p><strong>3:17 是本章的山峰（地勢 86），句子用 δὲ（de） 與 3:15 對立：</strong>ἡ δὲ ἄνωθεν σοφία（hē de anōthen sophia），「惟獨從上頭來的智慧」（3:17）。ἄνωθεν（anōthen） 回到 1:17：各樣美善的恩賜都是 ἄνωθέν（anōthen）；第 3 章從上頭來的那一樣，是智慧。</p><p>八樣排得很有層次（照和合本把「滿有憐憫」「多結善果」分開算是八樣；原文一個 μεστὴ（mestē） 統管這兩樣，算成七項）。第一樣單獨列出：πρῶτον μὲν ἁγνή（prōton men hagnē），「首先是純潔的」——一顆不二意的心。然後 ἔπειτα（epeita） 帶出其餘七樣：εἰρηνική（eirēnikē）、ἐπιεικής（epieikēs）、εὐπειθής（三個字頭音相同，聽起來像一串鈴聲），μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν（mestē eleous kai karpōn agathōn），最後 ἀδιάκριτος ἀνυπόκριτος（adiakritos anypokritos） 兩個字押韻收尾。μεστὴ（mestē） 是刻意的對照：3:8 舌頭 μεστὴ ἰοῦ（mestē iou）「充滿毒」，3:17 智慧 μεστὴ ἐλέους（mestē eleous）「充滿憐憫」。</p><blockquote><p>ἀδιάκριτος（adiakritos） 是 διακρίνω（diakrinō） 加上否定詞頭。這個動詞在 1:6 是禱告時「疑惑」的人 διακρινόμενος（diakrinomenos），在 2:4 是「偏心待人」διεκρίθητε（diekrithēte）。所以「沒有偏見」不只是公平，是心不再分裂：對神不二意，對人不偏待。本卷追蹤的「判斷」一線，在這裡看見它的反面。3:18 的 καρπὸς δὲ δικαιοσύνης（karpos de dikaiosynēs） 接回 1:20「人的怒氣並不成就神的義」（1:20）；τοῖς ποιοῦσιν εἰρήνην（tois poiousin eirēnēn） 是主耶穌 εἰρηνοποιοί（eirēnopoioi）「使人和睦的人」的拆寫（這使我們想起太 5:9）。</p></blockquote>","exp":"<p>「惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。並且使人和平的，是用和平所栽種的義果。」（3:17--18）</p><p>從 3:6 的谷底到 3:17 的山峰，雅各只用了十一節。同一章裡，火從地獄點著，智慧從上頭降下；舌頭滿了毒氣，智慧滿有憐憫。這是全卷的對照最清楚的一處：<strong>從上頭來的，與從下面來的。</strong>人不能從自己裡面「做」出從上頭來的智慧，只能領受，所以 1:5 說「應當求那厚賜與眾人、也不斥責人的神」（1:5）。</p><p>八樣的次序是一幅畫。「先是清潔」：泉源先乾淨，水才是甜的；心不再二意，舌頭才不會兩樣。「後是和平」：和平不是第一步，和平是清潔的結果。有人為了和平犧牲真理，那不是從上頭來的；有人為了真理犧牲和平，那也不是。從上頭來的智慧先清潔、後和平，兩樣都要。接著是溫良、柔順、憐憫、善果——每一樣都朝向別人。最後「沒有偏見，沒有假冒」：對誰都一樣，裡外都一樣。</p><p>這八樣使我們想起加 5:22--23 聖靈所結的果子：「仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制」（加 5:22--23）。雅各沒有提聖靈的名字，但他描寫的智慧，和保羅描寫的果子，是同一位在人裡面工作的樣子。321 說「聖靈是我的引導」，落在一個人的性格上，就長成這八樣。</p><p>3:18 用農夫的語言收尾：義的果子是在和平中「種」出來的，收成歸給那些締造和平的人。和平不是一句話就到，是一粒一粒種下去，耐心等它長。這是主耶穌「使人和睦的人有福了」（太 5:9）的回音，也是建立屬神體系的氣候：一個教會的空氣若是和平的，那是許多人在背後一次一次選擇了溫柔的話。</p><p>這一章從「不要多人作師傅」開始，到「使人和平」結束。真正的師傅，不是講得最多的人，是讓群體越來越和平的人；他手裡的舵，交給了從上頭來的那一位。</p>"}],"4":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Πόθεν πόλεμοι καὶ πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;</p>","lit":"<p>從哪裡有爭戰，又從哪裡有鬥毆在你們中間？不是從這裡嗎——從你們那些在你們肢體中行軍作戰的快感？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πόθεν</td><td>Pothen</td><td>從哪裡</td><td>連問兩次：找源頭</td></tr><tr><td>πόλεμοι</td><td>polemoi</td><td>戰爭</td><td>長期的戰事</td></tr><tr><td>μάχαι</td><td>machai</td><td>鬥毆、廝殺</td><td>一場一場的衝突</td></tr><tr><td>ἡδονῶν</td><td>hēdonōn</td><td>快感、享樂</td><td>私慾的另一個名字</td></tr><tr><td>στρατευομένων</td><td>strateuomenōn</td><td>行軍作戰的</td><td>現在分詞：仗一直在打</td></tr><tr><td>μέλεσιν</td><td>melesin</td><td>肢體</td><td>戰場在人裡面</td></tr></table>","gram":"<p><strong>本章一開口就是兩個 Πόθεν（Pothen）。</strong>Πόθεν πόλεμοι καὶ πόθεν μάχαι（Pothen polemoi kai pothen machai）：πόλεμοι（polemoi） 是長期的戰爭，μάχαι（machai） 是一場一場的廝殺；一個是氣候，一個是天氣。雅各沒有問「誰先動手」，他問「從哪裡來」——這是追源頭的問題。</p><p>答案用一個期待肯定的反問：οὐκ ἐντεῦθεν（ouk enteuthen），「不是從這裡嗎？」接著指出這裡是哪裡：ἐκ τῶν ἡδονῶν ὑμῶν（ek tōn hēdonōn hymōn）。ἡδονή（hēdonē） 是英文 hedonism 的字根，原指快感、享樂，新約只出現五次，兩次在本章（4:1、3）。1:14 用的是 ἐπιθυμίας（epithymias），這裡換成 ἡδονῶν（hēdonōn）：同一股力量，換一張臉。</p><blockquote><p>τῶν στρατευομένων（tōn strateuomenōn） 是現在分詞，「正在行軍作戰的」；彼得說私慾 στρατεύονται κατὰ τῆς ψυχῆς（strateuontai kata tēs psychēs），「與靈魂爭戰」，同一個動詞。ἐν τοῖς μέλεσιν ὑμῶν（en tois melesin hymōn） 有人讀成「在你們會眾的肢體中」，多數讀成每個人自己的身體與心；兩讀都通，本講義取後者：外面的仗，是裡面的仗打到外面來。</p></blockquote>","exp":"<p>第 3 章剛以「和平」收尾：「並且使人和平的，是用和平所栽種的義果」（3:18）。下一口氣，雅各就問：「你們中間的爭戰鬥毆是從哪裡來的呢？」（4:1）章節是後人分的，雅各的信是一氣寫下來的。他剛講完從上頭來的智慧，馬上把鏡子轉向教會：你們不是缺少道理，你們是在打仗。</p><p>散住的弟兄們遇到甚麼？外面有地主欺壓，裡面有座位之爭（2:2--4）、舌頭點火（3:6）、苦毒的嫉妒（3:14）。雅各不從外面找原因。他不說「因為環境太苦」，也不說「因為那個人太難相處」，他說：「不是從你們百體中戰鬥之私慾來的嗎？」（4:1）</p><p>這是一幅行軍的畫面。私慾在人裡面紮營、調兵、出擊；人和人之間的那場仗，只是裡面那支軍隊開到外面的戰線。像一座城，城外的火是城裡先著起來的。群組裡一句話引發的爭吵，同工會上的冷戰，家裡為一件小事吵到深夜，雅各都問同一個問題：從哪裡來？</p><p>這一節是全卷地勢的第二個低點。雅各沒有替任何一方判輸贏，他做的是更難的事：叫每一個人先往自己裡面看。要停一場仗，先找到那支在自己百體中行軍的隊伍。這是第 4 章的起點，也是這一章要往上走的那條路的第一步。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·</p><p lang=\"grc\">αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.</p>","lit":"<p>你們渴想，卻沒有；你們殺害並且嫉妒，卻不能得著；你們鬥毆又爭戰。你們沒有，是因為你們不求；</p><p>你們求，卻不領受，因為你們惡劣地求，為要在你們的快感中花費掉。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐπιθυμεῖτε</td><td>epithymeite</td><td>你們渴想</td><td>私慾的動詞</td></tr><tr><td>φονεύετε</td><td>phoneuete</td><td>你們殺害</td><td>最重的字，放在最前</td></tr><tr><td>ζηλοῦτε</td><td>zēloute</td><td>你們嫉妒</td><td>3:14、16 的嫉妒</td></tr><tr><td>ἐπιτυχεῖν</td><td>epitychein</td><td>得著、達到</td><td>用盡力氣，卻達不到</td></tr><tr><td>αἰτεῖσθαι</td><td>aiteisthai</td><td>求</td><td>第一個診斷：不求</td></tr><tr><td>κακῶς αἰτεῖσθε</td><td>kakōs aiteisthe</td><td>惡劣地求</td><td>第二個診斷：妄求</td></tr><tr><td>δαπανήσητε</td><td>dapanēsēte</td><td>花費掉</td><td>浪子花盡一切的字</td></tr></table>","gram":"<p><strong>4:2 是三組「想要——得不著」。</strong>ἐπιθυμεῖτε καὶ οὐκ ἔχετε（epithymeite kai ouk echete）；φονεύετε καὶ ζηλοῦτε καὶ οὐ δύνασθε ἐπιτυχεῖν（phoneuete kai zēloute kai ou dynasthe epitychein）；μάχεσθε καὶ πολεμεῖτε（machesthe kai polemeite）。動詞越來越重，結果一樣落空。SBLGNT 把 φονεύετε（phoneuete） 和 ζηλοῦτε（zēloute） 連成一組，和合本「殺害嫉妒」照這個斷句。</p><p>各家對 φονεύετε（phoneuete） 有三種讀法：照字面，指散居群體裡真有流血衝突；比喻，像太 5:21--22 主把動怒算進殺人；或者 1527 年伊拉斯謨推測原文該是 φθονεῖτε（phthoneite）「嫉妒」——這個推測沒有任何抄本支持，本講義不採用。多數解經家取第二讀：雅各用最重的字，叫人看見嫉妒的盡頭。</p><blockquote><p>4:2 末到 4:3 有語態的交替：μὴ αἰτεῖσθαι（mē aiteisthai） 是關身語態，αἰτεῖτε（aiteite） 是主動，κακῶς αἰτεῖσθε（kakōs aiteisthe） 又回到關身。有人從中讀出細微分別，多數認為只是文體變化，不宜讀太深。δαπανήσητε（dapanēsēte） 的目的子句才是重點：求來的東西要 ἐν ταῖς ἡδοναῖς ὑμῶν（en tais hēdonais hymōn） 花掉——ἡδονή（hēdonē） 第二次出現。浪子把一切 δαπανήσαντος（dapanēsantos），同一個動詞。</p></blockquote>","exp":"<p>〔太〕太 7:7--11（馬太講義第 7 章）</p><p>雅各給了兩個診斷。第一個：「你們得不著，是因為你們不求。」（4:2）人想要、搶、爭、鬥，就是沒有開口向神要。主耶穌說「你們祈求，就給你們」（太 7:7），雅各的哥哥早就說過：門是開的。爭戰常常從這裡開始——自己伸手去抓，因為不相信有人會給。</p><p>第二個診斷：「你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中。」（4:3）κακῶς（kakōs） 是「壞地、惡劣地」。問題不在禱告的字句，在禱告的方向：神被當成供應快感的倉庫，求來的東西還沒到手，已經預定要花在自己身上。這樣的禱告，和 4:1 那支在百體中行軍的隊伍是同一支，只是換上了禱告的衣服。</p><p>這兩節不能倒過來用。雅各診斷的是一群在爭戰中的人，他不是說每一個禱告沒有蒙應允的人都是求錯了。保羅三次求主挪去那根刺，得到的回答是「我的恩典夠你用的」（林後 12:9）；客西馬尼園的禱告也有「不要照我的意思」。把 4:3 拿去對一位為病中孩子流淚禱告的母親說「你求錯了」，就是把雅各的手術刀拿去割一個沒有生病的人。</p><p>不求，是不信神會給；妄求，是只要神的東西，不要神。兩個病同一個根：心裡的王位上坐的是自己的快樂。下一節雅各要用更重的話，把這個根挖出來。</p>"},{"a":4,"z":4,"star":3,"grk":"<p lang=\"grc\">μοιχαλίδες οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.</p>","lit":"<p>淫婦們！你們不知道與世界的友誼就是與神的敵意嗎？所以凡是想要作世界朋友的，就被立為神的仇敵。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μοιχαλίδες</td><td>moichalides</td><td>淫婦們</td><td>陰性複數呼格</td></tr><tr><td>φιλία</td><td>philia</td><td>友誼</td><td>新約只此一次</td></tr><tr><td>ἔχθρα</td><td>echthra</td><td>敵意</td><td>與友誼正面相對</td></tr><tr><td>τοῦ κόσμου</td><td>tou kosmou</td><td>世界的</td><td>離開神來排列的價值</td></tr><tr><td>βουληθῇ</td><td>boulēthē</td><td>想要、立意</td><td>問的是心裡選哪邊</td></tr><tr><td>καθίσταται</td><td>kathistatai</td><td>被立為、成為</td><td>身分由選擇定下</td></tr></table>","gram":"<p><strong>4:4 第一個字是 μοιχαλίδες（moichalides），陰性複數呼格，「淫婦們」。</strong>和合本正文譯「淫亂的人」，註腳說原文是淫婦。這不是罵女人，也不是在講某個人的婚外情：全會眾，不分男女，都被稱為一位不忠的妻子。</p><blockquote><p>經文鑑別：SBLGNT（與 WH、NA28）只作 μοιχαλίδες（moichalides）；拜占庭傳統（RP）作 μοιχοὶ καὶ μοιχαλίδες（moichoi kai moichalides），「姦夫淫婦們」。多數鑑別學者判斷，抄寫的人把這個字照字面理解，覺得只罵女人不妥，就補上陽性；較短、較難的讀法較可能是原文。本講義從 SBLGNT。兩讀都保存了重點：這是婚約的語言。</p></blockquote><p>舊約先知一再用這個畫面：「造你的是你的丈夫」（賽 54:5）；「真像妻子行詭詐離開她丈夫一樣」（耶 3:20）；何西阿書第 1--3 章整卷演出來。主耶穌也稱那時代為「一個邪惡淫亂的世代」（太 12:39）。ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ（hē philia tou kosmou echthra tou theou）：φιλία（philia） 對 ἔχθρα（echthra），κόσμου（kosmou） 對 θεοῦ（theou），四個字兩兩對立。這使我們想起 2:23 亞伯拉罕 φίλος θεοῦ（philos theou）「神的朋友」——同一個字根，一個人只能作一邊的朋友。下半句的 βουληθῇ（boulēthē） 是「立意、想要」，καθίσταται（kathistatai） 是「被立為」：還沒做甚麼，心一選邊，身分就定了。</p>","exp":"<p>雅各在這裡突然換了語氣。前三節是診斷，這一節是指控，而且是用先知的指控：「豈不知與世俗為友就是與神為敵嗎？」（4:4）要聽懂這句話，先要聽懂它的畫面。舊約裡，神是以色列的丈夫，拜偶像就是行淫；先知責備的不是百姓不夠有禮貌，是心離開了丈夫。</p><p>所以「世俗」在這裡不是一張禁止清單。雅各書的 κόσμος（kosmos） 是一套離開神來排列的價值：按金戒指排座位（2:2--4）、用舌頭點火（3:6）、為宴樂求東西（4:3）、靠買賣得利來定義明天（4:13）。與世俗為友，是讓這套價值成為我心裡的伴侶；問題不在人在哪裡工作，在心屬誰。</p><p>這一節最容易被拿錯。用 4:4 來羞辱一位會友，或宣布某一種職業、某一類音樂、某一群非信徒朋友就等於「與神為敵」，都不是雅各的意思。同一位雅各說，清潔沒有玷污的虔誠是「看顧在患難中的孤兒寡婦，並且保守自己不沾染世俗」（1:27）：不沾染世俗的人，正是走進世界去照顧人的人。雅各指控的對象是教會自己，是那些在百體中打仗、為宴樂而求的弟兄姊妹——用今天的話說，是我們。散住的弟兄們身在異鄉，最大的危險不是周圍的文化，而是心裡悄悄換了伴侶：用地主富商的眼光看自己，用金戒指的價值排座位。</p><p>這也是一句帶著痛的話。只有丈夫會因為妻子的心不在而痛，陌生人不會。雅各用「淫婦」這個字，是因為他知道神和這群人之間有一份婚約。指控的背後是一份不肯放手的愛；下一節，雅各就要講那份愛有多強。</p>"},{"a":5,"z":5,"star":2,"grk":"<p lang=\"grc\">ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ κατῴκισεν ἐν ἡμῖν;</p>","lit":"<p>或者你們以為經上說是徒然的嗎：「他渴慕至於嫉妒那他使之住在我們裡面的靈」？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κενῶς</td><td>kenōs</td><td>徒然地</td><td>新約只此一次</td></tr><tr><td>ἡ γραφὴ</td><td>hē graphē</td><td>經上</td><td>引的是哪一處？</td></tr><tr><td>φθόνον</td><td>phthonon</td><td>嫉妒</td><td>新約多指人的惡嫉</td></tr><tr><td>ἐπιποθεῖ</td><td>epipothei</td><td>渴慕、戀慕</td><td>主詞是神，還是靈？</td></tr><tr><td>πνεῦμα</td><td>pneuma</td><td>靈</td><td>主格或受格都可</td></tr><tr><td>κατῴκισεν</td><td>katōkisen</td><td>使之居住</td><td>不定過去式：神放進來的</td></tr></table>","gram":"<p><strong>4:5 是全卷最難解的一節，難在三處。</strong>第一是出處：ἡ γραφὴ λέγει（hē graphē legei） 後面那句話，舊約找不到逐字的經文。各家有三說：引自一卷已經失傳的書；概括舊約的意思，這使我們想起「耶和華是忌邪的神，名為忌邪者」（出 34:14；又出 20:5）；或者「經上所說」指向下一節的箴 3:34，中間那句是雅各自己的話。</p><p>第二是主詞：τὸ πνεῦμα（to pneuma） 可以是主格（靈在戀慕），也可以是受格（神戀慕那靈）。第三是 Πρὸς φθόνον（Pros phthonon）：φθόνος（phthonos） 在新約幾乎都指人的惡嫉，祭司長「是因為嫉妒」把耶穌交出來，就是 φθόνον（phthonon）；講神的忌邪，聖經通常用 ζῆλος（zēlos）。由此生出五種讀法：</p><blockquote><p>①神戀慕他使之住在我們裡面的靈，至於嫉妒——神的嫉妒之愛（和合本方向）。②住在我們裡面的人的靈，傾向嫉妒——接回 4:2 的嫉妒。③聖靈戀慕我們至於嫉妒。④照和合本的問號讀成反問：靈會嫉妒地戀慕嗎？不會——他賜更多的恩典。⑤「經上所說」指 4:6 的箴言。經文鑑別：SBLGNT（WH、NA28）作 κατῴκισεν（katōkisen），「使之居住」，主詞是神；RP 作 κατῴκησεν（katōkēsen），「居住」，主詞是靈。前者有較早的抄本支持，也對應和合本「神所賜、住在」。</p></blockquote><p>本講義的判斷：取第一讀。上一節是婚約的語言，下一節是「但他賜更多的恩典」，夾在中間的最可能是丈夫的忌邪之愛；ἐπιποθεῖ（epipothei） 在保羅書信多指深切的想念。但這是一節誠實的解經家都不敢說滿的經文，議題頁並陳五讀。</p>","exp":"<p>「你們想經上所說是徒然的嗎？神所賜、住在我們裡面的靈，是戀愛至於嫉妒嗎？」（4:5）讀到這裡，連最好的解經家也要放慢腳步。講義不假裝這一節很好懂；但在五種讀法之間，有一條線是清楚的：它被放在「淫婦」和「恩典」中間。</p><p>前一節說，與世俗為友就是與神為敵。為甚麼那麼嚴重？這一節回答：因為神不是一位無所謂的神。他把自己的靈放在我們裡面，他就要我們整個人。嫉妒這個字在人身上多半是醜的，因為那是想佔有別人的東西；在丈夫對妻子的那份心裡，它可以是愛的另一面——不肯讓她被別人帶走。神的忌邪不是缺乏安全感，是愛得太滿，容不下分享。</p><p>關鍵字追蹤在這裡轉了一個彎。全卷寫「慾」的字，從 1:14 的私慾、4:1--3 的宴樂，一路都是人的；到了 4:5，ἐπιποθεῖ（epipothei） 的主詞換成了神。全卷最後一個「渴慕」，是神的。人的私慾在百體中行軍，神的渴慕在追回他的妻子。</p><p>講台上不需要把五種讀法都講出來，只要講一句：神不肯和世界分享我們。這句話是嚴厲的，也是安慰的。雅各寫到這裡，已經把人的心照到最暗的地方；下一個字，他要說「但」。</p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.</p>","lit":"<p>但他賜更大的恩典；所以它說：「神與驕傲的人列陣對抗，卻賜恩典給謙卑的人。」</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μείζονα</td><td>meizona</td><td>更大的</td><td>比甚麼更大？</td></tr><tr><td>δίδωσιν</td><td>didōsin</td><td>他賜</td><td>現在式：一直在給</td></tr><tr><td>χάριν</td><td>charin</td><td>恩典</td><td>全卷第一次，一節兩次</td></tr><tr><td>ὑπερηφάνοις</td><td>hyperēphanois</td><td>驕傲的人</td><td>把自己顯在別人之上</td></tr><tr><td>ἀντιτάσσεται</td><td>antitassetai</td><td>列陣對抗</td><td>軍事用字；5:6 同字</td></tr><tr><td>ταπεινοῖς</td><td>tapeinois</td><td>謙卑的人</td><td>低的人；1:9 卑微的弟兄</td></tr></table>","gram":"<p><strong>4:6 用一個 δέ（de） 轉身。</strong>μείζονα δὲ δίδωσιν χάριν（meizona de didōsin charin）：形容詞 μείζονα（meizona） 搶在句首，「更大的」——比甚麼更大？比 4:4--5 的要求更大，比 4:1 那支在百體中行軍的私慾更大。δίδωσιν（didōsin） 是現在式，神一直在給。χάριν（charin） 是全卷第一次出現，而且一節之內出現兩次。</p><p>διὸ λέγει（dio legei） 引的是箴 3:34。雅各照七十士譯本引，只把開頭的 κύριος（kyrios） 換成 Ὁ θεὸς（Ho theos）；彼得引同一句，也照七十士譯本：「神阻擋驕傲的人，賜恩給謙卑的人」（彼前 5:5）。和合本箴言照希伯來文翻譯：「他譏誚那好譏誚的人，賜恩給謙卑的人」（箴 3:34）。</p><blockquote><p>這是兩個版本，不是引錯。希伯來文上半句說神「譏誚」那些譏誚人的，七十士譯本把它譯成神「阻擋」驕傲的人；下半句兩個版本完全相同。譏誚人的，正是把自己放在別人之上的人；兩個版本指向同一個方向。雅各和彼得都用希臘文讀經的教會熟悉的那個版本，這句話就這樣以「阻擋驕傲」的形狀，進入了新約。</p></blockquote><p>ἀντιτάσσεται（antitassetai） 由 ἀντί（anti）「對著」和 τάσσω（tassō）「排列」組成，是排兵布陣的字：神與驕傲的人列陣對峙。5:6 說受害的義人 οὐκ ἀντιτάσσεται ὑμῖν（ouk antitassetai hymin），「他也不抵擋你們」，同一個字——義人不還手，神卻為謙卑的人擺開陣勢。ὑπερηφάνοις（hyperēphanois） 由 ὑπέρ（hyper）「在上」和「顯露」組成：把自己高高顯在別人之上。</p>","exp":"<p>從 1:1 到 4:5，雅各寫了一長串的「要」和「不可」：要以為大喜樂，要行道，不可按外貌待人，要勒住舌頭，不可為友於世俗。讀到 4:5，鏡子已經照出一顆在打仗、在妄求、在不忠的心。如果信在這裡結束，讀的人只剩下羞愧。</p><p>然後是一個「但」：「但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人。」（4:6）鏡頭從人的失敗，轉到神的恩典。前一節說神的愛不肯分享；這一節說神的恩典不會用完。私慾很大，恩典更大；要求很高，恩典更多。全卷到這裡才第一次說出「恩典」這個字，一說就是兩次。</p><p>恩典有一個方向。神不是對所有的姿態都一樣：他與驕傲的人列陣對抗，向謙卑的人伸手。這不是神小氣，是恩典的性質——像水只往低處流。4:1 的私慾在人裡面行軍作戰，4:6 的神也擺開陣勢；人若站在驕傲那一邊，就是站在神的對面。從 4:1 到 4:6，雅各畫的就是驕傲的臉：爭奪、妄求、與世界為友、坐上自己的寶座。</p><p>這一節是全卷地勢的高峰之一，也是全卷的樞紐。雅各從箴言抄下這一句，彼得也抄下同一句；兩位使徒都把它當作教會的根基。讀到這裡，321 才在末端認出來：原來我們團契每天說的那句話——「謙卑是復興的鑰匙；神施恩給謙卑的人，阻擋驕傲的人」——不是我們的發明，是雅各從箴言 3:34 抄給我們的。這句話的前面是一場爭戰，這句話的開頭是「但他賜更多的恩典」。先有恩典，才有謙卑；謙卑不是賺來恩典的工價，是站到恩典流得到的地方。</p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφʼ ὑμῶν·</p>","lit":"<p>所以你們要順服於神；但要抵擋魔鬼，他就必從你們逃跑；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑποτάγητε</td><td>hypotagēte</td><td>要順服、排到下面</td><td>與 4:6 ἀντιτάσσεται 同字根</td></tr><tr><td>ἀντίστητε</td><td>antistēte</td><td>要抵擋、站住對抗</td><td>彼前 5:9 同一個命令</td></tr><tr><td>τῷ διαβόλῳ</td><td>tō diabolō</td><td>魔鬼</td><td>控告者、離間者</td></tr><tr><td>φεύξεται</td><td>pheuxetai</td><td>他必逃跑</td><td>將來式：應許</td></tr></table>","gram":"<p><strong>4:7 由 οὖν（oun） 接上 4:6：既然神賜恩給謙卑的人，所以——。</strong>4:7--10 一口氣十個命令：ὑποτάγητε（hypotagēte）、ἀντίστητε（antistēte）、ἐγγίσατε（engisate）、καθαρίσατε（katharisate）、ἁγνίσατε（hagnisate）、ταλαιπωρήσατε（talaipōrēsate）、πενθήσατε（penthēsate）、κλαύσατε（klausate）、μετατραπήτω（metatrapētō）、ταπεινώθητε（tapeinōthēte），幾乎都是不定過去式命令語氣——不是慢慢培養的習慣，是現在就轉身的決定。</p><p>ὑποτάγητε（hypotagēte） 的字根是 τάσσω（tassō）「排列」，加上 ὑπό（hypo）「在下」：排到神的下面去。上一節神 ἀντιτάσσεται（antitassetai） 驕傲的人，「對著排列」；這一節人 ὑποτάγητε（hypotagēte），「在下排列」。同一個字根，兩個介系詞：人若不排在神下面，就排在神對面。</p><blockquote><p>ἀντίστητε δὲ τῷ διαβόλῳ（antistēte de tō diabolō）：ἀντί（anti） 加 ἵστημι（histēmi）「站立」，站住對抗。彼得在同一處引完箴 3:34 之後，也說「你們要用堅固的信心抵擋他」（彼前 5:9），原文同一個命令；保羅說要穿戴全副軍裝「就能抵擋魔鬼的詭計」（弗 6:11）。καὶ φεύξεται（kai pheuxetai） 是將來式直說語氣：這不是可能，是應許。</p></blockquote>","exp":"<p>「故此，你們要順服神。務要抵擋魔鬼，魔鬼就必離開你們逃跑了。」（4:7）這一節有兩個命令，次序不能顛倒：先順服神，才抵擋魔鬼。</p><p>很多人想直接跳到後半句。抵擋魔鬼聽起來勇敢、屬靈、有力量；順服神聽起來被動、低調、不夠熱血。可是雅各的句子就是這樣排的。一個沒有排到神下面的人去抵擋魔鬼，像一個逃兵獨自去攻城——他不是站在神的陣營裡打仗，是在自己的私慾裡打仗。4:1 的爭戰，就是這樣打不完的。</p><p>魔鬼是 διάβολος（diabolos），控告者、離間者。他最擅長的不是嚇人，是把人和神、人和人分開；4:1--4 的爭戰、嫉妒、與世界為友，都是他的工作現場。怎樣抵擋？雅各沒有給一套儀式，也沒有教捆綁的口訣（屬靈爭戰的範圍見以弗所書立場四）。他給的方法，就是回到神下面的位子；魔鬼要攻的那個驕傲的自己，已經不在王位上了。</p><p>於是應許來了：「魔鬼就必離開你們逃跑了」（4:7）。這是 321 說「無己戰勝撒但」的本文：撒但的戰場是有己，人回到本位，牠就失去了陣地。得勝不是因為人變強了，是因為人站對了位置。像一個孩子站在父親身後，追他的人自然退去；退去的原因，不是孩子的拳頭。</p>"},{"a":8,"z":8,"star":3,"grk":"<p lang=\"grc\">ἐγγίσατε τῷ θεῷ, καὶ ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.</p>","lit":"<p>你們要近前到神那裡，他就必近前到你們那裡。罪人們，要潔淨雙手；兩個魂的人們，要使心純潔。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐγγίσατε</td><td>engisate</td><td>要近前</td><td>祭司近前的字</td></tr><tr><td>ἐγγιεῖ</td><td>engiei</td><td>他必近前</td><td>將來式：神的回應</td></tr><tr><td>καθαρίσατε χεῖρας</td><td>katharisate cheiras</td><td>潔淨雙手</td><td>行為</td></tr><tr><td>ἁμαρτωλοί</td><td>hamartōloi</td><td>罪人們</td><td>不留情面的稱呼</td></tr><tr><td>ἁγνίσατε καρδίας</td><td>hagnisate kardias</td><td>使心純潔</td><td>與 3:17 ἁγνή 同字根</td></tr><tr><td>δίψυχοι</td><td>dipsychoi</td><td>兩個魂的人們</td><td>全卷第二次，也是最後一次</td></tr></table>","gram":"<p><strong>4:8 上半是雙向的動作：ἐγγίσατε τῷ θεῷ καὶ ἐγγιεῖ ὑμῖν（engisate tō theō kai engiei hymin）。</strong>命令語氣接將來式直說語氣：你們近前，他就必近前。ἐγγίζω（engizō） 是祭司的字，希伯來書說靠著更美的指望「我們便可以進到神面前」（來 7:19），同一個字。先知撒迦利亞也有同樣的句型：「你們要轉向我，我就轉向你們」（亞 1:3）。</p><p>下半是一組對稱的平行句：καθαρίσατε χεῖρας ἁμαρτωλοί（katharisate cheiras hamartōloi） 對 ἁγνίσατε καρδίας δίψυχοι（hagnisate kardias dipsychoi）——手對心，罪人對二意的人，潔淨對純潔。這使我們想起詩篇上耶和華山的人「就是手潔心清」（詩 24:4）。手是外面的行為，心是裡面的源頭；雅各兩樣都要。</p><blockquote><p>δίψυχοι（dipsychoi） 是雅各自己造的字（目前所見最早的用例），字面是「二」加「魂」：一個身體裡住兩個魂。新約只出現兩次：1:8 ἀνὴρ δίψυχος（anēr dipsychos） 和這裡。ἁγνίσατε（hagnisate） 與 3:17「先是清潔」的 ἁγνή（hagnē） 同一個字根：從上頭來的智慧第一個樣子是純潔，二意的心被潔淨，就是領受那從上頭來的。</p></blockquote>","exp":"<p>「你們親近神，神就必親近你們。有罪的人哪，要潔淨你們的手！心懷二意的人哪，要清潔你們的心！」（4:8）這是本章的章題，也是全卷主軸的終點。</p><p>全卷的病，在 1:8 就診斷出來了：「心懷二意的人，在他一切所行的路上都沒有定見」（1:8）。一顆心分成兩半，一半向神，一半向世界；第 2 章的偏心、第 3 章一口出兩樣話、4:4 的不忠，都是這顆兩半的心長出來的。到了 4:8，雅各第二次、也是最後一次叫出這個名字，這一次後面接的是藥方：清潔你們的心。</p><p>藥方的位置很重要。它不在全卷開頭，也不是一條可以獨立執行的規條；它緊跟在「親近神」後面。一顆二意的心，不是在書桌前咬牙把自己修好的，是在親近神的時候被清潔的。像一塊放在陽光下的濕布，不是自己擰乾，是被曬乾。關係的次序在這裡很清楚：先與神，然後手和心才跟著乾淨。</p><p>雅各的稱呼很直接——「有罪的人哪」「心懷二意的人哪」。他不是在罵外人，這仍然是寫給「我的弟兄們」的信。可是同一句裡的應許更直接：你們近前，神就必近前。神沒有站在遠處等人變乾淨才肯見面；他說你來，我就來。321 說「用心靠聖靈」，問題常常不在頭腦不夠聰明，在心分成兩半；分開的心，要在神面前才合得起來。</p><p>這也是全卷從上頭來的那一條線在第 4 章的落點：智慧從上頭來（3:17），恩典從上頭來（4:6），連一顆清潔的心也是從上頭來的。人不能從自己裡面做出一顆不二意的心，只能把那顆兩半的心帶到神面前。雅各從 1:8 照出的病，到 4:8 才有了答案；答案不是更用力，是更靠近。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·</p><p lang=\"grc\">ταπεινώθητε ἐνώπιον κυρίου καὶ ὑψώσει ὑμᾶς.</p>","lit":"<p>你們要受苦、要哀慟、要哭泣；你們的笑要轉成哀慟，喜樂要轉成垂頭喪氣。</p><p>你們要在主面前被降卑，他就必高舉你們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ταλαιπωρήσατε</td><td>talaipōrēsate</td><td>要受苦、要愁苦</td><td>5:1 富人的苦難同字根</td></tr><tr><td>πενθήσατε</td><td>penthēsate</td><td>要哀慟</td><td>為罪哀哭</td></tr><tr><td>γέλως</td><td>gelōs</td><td>笑</td><td>新約只此一次</td></tr><tr><td>κατήφειαν</td><td>katēpheian</td><td>垂頭喪氣</td><td>新約只此一次：眼睛往下</td></tr><tr><td>ταπεινώθητε</td><td>tapeinōthēte</td><td>要被降卑、要自卑</td><td>被動命令：把自己交出去</td></tr><tr><td>ὑψώσει</td><td>hypsōsei</td><td>他必高舉</td><td>將來式：主的作為</td></tr></table>","gram":"<p><strong>4:9 三個命令疊在一起：ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε（talaipōrēsate kai penthēsate kai klausate）。</strong>這是先知呼召悔改的語言。ταλαιπωρήσατε（talaipōrēsate） 的同一個字根在 5:1 再出現：Ἄγε νῦν οἱ πλούσιοι（Age nyn hoi plousioi）……ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν（epi tais talaipōriais hymōn），富足人將要臨到的苦難。雅各的意思是：現在在神面前愁苦，好過將來被苦難臨到。</p><p>下半句用第三人稱命令 μετατραπήτω（metatrapētō）：讓笑轉成哀慟，讓喜樂轉成 κατήφειαν（katēpheian）。γέλως（gelōs） 和 κατήφεια（katēpheia） 在新約都只出現這一次；κατήφεια（katēpheia） 原指眼睛往下看——不敢抬頭的羞愧。這使我們想起路 6:25 主說「你們喜笑的人有禍了」，以及路 18:13 那位「連舉目望天也不敢」的稅吏。</p><blockquote><p>4:10 ταπεινώθητε ἐνώπιον κυρίου（tapeinōthēte enōpion kyriou） 是不定過去式被動命令：「要被降卑」，和合本譯「自卑」。被動的形式說出一件事：謙卑不是人表演出來的姿態，是把自己交到主面前讓他放低。καὶ ὑψώσει ὑμᾶς（kai hypsōsei hymas） 的主詞是主。ταπεινοῖς（4:6）與 ταπεινώθητε（4:10）把整段包起來，回應 1:9 Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ（Kauchasthō de ho adelphos ho tapeinos en tō hypsei autou）——卑微的升高。</p></blockquote>","exp":"<p>「你們要愁苦、悲哀、哭泣，將喜笑變作悲哀，歡樂變作愁悶。」（4:9）這句話很容易被讀錯，以為基督徒不可以笑。上下文說得很清楚：這笑是 4:3「浪費在你們的宴樂中」的笑，是心懷二意、與世界為友時那種不在乎的笑。雅各要的不是一張苦臉，是一顆終於為自己的罪痛起來的心。</p><p>這一節也保護了另一群人。雅各在第 1 章說「都要以為大喜樂」（1:2），可是同一位雅各在這裡叫人哭，在 5:13 叫受苦的人禱告。喜樂不是假裝不痛；信徒不必在喪親、病痛、失敗的時候強顏歡笑。主耶穌說「哀慟的人有福了」（太 5:4），雅各的哥哥早就為眼淚留了位子。</p><p>然後是 4:10：「務要在主面前自卑，主就必叫你們升高。」（4:10）這是 4:6 的回聲，也是主耶穌教訓的回聲：「凡自高的，必降為卑；自卑的，必升為高」（太 23:12）。彼得引完箴 3:34，也接著說：「所以，你們要自卑，服在神大能的手下，到了時候，他必叫你們升高」（彼前 5:6）。</p><p>重點在「主就必」。人只管低下去，升高是主的事；而且是在「主面前」低下去，不是在人面前表演謙虛。這使我們想起腓 2:8--9：那一位自己卑微、存心順服以至於死的，神將他升為至高。321 說「反敗為勝」，不是靠技巧翻盤，是走主走過的那條路：先往下，主再把人舉起來。</p>"},{"a":11,"z":12,"star":3,"grk":"<p lang=\"grc\">Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.</p><p lang=\"grc\">εἷς ἐστιν νομοθέτης καὶ κριτής, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ὁ κρίνων τὸν πλησίον</p>","lit":"<p>弟兄們，不要彼此說壞話。那說弟兄壞話或論斷他弟兄的，就是說律法的壞話並論斷律法；但你若論斷律法，你就不是律法的實行者，而是審判者。</p><p>設立律法者和審判者只有一位，就是那能夠拯救也能夠毀滅的；但你是誰，你這論斷鄰舍的？</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καταλαλεῖτε</td><td>katalaleite</td><td>說壞話</td><td>背後往下說人</td></tr><tr><td>κρίνων</td><td>krinōn</td><td>論斷的</td><td>本段 κρίνω 家族六次</td></tr><tr><td>ποιητὴς νόμου</td><td>poiētēs nomou</td><td>律法的實行者</td><td>1:22 行道的人</td></tr><tr><td>κριτής</td><td>kritēs</td><td>審判者</td><td>坐到律法上面</td></tr><tr><td>νομοθέτης</td><td>nomothetēs</td><td>設立律法者</td><td>新約只此一次</td></tr><tr><td>σὺ δὲ τίς εἶ</td><td>sy de tis ei</td><td>但你是誰</td><td>σύ 加強：直指讀者</td></tr><tr><td>πλησίον</td><td>plēsion</td><td>鄰舍</td><td>2:8 要愛的那一位</td></tr></table>","gram":"<p><strong>4:11 用 Μὴ（Mē） 加現在式命令：Μὴ καταλαλεῖτε ἀλλήλων（Mē katalaleite allēlōn），「不要再彼此說壞話」。</strong>καταλαλέω（katalaleō） 是 κατά（kata）「往下、對著」加 λαλέω（laleō）「說」——把人往下說，多半是在背後。這是全卷關於舌頭的最後一個命令，從 1:26 到第 3 章一路講下來的舌頭，在這裡落到弟兄身上。</p><p>4:11--12 兩節裡，κρίνω（krinō） 家族出現六次：κρίνων（krinōn）、κρίνει（krinei）、κρίνεις（krineis）、κριτής（4:11），κριτής（kritēs）、κρίνων（4:12）。邏輯一步一步推：說弟兄壞話、論斷弟兄 → 就是說律法壞話、論斷律法 → 就不再是 ποιητὴς νόμου（poiētēs nomou），而是 κριτής（kritēs）。律法是 2:8「至尊的律法」：「要愛人如己」（2:8）。論斷弟兄，等於宣布這條律法不適用在我身上。</p><blockquote><p>4:12 εἷς ἐστιν νομοθέτης καὶ κριτής（heis estin nomothetēs kai kritēs）：εἷς（heis） 擺在句首，「只有一位」，回應 2:19 的 εἷς ἐστιν ὁ θεός（heis estin ho theos）。σὺ δὲ τίς εἶ（sy de tis ei） 用代名詞 σύ（sy） 加強：「但你——你是誰？」保羅問了同樣的問題：「你是誰，竟論斷別人的僕人呢？」（羅 14:4）末了的 τὸν πλησίον（ton plēsion） 是「鄰舍」，正是 2:8 那條律法要人去愛的人。</p></blockquote>","exp":"<p>〔太〕太 7:1--5（馬太講義第 7 章）</p><p>「弟兄們，你們不可彼此批評。」（4:11）雅各剛講完在主面前自卑，馬上落到最日常的地方：嘴巴。驕傲最常見的樣子，不是篡位稱王，是一句在背後批評弟兄的話。主耶穌說「你們不要論斷人，免得你們被論斷」（太 7:1），雅各把哥哥的話講得更徹底：論斷人的，連律法都一起論斷了。</p><p>為甚麼？因為律法要我愛鄰舍，我卻坐下來審他。那一刻我不再站在律法下面當一個遵行的人，而是坐到律法上面當一個裁判。「設立律法和判斷人的，只有一位，就是那能救人也能滅人的。你是誰，竟敢論斷別人呢？」（4:12）只有能救人的那一位，才有資格定人的罪；我們既不能救人，也就沒有資格坐那個位子。</p><p>這是全本新約對驕傲最生活化的定義。321 說驕傲是「離開本位，抓住權力，想要代替神」；4:12 給了它一張臉：一個人在群組裡、在飯桌上，悄悄坐上了審判官的椅子。4:7 叫人排到神下面，4:12 揭穿人想坐到神的位子上——這是同一件事的兩面。</p><p>但這兩節不是叫教會閉嘴。雅各自己在書末要人去使失迷的弟兄「回轉」（5:19--20）；保羅也說要「用溫柔的心把他挽回過來」（加 6:1）。勸戒與論斷有三個分別：動機——為了把人找回來，還是為了證明自己對？方法——當面、私下、溫柔，還是背後、公開、刻薄？位子——站在弟兄旁邊，還是坐在審判官的椅子上？受害的人說出遭遇、會友提出合理的問題、同工指出制度的錯，都不是雅各禁止的 καταλαλεῖτε（katalaleite）。</p>"},{"a":13,"z":15,"star":2,"grk":"<p lang=\"grc\">Ἄγε νῦν οἱ λέγοντες· Σήμερον ἢ αὔριον πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ποιήσομεν ἐκεῖ ἐνιαυτὸν καὶ ἐμπορευσόμεθα καὶ κερδήσομεν</p><p lang=\"grc\">οἵτινες οὐκ ἐπίστασθε τὸ τῆς αὔριον ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ἐστε ἡ πρὸς ὀλίγον φαινομένη, ἔπειτα καὶ ἀφανιζομένη·</p><p lang=\"grc\">ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος θελήσῃ καὶ ζήσομεν καὶ ποιήσομεν τοῦτο ἢ ἐκεῖνο.</p>","lit":"<p>來吧現在，你們這些說的人：「今天或明天我們要往這座城去，在那裡度一年，又做生意，又賺取；」</p><p>你們這些不知道明天之事的人——你們的生命是怎樣的呢？因為你們是一縷蒸氣，出現片刻，然後就消失了。</p><p>代替你們說的應當是：「主若願意，我們就要活著，也要做這事或那事。」</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἄγε νῦν</td><td>Age nyn</td><td>來吧現在</td><td>5:1 再用一次：新段落</td></tr><tr><td>Σήμερον ἢ αὔριον</td><td>Sēmeron ē aurion</td><td>今天或明天</td><td>時間在我手裡</td></tr><tr><td>ἐμπορευσόμεθα</td><td>emporeusometha</td><td>我們要做生意</td><td>四個將來式都是「我們」</td></tr><tr><td>κερδήσομεν</td><td>kerdēsomen</td><td>我們要賺取</td><td>計畫的終點</td></tr><tr><td>ἀτμὶς</td><td>atmis</td><td>蒸氣、雲霧</td><td>一口氣就散</td></tr><tr><td>Ἐὰν ὁ κύριος θελήσῃ</td><td>Ean ho kyrios thelēsē</td><td>主若願意</td><td>假設語氣：主詞換了</td></tr></table>","gram":"<p><strong>4:13 以 Ἄγε νῦν（Age nyn） 開頭，「來吧，現在」，像拍桌子叫人注意。</strong>5:1 對富足人又用一次，兩段是一組。被叫住的是 οἱ λέγοντες（hoi legontes），「那些說的人」：πορευσόμεθα（poreusometha）、ποιήσομεν（poiēsom
