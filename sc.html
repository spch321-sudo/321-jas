<title>321雅各書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"詳細察看那全備、使人自由之律法","sub":"煉、生、鏡","lv":"A","arc":"全","sec":[["1:1--8","你們落在百般試煉中，都要以為大喜樂：試煉、忍耐與智慧"],["1:9--11","卑微的弟兄升高，就該喜樂：卑微與富足"],["1:12--18","忍受試探的人是有福的：試探從哪裡來"],["1:19--21","你們各人要快快地聽，慢慢地說，慢慢地動怒：領受所栽種的道"],["1:22--27","只是你們要行道，不要單單聽道：鏡子與清潔的虔誠"]],"serm":{"pts":[["在試煉中成全","1:1--11","「你們落在百般試煉中，都要以為大喜樂」——試煉不是神在害你，是要叫忍耐「成功」；缺少智慧就求，那位厚賜的神不斥責人；卑微的升高，富足的降卑"],["試探從自己的私慾來","1:12--18","「但各人被試探，乃是被自己的私慾牽引誘惑的」——私慾懷胎生罪，罪長成生死；但從眾光之父那裡，有一個相反的「生」：他用真道生了我們"],["彎下腰看鏡子","1:19--27","「只是你們要行道，不要單單聽道」——看了就忘的人只是照鏡子；詳細察看全備律法的人，在所行的事上得福：勒住舌頭，看顧孤兒寡婦"]]},"q":"你上一次在禱告裡說「神啊，為甚麼是我？」，是甚麼時候？醫院走廊的長椅上，裁員通知的信箱裡，還是孩子摔門而去之後那一片安靜裡？\n也許你更怕的不是外面的試煉，是裡面的那一個自己：主日唱得最大聲，週一凌晨卻又打開了那個說好不再開的視窗；聽道的時候點頭，散會的路上就忘了。\n這一章要問的是：當苦難從外面壓下來、私慾從裡面拉下去，你手裡有沒有一樣東西，是從上頭來的？你肯不肯在那面照出你本相的鏡子前，彎下腰，並且留下來？","truth":"試煉是神要叫我們成全的路，試探卻是從自己的私慾來；但一切美善的恩賜都從眾光之父那裡降下來，他按自己的旨意，用真道生了我們（1:17--18）。\n所以，被神生下來的人不必只做一個聽了就忘的人：彎下腰察看那全備的律法，留在那裡，讓栽在裡面的道長成一雙看顧人的手（1:25--27）。","mv":{"t":"惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。","r":"雅1:25"},"card":["雅各書是一面鏡子，五章照出一顆心的五個面向：全・行・言・謙・忍。第一章照的是「全」——在試煉裡，這顆心是完整的，還是分成兩半的（1:4「成全、完備」↔1:8「心懷二意」）？全章拎起來是一條路：試煉來了，不要逃，也不要假裝；缺智慧就向神求；試探來了，不要怪神；然後抬頭——一切美善都是從上頭來的，神用真道生了我們；最後彎下腰照鏡子，讓聽見的變成做出來的。","這一章的主詞，在最要緊的地方都是神。神「厚賜與眾人、也不斥責人」（1:5）——他給，而且不嫌你問；神把「生命的冠冕」應許給愛他的人（1:12）；神「不能被惡試探，他也不試探人」（1:13）——他不設局；神從上頭降下各樣美善的恩賜，他自己沒有轉動的影兒（1:17）；最後，神「按自己的旨意，用真道生了我們」（1:18）。人在這一章裡會動搖、會跌倒、會忘記，可是神一直在給、一直沒有變、一直在生。","1:17「也沒有轉動的影兒」，「影兒」原文 ἀποσκίασμα（aposkiasma），全本新約只出現這一次，是光體轉動時投下、會移動的影子。像院子裡的日晷：太陽一走，影子就換了位置，人就照著影子判斷現在幾點。我們讀神，常常就是看日晷——日子順，以為他近；日子暗，以為他走了。雅各說：造光的那一位不在日晷上。影子會轉的是我們的處境，不是他的心；今天你照著影子讀神，就會讀錯時間。","這一章照出一個「心懷二意」的我（1:8），原文是兩個魂的：禱告求神帶領，同時在心裡留一條後路；手機裡一邊是讀經 App 的打卡，一邊是刪了又裝回去的那個東西。也照出一個很會推的我：跌倒了，先說環境太難、別人太壞、神為甚麼讓這種事發生（1:13）。還照出一個很會聽的我——聽了很多年，筆記很厚，鏡子裡的臉卻沒有甚麼改變（1:23--24）。","「他按自己的旨意，用真道生了我們」（1:18）。三節之前，私慾的家譜一路生到死；這一節，換了一位父親、換了一份家譜。這使我們想起約翰說的：「乃是從神生的」（約 1:13）。全章最該記住的，不是「我要更努力」，而是「我是被生出來的」——出身換了。你不是靠咬牙從私慾的家族裡逃出來，是被另一位父親，用他的話，親自生了下來。","這一週選一節經文當鏡子（建議 1:19 或 1:26），每天早上讀一次，晚上睡前再看一次，問自己一句：「今天，我照著做了哪一件？」再做一件看得見的事：在你的通訊錄裡找出一位「在患難中」的人——剛喪偶的長輩、剛失業的同事、一個人在異鄉的移工——這週約一個時間，帶一點吃的，去坐半小時。不必講道，先聽。","最終整合：異鄉，工人宿舍，晚上十一點半。\n上下鋪的燈都關了，只剩他手機那一點光。螢幕上星期摔裂了，一條斜斜的紋，從左上角劃到右下角。\n他離家第四年。寄回家的錢從來沒有少過；可是最近三個月，夜裡那個賭博的網站，他又打開了。\n團契的線上讀經進度是雅各書第一章。他本來想跳過，手指停在一句話上：「但各人被試探，乃是被自己的私慾牽引誘惑的」（1:14）。\n他關掉螢幕。黑下來的玻璃裡，映出一張臉，被那一條裂紋切成兩半。\n他想：這就是心懷二意吧。一半寄錢回家，一半偷偷輸掉。\n他以為下一句會是定罪。他把螢幕再點亮，往下讀：「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的」（1:17）。\n再往下：「他按自己的旨意，用真道生了我們」（1:18）。\n他在被窩裡停了很久。然後他做了兩件很小的事。\n他傳了一則訊息給團契裡的一位弟兄：「我又開始賭了。你可以每天晚上問我一次嗎？」\n他又想起樓下那位清潔工阿姨，上個月她的兒子在家鄉出了車禍，她每天還是照樣拖地。\n第二天早上，他提早二十分鐘下樓，彎下腰，替她把那一桶髒水提到門口。\n裂紋還在螢幕上。可是那一夜以後，那張被切成兩半的臉，開始一點一點，長回同一張臉。\n從上頭來的，他只能領受；而領受的人，會彎下腰。"],"self":"這一章照出來的「有己」，是一顆想兩邊都要的心：要神，也要一條自己留的後路；要恩典，也要把跌倒推給別人。它很會聽，聽完也很會評論，就是不肯讓鏡子碰到自己的臉。\n有己也藏在虔誠裡：聚會不缺、禱告很長，卻在群組裡一句話刺傷人，對樓下那位獨居的老人視而不見。1:26 說這樣的虔誠是虛的——不是因為做得不夠，是因為那一切的中心，仍然是我。","t321":{"k":"耶穌是我的榜樣：這一章的試煉與試探，耶穌自己走過。他「被聖靈引到曠野，受魔鬼的試探」（太 4:1），餌是真的——餅、名聲、萬國的榮華——他沒有咬，因為他活在「神口裡所出的一切話」裡。他在客西馬尼說「我心裡甚是憂傷，幾乎要死」（太 26:38），可見「以為大喜樂」不是假裝不痛；希伯來書說他「因那擺在前面的喜樂，就輕看羞辱」（來 12:2）——喜樂是一個看得見前面的認定。寫這封信的雅各，正是在這位哥哥身上學會的：從前和家人以為他癲狂了，後來只稱自己是「僕人」（1:1）。榜樣不只是教訓，是一張臉。","g":"讓耶穌作王：這一章要人讓出來的，是心裡那第二張寶座。「心懷二意」的人不是不信神，是另外留了一個王——存款、人脈、某一種癮、某一個人的肯定——神作王的時候拜神，神好像不夠快的時候，就回去找那一位。讓耶穌作王，也是讓出審判官的椅子：不再把神拉到被告席上說「我是被神試探」（1:13），也不再坐在讀經的位子上評論經文，而是彎下腰讓經文評論我。聖靈是我的引導，從 1:5 開始：承認我缺，然後求。可以自己檢查：今天如果神說「不」，我第一個想去找的是誰？","p":"建立屬神的體系：1:27 說，清潔的虔誠是「看顧在患難中的孤兒寡婦」——一個群體的屬靈，看它怎樣對待最沒有聲音的人。第一，教會要有一份「患難名單」：喪偶的、剛失業的、獨居的、在異鄉做工的，每一位都有人定期去探望，不是只在喪禮那天出現。第二，小組要成為 1:19 的地方：先聽完、再說話；有人說出自己的試探時，不是立刻定罪，是有人願意每週問一次、陪一段路。第三，把八大步驟放進聚會：聽完道，留五分鐘讓每個人說出「這一週我要行出來的一件事」，下週見面先問這一件——鏡子不是一個人照，是一群人一起彎下腰。"},"grp":["【一、破冰】你早上出門前會照幾次鏡子？最近有沒有一次，是出了門才被人提醒「你臉上有東西」或「衣服穿反了」？當時是誰提醒你、你的反應是甚麼？","【二、扎心】經文說：「心懷二意的人，在他一切所行的路上都沒有定見」（1:8）。說出一件你一面向神禱告、一面又替自己留了一條後路的事——工作、感情、金錢、一個習慣都可以。那條後路叫甚麼名字？你為甚麼捨不得把它拆掉？","【三、福音】讀 1:17--18：一切美善都從上頭來，「他按自己的旨意，用真道生了我們」。在你最近一次跌倒之後，你心裡想到的神，是那位會斥責你的神，還是那位「也不斥責人」、把你生下來的父？如果你知道自己是被他生的，不是被他考的，你今天最想對他說的一句話是甚麼？","【四、行動】說出這一週你要探望的一位「在患難中」的人：他叫甚麼名字、你要哪一天、在哪裡、帶甚麼去。也說出你要每天拿來照的那一節經文，以及你請哪一位組員在週末問你：「那一節，你行出來了沒有？」","【五、代禱】為三種人指名禱告：一位正在試煉裡、眼淚還沒有乾的人（喪親、患病、失業），求主讓他知道可以哭，也可以被抱住；一位正在某種試探或上癮裡掙扎的人，求主給他勇氣說出來，也給他一位願意陪伴的同伴；一位散住在異鄉、孤單做工的弟兄姊妹，求主讓他在團契裡有一個家。"],"prac":{"main":"這一週，在試煉裡認定神是好的，在試探前把餌帶到光中，並且在鏡子前彎下腰、留下來，行出一件事。","items":["對神：每天早上讀 1:17--18 一次，說一句：「我所有美善的，都是你給的；我是你用真道生的。」遇到缺智慧的事，照 1:5 直接開口求，求完寫下來，週末回頭看他怎樣回答你。","對自己：這七天，每一次你想說「都是他害的」「為甚麼是我」的時候，停三秒，問自己：這是試煉，還是我自己的私慾在拉我？把看見的寫下來；如果有一個反覆跌倒的地方，週末把它告訴一位可信任的同伴，請他陪你。","對人：照 1:19 練習一次「先聽完」——找家人或同事好好聽他說話十分鐘，中間不打斷、不給建議、不急著辯解；也去探望一位在患難中的人，帶一點吃的，坐半小時，先聽他說。","對生活：把一個讓你「心懷二意」的東西具體處理掉——刪掉那個 App、取消那個訂閱、把那張信用卡交給配偶保管——並且在手機桌面放一張 1:25 的經文，提醒自己：看見了，就不要走開。","對使命：在你的小組或服事團隊提一個具體安排——整理一份「在患難中」的名單，每人認領一位，這個月至少探望一次；並為一位還不認識主、正在試煉裡的同事或朋友每天指名禱告，求主讓他有一天知道，有一位「厚賜與眾人、也不斥責人」的神（1:5）。"]},"safe":["① 用 1:2「都要以為大喜樂」對剛喪親、剛確診、剛失業的人說：「你要喜樂啊，哭就是沒有交託。」","ἡγήσασθε 是認定，不是假裝的表情；雅各自己在 4:9 叫人哭泣、5:13 叫受苦的人禱告，主耶穌也「哭了」（約 11:35）。要求受苦的人笑，等於叫他在神面前也戴面具，更孤單。","檢驗標準：一位剛從殯儀館回來的人聽完，是覺得可以在神面前哭，還是覺得連難過都要再認罪一次？","② 把 1:13--15 的試探講成罪：「你有那個念頭，就已經犯罪了」，對性的試探、上癮掙扎的人一律定罪。","雅各寫的是一份家譜：私慾「懷了胎」才「生出罪來」；主耶穌自己也「凡事受過試探」（來 4:15）。把念頭等同於罪，掙扎的人會以為自己早已完了，乾脆放棄；他們需要的是陪伴，必要時是專業協助，不是定罪。","檢驗標準：一位正在戒色情或賭博的弟兄聽完，是更敢把試探說出來、找人陪，還是更想藏起來？","③ 反過來，把「試探不是罪」講成可以和試探相處：「只是看看、只是想想，沒關係。」","1:15 說罪「長成」就生出死來；今天容許的餌，明年會長大。這一章同時保護兩種人：掙扎的人不被定罪，玩火的人不被安慰錯了。","檢驗標準：會眾聽完，有沒有人開始具體地把一個餌移出生活，或告訴一位同伴？","④ 把 1:22--25「要行道」講成靠行為得救：「你行得不夠，就不是真的信。」或用來恐嚇為自己不夠好而焦慮的人。","雅各先說「他按自己的旨意，用真道生了我們」（1:18），行道是那「所栽種的道」在裡面長出來，不是贖價；把它講成考試，焦慮的人只會更懷疑得救（全卷立場見 ISS00_2）。","檢驗標準：一位一直覺得自己行得不夠的人聽完，是更確知恩典，還是又多了一張不及格的成績單？","⑤ 反過來，把恩典講成「只要信，怎樣活都可以」，讓 1:22 變成可有可無的建議；或說雅各書是「稻草書信」，不必認真。","雅各說只聽不行是「自己欺哄自己」——算錯了帳；路德的評語是與其他書信比較，他仍把雅各書留在聖經裡（ISS00_8）。沒有行為的信心不是更純的信心，是一面看了就忘的鏡子。","檢驗標準：一位聽道多年、生活毫無改變的人聽完，有沒有被刺痛，開始想這一週要行出哪一件事？","⑥ 用 1:9--11 仇富或美化貧窮：「有錢人都會像草一樣枯乾」「窮人比較屬靈」。","雅各給窮的、富的都一個喜樂的理由：卑微的誇升高，富足的誇降卑；錢財不是罪，錯在讓錢定義自己。仇富會讓富足的弟兄姊妹覺得教會只要他的奉獻、不要他的人；美化貧窮會讓教會不去看顧真正缺乏的人（全卷立場見 ISS00_3）。","檢驗標準：講完之後，富足的人與貧窮的人，是不是都被同一位神重新排過了位置，而不是彼此多一層眼光？","⑦ 只講 1:9 的「升高」，卻不照教會自己的偏心：講台說「窮人在神面前是王子」，座位、職分、發言權卻照奉獻與學歷排。","1:9--11 是第 2 章「按外貌待人」的前奏；先照自己，再講別人，否則這一段會變成好聽的口號。","檢驗標準：這一週教會的門口、司琴與領會的名單、小組長的人選，有沒有一位低薪、口音不同的弟兄姊妹？","⑧ 把 1:27「保守自己不沾染世俗」講成隔離主義：不要和非信徒做朋友、不要碰任何文化、只待在教會裡最安全。","雅各的次序是先走出去「看顧在患難中的孤兒寡婦」，再保守自己；不沾染的人，是走進患難的家、自己卻沒有被世界的價值染色的人。主耶穌也禱告「我不求你叫他們離開世界」（約 17:15）。","檢驗標準：會眾聽完，是更想躲進教會，還是更願意帶著乾淨的心，走進一個有需要的家？","⑨ 反過來，把 1:27 只講成社會服務，把「不沾染世俗」當成過時的話：「做好事就是信仰，生活怎樣沒關係。」","1:27 兩個不定詞並列——往外探望、往內保守——取一個丟一個，都不是雅各的虔誠；虔誠的根是「在神我們的父面前」。","檢驗標準：教會的關懷事工，是被神的話推動、同時讓服事的人自己更聖潔，還是變成一份與神無關的公關？","⑩ 用 1:26「勒住舌頭」叫人閉嘴：叫受害者不要再提、叫提問的人不要多問、叫指出問題的同工「不要破壞合一」。","勒馬不是割掉馬的舌頭；被勒住的是刻薄、論斷、搬弄的話，該說的真話仍要在溫柔裡說出來。拿這一節消音，會讓教會裡受傷的人再受一次傷，也讓真正需要被處理的事被蓋住（全卷立場見 ISS00_5）。","檢驗標準：一位曾經在教會裡受傷、鼓起勇氣說出來的人聽完，是覺得被保護，還是覺得被叫閉嘴了？","⑪ 用 1:5--8「一點不疑惑」責備禱告沒有得著的人：「你求不到，是因為你心裡有懷疑。」","雅各說的疑惑是「兩個魂的」——兩邊都要、不肯結案，不是心裡有問號；主耶穌沒有拒絕說「我信，但我信不足」的父親（可 9:24）。把沒得著歸罪於禱告的人，會讓長期等候的人不敢再禱告（議題見 ISS01_4）。","檢驗標準：一位為家人禱告多年、還沒看見改變的人聽完，是更敢繼續求，還是覺得自己連禱告都不及格？","⑫ 用 1:13 一刀切：「你遇到的一切試煉都不是從神來的」，或反過來「這場病是神在試探你」。","同一個字 πειρασμός 在 1:2 是試驗、在 1:13 是引誘；神「要試驗亞伯拉罕」（創 22:1），卻從不引人犯罪。講成全不相干，受苦的人找不到神；講成神設局，受苦的人不敢靠近神（議題見 ISS01_6）。","檢驗標準：會眾聽完，是更確信神在試煉中要成全他，同時也確知神不會設局害他？","⑬ 用處境取消原則：「這是寫給一世紀散居猶太人的，跟我們無關」；或把處境硬搬：把 1:1 的十二支派講成今日某個民族、某個宗派才是「真以色列」。","書信三問要走完：處境是一群散居異鄉、貧窮受欺壓的信徒；原則是一切美善從上頭來、神用真道生了我們，所以在試煉裡成全；今天的落點是每一個在異鄉、在職場、在病床旁的人（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，能不能說出一個「散住」的處境就是自己的處境，並且說出從上頭來的那一樣是甚麼？","⑭ 用 1:1 雅各的僕人身分講成「你們也要放下一切頭銜」，卻在講台上大談雅各「主的兄弟」的三種說法、論斷別的宗派。","「主的兄弟」三說只在議題頁並陳（ISS00_6）；講台要講的是各說都同意的事：曾經不信的弟弟，後來只稱自己是僕人。把無己講成一場考據辯論，就把雅各自己放下的東西又撿了回來。","檢驗標準：會眾走出去，記得的是雅各的家譜考據，還是那一位叫弟弟變成僕人的哥哥？"]},{"n":2,"t":"信心因著行為才得成全","sub":"座、死、友","lv":"A","arc":"行","sec":[["2:1--7","你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人：會堂的門口"],["2:8--13","要愛人如己：至尊的律法與憐憫"],["2:14--19","若有人說自己有信心，卻沒有行為：說出來的信心"],["2:20--26","信心因著行為才得成全：亞伯拉罕與喇合"]],"serm":{"pts":[["金戒指與骯髒衣服","2:1--7","「這豈不是你們偏心待人，用惡意斷定人嗎？」——信奉榮耀的主，眼光就不能被金戒指改變；神揀選了世上的貧窮人，叫他們在信上富足"],["憐憫向審判誇勝","2:8--13","「憐憫原是向審判誇勝」——至尊的律法是愛人如己；按外貌待人便是犯罪；要照使人自由的律法說話行事"],["信心長出手來","2:14--26","「信心若沒有行為就是死的」——說出來的信心救不了飢寒的弟兄；亞伯拉罕與喇合的信心都有手：白白得來的生命，是活的"]]},"q":"上一次線上聚會，誰的鏡頭被放大？誰一開麥克風，主持人就說「時間差不多了」？事奉名單上、小組長的人選裡、聚餐那張主桌旁，我們有沒有悄悄照著頭銜、學歷、奉獻和口音在排？\n另一頭，有一個人整夜睡不著：我做得那麼少，我真的得救了嗎？還有一個人很安穩：我信了，飢寒的弟兄是他自己的事。\n這一章要問的是：你口中那個「我信」，是一句說得很漂亮的話，還是一雙會伸出去的手？雅各不是要拿走你的平安，他要問的是——你的信心，是活的嗎？","truth":"叫人得救的信心是白白領受的，卻從來不是孤單的：它在門口長出眼睛，在飢寒的人面前長出手，像亞伯拉罕與喇合那樣被看見（2:1–4、14–26）。\n保羅說「白白的」，雅各說「活的」——救恩是白白得來的，但白白得來的生命，是活的；而這活的生命，是活在「憐憫原是向審判誇勝」的那一位手中。","mv":{"t":"可見，信心是與他的行為並行，而且信心因著行為才得成全。","r":"雅2:22"},"card":["雅各書這面鏡子照「全・行・言・謙・忍」五面，這一章照的是「行」：一顆心走到弟兄的需要前面，長不長得出手。先是會堂門口的眼睛（2:1–7），再是屬王的律法與憐憫（2:8–13），最後是說出來的信心與活的信心（2:14–26）。全章拎起來是一句：「可見，信心是與他的行為並行，而且信心因著行為才得成全」（2:22）。","這一章不只在要求人。是神「揀選了世上的貧窮人，叫他們在信上富足」（2:5），把世界的價目表整張翻過來；是神把他的名呼叫在我們身上，叫我們成為屬他的人（2:7）；是神在亞伯拉罕甚麼都還沒做的那一夜，就算他為義（2:23），又叫他「神的朋友」。這一章從上頭來的那一樣是憐憫：「憐憫原是向審判誇勝」（2:13）。我們手上能給出去的憐憫，都是先從他那裡領受的。","2:22「才得成全」，原文 ἐτελειώθη（eteleiōthē），和 1:4「使你們成全」的 τέλειοι（teleioi）同一個字根。雅各在這裡把「全」與「行」兩篇接起來：試煉叫人走到神要的終點，行為叫信心走到它的終點。這改變今天的讀法：行為不是替一個有缺口的信心補洞，是一顆種子長到結果子的那一天。你不必用行為去證明自己夠格；你只是讓已經活了的信心，長到它本來要長成的樣子。","這一章照出兩個我。一個在門口：眼睛比心先動，對有頭銜的人多說三句話，對口音重的人點個頭就走；看見有需要的人，第一個反應是傳一句「為你禱告」，然後把手機蓋起來。另一個在床上：把 2:14 讀成判決書，量自己做得夠不夠，越量越怕。兩個我看的都是自己——前一個忘了信心要有手，後一個忘了「他按自己的旨意，用真道生了我們」（1:18）。","「憐憫原是向審判誇勝」（2:13）。全章最該被記住的，是這一句把門口的審判官請下了座位。在 2:4 我們「用惡意斷定人」，自己坐上審判席；到了 2:13，審判席上最後說話的不是審判，是憐憫。一個記得自己被憐憫過的人，就沒有辦法再替別人排座位。這也是行為的源頭：不是咬牙去做善事，是被憐憫的人，手自然伸出去。","這一週做一件具體的事：在你的教會或小組裡，找出一位常被「安排在後面」的人——外籍移工、看護、口音重的新朋友、沒有頭銜的長輩。不是請他吃一頓飯就算了，是請他在下一次聚會裡讀一段經文、分享一句話，或一起擔一樣服事。然後問自己：這一週，我的「平平安安地去吧」，後面有沒有一雙手？","最終整合：主後四十多年，地中海邊一座城。散居的猶太信徒，在一間租來的小屋裡聚集——他們叫它「會堂」。\n天快黑了，信讀到第二章。\n門開了。進來一個短工，從葡萄園回來，滿身塵土。地主今天又扣了他的工錢。\n前排還有空位。招待的人看了他一眼，手往牆邊一指。\n讀信的人正好讀到：「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）\n屋子裡很安靜。\n一位老人站了起來。年輕的時候，他也曾經是那個被指到牆邊的人；後來有人在耶路撒冷，為他擺了一張桌子。\n他走到門邊，把自己的位子讓出來，又解下肩上的外衣，披在短工身上。\n讀信的人讀下去：「憐憫原是向審判誇勝。」（2:13）\n沒有人說話。可是那一晚，每個人都看見了信心長甚麼樣子。\n它不是一句「平平安安地去吧」。\n它是一張讓出來的椅子，一件披上去的外衣。\n老人並沒有因為讓座才得救；他是得救的人，所以站了起來。\n白白的，也是活的。"],"self":"這一章照出來的「有己」，第一種穿著禮貌的衣服：我沒有罵誰，只是眼睛自動替人分了等級；我只是說了一句祝福，沒有多做甚麼——心裡分成兩半，一半說「我信榮耀的主」，一半盯著金戒指。\n第二種有己穿著敬虔的衣服：把信心縮成一個我同意的句子，又把行為變成一張成績單，不是拿它驕傲，就是拿它焦慮。兩種人的中心都是我，而雅各要我們看的，是那位揀選窮人、又向審判誇勝的神。","t321":{"k":"耶穌是我的榜樣：2:1 稱他為「我們榮耀的主耶穌基督」，而這位榮耀的主在地上，偏偏常常坐錯位子——他和稅吏、罪人一同吃飯，讓一個被城裡的人看不起的女人靠近他的腳，看見客人搶首位就說了一個坐席的比喻。他沒有先問一個人帶不帶金戒指，他先問那人缺甚麼。他的信心從來不是一句漂亮的話：他摸痲瘋病人，餵飽五千人，最後把自己給出去。學他，是讓我的眼睛照他的眼睛重新排一次座位。","g":"讓耶穌作王：2:8 的「至尊的律法」，原文是屬王的律法——那是王自己頒布、王自己活出來的「要愛人如己」。這一章要人讓出來的位子有兩個：一個是門口的帶位權，誰坐前面、誰站後面，不再由我的眼睛決定；一個是 2:4 的審判官席位，我不再憑一件衣服、一個口音、一份履歷判人的價值。讓耶穌作王，就是讓王的眼光成為教會門口唯一的價目表：在他的國裡，世上貧窮的人是承受國的人（2:5）。","p":"建立屬神的體系：體系的門口最誠實。一間教會怎樣排座位、怎樣定事奉名單、誰的名字在報告裡被唸出來，比講台上說了甚麼更能顯出它信的是甚麼。321 說「人比事重要、關係比東西重要」，2:2–4 就是全本新約最具體的一幕：金戒指和骯髒衣服是東西，走進門的兩個人才是人。建立一群人，要從制度上把偏心拆掉——招待的訓練、輪流的分享、讓外籍弟兄姊妹進入同工團隊，讓每一個「2」都可能是剛下班、沒有頭銜的人。"},"grp":["【一、破冰】你有沒有過一次，走進一個場合，一看座位就知道自己「算哪一等」？（婚宴、尾牙、家族聚餐、開會）那一刻你心裡在想甚麼？","【二、扎心】經文說：「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）在我們的小組或教會裡，說出一個你自己會不自覺「分等級」的地方——對誰的訊息回得特別快？誰說話你比較不耐煩？（帶領者提醒：只說自己，不點名別人。）","【三、福音】讀 2:13 與 2:23：亞伯拉罕在甚麼都還沒做的那一夜，就被神算為義；「憐憫原是向審判誇勝」（2:13）。說出一件你知道自己被神憐憫過的事。當你想到自己是被白白接納的，你看那些「坐在後面的人」的眼光，會有甚麼不同？","【四、行動】說出一位這一週你要主動接近的人（名字或身分：外籍移工、看護、新朋友、沒人搭理的長輩），哪一天、在哪裡、你要為他做的一件具體的事——不是一句「為你禱告」，而是一頓飯、一個座位、一次接送、一份實際的需要。","【五、代禱】為三種人指名禱告：一位在教會裡常被忽略的外籍移工或看護，求主讓他在我們中間被叫名字、被接納；一位為自己行為不夠好而焦慮、懷疑自己是否得救的弟兄姊妹，求主讓他聽見「用真道生了我們」的恩典；一位正缺日用飲食的家庭，求主讓我們成為他禱告的回應。"],"prac":{"main":"這一週，讓我的信心長出眼睛和手：看見被排在後面的人，並且伸手。","items":["對神：每天早上讀 2:13 一次，說出昨天一件你被神憐憫的事，禱告：「主啊，你沒有照我的衣服待我，求你讓我今天也不照別人的衣服待人。」晚上問自己：今天我的眼睛替誰排了座位？","對自己：如果你常為「我做得不夠，是不是沒有得救」而不安，這週把 1:18 和 4:6 寫在卡片上放在床頭，睡前讀出來：新生命是神生的，他賜更多的恩典。如果你是另一種人，信得很安穩卻很久沒有伸手，就求主指給你看一位你一直繞過去的人。","對人：這週對一位你平常只點頭的人——大樓清潔阿姨、公司的外包同事、教會的外籍看護——叫出他的名字，問一個關於他的問題，聽他說完。若他有實際的缺乏，在你能力範圍內做一件事，不只說一句祝福。","對生活：檢查一下你家族聚餐、公司會議、群組回覆的「座位表」：你對老闆和對基層的語氣一樣嗎？這週刻意把最好的一次回應、最耐心的一次聆聽，留給一位不能回報你的人。","對使命：在你的小組或事工團隊，提出一件具體的改變：讓外籍弟兄姊妹或新朋友輪流讀經、分享，或排進服事名單；也為一位還不認識主的同事禱告，求主讓他先從你的手，看見你口中的那位主。"]},"safe":["① 把 2:14–26 講成靠行為得救：「你沒有行出來，就證明你沒得救」「先把行為做夠，神才接納你」。","雅各問的是「若有人說自己有信心」（2:14）的那一種，不是一位真心倚靠神、卻常覺得自己做不夠的人；他自己相信「用真道生了我們」（1:18）、「他賜更多的恩典」（4:6）。講成行為換救恩，會把為自己不夠好而焦慮的人推進更深的懷疑，也把雅各推回律法主義（紅線一；全卷立場見 ISS00_2）。","檢驗標準：一位為「我是不是沒有得救」而失眠的弟兄姊妹聽完，是更確知恩典，還是更想去數自己的善行？","② 反過來，把這一段講輕：「我們是因信稱義的，雅各說的跟我們無關」「只要信，怎樣活都沒關係」，或順口說「路德說這是稻草書信，不必太認真」。","雅各要刺痛的正是那個冷眼看飢寒弟兄、卻說自己信得很好的人；把沒有行為的信心講成合格的信心，等於讓「因信稱義」變成冷漠的藉口，那是廉價恩典。路德的評語是與其他書信比較，他仍把雅各書留在聖經裡（全卷立場見 ISS00_2、ISS00_8）。","檢驗標準：一位很久沒有為任何飢寒的人伸過手的會友聽完，有沒有被刺痛？","③ 在講台上嘲諷路德「看不懂雅各書」，或嘲諷天主教「靠功德得救」，用別人的錯襯托自己的正確。","這一題歷代教會都認真處理過：路德早年的評語、加爾文的讀法、天特會議的立場，都只陳列，不嘲諷；嘲諷別的傳統，正是 2:4 那種「用惡意斷定人」，在一章講偏心的經文裡最不相稱（全卷立場見 ISS00_2、ISS00_8）。","檢驗標準：一位從天主教或信義宗背景來的朋友坐在會眾席上，聽完覺得被尊重，還是被當成笑話？","④ 只照外面的社會，不照教會自己：大談社會的貧富不均、有錢人的傲慢，卻不問我們按奉獻、學歷、職業、國籍、口音安排了誰的座位與事奉。","雅各說的是「你們的會堂」「你們偏心待人」（2:4）——先照的是教會自己的門口。把矛頭指向外面，會讓會眾聽完更義憤，卻沒有一個人回頭看自己的事奉名單（紅線四；全卷立場見 ISS00_3）。","檢驗標準：這一篇講完，你的教會有沒有一件具體的安排——座位、名單、輪流分享——因此改變？","⑤ 把這一章講成仇富：「有錢人都是欺壓人的」「穿得體面就是驕傲」，或讓富裕的會友整篇被當成靶子。","雅各譴責的是偏心的眼睛，不是帶金戒指的那個人；他要的不是換一批人坐前排，是換掉看人的眼光。仇富一樣是按外貌待人，只是方向反過來（紅線四；全卷立場見 ISS00_3）。","檢驗標準：一位生意做得很大的弟兄聽完，是覺得被定罪，還是被邀請把自己的資源，用在被排在後面的人身上？","⑥ 把 2:5 講成美化貧窮或自動得救：「窮人比較屬靈」「貧窮的人都會進天國」，或用它勸人安於被剝削。","2:5 說的是神揀選貧窮人「在信上富足」——是一個交換，不是說貧窮本身是美德；同一封信在 5:4 為被扣工錢的人伸冤。美化貧窮，會讓教會對真實的缺乏不再著急（紅線四；全卷立場見 ISS00_3）。","檢驗標準：聽完的人，是更安心地讓窮人繼續窮，還是更願意為他們的日用飲食伸手？","⑦ 用處境取消原則：「這是一世紀會堂的座位問題，我們今天沒有腳凳」；或把原則講得太空：「我們要愛所有人」，不落到任何一張具體的椅子。","書信三問要走完：處境是散居、貧窮、被富足人拉上公堂的信徒；原則是信奉榮耀的主，就不能按外貌待人；今天的落點是線上聚會的發言順序、事奉名單、外籍移工的星期天（全卷立場見 ISS00_1）。","檢驗標準：會眾走出去，能不能說出這一週在哪一個場合、對哪一個人改變眼光？","⑧ 把 2:10 講成「所有的罪都一樣大，偷一支筆和殺人沒有分別」，或用它壓垮一個敏感的良心：「你只要有一條沒守，就全完了。」","雅各說的是律法是一整件、頒布律法的是同一位，目的在拆掉「我守了大部分」的驕傲，把每個人帶到需要憐憫的位置（2:13），不是取消罪的輕重；主耶穌自己也說過有罪更重的（約 19:11）。","檢驗標準：一位為小錯自責不已的人聽完，是更絕望，還是更快地跑向憐憫？","⑨ 把 2:13 講成「多做善事、多憐憫人，就可以抵銷審判」，把憐憫變成功德帳本。","憐憫向審判誇勝，是因為憐憫先從神那裡來；一個常常憐憫人的人，自己就是活在憐憫裡的人——他的憐憫是領受過憐憫的證據，不是贖價。講成交易，會讓行善變成替自己買保險（紅線一）。","檢驗標準：會眾聽完，是更想去累積分數，還是更記得自己先被憐憫過？","⑩ 用 2:15–16 逼人奉獻或加班服事：「你不來服事、不奉獻建堂，你的信心就是死的。」","雅各的例子是給赤身露體、缺了日用飲食的弟兄姊妹吃穿，是對著人的需要伸手，不是替教會的計畫籌款；拿這兩節綁住人的錢包和時間，是把愛的行為偷換成機構的業績。","檢驗標準：你講完這兩節，會眾第一個想到要幫的，是一個真實缺乏的人，還是教會的預算表？","⑪ 用 2:16 輕看禱告：「為你禱告」都是空話，以後不必說了。","雅各不反對祝福，也不反對禱告——他自己在 5:13–16 叫人禱告；他問的是祝福後面有沒有手。把禱告講成廢話，會讓那些只能禱告、無力給錢的老人家和病人覺得自己的愛不算數。","檢驗標準：一位臥病在床、只能為人禱告的長輩聽完，是覺得被輕看，還是知道他的禱告也是手？","⑫ 把 2:19 講成「教義不重要，做就對了」，或拿「鬼魔也信」嘲笑重視信條的人。","雅各說「你信的不錯」——信條是對的，只是信條停在頭腦裡不夠；他分辨的是同意一個句子與把自己交給一位神。貶低教義，會讓教會失去分辨真假的根基。","檢驗標準：會眾聽完，是更看輕信仰告白，還是更願意讓自己相信的那一句，改變他對門口那個人的態度？","⑬ 用「妓女喇合」羞辱有過去的人，或在講台上拿她開玩笑；反過來，又用 2:25 說「為了好目的說謊也可以」。","雅各和希伯來書都記得她的名字和她的頭銜，正是要讓有過去的人知道：神的家譜裡有她的位子；雅各稱讚的是她接待使者、冒險保護他們的那份信，不是在立一條說謊的倫理（議題見 ISS02_9）。","檢驗標準：一位有不堪過去的姊妹聽完，是更羞恥，還是知道自己也被神的家接納？","⑭ 用亞伯拉罕獻以撒，要人「把最愛的獻上」作為得救的證明，或用它要求人犧牲家人、健康來表明順服。","2:21 的重點是三十多年前那份被算為義的信心，在摩利亞山上被看見；神在山上攔住了他的手，也預備了羊。拿這一幕當作操控的工具，會讓人以為神要的是越痛越好的獻祭。","檢驗標準：會眾聽完，記得的是一位要求越來越多的神，還是一位稱他為朋友的神？"]},{"n":3,"t":"只用小小的舵","sub":"舵、火、和","lv":"A","arc":"言","sec":[["3:1--5","我的弟兄們，不要多人作師傅：嚼環與舵"],["3:6--12","舌頭就是火：從一個口裡出來"],["3:13--18","惟獨從上頭來的智慧，先是清潔，後是和平：兩種智慧"]],"serm":{"pts":[["小小的舵","3:1--5","「只用小小的舵，就隨著掌舵的意思轉動」——教導人的先受更重的判斷；舌頭雖小，卻把全身帶往一個方向"],["從一個口裡出來","3:6--12","「頌讚和咒詛從一個口裡出來！我的弟兄們，這是不應當的！」——舌頭的火是從地獄裡點著的；泉源不能發出甜苦兩樣的水"],["從上頭來的智慧","3:13--18","「惟獨從上頭來的智慧，先是清潔，後是和平」——苦毒的嫉妒是屬地、屬情慾、屬鬼魔的聰明；使人和平的，收的是義果"]]},"q":"你手機裡，有沒有一則打好了、還沒按送出的訊息？也許是對同工的不滿，也許是對家人的一句重話，也許只是在群組裡想「補一刀」的那一句。\n你也可能是另一個人：說出自己受的傷之後，被人勸「勒住舌頭」「不要再提了」，從此不敢開口。\n這一章要問的是：舌頭的舵，現在握在誰手裡？如果泉源不換，你能靠咬緊牙關，讓口裡只出甜水嗎？","truth":"舌頭雖小，卻把整個人、整個群體帶往一個方向；它的火從地獄點著，沒有人能靠自己制伏（3:5--8）。\n所以要換的是泉源：從上頭來的智慧，先是清潔，後是和平——不是咬牙做出來的，是向那厚賜、不斥責人的神求來的（3:17；1:5）。","mv":{"t":"惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。","r":"雅3:17"},"card":["全卷五篇「全・行・言・謙・忍」，這一章照的是「言」——鏡子照到了口。雅各先畫一個舵：舌頭小，卻定方向；再點一把火：舌頭從地獄點著，頌讚和咒詛竟從同一個口裡出來；最後指向泉源：從上頭來的智慧。全章拎起來一句話：口的問題是心的問題，心的問題要從上頭得醫治。","這一章的主詞看起來都是人：人教導、人說話、人咒詛。可是雅各每一筆都指向神。人被造，是「照著神形像」（3:9）——神把自己的樣子放在你最不喜歡的那個人身上；人做不到的，神從上頭降下來：智慧「從上頭來」（3:17），正如各樣美善的恩賜「都是從上頭來的」（1:17）。舌頭沒有人能制伏，神卻能換掉泉源。","3:17「溫良柔順」的「柔順」，原文 εὐπειθής（eupeithēs），新約只出現這一次，字面是「容易被說服、肯聽勸」。它和 3:3 嚼環「叫牠順服」的 πείθεσθαι（peithesthai） 同一個字根。這改變今天的讀法：從上頭來的智慧，不是最會說服人的那一種，是自己肯戴上嚼環、肯被說服的那一種。一個肯聽勸的人，舌頭已經有了舵。","這一章照出一張分成兩半的嘴：主日在詩歌裡頌讚，週間在群組裡冷嘲；對外人客氣，對家人最狠。也照出一顆會替自己辯護的心：說是「為了真理」，底下是苦毒的嫉妒；說是「我比較直」，其實是不肯讓舌頭被勒住。最難看見的是：我常常把說出口的話當成小事，卻把別人說我的話記了好多年。","「先是清潔，後是和平」（3:17）——次序不能顛倒。想把關係修好的人，常常急著先去「講和」；雅各說，先回到泉源。開口以前，先到神面前把那口井洗一洗：我現在要說的這句話，是為了把人找回來，還是為了證明我對？泉源清了，和平才是真的，不是暫時把火蓋住。","這一週做一件事：任何帶著情緒的訊息，打好以後先不送出，等一個晚上；第二天早上禱告一句「主，舵在你手裡」再讀一次，能當面說的就約見面，不能當面說的就不要在群組裡說。另外，找一位你曾經用話傷過的人——配偶、孩子、同工——說一句具體的道歉，說出那一天、那一句話。","最終整合：晚上十一點四十分，同工群組。\n她打了很長一段話。從上個月的那一次分工講起，講到誰總是搶功，誰總是在牧師面前說得好聽。每一句都是真的。\n大拇指停在送出鍵上。\n群組裡有三十七個人。其中一個，是她當年帶信主的妹妹。\n她想起今天早上讀到的那一句：「舌頭就是火」（3:6）。\n又想起後面那一句：「惟獨從上頭來的智慧，先是清潔，後是和平」（3:17）。\n她沒有按送出，也沒有刪掉。她把那一段話複製下來，貼進禱告本裡，一句一句對主說。\n說到第三句，她停了。原來那件事讓她難過的，不是分工，是她覺得自己不被看見。\n凌晨十二點十分，她只私訊那一位同工：「明天中午有空一起吃飯嗎？有件事我想當面跟你說，也想聽你說。」\n群組那天晚上很安靜。沒有人知道，一場火沒有點起來。\n舵很小。握舵的那一隻手，在一個女人的禱告本旁邊，接過了她的大拇指。"],"self":"這一章照出來的「有己」，藏在一句話後面：我要贏、我要被看見、我要最後一句話是我說的。它會換上屬靈的衣服——「我是為了真理」「我只是比較直」「我只是提出來讓大家代禱」——其實是 3:14 苦毒的嫉妒和紛爭。\n有己也會反過來：自己被說了一句，就記一輩子；自己說了別人十句，卻說「我只是隨口一提」。舌頭的火不是從嘴開始的，是從那個一直想坐上審判官位子的「我」點著的。","t321":{"k":"耶穌是我的榜樣：耶穌的舌頭有時很剛硬，有時很安靜，從來沒有分成兩半。他對假冒為善的人說重話，卻從不為了自己的面子還口；在彼拉多面前，「耶穌仍不回答」（可 15:5）。行淫時被拿的婦人被推到他面前，他一句話讓拿石頭的人散去，又對她說：「我也不定你的罪。去吧，從此不要再犯罪了！」（約 8:11）真理一個字沒有少，人卻被保住了。他是唯一有資格坐審判官位子的人，卻選擇先站在罪人旁邊——這就是 3:17「先是清潔，後是和平」活出來的樣子。","g":"讓耶穌作王：這一章要人讓出來的，是舵——說最後一句話的那個位子。舌頭「隨著掌舵的意思轉動」（3:4），問題只在掌舵的是誰：是我的情緒、我的面子，還是主？3:15 說屬地的智慧是「屬情慾的」，原文 ψυχική，靠天然生命的聰明——321 說「用心靠聖靈，不要用腦靠自己」，正落在這裡：不是不要用頭腦，雅各也叫人求智慧；是頭腦不再自己作王。可以自己檢查：今天你最想說贏的那一場對話，你肯不肯先問主，再開口？","p":"建立屬神的體系：3:1 是對教導的人說的——321 的 235 裡作屬靈父母的「3」，先管好自己的舌頭，因為你說的話，別人會拿去活。一個群體的言語文化，要有三個具體的樣子：第一，群組不是戰場——意見不同，當面私下談；人比事重要，不要為了事傷害人。第二，代禱事項不轉述細節、不轉傳截圖，別人的軟弱不是談資。第三，給說出傷害的人一條安全的路：受害者、提問的人、指出問題的同工被聽見，而不是被要求「不要再提了」。這樣，3:18 的和平才是種出來的氣候，不是蓋住的火。"},"grp":["【一、破冰】你的手機裡，最熱鬧的一個群組是哪一個？那個群組裡，大家最常傳的是甚麼——長輩圖、笑話、工作、還是抱怨？","【二、扎心】經文說：「頌讚和咒詛從一個口裡出來！我的弟兄們，這是不應當的！」（3:10）說出最近一次，你在甚麼時候、對誰，說了一句事後很後悔的話。那句話底下，你心裡真正在意的是甚麼？","【三、福音】讀 3:17 與 1:5：從上頭來的智慧，是向那「厚賜與眾人、也不斥責人的神」求來的。你相不相信，神不嫌你為同一個舌頭的問題，一再回來求？如果不必先把自己修好就能求，你今天想求的是哪一樣——清潔、和平、還是柔順？","【四、行動】說出一位這一週你要用話去修補的人：他是誰、你要說的那一句是甚麼、哪一天、用甚麼方式（當面、電話、親筆）。也說出一個你要先「停一晚再送出」的地方：哪一個群組、或哪一位家人。","【五、代禱】為三種人指名禱告：一位曾被話語深深傷過、至今還聽得見那一句話的人，求主醫治；一位說出傷害卻被要求「不要再提了」的人，求主讓他被聽見；一位正帶領小組或教導主日學的同工，求主保守他的舌頭，也賜他從上頭來的智慧。"],"prac":{"main":"這一週，把舵交回掌舵的那一位：開口以前先回到泉源，先是清潔，後是和平。","items":["對神：每天早上讀 3:17 一次，從八樣裡挑一樣向神求（例如「溫良柔順」），用一句話說：「主，今天我缺少這個，求你從上頭賜給我。」晚上回想今天說過的一句話，帶到主面前，謝恩或認罪。","對自己：這七天，記下每一次你「差一點就說出口」或「已經說出口後悔」的時刻：時間、對象、那陣風是甚麼（被冤枉、被比較、累了）。週末讀一遍，問自己：我最容易在哪一陣風裡放開舵？","對人：找一位你曾經用話傷過的人，具體地道歉，不加「可是」；也找一位常常被忽略的弟兄姊妹，說一句真實、具體的鼓勵——用你的舌頭為他點一盞燈。","對生活：為自己定一條群組守則：晚上十一點以後不發帶情緒的訊息；不轉傳別人的截圖；要指出別人的錯，私下、當面、溫柔，先想清楚是為了把人找回來，還是為了證明自己對。","對使命：在你服事的小組或團隊裡，提議一個具體做法——代禱事項只說需要、不說細節；並為一位被教會裡的話傷過、已經離開的人每天指名禱告，這一週找一個方式問候他，只問候，不追問、不說教。"]},"safe":["① 用 3:1「不要多人作師傅」叫提問的人、年輕同工、姊妹閉嘴：「你還不夠格，不要多講。」","3:1 是對教導者的警告，不是壓制肢體的恩賜；「多人」放在句首，雅各擋的是搶著教，不是開口。新約一樣說要「彼此教導，互相勸戒」（西 3:16），用 3:1 消音，等於把聖靈給肢體的恩賜壓下去（全卷立場見 ISS00_5）。","檢驗標準：講完 3:1，小組裡最安靜的那一位，是更怕開口，還是更知道開口時帶著甚麼重量？","② 用「勒住舌頭」叫受害者「不要再提了」：被言語霸凌、被性騷擾、被權柄欺壓的人說出遭遇，被說成是在「點火」。","說出傷害不是點火，是報火警；嚼環是為了往前走，不是把嘴縫起來。要受害者閉嘴，保護的是加害者，讓他再傷人；涉及暴力、性侵、兒少，先保護安全、依法處理。","檢驗標準：一位正在猶豫要不要說出遭遇的人聽完，是更敢找一個可信任的人說，還是更確定自己應該沉默？","③ 用 3:6 教言語咒詛的魔法：「說了負面的話就會招來咒詛，所以生病不能說病，只能正面宣告。」","雅各說的火燒的是關係與人心（3:16），不是一套說了就靈的機制；他自己在 4:15 說「主若願意」，不是「我宣告」。這種講法會讓病人不敢說痛、受苦的人不敢哭，還背上「是你自己說壞了」的罪咎（全卷立場見 ISS00_5）。","檢驗標準：一位重病的弟兄姊妹聽完，是更敢在禱告裡把真實的痛苦說出來，還是更怕說錯一個字？","④ 把 3:6「生命的輪子」講成輪迴、因果報應或命運之輪：「一句話會跟你到下輩子」「你家的命就是被話點著的」。","γενέσεως 在 1:23 指人生來的樣子；這是一個人從生到死的整條路，雅各借的是一個通俗的說法，不是借它的哲學。講成輪迴或宿命，會把一節警告舌頭的經文，變成民間信仰的恐懼。","檢驗標準：會眾聽完，記得的是「一句話能燒過人的一輩子，所以要被救、也能被醫治」，還是「命已經定了」？","⑤ 把 3:2「完全人」講成沒有一句話說錯的無罪完美，叫常常說錯話的人絕望，或叫人假裝自己從不失言。","雅各先說「我們在許多事上都有過失」，連自己也算在裡面；τέλειος 是長成、成熟，是方向，不是證書。講成完美主義，敏感的人會整夜自責，剛硬的人會說「我沒錯」。","檢驗標準：一位昨晚剛對家人說了重話的人聽完，是更想今天去道歉，還是更覺得自己沒救了？","⑥ 用 3:8「沒有人能制伏」替自己開脫：「雅各都說了沒人能管住舌頭，我脾氣就是這樣，大家要包容。」","「沒有人能」是診斷，不是免責；它把人推向那一位能的。3:10 說「這是不應當的」——不是不可能，是不應當。把診斷講成許可，傷人的人更理直氣壯，被傷的人更沒有地方說。","檢驗標準：會眾聽完 3:8，是更快去求從上頭來的智慧，還是更安心地維持原樣？","⑦ 把 3:9 的「咒詛」縮成髒話與正式的詛咒：「我不罵三字經，所以這一節跟我無關。」","雅各的理由是對方「照著神形像被造」——冷嘲熱諷、貼標籤、在網路上羞辱、對孩子說「你怎麼不去死」，都是對著神的形像說話。縮小定義，最常說刻薄話的人反而最安心；但也不可把一切批評政策、指出不義的話都算成咒詛。","檢驗標準：會眾聽完，能不能說出自己這週對誰說了一句貶低他「這個人」的話，而不只是批評「這件事」？","⑧ 用 3:10--12「泉源不能發出兩樣的水」宣判別人：「他嘴巴這樣，一定沒有重生。」","這幾節是一面鏡子，雅各先照的是「我們」（3:9）；拿來斷定別人的得救，就坐上了 4:12 審判官的位子。勸戒與論斷有三個分別：動機為了把人找回來（5:20），方法當面私下溫柔（3:13），位子站在弟兄旁邊（全卷立場見 ISS00_5）。","檢驗標準：你講 3:11 的時候，第一個被照的是台下某一個人，還是你自己那口井？","⑨ 把 3:14--16「苦毒的嫉妒和紛爭……屬鬼魔的」當成教會派系鬥爭的武器：給反對你的同工、長執貼上「屬鬼魔」的標籤。","雅各要每一個人先照自己的心（3:14「你們心裡」）；拿這幾節打對方，本身就是 3:14 說的「說謊話抵擋真道」。這樣講會讓教會的衝突升級成屬靈戰爭，夾在中間的人只能離開。","檢驗標準：講完這一段，雙方的人會不會都先回家照鏡子，而不是拿講章的錄音去轉給對方？","⑩ 把 3:15「屬情慾的」講成反智：「讀神學、讀書、用頭腦的都是屬魂的，屬靈人只要感動。」或把 321「用心靠聖靈，不要用腦靠自己」講成不必思考。","ψυχική 指靠天然生命的聰明，問題在源頭，不在頭腦；雅各自己叫人求智慧（1:5），主也說要「盡意」愛神（太 22:37）。貶低理性與學術，會讓學生、知識分子以為信主就得放下頭腦，也讓錯誤教導更容易進來。","檢驗標準：一位在讀研究所、或正在認真查考聖經的弟兄姊妹聽完，是更願意把頭腦交給聖靈，還是覺得自己被說成不屬靈？","⑪ 把 3:17--18「和平」講成和稀泥：「為了合一，這件事不要再追究了」，用和平壓下真相、不處理傷害。","3:17 的次序是「先是清潔，後是和平」；不處理罪與傷害的和平，只是把火蓋住。「不要為了事傷害人」是叫人不要為了贏一件事踩過人，不是叫人為了表面的平靜犧牲受傷的人。","檢驗標準：講完 3:18，教會裡那一件一直被壓著的事，是更有機會被公正、溫柔地處理，還是更沒有人敢提？","⑫ 把 3:17 的八樣講成一張咬牙要做到的道德清單：「這週練溫良，下週練柔順，做不到就是不夠屬靈。」","這八樣是「從上頭來的」，和 1:17 各樣美善的恩賜同一個源頭；人不能從自己裡面做出從上頭來的東西，只能領受。講成清單，認真的人會更焦慮，驕傲的人會拿它檢查別人。","檢驗標準：會眾聽完 3:17，是更想照鏡子、也更想向神求，還是更怕照鏡子？","⑬ 用處境取消原則：「3:1 是寫給一世紀沒有按立牧師的小聚會，今天有神學院，跟我們無關」；或把處境硬搬：「所以今天只有按立的牧者可以教導」。","書信三問要走完：處境是散住各地、誰都可以站起來講的會堂式聚會；原則是教導的人說的話別人會拿去活，所以先受更重的判斷；今天落在講台、主日學、小組、直播與群組裡每一個開口教導的人（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是覺得這一章只跟牧師有關，還是每一個在群組裡分享經文的人都聽見了自己的名字？","⑭ 講員自己拿這一章的講台含沙射影：借 3:5「最小的火」暗指某位會友傳閒話，借 3:14 暗指某位同工搞派系。","雅各在 3:1 說「我們要受更重的判斷」，講台本身就是最大的一片舵；在講台上點名式地影射，正是用舌頭在點火。被影射的人無法回應，聽得懂的人開始猜，整個會眾被拖進一場看不見的爭吵。","檢驗標準：講完這一章，有沒有任何一位會友會覺得「這一段是在講我」而且是因為講員知道他的事？若有，先私下去找他，而不是在台上講。"]},{"n":4,"t":"你們親近神，神就必親近你們","sub":"爭、恩、霧","lv":"A","arc":"謙","sec":[["4:1--5","你們中間的爭戰鬥毆是從哪裡來的呢：私慾、妄求與世俗"],["4:6--10","但他賜更多的恩典：順服、親近、自卑"],["4:11--12","弟兄們，你們不可彼此批評：審判的只有一位"],["4:13--17","你們只當說「主若願意」：雲霧與誇口"]],"serm":{"pts":[["爭戰從哪裡來","4:1--5","「不是從你們百體中戰鬥之私慾來的嗎？」——得不著是因為不求，求不著是因為妄求；與世俗為友就是與神為敵"],["他賜更多的恩典","4:6--10","「神阻擋驕傲的人，賜恩給謙卑的人」——先順服神，才抵擋魔鬼；親近神，清潔二意的心；在主面前自卑，主就叫人升高"],["你是誰","4:11--17","「你是誰，竟敢論斷別人呢？」——審判的位子只有一位能坐；行事曆上的主詞，要換成「主若願意」"]]},"q":"「你們中間的爭戰鬥毆是從哪裡來的呢？」（4:1）雅各問的時候沒有指名，你心裡卻大概已經浮出一張臉：家族群組裡為了父母誰來照顧吵到退群的那一位；同工會上投票輸了、從此不再開口的那一位；或是你自己，昨晚躺在床上把一段對話重播了十遍，每一遍都換一句更狠的回嘴。\n我們習慣問「是誰先開始的」；雅各問的是「從哪裡來」，而他的答案不指向對面，指向我自己的百體。\n如果仗是從我裡面打出來的，停戰的地方在哪裡？雅各的回答只有一個字開頭：「但他賜更多的恩典」（4:6）。","truth":"爭戰從我裡面的私慾來，我自己停不了；但神賜更多的恩典，「神阻擋驕傲的人，賜恩給謙卑的人」（4:6）——恩典往低處去，人只要順服、親近、自卑，回到神下面的位子。\n所以審判的椅子讓出來（4:12），明天的主詞也讓出來（4:15）：謙卑不是更用力把自己修好，是走到恩典到得了的地方。","mv":{"t":"但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人。","r":"雅4:6"},"card":["全卷五篇「全・行・言・謙・忍」，這一章是「謙」：鏡子照到心，而且是神面前的心。它從全卷第二低的谷開始（4:1 爭戰鬥毆），一個「但」字把人帶上全卷的樞紐（4:6），再落到兩個最日常的地方：嘴巴（4:11）和行事曆（4:13）。全章拎起來是一句：「你們親近神，神就必親近你們」（4:8）——一顆分成兩半的心，是在親近神的時候被清潔的。","這一章的主詞一再是神。他戀慕我們到不肯和世界分享（4:5）；他「賜更多的恩典」（4:6）；他擺開陣勢阻擋驕傲的人，卻把恩典給謙卑的人；人一近前，「神就必親近你們」（4:8）；人一低下，「主就必叫你們升高」（4:10）。連審判也是他的：「設立律法和判斷人的，只有一位，就是那能救人也能滅人的」（4:12）——能滅人的那一位，選擇的是救人。","4:6「阻擋」是 ἀντιτάσσεται（antitassetai），「對著排列」；4:7「順服」是 ὑποτάγητε（hypotagēte），「在下排列」。同一個字根 τάσσω（tassō），只換了一個介系詞。這改變今天的讀法：人和神之間沒有中立的位置——不排在神的下面，就排在神的對面。謙卑不是一種氣質，是一個站位；驕傲也不必大聲，只要不肯排到下面去就夠了。","這一章照出一個在三張椅子上輪流坐的我。禱告時坐在倉庫門口，清單上的事大多是「要浪費在你們的宴樂中」（4:3）；群組裡坐上審判席，轉傳一張截圖、加一句「我只是擔心」；打開年度計畫，又坐上明天的寶座，每一行的主詞都是我。三張椅子，同一個人：心裡的王位上，坐的是自己。","「你們親近神，神就必親近你們。」（4:8）全章最該記住的動作，是方向的翻轉：前五節的人一直往外打，往別人身上要；這一句叫人轉身往上走。神沒有說「先把手洗乾淨再來」；潔淨手、清潔心的命令，是放在「親近神」後面的。仗打到一半，不必先贏，也不必先修好自己——先轉身，往神那裡走一步，他已經在路上了。","這一週，當你寫好一則很想按出去的回覆（群組、電郵、家人的訊息），先不要按。照 4:2 的次序：「你們得不著，是因為你們不求」（4:2）——花三分鐘向神說出你在這場爭執裡真正想要的是甚麼（被尊重、被看見、要贏），把那一樣交給他。然後刪掉一半的字，或改成一句當面、私下的邀請：「我們可以找時間談一談嗎？」","最終整合：安提阿城外，一間做皮革的作坊。晚上收了工，十幾個人擠在皮料堆中間，空氣裡還是鞣皮的酸味。\n耶路撒冷來的信，讀到第四章。\n「你們中間的爭戰鬥毆是從哪裡來的呢？」（4:1）\n屋裡有兩個人沒有抬頭。一個月前，他們為一批貨的帳吵翻了：一個說另一個少算了三成。從那天起，聚會時一個坐東邊，一個坐西邊。\n讀信的人往下讀，讀到「與神為敵」，屋子安靜得只聽得見油燈。\n然後他停了一下，讀出一個字：「但。」\n「但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人。」（4:6）\n坐東邊的那一位，明天一早要上路，往大馬士革去住一年，做買賣得利；行李已經捆好，堆在門口。\n信讀到這一段的最後：「你們只當說：主若願意，我們就可以活著，也可以做這事，或做那事。」（4:15）\n他站起來。沒有往門口走，往西邊走。\n他在那人面前站了很久，最後只說：「我明天要走。主若願意，我還回來。走之前，我想跟你把那本帳再一起算一次。」\n另一個人也站起來。兩個人誰都沒有坐上審判的椅子，他們站在同一盞燈底下。\n那一晚沒有人講道，只有一封信，和一句從箴言裡走出來的話。\n作坊裡最低的地方，是兩個人一起彎腰、撿起同一本帳冊的地方。\n恩典，就停在那裡。"],"self":"這一章照出來的「有己」，第一種在裡面：私慾在百體中行軍，我想要、想贏、想被看重，得不著就爭，爭不到就恨；連禱告都成了另一條補給線，求來的東西還沒到手，已經預定要花在自己身上（4:1--3）。\n第二種穿著責任感的衣服：我替別人下判決（4:11--12），也替自己的明天下判決（4:13）——兩件事是同一個動作，都是離開本位、伸手去拿只屬於神的位子；4:6 說，神對這樣的人擺開了陣勢。讀完經文，321 那句話才有了臉：驕傲，就是離開本位、抓住權力、想要代替神。","t321":{"k":"耶穌是我的榜樣：4:7 的次序，主自己先走過。在曠野，他沒有先跟魔鬼辯論能力，他先說出自己排在哪裡：「當拜主你的神，單要事奉他」（太 4:10）——先順服神，那抵擋才有根，魔鬼就離開了。在客西馬尼，他把 4:15 活成禱告：「父啊！你若願意，就把這杯撤去；然而，不要成就我的意思，只要成就你的意思」（路 22:42）。那位唯一有權坐審判椅子的主，最後「離席站起來」（約 13:4），蹲下為門徒洗腳。學他，是在衝突裡先排到父的下面，再彎腰。經文走到這裡，321 才認出自己那一句「無己戰勝撒但」：得勝不是因為我變強，是因為那個坐在王位上的自己下來了，魔鬼就沒有陣地。","g":"讓耶穌作王：這一章要人讓出兩個位子。第一個是審判官的椅子——「設立律法和判斷人的，只有一位」（4:12）；論斷人，就是離開本位、抓住只屬於神的權力。第二個是明天的主詞——4:13 那句話沒有一個字是罪，錯在每一個動詞前面都是「我們」。讓耶穌作王不是少做計畫，是計畫照做、主詞換人：年度目標、搬家、轉職、孩子選校，都先在家人面前說一句「主若願意」，並且真的預備好讓他改動。王位讓出來，人反而輕省了：明天不必我扛。321 說「讓耶穌作王」，在這一章最具體的樣子，就是讓「主若願意」出現在行事曆上。","p":"建立屬神的體系：4:1 的爭戰是「你們中間」的，所以停戰也要是一群人的事。一個屬神的群體，會把 4:11--12 變成日常的規矩：群組裡不轉傳別人的截圖、不在背後談論不在場的人；有話要說，照三個分別——為了把人找回來（5:20）、當面私下溫柔、站在弟兄旁邊。同工會的領袖先作 4:7 的人：投票輸了不冷戰，贏了不誇口（4:16）。這樣的群體不是沒有衝突，是衝突一出現，大家知道要往哪裡走：先往神那裡，再往對方那裡。我們團契每天說的「神施恩給謙卑的人，阻擋驕傲的人」，原來是雅各從箴言抄給一群正在爭戰的弟兄的；它要建造的不是一句口號，是一群會一起往低處走、一起反敗為勝的人——「主就必叫你們升高」（4:10）。"},"grp":["【一、破冰】小時候你和兄弟姊妹（或同學、表兄弟）最常為了甚麼吵架？通常是怎麼收場的——誰先開口、誰去告狀、還是第二天就忘了？","【二、扎心】經文說：「你們得不著，是因為你們不求」（4:2）。說出最近一次讓你心裡不平的衝突（家裡、職場、教會都可以，不必說對方是誰）：在那件事裡，你真正想要的是甚麼——被尊重、被看見、要贏、照我的方法？那一樣，你有沒有先向神開口求過？","【三、福音】讀 4:6 與 4:8：「但他賜更多的恩典」，「你們親近神，神就必親近你們」。說出一個你覺得必須「先把自己整理好」才敢到神面前的地方。如果神是在你近前的時候才清潔你的心，這一週你可以帶著那一塊，原樣來到他面前嗎？","【四、行動】說出一位這一週你要去和好、或需要當面溫柔說一句話的人（名字或關係），哪一天、用甚麼方式（見面、電話、吃飯）；去之前，你要先為哪一件「我想要的」禱告？也說出這個月你最大的一個計畫，你要在哪一天、和誰一起說「主若願意」？","【五、代禱】為三種人指名禱告：一位禱告很久還沒有蒙應允的人（久病、不孕、失業、等孩子回家），求主讓他知道自己沒有求錯，神也沒有走開；一位在教會或家裡的爭執中受了傷、從此不再開口的人，求主差人走到他身邊；一位覺得明天沒有盼望的人，求主讓他身邊有人陪伴，也讓他願意接受專業的幫助。"],"prac":{"main":"這一週，在每一場爭執和每一個計畫之前，先往神那裡走一步：順服、親近、自卑，讓他作王。","items":["對神：每天早上讀 4:6--10 一次，讀到「但他賜更多的恩典」（4:6）時停下來，把今天最可能起衝突的一件事說給神聽，並且說出你在那件事上真正想要的；然後禱告：「主，我排到你的下面。」晚上問自己：今天我是往外打，還是往上走？","對自己：把你的禱告清單拿出來，在每一項旁邊誠實地標一個記號：這一項若得著了，是讓我更愛神、更愛人，還是只讓我更舒服？不必刪掉任何一項——雅各沒有叫人不求；只是把「要浪費在你們的宴樂中」（4:3）的那幾項，改成向神說真心話。","對人：這一週不在背後談論一位不在場的弟兄姊妹；發現自己開了頭，就停下來，改說一句他的好處。若真有需要指出的事，約他當面、私下談，先問自己三個問題：我是為了把他找回來嗎？方法溫柔嗎？我站在他旁邊，還是坐在他對面？","對生活：選一個你這個月最大的計畫（轉職、搬家、旅行、投資、孩子的升學），和家人坐下來把它攤開，一起說「主若願意」，並且討論：如果主不願意，我們的備案是甚麼？計畫照做，只是讓主有改動它的權利。","對使命：4:17 說「人若知道行善，卻不去行，這就是他的罪了」（4:17）。這一週挑一件你早就知道該做、一直拖著的善事——一通該打的電話、一筆該還的人情、一位該探望的病人——把它排進行事曆，做完。讓一張讓主作王的行事曆，真的留一格給別人。"]},"safe":["① 在講到 4:6 之前就先講「321」、先喊團契的核心句，再回頭找經文來配；或把 4:6--10 講成 321 理念的插圖、口號的出處證明。","雅各的次序是 4:1--5 先把爭戰、私慾、淫婦站穩，4:6 的「但」才從箴 3:34 走出來；先講口號，經文就成了道具，會眾記得的是團契的句子，不是神的恩典（鐵律五）。","檢驗標準：你的講稿裡，「321」第一次出現的位置，是在 4:6 之前還是之後？會眾記住的第一句話是經文，還是口號？","② 把 4:6「賜恩給謙卑的人」講成交易：「你謙卑，神就給你恩典；恩典不夠，是你還不夠謙卑。」","經文的次序是「但他賜更多的恩典，所以經上說」——恩典先在，謙卑是走到恩典到得了的地方，不是付給神的工價；講成交易，會讓本來就自責的人去量自己謙卑得夠不夠，反而又坐回自己的中心。","檢驗標準：一位常覺得自己不夠好的弟兄姊妹聽完，是更忙著檢查自己，還是更確知「他賜更多的恩典」？","③ 用 4:4「淫亂的人」「與神為敵」點名羞辱會友，或拿來宣布某些職業、音樂、電影、非信徒朋友就是世俗，講成與文化隔離的主義。","這是舊約先知的婚約語言（耶 3:20；何 1--3），問的是心屬誰；雅各指控的是教會自己。同一位雅各說不沾染世俗的人，是走進世界看顧孤兒寡婦的人（1:27）。把它講成禁止清單，會讓在娛樂業、媒體、夜間行業工作的會友帶著羞恥離開（紅線五）。","檢驗標準：一位在娛樂業工作的弟兄姊妹聽完，是覺得被趕出門，還是被邀請檢查自己的心屬誰？","④ 用 4:2--3「不求」「妄求」解釋每一個沒有蒙應允的禱告：「沒得著，就是你求錯了、動機不純。」","雅各診斷的是一群正在爭戰、要把求來的東西花在宴樂中的人；保羅三次求主挪去那根刺也沒有蒙允（林後 12:8--9）。把手術刀拿去割沒有病的人，會讓為久病、不孕、失業、浪子禱告多年的人以為神不理他是自己的錯（受苦與成功神學回指希伯來書立場四）。","檢驗標準：一位為病中孩子禱告了三年的母親聽完，是更想放棄禱告，還是更敢繼續向神開口？","⑤ 拿 4:1「爭戰是從你們的私慾來的」對家暴、職場霸凌、性騷擾的受害者說：「你也要檢討自己的私慾，不要只怪對方。」","4:1 是叫每一個參與爭戰的人往自己裡面看，不是把加害與受害說成各打五十大板；先保護安全、依法處理，再談各人的心。用這一節要受害者先自省，是二度傷害，也是替加害者找屬靈理由（紅線七；全卷立場見 ISS00_5）。","檢驗標準：一位正在遭受暴力或霸凌的人聽完，是更不敢說出來，還是知道教會會先保護他？","⑥ 用 4:11--12「不可彼此批評」「你是誰，竟敢論斷別人」叫受害者閉嘴、叫提問的會友閉嘴、叫指出制度問題的同工閉嘴。","雅各在書末自己要人使失迷的弟兄回轉（5:19--20）；勸戒與論斷的分別在動機、方法、位子，不在說不說。把論斷的禁令拿來消音，等於讓真正坐在審判椅子上的人永遠不必被問責（紅線七；全卷立場見 ISS00_5）。","檢驗標準：講完這兩節，會眾是更知道怎樣當面溫柔地勸戒，還是更不敢對任何錯誤開口？","⑦ 把 4:15「主若願意」講成宿命或反對規劃：「基督徒不必做計畫、不必存退休金、不必做生涯規劃，一切順其自然。」","4:13 那句話沒有一個字是罪，錯在主詞；保羅也照樣排行程（徒 18:21），主耶穌也說蓋樓要先坐下算計（路 14:28）。講成宿命，會讓人把懶惰屬靈化，也讓認真規劃的弟兄姊妹以為自己不屬靈（紅線六）。","檢驗標準：會眾聽完，是把計畫丟掉，還是把計畫拿到神面前、讓主有改動它的權利？","⑧ 把 4:14「一片雲霧」單獨講，停在「人生很短、很虛空、轉眼就沒了」，不接到 4:15。","雲霧說的是生命不在我手裡，不是說生命沒有價值；它一定要接「主若願意，我們就可以活著」。對一位已經有輕生念頭的人，只講雲霧可能是壓垮他的最後一句話；這樣的人需要陪伴，並協助轉介專業與危機資源（紅線六）。","檢驗標準：一位覺得明天沒有盼望的人聽完，是更覺得自己可有可無，還是聽見自己的生命正是主所願意的？","⑨ 把 4:7「抵擋魔鬼」講成一套捆綁、斥責、驅趕的口訣，或把憂鬱、焦慮、精神疾病一律說成鬼附、要趕鬼不要看醫生。","4:7 的次序是先順服神，才抵擋魔鬼；雅各給的方法是回到神下面的位子，不是儀式。把病說成鬼，會叫人停藥拒醫，也讓病人和家屬多背一層恐懼與羞恥（屬靈爭戰回指以弗所書立場四；醫藥見 ISS00_4）。","檢驗標準：一位正在接受精神科治療的會友聽完，是更害怕自己被鬼抓住，還是知道順服神的人可以安心就醫？","⑩ 用 4:9「將喜笑變作悲哀」要求基督徒不苟言笑，或反過來，在講台上把愁苦、悲哀當成屬靈表演、逼人當場哭。","這是對自滿宴樂、還在爭戰的人的悔改呼召，不是對所有笑聲的禁令；雅各也在 1:2 說要以為大喜樂、在 5:13 叫人歌頌。他給眼淚留了位子，喪親、受苦的人難過不是不屬靈；但也不必假裝悲傷來證明自己悔改（紅線八）。","檢驗標準：會眾聽完，是覺得笑是罪、或哭是表演，還是知道在神面前可以真實地哭、也可以真實地笑？","⑪ 把 4:8「你們親近神，神就必親近你們」講成「神在等你先走完九十九步」，或講成可以操作的公式：「你讀經禱告的時數夠了，神就會來。」","這一句的背後是 4:6「他賜更多的恩典」；主耶穌比喻裡的父親，是「相離還遠」就跑去抱住兒子（路 15:20）。講成公式，會讓靈修中斷、軟弱的人以為神已經離開，只能更焦慮地補時數。","檢驗標準：一位很久沒有禱告的人聽完，是覺得要先補課才能回來，還是今晚就敢往神那裡走一步？","⑫ 用處境取消原則：「4:13 是寫給一世紀跑城的猶太商人，跟上班族無關」；或把處境硬搬：「誰做生意、誰投資，誰就是 4:16 張狂誇口的人。」","書信三問要走完：處境是散住、貧窮、被欺壓、又彼此爭戰的弟兄；原則是一切從上頭來，所以驕傲要回到本位；今天的落點是每一個打開行事曆、群組、禱告清單的人，不是某一種職業（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，第一個想到要改的，是「那些做生意的人」，還是自己下週的行事曆？","⑬ 用 4:17「知道行善，卻不去行，這就是他的罪了」叫已經累垮的同工、照顧者再多接一件服事：「你知道教會缺人，不來就是犯罪。」","這一節接在「主若願意」之後，是讓主作王的人留一格給神放在眼前的善事，不是把所有需要都壓在同一個人身上；講成無限的責任，會讓良心敏感的人永遠活在虧欠裡（全卷立場見 ISS00_2）。","檢驗標準：一位照顧病中家人已經筋疲力盡的弟兄姊妹聽完，是更內疚，還是知道神放在他眼前的善事，正是他手上照顧的那一位？","⑭ 在 4:5、4:6 的經文問題上講台定案、指責別的讀法：「4:5 只有一種意思」「雅各引錯了箴言」。","4:5 有五種讀法，講台只講一句：神不肯和世界分享我們；4:6 引的是七十士譯本，和合本箴 3:34 照希伯來文，是兩個版本，彼前 5:5 也照雅各的版本。在講台上爭這些，會把全卷樞紐變成一場考據，也讓剛發現字句不同的人以為聖經自相矛盾（全卷立場見 ISS00_9）。","檢驗標準：會眾聽完 4:5--6，記得的是一位戀慕他們、賜更多恩典的神，還是一場版本之爭？"]},{"n":5,"t":"農夫忍耐等候地裡寶貴的出產","sub":"銹、雨、回","lv":"A","arc":"忍","sec":[["5:1--6","你們這些富足人哪：工錢有聲音呼叫"],["5:7--11","你們要忍耐，直到主來：農夫、先知與約伯"],["5:12--12","最要緊的是不可起誓：是就說是"],["5:13--18","出於信心的祈禱要救那病人：禱告、認罪與以利亞"],["5:19--20","叫一個罪人從迷路上轉回：去找走失的弟兄"]],"serm":{"pts":[["工錢有聲音","5:1--6","「這工錢有聲音呼叫」——欺壓人的積攢的是銹；被欠薪的人沒有聲音，萬軍之主替他們聽見"],["農夫的忍耐","5:7--12","「看哪，農夫忍耐等候地裡寶貴的出產」——主來的日子近了，所以不埋怨、不起誓；約伯的結局說明主是滿心憐憫"],["彼此代求","5:13--20","「所以你們要彼此認罪，互相代求，使你們可以得醫治」——受苦的禱告，病了的請長老；叫人起來的是主；最後去把走失的弟兄找回來"]]},"q":"月底到了，你在等一筆遲遲沒有入帳的薪水；或者，你就是那個說「下個月一定給」的人。病房裡，有人已經禱告了半年，病沒有好，有人悄悄問他：「你是不是有甚麼還沒處理？」\n群組裡，一個以前天天回話的名字，已經半年沒有出聲了，大家都看見，誰也沒有點進去。\n這一章要問的是：在等候拖得很長的日子裡，你的心是越來越硬、越來越會嘆氣，還是被那位「滿心憐憫，大有慈悲」的主堅固起來，有力氣為別人禱告，也有力氣出門去找人？","truth":"主是滿心憐憫，大有慈悲（5:11）：他聽見被扣住的工錢，也看見約伯的結局；所以被憐憫的人可以忍耐、可以彼此代求，「義人祈禱所發的力量是大有功效的」（5:16）。\n等候的盡頭不是一個人得救就好，是被主找回來的人，轉身「叫一個罪人從迷路上轉回」（5:20）。","mv":{"t":"所以你們要彼此認罪，互相代求，使你們可以得醫治。義人祈禱所發的力量是大有功效的。","r":"雅5:16"},"card":["這一章是「全・行・言・謙・忍」的「忍」篇，一顆心在時間裡的樣子：被欺壓的時候、等雨的時候、生病的時候、有人走丟的時候。雅各把財主的銹、農夫的雨、病床旁的油和走失的弟兄放在同一章，問的是同一件事：等候拖長了，你的心往哪裡去？這一章從上頭來的那一樣，是 5:11 主的憐憫——全卷最高點，在命令最多的一封信的最後一章。","這一章的神，先是一位聽見的神：收割之人的冤聲「已經入了萬軍之主的耳了」（5:4）。他是站在門前的審判者（5:9），替被欺壓的人「抵擋」；他給了約伯一個結局，「明顯主是滿心憐憫，大有慈悲」（5:11）；叫病人起來的是他——「主必叫他起來」（5:15）；最後連雨也是他給的（5:18）。整章人能做的只有等、求、找；做成的，都是主。","5:19「有人使他回轉」，原文 ἐπιστρέψῃ τις αὐτόν（epistrepsē tis auton）。τις 是不定代名詞：「任何一個人」。雅各沒有說「長老使他回轉」，也沒有說「牧師去處理」。前面 5:14 病人請的是長老；到了 5:19，去找的人沒有職稱。這改變今天的讀法：那個半年沒出聲的名字，不是在等教會的關懷部門，是在等「有人」——而那個人，可能就是現在讀到這裡的你。","這一章照出等候裡的我。對上，我不敢說，就對下嘆氣——對老闆忍著，回家對家人「彼此埋怨」（5:9）；對人，我把「下個月再給」說得很輕，卻忘了那是別人今晚的飯；對病人，我急著找原因，好讓自己心安；對走失的人，我看見了，卻等別人先去。每一樣的中心都是我：我的不耐煩、我的方便、我的解釋、我的面子。","「你們聽見過約伯的忍耐，也知道主給他的結局，明顯主是滿心憐憫，大有慈悲」（5:11）。全章最該記住的，是雅各叫人看的方向：不是看約伯多能撐，是看主給的結局。等候裡的人一直盯著自己還撐不撐得住，就會越等越硬；把眼睛移到結局上那位滿心憐憫的主，心才會被堅固，也才有力氣去為別人禱告、去找別人。","這一週做三件小事，照著本章的次序。第一，早上讀 5:11，對主說出一件你等得很累的事。第二，找一位正在生病或照顧病人的弟兄姊妹，問他：「這週我可以為你禱告甚麼？」——不問原因，只問需要。第三，打開群組，找一個很久沒出聲的名字，私訊一句：「最近想起你，我在為你禱告。」若你是雇主或經手付款的人，這週把該付的帳查一次，準時付清。","最終整合：大馬士革城外，一間做皮革的人家，晚上點著一盞燈。\n十幾個散居的弟兄姊妹擠在屋裡，有人的工錢已經被扣了兩個月。角落一張蓆子上，躺著發燒的老撒迦利亞。\n耶路撒冷來的信，一個年輕人慢慢讀完了最後一句：\n「叫一個罪人從迷路上轉回便是救一個靈魂不死，並且遮蓋許多的罪」（5:20）\n他捲起書卷。屋裡很靜。\n一位寡婦問：「就這樣？沒有問安？沒有祝福？」\n年輕人把書卷又打開，往回找了一段，讀：\n「明顯主是滿心憐憫，大有慈悲」（5:11）\n「祝福在這裡，」他說，「他把祝福放在中間，把任務放在最後。」\n兩位長老站起來，走到蓆子旁，用平常敷傷口的油抹在老人的額上，跪下禱告。老人的兒子沒有停下手裡那碗退燒的湯。\n禱告完，坐在門邊的一個弟兄說：「我也有一件事，請你們為我禱告。」他說得很短，沒有人追問。大家只是把手放在他肩上。\n然後，那個收過兩個月白工的工人站了起來，拿起外衣。\n「便雅憫已經三個安息日沒來了，」他說，「上次他被扣錢，跟我吵了一架。我去找他。」\n門開了，夜風吹進來，燈火晃了一下，沒有熄。\n先是主的憐憫，再是彼此的禱告，最後，是一個人出門去找另一個人。\n雨還沒有來。可是這一夜，屋裡沒有一個人被留下。"],"self":"這一章照出來的「有己」，是一顆在等候裡越縮越小的心：對自己，只算還要等多久；對人，只算自己方便不方便——所以工錢可以晚一點付給別人，埋怨可以留給身邊最近的人，病人的苦可以用一個「原因」打發掉。\n更深的一層，是把信仰縮成只顧自己的靈魂：我有聚會、我有禱告、我得救了；那個走失的人，是別人的事。雅各全卷最後一筆，偏偏是要我把眼睛從自己身上移開，去看另一個人。","t321":{"k":"耶穌是我的榜樣：5:6 說義人被定罪、被殺害，「他也不抵擋你們」（5:6）；5:10 要我們把眾先知「當作能受苦能忍耐的榜樣」（5:10）。這使我們想起那一位「被欺壓，在受苦的時候卻不開口」（賽 53:7）的主。他不抵擋，不是因為軟弱，是因為把審判交給了父。他也是那位看見群眾就「憐憫他們」（太 9:36）的牧人，親自出去找一隻走迷的羊。學他，是在受委屈的時候不靠嘆氣和發誓保護自己，在別人走失的時候不等對方先回來。","g":"讓耶穌作王：這一章要人讓出來的位置，是「討公道的那一位」和「找原因的那一位」。5:9 說「審判的主站在門前了」（5:9）——在家裡嘆氣、在群組裡埋怨，是自己坐上審判的位置；在病床旁盤算這人為甚麼生病，也是坐上神的位置。讓他作王，是把審判交給門前那一位，把結局交給滿心憐憫的主；我們陪伴每個人成為得勝者——得勝者不是一路沒受傷的人，是像約伯那樣抓著神不放手、終於看見主給他的結局的人。","p":"建立屬神的體系：5:14--16 是體系的日常運作——病人可以「請」，請得到的是複數的長老團隊，不是一位明星；認罪在可信任、保密的關係裡發生，目的是互相代求。這就是 235：一群人輪流去病房、輪流接電話，誰也不必一個人扛。5:19--20 再往外走一步：920——那個失迷真道的弟兄，是你的 2。一間教會健不健康，不只看主日有多少人坐著，也看有多少人知道自己要去找誰，並且這週真的去了；而教會作為雇主，同工、清潔、保全的工錢準時足額，是這個體系最先被外人看見的樣子。"},"grp":["【一、破冰】你等過最久的一件東西是甚麼？（一個包裹、一份錄取通知、一場雨、一個人回家）等的時候你都在做甚麼？","【二、扎心】經文說：「弟兄們，你們不要彼此埋怨，免得受審判」（5:9）。這一週，你最常對誰嘆氣、在哪裡嘆氣（家裡、車上、群組）？那一口氣，其實是在埋怨誰？","【三、福音】讀 5:11：「明顯主是滿心憐憫，大有慈悲」（5:11）。說出一段你曾經等得很苦、後來回頭才看見主的憐憫的日子。如果主的心腸是這樣大，你現在正在等的那一件事，可以怎樣換一個方式交給他？","【四、行動】說出一位這一週你要聯絡的人：一位在生病或照顧病人的，或一位很久沒有出聲的弟兄姊妹（名字或關係）。哪一天、用甚麼方式（訊息、電話、探訪）？你要對他說的第一句話是甚麼？（帶領者提醒：本題不請任何人說出自己或別人的罪。）","【五、代禱】為三種人指名禱告：一位正在久病或重病中的人和他的家屬，求主賜平安、減輕痛苦、讓醫治的路順利；一位被拖欠工錢或在異鄉辛苦做工的人（包括外籍移工），求主聽見他們的冤聲，也讓我們有份替他們發聲；一位曾經同行、如今走失的弟兄姊妹，求主讓他在這週收到一句溫柔的問候。"],"prac":{"main":"這一週，先被主的憐憫找到，再為人禱告，然後出門去找一個人。","items":["對神：每天早上讀 5:7--11 一次，讀到「主是滿心憐憫，大有慈悲」時停下來，說出今天你最等不下去的一件事，禱告：「主啊，結局在你手裡，求你堅固我的心。」晚上問自己：今天我是看著自己撐不撐得住，還是看著主給的結局？","對自己：這週留意自己嘆氣的時刻，每一次就把那口氣換成一句禱告；也檢查一句你說過的「好」「我會到」「下週交」，讓你的「是」就是「是」（5:12），不必再加「我發誓」。","對人：探訪或聯絡一位病人或照顧者，只問「我可以為你禱告甚麼」，不問「你為甚麼會生病」；若有人向你說出心裡的掙扎，為他禱告，並且守密，不轉述、不當作代禱事項傳出去。","對生活：若你是雇主、主管或經手付款的人，這週把薪資、外包、清潔與鐘點的帳查一次，準時足額付清；若你自己被拖欠工錢，請找可信任的人陪你，依法查詢申訴管道——忍耐不等於放棄權益。","對使命：找出一個很久沒有出聲的名字，先為他禱告三天，然後傳一句話：「最近想起你，我在為你禱告。」不急著勸他回來，只讓他知道有人記得他；這就是你這週的 920。"]},"safe":["① 用 5:15 說「出於信心的祈禱要救那病人」，所以病沒有好是你的信心不夠、禱告不夠、奉獻不夠。","5:15 的主詞是主——「主必叫他起來」；信心屬於來禱告的人，不是病人的分數；希伯來書 11:35 下半「又有人忍受嚴刑」同樣是因著信（紅線二；全卷立場見 ISS00_4）。這樣講，會在久病、重病、臨終的人身上，再加一層羞恥。","檢驗標準：一位禱告了很久仍在洗腎或化療的弟兄姊妹聽完，是覺得自己被定罪，還是知道主仍然站在他床邊？","② 在病床旁或講台上暗示「你一定有罪沒認」「家裡有咒詛」，把疾病解釋成懲罰。","5:15「他若犯了罪」原文 κἂν 是條件句，不是推定；病與罪常常沒有關係，主耶穌說「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。推論病因，是坐上約伯朋友的位子（紅線二）。","檢驗標準：你的探訪或講道裡，有沒有任何一句話會讓病人開始回頭搜尋「我做錯了甚麼」？","③ 把 5:14 的禱告抹油講成醫藥的替代品，暗示「有信心就不必看醫生」，或對停藥、拒醫的決定表示讚許。","ἀλείφω 是日常的塗抹敷藥，這使我們想起好撒馬利亞人「用油和酒倒在他的傷處」（路 10:34）；禱告與醫藥都是神的恩典，並行不悖。鼓勵停藥拒醫，可能直接危及性命（紅線二；全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，會不會有人回家把藥收起來？你有沒有清楚說出「繼續看醫生、照醫囑用藥」？","④ 為重病、臨終的人只准求「完全醫治」，把求平安、求不痛苦、求與家人和好、求安然見主說成「沒有信心的禱告」。","5:15 的「救」與「叫他起來」範圍比痊癒更大，最後的「叫他起來」是復活的早晨；只准一種禱告，家屬在喪禮上會多背一份「我們信得不夠」的自責（紅線二）。","檢驗標準：一位剛送走父親的家屬聽完，是覺得自己的禱告失敗了，還是知道主已經照他的憐憫叫父親起來？","⑤ 用 5:16「彼此認罪」在小組或特會上安排輪流交代、公開認罪，或逼問、轉述別人的隱私。","原文 ἀλλήλοις 是互相，目的是「互相代求」，不是審判；認罪要自願、在可信任的關係裡、保密，不轉成代禱事項傳出去（紅線三；全卷立場見 ISS00_4）。在小組被逼認罪過的人，往往從此不再開口。","檢驗標準：你帶的小組裡，有沒有人可以只說「請為我禱告」而不必交代細節，並且確定那句話不會傳出這個房間？","⑥ 用 5:16 要求受害者「先認自己的罪」「去向傷害你的人認罪和好」，或用「彼此認罪」把暴力、性侵、傷害兒少的事在教會內部私了。","受害者不需要向加害者認罪；涉及暴力、性侵、兒少，第一件事是保護安全、依法通報處理，教會不是替加害者遮掩的地方（紅線三）。","檢驗標準：若一位受害者今天鼓起勇氣說出來，你的教會知道第一步是保護他、陪他求助，而不是安排雙方「和好認罪」嗎？","⑦ 講 5:1--6 只罵外面的財主、大企業，卻不照教會自己作為雇主：同工的薪水、清潔與保全的待遇、外包費用拖多久才付。","5:4 的工錢「有聲音呼叫」，教會、基督徒老闆都在這一節之下；先照別人，是 2:4 偏心的另一種樣子（紅線四；全卷立場見 ISS00_3）。","檢驗標準：你講完這一段，教會的財務或行政同工會不會想回去把薪資表和付款紀錄看一次？","⑧ 為欠薪找屬靈理由：「要順服老闆」「工錢晚一點也是一種操練」「把委屈當作奉獻」，勸被拖欠工錢的人默默忍受。","5:7 的忍耐是不報復、把審判交給主，不是放棄權益；律法說「雇工人的工價，不可在你那裡過夜，留到早晨」（利 19:13）。這樣勸，等於站到欠薪的那一邊（紅線四）。","檢驗標準：一位被欠薪的外籍移工聽完，是覺得教會叫他吞下去，還是知道有人會陪他找申訴管道？","⑨ 把 5:1--6 講成仇富：「有錢人都是壓迫者」「基督徒富有就是罪」；或反過來美化貧窮，好像窮本身就是屬靈。","雅各指名的是積攢、欠薪、奢華、用法庭定義人的罪，不是財富本身；財富不是罪，但有方向——流出去，或發銹（全卷立場見 ISS00_3）。","檢驗標準：一位誠實經營、準時發薪的基督徒老闆聽完，是被鼓勵把財富流出去，還是覺得自己被整體定罪？","⑩ 用 5:8「主來的日子近了」算日子、排時間表，或把「秋雨春雨」講成「前雨後雨」兩波末世聖靈澆灌的預告，把以利亞求雨講成末後大復興的預表。","「近了」ἤγγικεν 是叫人今天就不埋怨、今天就忍耐；「那日子，那時辰，沒有人知道」（太 24:36）；秋雨春雨是巴勒斯坦農夫的日曆（鐵律四）。","檢驗標準：會眾聽完，記得的是一個年份或一張圖表，還是這一週不要再嘆氣、要把心堅固？","⑪ 用 5:12「不可起誓」責備在法庭作證、就職宣誓、婚禮誓詞的弟兄姊妹；或反過來，把 5:12 講成「只是不要亂發誓，跟我沒關係」。","5:12 禁止的是用起誓加強自己的話——好像不發誓的話就可以不算數；法庭作證與婚禮誓詞不在禁止之內，但要尊重持守不起誓的肢體（全卷立場見 ISS00_5）。","檢驗標準：會眾聽完，是去檢查別人說話的格式，還是開始讓自己的「是」就是「是」？","⑫ 用 5:19--20 去「找回」人，卻帶著責備和審判：在群組公開點名、到人家裡數算他的罪、用「你會沉淪」嚇他回來。","使人回轉的動機是把人找回來、方法是私下溫柔、位子是弟兄而不是審判官（全卷立場見 ISS00_5）；被嚇回來的人，多半會走得更遠。","檢驗標準：那個被你聯絡的人，是覺得被記得、被等候，還是覺得被抓回來受審？","⑬ 用處境取消原則：「5:1--6 是寫給一世紀巴勒斯坦地主，跟今天無關」；或把處境硬搬：「今天的老闆全都是 5:1 的財主。」","書信三問要走完：處境是散居、做工、被欺壓的信徒；原則是工錢有聲音、主聽得見、審判屬主；今天的落點在薪資表、移工宿舍、外包合約與我自己的付款習慣（全卷立場見 ISS00_1）。","檢驗標準：你講完，會眾第一個想到要改的，是「那些老闆」，還是自己手上這一筆帳？","⑭ 講 5:13--20 跳過 5:11，直接把禱告、認罪、找人講成一張待辦清單：「病了就要請長老、犯罪就要認、看見人走失就要去」。","雅各的次序是先有主的憐憫（5:11），再有彼此的禱告（5:16），最後才是去找人（5:20）；沒有先被憐憫找到的人，去找別人時多半帶著責備，把命令講成重擔。","檢驗標準：會眾聽完，是更累，還是更想照鏡子——因為知道照出來的，是一位滿心憐憫的主？"]}],"txt":{"1":["作神和主耶穌基督僕人的雅各請散住十二個支派之人的安。","我的弟兄們，你們落在百般試煉中，都要以為大喜樂；","因為知道你們的信心經過試驗，就生忍耐。","但忍耐也當成功，使你們成全、完備，毫無缺欠。","你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神，主就必賜給他。","只要憑著信心求，一點不疑惑；因為那疑惑的人，就像海中的波浪，被風吹動翻騰。","這樣的人不要想從主那裡得甚麼。","心懷二意的人，在他一切所行的路上都沒有定見。","卑微的弟兄升高，就該喜樂；","富足的降卑，也該如此；因為他必要過去，如同草上的花一樣。","太陽出來，熱風颳起，草就枯乾，花也凋謝，美容就消沒了；那富足的人，在他所行的事上也要這樣衰殘。","忍受試探的人是有福的，因為他經過試驗以後，必得生命的冠冕；這是主應許給那些愛他之人的。","人被試探，不可說：「我是被神試探」；因為神不能被惡試探，他也不試探人。","但各人被試探，乃是被自己的私慾牽引誘惑的。","私慾既懷了胎，就生出罪來；罪既長成，就生出死來。","我親愛的弟兄們，不要看錯了。","各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從眾光之父那裡降下來的；在他並沒有改變，也沒有轉動的影兒。","他按自己的旨意，用真道生了我們，叫我們在他所造的萬物中好像初熟的果子。","我親愛的弟兄們，這是你們所知道的。但你們各人要快快地聽，慢慢地說，慢慢地動怒，","因為人的怒氣並不成就神的義。","所以，你們要脫去一切的污穢和盈餘的邪惡，存溫柔的心領受那所栽種的道，就是能救你們靈魂的道。","只是你們要行道，不要單單聽道，自己欺哄自己。","因為聽道而不行道的，就像人對著鏡子看自己本來的面目，","看見，走後，隨即忘了他的相貌如何。","惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。","若有人自以為虔誠，卻不勒住他的舌頭，反欺哄自己的心，這人的虔誠是虛的。","在神我們的父面前，那清潔沒有玷污的虔誠，就是看顧在患難中的孤兒寡婦，並且保守自己不沾染世俗。"],"2":["我的弟兄們，你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人。","若有一個人帶著金戒指，穿著華美衣服，進你們的會堂去；又有一個窮人穿著骯髒衣服也進去；","你們就重看那穿華美衣服的人，說：「請坐在這好位上」；又對那窮人說：「你站在那裡」，或「坐在我腳凳下邊。」","這豈不是你們偏心待人，用惡意斷定人嗎？","我親愛的弟兄們，請聽，神豈不是揀選了世上的貧窮人，叫他們在信上富足，並承受他所應許給那些愛他之人的國嗎？","你們反倒羞辱貧窮人。那富足人豈不是欺壓你們、拉你們到公堂去嗎？","他們不是褻瀆你們所敬奉的尊名嗎？","經上記著說：「要愛人如己。」你們若全守這至尊的律法才是好的。","但你們若按外貌待人，便是犯罪，被律法定為犯法的。","因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條。","原來那說「不可姦淫」的，也說「不可殺人」；你就是不姦淫，卻殺人，仍是成了犯律法的。","你們既然要按使人自由的律法受審判，就該照這律法說話行事。","因為那不憐憫人的，也要受無憐憫的審判；憐憫原是向審判誇勝。","我的弟兄們，若有人說自己有信心，卻沒有行為，有甚麼益處呢？這信心能救他嗎？","若是弟兄或是姊妹，赤身露體，又缺了日用的飲食；","你們中間有人對他們說：「平平安安地去吧！願你們穿得暖，吃得飽」，卻不給他們身體所需用的，這有甚麼益處呢？","這樣，信心若沒有行為就是死的。","必有人說：「你有信心，我有行為；你將你沒有行為的信心指給我看，我便藉著我的行為，將我的信心指給你看。」","你信神只有一位，你信的不錯；鬼魔也信，卻是戰驚。","虛浮的人哪，你願意知道沒有行為的信心是死的嗎？","我們的祖宗亞伯拉罕把他兒子以撒獻在壇上，豈不是因行為稱義嗎？","可見，信心是與他的行為並行，而且信心因著行為才得成全。","這就應驗經上所說：「亞伯拉罕信神，這就算為他的義。」他又得稱為神的朋友。","這樣看來，人稱義是因著行為，不是單因著信。","妓女喇合接待使者，又放他們從別的路上出去，不也是一樣因行為稱義嗎？","身體沒有靈魂是死的，信心沒有行為也是死的。"],"3":["我的弟兄們，不要多人作師傅，因為曉得我們要受更重的判斷。","原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。","我們若把嚼環放在馬嘴裡，叫牠順服，就能調動牠的全身。","看哪，船隻雖然甚大，又被大風催逼，只用小小的舵，就隨著掌舵的意思轉動。","這樣，舌頭在百體裡也是最小的，卻能說大話。看哪，最小的火能點著最大的樹林。","舌頭就是火，在我們百體中，舌頭是個罪惡的世界，能污穢全身，也能把生命的輪子點起來，並且是從地獄裡點著的。","各類的走獸、飛禽、昆蟲、水族，本來都可以制伏，也已經被人制伏了；","惟獨舌頭沒有人能制伏，是不止息的惡物，滿了害死人的毒氣。","我們用舌頭頌讚那為主、為父的，又用舌頭咒詛那照著神形像被造的人。","頌讚和咒詛從一個口裡出來！我的弟兄們，這是不應當的！","泉源從一個眼裡能發出甜苦兩樣的水嗎？","我的弟兄們，無花果樹能生橄欖嗎？葡萄樹能結無花果嗎？鹹水裡也不能發出甜水來。","你們中間誰是有智慧有見識的呢？他就當在智慧的溫柔上顯出他的善行來。","你們心裡若懷著苦毒的嫉妒和紛爭，就不可自誇，也不可說謊話抵擋真道。","這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的，屬鬼魔的。","在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事。","惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。","並且使人和平的，是用和平所栽種的義果。"],"4":["你們中間的爭戰鬥毆是從哪裡來的呢？不是從你們百體中戰鬥之私慾來的嗎？","你們貪戀，還是得不著；你們殺害嫉妒，又鬥毆爭戰，也不能得。你們得不著，是因為你們不求。","你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中。","你們這些淫亂的人哪，豈不知與世俗為友就是與神為敵嗎？所以凡想要與世俗為友的，就是與神為敵了。","你們想經上所說是徒然的嗎？神所賜、住在我們裡面的靈，是戀愛至於嫉妒嗎？","但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人。","故此，你們要順服神。務要抵擋魔鬼，魔鬼就必離開你們逃跑了。","你們親近神，神就必親近你們。有罪的人哪，要潔淨你們的手！心懷二意的人哪，要清潔你們的心！","你們要愁苦、悲哀、哭泣，將喜笑變作悲哀，歡樂變作愁悶。","務要在主面前自卑，主就必叫你們升高。","弟兄們，你們不可彼此批評。人若批評弟兄，論斷弟兄，就是批評律法，論斷律法。你若論斷律法，就不是遵行律法，乃是判斷人的。","設立律法和判斷人的，只有一位，就是那能救人也能滅人的。你是誰，竟敢論斷別人呢？","嗐！你們有話說：「今天明天我們要往某城裡去，在那裡住一年，做買賣得利。」","其實明天如何，你們還不知道。你們的生命是甚麼呢？你們原來是一片雲霧，出現少時就不見了。","你們只當說：「主若願意，我們就可以活著，也可以做這事，或做那事。」","現今你們竟以張狂誇口；凡這樣誇口都是惡的。","人若知道行善，卻不去行，這就是他的罪了。"],"5":["嗐！你們這些富足人哪，應當哭泣、號咷，因為將有苦難臨到你們身上。","你們的財物壞了，衣服也被蟲子咬了。","你們的金銀都長了銹；那銹要證明你們的不是，又要吃你們的肉，如同火燒。你們在這末世只知積攢錢財。","工人給你們收割莊稼，你們虧欠他們的工錢，這工錢有聲音呼叫，並且那收割之人的冤聲已經入了萬軍之主的耳了。","你們在世上享美福，好宴樂，當宰殺的日子竟嬌養你們的心。","你們定了義人的罪，把他殺害，他也不抵擋你們。","弟兄們哪，你們要忍耐，直到主來。看哪，農夫忍耐等候地裡寶貴的出產，直到得了秋雨春雨。","你們也當忍耐，堅固你們的心，因為主來的日子近了。","弟兄們，你們不要彼此埋怨，免得受審判。看哪，審判的主站在門前了。","弟兄們，你們要把那先前奉主名說話的眾先知當作能受苦能忍耐的榜樣。","那先前忍耐的人，我們稱他們是有福的。你們聽見過約伯的忍耐，也知道主給他的結局，明顯主是滿心憐憫，大有慈悲。","我的弟兄們，最要緊的是不可起誓；不可指著天起誓，也不可指著地起誓，無論何誓都不可起。你們說話，是，就說是；不是，就說不是，免得你們落在審判之下。","你們中間有受苦的呢，他就該禱告；有喜樂的呢，他就該歌頌。","你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。","出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。","所以你們要彼此認罪，互相代求，使你們可以得醫治。義人祈禱所發的力量是大有功效的。","以利亞與我們是一樣性情的人，他懇切禱告，求不要下雨，雨就三年零六個月不下在地上。","他又禱告，天就降下雨來，地也生出土產。","我的弟兄們，你們中間若有失迷真道的，有人使他回轉，","這人該知道：叫一個罪人從迷路上轉回便是救一個靈魂不死，並且遮蓋許多的罪。"]},"blk":{"1":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.</p>","lit":"<p>雅各，神和主耶穌基督的奴僕，給那在分散中的十二個支派：問安。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἰάκωβος</td><td>Iakōbos</td><td>雅各</td><td>希伯來名字「雅各」；寫信的人與十二支派的祖先同名</td></tr><tr><td>δοῦλος</td><td>doulos</td><td>奴僕</td><td>放在名號的最後：不稱「主的兄弟」，只稱僕人</td></tr><tr><td>ταῖς δώδεκα φυλαῖς</td><td>tais dōdeka phylais</td><td>十二個支派</td><td>神的子民全體</td></tr><tr><td>ἐν τῇ διασπορᾷ</td><td>en tē diaspora</td><td>在分散中</td><td>撒出去的種子：散居異鄉的生活</td></tr><tr><td>χαίρειν</td><td>chairein</td><td>問安、願你喜樂</td><td>與徒 15:23 耶路撒冷會議公函同一個字</td></tr></table>","gram":"<p><strong>新約有四位雅各，這一位是哪一位？</strong>西庇太的兒子、約翰的哥哥雅各，早在徒 12:2 被希律用刀殺了；亞勒腓的兒子雅各是十二使徒之一，新約之後再沒有記載；猶大（不是加略人）的父親雅各只出現在名單裡。剩下的就是<strong>主的兄弟雅各</strong>：保羅稱他「主的兄弟雅各」（加 1:19），是耶路撒冷教會的柱石（加 2:9），在使徒行傳第 15 章主持會議。本講義與歷代多數解經家一樣，認定寫信的是他。</p><p>名號的次序很講究：Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος（Iakōbos theou kai kyriou Iēsou Christou doulos），名字在前，δοῦλος（doulos） 壓在最後。「神」與「主耶穌基督」並列，同掛在一個「僕人」上——一個猶太人把哥哥的名字放在神旁邊。「主的兄弟」三種說法（同母弟弟／約瑟前妻之子／堂表兄弟）見議題頁 ISS00，正文不爭。</p><blockquote><p>問安字 χαίρειν（chairein） 是希臘書信的標準開頭，新約書信只有這裡和徒 15:23 那封公函用它；那封信正是雅各主持的會議發出的。下一節的 χαρὰν（charan） 立刻接住它：關鍵字接龍，從第一句就開始了。</p></blockquote>","exp":"<p>〔背景〕徒 15:13--21（使徒行傳講義第 15 章）</p><p>這個人曾經不信他的哥哥。耶穌的親屬出來要拉住他，「因為他們說他癲狂了」（可 3:21）；約 7:5 說得更直，連他的弟兄也不信他。後來發生了甚麼？這使我們想起林前 15:7：復活的主「顯給雅各看」。一次見面，一個弟弟變成了僕人。</p><p>本系列使徒行傳講義第 15 章講過，雅各在耶路撒冷會議上站起來說：「諸位弟兄，請聽我的話」（徒 15:13）。他有地位、有權柄、有血緣。可是寫信的時候，他一個頭銜都沒有用。最有資格說「我是主的弟弟」的人，只說「我是他的僕人」。<strong>這是全卷第一個無己的見證</strong>：不是把自己擦掉，是回到本位。</p><p>收信的是「散住十二個支派之人」（1:1）。διασπορᾷ（diaspora） 原是撒種的字，被撒出去的人散在各城，在異鄉做工，常被地主欺壓。雅各寫的不是為了一件事件，是為了一種生活：在異鄉、在貧窮、在試煉裡，怎樣活出信心。這也是今天散在各國、在線上聚集的群體最熟悉的處境。</p><p>第一個字是問安，「願你們喜樂」；第二節馬上說試煉。雅各沒有先安慰再講難處，他把喜樂和試煉放在同一口氣裡。這封信的筆法就是這樣：短、直、一句接一句。</p><p>雅各也是十二支派之一的名字。他寫給「十二個支派」，是把散在各地、彼此不認識的小群體，重新算成一整個家。散住不是被丟棄，是被撒出去。</p>"},{"a":2,"z":4,"star":3,"grk":"<p lang=\"grc\">Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,</p><p lang=\"grc\">γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·</p><p lang=\"grc\">ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.</p>","lit":"<p>要把它全然算為喜樂，我的弟兄們，每當你們跌落在各色各樣的試煉之中，</p><p>因為知道你們信心的那試驗之物，正在做成忍耐；</p><p>而忍耐要有完全的工作，好叫你們是完全的、各部分齊全的，在一件事上也不缺。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πᾶσαν χαρὰν</td><td>Pasan charan</td><td>全然的喜樂</td><td>接龍：接住 1:1 χαίρειν</td></tr><tr><td>ἡγήσασθε</td><td>hēgēsasthe</td><td>要算為、認定</td><td>不定過去命令：一個判斷，不是一種感覺</td></tr><tr><td>περιπέσητε</td><td>peripesēte</td><td>跌落、陷入</td><td>不是自己去找，是掉進去</td></tr><tr><td>ποικίλοις</td><td>poikilois</td><td>各色各樣的</td><td>五顏六色：試煉沒有一種固定的樣子</td></tr><tr><td>δοκίμιον</td><td>dokimion</td><td>試驗、驗過的</td><td>煉金的字：證明是真的</td></tr><tr><td>ὑπομονήν</td><td>hypomonēn</td><td>忍耐</td><td>「留在底下」：擔子下不跑開</td></tr><tr><td>τέλειοι καὶ ὁλόκληροι</td><td>teleioi kai holoklēroi</td><td>完全且齊全</td><td>本章篇名「全」的字</td></tr></table>","gram":"<p><strong>Πᾶσαν χαρὰν ἡγήσασθε（Pasan charan hēgēsasthe）。</strong>「全然的喜樂」放在句首，動詞 ἡγήσασθε（hēgēsasthe） 是不定過去命令語氣，意思是「算為、認定」——和腓 3:7「我都當作有損的」同一個字。這是會計的判斷，不是心情的報告。雅各沒有說「你們要覺得快樂」，他說「你們要這樣算」。</p><p>三節是一條鏈子：δοκίμιον（dokimion） 生出 ὑπομονήν（hypomonēn）；ὑπομονὴ（hypomonē） 要有 ἔργον τέλειον（ergon teleion）；τέλειον（teleion） 生出 τέλειοι（teleioi）。<strong>關鍵字接龍</strong>一環扣一環：忍耐（1:3）→忍耐（1:4），完全的工作→完全的人，最後 λειπόμενοι（leipomenoi）「缺欠」又被 1:5 的 λείπεται（leipetai）「缺少」接走。ἔργον（ergon） 在本章第一次出現，主詞是忍耐：在雅各書，「行為」第一次登場時是神在人裡面做成的工。</p><blockquote><p>ποικίλοις（poikilois） 是「五顏六色」，彼前 4:10 用同一個字講「百般的恩賜」。試煉五顏六色，恩典也五顏六色。</p></blockquote>","exp":"<p>散住的人遇到甚麼？不是一場大逼迫，是各樣的小磨：工錢被扣、身分被看低、在異鄉想家。「你們落在百般試煉中，都要以為大喜樂」（1:2）。「落在」是掉進去的字，像路上踩空。試煉不是自己挑的，也不必去找。</p><p>怎麼可能喜樂？雅各給的理由在下一句：「因為知道」（1:3）。<strong>喜樂是一個認定，不是一種情緒。</strong>喜樂不是假裝不痛。同一位雅各在 4:9 說「你們要愁苦、悲哀、哭泣」（4:9），在 5:13 說「有受苦的呢，他就該禱告」（5:13）。一個喪親的人可以一面流淚，一面認定神沒有離開；眼淚在臉上，判斷在心裡，兩樣並存。叫受苦的人不可難過，不是雅各的意思。</p><p>認定甚麼？「你們的信心經過試驗，就生忍耐」（1:3）。δοκίμιον（dokimion） 是煉金的字：火不是為了燒掉金子，是為了證明它是金子。彼得用同一個畫面：「叫你們的信心既被試驗」（彼前 1:7），比金子更寶貴。保羅也說「患難生忍耐」（羅 5:3）。三位使徒看見同一件事。</p><p>忍耐還不是終點。「但忍耐也當成功，使你們成全、完備，毫無缺欠」（1:4）。忍耐要把它的工做完，像麵包要烤到熟透才出爐，半生的不能吃。目標是「成全」：這使我們想起主耶穌在山上說的「你們要完全，像你們的天父完全一樣」（太 5:48）。弟弟用了哥哥的字。</p><p>「完全」不是沒有瑕疵的完美主義，是長大成熟、各部分都到位。像一棵果樹，不是沒有被風吹過，是根、幹、枝、果都長齊了。神在試煉裡做的，是這種成熟。</p><p>全卷五篇「全・行・言・謙・忍」，第一章照的是「全」：試煉裡，神要的是一個完整的人，不是一個分成兩半的人。</p>"},{"a":5,"z":6,"star":2,"grk":"<p lang=\"grc\">Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·</p><p lang=\"grc\">αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·</p>","lit":"<p>但你們中間若有人缺少智慧，他要向那單純地賜給眾人、並且不責備的神求，就必賜給他；</p><p>但他要在信心裡求，一點也不分辨來分辨去，因為那分辨來分辨去的人，好像海的浪，被風吹動、被拋來拋去；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>λείπεται σοφίας</td><td>leipetai sophias</td><td>缺少智慧</td><td>接龍：接住 1:4「缺欠」</td></tr><tr><td>αἰτείτω</td><td>aiteitō</td><td>他要求</td><td>現在命令：一直求</td></tr><tr><td>ἁπλῶς</td><td>haplōs</td><td>單純地、慷慨地</td><td>不打折扣、不附條件</td></tr><tr><td>μὴ ὀνειδίζοντος</td><td>mē oneidizontos</td><td>不責備的</td><td>神不嫌你問</td></tr><tr><td>μηδὲν διακρινόμενος</td><td>mēden diakrinomenos</td><td>一點不分辨來分辨去</td><td>心裡的法庭判來判去</td></tr><tr><td>κλύδωνι θαλάσσης</td><td>klydōni thalassēs</td><td>海的浪</td><td>被風吹、被拋的畫面</td></tr></table>","gram":"<p>1:4 末尾 ἐν μηδενὶ λειπόμενοι（en mēdeni leipomenoi）「一樣也不缺」，1:5 開頭立刻接 λείπεται σοφίας（leipetai sophias）「缺少智慧」。雅各用同一個字根轉彎：你剛聽到「毫無缺欠」，心裡想「可是我就是缺」——好，那就求。</p><p>描寫神的兩個分詞值得慢讀：τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς（tou didontos theou pasin haplōs），ἁπλῶς（haplōs） 是「單純地」，給的時候沒有算計、沒有條件；μὴ ὀνειδίζοντος（mē oneidizontos） 是「不責備的」，神不會在給之前先數落你一頓。</p><blockquote><p>μηδὲν διακρινόμενος（mēden diakrinomenos） 的動詞原是「分辨、審斷」，中間語態變成「自己跟自己爭論」。不是理性上有一個問題，是心裡開了一個法庭，判來判去。「分辨、審斷」這個字根是全卷的另一條線（2:4「心裡起分別」、4:11--12 論斷）。</p></blockquote>","exp":"<p>〔太〕太 7:7--11（馬太講義第 7 章）</p><p>試煉裡最缺的往往不是力氣，是智慧：這一關怎麼過？這個人怎麼對待？「你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神，主就必賜給他」（1:5）。</p><p>雅各在這裡回響哥哥的話：「你們祈求，就給你們」（太 7:7）。本系列馬太講義第 7 章講過，那是天父對兒女的心；雅各加了一筆：<strong>神不斥責人</strong>。很多人不敢求，是怕被嫌：「這種事還要問？」雅各說，神不是那樣的老師。你第一百次問同一個問題，他也不翻白眼。</p><p>可是要「憑著信心求，一點不疑惑」（1:6）。這不是說心裡不可以有任何問號。那位父親說「我信！但我信不足，求主幫助」（可 9:24），主沒有拒絕他。雅各說的疑惑，是一面求神、一面另找出路，心裡的法庭始終不肯結案。像海浪，風往東就往東，風往西就往西，永遠在動，永遠到不了岸。</p><p>「厚賜」原文是單純地給：神給的時候不打折扣，也不先開條件。人求智慧常常想要一張完整的地圖；神多半給的是下一步的燈光，夠你走今天這一段。</p><p>聖靈是我的引導：在試煉裡第一個動作不是想辦法，是去求。那位厚賜的神在等你開口。</p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου</p><p lang=\"grc\">ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.</p>","lit":"<p>因為那個人不要以為他會從主那裡領受甚麼，</p><p>一個兩個魂的人，在他一切的道路上都不穩定。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ γὰρ οἰέσθω</td><td>mē gar oiesthō</td><td>不要以為</td><td>現在命令：別自以為</td></tr><tr><td>ἀνὴρ δίψυχος</td><td>anēr dipsychos</td><td>兩個魂的人</td><td>新約只在 1:8 與 4:8</td></tr><tr><td>ἀκατάστατος</td><td>akatastatos</td><td>不穩定的</td><td>3:8 同字：舌頭「不止息」</td></tr><tr><td>ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ</td><td>en pasais tais hodois autou</td><td>在他一切的道路上</td><td>不只禱告，整個生活</td></tr></table>","gram":"<p><strong>δίψυχος（dipsychos） 是本卷最重要的新字。</strong>字首是「兩個」，字根是 1:21 τὰς ψυχὰς（tas psychas）「靈魂」的那個「魂」：一個人裡面住著兩個魂。這個字在雅各書以前的希臘文獻裡找不到，新約只有 1:8 與 4:8 兩次；之後的早期教會文獻（如《黑馬牧人書》）才大量使用，很可能是從雅各這裡學去的。這使我們想起詩 12:2「心口不一」，原文是「一顆心和一顆心」。</p><p>ἀνὴρ δίψυχος（anēr dipsychos） 沒有動詞，是一個同位語式的定義句，像箴言一樣冷冷擺出來；ἀκατάστατος（akatastatos） 在 3:8 用來形容舌頭「不止息」，3:16 的同根名詞 ἀκαταστασία（akatastasia） 是「擾亂」。兩個魂的人，生出一條停不下來的舌頭、一個亂糟糟的群體。</p>","exp":"<p>全卷的一條線從這裡起筆：「心懷二意的人，在他一切所行的路上都沒有定見」（1:8）。終點在 4:8：「心懷二意的人哪，要清潔你們的心」（4:8）。<strong>雅各書是一面鏡子，照出一顆分成兩半的心。</strong></p><p>δίψυχος（dipsychos） 不是「心裡有疑問」。有疑問的人可以帶著疑問來求。二意的人是兩邊都要：一邊向神求，一邊靠世界；禮拜天把生命交給神，禮拜一把安全感交給存款。像一個人一隻腳踩在船上，一隻腳踩在岸上，船一離岸，他哪裡都去不了。</p><p>「這樣的人不要想從主那裡得甚麼」（1:7）。這不是神小氣，是那個人自己沒有空的手。他的手一半握著神，一半握著別的，接不住任何東西。</p><p>「一切所行的路」——二意不只出現在禱告裡。它出現在怎樣用錢（2:2--4）、怎樣說話（3:9--10「頌讚和咒詛從一個口裡出來」的分裂）、怎樣做計畫（4:13）。全卷後面每一章，都是這顆分裂的心在不同場合的樣子。</p><p>這也是 321 說的「用心靠聖靈」：問題常常不在頭腦太笨，在心分成了兩半。醫治從哪裡開始？不是從更努力開始，是從求開始。前面兩節才說，神「厚賜與眾人、也不斥責人」（1:5）。一顆兩半的心，最需要的是那位單純地給的神。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ,</p><p lang=\"grc\">ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.</p>","lit":"<p>但那卑微的弟兄要在他的高處誇口，</p><p>而那富足的要在他的卑微裡誇口，因為他要像草的花一樣過去。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Καυχάσθω</td><td>Kauchasthō</td><td>要誇口</td><td>命令語氣：唯一合法的誇口</td></tr><tr><td>ὁ ταπεινὸς</td><td>ho tapeinos</td><td>卑微的</td><td>社會地位低的人；4:6、10 同字</td></tr><tr><td>ἐν τῷ ὕψει αὐτοῦ</td><td>en tō hypsei autou</td><td>在他的高處</td><td>神給他的位置</td></tr><tr><td>ἐν τῇ ταπεινώσει αὐτοῦ</td><td>en tē tapeinōsei autou</td><td>在他的卑微裡</td><td>富人也有一個被降下來的地方</td></tr><tr><td>ὡς ἄνθος χόρτου</td><td>hōs anthos chortou</td><td>像草的花</td><td>這使我們想起賽 40:6--8</td></tr></table>","gram":"<p>兩節是一組精準的對句：ὁ ταπεινὸς（ho tapeinos）……ἐν τῷ ὕψει αὐτοῦ（en tō hypsei autou）／ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ（ho de plousios en tē tapeinōsei autou）。卑微的對高處，富足的對卑微，十字交叉。一個命令語氣 Καυχάσθω（Kauchasthō） 管兩個人：窮人要誇，富人也要誇。</p><p>ταπεινὸς（tapeinos） 是本卷「謙卑」的字（4:6「賜恩給謙卑的人」、4:10「自卑」）。這裡先指社會地位低的人。卑微與謙卑在雅各書是同一個字根：外面被壓低的人，最容易學會裡面的低。</p><blockquote><p>「富足的」有沒有包括弟兄？文法上 ἀδελφὸς（adelphos） 可以延伸到下半句（富足的弟兄），也可以不延伸（指教會外的富人）。前一讀把降卑讀成富人信徒的喜樂，後一讀讀成反諷。本講義取前一讀：雅各在跟弟兄們說話，富足的弟兄也有一個值得誇口的地方。</p></blockquote>","exp":"<p>試煉的一種是窮，另一種是富。雅各把兩種人都放在神的眼光下重新排一次：「卑微的弟兄升高，就該喜樂；富足的降卑，也該如此」（1:9--10）。</p><p>卑微的人誇甚麼？他在世上沒有座位，在神國卻被高舉。2:5 會說得更清楚：神揀選了世上的貧窮人，叫他們在信上富足。一個在工地扛水泥的弟兄，在神面前是王子。<strong>唯一合法的誇口，是誇神的翻轉。</strong></p><p>富足的人誇甚麼？誇他的「降卑」。這不是叫富人難堪，是給富人一個喜樂的理由：他終於看清楚，錢不能定義他。他和工地的弟兄站在同一個十字架前，一樣需要恩典。雅各不是在仇富，他只是把富足從寶座上請下來。</p><p>為甚麼？「因為他必要過去，如同草上的花一樣」（1:10）。這使我們想起以賽亞的話：「草必枯乾，花必凋殘，惟有我們神的話必永遠立定」（賽 40:8）；彼得也引同一段。雅各只取前半，後半留給讀的人自己想：甚麼會留下？</p><p>321 的「改變觀點」就在這裡：人的觀點看帳戶，神的觀點看位置。教會的座位若按捐款多少排，就是還在用人的觀點；2:1--4 會把這件事攤開。</p><p>翻轉不是窮人和富人換位子，是兩個人一起回到神面前的本位。</p>"},{"a":11,"z":11,"star":1,"grk":"<p lang=\"grc\">ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.</p>","lit":"<p>因為太陽帶著熱風升起，就使草枯乾，它的花也掉落，它面貌的美好也滅沒了；照樣，那富足的人也要在他的行程中凋殘。</p>","key":"","gram":"<p>本節是一幅連續四個不定過去式的畫面：ἀνέτειλεν（升起）→ ἐξήρανεν（使枯乾）→ ἐξέπεσεν（掉落）→ ἀπώλετο（滅沒）。這是格言式的不定過去式，講一件常常發生、一發生就完成的事。</p><p>σὺν τῷ καύσωνι（syn tō kausōni） 可以譯「帶著熱」或「帶著熱風」（巴勒斯坦從曠野吹來的東風）；和合本取後者。末句 ἐν ταῖς πορείαις αὐτοῦ（en tais poreiais autou）「在他的行程中」，商人奔走做生意的字，預告 4:13「往某城裡去，在那裡住一年，做買賣得利」。</p>","exp":"<p>雅各是鄉下人的眼睛。太陽一出，熱風一颳，早上還開得好好的野花，中午就倒了。「太陽出來，熱風颳起，草就枯乾，花也凋謝，美容就消沒了」（1:11）。四個動作，一氣呵成，沒有給人反應的時間。</p><p>重點在最後一句：「那富足的人，在他所行的事上也要這樣衰殘」（1:11）。他不是在退休後慢慢凋謝，是在行程中、在生意談到一半的時候。錢會留在帳上，人卻走了。4:14 會再講一次：「你們的生命是甚麼呢？你們原來是一片雲霧」（4:14），而雅各接著就說「主若願意」——生命短，不是沒有價值，是要交在主手裡。</p><p>這不是嚇唬富人，是讓所有人一起改變觀點：暫時的東西不能當永恆的根基。一個花一輩子打造的事業，像一朵花，美，卻不能靠。</p><p>對卑微的弟兄，這一節也是安慰：今天壓在你上面的那個人，他的權勢也是一朵花。不必羨慕，也不必懼怕。</p>"},{"a":12,"z":12,"star":1,"grk":"<p lang=\"grc\">Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.</p>","lit":"<p>有福的是那忍受試煉的人，因為他成為經過驗證的之後，必領受那生命的冠冕，就是他所應許給那些愛他之人的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μακάριος ἀνὴρ</td><td>Makarios anēr</td><td>有福的人</td><td>詩篇第 1 篇的開頭格式</td></tr><tr><td>ὑπομένει πειρασμόν</td><td>hypomenei peirasmon</td><td>忍受試煉</td><td>接回 1:2--4</td></tr><tr><td>δόκιμος γενόμενος</td><td>dokimos genomenos</td><td>成為經過驗證的</td><td>接回 1:3 δοκίμιον</td></tr><tr><td>τὸν στέφανον τῆς ζωῆς</td><td>ton stephanon tēs zōēs</td><td>生命的冠冕</td><td>得勝者的花冠</td></tr></table>","gram":"<p>Μακάριος ἀνὴρ（Makarios anēr） 是智慧文學的格式，七十士譯本詩篇第 1 篇就這樣開頭。雅各把 1:2--4 收成一句福語：πειρασμόν（peirasmon） 接 1:2 的 πειρασμοῖς（peirasmois），δόκιμος（dokimos） 接 1:3 的 δοκίμιον（dokimion）。</p><p>τὸν στέφανον τῆς ζωῆς（ton stephanon tēs zōēs） 是同位屬格：冠冕就是生命本身。στέφανος（stephanos） 不是王冠，是比賽得勝的花冠。末句 ὃν ἐπηγγείλατο（hon epēngeilato） 沒有主詞，和合本補「主」，是小字。</p><p>這一節也是一個轉軸：同一個 πειρασμόν（peirasmon），前面向後看，是 1:2 的「試煉」；下一節向前走，就變成 1:13 的「試探」。雅各故意用同一個字過橋，讓讀者自己發現方向改變了。</p>","exp":"<p>「忍受試探的人是有福的，因為他經過試驗以後，必得生命的冠冕；這是主應許給那些愛他之人的」（1:12）。這一節是一道門：前面講外面的試煉，後面要講裡面的試探，同一個字。</p><p>雅各又在回響哥哥的話。主在山上說，為主受逼迫的人有福，「應當歡喜快樂，因為你們在天上的賞賜是大的」（太 5:12）。復活的主對士每拿教會說：「我就賜給你那生命的冠冕」（啟 2:10）。冠冕不是發給從來沒跌倒的人，是發給沒有離場的人。</p><p>領冠冕的是誰？「那些愛他之人」。不是最能吃苦的人，是愛他的人。忍耐的動力不是咬牙，是愛。這就是 321 的得勝者：贏的不是比較強的人，是到最後還在主身邊的人。</p><p>「經過試驗以後」：成為 δόκιμος（dokimos） 的人，是被驗過、證明是真的人。冠冕不是為了試驗的痛苦補償，是對真實信心的公開確認。</p>"},{"a":13,"z":13,"star":3,"grk":"<p lang=\"grc\">μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.</p>","lit":"<p>沒有一個被試探的人要說：我是從神被試探；因為神是不被惡試探的，他自己也不試探任何人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πειραζόμενος</td><td>peirazomenos</td><td>被試探的人</td><td>與 1:2 πειρασμοῖς 同一字根</td></tr><tr><td>Ἀπὸ θεοῦ πειράζομαι</td><td>Apo theou peirazomai</td><td>我是從神被試探</td><td>推卸者的台詞</td></tr><tr><td>ἀπείραστός</td><td>apeirastos</td><td>不被試探的</td><td>新約僅此一次</td></tr><tr><td>κακῶν</td><td>kakōn</td><td>惡</td><td>屬格：不受惡的引誘</td></tr><tr><td>πειράζει δὲ αὐτὸς οὐδένα</td><td>peirazei de autos oudena</td><td>他自己不試探任何人</td><td>神不是誘惑者</td></tr></table>","gram":"<p><strong>試煉與試探，在希臘文是同一個字。</strong>1:2 的 πειρασμοῖς（peirasmois）、1:12 的 πειρασμόν（peirasmon）、1:13 的 πειραζόμενος（peirazomenos） 都出自 πειράζω（peirazō）。和合本在 1:2 譯「試煉」，在 1:13 譯「試探」，是照上下文分辨方向：同一個處境，從神那一面看是<strong>試驗</strong>，要證明信心是真的；從私慾那一面看是<strong>引誘</strong>，要把人拉下去。</p><p>那麼「神要試驗亞伯拉罕」（創 22:1）怎麼說？七十士譯本那裡也用 πειράζω（peirazō）。神試驗，目的是成全；神不引誘，目的從不是叫人跌倒。主禱文 καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν（kai mē eisenenkēs hēmas eis peirasmon）「不叫我們遇見試探」（太 6:13）求的是：別讓我們落到那種會跌倒的處境裡。三處合讀，界線清楚。</p><blockquote><p>ἀπείραστός（apeirastos） 新約僅此一次，可讀成「不能被惡試探」（主動意：惡碰不到他），也可讀「沒有經歷過惡」。和合本取前者，與下半句平行：他不受試探，他也不試探人。</p></blockquote>","exp":"<p>人在試煉裡最容易說的一句話是：「這是神害我的。」雅各一刀切斷：「人被試探，不可說：『我是被神試探』；因為神不能被惡試探，他也不試探人」（1:13）。</p><p>這句推卸很古老。亞當在園子裡就說過：「你所賜給我、與我同居的女人，她把那樹上的果子給我，我就吃了」（創 3:12）。意思是：你給的，所以是你的錯。今天換了一套說法：「是神讓我生在這個家」「是神讓我遇到這個人」。處境是真的，可是處境不是罪的來源。</p><p>雅各不否認處境。工錢被扣、病痛、寂寞，都是真的試煉，神也確實在其中試驗、要成全人。可是同一個處境變成「試探」，是因為裡面有另一股力量在拉。下一節要說出它的名字。</p><p>神「不能被惡試探」。惡在他那裡找不到抓手，像火柴劃在玻璃上，劃不著。所以他也不會拿惡去試探人。神給的是試驗，從不是陷阱。</p><p>這一節保護兩種人。一種是想推卸的人：不要把自己的跌倒算在神頭上。另一種是受苦的人：你遇到的事不是神在設局害你，「他也不試探人」。那位「不斥責人的神」（1:5）不會一面給你智慧，一面給你挖坑。</p><p>同一個處境，神的手要叫你站穩，私慾的手要叫你跌倒。看清是哪一隻手，就知道該往哪裡走。</p><p>主耶穌自己走過這條路，「他也曾凡事受過試探，與我們一樣，只是他沒有犯罪」（來 4:15）。被試探本身不是罪；主被試探過，卻沒有犯罪。耶穌是我的榜樣：在試探裡，他把話交回給父，沒有交給私慾。</p>"},{"a":14,"z":15,"star":3,"grk":"<p lang=\"grc\">ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·</p><p lang=\"grc\">εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.</p>","lit":"<p>但每一個人被試探，是被自己的私慾拖出去、又被引誘上鉤。</p><p>然後那私慾懷了胎，就生出罪；而那罪長成了，就產出死。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑπὸ τῆς ἰδίας ἐπιθυμίας</td><td>hypo tēs idias epithymias</td><td>被自己的私慾</td><td>ἰδίας：自己的，不是別人的</td></tr><tr><td>ἐξελκόμενος</td><td>exelkomenos</td><td>被拖出去</td><td>打獵：把獵物從藏身處引出來</td></tr><tr><td>δελεαζόμενος</td><td>deleazomenos</td><td>被引誘上鉤</td><td>釣魚：餌的字</td></tr><tr><td>συλλαβοῦσα τίκτει</td><td>syllabousa tiktei</td><td>懷了胎就生</td><td>私慾的家譜第一代</td></tr><tr><td>ἀποτελεσθεῖσα</td><td>apotelestheisa</td><td>長成了</td><td>罪長大成形</td></tr><tr><td>ἀποκύει θάνατον</td><td>apokyei thanaton</td><td>產出死</td><td>與 1:18 ἀπεκύησεν 同一個字</td></tr></table>","gram":"<p>1:14 的兩個分詞是獵人與漁夫的字：ἐξελκόμενος（exelkomenos） 是把獵物從藏身處拖出來，δελεαζόμενος（deleazomenos） 是用餌引魚上鉤（彼後 2:14、18 同字）。次序是先被拉出安全的地方，再看見餌。ὑπὸ τῆς ἰδίας ἐπιθυμίας（hypo tēs idias epithymias） 的 ἰδίας（idias） 很重：私慾是「自己的」。</p><p>1:15 換成生產的畫面，一個完整的家譜：ἐπιθυμία（epithymia） 懷胎（συλλαβοῦσα（syllabousa））→ 生出（τίκτει（tiktei））罪 → 罪長成（ἀποτελεσθεῖσα（apotelestheisa））→ 產出（ἀποκύει（apokyei））死。ἀποκύει（apokyei） 是醫學上的「分娩」，三節之後 1:18 用同一個字講神「生」了我們。兩個家譜，一個從私慾生出死，一個從神生出新生命。</p>","exp":"<p>試探從哪裡來？「但各人被試探，乃是被自己的私慾牽引誘惑的」（1:14）。不是神，不是環境，也不能全推給魔鬼。雅各說：自己的。這是 321 說的「有己」最根本的樣子：裡面有一個想要的我，在等餌。</p><p>魚不是因為看見鉤子才上鉤，是因為看見餌。餌是真的好吃，鉤子藏在下面。私慾就是那份「想要」：想被看見、想被肯定、想要安全、想要快樂。想要本身常常不是壞的，壞在它被拖離神，自己去咬那個餌。</p><p>然後是一個家譜：「私慾既懷了胎，就生出罪來；罪既長成，就生出死來」（1:15）。請看次序。<strong>試探不是罪。</strong>念頭來了，餌在眼前，這還不是罪；私慾「懷了胎」——人接住它、抱住它、餵養它——才「生出罪來」。所以被試探就是犯罪的說法是錯的。主耶穌被試探過，卻沒有犯罪。</p><p>這對掙扎中的人是好消息。一個在色慾、上癮、怒氣裡掙扎的弟兄，常常因為念頭一來就覺得自己完了，於是乾脆放棄。雅各說：還沒有。念頭來的那一刻，就是轉身的那一刻。這樣的掙扎需要的是陪伴與幫助，有時需要專業協助，不是定罪。</p><p>可是也不可輕看。罪會「長成」，不會停在小時候。今天容許的一點點，明年會長大。家譜的最後一代是死：關係的死、良心的死、最後是與神隔絕。</p><p>「生」這個字留在讀者心裡，三節之後雅各要用同一個字，講一個完全相反的生產。</p><p>斷開家譜最好的時候是第一代：餌一出現，就把它交到神面前，也交給一位可信的同伴。</p>"},{"a":16,"z":18,"star":3,"grk":"<p lang=\"grc\">μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.</p><p lang=\"grc\">Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρʼ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.</p><p lang=\"grc\">βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.</p>","lit":"<p>不要被引入迷途，我親愛的弟兄們。</p><p>每一樣美好的給予和每一樣完全的禮物都是從上頭來的，從眾光之父降下來，在他那裡沒有變換，或轉動所投的影子。</p><p>他立定了旨意，就用真理的話產出了我們，為要叫我們成為他所造之物中某種初熟的果子。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ πλανᾶσθε</td><td>mē planasthe</td><td>不要被引入迷途</td><td>現在命令：別看錯了</td></tr><tr><td>Πᾶσα δόσις ἀγαθὴ</td><td>Pasa dosis agathē</td><td>每樣美好的給予</td><td>給的動作</td></tr><tr><td>πᾶν δώρημα τέλειον</td><td>pan dōrēma teleion</td><td>每樣完全的禮物</td><td>給的東西；τέλειον 接 1:4</td></tr><tr><td>ἄνωθέν</td><td>anōthen</td><td>從上頭</td><td>全卷第一個「從上頭來的」</td></tr><tr><td>τοῦ πατρὸς τῶν φώτων</td><td>tou patros tōn phōtōn</td><td>眾光之父</td><td>造日月星辰的那一位</td></tr><tr><td>ἀποσκίασμα</td><td>aposkiasma</td><td>投下的影子</td><td>新約僅此一次</td></tr><tr><td>ἀπεκύησεν ἡμᾶς</td><td>apekyēsen hēmas</td><td>生了我們</td><td>與 1:15 ἀποκύει 同字</td></tr><tr><td>ἀπαρχήν</td><td>aparchēn</td><td>初熟的果子</td><td>收成的第一把，獻給神</td></tr></table>","gram":"<p>1:17 的前半句在原文是一行六音步詩：Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον（Pasa dosis agathē kai pan dōrēma teleion），可能是雅各引一句當時的格言。δόσις（dosis） 是「給」的動作，δώρημα（dōrēma） 是「給出來的東西」：神給的方式是好的，給的東西是完全的。</p><p>παραλλαγὴ（parallagē） 是天文學上「變換」的字，ἀποσκίασμα（aposkiasma） 是「投下的影子」（新約僅此一次）。天上的光體會繞、會缺、會被遮，投下移動的影子；造它們的那一位不會。</p><blockquote><p>1:18 的 ἀπεκύησεν（apekyēsen） 與 1:15 的 ἀποκύει（apokyei） 是同一個動詞。主動詞前有 βουληθεὶς（boulētheis）「他立定了旨意」：這個生不是意外，是神的決定。「用真道生了我們」是講創造還是重生？少數解經家讀作神造人類（初熟果子＝人在受造物中居首）；多數讀作重生（這使我們想起彼前 1:23 藉著神的道重生）。本講義取重生的讀法：λόγῳ ἀληθείας（logō alētheias） 在新約常指福音（弗 1:13；西 1:5）。</p></blockquote>","exp":"<p>「我親愛的弟兄們，不要看錯了」（1:16）。看錯甚麼？看錯神。若以為試探是從神來的，就會把神看成設局的人。雅各要把鏡頭從下面轉到上面。</p><p>「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的」（1:17）。這是全卷第一個「從上頭來的」，也是本章的山峰。私慾是從裡面往下拉的，恩賜是從上面往下給的。<strong>人不能從自己裡面做出從上頭來的東西，只能領受。</strong>第 3 章會講第二件從上頭來的禮物：智慧（3:17）。</p><p>神被稱為「眾光之父」：太陽、月亮、星星都是他造的。可是太陽會下山，月亮有圓缺，日晷上的影子一直在移動。「在他並沒有改變，也沒有轉動的影兒」（1:17）。試煉裡的人最怕神變了。雅各說：天上的光會轉，造光的不會。</p><p>然後是全卷最重要的恩典句：「他按自己的旨意，用真道生了我們」（1:18）。三節之前私慾「生出死來」，現在神「生了我們」，同一個字。<strong>私慾的家譜通向死，神的家譜從真道生出生命。</strong>雅各不是一位只會下命令的老師；他的命令是從這一句恩典長出來的。全卷到 4:6 才說「但他賜更多的恩典」（4:6），可是恩典的根，在這裡已經種下。</p><p>「好像初熟的果子」：收成的第一把，獻給神，也是後面還有更多的記號。散住各地、被人看低的信徒，在神眼中是他新創造的第一批果子。</p><p>這一節也是全卷的護欄。後面講行道、講信心要有行為，都不是叫人靠自己變好；是已經被神生下來的人，活出這個生命的樣子。</p>"},{"a":19,"z":21,"star":2,"grk":"<p lang=\"grc\">Ἴστε ἀδελφοί μου ἀγαπητοί. ἔστω δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,</p><p lang=\"grc\">ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ οὐκ ἐργάζεται.</p><p lang=\"grc\">διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.</p>","lit":"<p>你們要知道，我親愛的弟兄們。但每一個人都要快於聽，慢於說，慢於怒；</p><p>因為人的怒氣不做成神的義。</p><p>所以，脫去一切污穢和滿溢的惡，要在溫柔裡接受那栽種在裡面的道，就是那能救你們魂的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἴστε</td><td>Iste</td><td>你們知道／要知道</td><td>可讀直說或命令</td></tr><tr><td>ταχὺς εἰς τὸ ἀκοῦσαι</td><td>tachys eis to akousai</td><td>快於聽</td><td>三個快慢的第一個</td></tr><tr><td>βραδὺς εἰς τὸ λαλῆσαι</td><td>bradys eis to lalēsai</td><td>慢於說</td><td>3:1--12 的伏筆</td></tr><tr><td>βραδὺς εἰς ὀργήν</td><td>bradys eis orgēn</td><td>慢於怒</td><td>不是不怒，是慢</td></tr><tr><td>ῥυπαρίαν</td><td>rhyparian</td><td>污穢</td><td>髒衣服的字；2:2 同根</td></tr><tr><td>ἐν πραΰτητι</td><td>en praytēti</td><td>在溫柔裡</td><td>3:13 同字</td></tr><tr><td>τὸν ἔμφυτον λόγον</td><td>ton emphyton logon</td><td>栽種在裡面的道</td><td>新約僅此一次</td></tr></table>","gram":"<p>Ἴστε（Iste） 可以是直說語氣（「這是你們所知道的」，和合本），也可以是命令（「你們要知道」）。前者把 1:18 收尾，後者把 1:19 開頭。兩讀都通。</p><p>三個並列片語是箴言式的格言：ταχὺς εἰς τὸ ἀκοῦσαι（tachys eis to akousai）／βραδὺς εἰς τὸ λαλῆσαι（bradys eis to lalēsai）／βραδὺς εἰς ὀργήν（bradys eis orgēn）。一快兩慢，對稱好背。1:20 的 ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ οὐκ ἐργάζεται（orgē gar andros dikaiosynēn theou ouk ergazetai） 把「人」與「神」放在一句的兩頭：人的怒，做不出神的義。</p><p>1:21 的命令是不定過去 δέξασθε（dexasthe）「要接受」。τὸν ἔμφυτον λόγον（ton emphyton logon） 的 ἔμφυτον（emphyton） 原意是「長在裡面的、植入的」：道不是貼在外面的標語，是栽進泥土裡的種子。它接回 1:18 的 λόγῳ ἀληθείας（logō alētheias）。</p>","exp":"<p>「我親愛的弟兄們，這是你們所知道的。但你們各人要快快地聽，慢慢地說，慢慢地動怒」（1:19）。這三句話，每個人都會背，很少人做得到。</p><p>試煉裡的人最容易反過來：慢慢地聽，快快地說，快快地動怒。受了委屈，話先出口，耳朵還沒打開。雅各要的次序是先聽：先聽神，再聽人。這也是 321 改變觀念八大步驟的第一步：資訊從耳朵進來。</p><p>「慢慢地動怒」不是不准生氣。保羅也說「生氣卻不要犯罪」（弗 4:26）。慢，是讓怒氣在出手之前先經過神面前。理由是：「因為人的怒氣並不成就神的義」（1:20）。很多人以為自己的怒氣是在替神伸張正義，雅各說：你的火做不出神的義。神的事要用神的方法。</p><p>那要怎麼辦？「所以，你們要脫去一切的污穢和盈餘的邪惡，存溫柔的心領受那所栽種的道」（1:21）。先脫，再領受：像園丁先拔草，再撒種。<strong>行道不是靠自己用力，是領受那所栽種的道，讓它在裡面長出來。</strong>這和 1:18 接上了：神用真道生了我們，那道還繼續在我們裡面生長。</p><p>「存溫柔的心」：溫柔不是軟弱，是不跟道爭辯。一塊硬地，種子落不進去；被犁開的地，才接得住。這是八大步驟裡的「信服」。</p>"},{"a":22,"z":24,"star":2,"grk":"<p lang=\"grc\">Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ἀκροαταὶ μόνον παραλογιζόμενοι ἑαυτούς.</p><p lang=\"grc\">ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,</p><p lang=\"grc\">κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.</p>","lit":"<p>但你們要成為道的行者，不要只成為聽者，用錯誤的推算欺騙你們自己。</p><p>因為若有人是道的聽者而不是行者，這人就像一個人在鏡子裡察看他出生的臉；</p><p>因為他察看了自己，就走開了，並且立刻忘了他是怎樣的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Γίνεσθε</td><td>Ginesthe</td><td>要成為</td><td>現在命令：持續成為</td></tr><tr><td>ποιηταὶ λόγου</td><td>poiētai logou</td><td>道的行者</td><td>做道的人</td></tr><tr><td>ἀκροαταὶ μόνον</td><td>akroatai monon</td><td>只是聽者</td><td>坐在台下聽講的人</td></tr><tr><td>παραλογιζόμενοι ἑαυτούς</td><td>paralogizomenoi heautous</td><td>欺哄自己</td><td>算錯帳</td></tr><tr><td>ἐν ἐσόπτρῳ</td><td>en esoptrō</td><td>在鏡子裡</td><td>古代的銅鏡</td></tr><tr><td>ἐπελάθετο</td><td>epelatheto</td><td>忘了</td><td>不定過去：一轉身就忘</td></tr></table>","gram":"<p>Γίνεσθε δὲ ποιηταὶ λόγου（Ginesthe de poiētai logou） 是現在命令：「要一直成為行道的人」。ἀκροαταὶ（akroatai） 是當時聽演講、聽朗讀的聽眾。παραλογιζόμενοι（paralogizomenoi） 原是會計的字：算錯了、被假帳騙了。只聽不行的人，是自己做了一本假帳給自己看。</p><p>1:23--24 的動詞時態很巧：κατανοοῦντι（ka
