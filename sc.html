大（5:11）。"},{"id":"ISS05_6","t":"5:14「用油抹他」——是藥、是象徵，還是聖禮？","r":"5:14；可 6:13；路 10:34","ch":[5],"why":"「奉主的名用油抹他」是各宗派實行差異最大的一節：天主教有病人傅油聖事，靈恩教會常抹油為病人禱告，許多福音派教會從不抹油。信徒在不同教會之間轉換時，常因此困惑：我們不抹油是不順服嗎？抹油是不是迷信？這一題要把五種讀法並陳。","pos":[["【一】經文問的是甚麼","","<p>「你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告」（5:14）。「抹」原文 ἀλείψαντες，是日常的塗抹、敷藥，不是膏立君王祭司的 χρίω。問題是：這油的作用是甚麼？今天的教會還要照做嗎？</p>"],["聖事說","","<p>天主教以此節為病人傅油聖事的根據之一：由神父為重病者抹油，是蒙恩的記號，帶來赦罪、力量與安慰；東正教也有相近的實行。</p><p><strong>難處：</strong>經文說的是「長老們」為「病了的」人禱告，不限於臨終；把它定為聖事並限於神職，是後來教會傳統的發展，經文本身沒有交代。</p>"],["醫藥說","","<p>橄欖油是當時常用的藥，好撒馬利亞人「用油和酒倒在他的傷處」（路 10:34）。這一說認為雅各是說：用當時最好的藥，同時奉主的名禱告。</p><p><strong>難處：</strong>若只是用藥，為甚麼要長老來做，又為甚麼特別說「奉主的名」？油也不是對每一種病都有療效。</p>"],["象徵說","","<p>油象徵聖靈的同在與神的關顧，抹油表明這個人被分別出來、交在主手中；長老的手觸碰病人，本身就是群體的安慰。</p><p><strong>難處：</strong>ἀλείφω 是日常用字，不是禮儀性的膏抹；把它讀成純象徵，可能低估了雅各實際的、身體的關懷。</p>"],["醫治恩賜說","","<p>五旬節與靈恩傳統認為，今天照樣可以抹油禱告、期待神蹟醫治，這使我們想起門徒「用油抹了許多病人，治好他們」（可 6:13）。</p><p><strong>難處：</strong>若把油當成帶有能力的媒介，容易滑向魔法式的理解；若把抹油與「一定得醫治」綁在一起，沒好的人會受傷。</p>"],["時代說","","<p>停止論傳統認為，這屬於使徒時代的醫治恩賜，今天以一般的禱告與醫藥代替，不必再抹油。</p><p><strong>難處：</strong>5:14 寫給的是一般的教會長老，不是使徒；把它歸入已停止的神蹟恩賜，較難從經文本身證明。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為五種讀法都在基督教傳統之內；ἀλείφω 的用字最接近醫藥說與象徵說，但雅各把它放在「奉主的名」與禱告之下。</strong>不論教會採哪一種做法，有三件事不變：病人主動「請」、來的是複數的長老團隊（回指希伯來書立場五）、油不是魔法，叫人起來的是主。抹油與醫藥並行不悖。本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：病人不是一個人扛，教會要到病床旁。你的教會抹不抹油，比不上長老們有沒有真的去。</p><p>如果你正在生病，你可以照你教會的傳統「請」長老來；抹油也好、不抹也好，都繼續看醫生、照醫囑用藥。叫你起來的，是主。</p>"]],"con":[],"say":"本講義的立場：5:14 的抹油五種讀法都在基督教傳統之內；用字最接近醫藥說與象徵說，但重點是病人可以請、長老團隊要去、奉主的名禱告；油不是魔法，抹油與醫藥並行。本講義的全卷立場見 ISS00_4。","care":"會眾裡有從不同宗派轉來的人，可能因為新教會「不抹油」或「太常抹油」而不安；也有被抹油禱告後沒有好、覺得被神遺忘的病人。不要嘲笑任何一種傳統，也不要讓抹油成為「保證醫治」的儀式。久病的人需要的，是長老們一次又一次地來。"},{"id":"ISS05_7","t":"5:15「出於信心的祈禱要救那病人」——禱告了沒好怎麼辦？還要看醫生嗎？","r":"5:15；約 9:2--3；來 11:35；王上 19:4","ch":[5],"why":"這是華人教會最常被兩個方向誤用的一節：一方說「信心夠就一定好」，沒好的人被暗示信心有問題；另一方說「病了就是犯了罪」。也有人因此錯誤地停藥、拒醫。久病、重病、臨終的人和他們的家屬，最需要這一題講清楚。","pos":[["【一】經文問的是甚麼","","<p>「出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免」（5:15）。問題是：這是不是一個保證——只要禱告的信心夠，病就一定好？「他若犯了罪」是不是說病都是罪造成的？禱告了，還要看醫生嗎？</p>"],["保證醫治說","","<p>部分信心運動與成功神學傳統把 5:15 讀成應許的公式：「要救」是將來式的保證，只要信心真，醫治就一定臨到；沒有好，是因為還有懷疑。</p><p><strong>難處：</strong>這一讀忽略主詞——「主必叫他起來」，叫人起來的是主，不是信心的分數；信心屬於來禱告的人，不是病人。希伯來書 11 章的信心名單裡，「又有人忍受嚴刑」（來 11:35），同樣是因著信。保羅留特羅非摩病在米利都（提後 4:20），也沒有說是他信得不夠。</p>"],["病因說：病常與罪有關","","<p>有些講法把下半句讀成病因：既然說「他若犯了罪」，病人就應當先檢查有沒有未認的罪，罪處理了病才會好。</p><p><strong>難處：</strong>原文 κἂν 是「即使、若」，是條件，不是推定；主耶穌明說「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。雅各若認為病一定出於罪，就不必用「若」字。</p>"],["整全的救說","","<p>多數福音派解經家認為，σώσει「要救」在雅各書可以指身體，也可以指靈魂；ἐγερεῖ「叫他起來」也是新約說復活的字。主的回應可能是今天的痊癒，可能是在病中的力量與平安，也可能是最後復活的早晨。禱告與醫藥都是神的恩典，並行不悖。</p><p><strong>難處：</strong>這一讀若講得太快，可能讓人覺得「反正都算應驗」，失去對神醫治的真實期待；神能醫治，也常醫治，這一點不可以講輕。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在整全的救說：叫人起來的是主；病與罪的關係是「若」；禱告與醫藥並行，絕不鼓勵停藥拒醫。</strong>神能醫治，也常醫治；沒有好的人不是信心不夠（回指希伯來書立場四）。為重病臨終的人，禱告也可以是平安、不痛苦、與家人和好、安然見主——都在「救」與「叫他起來」的範圍裡。本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>若有人告訴你「病沒好是你信得不夠」，那不是雅各的意思，請不要因此懷疑神或懷疑自己。繼續禱告，繼續看醫生；神沒有因為你的病離開你，他是「滿心憐憫，大有慈悲」的主（5:11）。</p><p>以利亞也曾在羅騰樹下求死，神沒有責備他，先讓他睡、讓他吃。你在病中的軟弱，不是信仰失敗，是主正在陪你走的一段路。</p>"]],"con":[],"say":"本講義的立場：5:15 叫人起來的是主，不是信心的分數；病與罪的關係是「若」，不推論病因；禱告與醫藥並行，絕不叫人停藥拒醫。本講義的全卷立場見 ISS00_4，並回指希伯來書立場四。","care":"會眾裡有久病、重病、臨終的人和他們的家屬，也有曾被說「你信心有問題」而離開教會的人，有喪親後一直自責「是不是我們禱告得不夠」的家人。不要在病床旁追問原因，不要說「你要更有信心」；先陪伴，問他需要甚麼。若有人想停藥，不要責備他，溫柔而清楚地勸他與醫師商量，必要時請家屬一起陪同。"},{"id":"ISS05_8","t":"5:16「彼此認罪」——要向誰認？在小組公開嗎？","r":"5:16--18；約壹 1:9；太 18:15；加 6:1--2","ch":[5],"why":"「彼此認罪」被不同的教會做成很不一樣的樣子：有的向神父告解，有的在小組輪流交代，有的在特會上台前公開，有的完全不做。曾經有人在小組被逼著說出隱私，後來被轉述、被羞辱；也有受害者被要求向加害者「認罪和好」。這一題要劃出清楚的界線。","pos":[["【一】經文問的是甚麼","","<p>「所以你們要彼此認罪，互相代求，使你們可以得醫治。義人祈禱所發的力量是大有功效的」（5:16）。原文 ἀλλήλοις、ἀλλήλων 兩次「彼此」互相對稱，現在式命令是生活的習慣。問題是：向誰認？認到甚麼程度？在甚麼場合？目的是甚麼？</p>"],["告解說：向神職人員認罪","","<p>天主教與部分東正教傳統以此節為告解聖事的根據之一：信徒向神父認罪，由教會宣告赦免，並且嚴格保密。</p><p><strong>難處：</strong>經文說的是「彼此」、「互相」，不是單向向某一職分認罪；告解的保密是它的長處，但「彼此」的那一面在這裡沒有表達出來。</p>"],["群體公開說：在小組或聚會中認罪","","<p>有些復興運動與小組體系，把 5:16 實行成在小組或聚會中公開說出罪，認為光明中的認罪帶來釋放與復興。</p><p><strong>難處：</strong>公開認罪常變成壓力與表演，也容易造成隱私外洩與二度傷害；經文的目的是「互相代求」，不是讓群體審判。被逼認罪過的人，常常從此不敢再開口。</p>"],["可信任關係說：自願、互相、保密","","<p>多數福音派牧養傳統認為，5:16 是在可信任的關係裡——屬靈同伴、小組裡的一兩位、牧者——自願地說出掙扎，彼此禱告。得罪了誰就向誰認（太 18:15），公開的罪才需要公開處理；其他的，在小圈子裡、保密地進行。</p><p><strong>難處：</strong>若只停在「私下」，可能讓某些需要被處理的事（例如傷害他人的行為）被藏起來；所以保密也有界線。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在可信任關係說，並守四條界線：自願、互相、保密、不公開逼問。</strong>認罪的目的是被代求，不是被審判；不轉述別人的認罪，也不把它當成代禱事項傳出去。受害者不需要向加害者認罪；涉及暴力、性侵、兒少，先保護安全、依法處理——這是保密的例外，不是違反保密。本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各家都同意：神「是信實的，是公義的，必要赦免我們的罪」（約壹 1:9）。向人說出來，不是為了被赦免才說，是為了不再一個人扛。你可以只對一位信得過的人說：「請為我禱告」。</p><p>如果你曾經在公開的場合被逼著認罪、受了傷，那不是神要你承受的；神的赦免從來不需要你先被羞辱。</p>"]],"con":[],"say":"本講義的立場：5:16 的彼此認罪是在可信任的關係裡自願、互相、保密地進行，目的是互相代求；不公開逼問、不轉述；受害者不需要向加害者認罪，涉及暴力、性侵、兒少先保護安全、依法處理。本講義的全卷立場見 ISS00_4。","care":"會眾裡有在小組被逼認罪過、隱私被轉述而受傷的人，也有正在受家暴或曾被性侵、卻被教會要求「先認自己的罪再和好」的人。不要在講台上要求任何人公開說出罪；若有人私下向你說出受害的事，先相信他、保護他，依法求助，不要安排他與加害者見面。"},{"id":"ISS05_9","t":"5:19--20「救一個靈魂不死」——是誰的靈魂？信徒會失去救恩嗎？","r":"5:19--20；箴 10:12；彼前 4:8；結 3:21","ch":[5],"why":"雅各書的最後一句有一個經文異文：「救一個靈魂」還是「救他的靈魂」？而「失迷真道」的人既然在「你們中間」，很多人會問：信徒迷失了會不會失去救恩？去找人的人又是不是在救自己？這一題要並陳兩讀，並把救恩的問題回指前一卷。","pos":[["【一】經文問的是甚麼","","<p>「我的弟兄們，你們中間若有失迷真道的，有人使他回轉，這人該知道：叫一個罪人從迷路上轉回便是救一個靈魂不死，並且遮蓋許多的罪」（5:19--20）。SBLGNT（WH、NA28）作 ψυχὴν αὐτοῦ「他的靈魂」；Treg 與 RP 沒有 αὐτοῦ，和合本照此譯「一個靈魂」。問題是：被救的是誰？被遮蓋的是誰的罪？「不死」是指永遠的死嗎？</p>"],["被找回的人說（多數）","","<p>多數解經家認為，被救的是那個回轉的罪人：前面剛說「從他的道路的迷途」，「他的靈魂」最自然是同一個人；被遮蓋的許多罪，也是他的罪，因回轉而蒙赦免。這使我們想起「愛能遮掩一切過錯」（箴 10:12）、「愛能遮掩許多的罪」（彼前 4:8）。</p><p><strong>難處：</strong>這一讀要回答「你們中間」的人迷失了是否會失去救恩——雅各在這裡沒有回答這個系統神學的問題。</p>"],["去找的人說（少數）","","<p>少數讀者認為，「他的靈魂」指去找人的那一位：就像先知守望者「你也救自己脫離了罪」（結 3:21），使人回轉的人自己也因此蒙福、他的罪被遮蓋。</p><p><strong>難處：</strong>這一讀容易變成「多帶人回來可以抵銷自己的罪」，與恩典的福音不合；文法上也較不自然。</p>"],["救恩會不會失落：兩大傳統","","<p>改革宗傳統認為，真信徒蒙神保守到底，迷失的人若是真信徒必被找回；「不死」是警告的分量，也是神保守人的方法。阿民念與衛斯理傳統則認為，信徒若刻意持續離棄真道，可能失去救恩，所以使人回轉是真正救命的事。</p><p><strong>難處：</strong>前者若講輕，會讓人不在乎走失的人；後者若講重，會讓敏感的良心整天害怕。兩派都同意：走失的人必須被找回。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義取多數讀法：被救的是被找回的那個人，被遮蓋的是他的罪；異文兩讀照實陳列，講台照和合本說「一個靈魂」。</strong>救恩會不會失落，不在這一節定案，回指希伯來書立場二。雅各要的不是辯論，是行動：全卷最後一筆，是一個任務。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你站在哪一個傳統，這一節對你說的都一樣：那個失迷真道的弟兄，是你的 2。如果你自己就是那個走遠了的人，請知道——雅各寫這一句，是為了讓有人來找你。</p><p>回轉是主的工作；我們能做的，是先被主的憐憫找到，然後出門，站到那個人旁邊。</p>"]],"con":[],"say":"本講義的立場：5:20 被救的是被找回的那個罪人，異文兩讀照實陳列；救恩會不會失落不在這一節定案，回指希伯來書立場二。這一節的重點是任務：去把走失的弟兄找回來。","care":"會眾裡有正在迷失、偶爾才回來坐在最後一排的人，有家人離開信仰、日夜擔心「他會不會沉淪」的父母，也有被「你會失去救恩」嚇過的敏感良心。不要用這一節恐嚇走失的人，也不要讓擔心的家人背上「沒把他找回來就是我的錯」；回轉是主的工作，我們的任務是溫柔地去。"}],"terrain":{"points":[[0.556,66,2,"都要以為大喜樂",null],[0.778,22,8,"心懷二意的人","bot"],[1.111,90,17,"各樣美善的恩賜……都是從上頭來的","top"],[1.635,14,4,"這豈不是你們偏心待人","bot"],[1.981,88,13,"憐憫原是向審判誇勝","top"],[2.481,32,26,"信心沒有行為也是死的",null],[2.806,6,6,"舌頭就是火","bot"],[3.417,86,17,"從上頭來的智慧，先是清潔","top"],[3.529,16,1,"爭戰鬥毆是從哪裡來的呢","bot"],[3.824,96,6,"神阻擋驕傲的人，賜恩給謙卑的人","top"],[4.294,36,14,"你們原來是一片雲霧",null],[4.725,10,5,"當宰殺的日子","bot"],[5.025,98,11,"主是滿心憐憫，大有慈悲","top"],[5.475,84,20,"叫一個罪人從迷路上轉回",null]]},"tracks":[{"gk":"πίστις／ἔργον","tr":"pistis / ergon","gl":"信心 ↔ 行為","code":"G4102","root":"πίστις——信、信心（動詞 πιστεύω 信）；ἔργον——工、工作、行為。雅各書合計 31 次，第 2 章 25 次（都不含動詞 πιστεύω；πιστεύω 另有 3 次，都在第 2 章）。本卷追蹤的不是一個字，是一對字的關係：信心與行為「並行」（2:22 συνήργει，一同做工）。希伯來書已立 πίστις（在看不見的時候站得住）、帖撒羅尼迦後書已立 ἐργ- 字族（三種工）；雅各問的是：信心有沒有手","ins":"這條追蹤是一對字的對話。第一站，信心先被試驗：「因為知道你們的信心經過試驗，就生忍耐」（1:3），而且「但忍耐也當成功」（1:4）——「成功」原文是 ἔργον τέλειον，忍耐要「做完它的工」。全卷第一個「行為」，原來是忍耐的工。1:6 信心是禱告的姿勢：「只要憑著信心求，一點不疑惑」；1:25 行道的人「乃是實在行出來」。第 2 章是這兩個字正面相遇的地方。信心的第一個試金石不是信條，是座位：「你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人」（2:1）。第一個翻轉：「若有人說自己有信心，卻沒有行為，有甚麼益處呢」（2:14）——雅各問的是「說」出來的信心。診斷是「信心若沒有行為就是死的」（2:17）；方法是「我便藉著我的行為，將我的信心指給你看」（2:18）——行為是信心被看見的樣子。第二個翻轉：「鬼魔也信，卻是戰驚」（2:19）——信條正確，連鬼魔都有。2:20 是一個雙關：原文說沒有行為（ἔργων）的信心是 ἀργή，「不做工的」；和合本照另一個抄本譯作「死的」。頂點在 2:22：「而且信心因著行為才得成全」——原文 συνήργει，信心與行為「一同做工」，不是兩件事，是同一件事的兩面；2:26 收束：「信心沒有行為也是死的」。第三個翻轉，行為在第 3 章換了樣子：「他就當在智慧的溫柔上顯出他的善行來」（3:13）——行為的樣子是溫柔。最後一站：「出於信心的祈禱要救那病人」（5:15）——信心最後的行為，是跪下來為人禱告。改變觀念就改變生命，改變生命就改變生活：沒有生活的觀念，是死的。","stops":[["1:3","因為知道你們的信心經過試驗，就生忍耐","top"],["1:4","但忍耐也當成功",""],["1:6","只要憑著信心求，一點不疑惑",""],["1:25","乃是實在行出來",""],["2:1","你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人",""],["2:14","若有人說自己有信心，卻沒有行為，有甚麼益處呢","bot"],["2:17","信心若沒有行為就是死的",""],["2:18","我便藉著我的行為，將我的信心指給你看",""],["2:19","鬼魔也信，卻是戰驚","bot"],["2:20","你願意知道沒有行為的信心是死的嗎",""],["2:22","而且信心因著行為才得成全","top"],["2:26","信心沒有行為也是死的",""],["3:13","他就當在智慧的溫柔上顯出他的善行來",""],["5:15","出於信心的祈禱要救那病人","top"]]},{"gk":"πειρασμός／ὑπομονή","tr":"peirasmos / hypomonē","gl":"試煉、試探 ↔ 忍耐、恆忍","code":"G3986","root":"πειρασμός／πειράζω——試煉、試探（同一個字，從外面看是試煉，從裡面看是試探）；δοκίμιον／δόκιμος——試驗、經過試驗（煉金的字）；ὑπομονή／ὑπομένω——在重壓下站得住；μακροθυμία／μακροθυμέω——心長、能等。全卷共 16 次，集中在第 1 章與第 5 章：一封以試煉開頭、以忍耐收尾的信","ins":"雅各書以試煉開頭，以忍耐收尾。第一站：「你們落在百般試煉中，都要以為大喜樂」（1:2）——πειρασμοῖς，外面來的難處。為甚麼可以喜樂？因為「因為知道你們的信心經過試驗，就生忍耐」（1:3）——δοκίμιον 是煉金的字，試驗是為了證明是真的；而且「但忍耐也當成功，使你們成全、完備，毫無缺欠」（1:4）。1:12 把三個字放在一節裡：「忍受試探的人是有福的」，經過試驗以後必得生命的冠冕。翻轉在下一節：同一個字從「試煉」變成「試探」——「人被試探，不可說：我是被神試探」（1:13）；源頭在裡面：「但各人被試探，乃是被自己的私慾牽引誘惑的」（1:14）。同一件事，從外面看是試煉，神要成全你；從裡面看是試探，私慾要拉走你。分別在往哪一條路上走：忍耐，還是私慾。第 5 章回到忍耐，換了一個字 μακροθυμέω——心長：「弟兄們哪，你們要忍耐，直到主來」（5:7），「你們也當忍耐，堅固你們的心」（5:8）；眾先知是「當作能受苦能忍耐的榜樣」（5:10）。終點與第 1 章的「有福」呼應：「那先前忍耐的人，我們稱他們是有福的」（5:11）——約伯的結局說明主是滿心憐憫。反敗為勝成為得勝者：不是不被試煉，是在試煉裡站得住。","stops":[["1:2","你們落在百般試煉中，都要以為大喜樂","top"],["1:3","因為知道你們的信心經過試驗，就生忍耐",""],["1:4","但忍耐也當成功，使你們成全、完備，毫無缺欠",""],["1:12","忍受試探的人是有福的","top"],["1:13","人被試探，不可說：我是被神試探","bot"],["1:14","但各人被試探，乃是被自己的私慾牽引誘惑的","bot"],["5:7","弟兄們哪，你們要忍耐，直到主來",""],["5:8","你們也當忍耐，堅固你們的心",""],["5:10","當作能受苦能忍耐的榜樣",""],["5:11","那先前忍耐的人，我們稱他們是有福的","top"]]},{"gk":"κρίνω／κρίσις／κριτής","tr":"krinō / krisis / kritēs","gl":"判斷、審判、審判者、論斷、疑惑","code":"G2919","root":"κρίνω——判斷、分辨、審判；κρίσις——審判；κριτής——審判者；κρίμα——判決；διακρίνω——在自己裡面判來判去＝疑惑，在人中間判來判去＝偏心。全卷 17 次","ins":"「判斷」在雅各書裡從一個人的心裡開始。第一站是 διακρίνω：「一點不疑惑；因為那疑惑的人，就像海中的波浪」（1:6）——疑惑就是心裡的法庭沒有結案，一直判來判去。第一個翻轉，同一個字根走到會堂門口：「這豈不是你們偏心待人，用惡意斷定人嗎」（2:4）——διεκρίθητε 與 κριταί，坐在門口的人當起了審判官。然後審判轉回到我們自己身上：「你們既然要按使人自由的律法受審判」（2:12），而在那審判裡有一句全卷最亮的話：「憐憫原是向審判誇勝」（2:13）。教導人的人先被審判：「因為曉得我們要受更重的判斷」（3:1）。第 4 章是一節四次：「人若批評弟兄，論斷弟兄，就是批評律法，論斷律法」（4:11）——論斷人的人，坐到了律法的上面。第二個翻轉，也是頂點：「設立律法和判斷人的，只有一位」（4:12）——審判的位子只有一個人能坐。那一位就在門外：「看哪，審判的主站在門前了」（5:9）；所以說話要真，「免得你們落在審判之下」（5:12）。驕傲是離開本位抓住權力，想要代替神；論斷人，就是坐上神的位子。","stops":[["1:6","一點不疑惑；因為那疑惑的人，就像海中的波浪","bot"],["2:4","這豈不是你們偏心待人，用惡意斷定人嗎","bot"],["2:12","你們既然要按使人自由的律法受審判",""],["2:13","憐憫原是向審判誇勝","top"],["3:1","因為曉得我們要受更重的判斷",""],["4:11","人若批評弟兄，論斷弟兄，就是批評律法，論斷律法","bot"],["4:12","設立律法和判斷人的，只有一位","top"],["5:9","看哪，審判的主站在門前了",""],["5:12","免得你們落在審判之下",""]]},{"gk":"πλούσιος／πτωχός／ταπεινός","tr":"plousios / ptōchos / tapeinos","gl":"富足 ↔ 貧窮；卑微、自卑 ↔ 升高、驕傲","code":"G5011","root":"πλούσιος／πλοῦτος——富足、錢財；πτωχός——貧窮（一無所有、要伸手的人）；ταπεινός／ταπεινόω——卑微、降卑、自卑；ὑψόω——升高；ὑπερήφανος——驕傲（高高顯露在別人之上）。全卷 16 次：從錢包的高低，轉到心的高低","ins":"高與低，是雅各書的另一條線。第一站是神的翻轉：「卑微的弟兄升高，就該喜樂」（1:9），「富足的降卑，也該如此」（1:10）——富足的人也有喜樂的理由：降卑；因為「那富足的人，在他所行的事上也要這樣衰殘」（1:11），像草上的花。第一個翻轉，會堂門口把神的翻轉倒回來了：「又有一個窮人穿著骯髒衣服也進去」（2:2），他被叫去站著、坐在腳凳下。雅各反問：「神豈不是揀選了世上的貧窮人，叫他們在信上富足」（2:5）——一節之內窮與富交換位置；而你們「你們反倒羞辱貧窮人」（2:6）。第二個翻轉是全卷的鉸鏈：高低從錢包轉到心——「神阻擋驕傲的人，賜恩給謙卑的人」（4:6）。頂點在 4:10：「務要在主面前自卑，主就必叫你們升高」——1:9 那個「升高」原來有一條路，就是自己往下走。最後回到錢包，這一次是審判：「你們這些富足人哪，應當哭泣、號咷」（5:1），因為「你們的財物壞了」（5:2）。謙卑戰勝驕傲，謙卑是復興的鑰匙——321 的這一句，出處就在這條線的正中央。","stops":[["1:9","卑微的弟兄升高，就該喜樂","top"],["1:10","富足的降卑，也該如此",""],["1:11","那富足的人，在他所行的事上也要這樣衰殘",""],["2:2","又有一個窮人穿著骯髒衣服也進去","bot"],["2:5","神豈不是揀選了世上的貧窮人，叫他們在信上富足","top"],["2:6","你們反倒羞辱貧窮人","bot"],["4:6","神阻擋驕傲的人，賜恩給謙卑的人","top"],["4:10","務要在主面前自卑，主就必叫你們升高","top"],["5:1","你們這些富足人哪，應當哭泣、號咷","bot"],["5:2","你們的財物壞了",""]]},{"gk":"ἐπιθυμία／ἡδονή／ζῆλος","tr":"epithymia / hēdonē / zēlos","gl":"私慾、貪戀、宴樂 ↔ 嫉妒、紛爭；（神的）戀愛至於嫉妒","code":"G1939","root":"ἐπιθυμία——強烈的想要；ἡδονή——快感、宴樂（4:1、3 和合本作「私慾」「宴樂」）；ζῆλος——熱心、嫉妒；ἐριθεία——爭競、結黨；φθόνος——嫉妒。全卷 11 次：慾望打不贏，就變成戰爭","ins":"第一站是一個釣魚的畫面：「乃是被自己的私慾牽引誘惑的」（1:14）——「牽引」「誘惑」原文是漁夫與獵人的字，私慾是一個餌。下一站是它的家譜：「私慾既懷了胎，就生出罪來」（1:15），罪長成了就生出死來。第一個翻轉：私慾在教會裡換了一件屬靈的衣服，叫「熱心」與「爭競」——「你們心裡若懷著苦毒的嫉妒和紛爭」（3:14），結果是「在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事」（3:16）。頂點在第 4 章：「不是從你們百體中戰鬥之私慾來的嗎」（4:1）——「你們貪戀，還是得不著」（4:2），連禱告都變成「要浪費在你們的宴樂中」（4:3）。第二個翻轉是全卷最難、也最溫柔的一節：「神所賜、住在我們裡面的靈，是戀愛至於嫉妒嗎」（4:5）——全卷最後一個「慾」不是人的，是神的；一種讀法說，神對我們有一種戀慕至於嫉妒的愛，不肯把我們分給世界。緊接著是 4:6「但他賜更多的恩典」。有己是人類墮落的根源；無己不是變成一個沒有慾望的人，是被一個更大的愛佔滿。","stops":[["1:14","乃是被自己的私慾牽引誘惑的","bot"],["1:15","私慾既懷了胎，就生出罪來","bot"],["3:14","你們心裡若懷著苦毒的嫉妒和紛爭",""],["3:16","在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事",""],["4:1","不是從你們百體中戰鬥之私慾來的嗎","bot"],["4:2","你們貪戀，還是得不著",""],["4:3","要浪費在你們的宴樂中",""],["4:5","神所賜、住在我們裡面的靈，是戀愛至於嫉妒嗎","top"]]}],"lesson":{"1":{"no":1,"vol":"《321雅各書講義》第一課·雅各書第一章","title":"詳細察看，並且時常如此——認定、出身、彎腰","chars":5240,"min":60,"deep":8,"dchars":1671,"tchars":1489,"blocks":[["h","一、你上一次認真照鏡子，是甚麼時候？"],["p","弟兄姊妹平安。先問大家一個問題：你上一次認真照鏡子，是甚麼時候？不是出門前瞄一眼，是停下來，湊近一點，好好看一看自己的臉。我們每天都照鏡子，可是很少真的看見自己。"],["p","有一位姊妹告訴我，她上一次認真照鏡子，是在醫院的洗手間。母親剛推進加護病房，她進去洗把臉，抬頭一看，嚇了一跳：鏡子裡那個人眼睛腫著，像好幾天沒睡。還有一位弟兄說，他上一次認真照鏡子，是半夜，手機螢幕黑下來的那一秒，玻璃裡映出自己的臉，他剛關掉一個說好不再打開的網站。他說：那一張臉，我不太想認。"],["p","雅各書第一章的最後，雅各就拿出了一面鏡子：「因為聽道而不行道的，就像人對著鏡子看自己本來的面目，看見，走後，隨即忘了他的相貌如何。」（1:23--24）他說，聽道就是照鏡子。我們每個主日都在照，問題不是照了沒有，是照完以後，我們做了甚麼。"],["p","所以這一課，我們要一起照一次鏡子。照書信三問，先問第一問：收信的人遇到甚麼？「作神和主耶穌基督僕人的雅各請散住十二個支派之人的安。」（1:1）散住，原是撒種的字。這些猶太信徒被撒到各城，在異鄉做工、被地主欺壓、在小小的聚會裡彼此扶持。雅各寫信，不是為了一件事，是為了一種生活：在異鄉，在貧窮，在試煉裡，怎樣活出信心。我們這個散在各國、在線上聚集的團契，對這種生活不陌生。"],["p","寫信的人只稱自己是僕人。他是主的弟弟，曾經和家人一起以為哥哥癲狂了；復活的主向他顯現以後，他一輩子不再拿「主的兄弟」當頭銜。這面鏡子，他自己先照過。這一課走三步：在試煉裡認定，看清自己的出身，在鏡子前彎下腰。"],["d",["雅各書是寫給散住十二個支派的猶太信徒，跟今天的我們有甚麼關係？","照書信三問來讀就清楚了。第一問，收信的人遇到甚麼：他們散居各城、貧窮做工、被地主富商欺壓，在小小的聚會裡彼此扶持。第二問，雅各從福音推出甚麼原則：一切美善從上頭來，神用真道生了我們，所以在試煉裡可以認定神要成全我們，信心要長出一雙看顧人的手。第三問，這原則今天落在哪裡：每一個在異鄉、在職場、在病床旁的人，都活在同一種生活裡。實際上可以這樣讀：每讀一章，先問自己今天的處境哪裡和他們一樣，再找出那一樣從上頭來的東西。本講義的全卷立場見 ISS00_1。"]],["h","二、在試煉裡：是認定，不是假裝"],["p","雅各的問安只有一個字：願你們喜樂。下一句，他就把喜樂和試煉放在同一口氣裡：「我的弟兄們，你們落在百般試煉中，都要以為大喜樂」（1:2）。「落在」，是一腳踩空、掉進坑裡的字，試煉不是你去找的。「百般」，原文是五顏六色的：一張裁員通知，一份檢查報告，一個不回訊息的孩子，一個在異鄉過的年。"],["p","這一句最容易被講錯。有人在告別式上拍拍喪家的肩膀說：要喜樂啊。那不是雅各的意思。「以為」原文是 ἡγήσασθε，是會計算帳、法官判斷的字，意思是算為、認定。它在頭腦裡，不在臉上。同一位雅各，在第四章說：「你們要愁苦、悲哀、哭泣」（4:9）；在第五章說：「你們中間有受苦的呢，他就該禱告」（5:13）。主耶穌在拉撒路的墳前也哭了。所以眼淚可以在臉上，認定可以在心裡；喜樂在這裡是一個認定，不是假裝不痛。"],["p","認定甚麼？「因為知道你們的信心經過試驗，就生忍耐。」（1:3）「試驗」原文 δοκίμιον，是金匠煉金的字。金匠把金子放進火裡，不是要燒掉它，是要證明它是真金。神許可你進火，不是要毀掉你，是要顯出你裡面那一點真的。然後：「但忍耐也當成功，使你們成全、完備，毫無缺欠。」（1:4）「成功」是讓忍耐把它的工作做完，像麵包不能半生就出爐。這一章在全卷五篇裡是「全」篇，這一個「成全」，就是篇名的字。"],["p","試煉裡最缺的，常常不是力氣，是智慧。雅各接了一個字，第四節說「毫無缺欠」，第五節馬上說：「你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神，主就必賜給他。」（1:5）「厚賜」原文 ἁπλῶς，是單純地給，不打折扣，不先開條件。「不斥責人」，就是你第一百次問同一個問題，他也不翻白眼。"],["p","接著雅各講到兩種試煉：窮和富。「卑微的弟兄升高，就該喜樂；富足的降卑，也該如此」（1:9--10）。在工地扛水泥的弟兄，在神面前有一個高位；富足的人也有喜樂的理由：他終於看清楚，錢不能定義他，因為草會枯乾，花會凋謝。雅各不是仇視富足的人，也不是美化貧窮，他是把錢從寶座上請下來，讓神重新排過每一個人的位子。"],["d",["我現在真的很痛苦，讀到「都要以為大喜樂」，是不是表示我不可以難過？","可以難過。「以為」原文 ἡγήσασθε 是算為、認定，是頭腦裡的判斷，不是臉上的表情。同一位雅各在 4:9 叫人哭泣，在 5:13 叫受苦的人禱告。所以眼淚和認定可以同時存在：臉上在哭，心裡可以慢慢認定，這一場火不是神要毀掉我，是要證明我的信心是真的。實際上，不必急著對自己說「我要喜樂」，可以先誠實地對神說「我很痛」；過幾天，再把 1:3--4 讀給自己聽。若痛苦已經影響睡眠、飲食好幾個星期，請告訴牧者或家人，必要時尋求專業協助，這和信靠神並不衝突。"]],["d",["1:6 說「一點不疑惑」，那我禱告時心裡有懷疑，神就不聽了嗎？","雅各說的疑惑，原文是心裡的法庭判來判去、永遠不肯結案；接著他用 δίψυχος 解釋：兩個魂、兩邊都要的人。這和心裡有一個問號不同。說「我信不足」的那位父親，主沒有拒絕他。有問號的人可以帶著問號來求；二意的人是一手求神、一手抓住一條後路，他的手沒有空，接不住任何東西。所以要檢查的不是「我有沒有一點懷疑」，而是「我是不是另外留了一個王」。實際上，可以把懷疑直接說給神聽，然後問自己：如果神說不，我第一個想去找的是誰？那個名字，就是要交出來的後路。"]],["h","三、原文亮光：兩個魂、兩個「生」、一彎腰"],["p","這一章有三個原文字，認得了它們，這面鏡子就照得清楚。"],["p","第一個原文字：δίψυχος，「心懷二意」。「心懷二意的人，在他一切所行的路上都沒有定見。」（1:8）字首是「兩個」，字根是「魂」：一個人裡面住著兩個魂。這個字在雅各以前的希臘文獻裡找不到，新約只有兩次，這裡一次，第四章一次：「心懷二意的人哪，要清潔你們的心」（4:8）。全卷就是從這一個字走到那一個字。請注意，δίψυχος 不是心裡有問號。有一位父親對主說：「我信！但我信不足，求主幫助」（可 9:24），主沒有拒絕他。二意的人是兩邊都要：禮拜天把生命交給神，禮拜一把安全感交給存款；禱告求神帶領，心裡另外留一條後路。像一隻腳踩在船上，一隻腳踩在岸上，船一離岸，他哪裡都去不了。"],["p","第二個原文字，是兩個「生」。先看試探從哪裡來。「人被試探，不可說：『我是被神試探』；因為神不能被惡試探，他也不試探人。」（1:13）第二節的「試煉」和第十二節的「試探」，原文是同一個字；同一件事，可以是神手裡的試驗，也可以變成把人拉倒的引誘。差別在哪裡？「但各人被試探，乃是被自己的私慾牽引誘惑的。」（1:14）「牽引誘惑」是釣魚的字。魚不是看見鉤子才上鉤，是看見了餌。然後雅各寫了一份家譜：「私慾既懷了胎，就生出罪來；罪既長成，就生出死來。」（1:15）最後那個「生出」，原文是 ἀποκύει。"],["p","請看清楚次序：試探不是罪。念頭來了、餌在眼前，還不是罪；主耶穌自己「也曾凡事受過試探，與我們一樣，只是他沒有犯罪」（來 4:15）。私慾要懷了胎，人接住它、抱住它、餵養它，才生出罪來。這對在色慾、賭博或其他上癮裡掙扎的人是好消息：念頭來的那一刻，不是你完了，是你轉身的那一刻；這樣的掙扎需要的是陪伴，有時需要專業協助，不是定罪。可是也不可輕看，罪會長成，家譜的最後一代是死；斷開它最好的時候，是第一代。"],["p","接著，雅各說：「我親愛的弟兄們，不要看錯了。」（1:16）不要看錯神。「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從眾光之父那裡降下來的；在他並沒有改變，也沒有轉動的影兒。」（1:17）然後是全章最重要的一句：「他按自己的旨意，用真道生了我們，叫我們在他所造的萬物中好像初熟的果子。」（1:18）這個「生了」，原文是 ἀπεκύησεν，和 1:15 的 ἀποκύει 是同一個動詞。三節之內，兩份家譜：私慾生出死，神用真道生出我們。你不是靠咬牙從私慾的家族裡逃出來，是另一位父親親自把你生下來。出身換了。後面雅各會下很多命令，可是每一個命令，都是從這一句恩典長出來的。"],["p","第三個原文字：παρακύψας，「詳細察看」。「惟有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。」（1:25）這個字的意思是彎下腰去看。復活的早晨，門徒跑到空墳前，「低頭往裡看，就見細麻布還放在那裡」（約 20:5），用的就是這個字。站著瞄一眼，看見的是字；彎下腰，看見的是自己，也看見那位復活的主。後面那一句「時常如此」，原文 παραμείνας，是留在旁邊。1:24 那個人「走後」，1:25 這個人留下來。還有一個小地方：和合本的「使人自由」，「使人」兩個字是補上去的小字，原文是屬自由的律法。神栽在人裡面的話，不是捆住人的繩子，是叫人得自由的生命。"],["d",["神不試探人，可是神又「試驗亞伯拉罕」，主禱文也求「不叫我們遇見試探」，這怎麼說？","原文是同一個字，在不同的地方有不同的方向。神試驗人，像金匠煉金，是為了證明、為了成全，所以 1:2--4 說試煉要叫我們成全、完備；神從來不引誘人犯罪，所以 1:13 說「神不能被惡試探，他也不試探人」。同一件事，在神手裡是試驗；被自己的私慾接過去，就變成了引誘。主禱文那一句的幾種讀法，議題頁另有並陳，都在說我們需要神保守。實際上，遇到難處時可以問兩個問題：神在這裡要成全我甚麼？我心裡有甚麼想要，正在被這件事拉出來？"]],["d",["我常常有不好的念頭跑出來，這樣是不是已經犯罪了？","照 1:15 的次序，念頭來了還不是罪。私慾要懷了胎，就是人接住它、抱住它、一再餵養它，才生出罪來。主耶穌自己也凡事受過試探，只是他沒有犯罪。所以念頭跑出來的那一刻，不是你完了的時候，是你可以轉身的時候。可是也不要和它相處，罪會長成。實際上可以做三件事。第一，念頭一來，立刻說出來給神聽：主，這個餌又來了。第二，把餌移開：刪掉那個 App，改走另一條路，晚上把手機放在客廳。第三，找一位可信任的同伴，請他固定問你。若是色情、賭博這一類反覆的掙扎，請不要一個人扛，牧者和專業的協助都是神給的幫助，需要的是陪伴，不是定罪。"]],["h","四、鏡子前的三種人"],["p","有了這三個字，我們回到鏡子前。這一段從 1:19 開始：「我親愛的弟兄們，這是你們所知道的。但你們各人要快快地聽，慢慢地說，慢慢地動怒」（1:19）。我們常常反過來：慢慢地聽，快快地說，快快地動怒。「因為人的怒氣並不成就神的義。」（1:20）慢慢地動怒，不是不准生氣，是讓怒氣在出手之前，先經過神面前。"],["p","然後他說，要「存溫柔的心領受那所栽種的道」（1:21）。「所栽種的」原文 ἔμφυτον，是栽在裡面的。道不是貼在牆上的標語，是種進泥土裡的種子。所以行道不是靠自己咬牙用力，是領受那道，讓它在裡面長出來。"],["p","第一種人，是聽了就走的人。「只是你們要行道，不要單單聽道，自己欺哄自己。」（1:22）「欺哄自己」原文是算錯帳。一位弟兄十年來主日從不缺席，筆記本寫滿了三本，可是他和弟弟為了遺產，六年沒講過一句話。每次聽到饒恕的道，他都點頭，回家就忘。他照得很勤，只是照完就走了。主耶穌在山上也說過：「凡聽見我這話就去行的，好比一個聰明人，把房子蓋在磐石上」（太 7:24）。弟弟用了哥哥的話。"],["p","第二種人，是自以為虔誠的人。「若有人自以為虔誠，卻不勒住他的舌頭，反欺哄自己的心，這人的虔誠是虛的。」（1:26）聚會從不缺席，禱告很長，可是在群組裡一句話就能刺傷一個人。「勒住」原文 χαλιναγωγῶν，是給馬套上嚼環。請聽清楚：勒馬不是割掉馬的舌頭，勒住舌頭也不是叫受了傷的人閉嘴，不是叫提問的人不要問，不是叫指出問題的同工不准開口。被勒住的是刻薄的話、論斷人的話、搬弄是非的話；該說的真話，仍然要在溫柔裡說出來。"],["p","第三種人，是彎下腰、留下來的人。「在神我們的父面前，那清潔沒有玷污的虔誠，就是看顧在患難中的孤兒寡婦，並且保守自己不沾染世俗。」（1:27）「看顧」原文 ἐπισκέπτεσθαι，是探望，就是走一趟，去敲那一扇門。請看次序：先走出去看顧人，再保守自己。所以不沾染世俗不是躲進教會、和世界隔開，像一位醫生走進病房，不是不碰病人，是洗淨了手再去碰。鏡子照到最後，長出了一雙手。"],["d",["雅各說要行道，那我行得不夠好，是不是表示我沒有真正得救？","先看次序。雅各在講「要行道」之前三節，先說「他按自己的旨意，用真道生了我們」（1:18），又說那道是「所栽種的」，栽在裡面。行道不是買救恩的價錢，是被生下來的生命自然長出來的樣子。所以為自己行得不夠而焦慮的人，請先回到 1:18：你的出身是神決定的。同時，雅各也不讓人停在只聽不行，他說那是自己欺哄自己。本講義的全卷立場見 ISS00_2：得救本乎恩，也因著信；但叫人得救的信心從來不是孤單的。實際上，不必一次改完全部，這一週只選一件事，照著做一次。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 1:2 要求受苦的人不准流淚：「你要喜樂，哭就是沒有交託。」ἡγήσασθε 是認定，不是表情；雅各自己在 4:9 叫人哭泣、在 5:13 叫受苦的人禱告。要求剛失去親人的人在神面前也戴上笑臉，只會叫他更孤單。"],["p","第二個偏差，是把 1:14--15 的試探等同於罪，對正在掙扎的人一律定罪。雅各寫的是一份家譜，私慾要懷了胎才生出罪來。反過來也是錯的：把「試探不是罪」講成可以和餌相處，說只是看看、只是想想。罪會長成，這一章同時保護兩種人：掙扎的人不被定罪，玩火的人不被安慰錯了。"],["p","第三個偏差，是用 1:6--8 責備禱告還沒有得著的人：「你求不到，是因為你心裡有懷疑。」雅各說的疑惑是兩個魂、兩邊都要，不是心裡有問號；為家人禱告多年還沒看見改變的人，不該被這一節壓得不敢再求。"],["p","第四個偏差，是錯把 1:22--25 的「要行道」講成靠行為得救，叫為自己不夠好而焦慮的人懷疑得救。雅各先說的是「用真道生了我們」，行道是栽在裡面的道長出來，不是贖價。反過來也錯：說「只要信，生活怎樣都可以」，只聽不行，雅各說那是自己欺哄自己。"],["p","第五個偏差，是把 1:26--27 用歪：拿「勒住舌頭」叫受害者不要再提，或把「不沾染世俗」講成不和非信徒做朋友、只待在教會裡最安全。前者讓受傷的人再傷一次，後者把雅各的次序顛倒了，他要的虔誠，第一個動作是走出去探望。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很多人從小學會報喜不報憂。家族群組裡只放好消息，教會小組裡被問近況，第一句總是「都好，感謝主」。久了，連在神面前也只報喜。有人以為這就是 1:2 的以為大喜樂，其實正好相反：假裝的喜樂是給人看的，雅各的認定是在神面前的。教會要成為一個可以哭、也可以被抱住的地方，不是一個大家比誰笑得最好看的地方。"],["p","第二個問題：我們這個團契裡，有很多真正散住的人：在異鄉工廠輪班的移工，一個人在外地讀書的學生，把孩子留給祖父母、自己出國打拼的父母，還有留在家鄉、子女都不在身邊的長輩。今天的孤兒寡婦，不一定是字面上的孤兒寡婦，可能是週末沒有地方去的移工，可能是一個人吃年夜飯的老人。1:27 的看顧，在今天常常是一通視訊、一趟探望、一頓飯。散住的人彼此看顧，異鄉就有了一個家。"],["d",["教會裡有人說出自己的試探或軟弱，小組可以怎樣接住他，而不是嚇跑他？","照 1:19 來：先快快地聽，慢慢地說，慢慢地動怒。第一，先謝謝他願意說。第二，不要急著給答案，也不要立刻引一節經文糾正他；問他：你希望我們怎樣陪你？第三，保密。他說的話不要拿到別的地方轉述，連「請為某某的那件事禱告」也不行。第四，約一個具體的陪伴，例如每週問一次，或一起找專業的協助。若牽涉暴力、性侵或兒少的安全，先保護安全，依法處理，不能只在小組裡禱告了事。不是沒有人跌倒，是跌倒的人有人扶。"]],["h","七、活出321——彎下腰，鏡子就長出一雙手"],["p","先讓經文把話講完：試煉是為了成全，試探從自己的私慾來，可是一切美善都從上頭來，神用真道生了我們；被生下來的人，彎下腰照鏡子，並且留下來。然後我們才把國度321空中團契常說的那幾句話接上去。"],["p","耶穌是我的榜樣：他在曠野被試探，餌是真的，他沒有咬；他在客西馬尼說心裡甚是憂傷，可見認定神是好的，不必假裝不痛。寫這封信的弟弟，就是在這位哥哥身上學會的，所以他在 1:1 只稱自己是僕人。"],["p","聖經是我的準則：讀完這一章，才知道這句話的姿勢。不是因為讀過，是因為像 1:25 那樣彎下腰，並且時常如此；站著的人評論經文，彎下腰的人被經文看見。"],["p","聖靈是我的引導：從 1:5 開始，先承認我缺，然後求。那位厚賜與眾人、也不斥責人的神，不嫌你問第一百次。遇到不知道怎麼辦的事，先開口求，再做決定。"],["p","讓耶穌作王：δίψυχος 的人不是不信神，是心裡另外留了第二張寶座，給存款、給人脈、給某一種癮。讓耶穌作王，就是拆掉那一條後路；也是讓出審判官的椅子，不再像 1:13 那樣把神拉到被告席上。"],["p","讓耶穌得著一切的榮耀：1:9--10 唯一合法的誇口，是誇神重新排過的位子；1:17 一切美善都從上頭來。做成了一件事，第一句話是「這是他給的」。建立屬神的體系：1:27 說，一個群體屬靈不屬靈，要看它怎樣對待最沒有聲音的人；體系的第一個樣子，是一份有人認領的患難名單。"],["h","八、四種心，站在同一面鏡子前"],["p","驕傲型的心很會照鏡子，可是照的是別人。聽道的時候想：這一段某某該聽一聽。1:23 那面鏡子照的是「自己本來的面目」。請你今天先問：這一句話在說我甚麼？彎下腰的姿勢，本身就是謙卑。"],["p","恐懼型的心怕試煉，更怕神變了：日子順就覺得他近，日子暗就以為他走了。1:17 說天上的光會轉、會投下移動的影子，造光的那一位沒有轉動的影兒。會變的是你的處境，不是他的心。"],["p","羞恥型的心在試探裡跌倒過，覺得自己早就完了，乾脆不再照鏡子。請你聽 1:18：你的出身不是你的私慾，是神用真道生的。鏡子不是要羞辱你，是要讓你看清楚以後，可以去洗臉。找一位可信任的同伴，把那個餌說出來。"],["p","受傷型的心，也許曾經被人用「你要喜樂」堵住眼淚，或被人用「勒住舌頭」叫你不要再提那件事。請聽清楚：雅各自己叫受苦的人禱告、叫人哭；勒住的是刻薄的話，不是你的傷。你可以在神面前哭，也可以說出來；若那份傷害還在繼續，請告訴一位信得過的人，必要時尋求專業的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，選一節經文當這一週的鏡子，1:19 或 1:26 都可以。每天早上讀一次，晚上睡前再讀一次，問自己一句：今天我照著做了哪一件？把答案寫一行。"],["p","第二，每天早上讀 1:17--18，對神說：我所有美善的，都是你給的；我是你用真道生的。遇到缺智慧的事，照 1:5 直接開口求，求完寫下來，週末回頭看。"],["p","第三，每一次想說「都是他害的」「為甚麼是我」，先停三秒，問：這是試煉，還是我自己的私慾在拉我？如果有一個反覆跌倒的地方，這一週找一位可信任的同伴說出來，請他每晚問你一次。"],["p","第四，照 1:19 練一次先聽完：找家人或同事，好好聽他說十分鐘，不打斷、不給建議、不急著辯解。"],["p","第五，在通訊錄裡找出一位在患難中的人：剛喪偶的長輩、剛失業的同事、一個人在異鄉的移工。約一個時間，帶一點吃的，去坐半小時，先聽他說。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：一切美善的恩賜都是從上頭來的，在眾光之父那裡沒有轉動的影兒。"],["p","我宣告：我的出身不是私慾的家譜，是神按自己的旨意，用真道生了我。"],["p","我宣告：在試煉裡我可以流淚，也要認定神要叫我成全、完備，毫無缺欠。"],["p","我宣告：我要彎下腰詳細察看神的話，並且時常如此，讓聽見的變成一雙看顧人的手。"],["d",["「看顧在患難中的孤兒寡婦」，我自己也很忙、很窮，這一週可以從哪裡開始？","散住的信徒自己也窮，雅各仍然叫他們去看顧，可見看顧不是有錢有閒的人才做得到。「看顧」原文是探望，最小的單位就是走一趟。可以這樣開始。第一，打開通訊錄，找出一個名字：剛喪偶的長輩、剛失業的同事、一個人在異鄉的移工或學生，寫下來。第二，約一個時間，三十分鐘就夠，帶一點吃的，或一起吃一頓簡單的飯；人在遠方的，就打一通視訊。第三，去的時候先聽，不必講道。第四，回來在小組裡說一句他需要甚麼，看看大家能不能接手一點。"]],["h","十、結語"],["p","我們回到一開始的問題：你上一次認真照鏡子，是甚麼時候？醫院洗手間裡那位姊妹後來說，那一天她在鏡子前站了很久，然後禱告了一句很短的話：主，我很累，可是我知道你沒有變。她沒有假裝不痛，她做了一個認定。半夜那位弟兄，第二天傳了一則訊息給小組長：我又開始了，你可以每天晚上問我一次嗎？那張不想認的臉，他終於肯留在鏡子前多看一會兒。"],["p","可是這一課的焦點，不在我們從此更會照鏡子，也不在雅各有多嚴厲。焦點在那一張臉：寫這封信的弟弟，曾經和家人以為哥哥癲狂了；復活的主站在他面前，那是他看過最清楚的一面鏡子。他在那張臉上看見了自己的二意，也看見那張臉沒有斥責他。所以他才寫得出「也不斥責人的神」，才寫得出「用真道生了我們」。我們要更愛的，不是作者，是作者的哥哥，我們的主耶穌。"],["p","我們一起低頭禱告。眾光之父，謝謝你沒有轉動的影兒，謝謝你按自己的旨意，用真道生了我們。在試煉裡流淚的，求你讓他知道可以哭，也可以認定你是好的；在試探裡掙扎的，求你給他勇氣說出來，也給他一位陪伴的同伴；聽了很多年卻一直走開的，求你叫我們彎下腰，並且留下來，讓你栽在我們裡面的道，長成一雙看顧人的手。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰讀得多，是讓每一個人在同一面鏡子前，說出自己看見了甚麼、這一週要行出哪一件；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是在同一面鏡子前彎下腰，並且留下來。席上可能有正在試煉裡流淚的人，也可能有在試探或上癮裡掙扎的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：以為大喜樂是一個認定，不是假裝不痛；試探不是罪，私慾懷胎才生罪，神卻用真道生了我們；行道是彎下腰、留下來，讓栽在裡面的道長出來。"],["n","1. ★ 你上一次認真照鏡子，是甚麼時候、在哪裡？那一次你在鏡子裡看見了甚麼，是你原本不知道的？"],["n","2. ★★★ 1:15 的「生出死來」和 1:18 的「生了我們」，原文是同一個字。請用一句話說：這兩份家譜有甚麼不同？對你來說，哪一份是你的出身？"],["n","3. ★★ 「以為大喜樂」是認定，不是表情。請說一件你經歷過的試煉，那時候你臉上是甚麼樣子，心裡認定了甚麼？"],["n","4. ★★ 1:24 的人「走後」，1:25 的人「時常如此」，是留下來。你讀經、聽道，比較常是哪一種？請舉上一個主日的一句話為例。"],["m","帶領提醒：讀經時請一口氣從 1:12 讀到 1:18，讓兩個「生」字一起被聽見，不要停在 1:15。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人在鏡子前說出一個自己的樣子，二意、推卸或聽了就走，並從「他按自己的旨意，用真道生了我們」（1:18）出發，說出這一週要行出的一件事。"],["t","【看】看見自己"],["n","5. ★★★ 這一章的鏡子照出三種樣子：心懷二意、把跌倒推給別人或神、聽了就走。哪一種最像你這一個月？說出一個具體的時間和場合。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:5 和 1:17--18 兩遍。第二遍讀完說一句：那位「也不斥責人」、沒有轉動影兒的神，對你這一週的哪一件事是好消息？"],["t","【想】想通關卡"],["n","7. ★★★ 你心裡那條捨不得拆的後路，或那一團一直在眼前的餌，叫甚麼名字？是存款、一個人的肯定、某一個 App，還是別的？你為甚麼捨不得放下它？不必說細節，說出它的名字就好。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我的出身不是我的私慾，是神用真道生了我。」右手邊的人只回一句「他也不斥責人」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要當鏡子的那一節經文，以及你要行出來的一件事：哪一天、在哪裡、對誰；再寫下你請哪一位組員在週末問你「那一節，你行出來了沒有」。"],["m","帶領提醒：這一化可能碰到喪親、重病、失業、長期無望感，也可能碰到性的試探、賭博或其他上癮，甚至家庭傷害。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」或「你要喜樂」，也不定罪說出試探的人；他說的話留在組裡，不轉述。會後單獨關心，必要時協助尋求專業協助。若有人覺得自己已經完了，先和他一起讀 1:17--18。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個要探望的患難中的人，一次先聽完的練習，一位陪伴的同伴，一位要分享的人。"],["n","10. ★★★ 說出一位在患難中的人的名字：剛喪偶的長輩、剛失業的同事、一個人在異鄉的移工或學生。這一週哪一天、在哪裡探望他，要帶甚麼去？"],["n","11. ★★ 照 1:19 先聽完：這一週你要好好聽誰說十分鐘，不打斷、不給建議？是家人、同事還是組員？打算哪一天、在甚麼場合？"],["n","12. ★ 我們小組或服事團隊可不可以整理一份患難名單，每人認領一位，這個月至少探望一次？由誰負責整理，哪一天以前完成？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：一切美善都從上頭來，神也不斥責人，他可以帶著試煉和軟弱去求。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我們每天照鏡子，卻很少真的看見自己。第二句，聖經像一面鏡子，照出一顆兩邊都要的心，也照出一位不斥責人、把好東西從上頭給我們的神。第三句，看見了不要走開，彎下腰，留下來，做一件事。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多注意」這類答案；自己正在患難中的組員，先問小組能替他做甚麼，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要當鏡子的那一節經文是哪一節，我要去探望的是誰。可以只說名字的第一個字。"],["p","然後彼此代禱，為三種人指名禱告：一位正在試煉裡、眼淚還沒有乾的人，求主讓他知道可以哭，也可以被抱住；一位正在某種試探或上癮裡掙扎的人，求主給他勇氣說出來，也給他一位願意陪伴的同伴；一位散住在異鄉、孤單做工的弟兄姊妹，求主讓他在團契裡有一個家。"],["p","散會以前，確認紙上寫了三樣：那一節經文、要探望的那一個人、你的那個「2」。下次帶來對。"]]},"2":{"no":2,"vol":"《321雅各書講義》第二課·雅各書第二章","title":"信心是與他的行為並行——眼睛、雙手、朋友","chars":5163,"min":60,"deep":8,"dchars":1731,"tchars":1496,"blocks":[["h","一、一個希臘字：一同做工"],["p","弟兄姊妹平安。συνήργει。這一課先送你一個希臘字，它藏在這一章最中間的一節：「可見，信心是與他的行為並行，而且信心因著行為才得成全。」（2:22）和合本譯作「並行」的，就是這個字。它是兩塊拼起來的：前面是「一同」，後面是「工作」。照字面，信心和行為是「一同做工」的。"],["p","一同做工是甚麼樣子？想一想一對結婚四十年的老夫妻在廚房包水餃。太太擀皮，先生包餡，兩個人幾乎不說話，你很難說那一盤水餃是誰做的。雅各說，信心和行為就是這樣在同一個廚房裡一起做工。"],["p","去年有一個小組，一位弟兄的母親中風住院。群組裡一下子出現二十幾個「為你禱告」和一排愛心。大家都是真心的。可是那個星期，只有一位不太說話的姊妹，煮了一鍋湯送到醫院，又替他守了一夜。後來那位弟兄說：那一鍋湯，讓我知道神沒有忘記我。"],["p","雅各從來沒有說禱告不重要。他問的是：你的信心，有沒有和你的手一同做工？照書信三問，先問散住的人遇到甚麼。他們是散居各地、貧窮做工的猶太信徒，常被地主富商拉上公堂；可是外面那一套看人的規矩，悄悄走進了他們小小的會堂，嘴上的信仰越講越熟，手卻越來越少伸出去。"],["p","雅各從福音推出的原則，在第一章就說了：「他按自己的旨意，用真道生了我們」（1:18）。生命是神白白生的，所以這生命是活的，活的東西就會長出手來。今天這原則落在教會的門口、小組的群組和我們的錢包。這一課走三步：眼睛、雙手、朋友。"],["h","二、門口的眼睛：先照我們自己"],["p","雅各一開口就把兩樣東西擺在一起：「我的弟兄們，你們信奉我們榮耀的主耶穌基督，便不可按著外貌待人。」（2:1）重點在句尾那個詞：榮耀。一個人若真的看見了榮耀的主，別人手上的金戒指就亮不起來了。"],["p","然後雅各演了一幕：一個帶金戒指、穿華美衣服的人，和一個穿骯髒衣服的窮人，同時走進「你們的會堂」。一個被請到好位子，一個被叫去站著，或坐在別人的腳凳下邊。請留意，雅各不是在講外面的社會，他講的是教會自己的門口。所以這一課也不先去罵外面，先照我們自己。"],["p","今天我們排座位的方式很多。線上聚會，誰的鏡頭常被放大，誰一開麥克風，主持人就說時間差不多了？事奉名單和小組長的人選，有沒有悄悄照著奉獻、學歷、職業、國籍、口音在排？這些常常沒有人故意安排，是眼睛自己作了決定。"],["p","雅各的診斷是：「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）「偏心」原文的意思，是在自己裡面分開了。這接上第一章「心懷二意」的人：一半說我信榮耀的主，一半盯著金戒指。心裡的分裂，走到門口，就變成座位的分配。而「用惡意斷定人」，原文是「成了審判官」：憑一件衣服、一個口音、一份履歷，就判了一個人值多少。"],["p","接著雅各說：「神豈不是揀選了世上的貧窮人，叫他們在信上富足」（2:5）。請聽清楚，這一節不是說貧窮本身是美德，也不是說有錢人不能得救；仇富一樣是按外貌待人，只是方向反過來。雅各要的不是換一批人坐前排，是換掉我們看人的眼睛。2:7 的「所敬奉」，和合本小字說也可譯作「被稱」：受洗那一天，主的名被呼叫在你身上；那位穿骯髒衣服進來的弟兄，身上也有同一個名字。"],["d",["教會特別感謝大額奉獻的人，或請他們坐前排，這樣算不算偏心待人？","感謝本身不是罪，保羅也常在信裡點名感謝供應他的人。雅各在意的是 2:4 那兩件事：心裡分開了，又成了審判官。可以用兩個問題檢查。第一，一位寡婦的兩個小錢，有沒有被同樣看見？第二，奉獻多的人，是不是因此在決策和事奉上自動多一份聲音？實際上，教會可以把感謝放在神面前，不公開排名；事奉名單照恩賜與品格，不照奉獻；招待同工受訓練，先向新面孔走過去。貧富與偏心的全卷立場見 ISS00_3。"]],["h","三、原文亮光：取人的臉、屬王的、不做工的"],["p","開場我們已經拆了 συνήργει，這一節再拆三個字。三個字連起來，剛好是這一章的一條線：眼睛怎樣看人，王怎樣看人，信心怎樣做工。"],["p","第一個原文字：προσωπολημψίαις，和合本譯作「按著外貌待人」。這是兩個字合起來的：臉，加上拿、取。照字面，是「取人的臉」：看見一張臉，就按那張臉定價。2:1 用的還是複數，偏心不只一種樣子：看衣服、看車子、看職銜、看口音、看膚色。今天最常見的一種，也許是看大頭貼：先看是誰傳的，再決定多快回。雅各說，這不只是不禮貌：「但你們若按外貌待人，便是犯罪，被律法定為犯法的。」（2:9）"],["p","第二個原文字：βασιλικὸν，「屬王的」。「你們若全守這至尊的律法才是好的」（2:8）。「至尊的」原文就是屬王的、王家的。三節以前雅各才說貧窮人要承受「國」；國有一位王，王有一條律法，國民就照王的眼光看人。王怎樣看那個坐在腳凳下的人，國民就怎樣看他。接著 2:10 說，只在一條上跌倒，就是犯了眾條：沒有一個人可以靠守住大部分律法，在神面前站得住。"],["p","所以雅各在這裡說出全章的最高點：「因為那不憐憫人的，也要受無憐憫的審判；憐憫原是向審判誇勝。」（2:13）「誇勝」原文是站在上面歡呼。在門口作審判官的人，有一天也要站在審判台前；可是在神的國裡，最後說話的不是審判，是憐憫。這是這一章裡「從上頭來的」那一樣。我們能給出去的憐憫，都是先從神那裡領受的；一個記得自己被憐憫過的人，就沒有辦法再替別人排座位。"],["p","第三個原文字：ἀργή，在 2:20。和合本照另一批古抄本的讀法，譯作「死的」：「虛浮的人哪，你願意知道沒有行為的信心是死的嗎？」（2:20）可是今天多數學者採用的抄本，這裡用的是 ἀργή：否定字首加上「工作」，意思是「沒有工的、閒著的」，葡萄園比喻裡在市場上閒站的人，就是這個字。而同一句話前面才剛說「沒有行為」，「行為」就是 ἔργων。所以這句話照字面是一個雙關：沒有工作的信心，是不做工的。像一台停在車庫十年沒發動的車，有牌照，卻從來沒有載過人。兩種讀法說的是同一件事：一個說它沒有生命，一個說它沒有作用。講台照和合本念「死的」，但請你記得這個雙關。"],["d",["2:10 說只在一條上跌倒就是犯了眾條，那所有的罪都一樣大嗎？","不是。罪在後果、對人的傷害、需要的處理上確實有輕重，主耶穌自己也說過有「更重的罪」。雅各在 2:10 講的是另一件事：律法是一整件，像一面窗玻璃，打破一個角，那面窗就破了。偏心不是小事，它和姦淫、殺人一樣，是同一位神所禁止的。所以在「我能不能靠自己站在神面前」這件事上，每個人都在同一個位置：需要憐憫。這就是為甚麼雅各隔兩節就說「憐憫原是向審判誇勝」。實際上，讀到這一節，不要拿它來說「反正大家都一樣有罪」，而是讓它把我們從審判官的位子請下來。"]],["d",["和合本 2:20 說「死的」，另一種抄本說「不做工的」，那聖經是不是被改過？","新約的抄本有幾千份，抄寫時難免有小差異，絕大多數都不影響任何教義，2:20 就是一個例子。和合本依照的是較晚、數量較多的抄本，作「死的」；今天多數學者採用的較早抄本作 ἀργή，「不做工的」，很可能是抄寫的人從 2:17、2:26 順手把「死的」帶了進來。兩種讀法的意思一致：一個說這種信心沒有生命，一個說它沒有作用。後一種讀法還多了一個雙關，因為同一句才說「沒有行為」。這不是聖經被改，而是我們有足夠多的抄本，可以把原來的字找回來。講台照和合本念，小組裡可以講出這個雙關：信心是會做工的。"]],["h","四、說出來的信心，長出手的信心"],["p","現在我們走到全卷最重要的一段：「我的弟兄們，若有人說自己有信心，卻沒有行為，有甚麼益處呢？這信心能救他嗎？」（2:14）請先聽見那個「說」字。雅各問的是一個說出來的信心；「這信心」原文有冠詞，指的是只停在嘴上的那一種。"],["p","雅各舉的例子很具體：「若是弟兄或是姊妹，赤身露體，又缺了日用的飲食」（2:15），有人對他們說「平平安安地去吧！願你們穿得暖，吃得飽」（2:16），卻甚麼也不給。這個例子不是割禮、不是守節，雅各說的「行為」是愛的行為，是一碗飯、一件外衣。然後他下結論：「這樣，信心若沒有行為就是死的。」（2:17）不是弱的，不是不夠好的，是死的。"],["p","接著他說：「你信神只有一位，你信的不錯；鬼魔也信，卻是戰驚。」（2:19）這是以色列人每天背的信仰告白，完全正確；鬼魔也同意，同意到發抖，卻從來沒有因此去愛任何一個人。有一種信，是同意一個句子；有一種信，是把自己交給一位神。"],["p","然後雅各請出兩個人。第一位是祖宗亞伯拉罕。請你看時間：「亞伯蘭信耶和華，耶和華就以此為他的義。」（創 15:6）那一夜他甚麼都還沒做，只是抬頭數星星，信了應許；神在那一夜就算他為義，白白的。三十多年後，在摩利亞山上，他把以撒放在壇上。雅各說，那時候信心和行為 συνήργει，一同做工；「信心因著行為才得成全」，這個「成全」和 1:4「使你們成全」是同一個字根。行為不是替一個有缺口的信心補洞，是一顆種子長到結果子的那一天。所以那句話在山上「應驗」了，他「又得稱為神的朋友」。"],["p","第二位是：「妓女喇合接待使者，又放他們從別的路上出去，不也是一樣因行為稱義嗎？」（2:25）希伯來書說她是「因著信」，雅各說她是「因行為」：同一件事，兩個角度，信心在她心裡，行為在她手上。雅各把一位祖宗和一位外邦的妓女，放在同一排。"],["p","講到這裡，一定有人想起保羅。雅各說：「這樣看來，人稱義是因著行為，不是單因著信。」（2:24）保羅說：「人稱義是因著信，不在乎遵行律法。」（羅 3:28）兩人怎樣放在一起讀，歷代教會有幾種讀法，路德、加爾文和天主教的天特會議都認真處理過，講義的議題頁與全卷立場 ISS00_2 照實陳列，這一課只說一句：保羅說「白白的」，雅各說「活的」。救恩是白白得來的，「你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的」（弗 2:8）；可是白白得來的生命，是活的。"],["p","所以這一段有兩種人要聽。如果你一直在想我做得夠不夠、我真的得救了嗎，請你聽雅各自己說的：你的新生命是神「用真道生了我們」，而且「但他賜更多的恩典」（4:6）。一棵蘋果樹不是靠結果子才變成蘋果樹，它是蘋果樹，所以結果子。可是如果你心裡很平靜，因為你知道自己因信稱義，所以那位缺了日用飲食的弟兄好像不關你的事，那雅各就要問你一句：你的信心，有手嗎？因信稱義，從來不是冷眼看人的理由。叫人得救的信心，從來不是孤單的。"],["d",["我常覺得自己做得不夠，讀到「這信心能救他嗎」，就很怕自己根本沒有得救，怎麼辦？","請先讀清楚 2:14 的那個「說」字：雅各問的是「若有人說自己有信心」，一個只停在嘴上、手從來沒有動過的人。他不是在對一位真心倚靠神、卻常常覺得自己做得不夠的人說話。而且雅各自己相信恩典：「他按自己的旨意，用真道生了我們」（1:18），「但他賜更多的恩典」（4:6）。你的新生命是神生的，不是你做出來的。實際上可以這樣做：把這兩節寫在卡片上，睡前讀出來；也找一位信得過的弟兄姊妹或牧者，說出你的不安，不要一個人扛。行為不是你要交的考卷，是恩典慢慢長出來的手。信心與行為的全卷立場見 ISS00_2。"]],["d",["喇合是妓女，又對耶利哥王的人說謊，雅各怎麼能說她是因行為稱義？","雅各稱讚的不是她的職業，也不是她的謊話，而是她「接待使者，又放他們從別的路上出去」：在全城都怕以色列人的時候，她冒著生命危險，把自己交給以色列的神。希伯來書說她「因著信」，雅各說她「因行為」，是同一件事的兩個角度。至於她說謊，神接納她的信心，並不等於認可她的每一個做法。雅各把一位外邦的妓女和祖宗亞伯拉罕放在同一排：在神的國裡，座位不是照過去排的。今天教會裡那位過去很不光彩的人，也可能是神放在我們中間的喇合。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把這一章講成靠行為得救，或拿 2:14 去量自己、量別人有沒有得救：你做得不夠，證明你沒得救。雅各問的是「若有人說」的那一種信心，他自己相信神「用真道生了我們」。行為不是換救恩的錢，是被救的生命長出來的手。"],["p","第二個偏差，正好反過來：我們是因信稱義的，雅各說的跟我們無關；或者順口說一句，路德說這是稻草書信，不必太認真。這是讓因信稱義變成冷漠的藉口。路德那句話是拿它和別的書信比較，他仍然把雅各書留在聖經裡；雅各要刺痛的，正是冷眼看飢寒弟兄、卻說自己信得很好的人。"],["p","第三個偏差，是讀完 2:1–7 只去罵外面的社會、罵有錢人，卻不回頭看我們自己的事奉名單和座位。雅各說的是「你們的會堂」。另一個方向也要防：不可以仇富，也不可以美化貧窮；換一批人坐前排，眼睛還是同一雙。"],["p","第四個偏差，是把「行為」縮成宗教活動：聚會的次數、奉獻的數字、服事的時數。這些都好，可是雅各舉的例子，是給赤身露體的人衣服、給缺了飲食的人一碗飯、像喇合那樣接待陌生人。保羅也說：「惟獨使人生發仁愛的信心才有功效。」（加 5:6）雅各的行為，是愛的行為。"],["p","第五個偏差，是拿 2:24 去打保羅，或拿這一段去嘲笑別的傳統：笑路德看不懂雅各書，或笑天主教靠功德。在一章講偏心的經文裡嘲笑別人，正好就是 2:4 那種「用惡意斷定人」。"],["d",["路德不是說雅各書是「稻草書信」嗎？那我們還要這麼認真讀它嗎？","要認真讀。路德在 1522 年德文新約的序言裡，說雅各書和約翰福音、羅馬書、加拉太書這些他認為最清楚講基督的書卷比起來，是「稻草」；那是比較，不是把它丟掉，他仍然把雅各書留在他翻譯的聖經裡，後來的講道也常引用它。路德擔心人把雅各書當作靠行為得救的證據；我們今天更常見的是另一個方向：把因信稱義當成不必伸手的理由。所以兩個方向都防。對路德，也對天主教的讀法，講義只陳列，不嘲諷。正典地位的全卷立場見 ISS00_8，信心與行為見 ISS00_2。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們從小就懂座位。婚宴的主桌、尾牙的前排、家族聚餐誰坐上座，一看就知道誰算哪一等。這種眼光進了教會，常常變得很客氣，卻沒有消失：感謝名單上誰的名字先念，探訪先去誰家。很多教會裡，還有一群很少被看見的弟兄姊妹：外籍看護、移工、新來的學生。他們有自己的語言堂，這很好；可是我們有沒有哪一次，請他們上台讀一段經文，或在小組裡為我們禱告？2:5 說他們在信上富足，我們卻常常只把他們當成受助的對象。"],["p","第二個問題：讀完 2:15–16，有人會想：親戚、弟兄來借錢，是不是每一個開口的人，我都要給？雅各說的是「缺了日用的飲食」的人，是真實的缺乏，不是每一個要求。愛也需要智慧：可以替人付房租，不必替人還賭債；可以帶他去買菜，不一定直接給現金；個人承擔不了的，可以交給教會的愛心基金和同工一起看。可是有一件事雅各不讓我們做：拿一句「我為你禱告」，把一個真實缺乏的人擋在門外。"],["d",["親戚或教會裡的弟兄常常來借錢，我每一次都要給嗎？不給是不是沒有信心？","不一定要每一次都給，不給也不等於沒有信心。雅各說的是「缺了日用的飲食」：真實的、基本的缺乏。愛需要智慧，也需要界線。先分辨：他缺的是飯、房租、醫藥費，還是一個賭債？後者直接給錢常常是在傷害他。實際上可以這樣做：用東西代替現金，帶他去買菜、替他付一次房租或醫藥費；個人承擔不了的，交給教會的愛心基金或同工一起評估，不要一個人扛；若牽涉賭博、成癮或家暴，請一起尋求專業的協助。只有一件事雅各不讓我們做：拿一句「我為你禱告」把一個真實缺乏的人擋在門外。貧富與偏心的全卷立場見 ISS00_3。"]],["h","七、活出321——信心長出眼睛和手"],["p","先讓經文把話講完：神揀選了世上的貧窮人，憐憫向審判誇勝，亞伯拉罕被白白算為義，他的信心在山上和行為一同做工。讀到這裡，321 才在末端認出它自己的話。"],["p","耶穌是我的榜樣：2:1 稱他為「我們榮耀的主耶穌基督」，而這位榮耀的主在地上，常常坐在別人不肯坐的位子：和稅吏一同吃飯，讓被看不起的女人靠近他的腳。他摸痲瘋病人，餵飽五千人，最後把自己給了出去。「他本來富足，卻為你們成了貧窮，叫你們因他的貧窮，可以成為富足。」（林後 8:9）"],["p","聖經是我的準則：2:8 說那條「要愛人如己」的律法是屬王的。準則不只是我讀懂的句子，是我手上真的照著做的那一條。這一週讀經，每天問一句：這一節要我的手做甚麼？"],["p","聖靈是我的引導：該向誰伸手、伸到甚麼程度，不是一條規則決定得了的。求聖靈開我們的眼睛，看見那位我們一直繞過去的人。"],["p","讓耶穌作王：這一章要讓出來的位子有兩個。一個是門口的帶位權，誰坐前面、誰站後面，不再由我的眼睛決定；一個是 2:4 的審判官席，我不再憑一件衣服判一個人的價值。屬王的律法，就是讓王的眼光成為教會門口唯一的價目表。"],["p","讓耶穌得著一切的榮耀：雅各說榮耀屬於主，不屬於金戒指。伸出手不是為了讓人看見自己有多好，是讓被接待的人知道神沒有忘記他。那一鍋湯的榮耀，歸給背後那一位。"],["p","建立屬神的體系：321 常說，人比事重要，關係比東西重要。2:2–4 就是全本新約最具體的一幕：金戒指和骯髒衣服是東西，走進門的兩個人才是人。體系的門口最誠實：招待的訓練、輪流讀經的名單、讓外籍弟兄姊妹進入同工團隊，讓偏心從制度上被拆掉。"],["h","八、四種心，伸不出手的理由"],["p","驕傲型的心，眼睛先動：對有頭銜的人多說三句話，覺得自己的信仰已經很正確。雅各對你說：鬼魔也信得很正確。請你下一次把最耐心的一次聆聽，留給一位不能回報你的人。"],["p","恐懼型的心，手不敢伸：怕給了不夠，怕被利用，怕一伸手就收不回來。也有另一種怕：讀完 2:14 整夜睡不著，怕自己沒有得救。請先聽「但他賜更多的恩典」（4:6）。行為不是你要交的考卷，是恩典在你身上長出來的手；從一件小事開始就好。"],["p","羞恥型的心，覺得自己就是那個坐在後面的人：衣服不好，口音很重，沒有頭銜，不好意思開口說自己缺了甚麼。雅各對你說：神揀選了世上的貧窮人，叫他們在信上富足，主的尊名被呼叫在你身上。你不是受助的對象，你是承受國的人。"],["p","受傷型的心，也許曾經在教會被安排在後面，被看不起，或者伸過手卻被人利用、被欺騙。這些傷是真的，雅各沒有叫你假裝沒事。憐憫向審判誇勝，先是神向你誇勝；你可以先在他面前被接待，再慢慢學習有界線地伸手。若傷害還在繼續，請告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，下一個主日或下一次線上聚會，早到十分鐘，找一位你從來沒有和他說過話的人，坐到他旁邊，或在聊天室私訊他，問他的名字，聽他說完。"],["p","第二，打開手機，找一則你回過「為你禱告」的訊息，問主：在這句祝福後面，我可以伸出哪一隻手？然後這一週做一件具體的事：一頓飯、一次接送、一筆小小的實際幫助。"],["p","第三，每天早上讀 2:13 一次，說出昨天一件你被神憐憫的事；晚上問自己：今天我的眼睛替誰排了座位？"],["p","第四，在你的小組或事工團隊，提出一件具體的改變：讓外籍弟兄姊妹或新朋友輪流讀經、分享，或排進服事名單。"],["p","第五，如果你常為「我是不是沒有得救」不安，把 1:18 和 4:6 寫在卡片上放在床頭，睡前讀出來；如果你是另一種人，信得很安穩卻很久沒有伸手，就求主這一週指給你一位你一直繞過去的人。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我的新生命是神用真道生的，我得救是白白的恩典，他賜更多的恩典。"],["p","我宣告：我信奉榮耀的主耶穌基督，我的眼睛不再照金戒指替人排座位。"],["p","我宣告：憐憫向審判誇勝，我領受過的憐憫，要從我的手上流出去。"],["p","我宣告：我的信心要和我的行為一同做工，白白得來的生命，是活的。"],["d",["我想伸手，可是自己也很拮据，沒有錢也沒有時間，這一週可以怎麼開始？","雅各的讀者自己就是貧窮做工的人，他不是寫給有錢人的。所以這一章的行為，常常不是一筆大錢，而是一個座位、一碗湯、一次聆聽。可以從很小的地方開始。第一，叫出一個名字：大樓清潔阿姨、公司的外包同事、教會的外籍看護，問一個關於他的問題，聽他說完，這不花錢。第二，把你本來就要做的事多做一份：煮飯多煮一碗，出門順路接送一個人。第三，和小組一起伸手：一個人拿不出來的，五個人一起就可以。第四，若你自己正缺乏，請讓小組知道；接受幫助也是信心。白白得來的生命是活的，它長出來的第一隻手，常常很小。"]],["h","十、結語"],["p","我們回到那個廚房。老夫妻包完水餃，太太把一半裝進保鮮盒，先生騎機車送去巷口那位獨居的阿伯家。阿伯問：你們怎麼知道我今天沒吃飯？先生說：不知道啊，只是今天包多了。信心和行為在那一盤水餃裡一同做工，做到連自己都分不出來。"],["p","可是這一課的焦點，不在那對老夫妻有多好心，也不在我們從此要更用力行善。焦點在那一位榮耀的主：他本來富足，卻為我們成了貧窮；我們每一個人都是穿著骯髒衣服走到他門口的，他沒有說「你站在那裡」，他說：來，坐在我的桌子旁邊。一個被這樣接待過的人，手就會自己長出來。你不必更佩服雅各，也不必更害怕自己做得不夠，只要更愛這一位：雅各的哥哥，我們榮耀的主耶穌基督。"],["p","我們一起低頭禱告。天父，謝謝你用真道生了我們，謝謝你在我們甚麼都還沒做的時候，就白白算我們為義。赦免我們的眼睛常常照金戒指排座位，赦免我們常常只說一句「平平安安地去吧」。求你讓我們領受過的憐憫，從我們的手上流出去；也求你安慰那些為自己做得不夠而不安的人，讓他們知道你賜更多的恩典。讓我們的信心和行為一同做工，叫人看見你。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰做的善事多，也不比誰的神學最正確，是讓每一個人說出一位自己一直繞過去的人，也說出這一週要伸出的那一隻手；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是眼睛、雙手、朋友。席上可能有為自己做得不夠而焦慮的人，也可能有正缺乏、或曾在教會被安排在後面的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：偏心是在心裡分開、坐上審判官的位子；憐憫向審判誇勝；救恩是白白的，白白得來的生命是活的。"],["n","1. ★ 說一次你走進一個場合，一看座位就知道自己「算哪一等」的經驗：是婚宴、尾牙、家族聚餐，還是開會？那一刻你心裡在想甚麼？"],["n","2. ★★★ 2:22 說信心和行為「一同做工」。請用一句話說：行為和信心的關係，比較像補洞，還是像一顆種子結出果子？為甚麼？"],["n","3. ★★ 2:13 說「憐憫原是向審判誇勝」。說出一件你知道自己被神憐憫過的事，這件事怎樣改變你看那些「坐在後面的人」？"],["n","4. ★★ 保羅說「白白的」，雅各說「活的」。如果有一位朋友問你兩人是不是矛盾，你會怎樣用兩三句話回答他？"],["m","帶領提醒：讀經時請一口氣從 2:14 讀到 2:26，再回頭讀 1:18 和 4:6，不要只停在 2:24。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己的眼睛怎樣替人排座位、自己的信心哪裡沒有手，並從「用真道生了我們」出發，說出這一週要伸出的一隻手。"],["t","【看】看見自己"],["n","5. ★★★ 在我們的小組、教會或線上聚會裡，說出一個你自己會不自覺「分等級」的地方：對誰的訊息回得特別快？誰一開口你就比較不耐煩？最近一次是哪一天？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:15–17 和 1:18 兩遍，第二遍讀完說一句：神用真道生了你，這對你這一週要伸出的那一隻手，是甚麼樣的好消息？"],["t","【想】想通關卡"],["n","7. ★★★ 你伸不出手，底下怕的是甚麼：怕不夠、怕被利用、怕麻煩、怕別人怎麼看，還是覺得那不關我的事？或者你怕的是另一件事：怕自己根本沒有得救？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我的生命是神白白生的，所以我的信心可以長出手來。」右手邊的人只回一句「憐憫原是向審判誇勝」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要伸出的一隻手：對象是誰（說出名字或身分）、哪一天、在哪裡、你要給的是甚麼，一頓飯、一個座位、一次接送，還是一份實際的需要？"],["m","帶領提醒：只說自己，不點名別人。若有人為「我是不是沒有得救」流淚，先和他一起讀 1:18 和 4:6，不要對他說「那你就要多做一點」。若有人分享曾在教會被輕看，或正面對失業、債務、家庭暴力、長期無望感，不追問細節，不要求他原諒任何人，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆和錢包：一個被叫出名字的人、一份給缺乏者的實際幫助、一件團隊裡的具體改變、一位要分享的人。"],["n","10. ★★★ 這週你可以給哪一位「缺了日用飲食」的人甚麼？當場說出他的名字，說出哪一天、在哪裡、你要給的是一頓飯、一袋菜、一次醫藥費，還是一次接送。"],["n","11. ★★ 說出一位你在教會或公司一直只點頭、從來沒有叫過名字的人：外籍看護、清潔阿姨、外包同事或新朋友。這一週哪一天，你要叫出他的名字，問他一個關於他自己的問題？"],["n","12. ★ 在你服事的團隊或小組裡，你可以提出哪一個具體安排，讓外籍弟兄姊妹或新朋友輪流讀經、分享，或排進服事名單？要在哪一次會議、向誰提？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：救恩是白白的，白白得來的生命是活的。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，神接納一個人，不看他戴不戴金戒指，也不看他做了多少。第二句，耶穌白白地救了我，這是我做不來、只能領受的。第三句，被這樣接待過的人，手就會自己伸出去，這就是活的信心。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心別人」這類答案；正在缺乏的組員，先問小組能為他做甚麼，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要伸出手的對象是誰，要給的是甚麼。可以只說身分，不必說名字。"],["p","然後為三種人指名禱告：一位在教會裡常被忽略的外籍看護、移工或新朋友，求主讓他在我們中間被叫名字、被接納；一位為自己做得不夠而焦慮、懷疑自己是否得救的弟兄姊妹，求主讓他聽見「用真道生了我們」的恩典；一位正缺日用飲食的家庭，求主讓我們成為他禱告的回應。"],["p","散會以前，確認紙上寫了三樣：要叫出名字的那一個人、要伸出的那一隻手、你的那個「2」。下次帶來對。"]]},"3":{"no":3,"vol":"《321雅各書講義》第三課·雅各書第三章","title":"從一個口裡出來——舵、泉、種","chars":4906,"min":60,"deep":8,"dchars":1862,"tchars":1370,"blocks":[["h","一、主日晚上，那一張餐桌"],["p","弟兄姊妹平安。主日晚上七點，林家的餐桌上擺著四菜一湯。爸爸、媽媽、八十歲的外婆、讀高二的兒子、讀國小的妹妹。早上爸爸剛在教會司琴，下午又帶了小組，那一週小組讀的是 1:19：「你們各人要快快地聽，慢慢地說，慢慢地動怒」（1:19）。飯吃到一半，兒子把手機推到桌子中間，小聲說：模擬考成績出來了，數學沒有及格。"],["p","爸爸沒有看手機。他把筷子放下，看著兒子，說了一句話：我怎麼會生出你這種孩子。"],["p","那一句話說出口之後，整張桌子安靜下來。妹妹低頭看著自己的碗，不敢夾菜。外婆假裝在挑魚刺，挑了很久。媽媽張了一下嘴，又閉上。兒子沒有頂嘴，他把碗裡剩下的飯慢慢吃完，說了一聲我吃飽了，回到房間，把門輕輕關上。不是用力摔，是輕輕關上。湯涼了，沒有人去熱。"],["p","那一句話只有十個字，說出來不到兩秒。可是從那一刻起，這一家人吃飯的樣子變了。兒子後來每一次考試，都不再把成績拿到餐桌上。爸爸心裡其實很後悔，可是他一直沒有說，因為他想：我又沒有說錯甚麼，我是為他好。"],["p","雅各書第三章，就是寫給坐在這張餐桌旁的每一個人。照書信三問，先問：散住的人遇到甚麼？他們在異鄉的小聚會裡，誰都可以站起來講；他們貧窮、被欺壓、疲倦，最容易受傷的地方，常常不在外面，在自己人的嘴裡。這一章是全・行・言・謙・忍的「言」，鏡子照到了口。我們走三步：舵、泉、種。"],["h","二、小小的舵：誰在掌舵"],["p","雅各第一句不是罵說話的人，是對教導的人說：「我的弟兄們，不要多人作師傅，因為曉得我們要受更重的判斷。」（3:1）林家爸爸是小組長，他那個週五才帶大家讀過慢慢地說。這一節的重量就在這裡：你教過的話，別人會拿來量你，神也會。可是請聽清楚，原文把「多人」放在句首，雅各擋的是搶著教，不是開口。主日學老師、小組長、在群組裡分享一段經文的姊妹，都不必因為這一節閉嘴。新約一樣說要「彼此教導，互相勸戒」（西 3:16）。3:1 不是把恩賜壓下去，是提醒拿著恩賜的人：你手上的是一片舵。"],["p","接著雅各說「原來我們在許多事上都有過失」（3:2）。「過失」是走路絆了一跤，他說的是「我們」，把自己也算進去。「完全人」不是一句話也沒有說錯的人，是長大成熟的人，接回第一章忍耐使你們「成全」的那個字。為甚麼用話語量一個人長大了沒有？因為手腳還來得及管，話常常在你想清楚以前，已經出口了。"],["p","然後是兩幅畫。一匹馬，嘴裡有嚼環，「叫牠順服」（3:3）；一艘大船，「看哪，船隻雖然甚大，又被大風催逼，只用小小的舵，就隨著掌舵的意思轉動。」（3:4）請留意那陣大風。船不是在平靜的港灣裡轉向，是在逆風裡。林家爸爸那一刻的大風是甚麼？是一整天的勞累，是對孩子前途的擔心，也許還有一點：我在教會帶人，自己的孩子卻這樣，別人怎麼看我。風一大，最自然的反應就是放開舵。"],["p","這裡要說清楚一件事。勒住舌頭，不是把嘴縫起來。船裝舵，不是為了停在港裡，是為了出航。那天餐桌上，若媽媽後來對爸爸說「你那句話傷了孩子」，那不是點火；若兒子有一天說出「爸，那句話我記到現在」，那也不是點火，那是報火警。勒住舌頭不是叫受了傷的人、提出問題的人、問「為甚麼」的人不要說，是讓每一個人說出口的話，都跟著掌舵的那一位走。"],["p","雅各接著說：「看哪，最小的火能點著最大的樹林。」（3:5）原文這裡有兩種讀法：和合本照的抄本作「最小的火」，另一種作「何等的火」，同一個字一頭指小、一頭指大；兩種讀法的意思一樣，一點點火，一大片林。十個字，兩秒鐘，一個家。"],["d",["我只是小組長或主日學老師，3:1 說要受更重的判斷，我是不是不該再教了？","不是。3:1 原文把「多人」放在句首，雅各擋的是一世紀小聚會裡人人搶著站起來講，不是叫有恩賜的人閉嘴；新約同樣說要「彼此教導，互相勸戒」。這一節給教導的人的是重量，不是禁令：你說的話，別人會拿去活，神也會照你教過的話來看你。所以實際上可以做三件事。第一，教之前先讓那段經文讀你自己，問它在說我甚麼。第二，教的時候分清楚哪些是經文說的，哪些是你自己的看法。第三，教完以後，若發現說錯了，下一次在同一群人面前說「上次我講錯了」。肯被更正的教導者，舌頭已經有了舵。全卷立場見 ISS00_5。"]],["d",["我被教會裡的人用話傷過，說出來會不會就是雅各說的「點火」？","不會。雅各要撲滅的是從地獄點著、為了傷人而說的火，不是那一聲火警。說出自己受的傷，是報火警；看見問題的同工把問題指出來，也是報火警。勒住舌頭從來不是叫受傷的人、提問的人、指出問題的人閉嘴；要受傷的人沉默，保護的其實是傷人的人。實際上可以這樣做：先選一位可信任的人說，例如一位你信得過的長執、輔導或朋友，不必一開始就在群組或眾人面前說；說的時候講發生了甚麼、你受到甚麼影響，不必替對方下結論。若涉及暴力、性侵或兒少，請先保護安全，並依法尋求協助。你說出來，神聽見了，教會也應該聽見。"]],["h","三、原文亮光：舵、毒、屬魂的"],["p","這一章有三個原文字，拆開來，正好是三步：誰在掌舵、裡面裝了甚麼、源頭在哪裡。"],["p","第一個字：πηδαλίου，「舵」。前面加的是 ἐλαχίστου，最高級，極小的。全章講舌頭的畫面幾乎都是壞的：火、毒、罪惡的世界、從地獄點著的；只有這一幅是好的。舵本身沒有意志，句子後半說它「隨著掌舵的意思轉動」，決定方向的是那一位掌舵的。所以這一章真正的問題從來不是我的舌頭夠不夠好，而是：此刻握著舵的是誰？是我的情緒，我的面子，我的焦慮，還是主？"],["p","第二個字：ἰοῦ，「毒」。3:8 說舌頭「是不止息的惡物，滿了害死人的毒氣」（3:8）。這個字是蛇的毒，可是到了 5:3，雅各說財主的金銀長了「銹」，用的是同一個字。毒和銹有一個共同點：它們都會反過來吃掉擁有它的東西。罵完人的那一刻，你的心沒有比較乾淨；3:6 說舌頭「能污穢全身」，這個「污穢」，和 1:27「不沾染世俗」是同一個字根。點火的人自己先被燻黑。所以 3:6 的火燒的是關係，是人心，是那一張餐桌。它不是一套說了就會應驗的咒語：說了負面的話不會因此招來咒詛，正面宣告也不是一定成真的魔法。雅各不是叫你怕說錯一個字，是叫你看見一句話在人和人之間能燒掉多少東西。"],["p","3:6 還有一句：舌頭「也能把生命的輪子點起來」。這不是輪迴，是一個人從生到老整條人生的路。林家的兒子也許會長大，會成家，會當爸爸；有一天他的孩子把成績單推到桌子中間，他耳朵裡可能還會先響起那一句：我怎麼會生出你這種孩子。一句話，可以燒過兩代人。這就是為甚麼雅各說，這火「是從地獄裡點著的」。舌頭不是火源，是導火線。"],["p","第三個字：ψυχική，和合本譯作「屬情慾的」。「這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的，屬鬼魔的。」（3:15）原文是「屬魂的」，指只靠天然生命的聰明。請聽清楚，雅各不反對頭腦，他在第一章才叫我們向神求智慧。問題不在頭腦，在源頭。林家爸爸那句話，說得很有邏輯：成績不好，將來怎麼辦，我是為他好。那是一種很聰明的智慧，只是它從下面來：從我的害怕、我的面子、我想贏。321 說「用心靠聖靈，不要用腦靠自己」，正是這條線：不是不用腦，是頭腦不再自己作王。"],["d",["3:6 說舌頭是火，那我說「我好累」「我快撐不下去了」，是不是在招來不好的事？","不是。3:6 的火燒的是關係與人心，3:16 說嫉妒紛爭帶來的是擾亂和各樣的壞事，都是發生在人和人之間的事，不是一套說了就靈的機制。所以說出負面的話不會因此招來咒詛，正面宣告也不是一定成真的魔法；禍福在神手裡。雅各自己在 5:13 叫受苦的人禱告，詩篇裡有一大半是向神訴苦的話。把真實的痛說出來，是誠實，不是點火。實際上，你可以在禱告裡照實對神說「我好累」，再加一句「主若願意，求你扶持我」；也可以對一位信得過的人說。若「撐不下去」已經變成長期的無望，甚至有傷害自己的念頭，請馬上告訴身邊的人，並尋求專業與危機協助。"]],["d",["3:15 說「屬情慾的」智慧，那讀書、讀神學、用頭腦思考是不是不屬靈？","不是。「屬情慾的」原文 ψυχική，指只靠天然生命的聰明，雅各要指出的問題在源頭，不在頭腦。他在 1:5 才叫人向神求智慧，主耶穌也說要盡心、盡性、盡意愛神。同一個好頭腦，可以用來服事人，也可以用來算計人、說贏人；分別在於它為誰工作。321 說「用心靠聖靈，不要用腦靠自己」，不是叫人不用腦，是頭腦不再自己作王。實際上可以這樣檢查：當我用一套很有道理的話去說服別人時，問自己三件事。這些話是為了把人找回來，還是為了證明我對？我肯不肯被對方說服（3:17「柔順」）？說完以後，關係更和平，還是更擾亂？"]],["h","四、換泉源：先是清潔，後是和平"],["p","雅各接著照了一面鏡子：「我們用舌頭頌讚那為主、為父的，又用舌頭咒詛那照著神形像被造的人。」（3:9）早上司琴的那雙手，晚上在餐桌上放下筷子；早上唱詩的那一張嘴，晚上對一個照著神形像被造的孩子說：我怎麼會生出你。咒詛不只是髒話，凡是貶低「這個人」本身、而不是指出「這件事」的話，都是對著神的形像說話。「頌讚和咒詛從一個口裡出來！我的弟兄們，這是不應當的！」（3:10）雅各說「不應當」，不是「不可能」；它天天在發生，所以他才要喊出來。"],["p","然後他問：「泉源從一個眼裡能發出甜苦兩樣的水嗎？」（3:11）這是主耶穌的話換了一個樣子：「荊棘上豈能摘葡萄呢？蒺藜裡豈能摘無花果呢？」（太 7:16）雅各沒有說主說過，他把哥哥的比喻換成泉、樹、海水，再說一次。出來的是甚麼，由源頭決定，不由出口決定。所以要換的不是嘴，是泉源。"],["p","那苦水的源頭是甚麼？3:14 說：「苦毒的嫉妒和紛爭」。「紛爭」原來是替自己拉票、結黨的字。這種私慾很少說自己是私慾，它常常穿上屬靈的衣服：我是為了真理，我只是比較直，我只是提出來讓大家代禱。雅各說，嘴上說為了真理，心裡是嫉妒，那就是「說謊話抵擋真道」（3:14）。"],["p","雅各在中間插了一句問話：「你們中間誰是有智慧有見識的呢？他就當在智慧的溫柔上顯出他的善行來。」（3:13）他又繞回第一節的師傅。智慧不是講出來的，是顯出來的；它的樣子叫溫柔。溫柔不是軟弱，是有力量，卻不拿來壓人。想像那張餐桌，若那一刻有人是溫柔的：不是不說成績的事，而是先放下自己的害怕，問孩子一句「你自己覺得哪裡卡住了」。同樣是說話，一句把人推出門外，一句把人留在桌邊。真正的師傅，不是講得最多的人，是讓身邊越來越和平的人。"],["p","然後全章的山頂來了：「惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。」（3:17）請看次序：先是清潔，後是和平。林家爸爸要修這個關係，第一步不是隔天買一杯珍珠奶茶放在兒子桌上，假裝沒事；那只是把火蓋住。第一步是回到泉源：在神面前承認，那句話底下是我的害怕和面子。泉源清了，和平才是真的。最後一樣「沒有偏見」，原文 ἀδιάκριτος，和 1:6「疑惑」、2:4「偏心」同一個字根，意思是心不再分成兩半。"],["p","最要緊的是那四個字：「從上頭來」。這八樣不是一張要咬牙做到的清單，和 1:17 各樣美善的恩賜同一個源頭，是求來的、領受的。所以第一章說，缺少智慧的，要求那「厚賜與眾人、也不斥責人的神」（1:5）。神不嫌你為同一張嘴，一再回來求。最後一句是農夫的話：「並且使人和平的，是用和平所栽種的義果。」（3:18）和平是種出來的，一次一句，一頓飯一頓飯。"],["d",["我習慣有話直說，大家說我刀子嘴豆腐心，這樣也算苦水嗎？","直說本身不是罪，3:17 說的智慧也包括清潔、沒有假冒，雅各自己說話也很直。問題不在直不直，在源頭和方向。可以用三個問題分辨。第一，動機：我說這句話，是為了把人找回來，還是為了發洩、為了贏？第二，方法：我是當面、私下、溫柔地說，還是在別人面前、在群組裡說？第三，對象：我指出的是「這件事」，還是貶低「這個人」？3:9 說對方是照著神形像被造的。如果你發現自己常常傷人之後才說「我只是比較直」，雅各會溫和地請你回頭看那口井。實際上，這一週選一次想直說的時候，先停一晚，第二天早上禱告後再說，說的時候把「你就是」改成「這件事讓我」。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 3:1「不要多人作師傅」叫提問的人、年輕同工、姊妹閉嘴：你還不夠格，不要多講。原文擋的是「多人」搶著教，不是開口；這一節是給教導的人加重量，不是把肢體的恩賜壓下去。"],["p","第二個偏差，是用「勒住舌頭」叫受害者不要再提了。說出傷害不是點火，是報火警；涉及暴力、性侵、兒少的事，先保護安全、依法處理。要受傷的人沉默，保護的是傷人的人。"],["p","第三個偏差，是把 3:6 講成言語魔法：說了病就會病，所以生病不能說痛，只能宣告。這不是雅各的意思，他說的火燒的是關係與人心；他自己在 4:15 教人說的是「主若願意」。禍福在神手裡，你不必活在說錯一個字的恐懼裡。"],["p","第四個偏差，是拿 3:8「沒有人能制伏」替自己開脫：我脾氣就是這樣，大家要包容。「沒有人能」是診斷，不是許可；它是把人推向那一位能的，不是讓傷人的人更理直氣壯。"],["p","第五個偏差，是把 3:10--12 當成一把尺去量別人：他嘴巴這樣，一定沒有重生。勸戒和論斷要分三件事：動機，是為了把人找回來（5:20）；方法，是當面、私下、溫柔（3:13）；位子，是站在弟兄旁邊，不坐審判官的位子（4:12）。這面鏡子第一個照的，是拿著鏡子的人。"],["d",["教會裡有人說錯話、做錯事，我指出來算不算論斷？","不一定。4:11 說不可彼此批評、論斷，5:20 卻說叫一個罪人從迷路上轉回是救一個靈魂。分別在三件事。動機：論斷是為了定人的罪、證明自己高一等；勸戒是為了把人找回來。方法：論斷常在背後說、在眾人面前說；勸戒照主耶穌的教導，先「趁著只有他和你在一處的時候，指出他的錯來」（太 18:15），而且用 3:13 智慧的溫柔。位子：論斷是坐在審判官的位子，4:12 說那個位子只有一位；勸戒是站在弟兄旁邊，知道自己也會跌倒。實際上，開口以前先問自己：這件事我先禱告過了嗎？我願意私下說嗎？說完以後，我是不是還願意陪他走？三個都是，就去說。全卷立場見 ISS00_5。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很多家庭的愛，是用罵說出來的。父母那一輩相信嚴是愛、罵是教，誇了孩子會驕傲。所以「我怎麼會生出你」常常不是恨，是焦慮。雅各不叫我們嘲笑上一代，可是他不讓這句話過關：出來的是苦水，源頭就要回頭看。愛若是真的，它值得用一種孩子聽得懂的語言說出來。也許我們這一代，就是讓這個輪子停下來的那一代。"],["p","第二個問題：華人很重面子，也很怕衝突，所以許多話不是當面說，是在背後說、在群組裡說、在長輩圖底下用一句「有人就是這樣」說。當面不說，背後一直說，泉源就一直苦。3:13 說智慧要在「溫柔」上顯出來：溫柔不是不說，是當面、私下、帶著愛說誠實話。一句當面的話，常常比十句背後的話更不傷人。"],["d",["父母那一輩用很重的話罵我長大，我要怎樣面對那些話，又不變成不孝？","先說一件事：承認一句話傷了你，不等於不孝。雅各說咒詛是對著神的形像說話，那些話燒在你身上，神是在意的。很多父母的重話底下是焦慮和他們自己受過的傷，這可以幫助你理解他們，但不必因此說那句話是對的。實際上可以分三步。第一，在神面前把那句話寫下來，對主說：這句話不是你對我的看法。然後讀 3:9 和 1:18，記得你是神用真道生的。第二，不必勉強自己馬上原諒，也不必急著和父母攤牌；若傷害很深，或還在繼續，請找輔導或牧者陪你。第三，在你自己的家裡，讓這個輪子停下來：這一週，對你的孩子或身邊的人，說一句你小時候很想聽到的話。"]],["h","七、活出321——舵在誰的手裡"],["p","先讓經文說完：舌頭小，卻定方向；它的火從地獄點著，沒有人能制伏；可是有一種智慧從上頭來，先是清潔，後是和平。然後我們才把 321 接上去。"],["p","耶穌是我的榜樣：「他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。」（彼前 2:23）他對假冒為善的人說過重話，卻從不為自己的面子還口；在十字架上，從他口裡出來的是「父啊！赦免他們」（路 23:34）。全世界最大的風吹在那一艘船上，舵始終在父的手裡。"],["p","聖經是我的準則：開口以前，用 3:17 量一量這句話：清潔嗎？和平嗎？有憐憫嗎？還是只是讓我贏？聖靈是我的引導：這八樣沒有提聖靈的名字，卻使我們想起「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實」（加 5:22）。求聖靈在那陣大風吹來以前，先把手放在舵上。"],["p","讓耶穌作王：要讓出來的，是說最後一句話的那個位子。今天你最想說贏的那一場對話，先問主，再開口。讓耶穌得著一切的榮耀：舌頭本來是為頌讚造的，一句誠實的道歉、一句具體的鼓勵，也是在把榮耀歸給那一位照著自己形像造人的神。"],["p","建立屬神的體系：一個家、一個小組的言語文化，要有三個樣子。意見不同，當面私下談，不在群組裡開戰；代禱事項只說需要，不轉述細節、不轉傳截圖；受傷的人、提問的人有一條安全的路被聽見。我們常說人比事重要，關係比東西重要；這一章讓我們看見，這句話最先要落在嘴上。"],["h","八、四種心，誰握著舵"],["p","驕傲型的心最難說對不起，總覺得「我又沒說錯，我是為他好」。3:2 雅各先說「我們」都有過失。今天你可以先說那一句，不加「可是」。"],["p","恐懼型的心有兩種：一種不敢開口，怕說錯；一種先開火，因為怕失控、怕孩子沒前途。林家爸爸是後一種。3:17 的和平不是靠控制換來的，是從上頭賜下的；把擔心交給神，話就會慢下來。"],["p","羞恥型的心會想：我已經說過太多傷人的話，沒救了。雅各說的是「不應當」，不是「不可能改」；那位厚賜、不斥責人的神，不嫌你為同一張嘴第一百次回來求。"],["p","受傷型的心，也許到現在耳朵裡還有一句話，是父母、師長、同工說的。請聽清楚：你說出那一句話傷了你，不是點火，是報火警；神看那句話是燒在他形像上的火。你不必假裝沒事，也不必馬上原諒，可以先找一位信得過的人說出來，讓人陪你走。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 3:17 一次，從八樣裡挑一樣向神求，用一句話說：主，今天我缺少溫良，求你從上頭賜給我。"],["p","第二，任何帶著情緒的訊息，打好以後先不送出，等一個晚上；第二天早上禱告一句「主，舵在你手裡」，再讀一次。能當面說的，約見面；不能當面說的，不在群組裡說。"],["p","第三，記下這一週你最容易放開舵的那一陣風：被冤枉、被比較、累了、擔心孩子。寫下時間和對象，週末拿到小組裡說。"],["p","第四，找一位你曾經用話傷過的人，具體地道歉：說出那一天、那一句話，不加「可是」。"],["p","第五，找一位常被忽略的人，說一句真實、具體的鼓勵，用你的舌頭為他點一盞燈。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我的舌頭是一片小小的舵，我願意交在掌舵的主手裡。"],["p","我宣告：我要換的不是嘴，是泉源；我要向那厚賜、不斥責人的神求從上頭來的智慧。"],["p","我宣告：我身邊每一個人都是照著神形像被造的，我不再用話咒詛他。"],["p","我宣告：我要作使人和平的人，先是清潔，後是和平，一句一句種下義果。"],["d",["我很想改，可是一生氣話就衝出口，這一週可以從哪裡開始？","先接受雅各的診斷：3:8 說沒有人能制伏舌頭，所以你做不到不奇怪，這正是把你推向那一位能的。也記得 3:2 雅各說「我們」都有過失。可以從四件小事開始。第一，找出你的那一陣風：是累了、被比較、被冤枉，還是擔心家人？把它寫下來，風來的時候就認得出來。第二，給自己一個停的動作：深呼吸三次，或說「我等一下再回答你」。第三，每天早上讀 3:17，向神求一樣：主，今天我缺少溫良。第四，說錯了，當天就道歉，不加「可是」，說出那一句話。改變不是一夜之間的事，3:18 說義果是種出來的；這一週種下一顆就好。"]],["h","十、結語"],["p","我們回到那一張餐桌。過了三天，林家爸爸在小組裡又讀到 3:9，讀不下去了。那天晚上十點，他敲了兒子的門。他沒有買奶茶，也沒有說「我是為你好」。他說：那天吃飯，我說了一句話，我怎麼會生出你這種孩子。那句話是錯的。我那時候是怕，怕你將來辛苦，也怕別人怎麼看我。對不起。兒子沒有說話，也沒有回頭。可是下一個主日晚上，他把手機推到桌子中間，說：這一次物理也沒有及格。爸爸這一次沒有放下筷子，他說：好，吃完飯我們一起看。外婆夾了一塊魚給孫子，這一次，沒有挑魚刺。"],["p","可是這一課的焦點，不是林家爸爸學會了說話，也不是我們從此更會管嘴。焦點是那一位口裡沒有詭詐的主耶穌。他被罵不還口，在十字架上為釘他的人求赦免；他為我們死，又用真道重新生了我們，所以我們苦的泉源可以被換掉。雅各曾經和家人以為哥哥癲狂了，後來一輩子活在哥哥的話裡；一個弟弟的舌頭被他的哥哥改變了，我們的也可以。"],["p","我們一起低頭禱告。天父，謝謝你照著自己的形像造了我們身邊每一個人。赦免我們用同一張口頌讚你，又咒詛你所造的人。求你接過我們的舵，在大風吹來的時候，讓我們先回到你面前。求你醫治每一個耳朵裡還有一句傷人的話的人，也給那些傷過人的人勇氣去說對不起。求你從上頭賜下智慧，先是清潔，後是和平，讓我們的家和小組成為種下義果的地方。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最會說話，是讓每一個人說出自己最容易放開舵的那一陣風，也說出這一週要用話去修補、去祝福的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是舵、泉、種。席上可能有人至今耳朵裡還有一句傷人的話，也可能有人正為自己說過的話後悔，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：舌頭是舵，問題在誰掌舵；出來的是甚麼由源頭決定，要換的是泉源；從上頭來的智慧是求來的，先是清潔，後是和平。"],["n","1. ★ 說一句你小時候在家裡最常聽到的話，可以是好的，也可以是難聽的；那句話是誰說的、多半在甚麼場合？"],["n","2. ★★★ 3:4 說船「隨著掌舵的意思轉動」。請用一句話說：舵本身有沒有意志？這幅畫怎樣改變你對「管好舌頭」的理解？"],["n","3. ★★ 3:11 說泉源不能發出甜苦兩樣的水。請舉一個你生活裡的例子，說明為甚麼要換的不是嘴，是泉源。"],["n","4. ★★ 3:17 說「先是清潔，後是和平」。如果次序顛倒，先求和平、不處理源頭，在家裡或教會裡會變成甚麼樣子？"],["m","帶領提醒：讀經時請從 3:1 一口氣讀到 3:18，不要停在 3:8；也請提醒大家，3:1 不是叫人不要開口。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己最容易放開舵的那一陣風，看見那句話底下的源頭，並從「從上頭來的」出發，說出這一週要修補的那一句話。"],["t","【看】看見自己"],["n","5. ★★★ 說出最近一次你說了一句事後後悔的話：是哪一天、在哪裡、對誰？當時吹著你的那陣風是甚麼：累了、被比較、被冤枉，還是擔心？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:17 和 1:5 兩遍，第二遍讀完說一句：神「也不斥責人」，對你為同一張嘴一再回來求，是甚麼樣的好消息？"],["t","【想】想通關卡"],["n","7. ★★★ 那一句話底下，你真正在意的是甚麼：面子、害怕、想贏、覺得自己不被看見，還是一個舊傷？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我的舌頭是一片舵，這一週我要把它交在主手裡。」右手邊的人只回一句「從上頭來的智慧，先是清潔」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要去修補的那一句話：對象是誰、要說的那一句是甚麼、哪一天、用甚麼方式（當面、電話或親筆），並且不加「可是」。"],["m","帶領提醒：這一化可能碰到家庭傷害、言語霸凌，甚至更深的傷；不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。說出傷害不是點火，不要勸人「不要再提了」。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進一個家、一個群組、一個人：一條言語守則、一句修補的話、一句從上頭來的祝福、一位要分享的朋友。"],["n","10. ★★ 你的家或小組可以定哪一條具體的言語守則？例如晚上十一點以後不發帶情緒的訊息，或代禱事項不轉傳截圖。要在哪一天、向誰提出？"],["n","11. ★ 說出一位常被忽略的弟兄姊妹或家人的名字，這一週你要對他說哪一句真實、具體的鼓勵？在甚麼場合說？"],["n","12. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要陪他走的那一個人。當場說出他的名字，說出這一週哪一天，你要向他說一句「從上頭來的」話，例如一句清潔、和平、滿有憐憫的祝福，並且告訴他這句話從哪裡來。"],["n","13. ★★ 在你服事的團隊或常用的群組裡，有沒有一件該當面私下談、卻一直在背後說的事？這一週你可以約誰、在哪裡當面談？"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，一句話只要兩秒，卻可能燒掉一個家。第二句，要改的不只是嘴，是心裡那口井，嘴裡出來的就是井裡裝的。第三句，我相信有一位神願意從上頭換掉我的泉源，讓我說出使人和平的話。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會注意說話」這類答案；提到群組時不點名、不轉述別人的事。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我最要小心的那一陣風是甚麼，我要修補的是哪一句話。可以只說「一句話」，不必說內容。"],["p","然後彼此代禱，為三種人指名禱告：一位耳朵裡至今還有一句傷人的話的人，求主醫治；一位說出傷害卻被要求不要再提的人，求主讓他被聽見；一位帶小組或教主日學的同工，求主保守他的舌頭，也賜他從上頭來的智慧。"],["p","散會以前，確認紙上寫了三樣：要修補的那一句話、要祝福的那一個人、你的那個「2」。下次帶來對。"]]},"4":{"no":4,"vol":"《321雅各書講義》第四課·雅各書第四章","title":"他賜更多的恩典——排下、親近、讓位","chars":5134,"min":60,"deep":8,"dchars":1758,"tchars":1457,"blocks":[["h","一、和平的下一口氣"],["p","弟兄姊妹平安。上一課我們停在一個很小的東西上：舵。舌頭像一隻小小的舵，可以轉動一整艘船；我們最後說，舵很小，握著舵的那一隻手很大。雅各寫完舌頭，又寫了從上頭來的智慧，第三章最後一句是這樣收的：「並且使人和平的，是用和平所栽種的義果。」（3:18）這一課，就從那一句話的下一口氣接過來。"],["p","照理說，講完和平，下一段應該講怎樣守住和平。可是雅各換了一張紙，第一句就問：「你們中間的爭戰鬥毆是從哪裡來的呢？」（4:1）剛剛還在說和平的義果，一轉身就是戰場。這不是雅各寫亂了，是他太認識教會。我們常常在聚會裡唱完「求主賜平安」，散會的路上就在車裡吵起來；小組才剛分享完感恩，群組裡就為了誰負責下週的點心冷了三天。"],["p","請注意雅各的用詞：「你們中間」。不是羅馬兵和猶太人的戰爭，不是地主和工人的官司，是在同一間小聚會裡、彼此叫「我的弟兄們」的一群人。他們散住在異鄉，日子已經夠苦，偏偏最痛的傷，常常不是從外面來，是從身邊坐著的人來。"],["p","我們面對衝突，習慣問：「是誰先開始的？」雅各問的卻是：「是從哪裡來的？」前一個問題找的是對面那個人，後一個問題找的是源頭。這一課要走三步：先看仗從哪裡打起來，再看恩典從哪裡流下來，最後看兩張椅子要讓給誰。這一章最重要的轉折，在第六節的第一個字；可是我們不先跳過去，要先在戰場上站一會兒。"],["h","二、仗是從裡面打出來的"],["p","雅各自己回答了他的問題：「不是從你們百體中戰鬥之私慾來的嗎？」（4:1）「私慾」這個字，原文是快感，是那一份想要的舒服；「戰鬥」是行軍作戰的字。雅各說，有一支軍隊駐紮在你的身體裡：想被看重、想贏、想要那個位子、想要別人照我的意思。你和別人之間那一場仗，只是這支軍隊開到外面的前線。城外的火，是城裡先著起來的。"],["p","第二節講得很重：「你們貪戀，還是得不著；你們殺害嫉妒，又鬥毆爭戰，也不能得。」（4:2）教會裡沒有人真的拿刀，可是一個人的名字，可以在一頓飯的時間裡被殺死好幾次。然後雅各點出兩個病。第一個病是不求：「你們得不著，是因為你們不求。」（4:2）想要，就自己伸手去搶，因為心裡不相信有一位會給。第二個病是妄求：「你們求也得不著，是因為你們妄求，要浪費在你們的宴樂中。」（4:3）原文是「壞壞地求」，不是字句錯，是方向錯，神被當成一間倉庫，東西還沒拿到，已經想好要花在自己身上。"],["p","這兩節不是說，每一個沒有蒙應允的禱告都是求錯了。保羅三次求主挪去那根刺，主沒有挪去；一位為病中孩子禱告了三年的母親，千萬不可以拿這節去對她說「你妄求」。雅各是在對一群正在打仗的人說話。這是一把手術刀，不要拿去割沒有病的人。"],["p","接著是一個讓人很不舒服的稱呼。和合本譯作「淫亂的人」，旁邊小字註明：原文是淫婦。然後問：「豈不知與世俗為友就是與神為敵嗎？」（4:4）在舊約先知口中，神是以色列的丈夫，百姓是他的妻子；何西阿娶了一個不忠的妻子，神說，這就是我和我百姓的故事。所以這個字不是罵人下流，它問的是：你的心屬誰？而且只有丈夫會因為妻子的心不在而痛。這一節不是拿來羞辱任何一位弟兄姊妹的，也不是一張禁止清單；人在哪裡工作不是問題，心裡換了伴侶才是問題。同一位雅各說，不沾染世俗的人，是走進世界看顧孤兒寡婦的人。"],["p","第五節是全卷最難懂的一節，學者讀出好幾種意思，講義的議題頁都列了。教學場上我們只說一句大家都同意的話：神不肯和世界分享我們。那不是沒有安全感的嫉妒，是愛得太滿，容不下第三者。讀到這裡，鏡子已經照到最暗的地方：仗在我裡面，禱告也被拉去當補給線，心還有一半往別處去。如果信寫到這裡就停，我們只剩下羞愧。"],["d",["我為一件事禱告了好幾年都沒有蒙應允，是不是我妄求了？","不一定，而且多半不是。4:2--3 是雅各對一群正在彼此爭戰、要把求來的東西花在宴樂中的人說的診斷，不是一把量每一個禱告的尺。保羅三次求主挪去身上的刺，主沒有照他求的挪去，卻對他說恩典夠用。所以久病、等孩子回家、求一份工作的人，禱告沒有照時間表得著，不代表你求錯了，也不代表神走開了。這兩節真正可以幫你的，是一個溫柔的檢查：我求這件事，是為了更愛神、更愛人，還是只為了自己舒服？檢查完，繼續求。若你已經累到不想禱告，請告訴小組，讓別人替你求一陣子；信仰與受苦的全卷立場，回指希伯來書立場四。"]],["d",["4:4 說與世俗為友就是與神為敵，基督徒還能在娛樂業工作、有非信徒的好朋友嗎？","可以，而且雅各自己就要人走進世界。他在 1:27 說，清潔的虔誠是看顧患難中的孤兒寡婦，又保守自己不沾染世俗；看顧孤兒寡婦，就是走進最需要的地方去。4:4 用的是先知的婚約語言，神是丈夫，百姓是妻子，問的不是你在哪一個行業，而是你的心屬誰。一個在教會全職服事的人，心也可能被名聲和比較帶走；一個在片場工作的人，心也可以一整天屬於主。實際上可以問自己三個問題：這份工作有沒有要我說謊或傷害人？它有沒有慢慢取代神在我心裡的位子？我在那裡，是被改變的人，還是帶來改變的人？"]],["h","三、原文亮光：更大的、排在下面、兩個魂"],["p","從第一章第一節數到這裡，雅各寫了一長串的「要」和「不可」：要喜樂、要行道、不可按外貌待人、要勒住舌頭。可是你仔細找，一次也沒有出現「恩典」這個字。然後第六節的第一個字出來了：「但。」「但他賜更多的恩典，所以經上說：神阻擋驕傲的人，賜恩給謙卑的人。」（4:6）這一課拆三個原文字，都在這幾節裡。"],["p","第一個原文字：μείζονα（meizona），「更大的」。雅各把這個形容詞搶到句首，好像先喊出來：更大的！比甚麼更大？比 4:1 那一支在百體中行軍的私慾更大，比 4:4 那一句與神為敵的指控更大。「賜」是現在式，神一直在給。全卷到這裡第一次說出「恩典」，一說就是兩次，都在這一節。私慾很大，恩典更大；要求很高，恩典更多。"],["p","雅各說「所以經上說」，引的是箴言第三章。可是你翻開和合本的箴言，那裡寫的是：「他譏誚那好譏誚的人，賜恩給謙卑的人。」（箴 3:34）前半句不一樣，這不是誰引錯了：和合本箴言從希伯來文翻，雅各用的是當時通行的希臘文舊約，兩個版本說的是同一件事，彼得寫信時也引了同一個版本。「阻擋」原文是 ἀντιτάσσεται（antitassetai），「對著排列」，擺開陣勢。第一節私慾在你身體裡行軍；到了這裡，神也擺開了陣勢，站在驕傲的人對面。"],["p","第二組原文字在 4:7：「故此，你們要順服神。務要抵擋魔鬼，魔鬼就必離開你們逃跑了。」（4:7）「順服」是 ὑποτάγητε（hypotagēte），和「阻擋」同一個字根「排列」，只換了一個介系詞：「在下排列」，排到神的下面去。人和神之間沒有中立的位置，不排在神的下面，就排在神的對面。「抵擋」是 ἀντίστητε（antistēte），站起來對抗。請看次序：先排到神下面，才站起來抵擋魔鬼。一個沒有排到神下面的人去抵擋魔鬼，像一個逃兵獨自去攻城；他以為在屬靈爭戰，其實還在自己的私慾裡打仗。孩子站在父親身後，追他的人自然退去，退去的原因不是孩子的拳頭，是孩子站的位置。"],["p","第三個原文字在 4:8：「有罪的人哪，要潔淨你們的手！心懷二意的人哪，要清潔你們的心！」（4:8）「心懷二意」是 δίψυχοι（dipsychoi），「兩個魂的」，一個身體裡住兩個魂。這個字新約只出現兩次，第一次在 1:8：「心懷二意的人，在他一切所行的路上都沒有定見。」（1:8）全卷從那裡開始診斷，到這裡開藥方。藥方放在哪裡？緊跟在「你們親近神，神就必親近你們」（4:8）的後面。一顆兩半的心，不是在書桌前咬緊牙關修好的，是在親近神的時候被清潔的，像一塊濕布，不是自己擰乾，是放在太陽底下曬乾。"],["p","接著雅各叫人「愁苦、悲哀、哭泣」（4:9），這不是禁止基督徒笑，是要一顆終於為自己痛起來的心；然後是「務要在主面前自卑，主就必叫你們升高」（4:10）。人只管低下去，升高是主的事。讀到這裡，我們才停一下。國度321空中團契常說的那一句「謙卑是復興的鑰匙；神施恩給謙卑的人，阻擋驕傲的人」，原來是雅各從箴言抄給一群正在爭戰的弟兄的。請看它在經文裡的位置：前面是一場仗，開頭是「但他賜更多的恩典」。先有恩典，才有謙卑；謙卑不是拿去換恩典的工價，是走下來，站到恩典流得到的地方。團契說「無己戰勝撒但」，4:7 就是它的本文：得勝不是因為我變強了，是因為那個坐在王位上的自己下來了，魔鬼就沒有陣地。"],["d",["雅各引的箴言和和合本箴言 3:34 不一樣，是不是引錯了？","不是引錯。和合本的箴言是從希伯來文翻譯的，寫作「他譏誚那好譏誚的人，賜恩給謙卑的人」；雅各寫信的時候，散住各地的猶太人普遍讀希臘文的舊約，那個版本的前半句就是「神阻擋驕傲的人」。彼得寫信時也引了同一個版本。兩個版本說的是同一件事：神對驕傲的人不是中立的，他站在對面；恩典則往謙卑的人那裡去。我們團契每天說的那一句話，用的正是雅各和彼得的版本。這件事提醒我們，讀聖經可以放心查考字句的來歷，不必害怕；議題頁有完整的說明，教學場上一句帶過就好。"]],["d",["「抵擋魔鬼，魔鬼就必離開」，那遇到屬靈攻擊，要怎樣抵擋？","先看次序：「你們要順服神」在前，「務要抵擋魔鬼」在後。順服的原文是排到神的下面，所以抵擋的第一步不是學一套口訣，而是回到本位：承認自己在哪一件事上想自己作主，把那件事交還給神。魔鬼這個字的意思是控告者、離間者，他最常做的不是嚇人，是把人和神、人和人分開；所以抵擋常常很日常：不接受「你沒救了」的控告，不讓一段冷戰繼續發酵，主動去和好。若是長期失眠、焦慮或憂鬱，請一面禱告，一面就醫，順服神的人可以安心看醫生。屬靈爭戰的全卷立場，回指以弗所書立場四。"]],["d",["4:9 叫人愁苦、悲哀、哭泣，基督徒是不是要常常愁眉苦臉才算悔改？","不是。這一節是對一群還在爭戰、又在宴樂中自滿的人的悔改呼召，要的是一顆終於為自己痛起來的心，不是一張苦臉。同一位雅各在 1:2 說要以為大喜樂，在 5:13 說有喜樂的就該歌頌。他也給眼淚留了位子：喪親、病痛、失敗的時候哭，不是你不屬靈。真正的悔改有時會流淚，有時只是安靜地停下來，把一件事交給神。所以不必假裝悲傷來證明自己悔改，也不必假裝快樂來證明自己屬靈。在神面前，可以真實地哭，也可以真實地笑；這一節接著的是「主就必叫你們升高」，眼淚不是終點。"]],["h","四、兩張椅子：審判席與明天"],["p","雅各講完自卑，下一句就落到最日常的地方：「弟兄們，你們不可彼此批評。」（4:11）「批評」原文是背著人往下說。然後他說，批評弟兄就是批評律法，因為律法要我愛鄰舍如同自己；我一開口論斷，就不再站在律法下面遵行，而是坐到律法上面當裁判。「設立律法和判斷人的，只有一位，就是那能救人也能滅人的。你是誰，竟敢論斷別人呢？」（4:12）只有能救人的，才有資格定人的罪；我們救不了任何人，所以也坐不了那張椅子。"],["p","可是這兩節不是叫教會閉嘴。雅各在信的最後要我們去找那個失迷的弟兄，使他回轉。一個受傷的人說出遭遇，一位會友提出問題，一位同工指出制度的錯，都不是論斷。勸戒和論斷差在三個地方：動機，是為了把人找回來，還是為了證明我對？方法，是當面、私下、溫柔，還是背後、成群、刻薄？位子，是站在弟兄旁邊，還是坐在審判官的椅子上？論斷是坐著說的，勸戒是走過去說的。"],["p","接著雅各從嘴巴轉到行事曆：「嗐！你們有話說：今天明天我們要往某城裡去，在那裡住一年，做買賣得利。」（4:13）這句話沒有一個字是罪，跑城做生意是散住的猶太人的日常，雅各沒有禁止規劃、經商、賺錢。錯在主詞：每一個動詞前面都是「我們」，神不在這張行事曆上。審判席和明天，是同一顆心坐上的兩張椅子。"],["p","然後是 4:14：「你們原來是一片雲霧，出現少時就不見了。」（4:14）「雲霧」原文是 ἀτμὶς（atmis），蒸氣。冬天早晨站在公車站，呼出一口白氣，看得見，抓不住。可是這一節一定要接著下一節讀：「你們只當說：主若願意，我們就可以活著，也可以做這事，或做那事。」（4:15）雲霧不是說生命沒有價值，是說生命不在我手裡；它沒有被丟在風裡，是在主的手裡。「主若願意」不是宿命，也不是叫人不必規劃：城照去，生意照談，計畫照做，只是主詞換了。如果今天有人聽到「雲霧」，心裡想「那活著還有甚麼意思」，請你聽清楚：這不是經文的意思，你的生命正是主所願意的；請今天就找一個人說出來，教會願意陪你，也會陪你去找專業的幫助。"],["p","最後兩節收得很安靜。張狂誇口不一定是說大話，只是在每一個計畫裡都忘了神（4:16）；「人若知道行善，卻不去行，這就是他的罪了。」（4:17）它放在「主若願意」的後面：一張讓主作王的行事曆，自然會留出一格，給神放在你眼前的那一件善事。"],["d",["既然不可論斷，那看見弟兄姊妹犯錯，我還能說嗎？","能，而且有時必須說。雅各在信的最後說，若有人使失迷真道的弟兄回轉，就是救一個靈魂；不說，有時反而是不愛。4:11--12 禁止的，是背著人往下說、坐上審判官的椅子。可以用三個問題分辨：第一，動機，我是為了把他找回來，還是為了證明我對？第二，方法，我是當面、私下、溫柔地說，還是在背後、在群組、成群地說？第三，位子，我站在他旁邊，承認自己也會跌倒，還是坐在他對面？實際的第一步：去說之前先為他禱告一次，然後約他喝杯咖啡，第一句問「你最近好嗎」。涉及暴力或傷害的事，先保護安全、依法處理。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 4:6 講成交易：你謙卑，神就給你恩典；恩典不夠，是你還不夠謙卑。經文的次序是「但他賜更多的恩典，所以經上說」，恩典先在。講成交易，本來就自責的人會更忙著量自己謙卑得夠不夠，反而又坐回自己的中心。"],["p","第二個偏差，是拿 4:4 點名羞辱人，或開一張「哪種工作、哪種音樂、哪些朋友就是世俗」的清單。這是先知的婚約語言，問的是心屬誰；雅各指控的是教會自己，不是外面的人。"],["p","第三個偏差，是拿 4:1 對正在受暴力或霸凌的人說：你也要檢討自己的私慾。4:1 是叫每一個參與爭戰的人往裡看，不是把加害與受害各打五十大板；先保護安全、依法處理，再談各人的心。"],["p","第四個偏差，是把 4:7 講成一套捆綁斥責的口訣，或把憂鬱、焦慮一律說成鬼附。雅各給的方法是先順服神，回到神下面的位子，不是儀式；順服神的人可以安心就醫，屬靈爭戰回指以弗所書立場四。"],["p","第五個偏差，是用 4:11--12 叫受害者、提問的人、指出問題的同工閉嘴，或反過來，用「主若願意」把懶惰屬靈化。前者讓真正坐在審判椅子上的人永遠不必被問責；後者讓人以為認真規劃就是不屬靈。兩邊都不是雅各的意思（全卷立場見 ISS00_5）。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們的文化很怕正面衝突，所以仗常常不在會議桌上打，在私訊裡打。表面上客客氣氣，背後一張截圖轉過三個群組，再加一句「我不是要說他，我只是擔心」。4:11 的「批評」正是這個字：背著人往下說。華人教會最常見的爭戰，不是吵架，是冷戰和耳語。這一週的功課，是把背後的十分鐘，換成一通當面的電話。"],["p","第二個問題：我們從小被教「人生要規劃」「輸在起跑點就完了」。孩子的補習、選校、置產、移民，每一張計畫表都排得很滿，主詞都是我們。有人聽到「主若願意」就鬆了一口氣，以為可以不必努力；有人聽了反而更焦慮，怕計畫做了也白做。4:15 對兩種人都說：計畫照做，只是讓主有改動它的權利；明天不必我一個人扛。"],["d",["「主若願意」是不是表示基督徒不必做生涯規劃、投資理財？","不是。4:13 那一句「往某城裡去，在那裡住一年，做買賣得利」，沒有一個字是罪；保羅也排行程，主耶穌也說蓋樓要先坐下算計花費。雅各指出的錯在主詞：每一個動詞前面都是「我們」，神不在計畫裡。所以「主若願意」不是叫人把計畫丟掉，也不是宿命，而是計畫照做，只是讓主有改動它的權利。實際上可以這樣做：每年訂目標、買房、換工作、為孩子選校時，和家人一起把計畫攤開，說一句「主若願意」，再多寫一欄：如果主不願意，我們的備案是甚麼？這樣，努力還在，焦慮卻放下了，因為明天不必我一個人扛。"]],["h","七、活出321——排到神的下面，恩典就流得到"],["p","經文已經自己講完了：仗從裡面來，恩典從上面來，人要做的是排下來、走近去、讓出椅子。現在我們才把 321 接上去，看它在這一章裡長甚麼樣子。"],["p","耶穌是我的榜樣：4:7 的次序，主自己先走過。在曠野，他沒有先和魔鬼比能力，他先說自己排在哪裡：「當拜主你的神，單要事奉他。」（太 4:10）在客西馬尼，他把 4:15 活成禱告：「父啊！你若願意，就把這杯撤去；然而，不要成就我的意思，只要成就你的意思。」（路 22:42）"],["p","聖經是我的準則：4:11 說論斷人就是坐到律法上面。讀經的人最容易犯的，是拿聖經去量別人；這一章要我們回到律法下面，先讓它量自己。"],["p","聖靈是我的引導：4:5 說神所賜、住在我們裡面的靈，神不肯和世界分享我們。當你寫好一則很想按出去的回覆，先停三分鐘，求聖靈讓你看見，自己在這場爭執裡真正想要的是甚麼。"],["p","讓耶穌作王：這一章要讓出兩張椅子。一張是審判席，「設立律法和判斷人的，只有一位」（4:12）；一張是明天的主詞。讓耶穌作王，就是讓「主若願意」出現在你的行事曆上，並且真的預備好讓他改動。"],["p","讓耶穌得著一切的榮耀：4:16 的張狂誇口，是把功勞記在自己名下；4:10 說「主就必叫你們升高」，升高的是主的手，榮耀也歸給他。"],["p","建立屬神的體系：4:1 的仗是「你們中間」的，停戰也要是一群人的事。一個屬神的群體會立下日常的規矩：群組裡不轉傳別人的截圖，不談論不在場的人；有話要說，就照三個分別當面去說。這樣的群體不是沒有衝突，是衝突一出現，大家知道往哪裡走：先往神那裡，再往對方那裡。"],["h","八、四種心，坐在哪一張椅子上"],["p","驕傲型的心坐在審判席上：別人的錯看得最清楚，判決下得最快。4:12 問你一句：你是誰？那張椅子只有一位能坐，而他選擇的是救人。"],["p","恐懼型的心坐在明天的椅子上，緊緊抓著計畫，怕一放手就全垮。4:15 說，你的明天在主手裡，不在風裡。計畫照做，今晚可以去睡。"],["p","羞恥型的心以為要先把手洗乾淨、把心修好，才敢到神面前，修不好就不來。4:8 的次序剛好相反：你親近神，神就親近你；清潔是在近前的時候發生的。"],["p","受傷型的心，也許曾被人用「你也要檢討自己」「你這是論斷」壓住，不敢再開口。請聽清楚：說出你的傷不是點火，也不是論斷。若傷害還在繼續，請告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 4:6--10 一次，讀到「但他賜更多的恩典」時停下來，把今天最可能起衝突的一件事說給神聽，然後說：主，我排到你的下面。"],["p","第二，拿出你的禱告清單，在每一項旁邊誠實地問：這一項若得著了，是讓我更愛神、更愛人，還是只讓我更舒服？不必刪掉任何一項，只是向神說真心話。"],["p","第三，這一週不在背後談論一位不在場的弟兄姊妹。發現自己開了頭，就停下來，改說一句他的好處；真有要說的事，約他當面、私下談。"],["p","第四，打開行事曆，在這個月最大的一個計畫旁邊寫四個字：主若願意。和家人一起討論：如果主不願意，我們的備案是甚麼？"],["p","第五，挑一件你早就知道該做、一直拖著的善事，一通電話、一次探望、一句道歉，把它排進這一週的行事曆，做完。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：仗是從我裡面打起來的，我不再先找對面的那個人。"],["p","我宣告：他賜更多的恩典；我的私慾很大，他的恩典更大。"],["p","我宣告：我要排到神的下面，親近神，神就必親近我。"],["p","我宣告：審判的椅子和明天的主詞都讓給主；主若願意，我就去做。"],["d",["我很容易在群組裡忍不住回嘴或轉傳截圖，這一週可以怎樣開始改？","先從一個很小的停頓開始。第一，寫好一則很想按出去的回覆時，先不要按，把手機放下三分鐘。第二，在這三分鐘裡照 4:2 的次序向神開口，說出你在這件事上真正想要的是甚麼：被尊重、被看見、要贏，還是要對方認錯？把那一樣交給他。第三，回來再看那則訊息，刪掉一半的字，或改成一句邀請：「我們可以找時間當面談一談嗎？」第四，收到別人轉來的截圖，不再往下轉，回一句「這件事我們直接問他好嗎」。一週下來，把你停下來的次數記下來，下次帶到小組。"]],["h","十、結語"],["p","我們從上一課的舵接過來，走進一個戰場。這一課沒有叫我們更用力去打贏，它叫我們先看見仗從哪裡來，再聽見一個「但」：但他賜更多的恩典。恩典像水，只往低處流；人只要排下來、走近去、讓出椅子，就站到了恩典流得到的地方。"],["p","可是這一課的焦點，不在我們學會了閉嘴，也不在我們從此更會排行事曆。焦點在那一位本來有權坐在審判椅子上的主：「那能救人也能滅人的」（4:12），從椅子上站起來，走下來，「既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。」（腓 2:8）能滅人的那一位，選擇了救人。雅各曾經和家人以為哥哥癲狂了，後來一輩子活在哥哥的話裡；我們讀完這一章，記得的不該是雅各有多嚴厲，而是雅各的哥哥有多低。"],["p","我們一起低頭禱告。天父，謝謝你在我們打仗打到最暗的地方，說了一個「但」字，賜下更多的恩典。赦免我們心裡的王位上坐著自己，赦免我們在背後坐上審判的椅子，也赦免我們在行事曆上把你擠出去。我們現在排到你的下面，親近你；求你清潔我們分成兩半的心，也求你扶起那些覺得明天沒有盼望的人，讓他們知道自己的生命正是你所願意的。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最有理，也不追究誰先開始，是讓每一個人說出自己正坐在哪一張椅子上，也說出這一週要往神那裡走的那一步；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是排下、親近、讓位。席上可能有正在衝突裡的人，也可能有被論斷傷過、或覺得明天沒有盼望的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：仗是從裡面的私慾打出來的；恩典比私慾更大，而且先在；順服是排到神的下面，次序是先順服神，才抵擋魔鬼。"],["n","1. ★ 小時候你和兄弟姊妹或同學最常為了甚麼吵架？通常是怎麼收場的，誰先開口、誰去告狀、還是第二天就忘了？"],["n","2. ★★★ 4:1 問「是從哪裡來的」，而不是「是誰先開始的」。請用一句話說：這兩個問題有甚麼不同？雅各的答案指向哪裡？"],["n","3. ★★ 4:6 的「但」把鏡頭從人的失敗轉到神的恩典。為甚麼說先有恩典才有謙卑？如果講反了，會變成甚麼樣子？"],["n","4. ★★ 「順服」是排到神下面，「阻擋」是神站在對面。請舉一個你職場或家裡的例子，說明不排在神下面，就排在神對面。"],["m","帶領提醒：讀經時請一口氣從 4:1 讀到 4:10，不要停在 4:5；讀到 4:4 不點名任何人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一場自己正在打的仗，看見底下真正想要的是甚麼，並從「他賜更多的恩典」出發，說出這一週要往神那裡走、往對方那裡走的那一步。"],["t","【看】看見自己"],["n","5. ★★★ 說出最近一次讓你心裡不平的衝突（家裡、職場、教會都可以，不說對方是誰）：是哪一天、在哪裡？你那時坐在哪一張椅子上，審判席，還是明天的椅子？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:6 和 4:8 兩遍，第二遍讀完說一句：「他賜更多的恩典」對你剛才說的那一場仗，是甚麼樣的好消息？"],["t","【想】想通關卡"],["n","7. ★★★ 在那一場仗裡，你真正想要的是甚麼：被尊重、被看見、要贏，還是照我的方法？那一樣，你有沒有先向神開口求過？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「仗是從我裡面打起來的，可是他賜更多的恩典。」右手邊的人只回一句「你親近神，神就必親近你」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要去和好、或當面溫柔說一句話的那個人（寫關係就好），哪一天、用見面還是電話；去之前，你要先為哪一件「我想要的」禱告？"],["m","帶領提醒：衝突只說自己的部分，不說對方的名字，不在組裡審判不在場的人。若有人說出家暴、霸凌或性騷擾，不要對他說「你也要檢討自己」，不追問細節，不要求原諒，先確認安全，會後單獨關心，必要時協助尋求專業協助。若有人說出長期無望感，甚至覺得活著沒有意思，不要對正在流淚的人說「你要有信心」，請陪伴他，會後單獨關心，並協助他聯絡專業與危機資源。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進群組與行事曆：一個不轉傳的規矩、一個寫上「主若願意」的計畫、一件拖著的善事、一位要分享的人。"],["n","10. ★★ 說出這個月你最大的一個計畫，你要在哪一天、和誰一起坐下來說「主若願意」，並且寫下如果主不願意的備案？"],["n","11. ★★ 我們小組或你服事的團隊，可以立下哪一條群組規矩，例如不轉傳別人的截圖、不談論不在場的人？要在哪一次聚會、由誰提出？"],["n","12. ★ 說出一件你早就知道該做、一直拖著的善事：一通電話、一次探望、一句道歉。這一週哪一天、幾點去做？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：仗是從裡面來的，但神賜更多的恩典。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多衝突不是從對面來的，是從我們心裡想要的東西來的。第二句，神沒有等我們先修好自己，他賜更多的恩典給願意低下來的人。第三句，所以停戰的第一步，是先轉身往神那裡走，再往對方那裡走。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會注意講話」這類答案；不用 4:17 叫已經累垮的同工或照顧者再多接一件事。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要往神那裡走的那一步，和要往對方那裡走的那一步。可以只說「一個人」，不必說是誰。"],["p","然後彼此代禱，為三種人指名禱告：一位禱告很久還沒有蒙應允的人，求主讓他知道自己沒有求錯，神也沒有走開；一位在爭執中受了傷、從此不再開口的人，求主差人走到他身邊；一位覺得明天沒有盼望的人，求主讓他身邊有人陪伴，也願意接受專業的幫助。"],["p","散會以前，確認紙上寫了三樣：要和好的那一個人、寫上「主若願意」的那一個計畫、你的那個「2」。下次帶來對。"]]},"5":{"no":5,"vol":"《321雅各書講義》第五課·雅各書第五章","title":"一封沒有結尾問安的信——銹、雨、回","chars":5171,"min":60,"deep":8,"dchars":1849,"tchars":1316,"blocks":[["h","一、一封沒有結尾問安的信"],["p","弟兄姊妹平安。請你回想一下，你上一次好好寫一封信，不是傳一行訊息，是坐下來寫完整的一封，最後幾行寫了甚麼？大概是「保重」「代問家人好」「祝平安」，然後簽上自己的名字。信寫到最後，人總會把語氣放軟，把手伸出去，像在門口送客。新約的書信也是這樣：保羅的信，最後幾乎都有一長串的問安，有名字，有祝福，有「願恩惠與你們同在」。"],["p","雅各書沒有。你翻到第五章最後兩節，讀完就是讀完了：「我的弟兄們，你們中間若有失迷真道的，有人使他回轉，這人該知道：叫一個罪人從迷路上轉回便是救一個靈魂不死，並且遮蓋許多的罪。」（5:19–20）沒有問安，沒有祝福，沒有一個人的名字。整本新約的書信裡，很少有一封像它這樣，最後一筆不是一句祝福，是一個任務（約翰一書也沒有結尾祝福）。"],["p","這一課，我們就從這封信的結尾倒著讀回去。一封信不放祝福在最後，是不是表示寫信的人很冷？我們會發現正好相反：雅各把祝福放在中間，把任務放在最後。祝福在 5:11，「主是滿心憐憫，大有慈悲」（5:11），那是整卷書的最高點；任務在 5:20，去找一個走失的人。中間連著兩頭的，是 5:16 的禱告。"],["p","照書信三問，先問散住的人遇到甚麼。第五章的人，有的工錢被扣住了，有的在等一場遲遲不來的雨，有的躺在病床上，有的已經好幾個安息日沒有出現。雅各從福音推出的原則是：等候拖長了，心要被堅固，而堅固人心的，是那位滿心憐憫的主。今天這原則落在哪裡？落在薪資單上、病房裡、群組裡那個很久沒有出聲的名字上。"],["p","全卷五篇是「全、行、言、謙、忍」，第五章是「忍」：一顆心在時間裡的樣子。我們用三個字走完這一課：銹，雨，回。銹，是不流動的錢；雨，是從上頭來、人只能等候的恩典；回，是一個人轉身去找另一個人。"],["d",["雅各書沒有結尾問安，也沒有祝福，這樣的一封信算是寫完了嗎？","算是寫完了，而且是故意這樣收的。古代書信通常有開頭的問安和結尾的祝福，雅各書開頭有一句「請散住十二個支派之人的安」，結尾卻停在一個任務上。有學者認為它更像一篇寫成書信形式的講道，在各地小聚會裡被讀出來；講道結束，不必說再見，只要會眾起身去做。從內容看，雅各的祝福並沒有缺席，它在 5:11「主是滿心憐憫，大有慈悲」，就在任務之前。所以讀這卷書最好的方式，不是把它當作一張規條表讀完收起來，是讀到最後一節時，心裡浮出一個名字，然後合上書，去找他。這封信的結尾，是要寫在讀者的行事曆上的。"]],["h","二、工錢有聲音：先照我們自己"],["p","第五章一開口，雅各沒有叫「弟兄們」。「嗐！你們這些富足人哪，應當哭泣、號咷，因為將有苦難臨到你們身上。」（5:1）語氣變了，像一位先知站在城門口喊。接著他列出三樣東西：財物壞了，衣服被蟲咬了，「你們的金銀都長了銹」（5:3）。金子其實不會生銹，雅各故意這樣說：你以為最不會壞的，在神眼中已經壞了。這個「銹」字，和 3:8 舌頭的「毒氣」是同一個字。在舌頭上叫毒，在錢財上叫銹，都是好東西不往神要的方向流，就在裡面發壞。"],["p","然後是這一段最重的一節：「工人給你們收割莊稼，你們虧欠他們的工錢，這工錢有聲音呼叫，並且那收割之人的冤聲已經入了萬軍之主的耳了。」（5:4）請你看主詞，喊的不是工人，是工錢。被扣住的錢自己有了聲音。「虧欠」的意思是扣住、拖著不給，常常不是搶，只是一句「下個月吧」。律法早就說了：「雇工人的工價，不可在你那裡過夜，留到早晨。」（利 19:13）因為那份工錢，就是那一家人今晚的飯。"],["p","講到這裡，我們最容易做的事，就是看向外面的大老闆。可是雅各在第二章已經先照過教會自己：「這豈不是你們偏心待人，用惡意斷定人嗎？」（2:4）所以這一段，我們先照自己。教會也是雇主。我們的傳道同工、清潔的阿姨、晚上的保全、外包來修冷氣的師傅，他們的工錢都在 5:4 之下。準時嗎？足額嗎？加班有算嗎？給的時候有尊嚴嗎？一間教會在主日講台上講 5:4，週一早上財務同工的付款紀錄，就是會眾聽到的第二篇講道。"],["p","雅各點名的，是積攢、欠薪、奢華，和「定了義人的罪」（5:6）。財富本身不是罪，可是財富有方向：要嘛流出去，變成別人桌上的飯；要嘛堆起來，發銹。所以這段話不是叫我們仇視任何人，是叫手上有錢、有權付錢的人，看一看自己的錢往哪裡流。"],["p","還有一句一定要說清楚。如果你就是那位被拖欠工錢的人，教會不會只對你說一句「要順服，要忍耐」。順服老闆不等於吞下違法的欠薪，把被扣的工錢說成一種奉獻更是錯的。一位被欠薪的弟兄、一位在異鄉做工的移工姊妹來到教會，他需要的，是有人陪他去查申訴的管道。萬軍之主已經聽見了，原文是完成式，不是將來會聽見，是已經進到他的耳朵裡；我們的耳朵，不可以比神的耳朵更遠。"],["d",["我是基督徒老闆，公司周轉真的有困難，不得不晚幾天發薪，這樣是在 5:4 之下犯罪嗎？","雅各責備的是有能力卻扣住不給、自己照樣「享美福，好宴樂」（5:5）的人；你在困難裡掙扎，和那種心不同。可是 5:4 仍然對你說話。第一，先誠實告訴員工實情和確切的日期，不要只說「再等等」；工錢有聲音，你的沉默會讓那聲音更大。第二，先付工錢，再付自己的享受：老闆的車、旅遊、分紅，排在員工的薪水後面。第三，若真的長期付不出，就要面對經營的問題，依法處理，而不是讓員工替公司扛風險。利 19:13 說工價不可過夜，是因為那是他們今晚的飯。你為這件事不安，說明你的心沒有發銹；把這份不安變成一個具體的付款日期，就是在職場上敬拜。"]],["h","三、原文亮光：心長、留在底下、滿有心腸"],["p","被欠薪的工人聽到這裡，心裡會問：那我們現在怎麼辦？雅各的回答是一個「所以」：「弟兄們哪，你們要忍耐，直到主來。」（5:7）你聽見了嗎？「弟兄們」回來了。這一段有兩組字，一組在 5:7–10，一組在 5:11，我們把它們拆開，再加上全卷最高點的那一個字。"],["p","第一個字：Μακροθυμήσατε，字根 μακροθυμέω，字面就是「心長」。對人心長，是不急著發怒；對時間心長，是不急著收割。雅各對被欺壓的人說的不是「認了吧」，是「把心放長」。他指著一位農夫：「看哪，農夫忍耐等候地裡寶貴的出產，直到得了秋雨春雨。」（5:7）兩場雨中間是一大段晴天，農夫不能催雨，可是他也沒有把手插在口袋裡，他天天拔草。心長，不是什麼都不做，是把審判交給主，把今天的田照顧好。順帶一提，「秋雨春雨」在這裡是巴勒斯坦農夫的日曆，不是末世兩波聖靈澆灌的時間表。"],["p","接著是 5:8：「你們也當忍耐，堅固你們的心，因為主來的日子近了。」（5:8）有人會問：兩千年了，還算近嗎？雅各說「近」，不是叫我們拿出日曆算日子，講台上也不算日子。像一個孩子知道爸爸已經在回家的路上，他不會去算還有幾公里，他會把房間收好。「近了」的意思是：今天就不埋怨，今天就忍耐。所以下一節說：「弟兄們，你們不要彼此埋怨，免得受審判。看哪，審判的主站在門前了。」（5:9）「埋怨」原文是嘆氣，對老闆不敢說，回家對太太嘆。堅固的心，是不讓等候變成苦毒的心。"],["p","第二個字：ὑπομονή，在 5:11 出現，「你們聽見過約伯的忍耐」（5:11）。這個字的意思是「留在底下」，在重量底下沒有走開。說實話，約伯並不安靜：他咒詛自己的生日，和朋友吵，對著天問了一連串的為甚麼。可是他沒有離開。他一面哭，一面抓著神。所以如果你這段日子很難過，你可以難過，可以問神為甚麼；雅各要的忍耐，不是不出聲，是不放手。"],["p","第三個字，是全卷的最高點：「明顯主是滿心憐憫，大有慈悲。」（5:11）「滿心憐憫」，原文 πολύσπλαγχνός，新約只有這一次。它由「多」和「心腸、肺腑」組成，就是福音書裡耶穌看見群眾就「動了慈心」的那個字根。雅各叫我們看的，不是約伯有多能撐，是「主給他的結局」：結局說明了主的心腸很大。一封五十幾個「要」和「不可」的信，最高的地方不是一條命令，是神的心。"],["p","然後雅各接了一句，好像換了話題：「你們說話，是，就說是；不是，就說不是，免得你們落在審判之下。」（5:12）這幾乎就是主耶穌在山上說的話：「你們的話，是，就說是；不是，就說不是」（太 5:37）。一個曾經和家人以為哥哥「癲狂了」（可 3:21）的弟弟，後來一輩子活在哥哥的話裡。被逼到牆角的人最容易發誓；可是審判的主就站在門口，你不必搬天地來作保，你的「是」就是「是」。至於法庭作證、婚禮誓詞，不在這一節禁止之內，講義的議題頁有交代。"],["d",["「主來的日子近了」，可是已經兩千年了，這句話還能當真嗎？","能當真，但不要拿來算日子。新約作者都說主來「近了」，不是因為他們算錯了時間，是因為十字架和復活之後，歷史已經進入最後一段，主隨時可以來。主耶穌自己說：「但那日子，那時辰，沒有人知道」（太 24:36）。雅各說「近了」，是為了叫人今天就不埋怨、今天就堅固自己的心，他接著說「審判的主站在門前了」（5:9）。所以「近」是一個關於今天怎麼活的字，不是一張末世時間表。凡是用 5:7–8 排年份、把秋雨春雨講成兩波聖靈澆灌時程的，都把這段話用歪了。像一個知道爸爸在回家路上的孩子，他不算公里數，他把房間收好。"]],["d",["我等一件事等了好多年，常常在禱告時哭，這是不是表示我沒有忍耐？","不是。雅各舉的忍耐榜樣是約伯，而約伯一點也不安靜：他咒詛自己的生日，和朋友爭辯，向神問了一連串的為甚麼。雅各還在 5:13 說「有受苦的呢，他就該禱告」，沒有說他就該微笑。ὑπομονή 的意思是「留在底下」，在重量底下沒有走開；你哭著禱告，正是留在神面前，沒有離開。忍耐的反面不是眼淚，是轉身走掉，或把等候變成對身邊的人嘆氣。你可以在小組裡請一兩位信得過的人陪你一起等，讓他們知道你在等甚麼，也讓他們為你禱告。至於結局，雅各說我們可以看「主給他的結局」，主是滿心憐憫的，你的眼淚他都記得。"]],["h","四、病床旁的油，門外的那一位"],["p","從田邊，雅各帶我們走進一間屋子。「你們中間有受苦的呢，他就該禱告；有喜樂的呢，他就該歌頌。」（5:13）人生大概就這兩種天氣，兩種天氣都可以向神開口。接著講到受苦的一種：「你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。」（5:14）這一節有三個很溫柔的細節：主動的是病人，他「請」；來的是長老們，複數，是一個團隊，不是一位明星；第三是那個油。"],["p","這裡的第四個原文字：ἀλείψαντες，「抹了油」，字根 ἀλείφω，是日常的塗抹、敷藥，不是膏立君王祭司的 χρίω。好撒馬利亞人「上前用油和酒倒在他的傷處」（路 10:34），用的就是這一類的油。而且在原文裡，主要動詞是「禱告」，抹油是伴隨的動作。歷代對這油有幾種讀法：聖事、醫藥、象徵、醫治恩賜、只屬使徒時代，都在基督教傳統之內，講義的議題頁並陳。今天我們只抓住大家都同意的一件事：油不是魔法，是「奉主的名」。"],["p","下一節常被讀成公式：「出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。」（5:15）請你看主詞。原文 ἐγερεῖ αὐτὸν ὁ κύριος，叫他起來的是主，不是信心的分數，也不是禱告的音量。所以病沒有好，絕不是因為病人的信心不夠。神能醫治，也常醫治；禱告和醫藥都是神的恩典，請長老來禱告，也請繼續看醫生、照醫囑用藥，兩樣並行，一點都不衝突。再看「他若犯了罪」，原文 κἂν，是「若」。病和罪不一定有關，常常沒有關。主耶穌說過：「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。所以在病床旁盤問「你是不是有甚麼罪沒有處理」，那不是雅各的意思，那是約伯的朋友的意思。"],["p","「所以你們要彼此認罪，互相代求，使你們可以得醫治。」（5:16）「彼此」原文 ἀλλήλοις，是互相，目的是代求，不是審判。所以有幾條線要守住：這件事是自願的，沒有人可以逼問你的隱私；是在可以信任的關係裡，不是在大群人面前輪流交代；是保密的，聽到的不轉述，不拿去當代禱事項傳出去。如果你是受傷害的那一位，你不必去向傷害你的人認罪求和好；涉及暴力、性侵或兒少受傷，第一件事是保護安全、依法處理。"],["p","然後雅各提到以利亞：「以利亞與我們是一樣性情的人」（5:17），他會怕、會累，曾經坐在羅騰樹下求死。這樣一個人，他禱告，「天就降下雨來，地也生出土產」（5:18）。你有沒有發現，我們又回到雨了。這卷書說「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的」（1:17），全卷最後一樣從上頭來的，是雨。人不能造雨，只能求，只能等。"],["p","最後是那兩節沒有問安的結尾。第五個原文字：ἐπιστρέψῃ τις αὐτόν，「有人使他回轉」（5:19）。τις 是「任何一個人」。前面 5:14 病人請的是長老，到了 5:19，去找人的沒有職稱。雅各沒有說「交給關懷部」，他說「有人」。那個半年沒有出聲的名字，不是在等教會某個部門，是在等一個人；那個人，可能就是此刻讀到這裡的你。去的時候，要帶著 3:13 說的「智慧的溫柔」，站在他旁邊，不坐審判官的位子。"],["d",["長老為我抹油禱告了，病還沒有好，我還需要繼續看醫生、吃藥嗎？","需要，而且一定要。5:15 說「主必叫他起來」，叫人起來的是主，他可以藉著禱告，也常常藉著醫生、藥物、手術和休息。雅各用的 ἀλείφω 本身就是當時敷藥塗抹的字，好撒馬利亞人用油和酒倒在傷處，就是醫治的手段。所以禱告與醫藥不是二選一，是兩隻手一起抓住神的恩典。千萬不要自己停藥，也不要因為還沒好就懷疑長老或自己的禱告。病沒有好，並不是你的信心出了問題；希伯來書第十一章的名單裡，有人蒙拯救，也有人忍受苦難，都是因著信。繼續回診，照醫囑用藥，也繼續請人為你禱告；兩樣都做，就是把病交在主手裡最穩的方式。"]],["d",["「彼此認罪」是要我在小組裡把自己的罪說出來嗎？我可以向誰說？","雅各說的是「彼此認罪，互相代求」（5:16），重點是互相、自願，目的是被代求，不是被審判。所以它不是小組輪流交代，也不是在大群人面前講。比較穩妥的做法是：找一兩位你信得過、成熟、會保密的同性弟兄姊妹或牧者，在私下的場合說；說到你願意的程度就好，不必交代每一個細節；聽的人只做一件事，就是為你禱告，並且不轉述。若你是聽的人，不要皺眉、不要說教、不要把它變成代禱事項傳出去。還有兩條界線：如果你是受傷害的人，不必去向傷害你的人認罪和好；若涉及暴力、性侵或兒少受傷，先保護安全，依法通報處理。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 5:15 說「病沒好，是你信心不夠」，這句話是錯的。5:15 說「主必叫他起來」，叫人起來的是主；希伯來書第十一章的名單裡，「又有人忍受嚴刑」（來 11:35），他們同樣是因著信。"],["p","第二個偏差，是把禱告抹油講成醫藥的替代品，暗示有信心就不必看醫生。這也是錯的，而且可能危及性命；ἀλείφω 本身就是敷藥那一類的字，禱告與醫藥都是神的恩典。"],["p","第三個偏差，是用 5:16 在小組或特會安排輪流交代、逼問隱私，或要求受害者向加害者認罪和好。「彼此」是互相、自願、保密；把人逼到台前的，不是雅各的教會。"],["p","第四個偏差，是講 5:1–6 只罵外面的財主，卻不照教會自己作為雇主；或反過來為欠薪找屬靈理由，叫被欠薪的人默默吞下去。5:4 的工錢有聲音，教會的薪資表也在這一節之下。"],["p","第五個偏差，是跳過 5:11，把 5:13–20 講成一張待辦清單：病了要請長老、犯罪要認、看見人走失要去。沒有先被憐憫找到的人，去找別人的時候多半帶著責備；用「你會沉淪」把人嚇回來，他多半走得更遠。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：「家醜不可外揚」和「病是不是報應」。我們的文化裡，生病常被悄悄地問「是不是做了甚麼」，家裡的難處又不肯讓人知道。結果病人一面受苦，一面藏著，不敢「請長老來」，怕被問原因。5:14–16 正好兩頭都破：病人可以主動請人來，而來的人不追問原因，只禱告；病與罪的關係是「若」，不是報應。"],["p","第二個問題：「不好意思打擾」。一個弟兄很久沒有來，我們心裡想到他，卻怕被說多管閒事，怕他覺得被盯上，就一直等他自己回來。雅各的最後一筆偏偏是「有人使他回轉」。華人很懂「人情」，也很懂「面子」；給一個走失的人一句「我想起你」，正是把面子留給他，把人情送到他門口。"],["h","七、活出321——先被憐憫，再出門"],["p","這一章把 321 放在全卷的末端，一句一句扣回經文。"],["p","耶穌是我的榜樣：5:10 叫我們把眾先知當作「能受苦能忍耐的榜樣」（5:10）；5:6 的義人「也不抵擋你們」（5:6），這使我們想起那位被定罪、被殺害、沒有抵擋的主。學他，是受委屈的時候不靠嘆氣和發誓保護自己。"],["p","聖經是我的準則：5:12 是主耶穌登山寶訓的回聲，5:4 背後是利未記的工價律例。準則落在說話的「是」和付錢的時間上。"],["p","聖靈是我的引導：等候的日子裡，叫你停下嘆氣、轉成禱告的，是那位住在我們裡面的靈；叫你在某個深夜忽然想起一個走失的名字的，也是他。"],["p","讓耶穌作王：審判的主「站在門前」（5:9），討公道的位子是他的，找病因的位子也是他的。讓他作王，是把審判交給門前那一位，把結局交給滿心憐憫的主。"],["p","讓耶穌得著一切的榮耀：「有喜樂的呢，他就該歌頌」（5:13）；病人起來了，榮耀歸給叫他起來的主，不歸給禱告的人。"],["p","建立屬神的體系：5:14–16 是體系的日常運作，複數的長老、保密的代求；這就是 235，誰也不必一個人扛。5:19–20 再往外走一步，就是 920：那個失迷真道的弟兄，是你的 2。而教會作為雇主準時足額地付工錢，是這個體系最先被外人看見的樣子。"],["h","八、四種心，在等候裡"],["p","驕傲型的心，聽 5:1–6 最容易看向別人：那些老闆、那些財團。請你先看自己手上那一筆該付還沒付的帳，再看自己在病床旁說過的那句「你是不是有甚麼沒處理」。"],["p","恐懼型的心，最怕等不到：病會不會好，工錢討不討得回來，孩子會不會回來。請你把眼睛從「我還撐得住嗎」移到「主給他的結局」；主是滿心憐憫的，結局在他手裡。"],["p","羞恥型的心，也許就是那個走失的人，或是那個病了很久、覺得自己拖累大家的人。雅各說病人可以「請」，走失的人有人會來找；你不是麻煩，你是有人要去找的那一位。"],["p","受傷型的心，也許曾被人在病床旁追問罪，或曾被要求向傷害你的人認罪。那不是雅各的話。你可以只說「請為我禱告」，不必交代細節；若這份傷讓你睡不著、吃不下，請讓信得過的人陪你去找專業的協助。"],["d",["家人已經在安寧病房，為他禱告的時候，除了求醫治，還可以求甚麼？","可以求的很多，而且都是有信心的禱告。5:15 說的「救」和「主必叫他起來」，範圍比病床上的痊癒更大：可以求主減輕痛苦，讓他睡得安穩；求主讓他與家人說出想說的話，彼此和好；求主讓他心裡平安，不怕；若他還沒有信主，求主在這段日子親近他；最後，求主讓他安然見主。對信主的人來說，最後的「叫他起來」是復活的早晨。所以不要讓任何人說，你沒有只求完全醫治就是沒有信心。也請你照顧自己：輪班、吃飯、讓弟兄姊妹來陪。陪伴臨終的人，本身就是 5:14 長老們做的事，是一群人一起去，不是一個人扛。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 5:7–11 一次，讀到「滿心憐憫，大有慈悲」時停下來，說出今天最等不下去的一件事，禱告：主啊，結局在你手裡，求你堅固我的心。"],["p","第二，留意自己嘆氣的時刻，每嘆一口氣，就把它換成一句禱告；檢查一句你說過的「好」「我會到」，讓你的「是」就是「是」。"],["p","第三，探訪或打電話給一位病人或照顧者，只問「這週我可以為你禱告甚麼」，不問「你為甚麼會生病」，並且提醒他照醫囑用藥。"],["p","第四，若你是雇主、主管或經手付款的人，這週把薪資、外包、清潔與鐘點的帳查一次，準時足額付清；若你被拖欠工錢，找一位可信任的人陪你查詢申訴管道。"],["p","第五，找出一個很久沒有出聲的名字，先為他禱告三天，然後傳一句：最近想起你，我在為你禱告。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：主是滿心憐憫，大有慈悲；我等候的結局在他手裡，他要堅固我的心。"],["p","我宣告：叫人起來的是主；我為病人禱告，也尊重醫生和藥物，不追問病人的罪。"],["p","我宣告：我付該付的工錢，說可信的「是」，不讓銹在我的手上長出來。"],["p","我宣告：我不等別人先去；那個走失的弟兄，是我的 2，我要站到他旁邊，陪他走回來。"],["d",["我想聯絡一位很久沒來的弟兄，可是上次是我說話得罪了他，第一句話該怎麼說？","那就讓第一句話從你自己開始。5:16 說「彼此認罪」，你不必等他先回來，也不必先講教會多想念他；可以簡單地說：「上次我說的那句話傷了你，我一直記得，對不起。最近常想起你，我在為你禱告。」說完就停，不要接著勸他回來聚會，也不要解釋當時你為甚麼那樣說。給他時間回應，他不回也沒關係，過一兩週再傳一句問候。使人回轉的方法，是當面、私下、溫柔，位子是弟兄，不是法官。你先低頭，常常就是那條回家的路重新打開的第一步。若他願意見面，選一個他方便的地方，只是吃頓飯、聽他說，就夠了。"]],["h","十、結語"],["p","我們回到開頭那封沒有結尾問安的信。現在我們知道，雅各不是忘了祝福，他把祝福放在了中間。請你照他的次序再走一次。先是主的憐憫：「明顯主是滿心憐憫，大有慈悲。」（5:11）再是我們的禱告：「義人祈禱所發的力量是大有功效的。」（5:16）最後才是出門：「叫一個罪人從迷路上轉回便是救一個靈魂不死」（5:20）。先被憐憫，再禱告，然後出去。一個沒有先被主的憐憫找到的人，去找別人時多半帶著責備；一個被找回來過的人，才知道回家的路怎麼走。寫這封信的雅各，就是被找回來過的：他曾經不信，是復活的主親自向他顯現，把他找了回來。"],["p","這一課的焦點，不在雅各有多嚴厲，也不在我們找回了幾個人，而在那位滿心憐憫的主：他聽見了被扣住的工錢，站在病床旁叫人起來，也親自走過最長的一段路，被定罪、被殺害，沒有抵擋，第三天神叫他起來。全卷的鏡子照到最後，照出的是他的心腸。所以我們可以忍耐，可以禱告，可以出門找人。"],["p","我們一起低頭禱告。天父，謝謝你是滿心憐憫、大有慈悲的主。求你聽見每一份被扣住的工錢，也叫我們這些付錢的人準時、足額、有尊嚴地付。求你親自站在每一張病床旁，叫病人起來，賜醫生智慧，賜家屬平安，也讓臨終的人安然見你。求你使我們成為可以彼此代求、彼此保密的弟兄姊妹。現在我們心裡浮出的那一個名字，求你預備他的心，也差我們這一週出門去找他。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這是雅各書的最後一課，這一個鐘頭不比誰最能撐，是讓每一個人說出自己正在等的那一件事，也說出這一週要去找的那一個名字；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是銹、雨、回，也是全卷最後一課。席上可能有久病、照顧臨終家人、被欠薪的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出：工錢有聲音、教會自己也在 5:4 之下；叫人起來的是主；第五章的次序是先憐憫、再禱告、後出門。"],["n","1. ★ 你收過最難忘的一封信或一張卡片是誰寫的？最後一句寫了甚麼，為甚麼你記到今天？"],["n","2. ★★★ 雅各把「主是滿心憐憫」放在 5:11，把「去找走失的人」放在 5:20。用自己的話說：這個次序如果倒過來，會變成甚麼樣的信仰？"],["n","3. ★★ 5:15 說「主必叫他起來」。請說出這句話的主詞，再說一說：它怎樣保護一位禱告了很久、病還沒有好的弟兄姊妹？"],["n","4. ★★ 5:4 說工錢有聲音。我們的教會作為雇主，有哪些人的工錢也在這一節之下？請說出至少三種同工或外包的人。"],["m","帶領提醒：讀 5:13–16 時，請一字一字讀出「主必叫他起來」和「他若犯了罪」，不要讓任何人把病和罪畫上等號。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己在等候裡的心是被堅固，還是越來越會嘆氣，並把眼睛轉到滿心憐憫的主。"],["t","【看】看見自己"],["n","5. ★★★ 這一週你最常在哪裡嘆氣：家裡、車上、公司，還是群組？說出最近一次，是哪一天、對著誰、為了甚麼事。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 5:11 兩遍，第二遍讀完，說出一個打動你的詞，再說一句：神今天藉這個詞對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你很難把眼睛從「我還撐不撐得住」移到「主給的結局」，卡在哪裡：等太久了、怕結局不好、覺得自己拖累別人，還是被人追問過原因？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對右手邊的人說：「這一週我可以為你禱告甚麼？」對方只說一件事，可以只說「請為我禱告」，不必交代原因；問的人當場為他禱告一句。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要把嘆氣換成禱告的一步：哪一天、哪一個時段、讀哪一節經文、要對主說的第一句話是甚麼。"],["m","帶領提醒：這一化可能碰到久病、照顧臨終家人、喪親、被欠薪、長期無望感的人。不追問病因或罪的細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」；提醒繼續就醫、照醫囑用藥；被欠薪的人不要勸他默默忍受。任何人只說「請為我禱告」就夠了，聽到的不轉述。會後單獨關心；必要時協助尋求專業協助或申訴管道。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：探望一位病人、查一筆該付的帳、出門去找一位走失的人。"],["n","10. ★★ 說出一位正在生病或照顧病人的弟兄姊妹，這一週哪一天、用電話還是探訪，你要問他的第一句話是甚麼。"],["n","11. ★ 若你是雇主、主管或經手付款的人，說出這一週哪一天你要查哪一筆帳；若不是，說出一句你說過的「好」，這一週要怎樣兌現。"],["n","12. ★★ 說出一件你一直在等的事，這一週哪一天，你要請小組裡哪一位信得過的人為你禱告。"],["n","13. ★★★ 這是本課的 920 操練：找出那一位走失的「2」，一位以前常來、現在很久沒有出現的弟兄姊妹。當場說出他的名字，說出這一週哪一天、用甚麼方式聯絡他，第一句話是甚麼。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，聖經裡有一封信，最後一句不是祝福，是叫人去找一個走丟的人。第二句，因為神是滿心憐憫的，連被扣住的工錢、病床上的人，他都看見。第三句，所以我今天來找你，只是想跟你說，我想起你，也在為你禱告。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心」這類答案；探訪病人不問病因、不勸停藥；談到欠薪，陪伴與依法申訴優先，不勸人默默忍受。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要為誰禱告，要去找的那一個人是誰。可以只說關係。"],["p","然後彼此代禱：為一位久病或臨終的人和他的家屬，求主減輕痛苦、賜平安；為一位被欠薪或在異鄉做工的人，求主聽見他的冤聲；為那一位走失的弟兄姊妹，求主讓他這週收到一句溫柔的問候。"],["p","雅各書到這裡讀完了。散會以前，確認紙上寫了三樣：5:11 那一句、要探望的那一位、你的那個「2」。下次聚會，我們從他們的消息開始。"]]}}}</script>
